name: Auto bump version.json

# 저장소 맨 위의 앱 폴더 안 index.html 이 바뀌면 (예: Jennyrun/index.html),
# 그 폴더에 version.json 이 있을 때만 맨 뒤 숫자를 +1 합니다. (1.2.213 → 1.2.214)
# 새 앱도 폴더 안에 version.json 만 만들어 두면 자동으로 대상이 됩니다.

on:
  push:
    branches: [main]
    paths:
      - '*/index.html'

permissions:
  contents: write
  pages: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version.json of changed apps
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          cat > /tmp/bump.py <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          def bump(m):
              parts = m.group(2).split('.')
              parts[-1] = str(int(parts[-1]) + 1)
              return m.group(1) + '.'.join(parts) + m.group(3)
          new, n = re.subn(r'("version"\s*:\s*")(\d+(?:\.\d+)*)(")', bump, s, count=1)
          if n != 1:
              raise SystemExit(1)
          open(p, 'w', encoding='utf-8').write(new)
          print(re.search(r'"version"\s*:\s*"([^"]+)"', new).group(1))
          PY

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$SHA~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA")

          SUMMARY=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir=$(dirname "$f")
            v="$dir/version.json"
            if [ ! -f "$v" ]; then
              echo "건너뜀: $dir (version.json 없음)"
              continue
            fi
            if echo "$CHANGED" | grep -qxF "$v"; then
              echo "건너뜀: $dir (이번 푸시에서 version.json 을 직접 고침)"
              continue
            fi
            if NEW=$(python3 /tmp/bump.py "$v"); then
              echo "올림: $dir → $NEW"
              git add "$v"
              SUMMARY="$SUMMARY $dir $NEW,"
            else
              echo "::warning::$v 에서 \"version\": \"1.2.3\" 형식을 찾지 못해 건너뜀"
            fi
          done < <(echo "$CHANGED" | grep -E '^[^/]+/index\.html$' || true)

          if git diff --cached --quiet; then
            echo "올릴 버전이 없어요"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bump version:${SUMMARY%,}"
          git pull --rebase
          git push
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # 봇이 푸시한 커밋으로 Pages 재배포가 안 걸리는 경우를 대비한 안전장치
      - name: Request Pages build
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
