# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) Build: prepare files and upload them as the Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject build timestamp
        run: |
          BUILD_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          sed -i "s/__BUILD_TIME__/$BUILD_TIME/g" Jennyrun/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Keep @v3 here: it includes dotfiles (.well-known, .nojekyll).
      # v4+ drops them unless include-hidden-files is set.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 2) Deploy: runs as a separate job, so the artifact is visible by the time it starts
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # If the first try fails (e.g. artifact not visible yet), wait and try once more
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
