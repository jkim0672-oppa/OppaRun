<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제니의 분석 추출기 v3.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #007AFF; --stop: #FF3B30; --bg: #F2F2F7; --card: #FFFFFF; --btn-gray: #E5E5EA; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        h2 { text-align:center; margin: 0 0 10px 0; font-size: 20px; }
        video { width: 100%; border-radius: 12px; background: #000; max-height: 250px; margin-bottom: 10px; }
        .video-controls { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .step-btn { background: var(--btn-gray); border: none; padding: 10px 5px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--primary); flex: 1; cursor: pointer; }
        .speed-bar { margin-bottom: 10px; padding: 5px; background: #F9F9FB; border-radius: 10px; font-size: 12px; text-align:center; border: 1px solid #E5E5EA; }
        .setting-card { background: #F9F9FB; padding: 10px; border-radius: 14px; border: 1px solid #E5E5EA; margin-bottom: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .input-group { display: flex; align-items: center; gap: 3px; }
        input[type="number"] { width: 65px; padding: 5px; border: 1px solid #D1D1D6; border-radius: 8px; text-align: center; }
        .set-btn { background: #48484A; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; }
        .btn-group { display: flex; gap: 8px; }
        .main-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 15px; font-weight: 700; }
        .stop-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; background: var(--stop); color: white; font-size: 15px; font-weight: 700; display: none; }
        #status { text-align:center; font-size: 12px; color:#d63384; margin: 8px 0; min-height: 14px; font-weight: bold; }
        #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
        .thumb-box { position: relative; aspect-ratio: 1/1; overflow: hidden; border-radius: 6px; border: 1px solid #ddd; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        #lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:100; flex-direction:column; justify-content:center; align-items:center; }
        #lightbox img { max-width: 95%; max-height: 75%; border-radius: 8px; object-fit: contain; }
        .lb-nav { position: absolute; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .lb-btn { pointer-events: auto; background: rgba(255,255,255,0.3); color: white; border: none; width: 50px; height: 50px; border-radius: 25px; font-size: 24px; }
        .lb-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; padding: 10px; }
        .selection-bar, .save-controls { display: none; gap: 8px; margin-top: 10px; }
        .save-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; color: white; font-size: 12px; font-weight: 600; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 분석 추출기 v3.4</h2>
    <input type="file" id="upload" accept="video/*" style="margin-bottom:10px; font-size:11px; width: 100%;">
    <video id="main-video" controls playsinline></video>

    <div class="video-controls">
        <button class="step-btn" onclick="step(-0.5)">◀ 0.5s</button>
        <button class="step-btn" onclick="step(-0.1)">◁ 0.1s</button>
        <button class="step-btn" onclick="step(0.1)">0.1s ▷</button>
        <button class="step-btn" onclick="step(0.5)">0.5s ▶</button>
    </div>

    <div class="speed-bar">
        속도: <select id="playbackSpeed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1.0" selected>1.0x</option><option value="2.0">2.0x</option></select>
    </div>

    <div class="setting-card">
        <div class="row"><span>시작</span><div class="input-group"><input type="number" id="startTime" value="0.00" step="0.01">s<button class="set-btn" onclick="setPoint('start')">현재</button></div></div>
        <div class="row"><span>종료</span><div class="input-group"><input type="number" id="endTime" value="0.00" step="0.01">s<button class="set-btn" onclick="setPoint('end')">현재</button></div></div>
        <div class="row"><span>간격</span><div class="input-group"><input type="number" id="interval" value="0.05" step="0.01">s</div></div>
    </div>

    <div class="btn-group">
        <button id="start-bulk" class="main-btn">추출 시작</button>
        <button id="stop-bulk" class="stop-btn">정지</button>
    </div>

    <div id="status"></div>

    <div class="selection-bar" id="selectionBar">
        <button onclick="toggleAll()" style="font-size:11px; flex:1;">전체 선택/해제</button>
        <button onclick="deleteAll()" style="font-size:11px; color:var(--stop);">전체 삭제</button>
    </div>

    <div class="save-controls" id="saveArea">
        <button class="save-btn" style="background:#34C759;" onclick="saveImages(true)">전체 저장</button>
        <button class="save-btn" style="background:#5856D6;" onclick="saveImages(false)">선택 저장</button>
    </div>
    
    <div id="gallery"></div>
</div>

<div id="lightbox">
    <div class="lb-close" onclick="closeLB()">✕</div>
    <img id="lb-img">
    <div id="lb-info" style="color:white; margin-top:15px; font-size:14px; font-weight:bold;"></div>
    <div class="lb-nav">
        <button class="lb-btn" onclick="changeLB(-1)">◀</button>
        <button class="lb-btn" onclick="changeLB(1)">▶</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('main-video');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('start-bulk');
    const stopBtn = document.getElementById('stop-bulk');
    const selectionBar = document.getElementById('selectionBar');
    const saveArea = document.getElementById('saveArea');
    let frames = [];
    let isStopping = false;
    let currentIdx = 0;

    document.getElementById('upload').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = () => { document.getElementById('endTime').value = video.duration.toFixed(2); };
    };

    // v3.4: 가장 안정적인 시간 이동 로직으로 롤백 및 보완
    function step(s) { 
        if(!video || !video.src) return;
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + s));
    }

    function setPoint(t) { if(video.src) document.getElementById(t+'Time').value = video.currentTime.toFixed(2); }
    
    startBtn.onclick = async () => {
        if(!video.src) return;
        const start = parseFloat(document.getElementById('startTime').value) || 0;
        const end = parseFloat(document.getElementById('endTime').value) || video.duration;
        const interval = parseFloat(document.getElementById('interval').value) || 0.05;

        frames = []; gallery.innerHTML = ""; isStopping = false;
        startBtn.style.display = 'none'; stopBtn.style.display = 'block';
        saveArea.style.display = 'none'; selectionBar.style.display = 'none';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;

        let cur = start;
        while(cur <= (end + 0.001) && !isStopping) {
            video.currentTime = cur;
            await new Promise(r => { 
                const onSeeked = () => { video.removeEventListener('seeked', onSeeked); r(); };
                video.addEventListener('seeked', onSeeked);
            });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const data = canvas.toDataURL('image/jpeg', 0.8);
            frames.push({ url: data, time: cur.toFixed(2) });
            
            const box = document.createElement('div');
            box.className = 'thumb-box';
            box.innerHTML = `<input type="checkbox" class="chk-box" style="position:absolute;top:5px;left:5px;z-index:2;"><img src="${data}" onclick="openLB(${frames.length-1})">`;
            gallery.appendChild(box);
            
            status.innerText = `추출 중: ${cur.toFixed(2)}s`;
            cur = Math.round((cur + interval) * 100) / 100;
        }
        startBtn.style.display = 'block'; stopBtn.style.display = 'none';
        if(frames.length > 0) { saveArea.style.display = 'flex'; selectionBar.style.display = 'flex'; }
        status.innerText = isStopping ? "정지됨" : "✅ 분석 완료!";
    };

    stopBtn.onclick = () => { isStopping = true; };
    function openLB(idx) { 
        currentIdx = idx;
        document.getElementById('lb-img').src = frames[idx].url; 
        document.getElementById('lb-info').innerText = `${frames[idx].time}s (${idx + 1}/${frames.length})`;
        document.getElementById('lightbox').style.display = 'flex'; 
    }
    function closeLB() { document.getElementById('lightbox').style.display = 'none'; }
    function changeLB(dir) { 
        if(!frames.length) return;
        currentIdx = (currentIdx + dir + frames.length) % frames.length; 
        openLB(currentIdx); 
    }
    function toggleAll() { const checks = document.querySelectorAll('.chk-box'); const allOn = Array.from(checks).every(c => c.checked); checks.forEach(c => c.checked = !allOn); }
    function deleteAll() { if(confirm("삭제할까요?")) { frames = []; gallery.innerHTML = ""; saveArea.style.display = 'none'; selectionBar.style.display = 'none'; status.innerText = ""; } }

    async function saveImages(isAll) {
        const zip = new JSZip();
        const checks = document.querySelectorAll('.chk-box');
        let count = 0;
        frames.forEach((f, i) => { if(isAll || (checks[i] && checks[i].checked)) { zip.file(`${String(i+1).padStart(4,'0')}_${f.time}s.jpg`, f.url.split(',')[1], {base64: true}); count++; }});
        if(!count) return alert("저장할 항목이 없습니다.");
        const blob = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `analysis_v34_${Date.now()}.zip`;
        link.click();
    }
</script>
</body>
</html>
