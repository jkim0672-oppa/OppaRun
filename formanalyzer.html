<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO ANALYSIS v5.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기본 스타일 유지 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 헤더 스타일 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #adff2f; /* 네온 그린 */
        }

        .mode-container {
            display: flex;
            background-color: #1e1e1e;
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background: none;
            color: #888888;
        }

        .mode-btn.active {
            background-color: #adff2f;
            color: #000000;
        }

        /* 비디오 영역 (플레이스홀더) */
        .video-container {
            width: 100%;
            aspect-ratio: 9 / 10;
            background-color: #000000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .time-display {
            position: absolute;
            bottom: 16px;
            right: 16px;
            font-size: 16px;
            font-weight: bold;
            color: #adff2f;
        }

        /* 탐색 바 */
        .slider-container {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .seek-slider {
            width: 100%;
            -webkit-appearance: none;
            background: #333333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1e90ff;
            cursor: pointer;
        }

        /* 컨트롤 패널 박스 */
        .control-panel {
            background-color: #111111;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 버튼 행 공통 */
        .btn-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn-row > * {
            flex: 1;
        }

        /* 기본 버튼 스타일 */
        button {
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-sizing: border-box;
        }

        /* 프레임 이동 버튼 */
        .btn-frame {
            background-color: #222222;
            height: 40px;
            font-size: 13px;
        }

        /* 상태 설정 버튼 (Contact, Takeoff) */
        .btn-status {
            height: 44px;
            font-size: 15px;
            background: transparent;
        }

        #btn-contact {
            border: 2px solid #1e90ff;
        }

        #btn-takeoff {
            border: 2px solid #adff2f;
        }

        /* 기능 버튼 색상 클래스 (크기 및 고유 색상 유지) */
        .bg-green { background-color: #00b074; height: 44px; }
        .bg-orange { background-color: #f39c12; height: 44px; }
        .bg-purple { background-color: #6c5ce7; height: 44px; }
        .bg-grey { background-color: #57606f; height: 44px; }
        .bg-blue { background-color: #1e90ff; height: 44px; }
        .bg-light-purple { background-color: #a29bfe; color: #ffffff; height: 44px; }

        /* 스피드 및 구간 선택 박스 */
        .value-box {
            background-color: #222222;
            border-radius: 12px;
            height: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .value-box .label {
            font-size: 9px;
            color: #888888;
            font-weight: bold;
            text-transform: uppercase;
        }

        .value-box .val {
            font-size: 13px;
            font-weight: bold;
        }

        .value-box.speed-box {
            color: #adff2f;
        }

        /* 데이터 그리드 (하단 계측 정보) */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1x);
            gap: 8px;
        }

        .data-card {
            background-color: #111111;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 76px;
            box-sizing: border-box;
            border-left: 3px solid transparent;
        }

        .card-green { border-left-color: #adff2f; }
        .card-blue { border-left-color: #1e90ff; }

        .card-title {
            font-size: 11px;
            color: #888888;
        }

        .card-value {
            font-size: 15px;
            font-weight: bold;
            margin: 2px 0;
        }

        .card-green .card-value { color: #ffffff; }
        .card-blue .card-value { color: #1e90ff; }

        .card-target {
            font-size: 11px;
            color: #f39c12;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="title">PRO ANALYSIS v5.5</div>
        <div class="mode-container">
            <button class="mode-btn active">Manual</button>
            <button class="mode-btn">Auto AI</button>
            <button class="mode-btn">Solution AI</button>
        </div>
    </div>

    <div class="video-container">
        <div class="time-display">0.00s</div>
    </div>

    <div class="slider-container">
        <input type="range" class="seek-slider" min="0" max="100" value="50">
    </div>

    <div class="control-panel">
        
        <div class="btn-row">
            <button class="btn-frame"><i class="fa-solid to-left"></i> ◀ -0.03s</button>
            <button class="btn-frame">◀ -0.01s</button>
            <button class="btn-frame">0.01s ▶</button>
            <button class="btn-frame">0.03s ▶ <i class="fa-solid to-right"></i></button>
        </div>

        <div class="btn-row">
            <button id="btn-contact" class="btn-status">Contact</button>
            <button id="btn-takeoff" class="btn-status">Takeoff</button>
        </div>

        <div class="btn-row">
            <button id="btn-play" class="bg-green">▶ 재생</button>
            <div id="box-speed" class="value-box speed-box">
                <span class="val">1.0x</span>
            </div>
            <button id="btn-open" class="bg-orange"><i class="fa-solid fa-folder-open"></i> 비디오 열기</button>
        </div>

        <div class="btn-row">
            <button id="btn-reset-all" class="bg-grey">Reset All</button>
            <button id="btn-reset-loop" class="bg-blue">Reset Loop</button>
            <button id="btn-settings" class="bg-purple">Settings</button>
        </div>

        <div class="btn-row">
            <div class="value-box">
                <span class="label">START</span>
                <span class="val">0.00</span>
            </div>
            <div class="value-box">
                <span class="label">END</span>
                <span class="val">0.00</span>
            </div>
            <button id="btn-report" class="bg-light-purple"><i class="fa-solid fa-chart-bar"></i> Report</button>
        </div>

    </div>

    <div class="data-grid">
        <div class="data-card card-green">
            <span class="card-title">무릎 각도</span>
            <span class="card-value">-- °</span>
            <span class="card-target">160-170°</span>
        </div>
        <div class="data-card card-green">
            <span class="card-title">팔꿈치 각도</span>
            <span class="card-value">-- °</span>
            <span class="card-target">80-90°</span>
        </div>
        <div class="data-card card-green">
            <span class="card-title">상체 기울기</span>
            <span class="card-value">-- °</span>
            <span class="card-target">5-10°</span>
        </div>
        <div class="data-card card-blue">
            <span class="card-title">GCT</span>
            <span class="card-value">0ms</span>
            <span class="card-target">180-220ms</span>
        </div>
        <div class="data-card card-blue">
            <span class="card-title">Flight</span>
            <span class="card-value">0ms</span>
            <span class="card-target">70-100ms</span>
        </div>
        <div class="data-card card-blue">
            <span class="card-title">보폭 거리</span>
            <span class="card-value">0.00m</span>
            <span class="card-target">1.0-1.4m</span>
        </div>
    </div>

</div>

</body>
</html>
