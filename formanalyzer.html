<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RunForm Analyzer Pro</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 420px; }
        
        h2 { color: #38bdf8; font-size: 1.1rem; margin: 10px 0; text-align: center; letter-spacing: 1px; }
        video { width: 100%; aspect-ratio: 16/9; border: 1px solid #334155; border-radius: 12px; background: #000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        .panel { background: #1e293b; padding: 15px; border-radius: 16px; margin-top: 10px; border: 1px solid #334155; }
        
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.1s; }
        button:active { transform: translateY(2px); opacity: 0.8; }

        /* Navigation Controls - 오빠 원본 레이아웃 100% 보존 */
        .seek-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .btn-seek { background: #334155; color: #f1f5f9; padding: 12px 0; font-size: 13px; }
        .btn-precise { background: #f59e0b; color: #0f172a; padding: 12px 0; font-size: 14px; }

        /* Measurement Controls - 3버튼 타입 체제 유지 */
        .measure-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .btn-touch { background: #ef4444; color: white; padding: 18px 0; font-size: 13px; }
        .btn-off { background: #10b981; color: white; padding: 18px 0; font-size: 13px; }
        .btn-next { background: #a855f7; color: white; padding: 18px 0; font-size: 13px; }

        /* Display Box */
        .result-box { background: #020617; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #38bdf8; }
        .status-text { font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
        .gct-value { font-size: 26px; font-weight: 800; color: #38bdf8; }

        .btn-save { width: 100%; background: #38bdf8; color: #0f172a; padding: 14px 0; font-size: 15px; margin-top: 10px; }

        /* Analysis Log - FT(비행시간) 컬럼 추가 */
        .log-container { margin-top: 15px; max-height: 160px; overflow-y: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; }
        th { color: #38bdf8; position: sticky; top: 0; background: #0f172a; font-size: 11px; text-transform: uppercase; }
        .del-btn { color: #f87171; background: none; font-size: 16px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>RUNFORM ANALYZER PRO</h2>
    
    <input type="file" id="videoUpload" accept="video/*" style="font-size: 11px; margin-bottom: 10px; width: 100%; color: #94a3b8;">
    <video id="runnerVideo" playsinline></video>

    <div class="panel">
        <div class="seek-group">
            <button class="btn-seek" onclick="seek(-0.1)">-0.1s</button>
            <button class="btn-precise" onclick="seek(-0.01)">-0.01s</button>
            <button class="btn-precise" onclick="seek(0.01)">+0.01s</button>
            <button class="btn-seek" onclick="seek(0.1)">+0.1s</button>
            <button class="btn-seek" onclick="seek(-1)">-1s</button>
            <button class="btn-seek" onclick="seek(1)">+1s</button>
        </div>

        <div class="measure-group">
            <button class="btn-touch" onclick="setPoint('touch')">🐾 TOUCH</button>
            <button class="btn-off" onclick="setPoint('off')">🚀 TAKE-OFF</button>
            <button class="btn-next" onclick="setPoint('next')">✨ NEXT TCH</button>
        </div>

        <div class="result-box">
            <div id="status" class="status-text">Select a video to start</div>
            <div id="gctResult" class="gct-value">GCT: 0 ms</div>
        </div>
        
        <button class="btn-save" onclick="addLog()">SAVE TO ANALYSIS LOG</button>
    </div>

    <div class="log-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th>Step</th>
                    <th>GCT(ms)</th>
                    <th>FT(ms)</th>
                    <th>Interval(s)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const video = document.getElementById('runnerVideo');
    const status = document.getElementById('status');
    const gctDisplay = document.getElementById('gctResult');
    const logTable = document.querySelector('#logTable tbody');
    
    let touchTime = 0;
    let offTime = 0;
    let nextTouchTime = 0;
    let logCount = 0;

    document.getElementById('videoUpload').onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            status.innerText = "READY FOR ANALYSIS";
        }
    };

    function seek(amount) {
        if (!video.src) return;
        video.currentTime += amount;
        status.innerText = `TIME: ${video.currentTime.toFixed(3)}s`;
    }

    function setPoint(type) {
        if (!video.src) return;
        if (type === 'touch') {
            touchTime = video.currentTime;
            status.innerText = `🐾 TOUCH AT: ${touchTime.toFixed(3)}s`;
        } else if (type === 'off') {
            offTime = video.currentTime;
            status.innerText = `🚀 TAKE-OFF AT: ${offTime.toFixed(3)}s`;
            calculateGCT();
        } else if (type === 'next') {
            nextTouchTime = video.currentTime;
            status.innerText = `✨ NEXT TOUCH AT: ${nextTouchTime.toFixed(3)}s`;
        }
    }

    function calculateGCT() {
        if (touchTime > 0 && offTime > touchTime) {
            const gct = (offTime - touchTime) * 1000;
            gctDisplay.innerText = `GCT: ${gct.toFixed(0)} ms`;
        }
    }

    function addLog() {
        if (touchTime === 0 || offTime === 0 || offTime <= touchTime) {
            status.innerText = "⚠️ SET BOTH TOUCH & TAKE-OFF FIRST!";
            return;
        }
        
        const gct = (offTime - touchTime) * 1000;
        const ft = (nextTouchTime > offTime) ? (nextTouchTime - offTime) * 1000 : 0;
        const ftText = ft > 0 ? `${ft.toFixed(0)} ms` : '-';
        const endInterval = nextTouchTime > offTime ? nextTouchTime : offTime;
        
        logCount++;
        const row = `<tr>
            <td>#${logCount}</td>
            <td style="font-weight:bold; color:#38bdf8;">${gct.toFixed(0)} ms</td>
            <td style="font-weight:bold; color:#a855f7;">${ftText}</td>
            <td style="color:#64748b;">${touchTime.toFixed(2)}~${endInterval.toFixed(2)}</td>
            <td><button class="del-btn" onclick="this.parentElement.parentElement.remove()">×</button></td>
        </tr>`;
        
        logTable.insertAdjacentHTML('afterbegin', row);
        
        // 데이터 정밀 리셋
        touchTime = 0; 
        offTime = 0;
        nextTouchTime = 0;
        status.innerText = "SAVED! FIND NEXT STEP";
    }
</script>

</body>
</html>
