<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Analysis v3.0 - Frame Control Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <style>
        :root { --neon: #deff9a; --blue: #007AFF; --bg: #0A0A0C; --card: #1C1C1E; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        .video-box { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; margin-bottom: 10px; }
        video { width: 100%; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        .control-panel { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid #333; width: 100%; max-width: 600px; box-sizing: border-box; }
        
        .play-ctrl-row { display: block; margin-bottom: 12px; width: 100%; }
        .btn-play { background: #2C2C2E; color: white; border: 1px solid #444; font-size: 13px; font-weight: bold; height: 41px; line-height: 39px; box-sizing: border-box; width: 100%; text-align: center; border-radius: 8px; cursor: pointer; }

        .time-input-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .input-group { flex: 1; min-width: 75px; display: flex; flex-direction: column; gap: 4px; position: relative; box-sizing: border-box; }
        .input-group span { font-size: 11px; color: #aaa; }
        input[type="number"] { background: #2C2C2E; color: white; border: 1px solid #444; padding: 0 5px; border-radius: 8px; font-size: 13px; width: 100%; box-sizing: border-box; height: 41px; text-align: center; line-height: 41px; }

        .custom-dropdown { position: relative; width: 100%; height: 41px; box-sizing: border-box; }
        .dropdown-selected { background: #2C2C2E; color: var(--neon); border: 1px solid #444; padding: 0 5px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; line-height: 39px; cursor: pointer; box-sizing: border-box; height: 100%; }
        .dropdown-selected::after { content: ' ▼'; font-size: 9px; color: #888; }
        .dropdown-options { display: none; position: absolute; top: 45px; left: 0; width: 100%; background: #1C1C1E; border: 1px solid #444; border-radius: 8px; z-index: 150; box-shadow: 0 4px 15px rgba(0,0,0,0.6); max-height: 200px; overflow-y: auto; box-sizing: border-box; }
        .dropdown-option { padding: 11px; font-size: 13px; text-align: center; color: white; cursor: pointer; border-bottom: 1px solid #2C2C2E; font-weight: bold; }
        .dropdown-option:last-child { border-bottom: none; }
        .dropdown-option:hover, .dropdown-option.active { background: #2C2C2E; color: var(--neon); }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        button, .file-lbl { border-radius: 8px; border: none; height: 41px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; color: white; display: flex; align-items: center; justify-content: center; box-sizing: border-box; margin: 0; width: 100%; }
        .btn-main { background: var(--blue); width: 100%; margin-bottom: 8px; font-size: 14px; height: 48px; }
        .btn-manual { background: #FF9500; color: white; width: 100%; margin-bottom: 8px; font-size: 14px; height: 48px; }
        .btn-ai { background: #30D158; color: white; width: 100%; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        .btn-reset { background: #FF453A; }
        .file-lbl { background: #3A3A3C; cursor: pointer; line-height: 41px; }
        
        .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .res-card { background: #2C2C2E; padding: 10px; border-radius: 8px; border-left: 3px solid var(--neon); text-align: center; box-sizing: border-box; }
        .res-label { font-size: 10px; color: #888; display: block; margin-bottom: 3px; }
        .res-val { font-size: 16px; font-weight: bold; color: var(--neon); }
        .ref-text { color: #FF9500; font-size: 9px; display: block; margin-top: 4px; }

        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; width: 100%; max-width: 600px; margin-top: 15px; }
        .thumb { aspect-ratio: 1/1; border-radius: 6px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        input[type="file"] { display: none; }

        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; cursor: pointer; }
        .modal img { max-width: 95%; max-height: 85%; border-radius: 8px; border: 1px solid #444; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <h3 style="color: var(--neon); margin: 5px 0;">PRO ANALYSIS <span style="font-weight: 200;">v3.0</span></h3>

    <div class="video-box">
        <video id="video" playsinline muted style="pointer-events: none;"></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="control-panel">
        <div class="play-ctrl-row">
            <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶ Play</button>
        </div>

        <div class="time-input-row">
            <div class="input-group" style="flex: 0.9;">
                <span>Start (s)</span>
                <input type="number" id="inStart" value="0.0000" step="0.1">
            </div>
            <div class="input-group" style="flex: 0.9;">
                <span>End (s)</span>
                <input type="number" id="inEnd" value="0.0000" step="0.1">
            </div>
            <div class="input-group" style="flex: 1.2;">
                <span>Speed</span>
                <div class="custom-dropdown">
                    <div class="dropdown-selected" id="dropdownSelected" onclick="toggleDropdown()">1.0x (Normal)</div>
                    <div class="dropdown-options" id="dropdownOptions">
                        <div class="dropdown-option" data-value="0.01">0.01x</div>
                        <div class="dropdown-option" data-value="0.03">0.03x</div>
                        <div class="dropdown-option" data-value="0.05">0.05x</div>
                        <div class="dropdown-option" data-value="0.1">0.1x</div>
                        <div class="dropdown-option" data-value="0.25">0.25x</div>
                        <div class="dropdown-option" data-value="0.5">0.5x</div>
                        <div class="dropdown-option active" data-value="1.0">1.0x (Normal)</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-row">
            <label class="file-lbl">📂 Open Video <input type="file" id="up" accept="video/*"></label>
            <button class="btn-ai" id="btnAiToggle" onclick="toggleAI()">🟢 AI ON</button>
            <button class="btn-reset" onclick="reset()">🔄 Reset</button>
        </div>
        
        <button class="btn-manual" onclick="manualRunAI()">🎯 AI Manual Run</button>
        <button class="btn-main" onclick="captureSnapshot()">📸 Save Analysis Snapshot</button>

        <div class="result-grid" id="res">
            <div class="res-card"><span class="res-label">Knee</span><span class="res-val" id="valKnee">--°</span><span class="ref-text">160-170°</span></div>
            <div class="res-card"><span class="res-label">Elbow</span><span class="res-val" id="valElbow">--°</span><span class="ref-text">80-90°</span></div>
            <div class="res-card"><span class="res-label">Torso</span><span class="res-val" id="valBody">--°</span><span class="ref-text">5-10°</span></div>
        </div>
    </div>

    <div id="gallery"></div>

    <div id="imgModal" class="modal" onclick="closeModal(event)">
        <img id="modalImg" src="" onclick="closeModal(event)">
    </div>

    <script>
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d');
        const inS = document.getElementById('inStart');
        const inE = document.getElementById('inEnd');
        const btnPlay = document.getElementById('btnPlay');
        const btnAiToggle = document.getElementById('btnAiToggle');
        const dropdownSelected = document.getElementById('dropdownSelected');
        const dropdownOptions = document.getElementById('dropdownOptions');

        let isPlaying = false; // 수동 재생 플래그
        let aiTracking = true;
        let isAiProcessing = false;
        let currentSpeed = 1.0;
        let animationFrameId = null;
        let lastTimestamp = 0;

        let curKnee = "--°", curElbow = "--°", curBody = "--°";
        let lastJoints = { knee: null, elbow: null, hip: null };

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        document.getElementById('up').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            v.src = URL.createObjectURL(file);
            v.onloadedmetadata = () => {
                inE.max = v.duration;
                inS.value = "0.0000";
                inE.value = v.duration.toFixed(4);
                c.width = v.videoWidth; c.height = v.videoHeight;
                v.currentTime = 0;
                
                // 첫 로드 프레임 즉시 분석 유도
                setTimeout(() => { runAI(); }, 300);
            };
        };

        inS.oninput = () => {
            let val = parseFloat(inS.value) || 0;
            if(val < 0) val = 0;
            v.currentTime = val;
            runAI();
        };
        inE.oninput = () => {
            let val = parseFloat(inE.value) || v.duration;
            v.currentTime = val;
            runAI();
        };

        function toggleDropdown() {
            dropdownOptions.style.display = dropdownOptions.style.display === 'block' ? 'none' : 'block';
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-dropdown')) dropdownOptions.style.display = 'none';
        });
        document.querySelectorAll('.dropdown-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.dropdown-option').forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                currentSpeed = parseFloat(this.getAttribute('data-value'));
                dropdownSelected.innerText = this.innerText;
                dropdownOptions.style.display = 'none';
            });
        });

        // 🛠️ [핵심 엔진 변경] 재생 제어를 수동 시뮬레이션 인터벌 구조로 변경
        function togglePlay() {
            if (!isPlaying) {
                isPlaying = true;
                btnPlay.innerText = "⏸ Pause";
                lastTimestamp = performance.now();
                animationFrameId = requestAnimationFrame(renderLoop);
            } else {
                isPlaying = false;
                btnPlay.innerText = "▶ Play";
                if(animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
            }
        }

        // 🛠️ 비디오 내부 하드웨어 드라이버를 쓰지 않고 자바스크립트가 직접 타임라인을 밀어주는 루프
        async function renderLoop(timestamp) {
            if (!isPlaying) return;

            const elapsed = (timestamp - lastTimestamp) / 1000; // 초 단위 계산
            lastTimestamp = timestamp;

            const startTime = parseFloat(inS.value) || 0;
            const endTime = parseFloat(inE.value) || v.duration;

            // 시간에 맞춰 현재 타임스탬프 강제 이동 (배속 반영)
            let nextTime = v.currentTime + (elapsed * currentSpeed);

            if (nextTime >= endTime || nextTime < startTime) {
                nextTime = startTime;
            }

            v.currentTime = nextTime;

            // 화면 전환 동기화 후 AI 처리 실행 (렌더링 락 방지)
            if (aiTracking && !isAiProcessing) {
                await runAI();
            }

            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function toggleAI() {
            aiTracking = !aiTracking;
            btnAiToggle.innerText = aiTracking ? "🟢 AI ON" : "🔴 AI OFF";
            btnAiToggle.style.background = aiTracking ? "#30D158" : "#FF453A";
            if(!aiTracking) {
                ctx.clearRect(0, 0, c.width, c.height);
                lastJoints = { knee: null, elbow: null, hip: null };
            }
        }

        async function manualRunAI() {
            if(!aiTracking) return alert("AI ON 상태에서만 수동 연산이 가능합니다.");
            await runAI();
        }

        async function runAI() {
            if (!v.videoWidth || !v.videoHeight || isAiProcessing) return;
            try {
                isAiProcessing = true;
                if(c.width !== v.videoWidth || c.height !== v.videoHeight) {
                    c.width = v.videoWidth; c.height = v.videoHeight;
                }
                await pose.send({image: v});
            } catch(err) {
                console.error("Engine Error:", err);
            } finally {
                isAiProcessing = false;
            }
        }

        function onResults(res) {
            ctx.clearRect(0, 0, c.width, c.height);
            if (!res.poseLandmarks || !aiTracking) return;
            
            drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, {color: '#deff9a', lineWidth: 3});
            const lm = res.poseLandmarks;
            
            curKnee = calcAngle(lm[24], lm[26], lm[28]) + "°"; 
            curElbow = calcAngle(lm[12], lm[14], lm[16]) + "°";
            curBody = (Math.abs(Math.atan2(lm[24].x - lm[12].x, lm[24].y - lm[12].y) * 180 / Math.PI)).toFixed(1) + "°";
            
            document.getElementById('valKnee').innerText = curKnee;
            document.getElementById('valElbow').innerText = curElbow;
            document.getElementById('valBody').innerText = curBody;

            lastJoints.knee = { x: lm[26].x * c.width, y: lm[26].y * c.height };
            lastJoints.elbow = { x: lm[14].x * c.width, y: lm[14].y * c.height };
            lastJoints.hip = { x: lm[24].x * c.width, y: lm[24].y * c.height };
        }

        function calcAngle(p1, p2, p3) {
            const a = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let ang = Math.abs(a * 180 / Math.PI);
            if (ang > 180) ang = 360 - ang;
            return ang.toFixed(1);
        }

        function captureSnapshot() {
            if (!v.videoWidth || !v.videoHeight) return alert("비디오를 로드해주세요.");
            
            const tempC = document.createElement('canvas');
            const tCtx = tempC.getContext('2d');
            tempC.width = v.videoWidth; tempC.height = v.videoHeight;
            
            tCtx.drawImage(v, 0, 0, tempC.width, tempC.height);
            tCtx.drawImage(c, 0, 0, tempC.width, tempC.height);
            
            tCtx.fillStyle = "#deff9a"; 
            const fontSize = Math.max(14, tempC.width * 0.03);
            tCtx.font = `bold ${fontSize}px sans-serif`;
            tCtx.shadowColor = "black"; tCtx.shadowBlur = 4;

            if (lastJoints.knee && curKnee !== "--°") tCtx.fillText(`Knee ${curKnee}`, lastJoints.knee.x + 15, lastJoints.knee.y);
            if (lastJoints.elbow && curElbow !== "--°") tCtx.fillText(`Elbow ${curElbow}`, lastJoints.elbow.x + 15, lastJoints.elbow.y);
            if (lastJoints.hip && curBody !== "--°") tCtx.fillText(`Torso ${curBody}`, lastJoints.hip.x - (fontSize * 4), lastJoints.hip.y - 15);

            const imgData = tempC.toDataURL('image/jpeg', 0.9);
            const gal = document.getElementById('gallery');
            const box = document.createElement('div');
            box.className = "thumb";
            
            const img = document.createElement('img');
            img.src = imgData;
            img.onclick = () => openModal(imgData);
            
            box.appendChild(img);
            gal.insertBefore(box, gal.firstChild);
        }

        function reset() {
            isPlaying = false;
            btnPlay.innerText = "▶ Play";
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            v.currentTime = parseFloat(inS.value) || 0;
            ctx.clearRect(0,0,c.width,c.height);
            document.getElementById('gallery').innerHTML = "";
            document.getElementById('valKnee').innerText = "--°";
            document.getElementById('valElbow').innerText = "--°";
            document.getElementById('valBody').innerText = "--°";
            runAI();
        }

        function openModal(src) {
            const modal = document.getElementById('imgModal');
            modal.style.display = "flex";
            document.getElementById('modalImg').src = src;
        }

        function closeModal(event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            document.getElementById('imgModal').style.display = "none";
        }
    </script>
</body>
</html>
