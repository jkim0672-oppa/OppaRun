<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Analysis v2.9 - Jenny & Bro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <style>
        :root { --neon: #deff9a; --blue: #007AFF; --bg: #0A0A0C; --card: #1C1C1E; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        .video-box { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; margin-bottom: 10px; }
        video { width: 100%; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        .control-panel { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid #333; width: 100%; max-width: 600px; box-sizing: border-box; }
        
        /* 슬라이더 공간 다이어트 */
        .seek-bar-area { position: relative; width: 100%; height: 20px; margin: 2px 0 8px 0; }
        input[type="range"] { position: absolute; width: 100%; -webkit-appearance: none; background: transparent; pointer-events: none; cursor: pointer; }
        #startRange { z-index: 10; }
        #endRange { z-index: 9; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: var(--neon); border: 2px solid #000; margin-top: 1px; pointer-events: auto; }
        #endRange::-webkit-slider-thumb { background: var(--blue); }

        /* 플레이 및 미세조절 레이아웃 */
        .play-ctrl-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn-play { background: #2C2C2E; color: white; border: 1px solid #444; font-size: 14px; }
        .btn-step { background: #3A3A3C; color: #eee; font-size: 12px; }

        /* 입력창 */
        .time-input-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .input-group { flex: 1; min-width: 80px; display: flex; flex-direction: column; gap: 4px; }
        .input-group span { font-size: 11px; color: #aaa; }
        input[type="number"] { background: #2C2C2E; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button, .file-lbl { border-radius: 8px; border: none; padding: 12px 5px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; color: white; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .btn-main { background: var(--blue); width: 100%; margin-bottom: 15px; font-size: 15px; }
        .btn-ai { background: #30D158; color: white; }
        .btn-reset { background: #FF453A; }
        .file-lbl { background: #3A3A3C; }
        
        .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .res-card { background: #2C2C2E; padding: 10px; border-radius: 8px; border-left: 3px solid var(--neon); text-align: center; }
        .res-label { font-size: 10px; color: #888; display: block; margin-bottom: 3px; }
        .res-val { font-size: 16px; font-weight: bold; color: var(--neon); }
        .ref-text { color: #FF9500; font-size: 9px; display: block; margin-top: 4px; }

        /* 갤러리 영역 */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; width: 100%; max-width: 600px; margin-top: 15px; }
        .thumb { aspect-ratio: 1/1; border-radius: 6px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        input[type="file"] { display: none; }

        /* 전체화면 확대 모달 스타일 추가 */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; cursor: pointer; }
        .modal img { max-width: 95%; max-height: 85%; border-radius: 8px; border: 1px solid #444; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <h3 style="color: var(--neon); margin: 5px 0;">PRO ANALYSIS <span style="font-weight: 200;">v2.9</span></h3>

    <div class="video-box">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="control-panel">
        <div class="seek-bar-area">
            <input type="range" id="startRange" value="0" step="0.01">
            <input type="range" id="endRange" value="100" step="0.01">
        </div>

        <div class="play-ctrl-row">
            <button class="btn-step" onclick="stepTime(-0.01)">◀ -0.01s</button>
            <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶ 재생</button>
            <button class="btn-step" onclick="stepTime(0.01)">+0.01s ▶</button>
        </div>

        <div class="time-input-row">
            <div class="input-group">
                <span>시작(초)</span>
                <input type="number" id="inStart" value="0.00" step="0.1">
            </div>
            <div class="input-group">
                <span>간격(초)</span>
                <input type="number" id="inGap" value="0.05" step="0.01">
            </div>
            <div class="input-group">
                <span>끝(초)</span>
                <input type="number" id="inEnd" value="0.00" step="0.1">
            </div>
        </div>

        <div class="btn-row">
            <label class="file-lbl">📂 영상 선택 <input type="file" id="up" accept="video/*"></label>
            <button class="btn-ai" id="btnAiToggle" onclick="toggleAI()">🟢 AI 추적 ON</button>
            <button class="btn-reset" onclick="reset()">🔄 리셋</button>
        </div>
        
        <button class="btn-main" onclick="captureSnapshot()">📸 현재 분석 스냅샷 저장</button>

        <div class="result-grid" id="res">
            <div class="res-card"><span class="res-label">무릎</span><span class="res-val" id="valKnee">--°</span><span class="ref-text">160-170°</span></div>
            <div class="res-card"><span class="res-label">팔치기</span><span class="res-val" id="valElbow">--°</span><span class="ref-text">80-90°</span></div>
            <div class="res-card"><span class="res-label">상체</span><span class="res-val" id="valBody">--°</span><span class="ref-text">5-10°</span></div>
        </div>
    </div>

    <div id="gallery"></div>

    <div id="imgModal" class="modal" onclick="closeModal()">
        <img id="modalImg" src="">
    </div>

    <script>
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d');
        const sR = document.getElementById('startRange');
        const eR = document.getElementById('endRange');
        const inS = document.getElementById('inStart');
        const inE = document.getElementById('inEnd');
        const inG = document.getElementById('inGap');
        const btnPlay = document.getElementById('btnPlay');
        const btnAiToggle = document.getElementById('btnAiToggle');
        
        // AI 추적 활성화 상태 변수
        let aiTracking = true;

        // 현재 분석 각도 저장용 변수
        let curKnee = "--°", curElbow = "--°", curBody = "--°";
        
        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        document.getElementById('up').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            v.src = URL.createObjectURL(file);
            v.onloadedmetadata = () => {
                sR.max = eR.max = inE.max = v.duration;
                sR.value = 0; inS.value = 0;
                eR.value = inE.value = v.duration;
                c.width = v.videoWidth; c.height = v.videoHeight;
                setTimeout(() => { if(aiTracking) runAI(); }, 300);
            };
        };

        sR.oninput = () => { inS.value = sR.value; v.currentTime = sR.value; };
        eR.oninput = () => { inE.value = eR.value; v.currentTime = eR.value; };
        inS.oninput = () => { sR.value = inS.value; v.currentTime = inS.value; };
        inE.oninput = () => { eR.value = inE.value; v.currentTime = inE.value; };

        v.ontimeupdate = () => {
            if(!v.paused) {
                sR.value = v.currentTime;
                inS.value = parseFloat(v.currentTime).toFixed(2);
            }
        };

        v.addEventListener('seeked', () => {
            if (v.paused && aiTracking) {
                runAI();
            }
        });

        function trackFrame() {
            if (!v.paused && aiTracking) {
                runAI();
                requestAnimationFrame(trackFrame);
            }
        }

        function togglePlay() {
            if (v.paused) {
                v.play();
                btnPlay.innerText = "⏸ 일시정지";
                if(aiTracking) trackFrame();
            } else {
                v.pause();
                btnPlay.innerText = "▶ 재생";
            }
        }

        function stepTime(amount) {
            v.pause();
            btnPlay.innerText = "▶ 재생";
            let targetTime = v.currentTime + amount;
            if (targetTime < 0) targetTime = 0;
            if (targetTime > v.duration) targetTime = v.duration;
            v.currentTime = targetTime;
            sR.value = targetTime;
            inS.value = parseFloat(targetTime).toFixed(2);
        }

        // AI 실시간 추적 ON/OFF 토글 함수
        function toggleAI() {
            aiTracking = !aiTracking;
            if(aiTracking) {
                btnAiToggle.innerText = "🟢 AI 추적 ON";
                btnAiToggle.style.background = "#30D158";
                runAI();
                if(!v.paused) trackFrame();
            } else {
                btnAiToggle.innerText = "🔴 추적 중지 OFF";
                btnAiToggle.style.background = "#FF453A";
                ctx.clearRect(0, 0, c.width, c.height); // 스켈레톤 선 클리어
            }
        }

        async function runAI() { 
            if (!v.videoWidth || !v.videoHeight || !aiTracking) return;
            c.width = v.videoWidth; c.height = v.videoHeight;
            await pose.send({image: v}); 
        }

        function onResults(res) {
            ctx.clearRect(0, 0, c.width, c.height);
            if (!res.poseLandmarks || !aiTracking) return;
            drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, {color: '#deff9a', lineWidth: 3});
            const lm = res.poseLandmarks;
            
            curKnee = calcAngle(lm[24], lm[26], lm[28]) + "°"; 
            curElbow = calcAngle(lm[12], lm[14], lm[16]) + "°";
            curBody = (Math.abs(Math.atan2(lm[24].x - lm[12].x, lm[24].y - lm[12].y) * 180 / Math.PI)).toFixed(1) + "°";
            
            document.getElementById('valKnee').innerText = curKnee;
            document.getElementById('valElbow').innerText = curElbow;
            document.getElementById('valBody').innerText = curBody;
        }

        function calcAngle(p1, p2, p3) {
            const a = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let ang = Math.abs(a * 180 / Math.PI);
            if (ang > 180) ang = 360 - ang;
            return ang.toFixed(1);
        }

        function reset() { 
            v.pause();
            btnPlay.innerText = "▶ 재생";
            ctx.clearRect(0,0,c.width,c.height); 
            document.getElementById('gallery').innerHTML = ""; 
            curKnee = "--°"; curElbow = "--°"; curBody = "--°";
            document.getElementById('valKnee').innerText = "--°";
            document.getElementById('valElbow').innerText = "--°";
            document.getElementById('valBody').innerText = "--°";
        }

        // 비디오 프레임 + 스켈레톤 캔버스 + 각도 텍스트 자막까지 완벽하게 병합해 저장하는 크리티컬 캡처 로직
        function captureSnapshot() {
            if (!v.videoWidth || !v.videoHeight) return alert("영상이 로드되지 않았습니다.");
            
            const tempC = document.createElement('canvas');
            const tCtx = tempC.getContext('2d');
            tempC.width = v.videoWidth;
            tempC.height = v.videoHeight;
            
            // 1. 배경 비디오 프레임 그리기
            tCtx.drawImage(v, 0, 0, tempC.width, tempC.height);
            
            // 2. 그려진 실시간 스켈레톤 라인 오버레이 병합
            tCtx.drawImage(c, 0, 0, tempC.width, tempC.height);
            
            // 3. 우측 하단에 정밀 분석 스냅샷 실시간 데이터 자막 박스 각인
            const boxW = 160;
            const boxH = 75;
            const posX = tempC.width - boxW - 15;
            const posY = tempC.height - boxH - 15;
            
            tCtx.fillStyle = "rgba(28, 28, 30, 0.85)";
            tCtx.strokeStyle = "#deff9a";
            tCtx.lineWidth = 2;
            tCtx.lineJoin = "round";
            // 라운드 박스 그리기
            tCtx.beginPath();
            tCtx.roundRect ? tCtx.roundRect(posX, posY, boxW, boxH, 8) : tCtx.rect(posX, posY, boxW, boxH);
            tCtx.fill();
            tCtx.stroke();
            
            // 자막 텍스트 스타일 지정
            tCtx.fillStyle = "#ffffff";
            tCtx.font = "bold 13px sans-serif";
            tCtx.textAlign = "left";
            tCtx.fillText(`무릎: ${curKnee}`, posX + 15, posY + 22);
            tCtx.fillText(`팔치기: ${curElbow}`, posX + 15, posY + 44);
            tCtx.fillText(`상체: ${curBody}`, posX + 15, posY + 66);
            
            // 갤러리 등록 및 클릭 시 전체화면 연동
            const imgData = tempC.toDataURL('image/jpeg', 0.9);
            const gal = document.getElementById('gallery');
            const box = document.createElement('div');
            box.className = "thumb";
            
            const img = document.createElement('img');
            img.src = imgData;
            // 터치하면 전체화면 모달이 열리도록 함수 바인딩
            img.onclick = () => openModal(imgData);
            
            box.appendChild(img);
            gal.insertBefore(box, gal.firstChild); // 최신 스냅샷이 맨 앞으로 오게 추가
        }

        // 모달 제어 함수들
        function openModal(src) {
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = "flex";
            modalImg.src = src;
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = "none";
        }
    </script>
</body>
</html>
