<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Pro Analysis v4.1 - Responsive Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    
    <style>
        :root { 
            --neon: #bbf246; 
            --blue: #007AFF; 
            --bg: #000000; 
            --panel-bg: #121212;
            --card-bg: #1c1b1f;
            --input-bg: #252428;
            --btn-red: #ff3b30;
            
            --btn-play: #10b981;    
            --btn-open: #f59e0b;    
            --btn-reset: #64748b;   
            --btn-snap: #0091ff;    
            --btn-folder: #eab308;
        }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 8px 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow: hidden; 
            height: 100vh;
            height: -webkit-fill-available; /* 모바일 브라우저 주소창 높이 대응 */
            box-sizing: border-box; 
        }
        
        .main-title { 
            color: var(--neon); 
            margin: 0 0 6px 0; 
            font-size: 16px; 
            font-weight: bold; 
            text-align: center;
            flex-shrink: 0;
        }

        .video-box { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            background: #000; 
            border-radius: 15px;
            overflow: hidden; 
            aspect-ratio: 16/10; 
            flex-shrink: 0;
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        .video-time-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon);
            padding: 3px 6px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
        }

        .timeline-box {
            width: 100%;
            max-width: 500px;
            padding: 10px 6px; 
            box-sizing: border-box;
            position: relative;
            height: 26px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .dual-slider-container { position: relative; width: 100%; height: 6px; }
        .slider-track { position: absolute; height: 6px; border-radius: 3px; background: #333; width: 100%; top: 0; z-index: 1; }
        .video-timeline-dual {
            position: absolute; width: 100%; pointer-events: none; -webkit-appearance: none; appearance: none;
            height: 6px; background: none; outline: none; top: 0; z-index: 2; margin: 0;
        }
        .video-timeline-dual::-webkit-slider-thumb {
            pointer-events: auto; -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid #000;
        }
        #timelineLeft::-webkit-slider-thumb { background: var(--blue); }
        #timelineRight::-webkit-slider-thumb { background: var(--neon); }

        .control-panel { 
            background: var(--panel-bg); 
            padding: 10px 8px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            flex: 1; /* 남은 화면 공간을 유연하게 채움 */
            justify-content: space-between; /* 구성 요소들을 상하 균등 배치 */
            min-height: 0; /* flex 자식 스크롤 꼬임 방지 */
        }
        
        .grid-row { display: grid; gap: 5px; margin-bottom: 5px; width: 100%; }
        .grid-row:last-of-type { margin-bottom: 6px; }
        
        .precision-row { grid-template-columns: repeat(4, 1fr); }
        .btn-precision {
            background: #252428; color: #e5e5ea; border: 1px solid #2c2c2e; font-size: 11px; font-weight: bold;
            height: 34px; border-radius: 8px; cursor: pointer;
        }

        .marking-row { grid-template-columns: 1fr 1fr 1fr 1.1fr; }
        .btn-marking {
            background: transparent; color: #fff; border: 1.5px solid var(--neon);
            font-size: 12px; font-weight: bold; height: 34px; border-radius: 8px; cursor: pointer;
        }
        .btn-marking.active-auto { background: rgba(187, 242, 70, 0.2); }

        .select-wrapper { 
            position: relative; background: var(--input-bg); border: 1px solid #2c2c2e; border-radius: 8px; height: 34px;
        }
        .custom-select { 
            width: 100%; height: 100%; background: transparent; color: var(--neon); border: none; font-size: 11px; font-weight: bold; text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none;
        }

        .action-row { grid-template-columns: repeat(3, 1fr); }
        .ctrl-btn { color: white; font-weight: bold; border-radius: 8px; height: 38px; font-size: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .btn-play-mix { background: var(--btn-play); }
        .file-lbl-mix { background: var(--btn-open); }
        .btn-ai-mix { background: var(--btn-red); }
        .btn-reset-mix { background: var(--btn-reset); }
        .btn-folder-mix { background: var(--btn-folder); }
        .btn-snapshot-mix { background: var(--btn-snap); }

        .result-grid-compact { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 4px; 
            width: 100%;
            flex: 1; /* 데이터 박스가 남은 하단 공간을 꽉 채우도록 설정 */
            align-content: stretch;
            min-height: 72px;
        }
        .res-card { 
            background: var(--card-bg); padding: 8px 1px; border-radius: 10px; border-left: 2.5px solid var(--neon); 
            border-top: 1px solid rgba(187, 242, 70, 0.15); text-align: center; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .res-card.blue-card { border-left-color: var(--blue); }
        .res-label { font-size: 10px; font-weight: 600; color: #9a9a9f; display: block; white-space: nowrap; overflow: hidden; }
        .res-val { font-size: 13px; font-weight: bold; color: var(--neon); display: block; margin: 3px 0; }
        .res-card.blue-card .res-val { color: var(--blue); }
        .ref-text { color: #ffcc00; font-size: 8.5px; display: block; font-weight: 500; opacity: 0.8; }

        input[type="file"] { display: none; }

        /* 모달 시스템 */
        .gallery-panel-modal {
            display: none; position: fixed; z-index: 150; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); flex-direction: column; align-items: center; padding: 20px 14px; box-sizing: border-box;
        }
        .gallery-header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2c2c2e; padding-bottom: 10px; }
        .gallery-title { color: var(--neon); font-size: 16px; font-weight: bold; margin: 0; }
        .gallery-close-text { color: #e5e5ea; font-size: 13px; font-weight: bold; cursor: pointer; background: #252428; padding: 6px 14px; border-radius: 8px; }
        #innerGallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 500px; overflow-y: auto; flex: 1; align-content: flex-start; padding-bottom: 20px; }
        .inner-thumb { aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; border: 1px solid #2c2c2e; background: #1c1b1f; position: relative; }
        .inner-thumb img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); flex-direction: column; align-items: center; justify-content: center; }
        .modal img { max-width: 95%; max-height: 75%; border-radius: 8px; object-fit: contain; }
        .modal-controls { position: absolute; top: 24px; right: 16px; display: flex; gap: 12px; z-index: 210; }
        .text-btn { background: rgba(37, 36, 40, 0.9); color: white; border: 1px solid #3a3a3c; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .text-btn.danger { color: #ff453a; border-color: rgba(255, 69, 58, 0.4); }

        .custom-confirm-overlay { display: none; position: fixed; z-index: 300; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; }
        .custom-confirm-box { background: var(--panel-bg); border: 2px solid var(--neon); border-radius: 16px; width: 85%; max-width: 320px; padding: 20px; box-sizing: border-box; text-align: center; }
        .confirm-msg { font-size: 14px; color: #fff; line-height: 1.5; margin: 0 0 20px 0; font-weight: 500; }
        .confirm-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .confirm-btn { height: 38px; border-radius: 8px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; }
        .confirm-btn.yes { background: var(--btn-red); color: white; }
        .confirm-btn.no { background: #3a3a3c; color: #e5e5ea; }
    </style>
</head>
<body>

    <h3 class="main-title">PRO ANALYSIS v4.1</h3>

    <div class="video-box">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="videoTimeOverlay" class="video-time-overlay">0.00s</div>
    </div>

    <div class="timeline-box">
        <div class="dual-slider-container">
            <div class="slider-track" id="sliderTrack"></div>
            <input type="range" id="timelineLeft" class="video-timeline-dual" oninput="AppControl.onDualSliderInput('left')">
            <input type="range" id="timelineRight" class="video-timeline-dual" oninput="AppControl.onDualSliderInput('right')">
        </div>
    </div>

    <div class="control-panel">
        <div class="grid-row precision-row">
            <button class="btn-precision" onclick="AppControl.stepTime(-0.03)">◀ -0.03s</button>
            <button class="btn-precision" onclick="AppControl.stepTime(-0.01)">◀ -0.01s</button>
            <button class="btn-precision" onclick="AppControl.stepTime(0.01)">0.01s ▶</button>
            <button class="btn-precision" onclick="AppControl.stepTime(0.03)">0.03s ▶</button>
        </div>

        <div class="grid-row marking-row">
            <button id="btnAutoMark" class="btn-marking" onclick="AppControl.toggleAutoMode()">Auto</button>
            <button class="btn-marking" onclick="AppControl.markBall('left')">Contact</button>
            <button class="btn-marking" onclick="AppControl.markBall('right')">Takeoff</button>
            <div class="select-wrapper">
                <select id="speedSelect" class="custom-select" onchange="v.playbackRate = parseFloat(this.value)">
                    <option value="0.05">0.05x</option><option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1.0" selected>1.0x</option>
                </select>
            </div>
        </div>

        <div class="grid-row action-row">
            <button class="ctrl-btn btn-play-mix" id="btnPlay" onclick="AppControl.togglePlay()">▶ Play</button>
            <label class="ctrl-btn file-lbl-mix">📁 Open <input type="file" id="up" accept="video/*" onchange="AppControl.loadVideo(event)"></label>
            <button class="ctrl-btn btn-ai-mix" id="btnAiToggle" onclick="AppControl.toggleAI()">AI OFF</button>
        </div>
        
        <div class="grid-row action-row">
            <button class="ctrl-btn btn-reset-mix" onclick="AppControl.resetAll()">🔄 Reset</button>
            <button class="ctrl-btn btn-folder-mix" onclick="AppStorage.openGalleryPanel()">📁 Gallery</button>
            <button class="ctrl-btn btn-snapshot-mix" onclick="AppStorage.captureSnapshot()">📸 Snap</button>
        </div>
        
        <div class="result-grid-compact">
            <div class="res-card"><span class="res-label">Knee</span><span class="res-val" id="valKnee">--°</span><span class="ref-text">160-170°</span></div>
            <div class="res-card"><span class="res-label">Elbow</span><span class="res-val" id="valElbow">--°</span><span class="ref-text">80-90°</span></div>
            <div class="res-card"><span class="res-label">Torso</span><span class="res-val" id="valBody">--°</span><span class="ref-text">5-10°</span></div>
            <div class="res-card blue-card"><span class="res-label">GCT</span><span class="res-val" id="valGCT">0ms</span><span class="ref-text">180-220ms</span></div>
            <div class="res-card blue-card"><span class="res-label">Flight</span><span class="res-val" id="valFlight">0ms</span><span class="ref-text">70-100ms</span></div>
            <div class="res-card blue-card"><span class="res-label">Stride</span><span class="res-val" id="valStride">0.0m</span><span class="ref-text">1.0-1.4m</span></div>
        </div>
    </div>

    <div id="galleryModal" class="gallery-panel-modal">
        <div class="gallery-header">
            <span class="gallery-title">MY SNAPSHOTS 📁</span>
            <span class="gallery-close-text" onclick="AppStorage.closeGalleryPanel()">닫기</span>
        </div>
        <div id="innerGallery"></div>
    </div>

    <div id="imgModal" class="modal">
        <div class="modal-controls">
            <button class="text-btn danger" onclick="AppStorage.triggerCustomConfirm()">삭제</button>
            <button class="text-btn" onclick="AppStorage.closeModal()">닫기</button>
        </div>
        <img id="modalImg" src="">
    </div>

    <div id="customConfirm" class="custom-confirm-overlay">
        <div class="custom-confirm-box">
            <p class="confirm-msg">이 스냅샷을 창고 방에서<br>영구 삭제할까요?</p>
            <div class="confirm-buttons">
                <button class="confirm-btn yes" onclick="AppStorage.executeDelete()">삭제</button>
                <button class="confirm-btn no" onclick="AppStorage.cancelDelete()">취소</button>
            </div>
        </div>
    </div>

    <script>
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d');
        const btnPlay = document.getElementById('btnPlay');
        const btnAiToggle = document.getElementById('btnAiToggle');
        const speedSelect = document.getElementById('speedSelect');
        const sL = document.getElementById('timelineLeft');
        const sR = document.getElementById('timelineRight');
        const sT = document.getElementById('sliderTrack');
        const timeOverlay = document.getElementById('videoTimeOverlay');
        const valGCT = document.getElementById('valGCT');
        const valFlight = document.getElementById('valFlight');
        const btnAutoMark = document.getElementById('btnAutoMark');

        const CoreAI = {
            aiTracking: false, 
            isAiProcessing: false,
            curKnee: "--°", curElbow: "--°", curBody: "--°",
            lastJoints: { knee: null, elbow: null, hip: null },
            instance: null,

            init() {
                this.instance = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                this.instance.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
                this.instance.onResults(this.onResults.bind(this));
            },
            async runStableAI() {
                if (!v.videoWidth || !v.videoHeight || this.isAiProcessing || !this.aiTracking) return; 
                try {
                    this.isAiProcessing = true;
                    if(c.width !== v.videoWidth || c.height !== v.videoHeight) {
                        c.width = v.videoWidth; c.height = v.videoHeight;
                    }
                    await this.instance.send({image: v});
                } catch(err) {
                    console.log("Frame Skip");
                } finally {
                    this.isAiProcessing = false;
                }
            },
            onResults(res) {
                ctx.clearRect(0, 0, c.width, c.height);
                if (!res.poseLandmarks || !this.aiTracking) return;
                drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, {color: '#deff9a', lineWidth: 3});
                const lm = res.poseLandmarks;
                this.curKnee = this.calcAngle(lm[24], lm[26], lm[28]) + "°"; 
                this.curElbow = this.calcAngle(lm[12], lm[14], lm[16]) + "°";
                this.curBody = (Math.abs(Math.atan2(lm[24].x - lm[12].x, lm[24].y - lm[12].y) * 180 / Math.PI)).toFixed(1) + "°";
                document.getElementById('valKnee').innerText = this.curKnee;
                document.getElementById('valElbow').innerText = this.curElbow;
                document.getElementById('valBody').innerText = this.curBody;
                this.lastJoints.knee = { x: lm[26].x * c.width, y: lm[26].y * c.height };
                this.lastJoints.elbow = { x: lm[14].x * c.width, y: lm[14].y * c.height };
                this.lastJoints.hip = { x: lm[24].x * c.width, y: lm[24].y * c.height };
            },
            calcAngle(p1, p2, p3) {
                const a = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
                let ang = Math.abs(a * 180 / Math.PI);
                if (ang > 180) ang = 360 - ang;
                return ang.toFixed(1);
            }
        };

        const AppControl = {
            playLoopId: null, 
            isAutoMode: false,
            contactTime: null,
            takeoffTime: null,

            initEvents() {
                v.ontimeupdate = () => {
                    if(v.duration) {
                        timeOverlay.innerText = v.currentTime.toFixed(2) + "s";
                    }
                };
            },
            toggleAutoMode() {
                this.isAutoMode = !this.isAutoMode;
                if(this.isAutoMode) {
                    btnAutoMark.classList.add('active-auto');
                    btnAutoMark.innerText = "Analyzing";
                } else {
                    btnAutoMark.classList.remove('active-auto');
                    btnAutoMark.innerText = "Auto";
                }
            },
            loadVideo(e) {
                const file = e.target.files[0];
                if(!file) return;
                v.src = URL.createObjectURL(file);
                v.onloadedmetadata = () => {
                    sL.max = sR.max = v.duration;
                    sL.value = 0; sR.value = v.duration;
                    this.updateTrack();
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    v.currentTime = 0;
                    timeOverlay.innerText = "0.00s";
                    ctx.clearRect(0, 0, c.width, c.height); 
                    this.contactTime = null;
                    this.takeoffTime = null;
                    valGCT.innerText = `0ms`;
                    valFlight.innerText = `0ms`;
                    if(CoreAI.aiTracking) {
                        setTimeout(() => { CoreAI.runStableAI(); }, 150);
                    }
                };
            },
            onDualSliderInput(side) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId);
                }
                if (parseFloat(sL.value) > parseFloat(sR.value)) {
                    if (side === 'left') sL.value = sR.value; else sR.value = sL.value;
                }
                this.updateTrack();
                const targetTime = parseFloat(side === 'left' ? sL.value : sR.value);
                v.currentTime = targetTime;
                timeOverlay.innerText = targetTime.toFixed(2) + "s";
                
                this.contactTime = parseFloat(sL.value);
                this.takeoffTime = parseFloat(sR.value);
                this.calculateMetrics();
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },
            updateTrack() {
                const pL = (sL.value / sL.max) * 100;
                const pR = (sR.value / sR.max) * 100;
                sT.style.background = `linear-gradient(to right, #333 ${pL}%, var(--blue) ${pL}%, var(--neon) ${pR}%, #333 ${pR}%)`;
            },
            markBall(side) {
                if (side === 'left') {
                    if (this.takeoffTime !== null && v.currentTime > this.takeoffTime) {
                        sR.value = v.currentTime;
                        this.takeoffTime = v.currentTime;
                    }
                    sL.value = v.currentTime;
                    this.contactTime = v.currentTime;
                } else {
                    if (this.contactTime !== null && v.currentTime < this.contactTime) {
                        sL.value = v.currentTime;
                        this.contactTime = v.currentTime;
                    }
                    sR.value = v.currentTime;
                    this.takeoffTime = v.currentTime;
                }
                this.updateTrack();
                this.calculateMetrics();
            },
            calculateMetrics() {
                if (this.contactTime !== null && this.takeoffTime !== null) {
                    const diffMs = Math.round((this.takeoffTime - this.contactTime) * 1000);
                    valGCT.innerText = `${diffMs}ms`;
                    valFlight.innerText = Math.round(diffMs * 0.45) + "ms"; 
                }
            },
            syncPlayAI() {
                if (v.paused || !CoreAI.aiTracking) {
                    cancelAnimationFrame(this.playLoopId);
                    return;
                }
                CoreAI.runStableAI();
                this.playLoopId = requestAnimationFrame(() => this.syncPlayAI());
            },
            togglePlay() {
                if (v.paused) {
                    v.play();
                    btnPlay.innerText = "⏸ Pause";
                    if (CoreAI.aiTracking) this.syncPlayAI();
                } else {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId); 
                    setTimeout(() => { CoreAI.runStableAI(); }, 50);
                }
            },
            stepTime(amount) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId); 
                }
                v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + amount));
                timeOverlay.innerText = v.currentTime.toFixed(2) + "s";
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },
            toggleAI() {
                CoreAI.aiTracking = !CoreAI.aiTracking;
                btnAiToggle.innerText = CoreAI.aiTracking ? "AI ON" : "AI OFF";
                btnAiToggle.style.background = CoreAI.aiTracking ? "#10b981" : "#ff3b30";
                if(!CoreAI.aiTracking) {
                    cancelAnimationFrame(this.playLoopId); 
                    ctx.clearRect(0, 0, c.width, c.height);
                    CoreAI.lastJoints = { knee: null, elbow: null, hip: null };
                    document.getElementById('valKnee').innerText = "--°";
                    document.getElementById('valElbow').innerText = "--°";
                    document.getElementById('valBody').innerText = "--°";
                } else {
                    if(v.paused) CoreAI.runStableAI(); else this.syncPlayAI();
                }
            },
            resetAll() {
                v.pause();
                btnPlay.innerText = "▶ Play";
                cancelAnimationFrame(this.playLoopId); 
                
                const targetJumpTime = (this.contactTime !== null) ? this.contactTime : 0;
                v.currentTime = targetJumpTime;
                timeOverlay.innerText = targetJumpTime.toFixed(2) + "s";
                
                ctx.clearRect(0, 0, c.width, c.height);
                document.getElementById('innerGallery').innerHTML = "";
                document.getElementById('valKnee').innerText = "--°";
                document.getElementById('valElbow').innerText = "--°";
                document.getElementById('valBody').innerText = "--°";
                setTimeout(() => { CoreAI.runStableAI(); }, 50);
            }
        };

        const AppStorage = {
            targetThumbBox: null, 
            captureSnapshot() {
                if (!v.videoWidth || !v.videoHeight) return;
                const tempC = document.createElement('canvas');
                const tCtx = tempC.getContext('2d');
                tempC.width = v.videoWidth; tempC.height = v.videoHeight;
                tCtx.drawImage(v, 0, 0, tempC.width, tempC.height);
                tCtx.drawImage(c, 0, 0, tempC.width, tempC.height);
                tCtx.fillStyle = "#deff9a"; 
                const fontSize = Math.max(14, tempC.width * 0.03);
                tCtx.font = `bold ${fontSize}px sans-serif`;
                tCtx.shadowColor = "black"; tCtx.shadowBlur = 4;
                if (CoreAI.lastJoints.knee && CoreAI.curKnee !== "--°") tCtx.fillText(`Knee ${CoreAI.curKnee}`, CoreAI.lastJoints.knee.x + 15, CoreAI.lastJoints.knee.y);
                if (CoreAI.lastJoints.elbow && CoreAI.curElbow !== "--°") tCtx.fillText(`Elbow ${CoreAI.curElbow}`, CoreAI.lastJoints.elbow.x + 15, CoreAI.lastJoints.elbow.y);
                if (CoreAI.lastJoints.hip && CoreAI.curBody !== "--°") tCtx.fillText(`Torso ${CoreAI.curBody}`, CoreAI.lastJoints.hip.x - (fontSize * 4), CoreAI.lastJoints.hip.y - 15);
                const imgData = tempC.toDataURL('image/jpeg', 0.9);
                this.renderThumbnail(imgData);
            },
            renderThumbnail(src) {
                const gal = document.getElementById('innerGallery');
                const box = document.createElement('div');
                box.className = "inner-thumb";
                const img = document.createElement('img');
                img.src = src;
                img.onclick = () => this.openModal(src, box); 
                box.appendChild(img);
                gal.insertBefore(box, gal.firstChild); 
            },
            openGalleryPanel() { document.getElementById('galleryModal').style.display = "flex"; },
            closeGalleryPanel() { document.getElementById('galleryModal').style.display = "none"; },
            openModal(src, thumbBoxPointer) {
                this.targetThumbBox = thumbBoxPointer; 
                const modal = document.getElementById('imgModal');
                modal.style.display = "flex";
                document.getElementById('modalImg').src = src;
            },
            closeModal() { document.getElementById('imgModal').style.display = "none"; this.targetThumbBox = null; },
            triggerCustomConfirm() { document.getElementById('customConfirm').style.display = "flex"; },
            cancelDelete() { document.getElementById('customConfirm').style.display = "none"; },
            executeDelete() {
                document.getElementById('customConfirm').style.display = "none";
                if (this.targetThumbBox) this.targetThumbBox.remove();
                this.closeModal();
            }
        };

        CoreAI.init();
        AppControl.initEvents();
    </script>
</body>
</html>
