<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Run - 폼 정밀 분석실 v2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 40px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video {
            display: none;
            width: 100%;
            height: 100%;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .control-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .file-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #3a3a3a;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn:active {
            background: #3a3a3a;
        }
        .btn-accent {
            background: var(--accent-color);
            color: #000;
            border: none;
        }
        .btn-accent:active {
            background: #00c853;
        }
        input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .timeline-wrapper {
            margin-bottom: 15px;
        }
        .range-slider {
            width: 100%;
            -webkit-appearance: none;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
            margin: 10px 0;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }
        /* 업그레이드된 세로 모드 대응 촘촘한 프레임 컨트롤러 레이아웃 */
        .frame-controls {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        .frame-btn {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #3a3a3a;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }
        .frame-btn:active {
            background: #3a3a3a;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .metric-card {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border-left: 3px solid var(--accent-color);
        }
        .metric-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .calc-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .calc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .calc-row:last-child {
            margin-bottom: 0;
        }
        .calc-btn-group {
            display: flex;
            gap: 5px;
        }
        .calc-btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        .calc-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        .log-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .log-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.82rem;
        }
        .clear-log {
            font-size: 0.75rem;
            color: #ff5252;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Jenny Run 폼 정밀 분석실</h1>
        <div style="font-size: 0.8rem; color: var(--text-dim);" id="fps-display">FPS: --</div>
    </header>

    <div class="video-container">
        <video id="video" playsinline webkit-playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="control-panel">
        <div class="file-input-wrapper">
            <div class="btn btn-accent">비디오 불러오기</div>
            <input type="file" id="file-input" accept="video/*">
        </div>

        <div class="timeline-wrapper">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim);">
                <span id="current-time">00:00.000</span>
                <span id="duration-time">00:00.000</span>
            </div>
            <input type="range" id="timeline" class="range-slider" min="0" value="0" step="0.001">
        </div>

        <div class="frame-controls">
            <button class="frame-btn" id="prev-10">-10F</button>
            <button class="frame-btn" id="prev-3">-3F</button>
            <button class="frame-btn" id="prev-1">-1F</button>
            <button class="frame-btn" id="next-1">+1F</button>
            <button class="frame-btn" id="next-3">+3F</button>
            <button class="frame-btn" id="next-10">+10F</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">현재 프레임 번호</div>
                <div class="metric-value" id="frame-idx">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">측정된 관절 각도</div>
                <div class="metric-value" id="angle-display">0.0°</div>
            </div>
        </div>

        <button class="btn" id="play-btn">재생</button>
    </div>

    <div class="calc-panel">
        <div class="calc-row">
            <span>착지 시점 (GCT 시작)</span>
            <div class="calc-btn-group">
                <span style="font-size: 0.85rem; margin-right: 10px; align-self: center;" id="td-display">--</span>
                <button class="calc-btn" id="set-td">지정</button>
            </div>
        </div>
        <div class="calc-row">
            <span>이륙 시점 (GCT 끝 / FT 시작)</span>
            <div class="calc-btn-group">
                <span style="font-size: 0.85rem; margin-right: 10px; align-self: center;" id="to-display">--</span>
                <button class="calc-btn" id="set-to">지정</button>
            </div>
        </div>
        <div class="calc-row">
            <span>재착지 시점 (FT 끝)</span>
            <div class="calc-btn-group">
                <span style="font-size: 0.85rem; margin-right: 10px; align-self: center;" id="retd-display">--</span>
                <button class="calc-btn" id="set-retd">지정</button>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #2a2a2a; margin: 10px 0;">
        <div class="metrics-grid" style="margin-bottom: 0;">
            <div class="metric-card" style="border-left-color: #29b6f6;">
                <div class="metric-label">지면 접촉 시간 (GCT)</div>
                <div class="metric-value" id="gct-result">-- ms</div>
            </div>
            <div class="metric-card" style="border-left-color: #ab47bc;">
                <div class="metric-label">공중 비행 시간 (FT)</div>
                <div class="metric-value" id="ft-result">-- ms</div>
            </div>
        </div>
        <button class="btn btn-accent" id="save-log-btn" style="margin-top: 12px; padding: 8px; font-size: 0.85rem;">분석 데이터 로그에 저장</button>
    </div>

    <div class="log-section">
        <div class="log-header">
            <span>분석 기록 로그</span>
            <button class="clear-log" id="clear-log-btn">전체 삭제</button>
        </div>
        <ul class="log-list" id="log-list">
            </ul>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');
    const timeline = document.getElementById('timeline');
    const playBtn = document.getElementById('play-btn');
    
    const currentTimeDisplay = document.getElementById('current-time');
    const durationTimeDisplay = document.getElementById('duration-time');
    const fpsDisplay = document.getElementById('fps-display');
    const frameIdxDisplay = document.getElementById('frame-idx');
    const angleDisplay = document.getElementById('angle-display');
    const logList = document.getElementById('log-list');

    let videoFps = 30; 
    let isPlaying = false;
    let poseLoaded = false;
    let currentResults = null;

    // GCT/FT 변수
    let timeTouchDown = null;
    let timeTakeOff = null;
    let timeReTouchDown = null;

    // 애플 모바일 환경 및 일반 브라우저 대응 파일 로드 루틴
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
        
        videoFps = 30; // 기본 30fps 세팅 후 프레임 매핑 보정
        fpsDisplay.textContent = `FPS: ${videoFps} (추정)`;
        
        isPlaying = false;
        playBtn.textContent = "재생";
        resetCurrentMetrics();
    });

    video.addEventListener('loadedmetadata', function() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        timeline.max = video.duration;
        durationTimeDisplay.textContent = formatTime(video.duration);
        updateTimelineComponents();
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00.000";
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
        return `${m}:${s}.${ms}`;
    }

    // 미디어파이프 Pose 초기화
    const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
        currentResults = results;
        poseLoaded = true;
        renderCanvas();
    });

    // 강제 동기화 렌더러 및 자동 미러링 방지 고정 뷰포트 그리기
    function renderCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 원본 영상 레이아웃 비율 고정 드로우 (강제 반전 방지 로직)
        ctx.save();
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        if (currentResults && currentResults.poseLandmarks) {
            // 스켈레톤 드로잉 유틸리티 매핑
            drawConnectors(ctx, currentResults.poseLandmarks, POSE_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
            drawLandmarks(ctx, currentResults.poseLandmarks, {color: '#00e676', lineWidth: 1, radius: 4});
            
            // 실시간 주동 관절 분석 루틴 호출
            calculateRunningAngles(currentResults.poseLandmarks);
        }
    }

    function calculateRunningAngles(landmarks) {
        // 골반(24), 무릎(26), 발목(28) 기준 데이터 로직 추출
        const hip = landmarks[24];
        const knee = landmarks[26];
        const ankle = landmarks[28];

        if (hip.visibility > 0.5 && knee.visibility > 0.5 && ankle.visibility > 0.5) {
            const angle = computeAngle(hip, knee, ankle);
            angleDisplay.textContent = `${angle.toFixed(1)}°`;
        }
    }

    function computeAngle(p1, p2, p3) {
        const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
        let angle = Math.abs((radians * 180.0) / Math.PI);
        if (angle > 180.0) angle = 360.0 - angle;
        return angle;
    }

    function updateTimelineComponents() {
        timeline.value = video.currentTime;
        currentTimeDisplay.textContent = formatTime(video.currentTime);
        
        const currentFrame = Math.floor(video.currentTime * videoFps);
        frameIdxDisplay.textContent = currentFrame;

        // 드래그 및 정지 상태에서도 연산 버퍼가 끊기지 않도록 강제 업데이트 스케줄링
        if (!isPlaying) {
            pose.send({image: video}).catch(() => {});
        }
    }

    timeline.addEventListener('input', function() {
        video.currentTime = timeline.value;
        updateTimelineComponents();
    });

    // 토글 재생 루프 제어
    playBtn.addEventListener('click', function() {
        if (isPlaying) {
            video.pause();
            isPlaying = false;
            playBtn.textContent = "재생";
        } else {
            video.play();
            isPlaying = true;
            playBtn.textContent = "일시정지";
            requestAnimationFrame(playLoop);
        }
    });

    function playLoop() {
        if (!isPlaying) return;
        updateTimelineComponents();
        pose.send({image: video}).then(() => {
            requestAnimationFrame(playLoop);
        }).catch(() => {
            if (isPlaying) requestAnimationFrame(playLoop);
        });
    }

    // 업그레이드된 프레임 미세 도약 가속 장치 제어 핸들러
    document.getElementById('prev-1').addEventListener('click', () => stepFrame(-1));
    document.getElementById('next-1').addEventListener('click', () => stepFrame(1));
    document.getElementById('prev-3').addEventListener('click', () => stepFrame(-3)); // 약 0.1초 보정 루틴
    document.getElementById('next-3').addEventListener('click', () => stepFrame(3));
    document.getElementById('prev-10').addEventListener('click', () => stepFrame(-10));
    document.getElementById('next-10').addEventListener('click', () => stepFrame(10));

    function stepFrame(count) {
        if (isPlaying) {
            video.pause();
            isPlaying = false;
            playBtn.textContent = "재생";
        }
        const frameTime = 1 / videoFps;
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (count * frameTime)));
        
        // 모바일 하드웨어 디코딩 싱크 타이밍 패딩 처리
        setTimeout(updateTimelineComponents, 40);
    }

    // GCT / FT 고도화 수동 캡처 제어 섹션
    const tdDisplay = document.getElementById('td-display');
    const toDisplay = document.getElementById('to-display');
    const retdDisplay = document.getElementById('retd-display');
    const gctResult = document.getElementById('gct-result');
    const ftResult = document.getElementById('ft-result');

    document.getElementById('set-td').addEventListener('click', () => {
        timeTouchDown = video.currentTime;
        tdDisplay.textContent = formatTime(timeTouchDown).split(':')[1];
        calculateMetrics();
    });

    document.getElementById('set-to').addEventListener('click', () => {
        timeTakeOff = video.currentTime;
        toDisplay.textContent = formatTime(timeTakeOff).split(':')[1];
        calculateMetrics();
    });

    document.getElementById('set-retd').addEventListener('click', () => {
        timeReTouchDown = video.currentTime;
        retdDisplay.textContent = formatTime(timeReTouchDown).split(':')[1];
        calculateMetrics();
    });

    function calculateMetrics() {
        if (timeTouchDown !== null && timeTakeOff !== null && timeTakeOff > timeTouchDown) {
            const gct = Math.round((timeTakeOff - timeTouchDown) * 1000);
            gctResult.textContent = `${gct} ms`;
        } else {
            gctResult.textContent = `-- ms`;
        }

        if (timeTakeOff !== null && timeReTouchDown !== null && timeReTouchDown > timeTakeOff) {
            const ft = Math.round((timeReTouchDown - timeTakeOff) * 1000);
            ftResult.textContent = `${ft} ms`;
        } else {
            ftResult.textContent = `-- ms`;
        }
    }

    function resetCurrentMetrics() {
        timeTouchDown = null; timeTakeOff = null; timeReTouchDown = null;
        tdDisplay.textContent = '--'; toDisplay.textContent = '--'; retdDisplay.textContent = '--';
        gctResult.textContent = '-- ms'; ftResult.textContent = '-- ms';
    }

    // 로컬 스토리지 데이터 영구 백업 비즈니스 로직
    function loadSavedLogs() {
        const savedLogs = JSON.parse(localStorage.getItem('jenny_run_pose_logs')) || [];
        logList.innerHTML = '';
        savedLogs.forEach(log => {
            appendLogDOM(log.time, log.gct, log.ft, log.angle);
        });
    }

    function appendLogDOM(time, gct, ft, angle) {
        const li = document.createElement('li');
        li.className = 'log-item';
        li.innerHTML = `
            <span>[${time}] GCT: ${gct} / FT: ${ft}</span>
            <span style="color:var(--accent-color); font-weight:bold;">${angle}</span>
        `;
        logList.insertBefore(li, logList.firstChild);
    }

    document.getElementById('save-log-btn').addEventListener('click', () => {
        if (gctResult.textContent.includes('--') && ftResult.textContent.includes('--')) return;
        
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        const currentData = {
            time: timeStr,
            gct: gctResult.textContent,
            ft: ftResult.textContent,
            angle: angleDisplay.textContent
        };

        const savedLogs = JSON.parse(localStorage.getItem('jenny_run_pose_logs')) || [];
        savedLogs.push(currentData);
        localStorage.setItem('jenny_run_pose_logs', JSON.stringify(savedLogs));
        
        appendLogDOM(currentData.time, currentData.gct, currentData.ft, currentData.angle);
    });

    document.getElementById('clear-log-btn').addEventListener('click', () => {
        localStorage.removeItem('jenny_run_pose_logs');
        logList.innerHTML = '';
        resetCurrentMetrics();
    });

    // 웹앱 구동 즉시 로컬 백업 로딩
    window.addEventListener('DOMContentLoaded', loadSavedLogs);
</script>
</body>
</html>
