<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO ANALYSIS v5.5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #121212;
            --card-bg: #1e1e1e;
            --neon-green: #9dfc03;
            --neon-blue: #03a9f4;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--container-bg);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 헤더 스타일 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            color: var(--neon-green);
            letter-spacing: -0.5px;
        }

        .mode-selector {
            display: flex;
            background-color: #1a1a1a;
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--neon-green);
            color: #000000;
        }

        /* 비디오 영역 */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .time-overlay {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            color: var(--neon-green);
            font-family: monospace;
        }

        /* 컨트롤 패널 */
        .control-panel {
            background-color: #161616;
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 그리드 레이아웃 정의 */
        .row-4col {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .row-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .row-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* 버튼 기본 스타일 */
        .btn {
            background-color: #262626;
            border: none;
            color: var(--text-color);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 미세조정 버튼 */
        .btn-frame {
            background-color: #222222;
            color: #e0e0e0;
            font-size: 13px;
            padding: 10px 4px;
        }

        /* Contact / Takeoff 버튼 */
        .btn-contact {
            border: 2px solid var(--neon-blue);
            background-color: rgba(3, 169, 244, 0.05);
            font-size: 15px;
            padding: 14px 0;
        }
        .btn-contact.active {
            background-color: var(--neon-blue);
            color: #000;
        }

        .btn-takeoff {
            border: 2px solid var(--neon-green);
            background-color: rgba(157, 252, 3, 0.05);
            font-size: 15px;
            padding: 14px 0;
        }
        .btn-takeoff.active {
            background-color: var(--neon-green);
            color: #000;
        }

        /* 기능별 컬러 버튼 */
        .btn-play { background-color: #00b074; }
        .btn-play.playing { background-color: #ff3b30; }
        
        .btn-open { background-color: #ff9500; }
        
        .btn-settings { 
            background-color: #5856d6; 
            font-size: 13px;
        }
        
        .btn-reset-all { background-color: #5c6bc0; }
        .btn-reset-loop { background-color: #2196f3; }
        
        .btn-report { 
            background-color: #af52de;
            grid-column: span 1;
        }

        /* 선택창 스타일 (배속 선택) */
        .select-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .select-container select {
            width: 100%;
            height: 100%;
            background-color: #262626;
            border: none;
            color: var(--neon-green);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-align-last: center;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        /* 구간 선택 폰트 및 정보창 디자인 (배속이 빠져서 가로폭 대폭 확장) */
        .info-box {
            background-color: #222222;
            border-radius: 12px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .info-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 15px;
            font-weight: 700;
            font-family: monospace;
        }

        /* 탐색 바 (Seek Bar) */
        .seekbar-container {
            width: 100%;
            padding: 4px 0;
            display: flex;
            align-items: center;
        }

        .seekbar {
            width: 100%;
            -webkit-appearance: none;
            background: #2c2c2c;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        .seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(3,169,244,0.5);
        }

        /* 데이터 카드 대시보드 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .card {
            background-color: #121212;
            border-radius: 16px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border-left: 3px solid transparent;
        }

        .card.neon-green-border { border-left-color: var(--neon-green); }
        .card.neon-blue-border { border-left-color: var(--neon-blue); }

        .card-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .card-value {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .card-value.green { color: var(--text-color); }
        .card-value.blue { color: var(--neon-blue); }

        .card-target {
            font-size: 11px;
            color: #e5a93c;
            font-weight: 600;
            margin-bottom: 6px;
        }

        /* 미니 게이지 바 */
        .gauge-bar {
            width: 85%;
            height: 4px;
            background-color: #222222;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .card.neon-green-border .gauge-fill { background-color: var(--neon-green); }
        .card.neon-blue-border .gauge-fill { background-color: var(--neon-blue); }

        /* 모달 팝업 스타일 (설정 및 리포트) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border: 1px solid #333;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .setting-label {
            font-size: 14px;
            font-weight: 600;
        }

        .setting-input {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            width: 80px;
            text-align: center;
        }

        /* 파일 입력 숨김 */
        #file-input {
            display: none;
        }

        /* 리포트 내부 스타일 */
        .report-section {
            margin-bottom: 15px;
        }
        .report-summary {
            background-color: #121212;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #ddd;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 200px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="title">PRO ANALYSIS v5.5</div>
        <div class="mode-selector">
            <button class="mode-btn active" onclick="changeMode('manual')">Manual</button>
            <button class="mode-btn" onclick="changeMode('auto')">Auto AI</button>
            <button class="mode-btn" onclick="changeMode('solution')">Solution AI</button>
        </div>
    </div>

    <div class="video-container" id="drop-zone">
        <video id="video-player" playsinline></video>
        <canvas id="overlay-canvas"></canvas>
        <div class="time-overlay" id="time-display">0.00s</div>
    </div>

    <div class="seekbar-container">
        <input type="range" class="seekbar" id="seek-bar" min="0" max="100" value="0" step="0.01">
    </div>

    <div class="control-panel">
        <div class="row-4col">
            <button class="btn btn-frame" onclick="stepFrame(-0.03)">< -0.03s</button>
            <button class="btn btn-frame" onclick="stepFrame(-0.01)">< -0.01s</button>
            <button class="btn btn-frame" onclick="stepFrame(0.01)">0.01s ></button>
            <button class="btn btn-frame" onclick="stepFrame(0.03)">0.03s ></button>
        </div>

        <div class="row-2col">
            <button class="btn btn-contact" id="btn-contact" onclick="markTimestamp('contact')">Contact</button>
            <button class="btn btn-takeoff" id="btn-takeoff" onclick="markTimestamp('takeoff')">Takeoff</button>
        </div>

        <div class="row-3col">
            <button class="btn btn-play" id="btn-play" onclick="togglePlay()">▶ 재생</button>
            
            <div class="select-container" id="speed-select-container">
                <select id="speed-select" onchange="changeSpeed()">
                    <option value="0.1">0.1x</option>
                    <option value="0.2">0.2x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1.0" selected>1.0x</option>
                </select>
            </div>
            
            <button class="btn btn-open" id="btn-open" onclick="triggerFileInput()">📁 비디오 열기</button>
            <input type="file" id="file-input" accept="video/*" onchange="loadVideo(event)">
        </div>

        <div class="row-3col">
            <button class="btn btn-settings" onclick="toggleModal('settings-modal')">⚙ Settings</button>
            <button class="btn btn-frame btn-reset-all" onclick="resetAll()">Reset All</button>
            <button class="btn btn-frame btn-reset-loop" onclick="resetLoop()">Reset Loop</button>
        </div>

        <div class="row-3col">
            <div class="info-box">
                <span class="info-label">START</span>
                <span class="info-value" id="val-start">0.00</span>
            </div>
            <div class="info-box">
                <span class="info-label">END</span>
                <span class="info-value" id="val-end">0.00</span>
            </div>
            <button class="btn btn-report" onclick="generateReport()">📊 Report</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card neon-green-border" onclick="activateAngle('knee')">
            <span class="card-title">무릎 각도</span>
            <span class="card-value green" id="lbl-knee-angle">--°</span>
            <span class="card-target" id="target-knee">160-170°</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-knee"></div></div>
        </div>
        <div class="card neon-green-border" onclick="activateAngle('elbow')">
            <span class="card-title">팔꿈치 각도</span>
            <span class="card-value green" id="lbl-elbow-angle">--°</span>
            <span class="card-target" id="target-elbow">80-90°</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-elbow"></div></div>
        </div>
        <div class="card neon-green-border" onclick="activateAngle('torso')">
            <span class="card-title">상체 기울기</span>
            <span class="card-value green" id="lbl-torso-angle">--°</span>
            <span class="card-target" id="target-torso">5-10°</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-torso"></div></div>
        </div>
        <div class="card neon-blue-border">
            <span class="card-title">GCT</span>
            <span class="card-value blue" id="lbl-gct">0ms</span>
            <span class="card-target" id="target-gct">180-220ms</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-gct"></div></div>
        </div>
        <div class="card neon-blue-border">
            <span class="card-title">Flight</span>
            <span class="card-value blue" id="lbl-flight">0ms</span>
            <span class="card-target" id="target-flight">70-100ms</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-flight"></div></div>
        </div>
        <div class="card neon-blue-border">
            <span class="card-title">보폭 거리</span>
            <span class="card-value blue" id="lbl-stride">0.00m</span>
            <span class="card-target" id="target-stride">1.0-1.4m</span>
            <div class="gauge-bar"><div class="gauge-fill" id="gauge-stride"></div></div>
        </div>
    </div>
</div>

<div class="modal" id="settings-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">목표 수치 설정</div>
            <button class="close-btn" onclick="toggleModal('settings-modal')">&times;</button>
        </div>
        <div id="settings-inputs-container">
            </div>
        <button class="btn" style="width:100%; margin-top:10px; background-color:var(--neon-green); color:#000;" onclick="saveSettings()">저장 완료</button>
    </div>
</div>

<div class="modal" id="report-modal">
    <div class="modal-content" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title">종합 분석 리포트</div>
            <button class="close-btn" onclick="toggleModal('report-modal')">&times;</button>
        </div>
        <div class="report-section">
            <div class="report-summary" id="report-text">
                데이터를 분석 중입니다...
            </div>
        </div>
        <div class="report-section">
            <div class="chart-container">
                <canvas id="reportChart"></canvas>
            </div>
        </div>
        <button class="btn" style="width:100%; margin-top:10px; background-color:#222;" onclick="toggleModal('report-modal')">닫기</button>
    </div>
</div>

<script>
    // 상태 관리 객체
    const state = {
        mode: 'manual',
        contactTime: null,
        takeoffTime: null,
        points: {}, // 각도별 클릭된 점들 { knee: [], elbow: [], torso: [] }
        activeAngleType: 'knee', // 현재 입력 중인 각도 타입
        targets: {
            knee: { min: 160, max: 170, unit: '°' },
            elbow: { min: 80, max: 90, unit: '°' },
            torso: { min: 5, max: 10, unit: '°' },
            gct: { min: 180, max: 220, unit: 'ms' },
            flight: { min: 70, max: 100, unit: 'ms' },
            stride: { min: 1.0, max: 1.4, unit: 'm' }
        },
        calculated: {
            knee: null,
            elbow: null,
            torso: null,
            gct: 0,
            flight: 0,
            stride: 0
        },
        reportChart: null
    };

    // DOM 요소 캐싱
    const video = document.getElementById('video-player');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const btnPlay = document.getElementById('btn-play');
    const btnContact = document.getElementById('btn-contact');
    const btnTakeoff = document.getElementById('btn-takeoff');

    // 초기화 및 이벤트 리스너 등록
    window.addEventListener('resize', resizeCanvas);
    
    video.addEventListener('loadedmetadata', () => {
        seekBar.max = video.duration;
        resizeCanvas();
        updateUI();
    });

    video.addEventListener('timeupdate', () => {
        if (!video.paused) {
            seekBar.value = video.currentTime;
        }
        updateTimeDisplay();
        drawSkeleton();
        checkLoop();
    });

    seekBar.addEventListener('input', (e) => {
        video.currentTime = e.target.value;
        updateTimeDisplay();
        drawSkeleton();
    });

    // 드롭존 및 클릭으로 포인트 찍기 기능 설정
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('click', handleCanvasClick);

    // 드래그앤드롭 파일 로드 기능
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.startsWith('video/')) {
                video.src = URL.createObjectURL(file);
            }
        }
    });

    // 앱 초기화 실행
    initSettingsModal();
    updateUI();

    function resizeCanvas() {
        canvas.width = video.clientWidth;
        canvas.height = video.clientHeight;
        drawSkeleton();
    }

    function triggerFileInput() {
        document.getElementById('file-input').click();
    }

    function loadVideo(event) {
        const file = event.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
        }
    }

    function changeMode(mode) {
        state.mode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase().includes(mode)) btn.classList.add('active');
        });
        alert(`${mode.toUpperCase()} 모드로 전환되었습니다. (현재 데모 버전 구조 유지)`);
    }

    function togglePlay() {
        if (video.paused) {
            video.play();
            btnPlay.innerText = '⏸ 정지';
            btnPlay.classList.add('playing');
        } else {
            video.pause();
            btnPlay.innerText = '▶ 재생';
            btnPlay.classList.remove('playing');
        }
    }

    function stepFrame(amount) {
        video.pause();
        btnPlay.innerText = '▶ 재생';
        btnPlay.classList.remove('playing');
        let newTime = video.currentTime + amount;
        if (newTime < 0) newTime = 0;
        if (newTime > video.duration) newTime = video.duration;
        video.currentTime = newTime;
        seekBar.value = newTime;
    }

    function changeSpeed() {
        const speed = document.getElementById('speed-select').value;
        video.playbackRate = parseFloat(speed);
    }

    function updateTimeDisplay() {
        timeDisplay.innerText = video.currentTime.toFixed(2) + 's';
    }

    // Contact / Takeoff 마크 및 계산 로직
    function markTimestamp(type) {
        if (type === 'contact') {
            state.contactTime = video.currentTime;
            btnContact.classList.add('active');
            document.getElementById('val-start').innerText = state.contactTime.toFixed(2);
        } else if (type === 'takeoff') {
            state.takeoffTime = video.currentTime;
            btnTakeoff.classList.add('active');
            document.getElementById('val-end').innerText = state.takeoffTime.toFixed(2);
        }

        // 수치 실시간 계산 (Contact & Takeoff 가 모두 찍혔을 때)
        if (state.contactTime !== null && state.takeoffTime !== null) {
            let diff = (state.takeoffTime - state.contactTime) * 1000; // ms 단위
            
            if (diff >= 0) {
                // 정상 순서 (Contact -> Takeoff): 지면접촉시간(GCT) 산출
                state.calculated.gct = Math.round(diff);
                // 보폭거리는 시간 차이에 기반한 임의 시뮬레이션 공식 적용
                state.calculated.stride = parseFloat((1.0 + (diff / 1000) * 1.5).toFixed(2));
            } else {
                // 역 순서 (Takeoff -> Contact): 공중비행시간(Flight) 산출
                state.calculated.flight = Math.round(Math.abs(diff));
            }
            updateUI();
        }
    }

    function checkLoop() {
        if (state.contactTime !== null && state.takeoffTime !== null && state.contactTime < state.takeoffTime) {
            if (video.currentTime >= state.takeoffTime) {
                video.currentTime = state.contactTime;
                seekBar.value = state.contactTime;
            }
        }
    }

    function resetLoop() {
        state.contactTime = null;
        state.takeoffTime = null;
        btnContact.classList.remove('active');
        btnTakeoff.classList.remove('active');
        document.getElementById('val-start').innerText = '0.00';
        document.getElementById('val-end').innerText = '0.00';
        state.calculated.gct = 0;
        state.calculated.flight = 0;
        state.calculated.stride = 0;
        updateUI();
    }

    function resetAll() {
        resetLoop();
        state.points = {};
        state.calculated.knee = null;
        state.calculated.elbow = null;
        state.calculated.torso = null;
        document.getElementById('lbl-knee-angle').innerText = '--°';
        document.getElementById('lbl-elbow-angle').innerText = '--°';
        document.getElementById('lbl-torso-angle').innerText = '--°';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateUI();
    }

    // 수동 관절 각도 마킹 로직
    function activateAngle(type) {
        state.activeAngleType = type;
        // 시각적으로 선택된 카드 강조 처리 가능
        document.querySelectorAll('.card').forEach(c => c.style.boxShadow = 'none');
        event.currentTarget.style.boxShadow = '0 0 8px var(--neon-green)';
    }

    function handleCanvasClick(e) {
        if (!video.src) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (!state.points[state.activeAngleType]) {
            state.points[state.activeAngleType] = [];
        }

        const currentPoints = state.points[state.activeAngleType];

        if (currentPoints.length < 3) {
            currentPoints.push({ x, y });
        } else {
            // 3개가 다 차있으면 새로 시작
            state.points[state.activeAngleType] = [{ x, y }];
        }

        drawSkeleton();

        // 점이 3개 찍혔을 때 실제 각도 연산 수행
        if (state.points[state.activeAngleType].length === 3) {
            const angle = calculateAngle(
                state.points[state.activeAngleType][0],
                state.points[state.activeAngleType][1],
                state.points[state.activeAngleType][2]
            );
            
            state.calculated[state.activeAngleType] = Math.round(angle);
            document.getElementById(`lbl-${state.activeAngleType}-angle`).innerText = Math.round(angle) + '°';
            updateUI();
        }
    }

    function calculateAngle(p1, p2, p3) {
        const a = Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2);
        const b = Math.pow(p2.x - p3.x, 2) + Math.pow(p2.y - p3.y, 2);
        const c = Math.pow(p3.x - p1.x, 2) + Math.pow(p3.y - p1.y, 2);
        
        let angle = Math.acos((a + b - c) / Math.sqrt(4 * a * b)) * (180 / Math.PI);
        return angle;
    }

    // 스케톤 및 각도 텍스트 캔버스 드로잉 기술
    function drawSkeleton() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const colors = { knee: '#9dfc03', elbow: '#03a9f4', torso: '#ffcc00' };

        Object.keys(state.points).forEach(type => {
            const pts = state.points[type];
            if (!pts || pts.length === 0) return;

            ctx.fillStyle = colors[type];
            ctx.strokeStyle = colors[type];
            ctx.lineWidth = 3;

            // 점 그리기
            pts.forEach((pt, idx) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.fillText(idx + 1, pt.x + 8, pt.y - 8);
                ctx.fillStyle = colors[type];
            });

            // 선 연결
            if (pts.length >= 2) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                if (pts.length === 3) {
                    ctx.lineTo(pts[2].x, pts[2].y);
                    
                    // 각도 수치 표시 위치 계산 (두 번째 중간 관절 근처)
                    ctx.font = 'bold 14px monospace';
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 4;
                    ctx.fillText((state.calculated[type] || '--') + '°', pts[1].x + 15, pts[1].y + 5);
                    ctx.shadowBlur = 0;
                }
                ctx.stroke();
            }
        });
    }

    // UI 상태 업데이트 및 게이지 바 정밀 제어
    function updateUI() {
        Object.keys(state.targets).forEach(key => {
            const target = state.targets[key];
            const val = state.calculated[key];
            
            // 목표치 가이드 텍스트 업데이트
            const targetLbl = document.getElementById(`target-${key}`);
            if(targetLbl) targetLbl.innerText = `${target.min}-${target.max}${target.unit}`;

            // 실시간 상단 표시 연동
            if(key === 'gct') document.getElementById('lbl-gct').innerText = val + 'ms';
            if(key === 'flight') document.getElementById('lbl-flight').innerText = val + 'ms';
            if(key === 'stride') document.getElementById('lbl-stride').innerText = val.toFixed(2) + 'm';

            // 게이지바 퍼센트 계산 연직
            const gauge = document.getElementById(`gauge-${key}`);
            if (gauge) {
                let percent = 0;
                if (val > 0 || val !== null) {
                    const currentVal = val === null ? 0 : val;
                    // 간단 비율 스케일링 로직
                    percent = (currentVal / (target.max * 1.2)) * 100;
                    if (percent > 100) percent = 100;
                }
                gauge.style.width = percent + '%';
            }
        });
    }

    // 설정 모달 데이터 동적 관리
    function toggleModal(id) {
        const modal = document.getElementById(id);
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        if (id === 'settings-modal' && modal.style.display === 'flex') {
            initSettingsModal();
        }
    }

    function initSettingsModal() {
        const container = document.getElementById('settings-inputs-container');
        container.innerHTML = '';
        
        const krNames = { knee: '무릎 각도', elbow: '팔꿈치 각도', torso: '상체 기울기', gct: '지면접촉시간(GCT)', flight: '체공 시간(Flight)', stride: '보폭 거리' };

        Object.keys(state.targets).forEach(key => {
            const t = state.targets[key];
            const div = document.createElement('div');
            div.className = 'setting-item';
            div.innerHTML = `
                <span class="setting-label">${krNames[key]} (${t.unit})</span>
                <div>
                    <input type="number" step="0.1" class="setting-input" id="cfg-${key}-min" value="${t.min}">
                    <input type="number" step="0.1" class="setting-input" id="cfg-${key}-max" value="${t.max}">
                </div>
            `;
            container.appendChild(div);
        });
    }

    function saveSettings() {
        Object.keys(state.targets).forEach(key => {
            state.targets[key].min = parseFloat(document.getElementById(`cfg-${key}-min`).value);
            state.targets[key].max = parseFloat(document.getElementById(`cfg-${key}-max`).value);
        });
        toggleModal('settings-modal');
        updateUI();
    }

    // 종합 분석 리포트 연산 및 Chart.js 시각화 출력
    function generateReport() {
        toggleModal('report-modal');
        
        let score = 85; // 가상의 분석 베이스 스코어
        let feedback = "전반적인 주법 분석 결과입니다.\n\n";

        // 실제 수치와 목표 범위 연산 분석 피드백
        if (state.calculated.gct > 0) {
            if (state.calculated.gct > state.targets.gct.max) {
                feedback += `• 지면접촉시간(GCT)이 설정한 목표치보다 다소 깁니다. 지면을 밀어내는 반발력을 더 활용해 보세요.\n`;
                score -= 10;
            } else if (state.calculated.gct < state.targets.gct.min) {
                feedback += `• 매우 빠른 GCT를 기록하고 계십니다. 탄력 효율이 우수합니다.\n`;
                score += 5;
            } else {
                feedback += `• 지면접촉시간이 목표 범위 내에 안정적으로 포함됩니다.\n`;
            }
        } else {
            feedback += `• 정확한 주기가 측정되지 않았습니다. Contact와 Takeoff 시점을 매핑해 주세요.\n`;
        }

        if (state.calculated.knee !== null) {
            if (state.calculated.knee < state.targets.knee.min) {
                feedback += `• 착지 시 무릎이 다소 과하게 굽혀집니다. 부상 방지를 위해 충격 흡수력을 확인하세요.\n`;
                score -= 5;
            }
        }

        document.getElementById('report-text').innerText = `종합 분석 점수: ${score}점\n\n` + feedback;

        // 리포트 차트 초기화 및 생성
        setTimeout(() => {
            const chartCtx = document.getElementById('reportChart').getContext('2d');
            
            if (state.reportChart) {
                state.reportChart.destroy();
            }

            const keys = ['knee', 'elbow', 'torso'];
            const currentData = keys.map(k => state.calculated[k] || 0);
            const targetMinData = keys.map(k => state.targets[k].min);
            const targetMaxData = keys.map(k => state.targets[k].max);

            state.reportChart = new Chart(chartCtx, {
                type: 'bar',
                data: {
                    labels: ['무릎 각도', '팔꿈치 각도', '상체 기울기'],
                    datasets: [
                        {
                            label: '현재 측정치',
                            data: currentData,
                            backgroundColor: '#03a9f4',
                            borderWidth: 0
                        },
                        {
                            label: '목표 최소치',
                            data: targetMinData,
                            backgroundColor: 'rgba(157, 252, 3, 0.3)',
                            type: 'line',
                            borderColor: '#9dfc03',
                            borderWidth: 1,
                            fill: false
                        },
                        {
                            label: '목표 최대치',
                            data: targetMaxData,
                            backgroundColor: 'rgba(255, 59, 48, 0.3)',
                            type: 'line',
                            borderColor: '#ff3b30',
                            borderWidth: 1,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#333' },
                            ticks: { color: '#aaa' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#aaa' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff', boxWidth: 12 } }
                    }
                }
            });
        }, 100);
    }
</script>
