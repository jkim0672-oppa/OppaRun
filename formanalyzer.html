<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Pro Analysis v5.5 - Total Solution Edition</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        :root { 
            --neon: #bbf246; --blue: #007AFF; --bg: #000000; --panel-bg: #121212;
            --card-bg: #1c1b1f; --input-bg: #252428; --btn-red: #ff3b30;
            --btn-play: #10b981; --btn-open: #f59e0b; --btn-reset: #64748b;   
            --btn-return: #3b82f6; --btn-snap: #0091ff; --btn-folder: #eab308;
            --btn-report: #8b5cf6; --btn-setting: #6366f1;
            --status-green: #00FF66; --status-yellow: #FFFF00; --status-red: #ff3b30;
        }
        
        body { 
            background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 8px 8px; display: flex; flex-direction: column; align-items: center; 
            overflow: hidden; height: 100vh; height: -webkit-fill-available; box-sizing: border-box; 
        }
        
        .header-row { display: flex; width: 100%; max-width: 500px; justify-content: space-between; align-items: center; flex-shrink: 0; margin: 2px 0 6px 0; }
        .main-title { color: var(--neon); margin: 0; font-size: 14px; font-weight: bold; }

        .tab-container { display: flex; gap: 3px; background: #1c1b1f; padding: 2px; border-radius: 8px; border: 1px solid #2c2c2e; }
        .mode-tab { background: transparent; border: none; color: #9a9a9f; font-size: 10px; font-weight: bold; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .mode-tab.active { background: var(--neon); color: black; }
        .mode-tab.active.auto-tab { background: #10b981; color: white; }
        .mode-tab.active.solution-tab { background: var(--btn-report); color: white; }

        .analysis-room { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; flex: 1; min-height: 0; }
        .analysis-room.active-room { display: flex; }

        .video-box { position: relative; width: 100%; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16/10; flex-shrink: 0; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        .video-time-overlay { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: var(--neon); padding: 3px 6px; border-radius: 5px; font-size: 11px; font-weight: bold; z-index: 10; }

        .timeline-box { width: 100%; padding: 12px 6px; box-sizing: border-box; position: relative; height: 32px; margin-bottom: 4px; flex-shrink: 0; }
        .dual-slider-container { position: relative; width: 100%; height: 8px; }
        .slider-track { position: absolute; height: 8px; border-radius: 4px; background: #333; width: 100%; top: 0; z-index: 1; }
        .video-timeline-dual { position: absolute; width: 100%; pointer-events: none; -webkit-appearance: none; appearance: none; height: 8px; background: none; outline: none; top: 0; margin: 0; }
        
        .video-timeline-dual::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #ffffff; box-shadow: 0 0 8px rgba(0,0,0,0.6); position: relative; top: -8px; }
        .timelineLeftClass { z-index: 10; }
        .timelineRightClass { z-index: 9; }
        .timelineLeftClass::-webkit-slider-thumb { background: var(--blue); }
        .timelineRightClass::-webkit-slider-thumb { background: var(--neon); }

        .control-panel { background: var(--panel-bg); padding: 10px 12px; border-radius: 24px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; flex: 1; justify-content: space-between; min-height: 0; }
        
        .grid-row { display: grid; gap: 6px; margin-bottom: 4px; width: 100%; }
        .btn-precision { background: #252428; color: #e5e5ea; border: 1px solid #2c2c2e; font-size: 12px; font-weight: bold; height: 38px; border-radius: 10px; cursor: pointer; }
        .btn-marking { background: transparent; color: #fff; border: 1.5px solid var(--neon); font-size: 13px; font-weight: bold; height: 38px; border-radius: 10px; cursor: pointer; }
        .manual-input-box { background: var(--input-bg); border: 1px solid #2c2c2e; border-radius: 10px; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        .manual-input-box span { font-size: 9px; color: #9a9a9f; font-weight: bold; line-height: 1; margin-bottom: 2px; }
        .manual-input-box input { width: 85%; background: transparent; border: none; color: white; text-align: center; font-size: 12px; font-weight: bold; outline: none; padding: 0; }
        
        .select-wrapper { position: relative; background: var(--input-bg); border: 1px solid #2c2c2e; border-radius: 10px; height: 38px; }
        .custom-select { width: 100%; height: 100%; background: transparent; color: var(--neon); border: none; font-size: 12px; font-weight: bold; text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none; }

        .ctrl-btn { color: white; font-weight: bold; border-radius: 10px; height: 38px; font-size: 13px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-play-mix { background: var(--btn-play); }
        .file-lbl-mix { background: var(--btn-open); position: relative; }
        .btn-setting-mix { background: var(--btn-setting); }
        .btn-reset-mix { background: var(--btn-reset); }
        .btn-return-mix { background: var(--btn-return); } 
        .btn-folder-mix { background: var(--btn-folder); }
        .btn-report-mix { background: var(--btn-report); }

        .result-grid-compact { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; width: 100%; flex: 1.3; align-content: stretch; margin-top: 4px; }
        .res-card { background: var(--card-bg); padding: 4px 4px; border-radius: 12px; border-left: 3px solid var(--neon); border-top: 1px solid rgba(187, 242, 70, 0.15); text-align: center; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .res-card.blue-card { border-left-color: var(--blue); }
        .res-label { font-size: 10px; font-weight: 600; color: #9a9a9f; display: block; white-space: nowrap; overflow: hidden; }
        .res-val { font-size: 15px; font-weight: bold; color: var(--neon); display: block; margin: 1px 0; }
        .res-card.blue-card .res-val { color: var(--blue); }
        .ref-text { color: #ffcc00; font-size: 9px; display: block; font-weight: 500; opacity: 0.8; }

        .gauge-container { width: 80%; height: 3px; background: #2c2c2e; border-radius: 2px; margin-top: 3px; overflow: hidden; position: relative; }
        .gauge-bar { height: 100%; width: 50%; background: var(--neon); transition: width 0.2s ease-out; }
        .blue-card .gauge-bar { background: var(--blue); }

        .solution-panel { background: var(--panel-bg); border-radius: 20px; padding: 14px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #2c2c2e; }
        .sol-card { background: var(--card-bg); border-radius: 14px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--btn-report); }
        .sol-card-title { font-size: 13px; font-weight: bold; color: var(--neon); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .sol-card-desc { font-size: 11.5px; color: #e5e5ea; line-height: 1.5; margin: 0; }
        .sol-status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .hidden-file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; display: block !important; }

        .gallery-panel-modal { display: none; position: fixed; z-index: 150; left: 0; top: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.98); flex-direction: column; align-items: center; padding: 20px 14px; box-sizing: border-box; }
        .gallery-header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2c2c2e; padding-bottom: 10px; }
        .gallery-title { color: var(--neon); font-size: 16px; font-weight: bold; margin: 0; }
        .gallery-close-text { color: #e5e5ea; font-size: 13px; font-weight: bold; cursor: pointer; background: #252428; padding: 6px 14px; border-radius: 8px; }
        #innerGallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 500px; overflow-y: auto; flex: 1; align-content: flex-start; padding-bottom: 20px; }
        .inner-thumb { aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; border: 1px solid #2c2c2e; background: #1c1b1f; position: relative; }
        .inner-thumb img { width: 100%; height: 100%; object-fit: cover; }
        
        .setting-table { width: 100%; max-width: 460px; margin-top: 15px; background: #1c1b1f; border-radius: 12px; overflow: hidden; padding: 16px; box-sizing: border-box; }
        .setting-group { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .setting-group label { font-size: 14px; font-weight: bold; color: #9a9a9f; }
        .setting-input { background: #252428; border: 1px solid #2c2c2e; color: #fff; padding: 8px 12px; border-radius: 8px; width: 100px; text-align: center; font-weight: bold; font-size: 14px; }
        .setting-select { background: #252428; border: 1px solid #2c2c2e; color: var(--neon); padding: 8px 12px; border-radius: 8px; width: 126px; text-align: center; font-weight: bold; font-size: 14px; }

        .report-table { width: 100%; max-width: 460px; border-collapse: collapse; margin-top: 15px; background: #1c1b1f; border-radius: 12px; overflow: hidden; }
        .report-table th, .report-table td { padding: 12px; text-align: left; border-bottom: 1px solid #2c2c2e; font-size: 13px; }
        .report-table th { background: #252428; color: #9a9a9f; font-weight: 600; }
        .report-table td { color: #fff; font-weight: bold; }
        .report-table td.neon-txt { color: var(--neon); }
        .report-table td.blue-txt { color: var(--blue); }

        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); flex-direction: column; align-items: center; justify-content: center; }
        .modal img { max-width: 95%; max-height: 75%; border-radius: 8px; object-fit: contain; }
        .modal-controls { position: absolute; top: 24px; right: 16px; display: flex; gap: 12px; z-index: 210; }
        .text-btn { background: rgba(37, 36, 40, 0.9); color: white; border: 1px solid #3a3a3c; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .text-btn.danger { color: #ff453a; border-color: rgba(255, 69, 58, 0.4); }

        .custom-confirm-overlay { display: none; position: fixed; z-index: 300; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; }
        .custom-confirm-box { background: var(--panel-bg); border: 2px solid var(--neon); border-radius: 16px; width: 85%; max-width: 320px; padding: 20px; box-sizing: border-box; text-align: center; }
        .confirm-msg { font-size: 14px; color: #fff; line-height: 1.5; margin: 0 0 20px 0; font-weight: 500; }
        .confirm-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .confirm-btn { height: 38px; border-radius: 8px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; }
        .confirm-btn.yes { background: var(--btn-red); color: white; }
        .confirm-btn.no { background: #3a3a3c; color: #e5e5ea; }
    </style>
</head>
<body>

    <div class="header-row">
        <h3 class="main-title" id="txtMainTitle">PRO ANALYSIS v5.5</h3>
        <div class="tab-container">
            <button id="tabManual" class="mode-tab active" onclick="AppControl.switchRoom('manual')">Manual</button>
            <button id="tabAuto" class="mode-tab auto-tab" onclick="AppControl.switchRoom('auto')">Auto AI</button>
            <button id="tabSolution" class="mode-tab solution-tab" onclick="AppControl.switchRoom('solution')">Solution AI</button>
        </div>
    </div>

    <div id="manualRoom" class="analysis-room active-room">
        <div class="video-box">
            <video id="videoManual" playsinline muted></video>
            <canvas id="canvasManual"></canvas>
            <div id="timeOverlayManual" class="video-time-overlay">0.00s</div>
        </div>
        <div class="timeline-box">
            <div class="dual-slider-container">
                <div class="slider-track" id="sliderTrackManual"></div>
                <input type="range" id="timelineLeftManual" class="video-timeline-dual timelineLeftClass" oninput="AppControl.onDualSliderInput('left')">
                <input type="range" id="timelineRightManual" class="video-timeline-dual timelineRightClass" oninput="AppControl.onDualSliderInput('right')">
            </div>
        </div>
        <div class="control-panel">
            <div class="grid-row" style="grid-template-columns: repeat(4, 1fr);">
                <button class="btn-precision" onclick="AppControl.stepTime(-0.03)">◀ -0.03s</button>
                <button class="btn-precision" onclick="AppControl.stepTime(-0.01)">◀ -0.01s</button>
                <button class="btn-precision" onclick="AppControl.stepTime(0.01)">0.01s ▶</button>
                <button class="btn-precision" onclick="AppControl.stepTime(0.03)">0.03s ▶</button>
            </div>
            <div class="grid-row" style="grid-template-columns: 1fr 1fr;">
                <button id="btnContactManual" class="btn-marking" onclick="AppControl.markBall('left')" style="border-color: var(--blue);">Contact</button>
                <button id="btnTakeoffManual" class="btn-marking" onclick="AppControl.markBall('right')">Takeoff</button>
            </div>
            <div class="grid-row" style="grid-template-columns: repeat(3, 1fr);">
                <button class="ctrl-btn btn-play-mix" id="btnPlayManual" onclick="AppControl.togglePlay()">▶ Play</button>
                <label class="ctrl-btn file-lbl-mix"><span class="btn-lbl-text">📁 열기</span><input type="file" class="hidden-file-input" accept="video/*" onchange="AppControl.loadVideo(event)"></label>
                <button class="ctrl-btn btn-setting-mix" onclick="AppControl.openSettingModal()">⚙️ 설정</button>
            </div>
            <div class="grid-row" style="grid-template-columns: repeat(3, 1fr);">
                <button class="ctrl-btn btn-reset-mix" onclick="AppControl.resetAll()">⏮️ 전체 리셋</button>
                <button class="ctrl-btn btn-return-mix" onclick="AppControl.resetToMark()">↩️ 구간 리셋</button>
                <button class="ctrl-btn btn-folder-mix" onclick="AppStorage.openGalleryPanel()">📁 Gallery</button>
            </div>
            <div class="grid-row" style="grid-template-columns: 1.1fr 1.1fr 1fr 1.2fr;">
                <div class="manual-input-box"><span>START</span><input type="number" id="inputStartPointManual" step="0.01" onchange="AppControl.onManualTimeInputChange('left')"></div>
                <div class="manual-input-box"><span>END</span><input type="number" id="inputEndPointManual" step="0.01" onchange="AppControl.onManualTimeInputChange('right')"></div>
                <div class="select-wrapper"><select id="speedSelectManual" class="custom-select" onchange="if(vActive) vActive.playbackRate = parseFloat(this.value)"><option value="0.5">0.5x</option><option value="1.0" selected>1.0x</option></select></div>
                <button class="ctrl-btn btn-report-mix" onclick="AppControl.openReportModal()">📊 Report</button>
            </div>
            <div class="result-grid-compact">
                <div class="res-card"><span class="res-label">Knee</span><span class="res-val" id="valKneeM">--°</span><div class="gauge-container"><div id="gKneeM" class="gauge-bar"></div></div></div>
                <div class="res-card"><span class="res-label">Elbow</span><span class="res-val" id="valElbowM">--°</span><div class="gauge-container"><div id="gElbowM" class="gauge-bar"></div></div></div>
                <div class="res-card"><span class="res-label">Torso</span><span class="res-val" id="valBodyM">--°</span><div class="gauge-container"><div id="gTorsoM" class="gauge-bar"></div></div></div>
                <div class="res-card blue-card"><span class="res-label">GCT</span><span class="res-val" id="valGCTM">0ms</span><div class="gauge-container"><div id="gGCTM" class="gauge-bar"></div></div></div>
                <div class="res-card blue-card"><span class="res-label">Flight</span><span class="res-val" id="valFlightM">0ms</span><div class="gauge-container"><div id="gFlightM" class="gauge-bar"></div></div></div>
                <div class="res-card blue-card"><span class="res-label">Stride</span><span class="res-val" id="valStrideM">0.00m</span><div class="gauge-container"><div id="gStrideM" class="gauge-bar"></div></div></div>
            </div>
        </div>
    </div>
    <script>
        // ... (이전 코드 유지)

        const AppControl = {
            // ... (기존 코드들)
            
            // [수정] 구간 리셋 로직: 0초가 아닌 contactTime으로 이동
            resetToMark() {
                if(vM) vM.pause();
                if(vA) vA.pause();
                
                // 0 지점이 아닌 설정된 구간 시작점으로 이동
                const targetTime = (this.contactTime !== null) ? this.contactTime : 0;
                
                if(vActive) vActive.currentTime = targetTime;
                
                // 슬라이더 및 UI 동기화
                this.syncSliderUIFromTime(targetTime);
                if(this.currentRoom === 'manual') CoreAI.runStableAI(true);
            },
            
            // ... 나머지 함수들
        };

        const CoreAI = {
            // ... (기존 코드들)
            
            // [수정] 체공시간 계산 로직 보완
            analyzeRunningGCT() {
                if(this.footDataHistory.length < 5) return;
                const h = this.footDataHistory;
                const len = h.length;
                let cur = h[len-1];
                let prev = h[len-2];
                let pprev = h[len-3];

                // ... (이전 로직 동일 유지)

                if (AppControl.contactTime !== null) {
                    // 체공시간 계산 로직 추가
                    if (rightVelocity > 0.0014 && prevRightY <= pprevRightY) {
                         const flightTime = Math.round((cur.time - AppControl.takeoffTime) * 1000); // 이전 발착지후 다음 접지까지
                         // 결과 표시
                         if(AppControl.currentRoom === 'manual') document.getElementById('valFlightM').innerText = flightTime + "ms";
                         else document.getElementById('valFlightA').innerText = flightTime + "ms";
                    }
                }
                
                // ... 나머지 로직
            }
        };

        // ... (나머지 코드들 유지)
    </script>
</body>
</html>
