<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Analysis v5.5 - Fixed</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        /* [원본 레이아웃 그대로 유지] */
        :root { --neon: #bbf246; --blue: #007AFF; --bg: #000000; --panel-bg: #121212; --card-bg: #1c1b1f; --btn-open: #f59e0b; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 8px; height: 100vh; overflow: hidden; box-sizing: border-box; }
        .analysis-room { display: none; width: 100%; flex-direction: column; align-items: center; }
        .active-room { display: flex; }
        .video-box { position: relative; width: 100%; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16/10; }
        video { width: 100%; height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .ctrl-btn { color: white; font-weight: bold; border-radius: 10px; height: 38px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .file-lbl-mix { background: var(--btn-open); position: relative; display: flex; align-items: center; justify-content: center; }
        .hidden-file-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    </style>
</head>
<body>

    <script>
        const AppControl = {
            currentRoom: 'manual',
            contactTime: null,
            takeoffTime: null,
            
            // 파일 로드 강제 제어
            loadVideo(event) {
                const file = event.target.files[0];
                if (!file) return;
                const v = document.getElementById('videoManual');
                v.src = URL.createObjectURL(file);
                v.load();
            },
            
            // 구간 리셋 로직 보완
            resetToMark() {
                const v = document.getElementById('videoManual');
                v.pause();
                const targetTime = (this.contactTime !== null) ? this.contactTime : 0;
                v.currentTime = targetTime;
                console.log("구간 리셋 완료: " + targetTime + "s");
            },
            
            // 탭 전환 로직
            switchRoom(mode) {
                this.currentRoom = mode;
                document.querySelectorAll('.analysis-room').forEach(r => r.style.display = 'none');
                document.getElementById(mode + 'Room').style.display = 'flex';
            }
        };

        // 초기화 함수 추가
        window.onload = () => {
            console.log("Pro Analysis v5.5 시스템 로드 완료");
        };
    </script>
</body>
</html>
