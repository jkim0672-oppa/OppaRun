<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Analysis v4.0 - Compact Master Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    
    <style>
        :root { 
            --neon: #bbf246; 
            --blue: #007AFF; 
            --bg: #000000; 
            --panel-bg: #121212;
            --card-bg: #1c1b1f;
            --input-bg: #252428;
            --btn-red: #ff3b30;
            
            --btn-play: #10b981;    
            --btn-open: #f59e0b;    
            --btn-reset: #64748b;   
            --btn-snap: #0091ff;    
            --btn-folder: #eab308;
        }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden; 
            box-sizing: border-box; 
        }
        
        .main-title { 
            color: var(--neon); 
            margin: 2px 0 10px 0; 
            font-size: 18px; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            text-align: center;
        }
        .main-title span { 
            font-weight: 300; 
            color: #fff; 
            opacity: 0.5; 
            font-size: 14px;
        }

        .video-box { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            background: #000; 
            border-top-left-radius: 20px; 
            border-top-right-radius: 20px;
            overflow: hidden; 
            aspect-ratio: 16/10; 
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* 🎬 비디오 화면 내 우측 하단 시간 오버레이 스타일 */
        .video-time-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: var(--neon);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
            border: 1px solid rgba(187, 242, 70, 0.2);
        }

        .timeline-box {
            width: 100%;
            max-width: 500px;
            background: #000;
            padding: 6px 16px 8px 16px; 
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-sizing: border-box;
            margin-bottom: 8px; 
            display: flex;
            align-items: center;
        }
        .video-timeline {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            cursor: pointer;
            margin: 0;
        }
        .video-timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .control-panel { 
            background: var(--panel-bg); 
            padding: 12px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box; 
            position: relative; 
        }
        
        .precision-step-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }
        .btn-precision {
            background: #252428;
            color: #e5e5ea;
            border: 1px solid #2c2c2e;
            font-size: 11px;
            font-weight: bold;
            height: 36px; 
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .btn-precision:active {
            background: rgba(255,255,255,0.08);
            color: var(--neon);
        }

        /* 🆕 Start/End 박스 대체 공간: [자동], [접촉], [이탈] 슬림 3줄 버튼 로우 및 속도 조절 팩 */
        .marking-action-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr;
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }
        .btn-marking {
            background: #1c1b1f;
            color: white;
            border: 1px solid #3a3a3c;
            font-size: 11px;
            font-weight: bold;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .btn-marking.active-auto {
            border-color: var(--blue);
            color: var(--blue);
            background: rgba(0, 122, 255, 0.1);
        }
        .btn-marking:active {
            background: var(--input-bg);
        }
        .btn-marking span {
            color: var(--neon);
            margin-left: 2px;
        }

        .select-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0;
            height: 36px;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid #2c2c2e;
            border-radius: 10px;
        }
        .custom-select { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            color: var(--neon); 
            border: none; 
            font-size: 11px; 
            font-weight: bold; 
            text-align: center; 
            text-align-last: center; 
            padding-right: 10px;
            cursor: pointer; 
            -webkit-appearance: none; 
            appearance: none; 
        }
        .select-wrapper::after {
            content: '▼';
            font-size: 8px;
            color: var(--neon);
            position: absolute;
            right: 6px;
            pointer-events: none;
        }

        .action-grid-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin-bottom: 6px; 
            width: 100%;
        }
        .action-bottom-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }
        
        .ctrl-btn {
            color: white;
            font-weight: bold;
            border-radius: 10px;
            height: 40px; 
            font-size: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-sizing: border-box;
            width: 100%;
        }

        .btn-play-mix { background: var(--btn-play); }
        .file-lbl-mix { background: var(--btn-open); margin: 0; }
        .btn-ai-mix { background: var(--btn-red); }
        .btn-ai-mix::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            flex-shrink: 0;
        }
        .btn-reset-mix { background: var(--btn-reset); }
        .btn-folder-mix { background: var(--btn-folder); }
        .btn-snapshot-mix { background: var(--btn-snap); }

        /* 🆕 결과 보드 확장: 4칸 레이아웃으로 지면접촉시간(GCT) 상시 연동 추가 */
        .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        
        .res-card { 
            background: var(--card-bg); 
            padding: 8px 2px; 
            border-radius: 12px; 
            border-left: 3px solid var(--neon); 
            border-top: 1px solid rgba(187, 242, 70, 0.2);
            text-align: center; 
            box-sizing: border-box; 
        }
        .res-card.highlight-card {
            border-left-color: var(--blue);
        }
        .res-label { font-size: 10px; color: #8e8e93; display: block; margin-bottom: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .res-val { font-size: 14px; font-weight: bold; color: var(--neon); display: block; }
        .res-card.highlight-card .res-val { color: var(--blue); }
        .ref-text { color: #ffcc00; font-size: 9px; display: block; margin-top: 2px; font-weight: 500; }

        input[type="file"] { display: none; }

        /* ================================================================= */
        /* [레이아웃 보존 및 확장] 모달 & 커스텀 컨펌 스타일링                   */
        /* ================================================================= */
        .gallery-panel-modal {
            display: none;
            position: fixed;
            z-index: 150;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            flex-direction: column;
            align-items: center;
            padding: 20px 14px;
            box-sizing: border-box;
        }
        .gallery-header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 10px;
        }
        .gallery-title {
            color: var(--neon);
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
        .gallery-close-text {
            color: #e5e5ea;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #252428;
            padding: 6px 14px;
            border-radius: 8px;
        }
        #innerGallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
            overflow-y: auto;
            flex: 1;
            align-content: flex-start;
            padding-bottom: 20px;
        }
        .inner-thumb {
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2c2c2e;
            background: #1c1b1f;
            position: relative;
        }
        .inner-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 200; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.98); 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
        }
        .modal img { 
            max-width: 95%; 
            max-height: 75%; 
            border-radius: 8px; 
            object-fit: contain;
        }
        .modal-controls {
            position: absolute;
            top: 24px;
            right: 16px;
            display: flex;
            gap: 12px;
            z-index: 210;
        }
        .text-btn {
            background: rgba(37, 36, 40, 0.9);
            color: white;
            border: 1px solid #3a3a3c;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .text-btn.danger {
            color: #ff453a;
            border-color: rgba(255, 69, 58, 0.4);
        }

        .custom-confirm-overlay {
            display: none;
            position: fixed;
            z-index: 300;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
        }
        .custom-confirm-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon);
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 15px rgba(187, 242, 70, 0.15);
        }
        .confirm-msg {
            font-size: 14px;
            color: #fff;
            line-height: 1.5;
            margin: 0 0 20px 0;
            font-weight: 500;
        }
        .confirm-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .confirm-btn {
            height: 38px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .confirm-btn.yes {
            background: var(--btn-red);
            color: white;
        }
        .confirm-btn.no {
            background: #3a3a3c;
            color: #e5e5ea;
        }
    </style>
</head>
<body>

    <h3 class="main-title">PRO ANALYSIS <span>v4.0</span></h3>

    <div class="video-box">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="videoTimeOverlay" class="video-time-overlay">0.00s</div>
    </div>

    <div class="timeline-box">
        <input type="range" id="videoTimeline" class="video-timeline" min="0" value="0" step="0.001" oninput="AppControl.onTimelineDrag(this.value)">
    </div>

    <div class="control-panel">
        <div class="precision-step-row">
            <button class="btn-precision" onclick="AppControl.stepTime(-0.03)">◀ -0.03s</button>
            <button class="btn-precision" onclick="AppControl.stepTime(-0.01)">◀ -0.01s</button>
            <button class="btn-precision" onclick="AppControl.stepTime(0.01)">0.01s ▶</button>
            <button class="btn-precision" onclick="AppControl.stepTime(0.03)">0.03s ▶</button>
        </div>

        <div class="marking-action-row">
            <button id="btnAutoMark" class="btn-marking" onclick="AppControl.toggleAutoMode()">🤖 자동</button>
            <button class="btn-marking" onclick="AppControl.markTimestamp('contact')">🦶 접촉</button>
            <button class="btn-marking" onclick="AppControl.markTimestamp('takeoff')">👟 이탈</button>
            <div class="select-wrapper">
                <select id="speedSelect" class="custom-select" onchange="AppControl.changeSpeed(this.value)">
                    <option value="0.05">0.05x</option>
                    <option value="0.1">0.1x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1.0" selected>1.0x (Normal)</option>
                </select>
            </div>
        </div>

        <div class="action-grid-row">
            <button class="ctrl-btn btn-play-mix" id="btnPlay" onclick="AppControl.togglePlay()">▶ Play</button>
            <label class="ctrl-btn file-lbl file-lbl-mix">📁 Open Video <input type="file" id="up" accept="video/*" onchange="AppControl.loadVideo(event)"></label>
            <button class="ctrl-btn btn-ai-mix" id="btnAiToggle" onclick="AppControl.toggleAI()">AI OFF</button>
        </div>
        
        <div class="action-bottom-row">
            <button class="ctrl-btn btn-reset-mix" onclick="AppControl.resetAll()">🔄 Reset</button>
            <button class="ctrl-btn btn-folder-mix" onclick="AppStorage.openGalleryPanel()">📁 Gallery</button>
            <button class="ctrl-btn btn-snapshot-mix" onclick="AppStorage.captureSnapshot()">📸 Snapshot</button>
        </div>
        
        <div class="result-grid" id="res">
            <div class="res-card"><span class="res-label">Knee</span><span class="res-val" id="valKnee">--°</span><span class="ref-text">160-170°</span></div>
            <div class="res-card"><span class="res-label">Elbow</span><span class="res-val" id="valElbow">--°</span><span class="ref-text">80-90°</span></div>
            <div class="res-card"><span class="res-label">Torso</span><span class="res-val" id="valBody">--°</span><span class="ref-text">5-10°</span></div>
            <div class="res-card highlight-card"><span class="res-label">GCT (접촉)</span><span class="res-val" id="valGCT">-- ms</span><span class="ref-text">180-220ms</span></div>
        </div>
    </div>

    <div id="galleryModal" class="gallery-panel-modal">
        <div class="gallery-header">
            <span class="gallery-title">MY SNAPSHOTS 📁</span>
            <span class="gallery-close-text" onclick="AppStorage.closeGalleryPanel()">닫기</span>
        </div>
        <div id="innerGallery"></div>
    </div>

    <div id="imgModal" class="modal">
        <div class="modal-controls">
            <button class="text-btn danger" onclick="AppStorage.triggerCustomConfirm()">삭제</button>
            <button class="text-btn" onclick="AppStorage.closeModal()">닫기</button>
        </div>
        <img id="modalImg" src="">
    </div>

    <div id="customConfirm" class="custom-confirm-overlay">
        <div class="custom-confirm-box">
            <p class="confirm-msg">이 스냅샷을 창고 방에서<br>영구 삭제할까요?</p>
            <div class="confirm-buttons">
                <button class="confirm-btn yes" onclick="AppStorage.executeDelete()">삭제</button>
                <button class="confirm-btn no" onclick="AppStorage.cancelDelete()">취소</button>
            </div>
        </div>
    </div>

    <script>
        // [방 0. 전역 캐시 룸] DOM 엘리먼트 참조 변수 정의
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d');
        const btnPlay = document.getElementById('btnPlay');
        const btnAiToggle = document.getElementById('btnAiToggle');
        const speedSelect = document.getElementById('speedSelect');
        const timeline = document.getElementById('videoTimeline');
        const timeOverlay = document.getElementById('videoTimeOverlay');
        const valGCT = document.getElementById('valGCT');
        const btnAutoMark = document.getElementById('btnAutoMark');

        // [방 1. CoreAI 룸] AI 트래킹 및 각도 계산 로직 격리 (로직 원본보존법칙 완벽 유지)
        const CoreAI = {
            aiTracking: false, 
            isAiProcessing: false,
            curKnee: "--°",
            curElbow: "--°",
            curBody: "--°",
            lastJoints: { knee: null, elbow: null, hip: null },
            instance: null,

            init() {
                this.instance = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                this.instance.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
                this.instance.onResults(this.onResults.bind(this));
            },

            async runStableAI() {
                if (!v.videoWidth || !v.videoHeight || this.isAiProcessing || !this.aiTracking) return; 
                try {
                    this.isAiProcessing = true;
                    if(c.width !== v.videoWidth || c.height !== v.videoHeight) {
                        c.width = v.videoWidth; c.height = v.videoHeight;
                    }
                    await this.instance.send({image: v});
                } catch(err) {
                    console.log("Frame Skip");
                } finally {
                    this.isAiProcessing = false;
                }
            },

            onResults(res) {
                ctx.clearRect(0, 0, c.width, c.height);
                if (!res.poseLandmarks || !this.aiTracking) return;
                
                drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, {color: '#deff9a', lineWidth: 3});
                const lm = res.poseLandmarks;
                
                this.curKnee = this.calcAngle(lm[24], lm[26], lm[28]) + "°"; 
                this.curElbow = this.calcAngle(lm[12], lm[14], lm[16]) + "°";
                this.curBody = (Math.abs(Math.atan2(lm[24].x - lm[12].x, lm[24].y - lm[12].y) * 180 / Math.PI)).toFixed(1) + "°";
                
                document.getElementById('valKnee').innerText = this.curKnee;
                document.getElementById('valElbow').innerText = this.curElbow;
                document.getElementById('valBody').innerText = this.curBody;

                this.lastJoints.knee = { x: lm[26].x * c.width, y: lm[26].y * c.height };
                this.lastJoints.elbow = { x: lm[14].x * c.width, y: lm[14].y * c.height };
                this.lastJoints.hip = { x: lm[24].x * c.width, y: lm[24].y * c.height };
            },

            calcAngle(p1, p2, p3) {
                const a = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
                let ang = Math.abs(a * 180 / Math.PI);
                if (ang > 180) ang = 360 - ang;
                return ang.toFixed(1);
            }
        };

        // [방 2. AppControl 룸] 비디오 타임 제어 및 마킹 동기화 인터록 격리
        const AppControl = {
            playLoopId: null, 
            isAutoMode: false,
            contactTime: null, // 접촉 마킹 시간 캐시 캐비닛
            takeoffTime: null, // 이탈 마킹 시간 캐시 캐비닛

            initEvents() {
                v.ontimeupdate = () => {
                    if(v.duration) {
                        timeline.value = v.currentTime;
                        // 🎬 영상 우측 하단 오버레이 시간 실시간 업데이트 연동 (.2f 소수점 두자리 초)
                        timeOverlay.innerText = v.currentTime.toFixed(2) + "s";
                    }
                };
            },

            // 🆕 [자동] 기능 토글용 임시 스위치 룸 (구조 유지용 확장 스켈레톤)
            toggleAutoMode() {
                this.isAutoMode = !this.isAutoMode;
                if(this.isAutoMode) {
                    btnAutoMark.classList.add('active-auto');
                    btnAutoMark.innerText = "🤖 ON";
                } else {
                    btnAutoMark.classList.remove('active-auto');
                    btnAutoMark.innerText = "🤖 자동";
                }
            },

            // 🆕 [접촉] 및 [이탈] 폼 타임스탬프 스냅 마킹 및 절대 역전 방지 제어 로직
            markTimestamp(type) {
                const cur = v.currentTime;
                
                if (type === 'contact') {
                    // 역전 방지 제한 조건: 이미 마킹된 이탈 시간보다 뒤일 수 없음
                    if (this.takeoffTime !== null && cur > this.takeoffTime) {
                        this.takeoffTime = cur; // 충돌 방지를 위해 이탈 지점도 같이 당겨줌
                    }
                    this.contactTime = cur;
                } else if (type === 'takeoff') {
                    // 역전 방지 제한 조건: 이미 마킹된 접촉 시간보다 앞설 수 없음
                    if (this.contactTime !== null && cur < this.contactTime) {
                        this.contactTime = cur; // 충돌 방지를 위해 접촉 지점도 같이 밀어줌
                    }
                    this.takeoffTime = cur;
                }

                this.calculateGCT();
            },

            // 🆕 두 볼(마킹 캐시) 간격 기반 지면접촉시간 밀리초 단위 자동 연산 룸
            calculateGCT() {
                if (this.contactTime !== null && this.takeoffTime !== null) {
                    const diffMs = Math.round((this.takeoffTime - this.contactTime) * 1000);
                    valGCT.innerText = `${diffMs} ms`;
                } else {
                    valGCT.innerText = `-- ms`;
                }
            },

            loadVideo(e) {
                const file = e.target.files[0];
                if(!file) return;
                v.src = URL.createObjectURL(file);
                v.onloadedmetadata = () => {
                    timeline.max = v.duration;
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    
                    v.currentTime = 0;
                    timeline.value = 0;
                    timeOverlay.innerText = "0.00s";
                    ctx.clearRect(0, 0, c.width, c.height); 
                    
                    // 내부 마킹 데이터 전면 리셋
                    AppControl.contactTime = null;
                    AppControl.takeoffTime = null;
                    valGCT.innerText = `-- ms`;
                    
                    v.onseeked = () => {
                        v.currentTime = 0;
                        timeline.value = 0;
                        v.onseeked = null; 
                    };
                    
                    if(CoreAI.aiTracking) {
                        setTimeout(() => { CoreAI.runStableAI(); }, 150);
                    }
                };
            },

            syncPlayAI() {
                if (v.paused || !CoreAI.aiTracking) {
                    cancelAnimationFrame(this.playLoopId);
                    return;
                }
                CoreAI.runStableAI();
                this.playLoopId = requestAnimationFrame(() => this.syncPlayAI());
            },

            togglePlay() {
                if (v.paused) {
                    v.playbackRate = parseFloat(speedSelect.value);
                    v.play();
                    btnPlay.innerText = "⏸ Pause";
                    
                    if (CoreAI.aiTracking) {
                        this.syncPlayAI();
                    }
                } else {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId); 
                    setTimeout(() => { CoreAI.runStableAI(); }, 50);
                }
            },

            stepTime(amount) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId); 
                }
                v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + amount));
                timeline.value = v.currentTime;
                timeOverlay.innerText = v.currentTime.toFixed(2) + "s";
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },

            onTimelineDrag(val) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    cancelAnimationFrame(this.playLoopId); 
                }
                v.currentTime = parseFloat(val);
                timeOverlay.innerText = v.currentTime.toFixed(2) + "s";
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },

            changeSpeed(val) {
                v.playbackRate = parseFloat(val);
            },

            toggleAI() {
                CoreAI.aiTracking = !CoreAI.aiTracking;
                btnAiToggle.innerText = CoreAI.aiTracking ? "AI ON" : "AI OFF";
                btnAiToggle.style.background = CoreAI.aiTracking ? "#30D158" : "#FF453A";
                
                if(!CoreAI.aiTracking) {
                    cancelAnimationFrame(this.playLoopId); 
                    ctx.clearRect(0, 0, c.width, c.height);
                    CoreAI.lastJoints = { knee: null, elbow: null, hip: null };
                    document.getElementById('valKnee').innerText = "--°";
                    document.getElementById('valElbow').innerText = "--°";
                    document.getElementById('valBody').innerText = "--°";
                } else {
                    if(v.paused) {
                        CoreAI.runStableAI();
                    } else {
                        this.syncPlayAI(); 
                    }
                }
            },

            // 🆕 고도화 리셋: 리셋 시 0초가 아닌 오빠가 마킹한 [왼쪽 볼(접촉 지점)] 타임라인 위치로 순간 이동 연동!
            resetAll() {
                v.pause();
                btnPlay.innerText = "▶ Play";
                cancelAnimationFrame(this.playLoopId); 
                
                // 만약 접촉(왼쪽 볼) 마킹 기록이 있다면 거기로 가고, 없으면 영상의 최초 0초 지점으로 기동 점프!
                const targetJumpTime = (this.contactTime !== null) ? this.contactTime : 0;
                
                v.currentTime = targetJumpTime;
                timeline.value = targetJumpTime;
                timeOverlay.innerText = targetJumpTime.toFixed(2) + "s";
                
                ctx.clearRect(0, 0, c.width, c.height);
                document.getElementById('innerGallery').innerHTML = "";
                document.getElementById('valKnee').innerText = "--°";
                document.getElementById('valElbow').innerText = "--°";
                document.getElementById('valBody').innerText = "--°";
                
                setTimeout(() => { CoreAI.runStableAI(); }, 50);
            }
        };

        // [방 3. AppStorage 룸] 스냅샷 아카이브 및 2단계 모달/커스텀 컨펌 관리 격리 (원본 레이아웃 및 동작 100% 보존)
        const AppStorage = {
            targetThumbBox: null, 

            captureSnapshot() {
                if (!v.videoWidth || !v.videoHeight) return alert("비디오 리소스가 준비되지 않았습니다.");
                
                const tempC = document.createElement('canvas');
                const tCtx = tempC.getContext('2d');
                tempC.width = v.videoWidth; tempC.height = v.videoHeight;
                
                tCtx.drawImage(v, 0, 0, tempC.width, tempC.height);
                tCtx.drawImage(c, 0, 0, tempC.width, tempC.height);
                
                tCtx.fillStyle = "#deff9a"; 
                const fontSize = Math.max(14, tempC.width * 0.03);
                tCtx.font = `bold ${fontSize}px sans-serif`;
                tCtx.shadowColor = "black"; tCtx.shadowBlur = 4;

                if (CoreAI.lastJoints.knee && CoreAI.curKnee !== "--°") tCtx.fillText(`Knee ${CoreAI.curKnee}`, CoreAI.lastJoints.knee.x + 15, CoreAI.lastJoints.knee.y);
                if (CoreAI.lastJoints.elbow && CoreAI.curElbow !== "--°") tCtx.fillText(`Elbow ${CoreAI.curElbow}`, CoreAI.lastJoints.elbow.x + 15, CoreAI.lastJoints.elbow.y);
                if (CoreAI.lastJoints.hip && CoreAI.curBody !== "--°") tCtx.fillText(`Torso ${CoreAI.curBody}`, CoreAI.lastJoints.hip.x - (fontSize * 4), CoreAI.lastJoints.hip.y - 15);

                const imgData = tempC.toDataURL('image/jpeg', 0.9);
                this.renderThumbnail(imgData);
            },

            renderThumbnail(src) {
                const gal = document.getElementById('innerGallery');
                const box = document.createElement('div');
                box.className = "inner-thumb";
                
                const img = document.createElement('img');
                img.src = src;
                img.onclick = () => this.openModal(src, box); 
                
                box.appendChild(img);
                gal.insertBefore(box, gal.firstChild); 
            },

            openGalleryPanel() {
                document.getElementById('galleryModal').style.display = "flex";
            },

            closeGalleryPanel() {
                document.getElementById('galleryModal').style.display = "none";
            },

            openModal(src, thumbBoxPointer) {
                this.targetThumbBox = thumbBoxPointer; 
                const modal = document.getElementById('imgModal');
                modal.style.display = "flex";
                document.getElementById('modalImg').src = src;
            },

            closeModal() {
                document.getElementById('imgModal').style.display = "none";
                this.targetThumbBox = null;
            },

            triggerCustomConfirm() {
                document.getElementById('customConfirm').style.display = "flex";
            },

            cancelDelete() {
                document.getElementById('customConfirm').style.display = "none";
            },

            executeDelete() {
                document.getElementById('customConfirm').style.display = "none";
                if (this.targetThumbBox) {
                    this.targetThumbBox.remove();
                }
                this.closeModal();
            }
        };

        // 각 객체 룸 세팅 완료 후 이벤트를 실행 바인딩합니다.
        CoreAI.init();
        AppControl.initEvents();
    </script>
</body>
</html>
