<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Analysis v3.0 - Perfect Video Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    
    <style>
        :root { 
            --neon: #bbf246; 
            --blue: #007AFF; 
            --bg: #000000; 
            --panel-bg: #121212;
            --card-bg: #1c1b1f;
            --input-bg: #252428;
            --btn-red: #ff3b30;
        }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 16px 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden; 
            box-sizing: border-box; 
        }
        
        /* 최상단 타이틀 디자인 */
        .main-title { 
            color: var(--neon); 
            margin: 0px 0 16px 0; 
            font-size: 20px; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            text-align: center;
        }
        .main-title span { 
            font-weight: 300; 
            color: #fff; 
            opacity: 0.5; 
            font-size: 16px;
        }

        /* 비디오 스크린 프레임 상단 고정 크기 */
        .video-box { 
            position: relative; 
            width: 100%; 
            max-width: 500px; 
            background: #000; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px;
            overflow: hidden; 
            aspect-ratio: 16/10; 
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* 비디오 밑 타임라인 컨테이너 */
        .timeline-box {
            width: 100%;
            max-width: 500px;
            background: #000;
            padding: 4px 16px 12px 16px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-sizing: border-box;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
        }
        /* 모던 타임라인 슬라이더 디자인 */
        .video-timeline {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            cursor: pointer;
            margin: 0;
        }
        .video-timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .video-timeline::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 메인 패널 베이스 */
        .control-panel { 
            background: var(--panel-bg); 
            padding: 14px; 
            border-radius: 28px; 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box; 
            position: relative; 
        }
        
        /* 상단 제어 행 (왼쪽 재생 / 오른쪽 수동 조절 분할) */
        .top-ctrl-split-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
            margin-bottom: 14px;
            width: 100%;
        }
        /* 왼쪽 작은 플레이 버튼 */
        .btn-play-small {
            background: #252428;
            color: white;
            border: 1px solid #2c2c2e;
            font-size: 15px;
            font-weight: bold;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 오른쪽 초 단위 수동 제어 그룹 (0.1초 단위 보정) */
        .manual-step-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #252428;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 2px;
            box-sizing: border-box;
        }
        .btn-manual-step {
            background: transparent;
            color: #e5e5ea;
            border: none;
            font-size: 13px;
            font-weight: bold;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-manual-step:active {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        /* 타임 세팅 행 포맷 - 모바일 잘림 방지 1fr 균등 분할 */
        .time-input-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin-bottom: 14px; 
            width: 100%;
        }
        .input-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .input-group span { font-size: 11px; color: #8e8e93; font-weight: 500; padding-left: 2px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        input[type="number"], .select-wrapper { 
            background: var(--input-bg); 
            color: #e5e5ea; 
            border: 1px solid #2c2c2e; 
            padding: 0 4px; 
            border-radius: 12px; 
            font-size: 13px; 
            height: 44px; 
            text-align: center; 
            box-sizing: border-box; 
            font-weight: bold; 
            width: 100%;
        }
        
        /* 커스텀 셀렉트 스타일 */
        .select-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0;
        }
        .custom-select { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            color: var(--neon); 
            border: none; 
            font-size: 13px; 
            font-weight: bold; 
            text-align: center; 
            text-align-last: center; 
            padding-right: 10px;
            cursor: pointer; 
            -webkit-appearance: none; 
            appearance: none; 
        }
        .select-wrapper::after {
            content: '▼';
            font-size: 8px;
            color: var(--neon);
            position: absolute;
            right: 8px;
            pointer-events: none;
        }

        /* 중앙 기능 버튼 3분할 구조 */
        .mid-btn-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin-bottom: 14px; 
            width: 100%;
        }
        
        .file-lbl { 
            background: var(--input-bg); 
            color: white; 
            font-weight: bold; 
            border-radius: 12px; 
            height: 46px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 2px;
            font-size: 11px; 
            cursor: pointer; 
            border: 1px solid #2c2c2e;
            box-sizing: border-box;
        }
        
        .btn-ai { 
            background: var(--btn-red); 
            color: white; 
            font-weight: bold; 
            border-radius: 12px; 
            height: 46px; 
            font-size: 11px; 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px;
            box-sizing: border-box;
            padding: 0 4px;
        }
        .btn-ai::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            flex-shrink: 0;
        }
        
        .btn-reset { 
            background: var(--btn-red); 
            color: white; 
            font-weight: bold; 
            border-radius: 12px; 
            height: 46px; 
            font-size: 11px; 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 2px;
            box-sizing: border-box;
        }

        /* 하단 단독 배치 대형 주요 동작 파랑 버튼 라인 */
        .btn-snapshot { 
            background: var(--blue); 
            color: white; 
            border-radius: 14px; 
            border: none; 
            width: 100%; 
            height: 50px; 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 16px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
        }
        
        /* 분석 계측 판넬 보드 스타일 고도화 */
        .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        
        .res-card { 
            background: var(--card-bg); 
            padding: 12px 4px; 
            border-radius: 14px; 
            border-left: 4px solid var(--neon); 
            border-top: 1px solid rgba(187, 242, 70, 0.2);
            text-align: center; 
            box-sizing: border-box; 
        }
        .res-label { font-size: 11px; color: #8e8e93; display: block; margin-bottom: 4px; }
        .res-val { font-size: 18px; font-weight: bold; color: var(--neon); display: block; }
        .ref-text { color: #ffcc00; font-size: 10px; display: block; margin-top: 4px; font-weight: 500; }

        /* 데이터 하단 저장 갤러리 랙 */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; width: 100%; max-width: 500px; margin-top: 16px; }
        .thumb { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        input[type="file"] { display: none; }

        /* 팝업 모달창 스펙 */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal img { max-width: 95%; max-height: 85%; border-radius: 8px; }
    </style>
</head>
<body>

    <h3 class="main-title">PRO ANALYSIS <span>v3.0</span></h3>

    <div class="video-box">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="timeline-box">
        <input type="range" id="videoTimeline" class="video-timeline" min="0" value="0" step="0.001" oninput="AppControl.onTimelineDrag(this.value)">
    </div>

    <div class="control-panel">
        <div class="top-ctrl-split-row">
            <button class="btn-play-small" id="btnPlay" onclick="AppControl.togglePlay()">▶ Play</button>
            <div class="manual-step-group">
                <button class="btn-manual-step" onclick="AppControl.stepTime(-0.1)">◀ -0.1s</button>
                <button class="btn-manual-step" onclick="AppControl.stepTime(0.1)">0.1s ▶</button>
            </div>
        </div>

        <div class="time-input-row">
            <div class="input-group">
                <span>Start (s)</span>
                <input type="number" id="inStart" value="0.0000" step="0.1">
            </div>
            <div class="input-group">
                <span>End (s)</span>
                <input type="number" id="inEnd" value="0.0000" step="0.1">
            </div>
            <div class="input-group">
                <span>Speed</span>
                <div class="select-wrapper">
                    <select id="speedSelect" class="custom-select" onchange="AppControl.changeSpeed(this.value)">
                        <option value="0.05">0.05x</option>
                        <option value="0.1">0.1x</option>
                        <option value="0.25">0.25x</option>
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="mid-btn-row">
            <label class="file-lbl">📁 Open Video <input type="file" id="up" accept="video/*" onchange="AppControl.loadVideo(event)"></label>
            <button class="btn-ai" id="btnAiToggle" onclick="AppControl.toggleAI()">AI OFF</button>
            <button class="btn-reset" onclick="AppControl.resetAll()">🔄 Reset</button>
        </div>
        
        <button class="btn-snapshot" onclick="AppStorage.captureSnapshot()">📸 Save Analysis Snapshot</button>

        <div class="result-grid" id="res">
            <div class="res-card"><span class="res-label">Knee</span><span class="res-val" id="valKnee">--°</span><span class="ref-text">160-170°</span></div>
            <div class="res-card"><span class="res-label">Elbow</span><span class="res-val" id="valElbow">--°</span><span class="ref-text">80-90°</span></div>
            <div class="res-card"><span class="res-label">Torso</span><span class="res-val" id="valBody">--°</span><span class="ref-text">5-10°</span></div>
        </div>
    </div>

    <div id="gallery"></div>

    <div id="imgModal" class="modal" onclick="AppStorage.closeModal()">
        <img id="modalImg" src="">
    </div>

    <script>
        const v = document.getElementById('video');
        const c = document.getElementById('canvas');
        const ctx = c.getContext('2d');
        const inS = document.getElementById('inStart');
        const inE = document.getElementById('inEnd');
        const btnPlay = document.getElementById('btnPlay');
        const btnAiToggle = document.getElementById('btnAiToggle');
        const speedSelect = document.getElementById('speedSelect');
        const timeline = document.getElementById('videoTimeline');
    </script>

    <script>
        // ==========================================
        // [2번 방] MediaPipe & AI Core 데이터 처리 서랍 (100% 로직 유지)
        // ==========================================
        const CoreAI = {
            aiTracking: true,
            isAiProcessing: false,
            curKnee: "--°",
            curElbow: "--°",
            curBody: "--°",
            lastJoints: { knee: null, elbow: null, hip: null },
            instance: null,

            init() {
                this.instance = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
                this.instance.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
                this.instance.onResults(this.onResults.bind(this));
            },

            async runStableAI() {
                if (!v.videoWidth || !v.videoHeight || this.isAiProcessing) return;
                try {
                    this.isAiProcessing = true;
                    if(c.width !== v.videoWidth || c.height !== v.videoHeight) {
                        c.width = v.videoWidth; c.height = v.videoHeight;
                    }
                    await this.instance.send({image: v});
                } catch(err) {
                    console.log("Frame Skip Event");
                } finally {
                    this.isAiProcessing = false;
                }
            },

            onResults(res) {
                ctx.clearRect(0, 0, c.width, c.height);
                if (!res.poseLandmarks || !this.aiTracking) return;
                
                drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, {color: '#deff9a', lineWidth: 3});
                const lm = res.poseLandmarks;
                
                this.curKnee = this.calcAngle(lm[24], lm[26], lm[28]) + "°"; 
                this.curElbow = this.calcAngle(lm[12], lm[14], lm[16]) + "°";
                this.curBody = (Math.abs(Math.atan2(lm[24].x - lm[12].x, lm[24].y - lm[12].y) * 180 / Math.PI)).toFixed(1) + "°";
                
                document.getElementById('valKnee').innerText = this.curKnee;
                document.getElementById('valElbow').innerText = this.curElbow;
                document.getElementById('valBody').innerText = this.curBody;

                this.lastJoints.knee = { x: lm[26].x * c.width, y: lm[26].y * c.height };
                this.lastJoints.elbow = { x: lm[14].x * c.width, y: lm[14].y * c.height };
                this.lastJoints.hip = { x: lm[24].x * c.width, y: lm[24].y * c.height };
            },

            calcAngle(p1, p2, p3) {
                const a = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
                let ang = Math.abs(a * 180 / Math.PI);
                if (ang > 180) ang = 360 - ang;
                return ang.toFixed(1);
            }
        };

        CoreAI.init();
    </script>

    <script>
        // ==========================================
        // [3번 방] UI Event & Video Control 로직 서랍 (자동재생 시 연산 패스 제어 추가)
        // ==========================================
        const AppControl = {
            initEvents() {
                inS.oninput = () => {
                    let val = parseFloat(inS.value) || 0;
                    if(val < 0) val = 0;
                    v.currentTime = val;
                    if(v.paused) CoreAI.runStableAI(); // 멈춘 상태에서 시간 조절 입력 시 연산 작동
                };

                inE.oninput = () => {
                    let val = parseFloat(inE.value) || v.duration;
                    v.currentTime = val;
                    if(v.paused) CoreAI.runStableAI(); // 멈춘 상태에서 시간 조절 입력 시 연산 작동
                };

                v.ontimeupdate = () => {
                    const startTime = parseFloat(inS.value) || 0;
                    const endTime = parseFloat(inE.value) || v.duration;
                    
                    if (v.currentTime >= endTime || v.currentTime < startTime) {
                        v.currentTime = startTime;
                    }

                    if(v.duration) {
                        timeline.value = v.currentTime;
                    }
                    
                    // [핵심 변경] 비디오가 일반 Play 중일 때는 스켈레톤 연산을 완전히 패스(Skip)하여 부하 해제
                    // 오직 일시정지(수동 모드)일 때 일어나는 다른 이벤트에서만 연산을 명시적으로 호출합니다.
                };
            },

            loadVideo(e) {
                const file = e.target.files[0];
                if(!file) return;
                v.src = URL.createObjectURL(file);
                v.onloadedmetadata = () => {
                    inE.max = v.duration;
                    timeline.max = v.duration;
                    inS.value = "0.0000";
                    inE.value = v.duration.toFixed(4);
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    v.currentTime = 0;
                    timeline.value = 0;
                    
                    // 비디오 로드 시 정지 상태이므로 최초 1회 분석 스케치 작동
                    setTimeout(() => { CoreAI.runStableAI(); }, 300);
                };
            },

            togglePlay() {
                if (v.paused) {
                    const startTime = parseFloat(inS.value) || 0;
                    if (v.currentTime < startTime || v.currentTime >= (parseFloat(inE.value) || v.duration)) {
                        v.currentTime = startTime;
                    }
                    
                    // 재생 시작 시 화면 클리어 (재생 중에는 스켈레톤 비표시)
                    ctx.clearRect(0, 0, c.width, c.height);
                    
                    v.playbackRate = parseFloat(speedSelect.value);
                    v.play();
                    btnPlay.innerText = "⏸ Pause";
                } else {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                    // 멈추는 순간 그 자리에 딱 멈춘 프레임의 관절 스켈레톤과 수치를 즉시 역추적 연산
                    setTimeout(() => { CoreAI.runStableAI(); }, 50);
                }
            },

            // 수동 0.1초 조절 제어 트리거
            stepTime(amount) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                }
                v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + amount));
                timeline.value = v.currentTime;
                
                // 정지 상태에서 초 단위 수동 탐색할 때만 정밀 포즈 분석 작동
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },

            // 타임라인 드래그 제어 트리거
            onTimelineDrag(val) {
                if (!v.paused) {
                    v.pause();
                    btnPlay.innerText = "▶ Play";
                }
                v.currentTime = parseFloat(val);
                // 타임라인 수동 탐색할 때만 정밀 포즈 분석 작동
                setTimeout(() => { CoreAI.runStableAI(); }, 40);
            },

            changeSpeed(val) {
                v.playbackRate = parseFloat(val);
            },

            toggleAI() {
                CoreAI.aiTracking = !CoreAI.aiTracking;
                btnAiToggle.innerText = CoreAI.aiTracking ? "AI ON" : "AI OFF";
                btnAiToggle.style.background = CoreAI.aiTracking ? "#30D158" : "#FF453A";
                if(!CoreAI.aiTracking) {
                    ctx.clearRect(0, 0, c.width, c.height);
                    CoreAI.lastJoints = { knee: null, elbow: null, hip: null };
                } else if(v.paused) {
                    CoreAI.runStableAI();
                }
            },

            manualRunAI() {
                if(!CoreAI.aiTracking) return alert("AI ON 상태에서만 수동 연산이 가능합니다.");
                CoreAI.runStableAI();
            },

            resetAll() {
                v.pause();
                btnPlay.innerText = "▶ Play";
                v.currentTime = parseFloat(inS.value) || 0;
                timeline.value = parseFloat(inS.value) || 0;
                ctx.clearRect(0,0,c.width,c.height);
                document.getElementById('gallery').innerHTML = "";
                document.getElementById('valKnee').innerText = "--°";
                document.getElementById('valElbow').innerText = "--°";
                document.getElementById('valBody').innerText = "--°";
                setTimeout(() => { CoreAI.runStableAI(); }, 50);
            }
        };

        AppControl.initEvents();
    </script>

    <script>
        // ==========================================
        // [4번 방] Storage & Snapshot 데이터 처리 서랍 (100% 원본 보존)
        // ==========================================
        const AppStorage = {
            captureSnapshot() {
                if (!v.videoWidth || !v.videoHeight) return alert("비디오 리소스가 준비되지 않았습니다.");
                
                const tempC = document.createElement('canvas');
                const tCtx = tempC.getContext('2d');
                tempC.width = v.videoWidth; tempC.height = v.videoHeight;
                
                tCtx.drawImage(v, 0, 0, tempC.width, tempC.height);
                tCtx.drawImage(c, 0, 0, tempC.width, tempC.height);
                
                tCtx.fillStyle = "#deff9a"; 
                const fontSize = Math.max(14, tempC.width * 0.03);
                tCtx.font = `bold ${fontSize}px sans-serif`;
                tCtx.shadowColor = "black"; tCtx.shadowBlur = 4;

                if (CoreAI.lastJoints.knee && CoreAI.curKnee !== "--°") tCtx.fillText(`Knee ${CoreAI.curKnee}`, CoreAI.lastJoints.knee.x + 15, CoreAI.lastJoints.knee.y);
                if (CoreAI.lastJoints.elbow && CoreAI.curElbow !== "--°") tCtx.fillText(`Elbow ${CoreAI.curElbow}`, CoreAI.lastJoints.elbow.x + 15, CoreAI.lastJoints.elbow.y);
                if (CoreAI.lastJoints.hip && CoreAI.curBody !== "--°") tCtx.fillText(`Torso ${CoreAI.curBody}`, CoreAI.lastJoints.hip.x - (fontSize * 4), CoreAI.lastJoints.hip.y - 15);

                const imgData = tempC.toDataURL('image/jpeg', 0.9);
                this.renderThumbnail(imgData);
            },

            renderThumbnail(src) {
                const gal = document.getElementById('gallery');
                const box = document.createElement('div');
                box.className = "thumb";
                
                const img = document.createElement('img');
                img.src = src;
                img.onclick = () => this.openModal(src);
                
                box.appendChild(img);
                gal.insertBefore(box, gal.firstChild);
            },

            openModal(src) {
                const modal = document.getElementById('imgModal');
                modal.style.display = "flex";
                document.getElementById('modalImg').src = src;
            },

            closeModal() {
                document.getElementById('imgModal').style.display = "none";
            }
        };
    </script>
</body>
</html>
