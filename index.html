<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.30</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .auto-pause-label { 
            position: absolute; top: 5px; left: 10px; font-size: 10px; color: var(--danger); 
            font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; z-index: 5;
        }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        
        /* 히스토리 상단 탭 4개 복구 */
        .history-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { padding: 10px 0; border: none; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }

        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .h-dist, .h-time { font-size: 18px; font-weight: 700; color: #ffffff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #888; font-weight: 800; }
        .h-det-val { font-size: 14px; font-weight: 600; color: #ddd; }
        
        .text-route-link { color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; background: none; border: none; padding: 0; }

        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; }
        #detail-map { height: 50%; width: 100%; border-bottom: 2px solid var(--primary); }
        #detail-data { height: 50%; width: 100%; overflow-y: auto; padding: 20px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .detail-card { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #222; }
        .detail-label { color: var(--text-dim); font-size: 10px; font-weight: 800; margin-bottom: 4px; }
        .detail-value { color: var(--primary); font-size: 18px; font-weight: 900; }
        .close-detail { position: absolute; top: 15px; right: 15px; z-index: 10001; background: rgba(0,255,136,0.2); color: var(--primary); border: 1px solid var(--primary); border-radius: 50%; width: 36px; height: 36px; font-weight: bold; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
        
        .btn-dim { position: absolute; top: 12px; right: 12px; width: 52px; height: 52px; background: #1a1a1a; color: #777; border: 1.5px solid #333; border-radius: 12px; font-size: 10px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.93); z-index: 99999; display: none; justify-content: center; align-items: center; color: #333; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay">TAP TO WAKE SCREEN</div>

    <div id="detail-view">
        <button class="close-detail" onclick="closeDetail()">✕</button>
        <div id="detail-map"></div>
        <div id="detail-data">
            <div id="detail-date" style="color:var(--primary); font-size:12px; font-weight:800;">MAY 11, MON</div>
            <div id="detail-main-info" style="font-size:28px; font-weight:900; margin:5px 0; color:#fff;">0.00 KM</div>
            <div class="detail-grid" id="detail-grid-content"></div>
        </div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div id="lbl-curPace" class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="btn-dim" class="btn-dim" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">내역</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">통계</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
            <button id="sub-tab-set" class="sub-btn" onclick="showSubTab('set')">설정</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;">
            <div id="history-list" class="history-list"></div>
        </div>
        <div id="sub-page-total" class="sub-page"><div class="history-list" style="text-align:center; padding:50px; color:#555;">통계 준비 중</div></div>
        <div id="sub-page-info" class="sub-page"><div class="history-list" style="text-align:center; padding:50px; color:#555;">정보 준비 중</div></div>
        <div id="sub-page-set" class="sub-page"><div class="history-list" style="text-align:center; padding:50px; color:#555;">설정 준비 중</div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">러닝</button>
        <button id="tab-form" class="tab-btn" onclick="showTab('form')">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">기록</button>
    </div> 

<script>
let map, marker, accuracyCircle, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;
let pathCoords = [];
let detailMap = null;

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, 
            (err) => { document.getElementById('status').textContent = "GPS ERROR: " + err.message; }, 
            {enableHighAccuracy: true});
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const accuracy = p.coords.accuracy;
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;

    marker.setLatLng(pos);
    if (accuracyCircle) {
        accuracyCircle.setLatLng(pos);
        accuracyCircle.setRadius(accuracy);
    } else {
        accuracyCircle = L.circle(pos, {radius: accuracy, color: '#007bff', fillColor: '#007bff', fillOpacity: 0.15, weight: 1}).addTo(map);
    }

    let stateText = isRunning ? (isPaused || isAutoPaused ? "PAUSED" : "ACTIVE") : "READY";
    const statusEl = document.getElementById('status');
    statusEl.textContent = `${stateText} (±${accuracy.toFixed(1)}m)`;
    statusEl.style.color = accuracy < 25 ? "var(--primary)" : "var(--warning)";

    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { 
            isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; 
        } else if (currentSpeedKmh >= 0.8 && isAutoPaused) { 
            isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; 
        }

        if (!isAutoPaused && accuracy < 45) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.0015) { 
                    totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); 
                    lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();

    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }

        const gDisplay = document.getElementById('gct'), fDisplay = document.getElementById('flight'), cDisplay = document.getElementById('cadence');
        cDisplay.textContent = Math.round((steps / (seconds || 1)) * 60);
        gDisplay.textContent = gct || "--"; fDisplay.textContent = flt || "--";

        if (gct > 0) {
            if (gct <= 300) gDisplay.style.color = "var(--primary)";
            else if (gct <= 380) gDisplay.style.color = "var(--warning)";
            else gDisplay.style.color = "var(--danger)";
        }
        if (flt > 0) {
            if (flt >= 15) fDisplay.style.color = "var(--primary)";
            else if (flt >= 8) fDisplay.style.color = "var(--warning)";
            else fDisplay.style.color = "var(--text-dim)";
        }
    }
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 

function onFinish() {
    const record = { 
        id: Date.now(), 
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + new Date().toLocaleDateString('en-US', { weekday: 'short' }), 
        dist: document.getElementById('dist').textContent, 
        time: document.getElementById('time').textContent, 
        pace: document.getElementById('avgPace').textContent, 
        cadence: document.getElementById('cadence').textContent, 
        gct: document.getElementById('gct').textContent,
        flt: document.getElementById('flight').textContent,
        path: pathCoords 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); 
    h.unshift(record); 
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    
    // 저장 즉시 데이터 갱신
    updateHistoryStats();
    showTab('history');
    
    // 초기화
    isRunning = false; isPaused = false; 
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('after-stop').style.display = 'none';
    clearInterval(timer);
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    const targetTab = tab === 'history' ? 'tab-history' : (tab === 'run' ? 'tab-run' : 'tab-form');
    document.getElementById(targetTab).classList.add('active');
    
    if (tab === 'history') updateHistoryStats();
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const listContainer = document.getElementById('history-list');
    
    if (h.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; padding:50px; color:#555; font-weight:900;">기록이 없습니다</div>';
        return;
    }

    listContainer.innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <span class="h-dist">${r.dist}KM</span>
                <span class="h-time">${r.time}</span>
                <div style="margin-left:auto;"><span class="text-route-link" onclick="viewRecordMap(${r.id})">경로지도</span></div>
            </div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div>
                <div class="h-det-box"><span class="h-det-label">GCT</span><span class="h-det-val">${r.gct}ms</span></div>
                <div class="h-det-box"><span class="h-det-label">FLT</span><span class="h-det-val">${r.flt}%</span></div>
            </div>
        </div>`).join('');
}

function viewRecordMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = h.find(item => item.id === id);
    if (!r) return;
    document.getElementById('detail-view').style.display = 'flex';
    document.getElementById('detail-date').innerText = r.date;
    document.getElementById('detail-main-info').innerText = `${r.dist} KM / ${r.time}`;
    const grid = document.getElementById('detail-grid-content');
    grid.innerHTML = `
        <div class="detail-card"><div class="detail-label">평균 페이스</div><div class="detail-value">${r.pace}</div></div>
        <div class="detail-card"><div class="detail-label">평균 케이던스</div><div class="detail-value">${r.cadence}</div></div>
        <div class="detail-card"><div class="detail-label">지면접촉시간</div><div class="detail-value">${r.gct} ms</div></div>
        <div class="detail-card"><div class="detail-label">체공비율</div><div class="detail-value">${r.flt} %</div></div>
    `;
    if (detailMap) detailMap.remove();
    detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
    if (r.path && r.path.length > 0) {
        const poly = L.polyline(r.path, {color: '#00ff88', weight: 6}).addTo(detailMap);
        detailMap.fitBounds(poly.getBounds(), {padding: [20, 20]});
    } else { detailMap.setView([37.5665, 126.9780], 15); }
    setTimeout(() => detailMap.invalidateSize(), 300);
}

function closeDetail() { document.getElementById('detail-view').style.display = 'none'; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = () => { initMap(); updateHistoryStats(); };
</script>
</body>
</html>
