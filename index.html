<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* [상단 고정 영역: 맵] */
        #map-area { flex-shrink: 0; width: 100%; z-index: 10; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        /* [메인 컨텐츠 영역] */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* --- RUN VIEW --- */
        #run-view { display: flex; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 90px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; opacity: 0.8; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 45px; color: var(--primary); font-weight: 900; line-height: 1; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 2px; }
        .controls { height: 80px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; margin-bottom: 80px; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; border: none; }

        /* --- HISTORY VIEW (3등분 핵심) --- */
        #history-view { display: none; height: 100%; }

        /* 1/3 상단: 통계 */
        .history-header-section { flex-shrink: 0; padding: 15px; background: #000; }
        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; margin-bottom: 4px; opacity: 0.8; }
        .total-value { font-size: 16px; font-weight: 900; color: #fff; }

        /* 2/3 중단: 기록 리스트 (독립 스크롤) */
        .history-list-section { flex: 1; overflow-y: auto; padding: 0 15px; background: #000; -webkit-overflow-scrolling: touch; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 12px; align-items: baseline; margin-bottom: 15px; }
        .h-dist { font-size: 28px; font-weight: 900; color: #fff; }
        .h-time { font-size: 16px; color: #fff; opacity: 0.8; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; padding-top: 12px; }
        .h-info { display: flex; flex-direction: column; }
        .h-info .lab { font-size: 8px; color: #888; font-weight: 900; margin-bottom: 3px; }
        .h-info .val { font-size: 12px; font-weight: 900; color: var(--primary); }
        .btn-map-view { background: #222; color: var(--primary); border: 1px solid var(--primary); border-radius: 15px; font-size: 9px; font-weight: 900; padding: 3px 8px; }
        .h-delete { color: #444; font-size: 10px; text-decoration: underline; text-align: right; display: block; margin-top: 10px; }

        /* 3/3 하단: 빈 공간 (탭바 위쪽) */
        .history-footer-section { flex-shrink: 0; height: 120px; background: #0a0a0a; border-top: 1px solid #222; display: flex; align-items: center; justify-content: center; margin-bottom: 65px; color: #333; font-weight: 900; font-size: 12px; }

        /* [하단 고정 탭바] */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-btn { flex: 1; background: none; border: none; color: #666; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }

        /* 기타 */
        #full-map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; }
        #full-map { width: 100%; height: calc(100% - 80px); }
        .close-map-btn { height: 80px; background: #111; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">LOCATING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit" id="gct-unit">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit" id="flight-unit">%</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()" style="display:none;">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content">
        <div class="history-header-section">
            <div style="font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 10px;">STATISTICS</div>
            <div class="total-dashboard">
                <div class="total-card"><span class="total-label">Total Dist</span><span id="total-dist-val" class="total-value">0.00 KM</span></div>
                <div class="total-card"><span class="total-label">Weekly Dist</span><span id="weekly-dist-val" class="total-value">0.00 KM</span></div>
                <div class="total-card"><span class="total-label">Total Runs</span><span id="total-runs-val" class="total-value">0</span></div>
                <div class="total-card"><span class="total-label">Total Kcal</span><span id="total-kcal-val" class="total-value">0</span></div>
            </div>
        </div>

        <div class="history-list-section">
            <div style="font-size: 12px; font-weight: 900; color: #444; margin: 10px 0;">RECENT ACTIVITY</div>
            <div id="history-list">
                </div>
        </div>

        <div class="history-footer-section">
            NEXT FEATURE SPACE
        </div>
    </div> 

    <div id="full-map-overlay"><div id="full-map"></div><div class="close-map-btn" onclick="closeFullMap()">BACK TO HISTORY</div></div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, historyMap, historyLayer, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0, splits = [], kmStartSeconds = 0;
const AUTO_PAUSE_THRESHOLD = 1.5;
let lowSpeedTicks = 0; 

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); } 
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    loadHistory();
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = 0, flt = 0;
        if (currentSpeedKmh > 7.5) { 
            gct = Math.max(180, Math.floor(240 - (currentSpeedKmh * 3) + (Math.random() * 20)));
            flt = Math.floor(18 + (currentSpeedKmh * 1.2) + (Math.random() * 5));
        } else if (currentSpeedKmh > 1.0) { 
            gct = Math.floor(450 - (currentSpeedKmh * 10) + (Math.random() * 50));
            flt = Math.max(0, Math.floor(currentSpeedKmh * 2));
        }
        gctSum += gct; flightSum += flt; dataCount++;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        
        // UI Feedback
        const gD = document.getElementById('gct'), gU = document.getElementById('gct-unit');
        gD.textContent = gct || "--";
        gD.style.color = gct > 300 ? "var(--danger)" : (gct > 260 ? "var(--warning)" : "var(--primary)");
        gU.style.color = gD.style.color;

        const fD = document.getElementById('flight'), fU = document.getElementById('flight-unit');
        fD.textContent = flt || "0";
        fD.style.color = flt < 12 ? "var(--danger)" : (flt < 18 ? "var(--warning)" : "var(--primary)");
        fU.style.color = fD.style.color;
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "GPS READY"; }
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < AUTO_PAUSE_THRESHOLD) {
            lowSpeedTicks++;
            if (lowSpeedTicks >= 3 && !isAutoPaused) { isAutoPaused = true; vibrate([50, 50, 50]); document.getElementById('status').textContent = "AUTO PAUSED"; document.getElementById('status').style.color = "#ff4444"; }
        } else {
            lowSpeedTicks = 0;
            if (isAutoPaused) { isAutoPaused = false; vibrate(200); document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00"; }
        }
    }
    if (isRunning && !isPaused && !isAutoPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.005) { 
                let oldDist = totalDist; totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2); 
                lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                if (Math.floor(totalDist) > Math.floor(oldDist)) {
                    let splitTime = seconds - kmStartSeconds;
                    splits.push(Math.floor(splitTime/60) + "'" + String(splitTime%60).padStart(2,'0') + "\"");
                    kmStartSeconds = seconds;
                }
            }
        } else { lastPos = pos; kmStartSeconds = seconds; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
} 

function onStart() {
    requestWakeLock(); vibrate(100);
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; lastPos = null; pathCoords = []; splits = [];
    gctSum = 0; flightSum = 0; dataCount = 0;
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('status').textContent = "RUNNING";
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop() { isPaused = true; vibrate(50); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; document.getElementById('status').textContent = "PAUSED"; }
function onResume() { isPaused = false; vibrate(100); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; document.getElementById('status').textContent = "RUNNING"; } 

function onFinish() {
    vibrate([100, 50, 100]); releaseWakeLock();
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'}),
        timestamp: Date.now(),
        dist: parseFloat(totalDist.toFixed(2)),
        time: document.getElementById('time').textContent,
        avgPace: document.getElementById('avgPace').textContent,
        cadence: Math.round((steps / (seconds || 1)) * 60),
        kcal: Math.round(totalDist * 70),
        gct: dataCount ? Math.round(gctSum / dataCount) : "--",
        flight: dataCount ? Math.round(flightSum / dataCount) : "--",
        path: pathCoords,
        splits: splits
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    showTab('history');
    isRunning = false; clearInterval(timer);
    document.getElementById('btn-start').style.display = 'flex'; document.getElementById('after-stop').style.display = 'none';
} 

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    let td = 0, wd = 0, tk = 0, now = Date.now();
    
    history.forEach(r => {
        td += r.dist; tk += r.kcal;
        if (now - (r.timestamp || r.id) < 604800000) wd += r.dist;
    });

    document.getElementById('total-dist-val').textContent = td.toFixed(2) + " KM";
    document.getElementById('weekly-dist-val').textContent = wd.toFixed(2) + " KM";
    document.getElementById('total-runs-val').textContent = history.length;
    document.getElementById('total-kcal-val').textContent = tk.toLocaleString();
    
    list.innerHTML = history.length ? "" : '<div style="color:#333; text-align:center; padding:40px;">데이터가 없습니다.</div>';
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span><button class="btn-map-view" onclick="showFullMap(${r.id})">MAP</button></div>
            <div class="h-main-stats"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>
            <div class="h-grid">
                <div class="h-info"><span class="lab">PACE</span><span class="val">${r.avgPace}</span></div>
                <div class="h-info"><span class="lab">CADENCE</span><span class="val">${r.cadence}</span></div>
                <div class="h-info"><span class="lab">KCAL</span><span class="val">${r.kcal}</span></div>
                <div class="h-info"><span class="lab">GCT/FLT</span><span class="val">${r.gct}ms/${r.flight}%</span></div>
            </div>
            <span class="h-delete" onclick="if(confirm('삭제?')){let h=JSON.parse(localStorage.getItem('oppaRunHistory'));h=h.filter(x=>x.id!=${r.id});localStorage.setItem('oppaRunHistory',JSON.stringify(h));loadHistory();}">Delete Record</span>`;
        list.appendChild(item);
    });
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
    if(tab === 'history') loadHistory();
}

function showFullMap(id) {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const item = history.find(r => r.id === id);
    if (!item || !item.path.length) return;
    document.getElementById('full-map-overlay').style.display = 'block';
    if (!historyMap) { historyMap = L.map('full-map', {zoomControl: false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(historyMap); }
    if (historyLayer) historyMap.removeLayer(historyLayer);
    historyLayer = L.polyline(item.path, {color: '#00ff88', weight: 6}).addTo(historyMap);
    historyMap.fitBounds(historyLayer.getBounds(), {padding: [40, 40]});
}
function closeFullMap() { document.getElementById('full-map-overlay').style.display = 'none'; }

window.onload = initMap;
</script>
</body>
</html>
