<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v16.2 - Pro Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        #map { height: 32vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #121212; border-bottom: 1px solid #222; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: 900; color: #fff; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.03); }
        .value-large { font-size: 42px; color: var(--primary); line-height: 1; }
        .controls { position: absolute; bottom: 105px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        #main-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 15px; }
        #after-stop { display: none; gap: 15px; }
        .btn-action { width: 110px; height: 50px; border: none; font-weight: 800; border-radius: 25px; font-size: 15px; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); align-items: center; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .tab-btn.active { color: var(--primary); }
        
        /* 기록 전체화면 모달 스타일 */
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; }
        #split-info { height: 300px; background: #111; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        .split-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .my-location { background: #007bff; border: 2px solid white; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body>

<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:60px; background:var(--primary); border:none; font-weight:900;" onclick="closeModal()">BACK</button>
</div>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card card-highlight">
            <div class="label" style="color:var(--primary)">CURRENT PACE</div>
            <div class="value-large" id="curPace">--'--"</div>
        </div>
        <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0</div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; height:100vh; padding:20px; overflow-y:auto; padding-bottom:100px;">
    <h2 style="color:var(--primary)">HISTORY</h2>
    <div id="history-list"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">Run</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, timerInterval, lastKmDist = 0, lastKmTime = 0;

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.marker([0, 0], { icon: L.divIcon({className: 'my-location', iconSize: [12, 12]}) }).addTo(map);
}

function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy, speed } = pos.coords;
        if (accuracy > 25) return;
        const newPos = [latitude, longitude];
        marker.setLatLng(newPos);
        if (isRunning && !isPaused) {
            if (lastPos) {
                const d = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
                if (d > 0.002) {
                    totalDistance += d;
                    document.getElementById('dist').textContent = totalDistance.toFixed(2);
                    pathArray.push(newPos); pathLine.setLatLngs(pathArray); map.panTo(newPos);
                    
                    // 1km마다 구간 페이스 계산 (Splits)
                    if (totalDistance - lastKmDist >= 1.0) {
                        const splitPace = (elapsedSeconds - lastKmTime) / 60;
                        splits.push({km: splits.length + 1, pace: formatPace(splitPace)});
                        lastKmDist = totalDistance; lastKmTime = elapsedSeconds;
                    }
                }
            }
            if (speed > 0.5) document.getElementById('curPace').textContent = formatPace(16.6667 / speed);
            lastPos = newPos;
        }
    }, null, { enableHighAccuracy: true });
}

function formatPace(p) {
    if (!p || p === Infinity) return "--'--\"";
    const m = Math.floor(p), s = String(Math.floor((p - m) * 60)).padStart(2, '0');
    return `${m}'${s}"`;
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true;
        timerInterval = setInterval(() => { if(!isPaused) { 
            elapsedSeconds++; 
            const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('time').textContent = `00:${m}:${s}`;
        }}, 1000);
        document.getElementById('main-btn').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
    } else { isPaused = true; }
}

function saveData() {
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent, route: pathArray, splits: splits };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'block' : 'none';
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-list').innerHTML = history.map(h => `
        <div style="background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:10px;" onclick="showDetail(${h.id})">
            <div style="color:var(--primary); font-size:12px;">${h.date}</div>
            <div style="font-size:20px; font-weight:bold;">${h.dist} KM</div>
        </div>`).join('');
}

function showDetail(id) {
    const record = JSON.parse(localStorage.getItem('OppaRun_Data')).find(h => h.id === id);
    document.getElementById('map-modal').style.display = 'flex';
    setTimeout(() => {
        let hMap = L.map('history-map').setView(record.route[0], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        L.polyline(record.route, {color: '#00ff88'}).addTo(hMap);
        document.getElementById('split-info').innerHTML = `<h3>SPLITS</h3>` + record.splits.map(s => `<div class="split-row"><span>${s.km} KM</span><b>${s.pace}</b></div>`).join('');
    }, 100);
}

function closeModal() { document.getElementById('map-modal').style.display = 'none'; }
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
window.onload = () => { initMaps(); startTracking(); };
</script>
</body>
</html>
