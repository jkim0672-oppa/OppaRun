<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.3 (Integrated Settings)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 20px 15px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; }

        /* 히스토리 상단 네비게이션 */
        .history-nav { display: flex; gap: 5px; padding: 10px; background: #000; overflow-x: auto; }
        .sub-btn { flex: 1; min-width: 80px; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; white-space: nowrap; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #1f1f1f; }
        
        /* 설정 페이지 스타일 */
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #222; }
        .setting-label { font-weight: 800; font-size: 14px; }
        select { background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 5px; }
        
        /* 스위치 스타일 */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS 수신 중...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">현재 페이스</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">거리</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px"> KM</small></div></div>
            <div class="card"><div class="label">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">접지 시간</div><div id="gct" class="value">--</div></div>
            <div class="card"><div class="label">공중 비율</div><div id="flight" class="value">--</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">러닝 시작</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">정지</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">계속</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">종료</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">기록 리스트</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">누적 통계</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
            <button id="sub-tab-set" class="sub-btn" onclick="showSubTab('set')">⚙️ 설정</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="history-item"><h3>OppaRun Pro v28.3</h3><p>뮤지션 오빠를 위한 커스텀 앱</p></div>
        </div>
        
        <div id="sub-page-set" class="sub-page">
            <div class="history-item">
                <div class="setting-row">
                    <span class="setting-label">언어 (Language)</span>
                    <select id="lang-select" onchange="changeLang(this.value)">
                        <option value="ko">한국어</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span class="setting-label">메트로놈 사용</span>
                    <label class="switch">
                        <input type="checkbox" id="metro-toggle" onchange="toggleMetronome()">
                        <span class="slider"></span>
                    </label>
                </div>
                <div style="margin-top:15px;">
                    <div class="setting-label" style="margin-bottom:10px;">비트 속도 (BPM): <span id="bpm-val" style="color:var(--primary)">175</span></div>
                    <input type="range" id="bpm-range" min="150" max="200" value="175" style="width:100%; accent-color:var(--primary);" oninput="updateBPM(this.value)">
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx, metroTimer;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0, steps = 0, lastStepTime = 0;
let currentSpeedKmh = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
}

function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }

function toggleMetronome() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isMetroOn = document.getElementById('metro-toggle').checked;
    if (isMetroOn) {
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        clearTimeout(metroTimer);
    }
}

function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 1000;
        gain.gain.setValueAtTime(0.5, nextClickTime);
        gain.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.05);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    const statusEl = document.getElementById('status');
    if (acc <= 10) { statusEl.innerText = `준비 완료 (±${acc}m)`; statusEl.style.color = "#00ff88"; }
    else { statusEl.innerText = `GPS 수신 중... (±${acc}m)`; statusEl.style.color = "#ffcc00"; }
    
    if (isRunning && !isPaused && acc < 40) {
        if (lastPos) {
            let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
    } else { map.panTo(pos); }
}

function onStart() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}

function showTab(tab) {
    const isRun = (tab === 'run');
    document.getElementById('run-view').style.display = isRun ? 'flex' : 'none';
    document.getElementById('map-area').style.display = isRun ? 'block' : 'none';
    document.getElementById('history-view').style.display = isRun ? 'none' : 'flex';
    document.getElementById('tab-run').className = 'tab-btn' + (isRun ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (isRun ? '' : ' active');
    if(isRun) setTimeout(() => map.invalidateSize(), 200);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'list') loadHistory();
}

function loadHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><b>${r.date}</b><br>${r.dist}KM | ${r.time} | ${r.pace}</div>`).join('');
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function handleMotion(e) {} // 간소화
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }
window.onload = initMap;
</script>
</body>
</html>
