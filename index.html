<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.18</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* Map & GPS Bar */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { 
            text-align: center; color: var(--warning); font-size: 11px; padding: 8px; 
            background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222;
            letter-spacing: 0.5px;
        }
        
        /* Dashboard */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 4px 8px; border-radius: 6px; display: none; }
        
        /* Buttons */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* History Nav */
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        /* Settings Section (938.jpg 스타일) */
        .settings-wrap { padding: 20px; display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .btn-clear { width: 100%; height: 65px; background: #1a1a1a; border: 1px solid #333; border-radius: 15px; color: var(--danger); font-size: 18px; font-weight: 900; }
        .lang-section { width: 100%; text-align: center; }
        .lang-label { color: var(--primary); font-size: 12px; font-weight: 900; margin-bottom: 12px; display: block; letter-spacing: 1px; }
        
        /* 펼쳐지는 셀렉트 박스 스타일 */
        .custom-select { width: 100%; position: relative; }
        .select-trigger { 
            width: 100%; height: 65px; background: #1a1a1a; border: 1px solid #333; border-radius: 15px; 
            color: #fff; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; 
        }
        .select-options { 
            position: absolute; top: 70px; left: 0; width: 100%; background: #1a1a1a; border: 1px solid #333; 
            border-radius: 15px; display: none; flex-direction: column; z-index: 100; overflow: hidden;
        }
        .select-options div { 
            padding: 20px; border-bottom: 1px solid #222; font-weight: 900; font-size: 16px; color: #888;
        }
        .select-options div:last-child { border-bottom: none; }
        .select-options div.active { color: var(--primary); background: #222; }

        /* History Items & Total */
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #1f1f1f; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-dist-time { font-size: 19px; font-weight: 900; color: #fff; }
        .text-route-link { color: var(--primary); font-size: 11px; font-weight: 800; cursor: pointer; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #555; font-weight: 900; }
        .h-det-val { font-size: 12px; font-weight: 900; color: #ccc; }
        .total-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .total-header { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 10px; text-align: center; }
        .total-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .total-card { background: var(--card-bg); border: 1px solid #222; border-radius: 15px; padding: 20px; text-align: center; }
        .total-label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .total-value { font-size: 24px; font-weight: 900; color: #fff; }
        .total-unit { font-size: 12px; color: var(--primary); margin-left: 3px; }

        /* Tabs */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay">TAP TO WAKE</div>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="lbl-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="lbl-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="lbl-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="lbl-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="lbl-cad">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="lbl-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="lbl-flt">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container" class="total-container"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="placeholder-content" style="padding:40px; text-align:center;">
                <div style="color:var(--primary); font-weight:900;">OppaRun Pro v28.18</div>
            </div>
        </div>
        <!-- 938.jpg 설정 화면 -->
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-wrap">
                <button class="btn-clear" id="btn-clear-txt" onclick="clearHistory()">CLEAR ALL HISTORY</button>
                <div class="lang-section">
                    <span class="lang-label" id="lbl-lang-title">LANGUAGE</span>
                    <div class="custom-select">
                        <div class="select-trigger" id="current-lang" onclick="toggleLangMenu()">English</div>
                        <div class="select-options" id="lang-menu">
                            <div onclick="selectLang('ko', '한국어')">한국어</div>
                            <div onclick="selectLang('en', 'English')">English</div>
                            <div onclick="selectLang('jp', '日本語')">日本語</div>
                            <div onclick="selectLang('es', 'Español')">Español</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
// --- 기존 로직 보존 ---
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];

const langData = {
    ko: { start: "러닝 시작", stop: "중지", res: "재개", fin: "종료", pace: "페이스", dist: "거리", time: "시간", avg: "평균", cad: "케이던스", gct: "지면접촉", flt: "공중체류", clear: "모든 기록 삭제", run: "러닝", hist: "기록" },
    en: { start: "START RUNNING", stop: "STOP", res: "RESUME", fin: "FINISH", pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cad: "CADENCE", gct: "GCT", flt: "FLIGHT", clear: "CLEAR ALL HISTORY", run: "RUN", hist: "HISTORY" },
    jp: { start: "ランニング開始", stop: "停止", res: "再開", fin: "終了", pace: "ペース", dist: "距離", time: "時間", avg: "平均", cad: "ケイデンス", gct: "接地時間", flt: "滞空時間", clear: "履歴を削除", run: "ラン", hist: "履歴" },
    es: { start: "EMPEZAR", stop: "PARAR", res: "CONTINUAR", fin: "FINALIZAR", pace: "RITMO", dist: "DIST", time: "TIEMPO", avg: "PROM", cad: "CADENCIA", gct: "GCT", flt: "VUELO", clear: "BORRAR HISTORIAL", run: "CORRER", hist: "HISTORIAL" }
};

function toggleLangMenu() {
    const menu = document.getElementById('lang-menu');
    menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
}

function selectLang(code, label) {
    localStorage.setItem('oppaLang', code);
    document.getElementById('current-lang').textContent = label;
    document.getElementById('lang-menu').style.display = 'none';
    applyLang(code);
}

function applyLang(code) {
    const d = langData[code] || langData.en;
    document.getElementById('btn-start').textContent = d.start;
    document.getElementById('btn-stop').textContent = d.stop;
    document.getElementById('btn-resume').textContent = d.res;
    document.getElementById('btn-finish').textContent = d.fin;
    document.getElementById('lbl-pace').textContent = d.pace;
    document.getElementById('lbl-dist').textContent = d.dist;
    document.getElementById('lbl-time').textContent = d.time;
    document.getElementById('lbl-avg').textContent = d.avg;
    document.getElementById('lbl-cad').textContent = d.cad;
    document.getElementById('lbl-gct').textContent = d.gct;
    document.getElementById('lbl-flt').textContent = d.flt;
    document.getElementById('btn-clear-txt').textContent = d.clear;
    document.getElementById('tab-run').textContent = d.run;
    document.getElementById('tab-history').textContent = d.hist;
}

// --- 기본 지도 및 러닝 함수 (v28.16과 동일) ---
function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (e) => { document.getElementById('status').textContent = "GPS ERROR"; }, {enableHighAccuracy: true});
    }
    window.addEventListener('devicemotion', handleMotion);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused && !isAutoPaused) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.001) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
    } else { map.panTo(pos); }
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
    }
}

function onStart() {
    isRunning = true; isPaused = false; seconds = 0; totalDist = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

window.onload = () => {
    initMap();
    const saved = localStorage.getItem('oppaLang') || 'en';
    const labels = { ko:'한국어', en:'English', jp:'日本語', es:'Español' };
    document.getElementById('current-lang').textContent = labels[saved];
    applyLang(saved);
};
</script>
</body>
</html>
