<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun Pro</title>
    <style>
        /* 기본 설정: 가로 흔들림 절대 방지 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; 
            background-color: #000; color: #fff; 
            overflow: hidden; /* 전체 페이지 바운스 방지 */
            font-family: sans-serif;
        }

        /* 페이지 컨테이너 */
        .page {
            display: none; /* 기본적으로 모든 페이지 숨김 */
            width: 100%; height: calc(100% - 65px); /* 하단바 제외 높이 */
            overflow-y: auto; /* 세로 스크롤만 허용 */
            padding: 20px;
        }
        .page.active { display: block; } /* active 클래스만 보이게 함 */

        /* 상단 탭 (목록, 통계 등) */
        .header { padding: 15px; background: #000; }
        .tab-menu { display: flex; gap: 8px; }
        .tab-item { 
            flex: 1; padding: 10px; text-align: center; 
            background: #1a1a1a; border-radius: 8px; font-size: 14px; 
        }
        .tab-item.selected { background: #4ADE80; color: #000; font-weight: bold; }

        /* 기록 카드 스타일 */
        .history-card {
            background: #151515; border-radius: 15px; padding: 20px;
            margin-bottom: 15px; border: 1px solid #222;
        }
        .timestamp { color: #4ADE80; font-weight: bold; }
        .stats-main { display: flex; gap: 15px; margin: 15px 0; font-size: 22px; font-weight: bold; }
        .stats-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            text-align: center; border-top: 1px solid #222; padding-top: 10px;
        }
        .label { font-size: 10px; color: #666; }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background: #000; border-top: 1px solid #222;
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-btn { color: #555; text-decoration: none; font-weight: bold; border: none; background: none; cursor: pointer; }
        .nav-btn.active { color: #4ADE80; }
    </style>
</head>
<body>

    <div id="runningPage" class="page active">
        <h1 style="text-align:center; margin-top:50px;">러닝 시작 화면</h1>
        <p style="text-align:center; color:#666;">여기에 러닝 컨트롤러를 넣어줘!</p>
    </div>

    <div id="historyPage" class="page">
        <div class="tab-menu" style="margin-bottom: 20px;">
            <div class="tab-item selected">목록</div>
            <div class="tab-item">통계</div>
            <div class="tab-item">정보</div>
            <div class="tab-item">설정</div>
        </div>

        <div class="history-card">
            <div class="timestamp">5/13/2026, 7:47:43 PM</div>
            <div class="stats-main"><span>1.54KM</span><span style="color:#4ADE80;">02:56</span></div>
            <div class="stats-grid">
                <div><div class="label">PACE</div><div>1'54"</div></div>
                <div><div class="label">CAD</div><div>19</div></div>
                <div><div class="label">KCAL</div><div>100</div></div>
                <div><div class="label">GCT/FLT</div><div>209/55%</div></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="showPage('runningPage', this)">러닝</button>
        <button class="nav-btn" onclick="showPage('historyPage', this)">기록</button>
    </nav>

    <script>
        function showPage(pageId, btn) {
            // 모든 페이지 숨기기
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 선택한 페이지 보이기
            document.getElementById(pageId).classList.add('active');
            
            // 모든 버튼 비활성화 스타일
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            // 클릭한 버튼 활성화
            btn.classList.add('active');
        }
    </script>
</body>
</html>
