<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v30.0 (Musician Edition)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .settings-container { padding: 20px; }
        .settings-group { margin-bottom: 25px; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }

        /* 메트로놈 & 음악 섹션 디자인 */
        .metro-card { background: #111; border: 1.5px solid #333; border-radius: 15px; padding: 20px; margin-top: 10px; }
        .metro-visual-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .metro-dot { width: 8px; height: 8px; border-radius: 50%; background: #222; }
        .metro-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); transform: scale(1.3); }
        .metro-dot.accent { background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        
        .metro-bpm { font-size: 32px; font-weight: 900; text-align: center; color: var(--primary); margin-bottom: 5px; }
        .metro-slider { width: 100%; height: 6px; -webkit-appearance: none; background: #333; border-radius: 3px; margin: 15px 0; outline: none; }
        .metro-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        
        .metro-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .mini-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer; }
        .mini-btn.active { border-color: var(--primary); color: var(--primary); }
        
        .audio-player-box { margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
        .file-input { display: none; }

        #detail-view, #diag-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 10001; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" style="padding:10px;"></div></div>
        
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container">
                <div class="settings-group">
                    <div class="settings-label">PRO METRONOME</div>
                    <div class="metro-card">
                        <div class="metro-visual-box">
                            <div id="dot-0" class="metro-dot"></div>
                            <div id="dot-1" class="metro-dot"></div>
                            <div id="dot-2" class="metro-dot"></div>
                            <div id="dot-3" class="metro-dot"></div>
                        </div>
                        <div id="metro-bpm-val" class="metro-bpm">170 BPM</div>
                        <input type="range" class="metro-slider" min="120" max="200" value="170" oninput="updateMetroBPM(this.value)">
                        
                        <div class="settings-label" style="font-size:9px; margin-top:10px;">SOUND SELECT</div>
                        <div class="metro-controls">
                            <button class="mini-btn active" id="s-wood" onclick="setSound('wood')">WOOD</button>
                            <button class="mini-btn" id="s-elec" onclick="setSound('elec')">ELEC</button>
                        </div>
                        
                        <div class="settings-label" style="font-size:9px; margin-top:15px;">VOLUME</div>
                        <input type="range" class="metro-slider" min="0" max="1" step="0.1" value="0.7" oninput="setMetroVolume(this.value)">

                        <button id="btn-metro-toggle" class="btn-act" style="height:50px; font-size:14px; background:#222; color:#fff; margin-top:15px;" onclick="toggleMetronome()">START METRONOME</button>

                        <div class="audio-player-box">
                            <div class="settings-label" style="font-size:9px;">MUSIC MIXER</div>
                            <button class="mini-btn" style="width:100%; border-style:dashed;" onclick="document.getElementById('music-upload').click()">+ LOAD MUSIC FILE</button>
                            <input type="file" id="music-upload" class="file-input" accept="audio/*" onchange="loadMusic(this)">
                            <audio id="bg-music" loop style="width:100%; margin-top:10px; display:none;" controls></audio>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];
let audioCtx = null, metroTimer = null, isMetroPlaying = false;
let metroBPM = 170, currentBeat = 0, metroVolume = 0.7, soundType = 'wood';
let metroGainNode = null;

function updateMetroBPM(val) {
    metroBPM = val;
    document.getElementById('metro-bpm-val').textContent = val + " BPM";
    if (isMetroPlaying) { stopMetro(); startMetro(); }
}

function setSound(type) {
    soundType = type;
    document.querySelectorAll('.mini-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('s-' + type).classList.add('active');
}

function setMetroVolume(val) {
    metroVolume = val;
    if (metroGainNode) metroGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
}

function playTick() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        metroGainNode = audioCtx.createGain();
        metroGainNode.connect(audioCtx.destination);
    }
    
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    
    metroGainNode.gain.setValueAtTime(metroVolume, audioCtx.currentTime);

    // 첫 박자 강세 처리 (4박자 기준)
    const isAccent = (currentBeat === 0);
    
    if (soundType === 'wood') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isAccent ? 1200 : 800, audioCtx.currentTime);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(isAccent ? 800 : 400, audioCtx.currentTime);
    }

    env.gain.setValueAtTime(1, audioCtx.currentTime);
    env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

    osc.connect(env);
    env.connect(metroGainNode);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);

    // 시각적 피드백
    document.querySelectorAll('.metro-dot').forEach(d => d.classList.remove('active', 'accent'));
    const dot = document.getElementById('dot-' + currentBeat);
    dot.classList.add('active');
    if (isAccent) dot.classList.add('accent');

    currentBeat = (currentBeat + 1) % 4;
}

function startMetro() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const interval = 60000 / metroBPM;
    metroTimer = setInterval(playTick, interval);
    isMetroPlaying = true;
    document.getElementById('btn-metro-toggle').textContent = "STOP METRONOME";
    document.getElementById('btn-metro-toggle').style.background = "var(--danger)";
}

function stopMetro() {
    clearInterval(metroTimer);
    isMetroPlaying = false;
    currentBeat = 0;
    document.getElementById('btn-metro-toggle').textContent = "START METRONOME";
    document.getElementById('btn-metro-toggle').style.background = "#222";
    document.querySelectorAll('.metro-dot').forEach(d => d.classList.remove('active', 'accent'));
}

function toggleMetronome() { isMetroPlaying ? stopMetro() : startMetro(); }

function loadMusic(input) {
    const file = input.files[0];
    if (file) {
        const audio = document.getElementById('bg-music');
        audio.src = URL.createObjectURL(file);
        audio.style.display = 'block';
    }
}

// 기본 앱 로직
function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0]).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos);
            if (isRunning && !isPaused) {
                pathCoords.push(pos);
                polyline.setLatLngs(pathCoords);
                if (lastPos) totalDist += 0.001; // 단순 거리 증가 예시
                lastPos = pos;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
            } else { map.panTo(pos); }
        }, null, {enableHighAccuracy: true});
    }
}

function onStart() {
    isRunning = true; seconds = 0; totalDist = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = Math.floor(seconds/60)+":"+(seconds%60); } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
}
function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
}
function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

window.onload = initMap;
</script>
</body>
</html>
