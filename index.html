<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun v25.0 Original</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 지도 영역: 상단 40% 고정 (가장 안정적인 비율) */
        #map {
            height: 40dvh;
            width: 100%;
            z-index: 1;
        }

        /* 대시보드 영역: 6개 데이터 카드 포함 */
        .dashboard {
            flex: 1;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: var(--dark-bg);
            overflow-y: auto; /* 작은 폰 대응 */
        }

        .pace-card {
            grid-column: span 3;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        #current-pace {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--neon-green);
            line-height: 1.1;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label { font-size: 0.65rem; color: #888; margin-bottom: 2px; }
        .value { font-size: 1.1rem; font-weight: bold; }
        .unit { font-size: 0.65rem; color: var(--neon-green); margin-left: 2px; }

        .main-btn {
            grid-column: span 3;
            background: var(--neon-green);
            color: black;
            border: none;
            border-radius: 15px;
            padding: 18px;
            font-weight: bold;
            font-size: 1.3rem;
            margin-top: 5px;
        }

        /* 하단 탭 바 */
        .tab-bar {
            height: 65px;
            display: flex;
            background: #000;
            border-top: 1px solid #222;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        .tab-item.active { color: var(--neon-green); }

        /* 히스토리 화면 */
        #history-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100dvh - 65px);
            background: var(--dark-bg);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="run-dashboard" class="dashboard">
        <div class="pace-card">
            <div style="color:var(--neon-green); font-size:0.8rem;">CURRENT PACE</div>
            <div id="current-pace">--'--"</div>
        </div>

        <div class="stat-box">
            <div class="label">DIST</div>
            <div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div>
        </div>
        <div class="stat-box">
            <div class="label">TIME</div>
            <div id="time" class="value">00:00</div>
        </div>
        <div class="stat-box">
            <div class="label">AVG PACE</div>
            <div id="avg-pace" class="value">--'--"</div>
        </div>
        <div class="stat-box">
            <div class="label">CADENCE</div>
            <div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div>
        </div>
        <div class="stat-box">
            <div class="label">GCT</div>
            <div class="value"><span id="gct">--</span><span class="unit">MS</span></div>
        </div>
        <div class="stat-box">
            <div class="label">FLIGHT</div>
            <div class="value"><span id="flight">--</span><span class="unit">%</span></div>
        </div>

        <button id="startBtn" class="main-btn" onclick="toggleRun()">START RUNNING</button>
    </div>

    <div id="history-screen">
        <h1 style="color:var(--neon-green); margin-bottom:20px;">HISTORY</h1>
        <div id="history-list" style="color:#666; text-align:center;">NO DATA</div>
    </div>

    <nav class="tab-bar">
        <a href="javascript:void(0)" class="tab-item active" id="btn-run" onclick="showScreen('run')">RUN</a>
        <a href="javascript:void(0)" class="tab-item" id="btn-history" onclick="showScreen('history')">HISTORY</a>
    </nav>

    <script>
        let isRunning = false;
        let map;

        window.onload = function() {
            initMap();
        };

        function initMap() {
            map = L.map('map').setView([37.5665, 126.9780], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        function toggleRun() {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            btn.innerText = isRunning ? "STOP RUNNING" : "START RUNNING";
            btn.style.background = isRunning ? "#ff3333" : "#00ff66";
        }

        function showScreen(screen) {
            const hScreen = document.getElementById('history-screen');
            const rDash = document.getElementById('run-dashboard');
            const mapDiv = document.getElementById('map');
            const btnRun = document.getElementById('btn-run');
            const btnHistory = document.getElementById('btn-history');

            if(screen === 'history') {
                hScreen.style.display = 'block';
                rDash.style.display = 'none';
                mapDiv.style.display = 'none';
                btnRun.classList.remove('active');
                btnHistory.classList.add('active');
            } else {
                hScreen.style.display = 'none';
                rDash.style.display = 'grid';
                mapDiv.style.display = 'block';
                btnRun.classList.add('active');
                btnHistory.classList.remove('active');
                map.invalidateSize();
            }
        }
    </script>
</body>
</html>
