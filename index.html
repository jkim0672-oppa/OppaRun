<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v13.5 (History Map & Splits)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; 
            --bg: #000000; 
            --card-bg: #121212; 
            --text-main: #ffffff; 
            --text-dim: #ffffff; 
            --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding-bottom: 80px; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; margin-bottom: 2px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; }
        .value { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .controls { height: 90px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }

        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; background: #000; overflow: hidden; }
        .history-list { padding: 10px; overflow-y: auto; flex: 1; }
        .history-item { background: #111; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .h-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 12px; }
        .h-dist { font-size: 28px; font-weight: 900; }
        
        /* 경로 확인 버튼 */
        .btn-view-map { background: #222; color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; cursor: pointer; }

        .splits-container { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
        .split-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; color: #ccc; }

        /* 전체화면 지도 팝업 */
        #full-map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; }
        #full-map { width: 100%; height: calc(100% - 60px); }
        .close-map { height: 60px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">LOCATING...</div>
</div>

<div id="run-view" class="main-content">
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-capsule" onclick="onFinish()">FINISH</button>
    </div>
</div>

<div id="history-view" class="main-content">
    <div style="padding: 20px 20px 10px 20px;"><span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span></div>
    <div id="history-list" class="history-list"></div>
</div>

<div id="full-map-overlay">
    <div id="full-map"></div>
    <div class="close-map" onclick="closeFullMap()">CLOSE MAP</div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div>

<script>
let map, marker, polyline, historyMap;
let pathCoords = [], isRunning = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, splits = []; 
let currentKmDist = 0, kmStartTime = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    loadHistory();
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    marker.setLatLng(pos);
    if (isRunning) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.002) { 
                totalDist += d; currentKmDist += d;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                
                // 1km 마다 페이스 기록
                if (currentKmDist >= 1.0) {
                    let splitTime = seconds - kmStartTime;
                    splits.push(formatPace(3600/splitTime));
                    currentKmDist = 0; kmStartTime = seconds;
                }
                lastPos = pos;
            }
        } else { lastPos = pos; kmStartTime = seconds; }
        let speed = (p.coords.speed || 0) * 3.6;
        document.getElementById('curPace').textContent = formatPace(speed);
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = []; splits = []; currentKmDist = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { seconds++; document.getElementById('time').textContent = Math.floor(seconds/60)+":"+(seconds%60).toString().padStart(2,'0'); }, 1000);
}

function onFinish() {
    isRunning = false; clearInterval(timer);
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        path: pathCoords,
        splits: splits
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    showTab('history');
}

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let s = 3600 / kmh;
    return Math.floor(s/60)+"'"+Math.floor(s%60).toString().padStart(2,'0')+"\"";
}

function showFullMap(id) {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const item = history.find(r => r.id === id);
    if (!item || !item.path.length) return;

    document.getElementById('full-map-overlay').style.display = 'block';
    if (!historyMap) {
        historyMap = L.map('full-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(historyMap);
    }
    
    if (window.tempLayer) historyMap.removeLayer(window.tempLayer);
    window.tempLayer = L.polyline(item.path, {color: '#00ff88', weight: 6}).addTo(historyMap);
    historyMap.fitBounds(window.tempLayer.getBounds(), {padding: [20, 20]});
}

function closeFullMap() { document.getElementById('full-map-overlay').style.display = 'none'; }

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        let splitHtml = r.splits.map((s, i) => `<div class="split-row"><span>${i+1} KM</span><span>${s}</span></div>`).join('');
        item.innerHTML = `
            <div class="h-header">
                <span class="h-date">${r.date}</span>
                <button class="btn-view-map" onclick="showFullMap(${r.id})">VIEW MAP</button>
            </div>
            <div class="h-main-stats">
                <span class="h-dist">${r.dist}<small class="unit">KM</small></span>
                <span style="font-size:16px;">${r.time}</span>
            </div>
            ${splitHtml ? `<div class="splits-container"><div style="font-size:9px; color:var(--primary); font-weight:900; margin-bottom:5px;">SPLITS</div>${splitHtml}</div>` : ''}
        `;
        list.appendChild(item);
    });
}

function showTab(t) {
    document.getElementById('run-view').style.display = t === 'run' ? 'flex' : 'none';
    document.getElementById('history-view').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-run').className = 'tab-btn' + (t === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (t === 'history' ? ' active' : '');
    if (t === 'history') loadHistory();
}
window.onload = initMap;
</script>
</body>
</html>
