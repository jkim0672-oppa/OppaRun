<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Perfect Connection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        
        /* 1. 지도: 현위치 바로 잡기 위해 살짝 조정 */
        #map { flex: 1.5; border-bottom: 2px solid #222; }
        .gps-status { background: #000; color: #FFD700; text-align: center; padding: 5px; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #222; }

        /* 2. 대시보드: 오빠가 준 오리지널 비율 유지 */
        .dashboard { flex: 2.5; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; justify-content: space-around; }
        .row { display: flex; gap: 10px; }
        .box { background: #111; border-radius: 15px; flex: 1; padding: 12px 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .value { font-size: 1.5rem; font-weight: bold; }
        .unit { font-size: 0.8rem; color: #00FF00; margin-left: 3px; }

        .pace-box { background: #000; border: 2px solid #00FF00; border-radius: 15px; padding: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pace-box .label { color: #00FF00; }
        .pace-box .value { font-size: 2.5rem; color: #00FF00; line-height: 1; }

        .controls-row { display: flex; justify-content: space-around; align-items: center; padding: 5px 0; }
        .start-btn { 
            width: 85px; height: 85px; background: #FF453A; border-radius: 50%; 
            font-weight: bold; font-size: 1.1rem; color: #fff; border: none;
            box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
        }

        /* 3. 하단 탭 메뉴: 무조건 보이도록 고정 */
        .tab-menu { display: flex; border-top: 1px solid #222; padding: 15px 0; background: #000; }
        .tab-item { flex: 1; text-align: center; color: #00FF00; font-size: 0.9rem; font-weight: bold; }
        .tab-item.history { color: #888; }
        
        .dynamics-info { font-size: 0.7rem; color: #007AFF; text-align: center; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="map"></div>
    <div class="gps-status" id="gpsStatus">GPS INITIALIZING...</div>

    <div class="dashboard">
        <div class="row">
            <div class="box"><div class="label">Distance</div><div class="value" id="distDisplay">0.00<span class="unit">KM</span></div></div>
            <div class="box"><div class="label">Time</div><div class="value" id="timeDisplay">00:00:00</div></div>
        </div>

        <div class="pace-box">
            <div class="label">CURRENT PACE</div>
            <div class="value" id="paceDisplay">--'--"</div>
            <div id="kcalDisplay" style="font-size: 0.9rem; color: #888; margin-top:5px;">0 kcal</div>
        </div>

        <div class="controls-row">
            <div style="text-align: center;"><div class="label">AVG PACE</div><div id="avgPaceDisplay" class="value" style="font-size: 1rem;">--'--"</div></div>
            <button class="start-btn" id="mainBtn" onclick="toggleRun()">START</button>
            <div style="text-align: center;"><div class="label">CADENCE</div><div id="cadenceDisplay" class="value" style="font-size: 1.2rem;">0<span class="unit">SPM</span></div></div>
        </div>
        <div class="dynamics-info">Target GCT: 180 - 240ms</div>
    </div>

    <div class="tab-menu">
        <div class="tab-item">RUNNING</div>
        <div class="tab-item history" onclick="alert('History is available after saving a run!')">HISTORY</div>
    </div>
</div>

<script>
    let map, path, watchId, timerInterval, startTime, running = false, distance = 0, lastPos = null;
    const weight = 75;

    // 1. 지도 초기화 및 현위치 즉시 추적
    map = L.map('map', { zoomControl: false }).setView([37.5, 126.7], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    path = L.polyline([], { color: '#00FF00', weight: 5 }).addTo(map);

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            const current = [pos.coords.latitude, pos.coords.longitude];
            map.setView(current, 16);
            L.circleMarker(current, { color: '#007AFF', radius: 8, fillOpacity: 0.8 }).addTo(map);
            document.getElementById('gpsStatus').innerText = "GPS READY";
        });
    }

    function toggleRun() {
        const btn = document.getElementById('mainBtn');
        if (!running) {
            running = true; btn.innerText = "STOP"; btn.style.background = "#444";
            distance = 0; lastPos = null; path.setLatLngs([]);
            startTime = Date.now();
            timerInterval = setInterval(updateUI, 1000);
            startTracking();
        } else {
            if(confirm("기록을 저장하고 종료할까요?")) location.reload();
        }
    }

    function startTracking() {
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            document.getElementById('gpsStatus').innerText = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
            const currentPos = [latitude, longitude];
            if (lastPos && map.distance(lastPos, currentPos) > 2) {
                distance += map.distance(lastPos, currentPos);
                path.addLatLng(currentPos);
                map.panTo(currentPos);
            }
            lastPos = currentPos;
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `00:${m}:${s}`;
        const distKm = (distance / 1000).toFixed(2);
        document.getElementById('distDisplay').innerHTML = `${distKm}<span class="unit">KM</span>`;
        document.getElementById('kcalDisplay').innerText = `${(weight * distKm).toFixed(1)} kcal`;
    }
</script>
</body>
</html>
