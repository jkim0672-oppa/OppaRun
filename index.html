<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v26.9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 전체 화면 설정 */
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui, sans-serif; 
            height: 100vh; height: -webkit-fill-available; /* 모바일 브라우저 대응 */
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* 상단 영역: 지도 + 상태바 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 20vh; min-height: 120px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }

        /* 메인 콘텐츠 영역 */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* 대시보드 그리드 */
        .dashboard { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; 
            flex: 1; align-content: start; /* 위에서부터 차곡차곡 */
        }
        .card { 
            background: var(--card-bg); border-radius: 16px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border: 1px solid #1f1f1f; padding: 12px 5px;
        }
        .card-main { grid-column: span 3; border: 2px solid var(--primary); height: 100px; position: relative; margin-bottom: 4px; }
        .auto-pause-label { position: absolute; top: 8px; right: 12px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 3px 8px; border-radius: 6px; display: none; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 하단 컨트롤 버튼 */
        .controls { padding: 15px; padding-bottom: calc(85px + env(safe-area-inset-bottom)); }
        .btn { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.96); }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        
        /* 탭 바 */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 75px; background: rgba(0,0,0,0.95); 
            display: flex; border-top: 1px solid #222; 
            padding-bottom: env(safe-area-inset-bottom); z-index: 10000; 
            backdrop-filter: blur(10px);
        }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        /* 히스토리 리스트 */
        .history-list { flex: 1; overflow-y: auto; padding: 10px 15px 100px; }
        .my-location { background: #007bff; border: 2.5px solid #fff; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 15px rgba(0,123,255,0.8); }
    </style>
</head>
<body>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">WAITING FOR GPS...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        
        <div class="controls">
            <button id="btn-start" class="btn" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn" onclick="onStop()">STOP RUNNING</button>
            <div id="after-stop" style="display:none; gap:12px; width:100%;">
                <button class="btn" style="flex:1.2; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="padding: 20px 20px 10px;"><span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span></div>
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div>

    <script>
        /* [기존 JavaScript 로직은 동일하게 유지하되 UI 연결만 유지] */

</body>
</html>
