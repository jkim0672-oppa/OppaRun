<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v35.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 지도 영역: 높이를 25vh로 명시적 고정 */
        #map-area { height: 25vh; min-height: 160px; position: relative; background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0; }
        #map { height: 100%; width: 100%; }
        
        .accuracy-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; z-index: 1000; border: 1.2px solid var(--primary); color: var(--primary); }
        #pause-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--danger); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 900; z-index: 2000; border: 2px solid #fff; }

        /* 데이터 영역: 남은 공간 모두 사용 */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 8px; overflow: hidden; justify-content: space-between; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-grow: 1; margin-bottom: 10px; }
        
        .card { background: var(--card-bg); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 5px; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); background: rgba(0,255,136,0.03); }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 800; margin-bottom: 2px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 44px; color: var(--primary); font-weight: 900; line-height: 1.1; }

        /* 컨트롤 및 하단 바 */
        .controls { padding-bottom: 5px; }
        .btn-act { width: 100%; height: 54px; border-radius: 27px; border: none; font-weight: 900; font-size: 18px; }
        
        .tab-bar { height: calc(65px + env(safe-area-inset-bottom)); background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        /* HISTORY/INFO 서브 페이지 */
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .setting-box { background: #111; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #222; }
        .metro-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; }
        input[type=range] { flex: 1; accent-color: var(--metro-color); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="accuracy-box" class="accuracy-tag">GPS ±--m</div>
        <div id="pause-overlay">AUTO PAUSED</div>
        <div id="map"></div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST (KM)</div><div id="dist" class="value">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT (MS)</div><div id="gct" class="value">--</div></div>
            <div class="card"><div class="label">FLIGHT (%)</div><div id="flight" class="value">--</div></div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button id="sub-tab-list" style="flex:1; height:40px; border-radius:10px; background:#222; color:#fff; border:none; font-weight:800;" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-info" style="flex:1; height:40px; border-radius:10px; background:#222; color:#fff; border:none; font-weight:800;" onclick="showSubTab('info')">METRO</button>
        </div>
        <div id="sub-page-list" class="sub-page"><div id="history-list"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="setting-box">
                <h3 style="color:var(--metro-color); margin-bottom:10px; font-size:16px;">🎸 METRONOME</h3>
                <div class="metro-row"><span>BPM</span><input type="range" id="bpm-range" min="150" max="195" value="175" oninput="updateBPM(this.value)"><span id="bpm-val" style="width:30px">175</span></div>
                <div class="metro-row"><span>VOL</span><input type="range" id="vol-range" min="0" max="1" step="0.1" value="0.7" oninput="updateVol(this.value)"><span id="vol-val" style="width:35px">70%</span></div>
                <button onclick="toggleMetronome()" id="btn-metro-main" style="width:100%; height:45px; border-radius:10px; background:var(--metro-color); color:#000; font-weight:900; border:none;">START BEAT</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx, metroTimer, metroGain;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0;

// 지도 초기화 함수 (타이밍 이슈 방지)
function initMap() {
    if (map) return;
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    // 위치 추적 시작
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    
    // 지도 크기 재계산 (검은 화면 방지)
    setTimeout(() => { map.invalidateSize(); }, 500);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = p.coords.accuracy;
    document.getElementById('accuracy-box').textContent = `GPS ±${Math.round(acc)}m`;
    
    if (map && marker) {
        marker.setLatLng(pos);
        if (isRunning && !isPaused && acc < 40) {
            if (lastPos) {
                let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
                if (d > 0.002) { 
                    totalDist += d; 
                    document.getElementById('dist').textContent = totalDist.toFixed(2); 
                    lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(p.coords.speed * 3.6);
        } else if (!isRunning) { map.panTo(pos); }
    }
}

// 메트로놈 & 컨트롤 로직
function toggleMetronome() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        metroGain = audioCtx.createGain();
        metroGain.gain.value = document.getElementById('vol-range').value;
        metroGain.connect(audioCtx.destination);
    }
    isMetroOn = !isMetroOn;
    const btn = document.getElementById('btn-metro-main');
    if (isMetroOn) {
        btn.textContent = "STOP BEAT"; btn.style.background = "var(--danger)"; btn.style.color = "#fff";
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        btn.textContent = "START BEAT"; btn.style.background = "var(--metro-color)"; btn.style.color = "#000";
        clearTimeout(metroTimer);
    }
}
function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.frequency.value = 1200; 
        env.gain.setValueAtTime(0, nextClickTime);
        env.gain.linearRampToValueAtTime(1, nextClickTime + 0.005);
        env.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05);
        osc.connect(env); env.connect(metroGain);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.06);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function onStart() { isRunning = true; isPaused = false; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; timer = setInterval(() => { if(!isPaused) seconds++; document.getElementById('time').textContent = formatTime(seconds); }, 1000); }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }
function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }
function updateVol(v) { if(metroGain) metroGain.gain.value = v; document.getElementById('vol-val').textContent = Math.round(v*100) + '%'; }

function showTab(t) {
    document.getElementById('run-view').style.display = t==='run'?'flex':'none';
    document.getElementById('history-view').style.display = t==='history'?'flex':'none';
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
    if(t==='run') setTimeout(() => { if(map) map.invalidateSize(); }, 200);
}
function showSubTab(s) {
    document.getElementById('sub-page-list').style.display = s==='list'?'flex':'none';
    document.getElementById('sub-page-info').style.display = s==='info'?'flex':'none';
}

window.onload = initMap;
</script>
</body>
</html>
