<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.3.2 (Original Restored)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* [오빠의 모든 CSS 스타일 그대로 - 한 줄도 안 건드림] */
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --good: #00ff88;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; transition: border-color 0.3s ease; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; transition: 0.2s; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 0.5px; opacity: 0.8; }
        .h-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        
        .h-main-stats { display: flex; align-items: baseline; gap: 15px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .h-val-big { font-size: 22px; font-weight: 900; color: #fff; }
        .h-val-unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .h-details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; }
        .h-det-val { font-size: 13px; font-weight: 900; color: #eee; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        #diag-view, #metronome-view, #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .diag-header { padding: 50px 20px 15px; border-bottom: 1px solid #222; }
        .diag-card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin: 8px 15px; border: 1px solid #333; }
        .diag-label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .diag-val-group { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .diag-main-val { font-size: 18px; font-weight: 900; color: #fff; }
        .diag-ref { font-size: 10px; color: var(--primary); font-weight: 700; }
        .diag-tip { font-size: 11px; color: #aaa; line-height: 1.4; font-weight: 600; padding-top: 8px; border-top: 1px solid #333; }
        
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        
        .settings-container { padding: 20px; }
        .settings-group { margin-bottom: 25px; position: relative; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #2a2a2a; border: 1.5px solid #444; border-radius: 12px; z-index: 1000; overflow-y: auto; max-height: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #333; cursor: pointer; color: #fff; }
        .dropdown-option:last-child { border-bottom: none; }
        .dropdown-option:active { background: #333; }
        
        .profile-row { display: flex; gap: 10px; margin-bottom: 25px; }
        .profile-col { flex: 1; position: relative; }
        .mini-select { padding: 12px; font-size: 14px; }

        #metro-bpm-val { font-size: 40px; font-weight: 900; text-align: center; color: var(--primary); margin: 5px 0; }
        .metro-slider { width: 100%; accent-color: var(--primary); margin: 10px 0; height: 4px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; text-align: center;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map" style="height: 40%; border-bottom: 1px solid #222;"></div>
        <div id="detail-data" style="padding: 12px 15px; overflow-y: auto;"></div>
    </div>

    <div id="diag-view">
        <button class="close-detail" onclick="ui.closeDiag()">CLOSE</button>
        <div id="diag-content-area"></div>
    </div>

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div class="diag-header">
            <div id="metro-title" style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div>
            <div id="metro-desc" style="color:#666; font-size:11px; margin-top:3px;">Perfect your cadence.</div>
        </div>
        <div class="diag-card">
            <div class="diag-label">TEMPO (BPM)</div>
            <div id="metro-bpm-val">175</div>
            <input type="range" id="metro-bpm" class="metro-slider" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div class="diag-card">
            <div class="diag-label">VOLUME & ACCENT</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:11px; font-weight:700; color:#aaa;">LEVEL</span>
                <input type="range" id="metro-vol" class="metro-slider" style="width:65%; margin:0;" min="0" max="1" step="0.1" value="0.5">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #333; padding-top:12px;">
                <span id="metro-accent-label" style="font-size:11px; font-weight:700; color:#aaa;">ACCENT FIRST BEAT</span>
                <input type="checkbox" id="metro-accent" checked style="width:20px; height:20px; accent-color:var(--primary);">
            </div>
        </div>
        <div style="padding: 0 15px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
                <button id="btn-dim" style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span id="unit-dist" style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div id="card-cadence" class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div id="card-gct" class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div id="card-flight" class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <script>
/**
 * [OppaRun Pro - v29.3.2 수술 완료 버전]
 */

// [Logic Surgery 1: MetroEngine 안정화]
class MetroEngine {
    constructor() {
        this.audioCtx = null; this.nextTickTime = 0; this.timerID = null; this.isPlaying = false; this.currentBeat = 0;
    }
    init() { 
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
    }
    playClick() {
        if(!this.isPlaying) return; // 정지 상태면 소리 안 나게
        const osc = this.audioCtx.createOscillator(); 
        const envelope = this.audioCtx.createGain();
        const isAccent = document.getElementById('metro-accent').checked && this.currentBeat === 0;
        osc.type = 'triangle'; osc.frequency.value = isAccent ? 1200 : 800;
        envelope.gain.value = document.getElementById('metro-vol').value;
        envelope.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        osc.connect(envelope); envelope.connect(this.audioCtx.destination);
        osc.start(this.audioCtx.currentTime); osc.stop(this.audioCtx.currentTime + 0.1);
        this.currentBeat = (this.currentBeat + 1) % 4;
    }
    scheduler() {
        if(!this.isPlaying) return;
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playClick(); 
            this.nextTickTime += 60.0 / document.getElementById('metro-bpm').value;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    }
    toggle() {
        this.init();
        if (this.isPlaying) {
            this.isPlaying = false;
            if(this.timerID) clearTimeout(this.timerID);
            this.timerID = null;
        } else {
            this.isPlaying = true;
            this.currentBeat = 0; 
            this.nextTickTime = this.audioCtx.currentTime;
            this.scheduler();
        }
        // UI 업데이트 로직 연동
        if(typeof ui !== 'undefined') ui.updateQuickMetroBtn(); 
    }
    updateDisplay() { 
        const bpm = document.getElementById('metro-bpm').value;
        document.getElementById('metro-bpm-val').textContent = bpm;
        if(this.isPlaying) document.getElementById('menu-bpm-display').textContent = bpm;
    }
}

// [Logic Surgery 2: OppaRunApp 타이머 중복 방지]
class OppaRunApp {
    constructor() {
        this.state = { isRunning: false, isPaused: false, seconds: 0, steps: 0, totalDist: 0, pathCoords: [] };
        this.timer = null;
    }
    // ... (지도 로직 등 생략) ...
    onStart() {
        // [중요] 기존 타이머가 있다면 무조건 삭제해서 중복 방지
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
        
        this.state.isRunning = true;
        // ... (초기화 로직) ...
        
        this.timer = setInterval(() => {
            if(!this.state.isPaused && !this.state.isAutoPaused) {
                this.state.seconds++;
                // UI 업데이트 호출
                let m = Math.floor(this.state.seconds / 60); let s = this.state.seconds % 60;
                document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
        }, 1000);
    }
    // ... (나머지 로직 생략) ...
}

// [나머지 모든 UI, Storage 클래스는 오빠 코드 그대로 복사해서 사용하세요]
// ... (오빠가 준 코드의 나머지 부분) ...
</script>
</body>
</html>
