<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun Pro - History</title>
    <style>
        /* 1. 글로벌 스타일: 가로 스크롤 원천 차단 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* 패딩이 너비를 키우지 않게 고정 */
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden; /* 가로 흔들림 방지 핵심 */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain; /* 세로 스크롤 시 튕김 방지 */
        }

        /* 2. 상단 네비게이션 */
        .header {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            background-color: #000;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-menu {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .tab-item {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            background: #222;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
        }

        .tab-item.active {
            background: #4ADE80; /* 강조된 녹색 */
            color: #000;
        }

        /* 3. 기록 리스트 컨테이너 (고정감 부여) */
        .history-container {
            width: 100%;
            padding: 10px 15px 80px 15px; /* 하단바 공간 확보 */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 4. 기록 카드 UI (이미지 분석 반영) */
        .history-card {
            width: 100%;
            background: #151515;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #222;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timestamp {
            color: #4ADE80;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .small-btn {
            background: #222;
            color: #4ADE80;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .main-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .dist { font-size: 24px; font-weight: 800; }
        .time { font-size: 24px; font-weight: 800; color: #4ADE80; }

        .sub-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid #222;
            padding-top: 10px;
            text-align: center;
        }

        .stat-label { font-size: 10px; color: #666; margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: bold; }

        /* 5. 하단 네비게이션 바 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 65px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item { color: #555; font-weight: bold; text-decoration: none; }
        .nav-item.active { color: #4ADE80; }

    </style>
</head>
<body>

    <header class="header">
        <div class="tab-menu">
            <div class="tab-item active">목록</div>
            <div class="tab-item">통계</div>
            <div class="tab-item">정보</div>
            <div class="tab-item">설정</div>
        </div>
    </header>

    <main class="history-container">
        
        <div class="history-card">
            <div class="card-header">
                <span class="timestamp">5/13/2026, 7:47:43 PM</span>
                <div class="btn-group">
                    <button class="small-btn">경로</button>
                    <button class="small-btn">진단</button>
                </div>
            </div>
            <div class="main-stats">
                <div class="dist">1.54KM</div>
                <div class="time">02:56</div>
            </div>
            <div class="sub-stats">
                <div><p class="stat-label">PACE</p><p class="stat-value">1'54"</p></div>
                <div><p class="stat-label">CAD</p><p class="stat-value">19</p></div>
                <div><p class="stat-label">KCAL</p><p class="stat-value">100</p></div>
                <div><p class="stat-label">GCT/FLT</p><p class="stat-value">209/55%</p></div>
            </div>
        </div>

        <div class="history-card">
            <div class="card-header">
                <span class="timestamp">5/13/2026, 7:42:36 PM</span>
                <div class="btn-group">
                    <button class="small-btn">경로</button>
                    <button class="small-btn">진단</button>
                </div>
            </div>
            <div class="main-stats">
                <div class="dist">1.12KM</div>
                <div class="time">01:52</div>
            </div>
            <div class="sub-stats">
                <div><p class="stat-label">PACE</p><p class="stat-value">1'38"</p></div>
                <div><p class="stat-label">CAD</p><p class="stat-value">15</p></div>
                <div><p class="stat-label">KCAL</p><p class="stat-value">73</p></div>
                <div><p class="stat-label">GCT/FLT</p><p class="stat-value">41/119%</p></div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item">러닝</a>
        <a href="#" class="nav-item active">기록</a>
    </nav>

</body>
</html>
