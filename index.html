<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.30</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100svh; overflow: hidden; }
        
        /* 메인 레이아웃 */
        #map-area { height: 15vh; width: 100%; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .main-content { padding: 10px; display: flex; flex-direction: column; height: 75vh; overflow-y: auto; }
        
        /* 대시보드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px 5px; text-align: center; border: 1px solid #222; }
        .label { font-size: 10px; color: #888; font-weight: 800; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: 900; }
        
        /* 버튼 스타일 */
        .btn-start { width: 100%; height: 60px; background: var(--primary); color: #000; border-radius: 30px; border: none; font-size: 20px; font-weight: 900; margin-top: 10px; }
        
        /* [중요] 상세 페이지 오버레이 (망친 부분 복구) */
        #record-detail-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000000; /* 배경을 완전히 검게 */
            z-index: 9999; display: none; flex-direction: column; 
        }
        #det-map-area { height: 45%; width: 100%; border-bottom: 2px solid var(--primary); position: relative; }
        #det-map { height: 100%; width: 100%; }
        .det-data-area { height: 55%; padding: 20px; overflow-y: auto; background: #000; }
        .det-dist-focus { font-size: 56px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 20px; }
        .back-btn { 
            position: absolute; top: 15px; left: 15px; z-index: 10000; 
            background: #000; color: #fff; border: 2px solid var(--primary); 
            padding: 10px 20px; border-radius: 25px; font-weight: 900; 
        }

        /* 기록 리스트 스타일 */
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .h-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .route-btn { background: #1a1a1a; color: var(--primary); border: 1px solid var(--primary); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; }

        /* 하단 탭 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; border-top: 1px solid #222; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="map-area"><div id="map"></div></div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card" style="grid-column: span 3; border: 2px solid var(--primary);">
                <div class="label">PACE</div>
                <div class="value" style="font-size: 40px; color: var(--primary);">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value">0</div></div>
        </div>
        <button class="btn-start">러닝 시작</button>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list">
            <div class="history-item">
                <div class="h-top">
                    <span style="color:var(--primary); font-size:12px; font-weight:700;">May 11, Mon</span>
                    <button class="route-btn" onclick="viewRecordMap(101)">경로지도</button>
                </div>
                <div style="font-size:24px; font-weight:900;">0.37 KM <span style="font-size:14px; color:#888;">00:08</span></div>
            </div>
        </div>
    </div>

    <div id="record-detail-view">
        <button class="back-btn" onclick="closeDetail()">← BACK</button>
        <div id="det-map-area"><div id="det-map"></div></div>
        <div class="det-data-area">
            <div id="det-date" style="color:var(--primary); font-weight:700; font-size:14px; margin-bottom:5px;">Date</div>
            <div class="det-dist-focus"><span id="det-dist">0.00</span><span style="font-size:20px; margin-left:5px;">KM</span></div>
            <div class="dashboard">
                <div class="card"><div class="label">TIME</div><div id="det-time" class="value">00:00</div></div>
                <div class="card"><div class="label">PACE</div><div id="det-pace" class="value">--'--"</div></div>
                <div class="card"><div class="label">GCT/FLT</div><div id="det-gct" class="value" style="font-size:14px;">--/--%</div></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('run')">러닝</button>
        <button class="tab-btn" onclick="showTab('history')">기록</button>
    </div>

<script>
    let map, detMap, detPoly;

    // 메인 지도 초기화
    map = L.map('map', {zoomControl:false, attributionControl:false}).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function showTab(type) {
        document.getElementById('run-view').style.display = type === 'run' ? 'flex' : 'none';
        document.getElementById('history-view').style.display = type === 'history' ? 'flex' : 'none';
    }

    // 상세 보기 실행
    function viewRecordMap(id) {
        // 실제로는 localStorage에서 id로 데이터를 가져와야 함 (오빠의 기존 데이터 로직 연결)
        const mockData = { date: "May 11, Mon", dist: "0.37", time: "00:08", pace: "21'35\"", gct: "280ms / 12%", path: [[37.5665, 126.9780], [37.5675, 126.9790]] };
        
        document.getElementById('record-detail-view').style.display = 'flex';
        document.getElementById('det-date').innerText = mockData.date;
        document.getElementById('det-dist').innerText = mockData.dist;
        document.getElementById('det-time').innerText = mockData.time;
        document.getElementById('det-pace').innerText = mockData.pace;
        document.getElementById('det-gct').innerText = mockData.gct;

        setTimeout(() => {
            if (!detMap) {
                detMap = L.map('det-map', {zoomControl:false, attributionControl:false});
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detMap);
                detPoly = L.polyline([], {color: '#00ff88', weight: 5}).addTo(detMap);
            }
            detPoly.setLatLngs(mockData.path);
            detMap.fitBounds(detPoly.getBounds(), {padding: [20, 20]});
            detMap.invalidateSize();
        }, 300);
    }

    function closeDetail() {
        document.getElementById('record-detail-view').style.display = 'none';
    }
</script>
</body>
</html>
