<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.25 (Final Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text: #fff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* RUN 탭 전용 지도 영역 */
        #map-container { height: 18vh; min-height: 120px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        /* 히스토리 상단 서브 메뉴 (지도가 아니고 이게 나와야 함) */
        .sub-tabs { display: flex; gap: 5px; padding: 10px; background: #000; border-bottom: 1px solid #222; }
        .sub-tab-btn { flex: 1; padding: 12px 0; border-radius: 8px; border: none; background: #1a1a1a; color: #555; font-size: 10px; font-weight: 900; }
        .sub-tab-btn.active { background: var(--primary); color: #000; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 대시보드 그리드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; position: relative; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 105px; }
        .dim-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 12px; background: #1a1a1a; border: 1px solid #333; color: #555; font-size: 11px; font-weight: 900; }
        
        .label { font-size: 10px; color: #666; font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 54px; color: var(--primary); font-weight: 900; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        /* 메인 하단 버튼 */
        .btn-container { padding: 20px; display: flex; justify-content: center; margin-bottom: 85px; }
        #btn-start { width: 100%; height: 65px; border-radius: 33px; border: none; background: var(--primary); color: #000; font-weight: 900; font-size: 24px; box-shadow: 0 4px 15px rgba(0,255,136,0.3); }

        /* 히스토리 리스트 */
        .history-list { padding: 0 10px; overflow-y: auto; flex: 1; padding-bottom: 90px; }
        .history-item { background: var(--card-bg); padding: 18px; border: 1px solid #1f1f1f; border-radius: 20px; margin-top: 10px; }
        .h-main { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
        .h-dist { font-size: 24px; font-weight: 900; }
        .h-btns { display: flex; gap: 8px; }
        .h-btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 900; border: none; }
        .btn-diag { background: #1a1a1a; color: #4477ff; border: 1px solid #2244aa; }

        /* 하단 탭바 (4개 메뉴) */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>

    <div id="run-view" class="main-content">
        <div id="map-container"><div id="map"></div></div>
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="dim-btn">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span> <span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value">-- <span style="font-size:9px">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value">-- <span style="font-size:9px">%</span></div></div>
        </div>
        <div class="btn-container">
            <button id="btn-start">START RUNNING</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="sub-tabs">
            <button class="sub-tab-btn active">LIST</button>
            <button class="sub-tab-btn">TOTAL</button>
            <button class="sub-tab-btn">INFO</button>
            <button class="sub-tab-btn">SETTINGS</button>
        </div>
        <div id="history-list" class="history-list">
            <div class="history-item">
                <div style="font-size:11px; color:var(--primary); font-weight:800; margin-bottom:5px;">May 11, Mon</div>
                <div class="h-main">
                    <div class="h-dist">0.00 <span class="unit">KM</span></div>
                    <div style="font-size:20px; font-weight:700;">00:00</div>
                    <div class="h-btns"><button class="h-btn btn-diag">진단</button></div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button class="tab-btn">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
        <button class="tab-btn">SHARE</button>
    </div>

<script>
    let map;
    function initMap() {
        map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7, -117.9], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([33.7, -117.9]).addTo(map);
    }

    function showTab(t) {
        const isRun = (t === 'run');
        document.getElementById('run-view').style.display = isRun ? 'flex' : 'none';
        document.getElementById('history-view').style.display = isRun ? 'none' : 'flex';
        document.getElementById('tab-run').classList.toggle('active', isRun);
        document.getElementById('tab-history').classList.toggle('active', !isRun);
        // 히스토리 탭에서는 지도가 안 보이도록 run-view 전체를 숨김
    }

    window.onload = initMap;
</script>
</body>
</html>
