<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v32.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 메인 레이아웃 복구 */
        #map-area { flex-shrink: 0; width: 100%; border-bottom: 2px solid #222; }
        #map { height: 15vh; min-height: 110px; width: 100%; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 90px; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 100px; }
        .label { font-size: 10px; color: #999; font-weight: 900; margin-bottom: 5px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 20px; }
        .btn-act { width: 100%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 22px; cursor: pointer; background: var(--primary); color: #000; }

        /* 설정 페이지 & 미니 메트로놈 */
        .sub-page { display: none; padding: 20px; flex-direction: column; gap: 20px; }
        .metro-mini-card { background: #111; border: 1.5px solid #333; border-radius: 20px; padding: 20px; text-align: center; }
        .metro-title { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 15px; letter-spacing: 1px; }
        .metro-bpm-display { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .slider { width: 100%; height: 6px; -webkit-appearance: none; background: #333; border-radius: 3px; margin: 20px 0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        .btn-metro-toggle { width: 100%; height: 50px; border-radius: 12px; border: none; font-weight: 900; background: #222; color: #fff; font-size: 14px; }
        .btn-metro-toggle.active { background: var(--danger); }

        /* 하단 탭 바 (고정 크기) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; padding-top: 15px; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body onclick="initAudio()"> 
    <div id="map-area"><div id="map"></div></div>

    <!-- 러닝 메인 화면 -->
    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px;"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" onclick="onStart()">START RUNNING</button>
        </div>
    </div>

    <!-- 설정 화면 -->
    <div id="history-view" class="main-content" style="display:none;">
        <div id="sub-page-settings" class="sub-page" style="display: flex;">
            <div class="metro-mini-card">
                <div class="metro-title">TRAINING METRONOME</div>
                <div id="bpm-text" class="metro-bpm-display">170 BPM</div>
                <input type="range" class="slider" min="120" max="200" value="170" oninput="updateBPM(this.value)">
                <button id="btn-metro" class="btn-metro-toggle" onclick="toggleMetro()">START METRONOME</button>
            </div>
            <button onclick="localStorage.removeItem('oppaRunHistory'); location.reload();" style="background:none; border:1px solid #222; color:#555; padding:15px; border-radius:12px; font-weight:900; font-size:11px;">CLEAR ALL DATA</button>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">SETTINGS</button>
    </div> 

<script>
let audioCtx, metroTimer, isPlaying = false, bpm = 170;

// 사운드 활성화 (화면 첫 터치 시 실행)
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function updateBPM(val) {
    bpm = val;
    document.getElementById('bpm-text').textContent = val + " BPM";
    if (isPlaying) { toggleMetro(); toggleMetro(); }
}

function playTick() {
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    osc.type = 'sine'; // 경쾌한 딱딱이 소리
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
    env.gain.setValueAtTime(0.5, audioCtx.currentTime);
    env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(env); env.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}

function toggleMetro() {
    const btn = document.getElementById('btn-metro');
    if (isPlaying) {
        clearInterval(metroTimer);
        isPlaying = false;
        btn.textContent = "START METRONOME";
        btn.classList.remove('active');
    } else {
        initAudio();
        metroTimer = setInterval(playTick, 60000 / bpm);
        isPlaying = true;
        btn.textContent = "STOP METRONOME";
        btn.classList.add('active');
    }
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').classList.toggle('active', tab === 'run');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
}

// 지도 및 기본 기능
let map;
function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}
function onStart() { alert("Running Started!"); }
window.onload = initMap;
</script>
</body>
</html>
