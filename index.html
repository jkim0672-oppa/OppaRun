<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; }

        /* 1. 상단 지도 영역 */
        #map-area { height: 125px; position: relative; flex-shrink: 0; }
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; bottom: 0; width: 100%; text-align: center; color: var(--warning); font-size: 10px; padding: 3px; background: rgba(0,0,0,0.7); font-weight: 800; z-index: 1000; }
        
        /* 2. 중앙 대시보드 영역 */
        .main-content { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 75px; position: relative; cursor: pointer; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; }
        .value { font-size: 18px; font-weight: 900; }
        .value-large { font-size: 38px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 3. 하단 컨트롤 버튼 */
        .controls { padding: 8px 8px 85px 8px; flex-shrink: 0; }
        .btn-act { width: 100%; height: 52px; border-radius: 26px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* 디머 레이어 */
        #dimmer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 20000; display: none; cursor: pointer;
        }
        .dim-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .dim-hint { color: var(--primary); font-size: 13px; font-weight: 700; opacity: 0.2; letter-spacing: 2px; }

        /* 탭바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        
        /* 히스토리 리스트 */
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #1f1f1f; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .h-dist { font-size: 19px; font-weight: 900; color: var(--primary); }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 5px; gap: 4px; font-size: 10px; }
        
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body onclick="handleGlobalClick()">
    <div class="app-container">
        <div id="dimmer" onclick="toggleDimmer(event)">
            <div class="dim-info"><div class="dim-hint">GPS ACTIVE<br>TAP TO WAKE UP</div></div>
        </div>

        <div id="map-area">
            <div id="map"></div>
            <div id="status" class="status-bar">GPS INITIALIZING...</div>
        </div> 

        <div id="run-view" class="main-content">
            <div class="dashboard-grid">
                <div class="card card-main" onclick="toggleDimmer(event)">
                    <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                    <div class="label" style="color:var(--primary)">PACE</div>
                    <div id="curPace" class="value-large">--'--"</div>
                </div>
                <div class="card"><div class="label">DIST (KM)</div><div class="value" id="dist">0.00</div></div>
                <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00</div></div>
                <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0</div></div>
                <div class="card"><div class="label">GCT (MS)</div><div class="value" id="gct">--</div></div>
                <div class="card"><div class="label">FLIGHT (%)</div><div class="value" id="flight">--</div></div>
                <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">--'--"</div></div>
            </div>
            
            <div class="controls">
                <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart(event)">START RUNNING</button>
                <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop(event)">STOP</button>
                <div id="after-stop" style="display:none; gap:10px;">
                    <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume(event)">RESUME</button>
                    <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish(event)">FINISH</button>
                </div>
            </div>
        </div>

        <div id="history-view" class="main-content" style="display:none;">
            <div id="history-list" style="padding-bottom:90px;"></div>
        </div>

        <div class="tab-bar">
            <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
            <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
        </div>
    </div>

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, gctSum = 0, flightSum = 0, dataCount = 0;
let pathCoords = [], wakeLock = null, currentSpeedKmh = 0;

async function requestWakeLock() {
    if ('wakeLock' in navigator && !wakeLock) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
}

function handleGlobalClick() { if (isRunning && !isPaused) requestWakeLock(); }

function toggleDimmer(e) {
    if (e) e.stopPropagation();
    const dimmer = document.getElementById('dimmer');
    if (isRunning) {
        dimmer.style.display = (dimmer.style.display === 'block') ? 'none' : 'block';
        if (dimmer.style.display === 'block') requestWakeLock();
    }
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (err) => { 
            document.getElementById('status').textContent = "GPS ERROR: " + err.message; 
        }, {enableHighAccuracy: true}); 
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let speed = currentSpeedKmh;
        let gct = speed > 0.5 ? Math.floor(450 - (speed * 10)) : 0;
        let flt = speed > 2.0 ? Math.floor(5 + (speed * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = (flt || "--");
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { 
            isAutoPaused = true; document.getElementById('pause-status').style.display = 'block';
        } else if (currentSpeedKmh >= 0.8 && isAutoPaused) { 
            isAutoPaused = false; document.getElementById('pause-status').style.display = 'none';
        }
        
        if (!isAutoPaused && p.coords.accuracy < 50) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
        document.getElementById('status').textContent = `ACTIVE (±${p.coords.accuracy.toFixed(1)}m)`;
    } else { 
        map.panTo(pos); 
        document.getElementById('status').textContent = `READY (±${p.coords.accuracy.toFixed(1)}m)`;
    }
} 

function onStart(e) {
    if(e) e.stopPropagation();
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; dataCount = 0; gctSum = 0; flightSum = 0; pathCoords = [];
    requestWakeLock();
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop(e) { if(e) e.stopPropagation(); isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume(e) { if(e) e.stopPropagation(); isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; requestWakeLock(); } 

function onFinish(e) {
    if(e) e.stopPropagation();
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0;
    const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0;
    const avgCad = Math.round((steps/(seconds||1))*60);
    const record = { id: Date.now(), date: new Date().toLocaleDateString('ko-KR', {month:'short', day:'numeric', weekday:'short'}), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cad: avgCad, gctflt: `${avgGct}/${avgFlt}%` };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').classList.toggle('active', tab === 'run');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
    else updateHistoryUI();
}

function updateHistoryUI() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-main"><span class="h-dist">${r.dist} KM</span><span style="font-size:12px; color:#666;">${r.date}</span></div>
            <div class="h-details">
                <div>PACE<br><strong>${r.pace}</strong></div>
                <div>TIME<br><strong>${r.time}</strong></div>
                <div>CAD<br><strong>${r.cad}</strong></div>
                <div>GCT/FLT<br><strong>${r.gctflt}</strong></div>
            </div>
        </div>`).join('');
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
