<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v17.5 - Perfect Flow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; --warning: #ffcc00; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; }
        
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #121212; border-bottom: 1px solid #222; }
        
        .dashboard { height: 42vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
        .value { font-size: 26px; font-weight: 900; }
        .unit { font-size: 12px; color: var(--primary); margin-left: 3px; }
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.05); }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }

        /* 버튼 컨트롤 영역 */
        .controls { position: fixed; bottom: 90px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .btn-main { width: 85%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 20px; transition: 0.2s; }
        
        /* 버튼 상태별 표시 제어 */
        #btn-start { background: var(--primary); color: #000; display: block; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 15px; width: 85%; }
        .btn-split { flex: 1; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 18px; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        .my-location { background: #007bff; border: 2px solid white; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 10px #007bff; }
    </style>
</head>
<body>

<div id="page-home">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card-highlight card"><div class="label">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
    </div>

    <div class="controls">
        <button id="btn-start" class="btn-main" onclick="onStart()">START RUN</button>
        <button id="btn-stop" class="btn-main" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-split" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-split" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; padding:20px; height:100vh; overflow-y:auto; background:#000;">
    <h2 style="color:var(--primary)">HISTORY</h2>
    <div id="history-list"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('home')">RUN</button>
    <button class="tab-btn" onclick="switchTab('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [];
let totalDist = 0, isRunning = false, isPaused = false, seconds = 0;
let lastPos = null, timer, lastKmDist = 0;

function init() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[14,14]})}).addTo(map);

    navigator.geolocation.watchPosition(p => {
        const {latitude, longitude, accuracy, speed} = p.coords;
        const pos = [latitude, longitude];
        marker.setLatLng(pos);
        document.getElementById('status').textContent = `GPS Accuracy: ±${Math.round(accuracy)}m`;

        if(isRunning && !isPaused) {
            if(lastPos) {
                const d = calcDist(lastPos[0], lastPos[1], latitude, longitude);
                if(d > 0.002) {
                    totalDist += d;
                    document.getElementById('dist').textContent = totalDist.toFixed(2);
                    pathArray.push(pos); pathLine.setLatLngs(pathArray); map.panTo(pos);
                }
            }
            if(speed > 0.5) document.getElementById('curPace').textContent = formatPace(16.6667/speed);
            lastPos = pos;
        }
    }, null, {enableHighAccuracy:true});
}

function onStart() {
    isRunning = true; isPaused = false;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => {
        if(!isPaused) {
            seconds++;
            const h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60;
            document.getElementById('time').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if(totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace((seconds/60)/totalDist);
        }
    }, 1000);
}

function onStop() {
    isPaused = true;
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('after-stop').style.display = 'flex';
}

function onResume() {
    isPaused = false;
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
}

function onFinish() {
    // 기록 저장 로직은 이전과 동일하게 유지
    location.reload();
}

function formatPace(p) {
    if(!p || p === Infinity) return "--'--\"";
    const m = Math.floor(p), s = String(Math.floor((p-m)*60)).padStart(2,'0');
    return `${m}'${s}"`;
}

function calcDist(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function switchTab(t) {
    document.getElementById('page-home').style.display = t==='home'?'block':'none';
    document.getElementById('page-history').style.display = t==='history'?'block':'none';
}

window.onload = init;
</script>
</body>
</html>
