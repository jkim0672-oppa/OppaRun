<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Backup & Settings</title>
    <style>
        /* [기존 레이아웃 보존] 기존 앱의 스타일시트를 그대로 유지합니다 */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #007aff;
            --danger-color: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            padding: 20px;
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        /* 탭 서브 네비게이션 */
        .sub-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 10px;
        }
        .sub-nav-item {
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .sub-nav-item.active {
            color: var(--accent-color);
            position: relative;
        }
        .sub-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--accent-color);
        }
        /* 설정 섹션 스타일 */
        .setting-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .setting-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            margin-bottom: 12px;
        }
        .btn-primary:active {
            background-color: #0062cc;
        }
        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .btn-danger:active {
            background-color: rgba(255, 59, 48, 0.1);
        }
        .info-text {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-top: 8px;
        }
        /* 하단 탭 바 기본 레이아웃 보존 */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            text-decoration: none;
        }
        .tab-item.active {
            color: var(--accent-color);
        }
        .tab-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>HISTORY</h1>
        </div>

        <div class="sub-nav">
            <span class="sub-nav-item" onclick="location.href='#list'">기록 목록</span>
            <span class="sub-nav-item" onclick="location.href='#stats'">통계</span>
            <span class="sub-nav-item active">SETTINGS</span>
        </div>

        <div class="setting-section">
            <div class="setting-title">데이터 백업 및 관리</div>
            
            <button class="btn btn-primary" onclick="downloadBackupData()">
                💾 BACKUP DATA DOWNLOAD
            </button>
            <p class="info-text">
                현재까지 누적된 러닝 데이터 기록을 안전하게 JSON 파일로 추출합니다. 브라우저 캐시 삭제 전이나 기기 변경 시 백업용으로 사용하세요.
            </p>
            
            <div style="margin-top: 24px; border-top: 1px solid #2c2c2e; padding-top: 20px;">
                <button class="btn btn-danger" onclick="clearAllData()">
                    ⚠️ 전체 기록 삭제
                </button>
                <p class="info-text" style="color: var(--danger-color);">
                    주의: 삭제된 데이터는 복구할 수 없으므로 반드시 미리 백업 파일을 다운로드해 두세요.
                </p>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <a href="#run" class="tab-item">
            <span class="tab-icon">🏃‍♂️</span>
            <span>RUN</span>
        </a>
        <a href="#history" class="tab-item active">
            <span class="tab-icon">📊</span>
            <span>HISTORY</span>
        </a>
    </div>

    <script>
        // ==========================================
        // [기존 로직 보존 및 정밀 고도화 스크립트]
        // ==========================================

        // 1. 데이터 백업 다운로드 기능 (사용자 안내 메시지 추가)
        function downloadBackupData() {
            // [기존 로직 완벽 보존] LocalStorage 데이터 파싱 및 가상 링크 생성 과정 보존
            const dataStr = localStorage.getItem('oppa_run_data') || '{}'; 
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;
            
            a.href = url;
            a.download = `oppa_run_backup_${dateStr}.json`;
            
            // 트리거 실행
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // [추가된 안내 로직] 사용자가 파일 탐색 경로를 혼동하지 않도록 팝업 노출
            setTimeout(() => {
                alert(
                    "💾 백업 파일 다운로드 완료!\n\n" +
                    "오빠, 백업 파일이 기기의 '다운로드(Download)' 폴더에 안전하게 저장됐어!\n\n" +
                    "💡 혹시 화면에 '연결 프로그램(Open with)' 창이 뜨더라도 당황하지 말고 그냥 창을 닫아줘. 그 다음 스마트폰의 [내 파일] 앱 ➔ [다운로드] 폴더로 들어가면 파일이 예쁘게 들어있을 거야!"
                );
            }, 500);
        }

        // 2. 전체 데이터 삭제 기능 (기존 로직 보존)
        function clearAllData() {
            if (confirm("정말로 모든 러닝 기록을 삭제할까? 삭제하면 완전히 날아가니까 신중해야 해!")) {
                localStorage.removeItem('oppa_run_data');
                alert("모든 데이터가 초기화되었습니다.");
                location.reload();
            }
        }
    </script>
</body>
</html>
