<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OppaRun Pro v30 (Modular Core)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
    --primary:#00ff88;
    --bg:#000;
    --card:#121212;
    --text:#fff;
    --dim:#777;
    --danger:#ff4444;
    --warning:#ffcc00;
}

*{box-sizing:border-box;}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,system-ui;
    overflow:hidden;
}

#map{height:18vh;min-height:120px;}
.status{padding:6px;text-align:center;font-size:11px;color:var(--warning);}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:8px;
}

.card{
    background:var(--card);
    border-radius:12px;
    padding:12px;
    text-align:center;
    border:1px solid #222;
}

.main{
    grid-column:span 3;
    font-size:40px;
    color:var(--primary);
    font-weight:900;
}

.btn{
    width:100%;
    height:60px;
    border:none;
    font-weight:900;
    font-size:18px;
}

#start{background:var(--primary);}
#stop{background:var(--danger);display:none;}
</style>
</head>

<body>

<div id="map"></div>
<div id="status">INIT</div>

<div class="dashboard">

    <div class="card main" id="pace">--'--"</div>

    <div class="card">
        <div>DIST</div>
        <div id="dist">0.00</div>
    </div>

    <div class="card">
        <div>TIME</div>
        <div id="time">00:00</div>
    </div>

    <div class="card">
        <div>CAD</div>
        <div id="cadence">0</div>
    </div>

    <div class="card">
        <div>EFF</div>
        <div id="eff">--</div>
    </div>

    <div class="card">
        <div>BAL</div>
        <div id="bal">--</div>
    </div>

</div>

<div>
    <button id="start" class="btn" onclick="run.start()">START</button>
    <button id="stop" class="btn" onclick="run.stop()">STOP</button>
</div>

<script>

/* =========================
   STATE (ONLY SOURCE OF TRUTH)
========================= */

const state = {

    running:false,

    time:0,
    distance:0,

    speed:0,

    steps:0,
    stepTimes:[],

    path:[],

    lastPos:null,

    smoothLat:null,
    smoothLng:null,

    autoPause:false,
    lowSpeedAt:null
};

/* =========================
   GPS MODULE
========================= */

const gps = {

    map:null,
    marker:null,
    line:null,

    init(){

        this.map = L.map('map',{
            zoomControl:false
        }).setView([33.77,-117.91],17);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ).addTo(this.map);

        this.marker = L.marker([0,0]).addTo(this.map);

        this.line = L.polyline([],{
            color:'#00ff88'
        }).addTo(this.map);

        navigator.geolocation.watchPosition(
            gps.update,
            ()=>document.getElementById('status').textContent="GPS ERROR",
            {enableHighAccuracy:true}
        );
    },

    update(p){

        let lat = p.coords.latitude;
        let lng = p.coords.longitude;

        if(state.smoothLat === null){

            state.smoothLat = lat;
            state.smoothLng = lng;

        }else{

            state.smoothLat =
                state.smoothLat * 0.7 + lat * 0.3;

            state.smoothLng =
                state.smoothLng * 0.7 + lng * 0.3;
        }

        const pos = [state.smoothLat,state.smoothLng];

        gps.marker.setLatLng(pos);

        state.speed = (p.coords.speed||0)*3.6;

        if(!state.running) return;

        if(p.coords.accuracy > 20) return;

        if(state.lastPos){

            let d = util.distance(state.lastPos,pos);

            // auto pause
            if(state.speed < 2 && d < 0.003){

                if(!state.lowSpeedAt)
                    state.lowSpeedAt = Date.now();

                if(Date.now()-state.lowSpeedAt > 1500)
                    state.autoPause = true;

            }else{
                state.lowSpeedAt = null;
                state.autoPause = false;
            }

            if(!state.autoPause && d > 0.001 && d < 0.05){

                state.distance += d;

                state.path.push(pos);

                gps.line.setLatLngs(state.path);
            }
        }

        state.lastPos = pos;

        ui.render();
    }
};

/* =========================
   MOTION MODULE
========================= */

const motion = {

    init(){
        window.addEventListener(
            "devicemotion",
            motion.update
        );
    },

    update(e){

        if(!state.running || state.autoPause) return;

        const a = e.accelerationIncludingGravity;
        if(!a) return;

        let force = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);

        let now = Date.now();

        if(force > 12){

            state.steps++;

            state.stepTimes.push(now);

            state.stepTimes =
                state.stepTimes.filter(
                    t => now - t < 10000
                );
        }
    }
};

/* =========================
   ANALYSIS MODULE
========================= */

const analysis = {

    cadence(){

        return Math.round(state.stepTimes.length * 6);
    },

    efficiency(cad){

        if(cad >= 178) return "ELITE";
        if(cad >= 170) return "GOOD";
        if(cad >= 160) return "MID";
        return "LOW";
    },

    balance(speed){

        if(speed >= 10) return "FLOW";
        if(speed >= 7) return "STABLE";
        return "SOFT";
    }
};

/* =========================
   UI MODULE
========================= */

const ui = {

    render(){

        document.getElementById("dist")
            .textContent = state.distance.toFixed(2);

        document.getElementById("pace")
            .textContent = util.pace(state.speed);

        document.getElementById("cadence")
            .textContent = analysis.cadence();

        document.getElementById("eff")
            .textContent =
            analysis.efficiency(analysis.cadence());

        document.getElementById("bal")
            .textContent =
            analysis.balance(state.speed);

        document.getElementById("status")
            .textContent =
            state.autoPause ? "AUTO PAUSED" : "RUNNING";
    }
};

/* =========================
   RUN CONTROLLER
========================= */

const run = {

    timer:null,

    start(){

        state.running = true;

        state.time = 0;
        state.distance = 0;
        state.steps = 0;

        state.path = [];
        state.stepTimes = [];

        document.getElementById("start").style.display="none";
        document.getElementById("stop").style.display="block";

        this.timer = setInterval(()=>{

            if(!state.autoPause){

                state.time++;

                let m = String(Math.floor(state.time/60)).padStart(2,'0');
                let s = String(state.time%60).padStart(2,'0');

                document.getElementById("time")
                    .textContent = `${m}:${s}`;
            }

        },1000);
    },

    stop(){

        clearInterval(this.timer);

        state.running = false;

        alert(
            "DONE\n" +
            state.distance.toFixed(2) + " KM"
        );

        document.getElementById("start").style.display="block";
        document.getElementById("stop").style.display="none";
    }
};

/* =========================
   UTIL
========================= */

const util = {

    distance(p1,p2){

        const R=6371;

        let dLat=(p2[0]-p1[0])*Math.PI/180;
        let dLon=(p2[1]-p1[1])*Math.PI/180;

        let a =
            Math.sin(dLat/2)**2 +
            Math.cos(p1[0]*Math.PI/180) *
            Math.cos(p2[0]*Math.PI/180) *
            Math.sin(dLon/2)**2;

        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    },

    pace(kmh){

        if(!kmh||kmh<0.5) return "--'--\"";

        let sec = 3600/kmh;

        return `${Math.floor(sec/60)}'${String(Math.floor(sec%60)).padStart(2,'0')}"`;
    }
};

/* =========================
   INIT
========================= */

gps.init();
motion.init();

</script>
</body>
</html>
