<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 10px; padding: 3px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; letter-spacing: 0.5px; opacity: 0.9; }
        .value { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 1px; }

        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 0 12px 12px 12px; flex-shrink: 0; }
        .total-card { background: #1a1a1a; border-radius: 10px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; margin-bottom: 2px; opacity: 0.8; }
        .total-value { font-size: 15px; font-weight: 900; color: #fff; }

        .controls { height: 80px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; flex-shrink: 0; margin-bottom: 75px; }
        .btn-capsule { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 8px; width: 100%; }
        .btn-half { flex: 1; height: 50px; border-radius: 25px; font-weight: 900; font-size: 15px; border: none; display: flex; align-items: center; justify-content: center; } 

        /* 히스토리 리스트 크기 축소 */
        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; background: #000; }
        .history-list { padding: 8px; overflow-y: auto; flex: 1; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .h-date { font-size: 10px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 10px; align-items: baseline; }
        .h-dist { font-size: 20px; font-weight: 900; color: #fff; }
        .h-time { font-size: 14px; color: #aaa; font-weight: 700; margin-left: 5px; }
        
        /* 리스트 하단 추가 공간 */
        .history-footer { padding: 20px; text-align: center; color: #333; font-size: 12px; border-top: 1px solid #111; margin-bottom: 80px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">LOCATING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit" id="gct-unit">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit" id="flight-unit">%</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content">
        <div style="padding: 15px 15px 5px 15px; display: flex; justify-content: space-between; align-items: flex-end;">
            <span style="font-size: 20px; font-weight: 900; color: var(--primary);">HISTORY</span>
        </div>
        <div class="total-dashboard">
            <div class="total-card"><span class="total-label">Total Dist</span><span id="total-dist-val" class="total-value">0.00</span></div>
            <div class="total-card"><span class="total-label">Weekly Dist</span><span id="weekly-dist-val" class="total-value">0.00</span></div>
        </div>
        <div id="history-list" class="history-list"></div>
        <div class="history-footer">
            <!-- 오빠, 여기에 추가하고 싶은 내용을 넣으면 돼! -->
            <p>ADDITIONAL TOOLS COMING SOON...</p>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0;

function initMap() {
    // 초기 위치를 잡기 위해 Geolocation 먼저 호출
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5, opacity: 0.8}).addTo(map);
    
    if ("geolocation" in navigator) {
        // [수정] 현위치를 즉시 한 번 잡아서 지도를 이동시킴
        navigator.geolocation.getCurrentPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            map.setView(pos, 17);
            marker.setLatLng(pos);
            document.getElementById('status').textContent = "GPS READY";
        }, err => {
            document.getElementById('status').textContent = "GPS ERROR: " + err.message;
        }, {enableHighAccuracy: true});

        navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    }
    loadHistory();
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1.0 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 7.5 ? Math.floor(18 + (currentSpeedKmh * 1.2)) : 0;
        gctSum += gct; flightSum += flt; dataCount++;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "0";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    // 달리는 중이 아닐 때도 지도가 현위치를 계속 따라가게 함 (로딩 문제 해결)
    if (!isRunning) map.panTo(pos);

    if (isRunning && !isPaused && !isAutoPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.005) { 
                totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2); 
                lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
            }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
} 

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('status').textContent = "RUNNING";
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; } 

function onFinish() {
    const record = { id: Date.now(), date: new Date().toLocaleDateString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    isRunning = false; clearInterval(timer);
    location.reload();
}

function loadHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = h.length ? "" : '<div style="color:#333; text-align:center; margin-top:20px;">NO DATA</div>';
    h.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main-stats"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>`;
        list.appendChild(item);
    });
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 

window.onload = initMap;
</script>
</body>
</html>
