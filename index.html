<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun - Simple Metro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; border-bottom: 2px solid #222; }
        #map { height: 15vh; min-height: 110px; width: 100%; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 90px; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 90px; }
        .label { font-size: 10px; color: #888; font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 45px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 20px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; background: var(--primary); color: #000; }

        /* 설정 페이지 - 심플 메트로놈 */
        .sub-page { display: none; padding: 20px; flex-direction: column; align-items: center; }
        .metro-box { width: 100%; max-width: 320px; background: #111; border-radius: 20px; padding: 25px; border: 1px solid #222; text-align: center; }
        .bpm-num { font-size: 40px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .slider { width: 100%; height: 6px; -webkit-appearance: none; background: #333; border-radius: 3px; margin: 20px 0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); }
        
        .sound-selector { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; }
        .sound-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #777; font-size: 11px; font-weight: 900; }
        .sound-btn.active { border-color: var(--primary); color: var(--primary); background: #00ff881a; }

        .btn-metro-run { width: 100%; height: 50px; border-radius: 12px; border: none; font-weight: 900; background: #222; color: #fff; }
        .btn-metro-run.on { background: #ff4444; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body onclick="unlockAudio()">
    <div id="map-area"><div id="map"></div></div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label">PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value">0</div></div>
        </div>
        <div class="controls"><button class="btn-act">START RUNNING</button></div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="sub-page" style="display: flex;">
            <div class="metro-box">
                <div id="bpm-val" class="bpm-num">170</div>
                <div style="font-size:12px; color:#555; margin-bottom:10px;">BPM</div>
                <input type="range" class="slider" min="140" max="200" value="170" oninput="changeBPM(this.value)">
                
                <div class="sound-selector">
                    <button id="s-beep" class="sound-btn active" onclick="setSound('beep')">BEEP</button>
                    <button id="s-wood" class="sound-btn" onclick="setSound('wood')">WOOD</button>
                    <button id="s-clap" class="sound-btn" onclick="setSound('clap')">CLAP</button>
                </div>

                <button id="btn-m" class="btn-metro-run" onclick="toggleM()">START</button>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">SETTINGS</button>
    </div>

<script>
let ctx, timer, isOn = false, bpm = 170, soundType = 'beep';

function unlockAudio() { if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }

function setSound(type) {
    soundType = type;
    document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('s-' + type).classList.add('active');
}

function playClick() {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);

    if(soundType === 'beep') {
        osc.frequency.setValueAtTime(1000, ctx.currentTime);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
    } else if(soundType === 'wood') {
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        g.gain.setValueAtTime(0.5, ctx.currentTime);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        g.gain.setValueAtTime(0.2, ctx.currentTime);
    }
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    osc.start(); osc.stop(ctx.currentTime + 0.04);
}

function changeBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; if(isOn) { toggleM(); toggleM(); } }

function toggleM() {
    const b = document.getElementById('btn-m');
    if(isOn) { clearInterval(timer); isOn = false; b.textContent = "START"; b.classList.remove('on'); }
    else { unlockAudio(); timer = setInterval(playClick, 60000/bpm); isOn = true; b.textContent = "STOP"; b.classList.add('on'); }
}

function showTab(t) {
    document.getElementById('run-view').style.display = (t==='run'?'flex':'none');
    document.getElementById('history-view').style.display = (t==='history'?'flex':'none');
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
}

// 지도 초기화
window.onload = () => {
    const map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
};
</script>
</body>
</html>
