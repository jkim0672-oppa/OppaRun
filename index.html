<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.40 (High Contrast UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            /* 모든 박스에 적용될 공통 배경과 테두리 */
            --card-bg: #1a1a1a; 
            --border-line: #444; 
            --text-main: #ffffff; --text-dim: #999999; 
            --danger: #ff4444; --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* [공통 스타일] 모든 박스/카드에 적용 */
        .ui-box {
            background: var(--card-bg) !important;
            border: 1.5px solid var(--border-line) !important;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }

        /* 메인 대시보드 카드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { 
            background: var(--card-bg); border-radius: 12px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border: 1.5px solid var(--border-line); padding: 12px 0;
        }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary) !important; height: 85px; position: relative; }

        /* 기록 리스트 (LIST) */
        .history-item { padding: 18px; margin: 12px 15px; position: relative; }
        
        /* 통계 카드 (TOTAL) */
        .total-card { padding: 15px; margin: 5px 0; }

        /* 정보 카드 (INFO) */
        .info-card { padding: 20px; margin: 12px 15px; }

        /* 설정 버튼 및 드롭다운 (SETTINGS) */
        .settings-item { 
            background: var(--card-bg); border: 1.5px solid var(--border-line);
            padding: 18px; border-radius: 12px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 내비게이션 바 */
        .history-nav { display: flex; gap: 6px; padding: 10px; background: #000; border-bottom: 1px solid #222; }
        .sub-btn { 
            flex: 1; padding: 12px 0; border: 1.5px solid #333; background: #111; 
            color: #777; border-radius: 10px; font-size: 11px; font-weight: 900; 
        }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* 나머지 레이아웃 유지 */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <!-- 대시보드 생략 (위와 동일) -->

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>

        <!-- 리스트 페이지 -->
        <div id="sub-page-list" class="sub-page" style="display: flex;">
            <div id="history-list" style="width:100%;">
                <!-- 스크립트에서 .ui-box 클래스가 추가된 history-item이 생성됨 -->
            </div>
        </div>

        <!-- 통계 페이지 -->
        <div id="sub-page-total" class="sub-page" style="display:none; padding:15px;">
            <div class="ui-box total-card">
                <div style="color:var(--primary); font-size:12px; font-weight:900;">LIFETIME DISTANCE</div>
                <div style="font-size:30px; font-weight:900;">124.5 <span style="font-size:15px;">KM</span></div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="ui-box total-card">
                    <div style="color:var(--text-dim); font-size:10px;">TOTAL RUNS</div>
                    <div style="font-size:20px; font-weight:900;">24</div>
                </div>
                <div class="ui-box total-card">
                    <div style="color:var(--text-dim); font-size:10px;">AVG PACE</div>
                    <div style="font-size:20px; font-weight:900;">5'42"</div>
                </div>
            </div>
        </div>

        <!-- 정보 페이지 -->
        <div id="sub-page-info" class="sub-page" style="display:none;">
            <div class="ui-box info-card">
                <div style="color:var(--primary); font-weight:900; margin-bottom:10px;">⏱️ CADENCE GUIDE</div>
                <div style="font-size:13px; color:#ccc;">부상 방지를 위해 170-185 BPM을 유지하세요.</div>
            </div>
            <div class="ui-box info-card">
                <div style="color:var(--primary); font-weight:900; margin-bottom:10px;">👟 SOLEUS (가자미근)</div>
                <div style="font-size:13px; color:#ccc;">지면을 밀어낼 때 가자미근의 탄성을 활용하면 효율적입니다.</div>
            </div>
        </div>

        <!-- 설정 페이지 -->
        <div id="sub-page-settings" class="sub-page" style="display:none; padding:20px;">
            <div class="settings-item">
                <span style="font-weight:900;">LANGUAGE</span>
                <span style="color:var(--primary); font-weight:900;">KOREAN ▼</span>
            </div>
            <button class="ui-box" style="width:100%; padding:20px; color:var(--danger); font-weight:900; font-size:14px; text-align:center;">
                CLEAR ALL HISTORY
            </button>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn active" onclick="ui.showTab('history')">HISTORY</button>
    </div>

    <script>
        // UI 객체 내 updateHistoryList 부분에 class="ui-box" 추가 로직 포함
        // (기존 스크립트 로직 유지하되 클래스명만 추가하면 됨)
    </script>
</body>
</html>
