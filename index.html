<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun Pro</title>
    <style>
        /* 1. 기본 레이아웃: 화면 흔들림 완전 차단 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; 
            background-color: #000; color: #fff; 
            overflow: hidden; /* 전체 바디 스크롤 차단 (가로/세로 바운스 방지) */
            font-family: -apple-system, sans-serif;
        }

        /* 2. 각 페이지 컨테이너: 세로 스크롤만 내부에서 허용 */
        .page {
            display: none; /* 기본 숨김 */
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: calc(100% - 70px); /* 하단바 제외 높이 */
            overflow-y: auto; /* 내용이 길면 내부에서만 세로 스크롤 */
            padding-bottom: 20px;
        }
        .page.active { display: block; } /* 선택된 페이지만 표시 */

        /* 상단 헤더 & 탭 */
        .history-header { padding: 15px; background: #000; }
        .sub-tab-menu { display: flex; gap: 8px; margin-bottom: 15px; padding: 0 15px; }
        .sub-tab { 
            flex: 1; padding: 10px; text-align: center; font-size: 14px;
            background: #1a1a1a; border-radius: 8px; cursor: pointer;
        }
        .sub-tab.selected { background: #4ADE80; color: #000; font-weight: bold; }

        /* 기록 카드 */
        .card {
            background: #121212; border-radius: 16px; padding: 20px;
            margin: 0 15px 15px 15px; border: 1px solid #222;
        }
        .time-label { color: #4ADE80; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .main-stats { display: flex; align-items: baseline; gap: 15px; margin-bottom: 15px; }
        .km-val { font-size: 28px; font-weight: 800; }
        .time-val { font-size: 28px; font-weight: 800; color: #4ADE80; }
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; border-top: 1px solid #222; padding-top: 12px; }
        .stat-item .val { font-size: 15px; font-weight: bold; margin-top: 4px; }
        .stat-item .lab { font-size: 10px; color: #666; text-transform: uppercase; }

        /* 하단 네비게이션바 */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: #000; border-top: 1px solid #1a1a1a;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-item { border: none; background: none; color: #444; font-size: 16px; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: #4ADE80; }
    </style>
</head>
<body>

    <div id="run-page" class="page active">
        <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="font-size: 20px; color: #4ADE80;">READY TO RUN</div>
            <div style="font-size: 80px; font-weight: 900; margin: 20px 0;">0.00</div>
            <button style="background: #4ADE80; color: #000; border: none; padding: 15px 50px; border-radius: 30px; font-weight: bold; font-size: 18px;">START</button>
        </div>
    </div>

    <div id="record-page" class="page">
        <div class="history-header"></div>
        <div class="sub-tab-menu">
            <div class="sub-tab selected">목록</div>
            <div class="sub-tab">통계</div>
            <div class="sub-tab">정보</div>
            <div class="sub-tab">설정</div>
        </div>

        <div class="card">
            <div class="time-label">5/13/2026, 7:47:43 PM</div>
            <div class="main-stats"><span class="km-val">1.54KM</span> <span class="time-val">02:56</span></div>
            <div class="grid-stats">
                <div class="stat-item"><div class="lab">PACE</div><div class="val">1'54"</div></div>
                <div class="stat-item"><div class="lab">CAD</div><div class="val">19</div></div>
                <div class="stat-item"><div class="lab">KCAL</div><div class="val">100</div></div>
                <div class="stat-item"><div class="lab">GCT/FLT</div><div class="val">209/55%</div></div>
            </div>
        </div>

        <div class="card">
            <div class="time-label">5/13/2026, 7:42:36 PM</div>
            <div class="main-stats"><span class="km-val">1.12KM</span> <span class="time-val">01:52</span></div>
            <div class="grid-stats">
                <div class="stat-item"><div class="lab">PACE</div><div class="val">1'38"</div></div>
                <div class="stat-item"><div class="lab">CAD</div><div class="val">15</div></div>
                <div class="stat-item"><div class="lab">KCAL</div><div class="val">73</div></div>
                <div class="stat-item"><div class="lab">GCT/FLT</div><div class="val">41/119%</div></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('run-page', this)">러닝</button>
        <button class="nav-item" onclick="switchTab('record-page', this)">기록</button>
    </nav>

    <script>
        function switchTab(targetId, btn) {
            // 1. 모든 페이지 숨기기
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 2. 클릭한 페이지만 보이기
            document.getElementById(targetId).classList.add('active');
            
            // 3. 모든 버튼 비활성화
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            // 4. 클릭한 버튼 활성화
            btn.classList.add('active');
        }
    </script>
</body>
</html>
