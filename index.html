<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.2 (Full Custom)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        .metro-bar { background: #1a1a1a; margin: 0 10px 10px; padding: 10px 15px; border-radius: 15px; border: 1px solid var(--metro-color); display: flex; align-items: center; justify-content: space-between; }
        .metro-controls { display: flex; align-items: center; gap: 10px; flex: 1; margin-left: 15px; }
        input[type=range] { flex: 1; accent-color: var(--metro-color); }

        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        .history-nav { display: flex; gap: 8px; padding: 10px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin: 10px; border: 1px solid #1f1f1f; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">현재 페이스</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">거리</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px; color:var(--primary)"> KM</small></div></div>
            <div class="card"><div class="label">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">접지 시간</div><div class="value"><span id="gct">--</span><small style="font-size:10px"> MS</small></div></div>
            <div class="card"><div class="label">공중 비율</div><div class="value"><span id="flight">--</span><small style="font-size:10px"> %</small></div></div>
        </div>

        <div class="metro-bar">
            <div style="text-align:center; min-width:60px;" onclick="toggleMetronome()">
                <div id="metro-icon" style="font-size:22px; color:var(--metro-color)">🔔</div>
                <div id="btn-metro-text" style="font-size:9px; font-weight:900; color:var(--metro-color)">OFF</div>
            </div>
            <div class="metro-controls">
                <input type="range" id="bpm-range" min="150" max="195" value="175" oninput="updateBPM(this.value)">
                <span id="bpm-val" style="font-size:20px; font-weight:900; color:var(--metro-color); width:45px; text-align:right;">175</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">러닝 시작</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">정지</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">계속하기</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">기록 종료</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">기록 리스트</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">누적 통계</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="history-item">
                <h3 style="color:var(--primary)">OppaRun Pro v28.2</h3>
                <p style="font-size:13px; color:#aaa;">뮤지션 기타리스트 오빠를 위한<br>커스텀 러닝 메신저</p>
                <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
                <small>• 지도는 러닝 중에만 표시되어 화면을 넓게 씁니다.<br>• 메트로놈 볼륨은 기기의 미디어 볼륨과 연동됩니다.</small>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx, metroTimer;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
}

function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }

function toggleMetronome() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isMetroOn = !isMetroOn;
    const btnText = document.getElementById('btn-metro-text');
    const icon = document.getElementById('metro-icon');
    if (isMetroOn) {
        btnText.textContent = "ON"; icon.textContent = "🔊";
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        btnText.textContent = "OFF"; icon.textContent = "🔔";
        clearTimeout(metroTimer);
    }
}

function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 1000; 
        gain.gain.setValueAtTime(0.5, nextClickTime);
        gain.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.05);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12.5 && (now - lastStepTime) > 230) {
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1 ? Math.floor(450 - (currentSpeedKmh * 11)) : 0;
        let flt = currentSpeedKmh > 2 ? Math.floor(5 + (currentSpeedKmh * 2.2)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "--";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    const statusEl = document.getElementById('status');
    if (acc <= 15) {
        statusEl.innerText = `준비 완료 (±${acc}m)`;
        statusEl.style.color = "#00ff88";
    } else {
        statusEl.innerText = `GPS 수신 중... (±${acc}m)`;
        statusEl.style.color = "#ffcc00";
    }

    if (isRunning && !isPaused && acc < 45) {
        if (lastPos) {
            let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    } else { map.panTo(pos); }
}

function onStart() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const now = new Date();
    const record = { date: now.toLocaleDateString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, kcal: Math.round(totalDist*65) };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(tab) {
    const isRun = (tab === 'run');
    document.getElementById('run-view').style.display = isRun ? 'flex' : 'none';
    document.getElementById('map-area').style.display = isRun ? 'block' : 'none';
    document.getElementById('history-view').style.display = isRun ? 'none' : 'flex';
    document.getElementById('tab-run').className = 'tab-btn' + (isRun ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (isRun ? '' : ' active');
    if(isRun) setTimeout(() => map.invalidateSize(), 200);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    if(sub === 'total') {
        let d = 0; h.forEach(r => d += parseFloat(r.dist) || 0);
        document.getElementById('total-stats').innerHTML = `<div class="history-item"><h3 style="margin-top:0;">누적 거리</h3><h1 style="color:var(--primary); margin:10px 0;">${d.toFixed(2)} KM</h1><p style="color:#888;">총 러닝 횟수: ${h.length}회</p></div>`;
    } else if(sub === 'list') {
        document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><b>${r.date}</b><br>${r.dist}KM | ${r.time} | ${r.pace}</div>`).join('');
    }
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
window.onload = initMap;
</script>
</body>
</html>
