<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - Universal v28.35</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* 1. 상단 지도 & GPS (고정 높이) */
        #top-section { flex-shrink: 0; }
        #map-container { height: 18vh; min-height: 120px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--primary); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; }
        
        /* 2. 메인 컨텐츠 (유동적 높이) */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding-bottom: 85px; /* 탭 바 공간 확보 */
        }
        
        /* 대시보드가 남는 공간을 적절히 차지하도록 함 */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            padding: 10px;
            flex: 1; /* 화면이 길면 카드가 중앙에 위치하게 도움 */
            align-content: start;
        }
        
        .card { background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 105px; position: relative; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; }
        .value-large { font-size: 52px; color: var(--primary); font-weight: 900; line-height: 1; }
        .value { font-size: 22px; font-weight: 900; }

        /* 3. 하단 제어 영역 (화면 길이에 맞춰 자동 위치) */
        .controls { 
            padding: 10px 20px; 
            display: flex; 
            justify-content: center; 
            margin-top: auto; /* 상단 요소들이 밀어내서 하단에 고착 */
        }
        
        .btn-act { 
            width: 100%; 
            height: 70px; 
            border-radius: 35px; 
            border: none; 
            font-weight: 900; 
            font-size: 24px; 
            cursor: pointer; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .btn-act:active { transform: scale(0.98); }
        
        #after-stop { display: none; gap: 12px; width: 100%; }

        /* 4. 최하단 탭 바 */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px; 
            background: #000; display: flex; border-top: 1px solid #222; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; 
        }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 14px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="top-section">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:12px;"> %</span></div></div>
        </div>
        
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none; padding: 20px;">
        <h2 style="color: var(--primary); margin-top: 40px; text-align: center;">RUNNING HISTORY</h2>
        <div id="history-list" style="color: #555; font-weight: 900; text-align: center; margin-top: 50px;">
            기록된 활동이 없습니다.
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];

const ui = {
    showTab: (tab) => {
        document.getElementById('top-section').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'run') setTimeout(() => { map.invalidateSize(); }, 200);
    },
    toggleDim: (show) => document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'
};

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    document.getElementById('status').innerHTML = `GPS ACTIVE (±${acc}m)`;
    marker.setLatLng(pos);
    if (isRunning && !isPaused && acc < 50) {
        if (lastPos) {
            let d = (function(p1,p2){ 
                const R=6371; 
                const dLat=(p2[0]-p1[0])*Math.PI/180; 
                const dLon=(p2[1]-p1[1])*Math.PI/180; 
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2; 
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); 
            })(lastPos, pos);
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else lastPos = pos;
    } else map.panTo(pos);
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0;
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
