<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.5 (History Enhanced)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui, sans-serif; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; transition: 0.2s; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        /* 기록 리스트 아이템 스타일 강화 */
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 18px 15px; margin: 10px 12px; border: 1px solid #333; position: relative; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 12px; letter-spacing: 0.5px; opacity: 0.8; }
        .h-actions { display: flex; gap: 6px; }
        .btn-h-sub { background: #333; border: 1px solid #444; color: var(--primary); font-size: 10px; padding: 6px 12px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        
        .h-main-row { display: flex; align-items: baseline; margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; padding-bottom: 12px; }
        .h-dist-val { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
        .h-unit { font-size: 11px; font-weight: 900; color: var(--primary); margin-left: 3px; margin-right: 15px; }
        .h-time-val { font-size: 20px; font-weight: 800; color: #fff; }
        .h-alt-val { font-size: 10px; font-weight: 700; color: #666; margin-left: auto; }

        .h-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 5px; }
        .h-stat-unit .s-label { font-size: 9px; color: #666; font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .h-stat-unit .s-val { font-size: 15px; color: #eee; font-weight: 800; }
        .h-stat-unit .s-sub-unit { font-size: 10px; color: #555; font-weight: 700; margin-left: 2px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        #diag-view, #metronome-view, #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .diag-header { padding: 50px 20px 15px; border-bottom: 1px solid #222; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        
        /* 설정 드롭다운 관련 */
        .settings-container { padding: 20px; }
        .settings-group { margin-bottom: 25px; position: relative; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #2a2a2a; border: 1.5px solid #444; border-radius: 12px; z-index: 1000; overflow-y: auto; max-height: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #333; cursor: pointer; color: #fff; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map" style="height: 40%; border-bottom: 1px solid #222;"></div>
        <div id="detail-data" style="padding: 12px 15px; overflow-y: auto;"></div>
    </div>

    <div id="diag-view">
        <button class="close-detail" onclick="ui.closeDiag()">CLOSE</button>
        <div id="diag-content-area" style="padding: 80px 20px;"></div>
    </div>

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div class="diag-header">
            <div id="metro-title" style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div>
        </div>
        <div style="padding: 20px;">
            <div id="metro-bpm-val" style="font-size: 60px; text-align:center; font-weight:900; color:var(--primary);">175</div>
            <input type="range" id="metro-bpm" min="140" max="200" value="175" style="width:100%;" oninput="metro.updateDisplay()">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000; margin-top:20px;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"></div>
        <div id="sub-page-info" class="sub-page"></div>
        <div id="sub-page-settings" class="sub-page"></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/**
 * OppaRun Pro - v29.5
 */

const translations = {
    en: { 
        pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", info: "INFO", settings: "SETTINGS",
        route: "ROUTE", diag: "DIAG", noRec: "NO RECORDS", calories: "CALORIES"
    },
    ko: { 
        pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", info: "정보", settings: "설정",
        route: "경로", diag: "진단", noRec: "기록 없음", calories: "칼로리"
    }
};

class RunningStorage {
    constructor() { this.HISTORY_KEY = 'oppaRunHistory'; this.LANG_KEY = 'oppaRunLang'; }
    saveRecord(record) {
        const history = this.loadHistory();
        history.unshift(record);
        localStorage.setItem(this.HISTORY_KEY, JSON.stringify(history));
    }
    loadHistory() { return JSON.parse(localStorage.getItem(this.HISTORY_KEY) || '[]'); }
    getLang() { return localStorage.getItem(this.LANG_KEY) || 'ko'; }
    setLang(lang) { localStorage.setItem(this.LANG_KEY, lang); }
}

class UIManager {
    constructor() {
        this.dom = {
            curPace: document.getElementById('curPace'), dist: document.getElementById('dist'), time: document.getElementById('time'),
            avgPace: document.getElementById('avgPace'), cadence: document.getElementById('cadence'), gct: document.getElementById('gct'),
            flight: document.getElementById('flight'), historyList: document.getElementById('history-list'), 
            btnStart: document.getElementById('btn-start'), btnStop: document.getElementById('btn-stop'), afterStop: document.getElementById('after-stop')
        };
    }

    updateRunningDisplay(data) {
        if (data.pace) this.dom.curPace.textContent = data.pace;
        if (data.dist) this.dom.dist.textContent = data.dist;
        if (data.time) this.dom.time.textContent = data.time;
        if (data.cadence) this.dom.cadence.textContent = data.cadence;
        if (data.gct) this.dom.gct.textContent = data.gct;
        if (data.flight) this.dom.flight.textContent = data.flight;
    }

    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') this.updateHistoryList();
    }

    showSubTab(sub) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        if(sub === 'list') this.updateHistoryList();
    }

    updateHistoryList() {
        const h = storage.loadHistory(); 
        const lang = storage.getLang(); 
        const t = translations[lang];
        
        if (h.length === 0) {
            this.dom.historyList.innerHTML = `<div style="text-align:center; padding:50px; color:#444;">${t.noRec}</div>`;
            return;
        }

        this.dom.historyList.innerHTML = h.map(r => {
            // 칼로리 계산 (데이터가 없을 경우: 거리당 약 65kcal)
            const cal = r.calories || Math.round(parseFloat(r.dist) * 65) || 0;
            
            return `
            <div class="history-item">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                    <div class="h-date">${r.date}</div>
                    <div class="h-actions">
                        <button class="btn-h-sub" onclick="ui.openDetail(${r.id})">${t.route}</button>
                        <button class="btn-h-sub" onclick="ui.openDiag(${r.id})">${t.diag}</button>
                    </div>
                </div>

                <div class="h-main-row">
                    <span class="h-dist-val">${r.dist}</span>
                    <span class="h-unit">KM</span>
                    <span class="h-time-val">${r.time}</span>
                    <span class="h-alt-val">ALT: <span style="color:var(--primary)">${r.alt || '--'}</span>m</span>
                </div>

                <div class="h-stats-grid">
                    <div class="h-stat-unit">
                        <div class="s-label">${t.pace}</div>
                        <div class="s-val">${r.pace || "--'--\""}</div>
                    </div>
                    <div class="h-stat-unit">
                        <div class="s-label">${t.cadence}</div>
                        <div class="s-val" style="color:var(--primary)">${r.cadence || "0"}<span class="s-sub-unit">BPM</span></div>
                    </div>
                    <div class="h-stat-unit">
                        <div class="s-label">${t.calories}</div>
                        <div class="s-val">${cal}<span class="s-sub-unit">KCAL</span></div>
                    </div>
                    <div class="h-stat-unit">
                        <div class="s-label">${t.gct}</div>
                        <div class="s-val">${r.gct || "--"}<span class="s-sub-unit">MS</span></div>
                    </div>
                    <div class="h-stat-unit">
                        <div class="s-label">${t.flight}</div>
                        <div class="s-val">${r.flight || "--"}<span class="s-sub-unit">%</span></div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    openDetail(id) { document.getElementById('detail-view').style.display = 'flex'; }
    closeDetail() { document.getElementById('detail-view').style.display = 'none'; }
    openDiag(id) { document.getElementById('diag-view').style.display = 'flex'; }
    closeDiag() { document.getElementById('diag-view').style.display = 'none'; }
    openMetronome() { document.getElementById('metronome-view').style.display = 'flex'; }
    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; }
}

class MetroEngine {
    constructor() { this.audioCtx = null; this.isPlaying = false; }
    toggle() {
        if(!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.isPlaying = !this.isPlaying;
        document.getElementById('btn-metro-toggle').textContent = this.isPlaying ? "STOP" : "START";
        document.getElementById('quick-metro').textContent = this.isPlaying ? "METRO ON" : "METRO OFF";
    }
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
}

class OppaRunApp {
    constructor() {
        this.state = { isRunning: false, seconds: 0, totalDist: 0, path: [] };
        this.timer = null;
    }
    init() {
        this.map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
    }
    onStart() {
        this.state.isRunning = true;
        ui.dom.btnStart.style.display = 'none'; ui.dom.btnStop.style.display = 'block';
        this.timer = setInterval(() => {
            this.state.seconds++;
            let m = Math.floor(this.state.seconds / 60); let s = this.state.seconds % 60;
            ui.updateRunningDisplay({time: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});
        }, 1000);
    }
    onStop() { ui.dom.btnStop.style.display = 'none'; ui.dom.afterStop.style.display = 'flex'; }
    onResume() { ui.dom.afterStop.style.display = 'none'; ui.dom.btnStop.style.display = 'block'; }
    onFinish() {
        const record = { 
            id: Date.now(), 
            date: new Date().toLocaleString(), 
            dist: ui.dom.dist.textContent, 
            time: ui.dom.time.textContent, 
            pace: "5'40\"", // 예시 데이터
            cadence: "180", 
            gct: "220", 
            flight: "35",
            alt: "15"
        };
        storage.saveRecord(record);
        location.reload();
    }
}

const storage = new RunningStorage();
const ui = new UIManager();
const metro = new MetroEngine();
const app = new OppaRunApp();

window.onload = () => { app.init(); ui.updateHistoryList(); };
</script>
</body>
</html>
