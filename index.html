<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.29 (Sensor & Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { 
            text-align: center; color: var(--warning); font-size: 11px; padding: 8px; 
            background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222;
            letter-spacing: 0.5px;
        }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #333; position: relative; }
        .h-date { font-size: 13px; color: var(--primary); font-weight: 900; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        .h-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; }
        .btn-h-sub { background: #1a1a1a; border: 1px solid #444; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; cursor: pointer; }

        #detail-view, #diag-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 20000; display: none; flex-direction: column; overflow-y: auto; }
        .close-detail { position: sticky; top: 10px; align-self: flex-end; margin-right: 15px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 20px; font-weight: 900; }

        .diag-header { padding: 40px 20px 20px; border-bottom: 1px solid #222; }
        .diag-card { background: #111; margin: 10px 15px; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .diag-score-label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .diag-status { font-weight: 900; font-size: 14px; margin-bottom: 10px; }
        .diag-advice { font-size: 13px; color: #ccc; line-height: 1.5; border-left: 3px solid var(--primary); padding-left: 10px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; text-align: center;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">WAITING FOR SENSORS...</div>
    </div> 

    <!-- 기록 상세 및 진단 뷰 -->
    <div id="detail-view">
        <button class="close-detail" onclick="closeDetail()">CLOSE</button>
        <div id="detail-map" style="height:250px;"></div>
        <div id="detail-data"></div>
    </div>
    <div id="diag-view">
        <button class="close-detail" onclick="closeDiag()">CLOSE</button>
        <div id="diag-content-area"></div>
    </div>

    <div id="run-view" class="main-content">
        <!-- 센서 권한 요청 오버레이 (최초 1회 필요) -->
        <div id="sensor-request" style="position:absolute; inset:0; background:rgba(0,0,0,0.9); z-index:5000; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px;">
            <div style="color:var(--primary); font-weight:900; font-size:20px; margin-bottom:10px;">SENSOR ACCESS</div>
            <p style="text-align:center; font-size:13px; color:#999; margin-bottom:20px;">케이던스 및 정밀 분석을 위해<br>스마트폰의 동작 센서 권한이 필요합니다.</p>
            <button onclick="requestPermissions()" style="background:var(--primary); border:none; padding:15px 40px; border-radius:30px; font-weight:900; font-size:16px;">GRANT PERMISSION</button>
        </div>

        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <!-- HISTORY VIEW & TABS (Omitted for brevity, but same as your original code) -->
    <!-- ... (이전 코드의 history-view와 tab-bar 유지) ... -->

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let wakeLock = null, lowSpeedStartTime = null;

// [보강] 센서 권한 요청 함수
async function requestPermissions() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission === 'granted') {
                window.addEventListener('devicemotion', handleMotion);
                document.getElementById('sensor-request').style.display = 'none';
            }
        } catch (e) { alert("센서 권한 요청 중 오류 발생"); }
    } else {
        window.addEventListener('devicemotion', handleMotion);
        document.getElementById('sensor-request').style.display = 'none';
    }
    initGPS();
}

function initGPS() {
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (e) => {
            document.getElementById('status').textContent = "GPS ERROR: " + e.message;
        }, {enableHighAccuracy: true, maximumAge: 0, timeout: 5000});
    }
}

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:12px; height:12px;"></div>', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    document.getElementById('status').textContent = isRunning ? "RECORDING ACTIVE" : "GPS ACTIVE";
    document.getElementById('status').style.color = "#00ff88";

    if (isRunning && !isPaused) {
        if (!isAutoPaused && p.coords.accuracy < 50) {
            if (lastPos) {
                const R=6371; const dLat=(pos[0]-lastPos[0])*Math.PI/180; const dLon=(pos[1]-lastPos[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(lastPos[0]*Math.PI/180)*Math.cos(pos[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                let d = R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                if (d > 0.001) { 
                    totalDist += d; 
                    document.getElementById('dist').textContent = totalDist.toFixed(2); 
                    lastPos = pos; 
                    pathCoords.push(pos); 
                    polyline.setLatLngs(pathCoords); 
                }
            } else { lastPos = pos; }
        }
    } else { map.panTo(pos); }
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();

    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; 
        lastStepTime = now;
        let currentCadence = Math.round((steps/(seconds||1))*60);
        document.getElementById('cadence').textContent = currentCadence;
        // GCT, FLIGHT 계산 로직 유지...
    }
}

function onStart() {
    if (totalDist > 0) { // 리셋
        totalDist = 0; steps = 0; seconds = 0; pathCoords = [];
        document.getElementById('dist').textContent = "0.00";
    }
    isRunning = true; isPaused = false;
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { 
        if(!isPaused && !isAutoPaused) { 
            seconds++; 
            document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; 
        } 
    }, 1000);
}

// [보강] 유효 기록 검증 후 저장
function onFinish() {
    if (totalDist < 0.01 && seconds < 5) {
        alert("기록이 너무 짧아 저장하지 않습니다.");
        location.reload();
        return;
    }
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent || "--'--\"",
        cadence: document.getElementById('cadence').textContent,
        kcal: Math.round(totalDist * 65),
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent,
        path: pathCoords 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); 
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

window.onload = initMap;
// ... (기타 UI 관련 함수들 유지) ...
</script>
</body>
</html>
