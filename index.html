<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.93</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard & Cards */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Sub Menu (History Top) */
        .history-sub-menu { display: flex; background: #0a0a0a; border-bottom: 1px solid #222; padding: 5px; gap: 5px; }
        .sub-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #666; font-size: 10px; font-weight: 900; padding: 10px 0; border-radius: 8px; cursor: pointer; }
        .sub-btn.active { color: var(--primary); border-color: var(--primary); background: #002211; }

        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #333; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
        
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
                <button style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-sub-menu">
            <button class="sub-btn active" onclick="ui.showSubTab('list')">리스트</button>
            <button class="sub-btn" onclick="ui.showSubTab('stats')">통계</button>
            <button class="sub-btn" onclick="ui.showSubTab('info')">인포</button>
            <button class="sub-btn" onclick="ui.showSubTab('setting')">설정</button>
        </div>

        <div id="sub-list" style="flex:1; overflow-y: auto; padding-bottom: 90px;">
            <div id="history-list"></div>
        </div>
        <div id="sub-stats" style="display:none; flex:1; padding:20px; text-align:center; color:#666;">STATS COMING SOON</div>
        <div id="sub-info" style="display:none; flex:1; padding:20px; text-align:center; color:#666;">INFO COMING SOON</div>
        <div id="sub-setting" style="display:none; flex:1; padding:20px; text-align:center; color:#666;">SETTING COMING SOON</div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
const State = {
    isRunning: false, isPaused: false, isAutoPaused: false,
    seconds: 0, totalDist: 0, steps: 0,
    pathCoords: [], lastPos: null, lastStepTime: 0,
    gctAccumulator: 0, gctCount: 0,
    wakeLock: null, timer: null, lowSpeedStartTime: null
};

const storage = {
    key: 'oppaRunHistory',
    saveRecord(r) {
        let h = this.loadHistory(); h.unshift(r);
        localStorage.setItem(this.key, JSON.stringify(h));
    },
    loadHistory() { return JSON.parse(localStorage.getItem(this.key) || "[]"); }
};

const ui = {
    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');

        if (tab === 'history') this.showSubTab('list'); // 기본값 리스트
        if (tab === 'run' && map) setTimeout(() => map.invalidateSize(), 100);
    },
    showSubTab(sub) {
        // 모든 서브 콘텐츠 숨김
        ['list', 'stats', 'info', 'setting'].forEach(s => {
            document.getElementById('sub-' + s).style.display = (s === sub ? 'block' : 'none');
        });
        // 모든 버튼 비활성화 및 선택된 버튼 활성화
        document.querySelectorAll('.sub-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === (sub === 'list' ? '리스트' : sub === 'stats' ? '통계' : sub === 'info' ? '인포' : '설정')) {
                btn.classList.add('active');
            }
        });
        if (sub === 'list') this.updateHistoryList();
    },
    updateStatusBar(acc, alt) {
        document.getElementById('status').textContent = `GPS READY: ±${acc}m | ALT: ${alt}m`;
    },
    updateMap(pos, acc) {
        if (marker) {
            marker.setLatLng(pos);
            if (accCircle) accCircle.setLatLng(pos).setRadius(acc);
            map.panTo(pos);
            if (State.isRunning && !State.isPaused) polyline.setLatLngs(State.pathCoords);
        }
    },
    updateRunStats(dist, speed) {
        document.getElementById('dist').textContent = dist.toFixed(2);
        document.getElementById('curPace').textContent = control.formatPace(speed);
        if (State.seconds > 0) {
            let avgKmh = (dist / (State.seconds / 3600));
            document.getElementById('avgPace').textContent = control.formatPace(avgKmh);
        }
    },
    updateMotionStats(cad, gct, flight) {
        document.getElementById('cadence').textContent = cad;
        document.getElementById('gct').textContent = gct;
        document.getElementById('flight').textContent = flight;
    },
    updateHistoryList() {
        const h = storage.loadHistory();
        const listDiv = document.getElementById('history-list');
        if (h.length === 0) {
            listDiv.innerHTML = `<div style="text-align:center; padding:50px; color:#444; font-weight:900;">NO RECORDS</div>`;
            return;
        }
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div style="display: flex; align-items: baseline; margin-bottom: 10px;">
                    <span style="font-size:20px; font-weight:900; color:#fff;">${r.dist}KM</span>
                    <span style="font-size:16px; font-weight:900; color:var(--primary); margin-left:12px;">${r.time}</span>
                </div>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; padding-top: 8px;">
                    <div style="text-align:center;"><div class="label">PACE</div><div style="font-size:11px; font-weight:900;">${r.pace}</div></div>
                    <div style="text-align:center;"><div class="label">CAD</div><div style="font-size:11px; font-weight:900;">${r.cadence}</div></div>
                    <div style="text-align:center;"><div class="label">GCT</div><div style="font-size:11px; font-weight:900;">${r.gct}</div></div>
                    <div style="text-align:center;"><div class="label">FLT</div><div style="font-size:11px; font-weight:900;">${r.flight}%</div></div>
                </div>
            </div>`).join('');
    },
    toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; },
    toggleAutoPause(show) { document.getElementById('pause-status').style.display = show ? 'block' : 'none'; }
};

const control = {
    formatPace(kmh) {
        if (!kmh || kmh < 0.5) return "--'--\"";
        let s = 3600 / kmh;
        return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
    }
};

const Engine = {
    processMovement(pos, speedKmh, accuracy) {
        if (speedKmh < 1.0) {
            if (!State.lowSpeedStartTime) State.lowSpeedStartTime = Date.now();
            if ((Date.now() - State.lowSpeedStartTime) > 3000 && !State.isAutoPaused) {
                State.isAutoPaused = true; ui.toggleAutoPause(true);
            }
        } else {
            State.isAutoPaused = false; ui.toggleAutoPause(false);
            State.lowSpeedStartTime = null;
        }

        if (!State.isAutoPaused && accuracy < 60) {
            if (State.lastPos) {
                let d = map.distance(State.lastPos, pos) / 1000;
                if (d > 0.001) {
                    State.totalDist += d;
                    State.pathCoords.push(pos);
                    ui.updateRunStats(State.totalDist, speedKmh);
                }
            }
            State.lastPos = pos;
        }
    },
    processMotion(e) {
        if (!State.isRunning || State.isPaused || State.isAutoPaused) return;
        let acc = e.accelerationIncludingGravity;
        if (!acc || acc.z === null) return;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        let now = Date.now();
        if (force > 12.5 && (now - State.lastStepTime) > 230) {
            let cycleTime = now - State.lastStepTime;
            State.steps++; State.lastStepTime = now;
            let cadVal = Math.round((State.steps / (State.seconds || 1)) * 60);
            let currentGCT = Math.round(cycleTime * 0.35);
            State.gctAccumulator += currentGCT; State.gctCount++;
            let avgGCT = Math.round(State.gctAccumulator / State.gctCount);
            let flightRatio = Math.round(((cycleTime - avgGCT) / cycleTime) * 100);
            ui.updateMotionStats(cadVal, avgGCT, flightRatio);
        }
    }
};

let map, marker, accCircle, polyline;

async function onStart() {
    try { if ('wakeLock' in navigator) State.wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
    State.isRunning = true; State.isPaused = false; State.totalDist = 0; State.seconds = 0; State.steps = 0; State.pathCoords = []; State.gctAccumulator = 0; State.gctCount = 0;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    if(State.timer) clearInterval(State.timer);
    State.timer = setInterval(() => {
        if(!State.isPaused && !State.isAutoPaused) {
            State.seconds++;
            let m = Math.floor(State.seconds / 60); let s = State.seconds % 60;
            document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
    }, 1000);
}

function onStop() { State.isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { State.isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = {
        id: Date.now(), date: new Date().toLocaleString(),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        cadence: document.getElementById('cadence').textContent,
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent
    };
    storage.saveRecord(record);
    if (State.wakeLock) State.wakeLock.release();
    location.reload();
}

const metro = {
    isPlaying: false,
    toggle() {
        this.isPlaying = !this.isPlaying;
        const btn = document.getElementById('quick-metro');
        btn.textContent = this.isPlaying ? "METRO ON" : "METRO OFF";
        btn.style.background = this.isPlaying ? "var(--primary)" : "#333";
        btn.style.color = this.isPlaying ? "#000" : "#999";
    }
};

window.onload = () => {
    setTimeout(() => {
        map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
        polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((p) => {
                const pos = [p.coords.latitude, p.coords.longitude];
                const speed = (p.coords.speed || 0) * 3.6;
                const acc = Math.round(p.coords.accuracy);
                ui.updateStatusBar(acc, p.coords.altitude ? Math.round(p.coords.altitude) : 0);
                ui.updateMap(pos, acc);
                if (State.isRunning && !State.isPaused) Engine.processMovement(pos, speed, acc);
            }, null, {enableHighAccuracy: true});
        }
    }, 500);
    window.addEventListener('devicemotion', (e) => Engine.processMotion(e));
};
</script>
</body>
</html>
