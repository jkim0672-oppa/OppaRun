<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.20</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text-dim: #555; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Map Area */
        #map-area { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #111; }

        /* History Nav (원본 886.jpg 스타일) */
        .history-nav { display: flex; gap: 8px; padding: 12px 16px; background: #000; justify-content: center; flex-shrink: 0; }
        .sub-btn { width: 140px; padding: 10px 0; border: none; background: #222; color: #777; border-radius: 10px; font-size: 13px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }

        /* 🔥 상단 요약 바 (원본 886.jpg 스타일 핵심) */
        .total-summary-bar { 
            display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; 
            padding: 12px 20px; background: #000; border-bottom: 1px solid #1a1a1a;
            font-weight: 900; letter-spacing: -0.5px; flex-shrink: 0;
        }
        .summary-item { display: flex; flex-direction: column; align-items: flex-start; }
        .summary-lbl { font-size: 9px; color: var(--text-dim); margin-bottom: 2px; }
        .summary-val { font-size: 15px; color: var(--primary); }

        /* History Item */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .history-item { background: #0f0f0f; border-radius: 12px; padding: 16px; margin: 8px 12px; border: 1px solid #1a1a1a; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .h-main-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-dist-time { font-size: 21px; font-weight: 900; color: #fff; }
        .route-link { color: var(--primary); font-size: 11px; font-weight: 900; text-decoration: none; }
        
        .h-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; gap: 4px; border-top: 1px solid #222; padding-top: 12px; }
        .h-lbl { font-size: 8px; color: var(--text-dim); font-weight: 800; margin-bottom: 3px; }
        .h-val { font-size: 12px; font-weight: 800; color: #ddd; }

        /* Tabs */
        .tab-bar { height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="map-area"></div>
    <div class="status-bar">GPS INITIALIZING...</div>

    <div id="history-view" class="main-content">
        <div class="history-nav">
            <button class="sub-btn active">LIST</button>
            <button class="sub-btn">TOTAL</button>
        </div>
        
        <div class="total-summary-bar">
            <div class="summary-item"><span class="summary-lbl">TOTAL KM</span><span id="sum-dist" class="summary-val">0.00 KM</span></div>
            <div class="summary-item"><span class="summary-lbl">TOTAL TIME</span><span id="sum-time" class="summary-val">00:00:00</span></div>
            <div class="summary-item"><span class="summary-lbl">COUNT</span><span id="sum-count" class="summary-val">0</span></div>
        </div>

        <div style="flex:1; overflow-y:auto; padding-bottom:20px;">
            <div id="history-list"></div>
        </div>
    </div> 

    <div class="tab-bar">
        <button class="tab-btn">RUN</button>
        <button class="tab-btn active">HISTORY</button>
    </div> 

<script>
function updateHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tDist = 0, tSec = 0;

    const listHtml = h.map(r => {
        tDist += parseFloat(r.dist || 0);
        // "00:27" 형식을 초로 변환
        const parts = r.time.split(':');
        tSec += (parseInt(parts[0]) * 60) + parseInt(parts[1]);

        return `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main-row">
                <div class="h-dist-time">${r.dist}KM ${r.time}</div>
                <div class="route-link">ROUTE</div>
            </div>
            <div class="h-grid">
                <div class="h-col"><span class="h-lbl">PACE</span><span class="h-val">${r.pace || "--'--\""}</span></div>
                <div class="h-col"><span class="h-lbl">CAD</span><span class="h-val">${r.cadence || "0"}</span></div>
                <div class="h-col"><span class="h-lbl">KCAL</span><span class="h-val">${r.kcal || "0"}</span></div>
                <div class="h-col"><span class="h-lbl">GCT/FLT</span><span class="h-val">${r.gct || "--"}ms / ${r.flt || "--"}%</span></div>
            </div>
        </div>`;
    }).join('');

    // 상단 요약 업데이트
    document.getElementById('sum-dist').textContent = tDist.toFixed(2) + " KM";
    document.getElementById('sum-count').textContent = h.length;
    
    const h_h = Math.floor(tSec / 3600);
    const m_m = Math.floor((tSec % 3600) / 60);
    const s_s = tSec % 60;
    document.getElementById('sum-time').textContent = `${String(h_h).padStart(2,'0')}:${String(m_m).padStart(2,'0')}:${String(s_s).padStart(2,'0')}`;
    
    document.getElementById('history-list').innerHTML = listHtml;
}

window.onload = updateHistory;
</script>
</body>
</html>
