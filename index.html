<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun Pro v28.96</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 메인 지도 영역 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }

        /* 대시보드 레이아웃 (오빠 원본 보존) */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; }

        /* 하단 컨트롤 및 탭바 */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; transition: transform 0.1s; }
        .btn-act:active { transform: scale(0.96); }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 10000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        /* 히스토리 및 설정 뷰 */
        #history-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 80px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; }
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #0a0a0a; }
        .sub-btn { flex: 1; padding: 12px 0; background: #2a2a2a; color: #aaa; border: 1px solid #444; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 100px; }
        
        /* 상세 지도 팝업 */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 20000; display: none; flex-direction: column; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; }
    </style>
</head>
<body>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">HISTORY</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding:20px; background:#1a1a1a; border-radius:15px; border:1px solid #333;">
                <h3 style="margin-top:0; color:var(--primary);">APP SETTINGS</h3>
                <p style="font-size:12px; color:#888;">버전: v28.96 (Stability Fix)</p>
                <button class="btn-act" style="background:#331111; color:var(--danger); font-size:14px; height:45px;" onclick="storage.clearHistory()">CLEAR ALL RECORDS</button>
            </div>
        </div>
    </div>

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map" style="height: 50%; width: 100%;"></div>
        <div id="detail-data" style="padding: 20px;"></div>
    </div>

    <nav class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">RECORDS</button>
    </nav>

<script>
// --- 전역 상태 관리 ---
let map, marker, polyline, timer = null, gpsWatcher = null;
let isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];
let detailMap = null;

// --- 1. 저장 로직 (원본 보존) ---
const storage = {
    key: 'oppaRunHistory_v2',
    saveRecord: (record) => {
        let h = storage.loadHistory();
        h.unshift(record);
        localStorage.setItem(storage.key, JSON.stringify(h));
    },
    loadHistory: () => JSON.parse(localStorage.getItem(storage.key) || "[]"),
    clearHistory: () => {
        if(confirm("정말 모든 기록을 삭제할까 오빠?")) {
            localStorage.removeItem(storage.key);
            ui.updateHistoryList();
        }
    }
};

// --- 2. UI 제어 (안전한 전환) ---
const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
    },
    updateHistoryList: () => {
        const h = storage.loadHistory().slice(0, 30); 
        const listDiv = document.getElementById('history-list');
        if(h.length === 0) { listDiv.innerHTML = "<p style='text-align:center; color:#555;'>No Records yet.</p>"; return; }
        listDiv.innerHTML = h.map(r => `
            <div style="background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid #333;" onclick="ui.openDetail(${r.id})">
                <div style="color:var(--primary); font-size:11px; font-weight:900;">${r.date}</div>
                <div style="font-size:20px; font-weight:900; margin-top:5px;">${r.dist} KM <span style="color:#666; font-size:14px;">/ ${r.time}</span></div>
            </div>`).join('');
    },
    openDetail: (id) => {
        const r = storage.loadHistory().find(item => item.id === id);
        if(!r) return;
        document.getElementById('detail-view').style.display = 'flex';
        
        // 상세 지도 안전 제거 후 생성
        if (detailMap) { detailMap.off(); detailMap.remove(); detailMap = null; }
        
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        
        if (r.path && r.path.length > 0) {
            const poly = L.polyline(r.path, {color: '#00ff88', weight: 5}).addTo(detailMap);
            detailMap.fitBounds(poly.getBounds());
        }
        document.getElementById('detail-data').innerHTML = `<h2 style="color:var(--primary)">${r.dist} KM</h2><p>${r.time}</p>`;
    },
    closeDetail: () => {
        if (detailMap) { detailMap.off(); detailMap.remove(); detailMap = null; }
        document.getElementById('detail-view').style.display = 'none';
    }
};

// --- 3. 핵심 러닝 로직 (안전장치 강화) ---
function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    document.getElementById('status').textContent = `GPS: ±${acc}m | ALT: ${p.coords.altitude ? Math.round(p.coords.altitude) : '--'}m`;

    if (isRunning && !isPaused) {
        if (lastPos) {
            const d = map.distance(lastPos, pos) / 1000;
            // ⭐ GPS Jump Filter (이미지 추천: 80m 이상 튀면 노이즈)
            if (d > 0.001 && d < 0.08) {
                totalDist += d;
                pathCoords.push(pos);
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                polyline.setLatLngs(pathCoords);
                lastPos = pos;
            }
        } else {
            lastPos = pos;
        }
        marker.setLatLng(pos);
        map.panTo(pos);
    }
}

function onStart() {
    isRunning = true; isPaused = false;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';

    // 이미지 추천: 타이머 및 GPS 중복 방지 (확실히 끄고 시작)
    if(timer) clearInterval(timer);
    timer = setInterval(() => {
        if(!isPaused) {
            seconds++;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
    }, 1000);

    if (gpsWatcher) navigator.geolocation.clearWatch(gpsWatcher);
    gpsWatcher = navigator.geolocation.watchPosition(updatePosition, null, {
        enableHighAccuracy: true,
        maximumAge: 0
    });
}

function onStop() { 
    isPaused = true; 
    document.getElementById('btn-stop').style.display = 'none'; 
    document.getElementById('after-stop').style.display = 'flex'; 
}

function onResume() { 
    isPaused = false; 
    document.getElementById('after-stop').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block'; 
}

function onFinish() {
    if(totalDist > 0.01) {
        const record = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            dist: totalDist.toFixed(2),
            time: document.getElementById('time').textContent,
            path: pathCoords
        };
        storage.saveRecord(record);
    }
    resetApp(); // 이미지 추천: reload() 대신 리셋 함수 호출
}

function resetApp() {
    isRunning = false; isPaused = false; seconds = 0; totalDist = 0; 
    pathCoords = []; lastPos = null;
    
    if(timer) clearInterval(timer);
    if(gpsWatcher) navigator.geolocation.clearWatch(gpsWatcher);

    document.getElementById('dist').textContent = "0.00";
    document.getElementById('time').textContent = "00:00";
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('after-stop').style.display = 'none';
    polyline.setLatLngs([]);
    
    ui.showTab('history');
}

// --- 4. 초기화 로직 (v28.96 맵 픽스) ---
document.addEventListener('DOMContentLoaded', () => {
    // 맵 초기화 (HTML이 준비된 직후)
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([37.5665, 126.9780]).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    
    // GPS 최초 위치 잡기
    setTimeout(() => {
        navigator.geolocation.getCurrentPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            map.setView(pos, 16);
            marker.setLatLng(pos);
            document.getElementById('status').textContent = "GPS READY";
        }, err => {
            document.getElementById('status').textContent = "GPS WAITING...";
        }, {enableHighAccuracy: true});
    }, 100);

    ui.updateHistoryList();
});
</script>
</body>
</html>
