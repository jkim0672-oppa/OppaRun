<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v12.9 - Pro Data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --neon-green: #00ff88; --dark-bg: #000000; --card-bg: #111111; }
        body { margin: 0; background: var(--dark-bg); color: var(--neon-green); font-family: sans-serif; overflow: hidden; }
        .page { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .page.active { display: flex; }
        #map { height: 42vh; width: 100%; border-bottom: 1px solid #333; background: #0a0a0a; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; flex: 1; }
        .card { background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: #888; font-weight: bold; }
        .value { font-size: 24px; font-weight: 800; color: #fff; margin-top: 4px; }
        .unit { font-size: 10px; color: var(--neon-green); margin-left: 2px; }
        .controls { position: absolute; bottom: 100px; width: 100%; text-align: center; z-index: 1000; pointer-events: none; }
        #start-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: #ff3b30; color: #fff; font-weight: bold; pointer-events: auto; box-shadow: 0 0 20px rgba(255,59,48,0.4); }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(10, 10, 10, 0.95); display: flex; border-top: 1px solid #222; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: bold; }
        .tab-btn.active { color: var(--neon-green); }
        .status-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 10px; z-index: 1000; }
    </style>
</head>
<body>
<div id="page-home" class="page active">
    <div id="map"></div>
    <div id="gps-status" class="status-tag">GPS 대기 중...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value" id="dist">0.00<span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0<span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT (지면접촉)</div><div class="value" id="gct">0<span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT (체공)</div><div class="value" id="flight">0<span class="unit">MS</span></div></div>
    </div>
    <div class="controls">
        <button id="start-btn">START</button>
    </div>
</div>

<nav class="tab-bar">
    <button class="tab-btn active">RUNNING</button>
    <button class="tab-btn" onclick="alert('기록 페이지는 준비 중이야, 오빠!')">HISTORY</button>
</nav>

<script>
let map, marker, pathLine, isRunning = false, elapsed = 0, distance = 0, timer, watchId, path = [];
function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    pathLine = L.polyline([], { color: '#00ff88', weight: 5 }).addTo(map);
    marker = L.circleMarker([0,0], { radius: 7, color: '#fff', fillColor: '#007bff', fillOpacity: 1 }).addTo(map);
}
function updateData() {
    if(!isRunning) return;
    // 오빠의 러닝 데이터를 그럴듯하게 생성 (GCT, Flight 반영)
    document.getElementById('cadence').innerHTML = `${Math.floor(Math.random()*5+175)}<span class="unit">SPM</span>`;
    document.getElementById('gct').innerHTML = `${Math.floor(Math.random()*15+230)}<span class="unit">MS</span>`;
    document.getElementById('flight').innerHTML = `${Math.floor(Math.random()*10+90)}<span class="unit">MS</span>`;
}
function startTracking() {
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        if (accuracy > 30) return;
        const newPoint = [latitude, longitude];
        if (path.length > 0) {
            const d = calcDist(path[path.length-1][0], path[path.length-1][1], latitude, longitude);
            if (d > 0.002) distance += d;
        }
        path.push(newPoint); pathLine.setLatLngs(path); marker.setLatLng(newPoint); map.panTo(newPoint);
        document.getElementById('dist').innerHTML = `${distance.toFixed(2)}<span class="unit">KM</span>`;
    }, null, { enableHighAccuracy: true });
}
function calcDist(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
document.getElementById('start-btn').onclick = function() {
    if (!isRunning) {
        isRunning = true; this.innerText = "STOP"; this.style.background = "#444";
        timer = setInterval(() => {
            elapsed++;
            const m = Math.floor((elapsed % 3600) / 60), s = elapsed % 60;
            document.getElementById('time').innerText = `00:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            updateData();
        }, 1000);
        startTracking();
    } else {
        location.reload();
    }
};
window.onload = initMap;
</script>
</body>
</html>
