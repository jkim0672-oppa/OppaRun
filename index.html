<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Run</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* App Layout */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
        }

        /* Map Section */
        #map {
            width: 100%;
            height: 45vh;
            z-index: 1;
        }

        /* Dashboard Section */
        .dashboard {
            flex: 1;
            background-color: var(--bg-color);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            margin-top: -20px;
            position: relative;
            z-index: 10;
            padding: 24px 20px;
            box-sizing: border-box;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.3);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
        }

        .metric-unit {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 2px;
        }

        /* Controls */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
        }

        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #292929;
            color: #ff3b30;
            border: 1px solid #3d1414;
        }

        .btn-secondary:active {
            transform: scale(0.98);
            background-color: #331414;
        }

        /* Status Indicator */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff3b30;
        }

        .status-dot.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Leaflet Custom Style Override */
        .leaflet-vignette {
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="map"></div>

        <div class="dashboard">
            <div class="status-bar">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Ready to Run</span>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">Distance</span>
                    <div>
                        <span id="txtDistance" class="metric-value">0.00</span>
                        <span class="metric-unit">km</span>
                    </div>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Pace</span>
                    <div>
                        <span id="txtPace" class="metric-value">--'--本地"</span>
                        <span class="metric-unit">/km</span>
                    </div>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Time</span>
                    <div>
                        <span id="txtTime" class="metric-value">00:00:00</span>
                    </div>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Avg Pace</span>
                    <div>
                        <span id="txtAvgPace" class="metric-value">--'--本地"</span>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <button id="btnStart" class="btn btn-primary">START RUN</button>
                <button id="btnStop" class="btn btn-secondary" style="display: none;">STOP & SAVE</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // State Management
        let isTracking = false;
        let watchId = null;
        let startTime = null;
        let timerId = null;
        let elapsedSeconds = 0;

        // Metrics Data
        let pathCoords = [];
        let totalDistance = 0; // in meters

        // DOM Elements
        const mapEl = document.getElementById('map');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const txtDistance = document.getElementById('txtDistance');
        const txtPace = document.getElementById('txtPace');
        const txtTime = document.getElementById('txtTime');
        const txtAvgPace = document.getElementById('txtAvgPace');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // Initialize Map (Dark Mode Theme)
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([33.7743, -117.9380], 15); // Default Focus: Garden Grove Area

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20
        }).addTo(map);

        // Map Graphics Elements
        let polyline = L.polyline([], {
            color: '#00e676',
            weight: 6,
            opacity: 0.9,
            lineJoin: 'round'
        }).addTo(map);

        let userMarker = L.circleMarker([33.7743, -117.9380], {
            radius: 8,
            fillColor: '#00e676',
            color: '#ffffff',
            weight: 3,
            fillOpacity: 1
        }).addTo(map);

        // Haversine Distance Formula (Meters)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        // Format Seconds to HH:MM:SS
        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return [
                hrs.toString().padStart(2, '0'),
                mins.toString().padStart(2, '0'),
                secs.toString().padStart(2, '0')
            ].join(':');
        }

        // Format Pace (min/km)
        function formatPace(paceMinPerKm) {
            if (!paceMinPerKm || isNaN(paceMinPerKm) || !isFinite(paceMinPerKm)) return `--'--"`;
            const mins = Math.floor(paceMinPerKm);
            const secs = Math.floor((paceMinPerKm - mins) * 60);
            return `${mins}'${secs.toString().padStart(2, '0')}"`;
        }

        // Location Update Success Handler
        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speed = position.coords.speed; // meters per second
            const currentPos = [lat, lng];

            // Center View & Update Marker
            map.setView(currentPos, 17);
            userMarker.setLatLng(currentPos);

            if (!isTracking) return;

            // Track Coordinates & Calculate Accumulation
            if (pathCoords.length > 0) {
                const lastPos = pathCoords[pathCoords.length - 1];
                const distanceDelta = calculateDistance(lastPos[0], lastPos[1], lat, lng);
                
                // Drop erratic GPS jumps (e.g., > 30m/s sudden movement)
                if (distanceDelta > 0 && distanceDelta < 30) {
                    totalDistance += distanceDelta;
                }
            }

            pathCoords.push(currentPos);
            polyline.setLatLngs(pathCoords);

            // Update UI Statistics
            const distanceKm = totalDistance / 1000;
            txtDistance.textContent = distanceKm.toFixed(2);

            // Current Pacing Engine
            if (speed && speed > 0.5) {
                const paceMinKm = 16.6667 / speed; // Conversion factor
                txtPace.textContent = formatPace(paceMinKm);
            } else {
                txtPace.textContent = `--'--"`;
            }

            // Overall Cumulative Pacing Engine
            if (totalDistance > 0 && elapsedSeconds > 0) {
                const avgPaceMinKm = (elapsedSeconds / 60) / (totalDistance / 1000);
                txtAvgPace.textContent = formatPace(avgPaceMinKm);
            }
        }

        function onLocationError(error) {
            console.error(`GPS Error (${error.code}): ${error.message}`);
        }

        // Timer Execution
        function startTimer() {
            startTime = Date.now() - (elapsedSeconds * 1000);
            timerId = setInterval(() => {
                elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                txtTime.textContent = formatTime(elapsedSeconds);
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerId);
        }

        // Core Tracking Interface
        function startTracking() {
            if (isTracking) return;

            if (!navigator.geolocation) {
                alert("GPS Geolocation is not supported by this browser.");
                return;
            }

            isTracking = true;
            pathCoords = [];
            totalDistance = 0;
            elapsedSeconds = 0;

            // Reset UI Values
            txtDistance.textContent = "0.00";
            txtPace.textContent = `--'--"`;
            txtAvgPace.textContent = `--'--"`;
            txtTime.textContent = "00:00:00";

            // Status State Changes
            statusDot.classList.add('active');
            statusText.textContent = "Tracking Active";
            btnStart.style.display = 'none';
            btnStop.style.display = 'block';

            // Start Systems
            startTimer();
            watchId = navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        }

        function stopTracking() {
            if (!isTracking) return;

            // Strict Validation Constraint: Minimum 100 meters required to evaluate run data
            if (totalDistance < 100) {
                const confirmDiscard = confirm("The distance is less than 100 meters. Would you like to discard this run?");
                if (!confirmDiscard) {
                    return; // Abort termination, keep active tracking running
                }
            }

            isTracking = false;
            stopTimer();
            
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Reset UI Layout Structure
            statusDot.classList.remove('active');
            statusText.textContent = "Ready to Run";
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
        }

        // Event Handlers
        btnStart.addEventListener('click', startTracking);
        btnStop.addEventListener('click', stopTracking);

        // Trigger passive location tracking immediately upon application load for core placement
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true
            });
        }
    </script>
</body>
</html>
