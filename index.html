<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.2 (Add Setting Tab)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 100px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 10px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 80px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; }
        .metro-bar { background: #1a1a1a; margin: 0 10px 10px; padding: 10px 15px; border-radius: 15px; border: 1px solid var(--metro-color); display: flex; align-items: center; justify-content: space-between; }
        .controls { padding: 0 15px; margin-bottom: 85px; }
        .btn-act { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 16px; }
        .history-nav { display: flex; gap: 4px; padding: 10px; background: #000; overflow-x: auto; }
        .sub-btn { flex: 1; min-width: 70px; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #1f1f1f; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar" data-ko="준비 완료" data-en="READY TO RUN">준비 완료</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" data-ko="현재 페이스" data-en="CURRENT PACE" style="color:var(--primary)">현재 페이스</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label" data-ko="거리" data-en="DIST">거리</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px">KM</small></div></div>
            <div class="card"><div class="label" data-ko="시간" data-en="TIME">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-ko="평균 페이스" data-en="AVG PACE">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-ko="케이던스" data-en="CADENCE">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-ko="자동 멈춤" data-en="AUTO PAUSE">자동 멈춤</div><div id="ap-stat" class="value" style="font-size:14px; color:var(--danger)">OFF</div></div>
        </div>
        <div class="metro-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="metro-icon" style="font-size:20px; color:var(--metro-color)">🔔</div>
                <div id="btn-metro-text" style="font-size:11px; font-weight:900; color:var(--metro-color)">METRO OFF</div>
            </div>
            <div style="font-size:18px; font-weight:900; color:var(--metro-color);"><span id="bpm-val">175</span> BPM</div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-ko="러닝 시작" data-en="START RUNNING">러닝 시작</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-ko="목록" data-en="LIST">목록</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')" data-ko="합계" data-en="TOTAL">합계</button>
            <button id="sub-tab-set" class="sub-btn" onclick="showSubTab('set')" data-ko="설정" data-en="SETTING">설정</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')" data-ko="정보" data-en="INFO">정보</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-set" class="sub-page">
            <div class="history-item">
                <h3 style="color:var(--primary)" data-ko="언어 설정" data-en="LANGUAGE">언어 설정</h3>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="sub-btn active" onclick="changeLang('ko')">한국어</button>
                    <button class="sub-btn active" onclick="changeLang('en')">ENGLISH</button>
                </div>
            </div>
        </div>
        <div id="sub-page-info" class="sub-page"><div class="history-item">OppaRun Pro v28.2</div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
function changeLang(lang) {
    document.querySelectorAll('[data-ko]').forEach(el => {
        el.innerText = el.getAttribute('data-' + lang);
    });
}
function initMap() {
    const map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}
function onStart() { alert('Start!'); }
function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').classList.toggle('active', tab==='run');
    document.getElementById('tab-history').classList.toggle('active', tab==='history');
}
function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
}
window.onload = initMap;
</script>
</body>
</html>
