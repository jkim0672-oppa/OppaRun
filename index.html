<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.68 (Logic Separation)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: 100svh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="map-area"><div id="map-container"><div id="map"></div></div></div> 
    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>
    <div class="tab-bar"><button class="tab-btn active">RUN</button><button class="tab-btn">HISTORY</button></div> 

<script>
let map, isRunning = false, isPaused = false, isAutoPaused = false, lowSpeedStartTime = null;

const metro = {
    audioCtx: null, nextTickTime: 0, timerID: null, isPlaying: false,
    init() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
    
    // 자동 일시정지/재개용: 진동 + 소리
    playAlert(type) {
        this.init();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain); gain.connect(this.audioCtx.destination);
        
        if (type === 'pause') { // 멈춤 시 진동 + 낮은 비프음
            if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
            osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, this.audioCtx.currentTime + 0.3);
        } else { // 재개 시 진동 + 높은 비프음
            if ('vibrate' in navigator) navigator.vibrate(200);
            osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.2);
        }
        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(this.audioCtx.currentTime + 0.3);
    },

    // 메트로놈용: 소리만 (진동 없음)
    playTick() {
        this.init();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain); gain.connect(this.audioCtx.destination);
        osc.frequency.value = 1000;
        gain.gain.value = 0.1;
        osc.start(); osc.stop(this.audioCtx.currentTime + 0.05);
    },
    
    scheduler() {
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playTick();
            this.nextTickTime += 60.0 / 175; // 기본 175 BPM
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    }
};

function updatePosition(p) {
    let speed = (p.coords.speed || 0) * 3.6;
    if (isRunning && !isPaused) {
        if (speed < 2.0) {
            if (!lowSpeedStartTime) lowSpeedStartTime = Date.now();
            if ((Date.now() - lowSpeedStartTime) > 3000 && !isAutoPaused) {
                isAutoPaused = true;
                document.getElementById('pause-status').style.display = 'block';
                metro.playAlert('pause');
            }
        } else {
            if (isAutoPaused) {
                isAutoPaused = false;
                document.getElementById('pause-status').style.display = 'none';
                metro.playAlert('resume');
            }
            lowSpeedStartTime = null;
        }
    }
}

function onStart() { isRunning = true; metro.scheduler(); document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onStop() { isPaused = true; location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
};
</script>
</body>
</html>
