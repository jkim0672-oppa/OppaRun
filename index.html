<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.35</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* Status Bar - 지도 위로 고정 */
        .status-bar { 
            text-align: center; color: var(--primary); font-size: 11px; padding: 6px; 
            background: #000; font-weight: 900; border-bottom: 1px solid #222;
            letter-spacing: 0.5px; flex-shrink: 0;
        }
        
        /* Map Area - 높이 조절로 하단 공간 확보 */
        #map-area { flex-shrink: 0; width: 100%; height: 22vh; min-height: 150px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #1a1a1a; }
        
        /* Dashboard & Controls */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 75px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 18px; font-weight: 900; }
        .value-large { font-size: 38px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Button Area - 잘리지 않게 여유 공간 확보 */
        .controls { padding: 10px 15px; flex: 1; display: flex; justify-content: center; align-items: center; max-height: 90px; }
        .btn-act { width: 100%; height: 58px; border-radius: 29px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* Tabs */
        .tab-bar { height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        
        /* History & Total Pages */
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; flex-shrink: 0; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }
        .total-summary { padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .total-card { background: var(--card-bg); border-radius: 12px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; border: 1px solid #1f1f1f; }
        
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay">TAP TO WAKE</div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div id="map-area"><div id="map"></div></div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:8px; right:8px; background:#111; border:1px solid #333; color:#555; font-size:8px; padding:4px 6px; border-radius:4px;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:9px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:9px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">ETC</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-area"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding:40px 20px; text-align:center;">
                <button style="background:#222; color:var(--danger); border:1px solid #444; padding:15px; border-radius:10px; width:80%; font-weight:900;" onclick="clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (e) => { 
            document.getElementById('status').textContent = "GPS ERROR: " + e.message;
        }, {enableHighAccuracy: true, maximumAge: 0, timeout: 5000});
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (!isRunning) map.panTo(pos);
    
    document.getElementById('status').textContent = isRunning ? "RECORDING ACTIVE (±" + p.coords.accuracy.toFixed(0) + "m)" : "GPS ACTIVE (±" + p.coords.accuracy.toFixed(0) + "m)";
    document.getElementById('status').style.color = "#00ff88";

    if (isRunning && !isPaused && p.coords.accuracy < 50) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.001) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); map.panTo(pos); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : "--";
        document.getElementById('flight').textContent = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : "--";
    }
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: parseFloat(document.getElementById('dist').textContent) || 0, time: document.getElementById('time').textContent, rawSeconds: seconds, pace: document.getElementById('avgPace').textContent, cadence: parseInt(document.getElementById('cadence').textContent) || 0, kcal: Math.round(totalDist * 65) || 0 };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if(tab === 'history') updateHistoryList();
    if(tab === 'run' && map) setTimeout(() => map.invalidateSize(), 200);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'total') updateTotalStats();
}

function updateHistoryList() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><div class="h-date">${r.date}</div><div class="h-main"><span class="h-dist-time">${r.dist}KM ${r.time}</span></div></div>`).join('');
}

function updateTotalStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tDist = 0, tSec = 0, tKcal = 0, tCad = 0;
    h.forEach(r => { tDist += Number(r.dist); tSec += Number(r.rawSeconds); tKcal += Number(r.kcal); tCad += Number(r.cadence); });
    const hrs = Math.floor(tSec / 3600); const mins = Math.floor((tSec % 3600) / 60);
    document.getElementById('total-stats-area').innerHTML = `
        <div class="total-summary">
            <div class="total-card"><div class="label">TOTAL DIST</div><div class="total-val">${tDist.toFixed(2)} KM</div></div>
            <div class="total-card"><div class="label">TOTAL TIME</div><div class="total-val">${hrs}h ${mins}m</div></div>
            <div class="total-card"><div class="label">TOTAL KCAL</div><div class="total-val">${tKcal}</div></div>
            <div class="total-card"><div class="label">AVG CADENCE</div><div class="total-val">${h.length > 0 ? Math.round(tCad / h.length) : 0}</div></div>
        </div>`;
}

function clearHistory() { if(confirm("삭제할까요?")) { localStorage.removeItem('oppaRunHistory'); location.reload(); } }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
