<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v26.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00; --info: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* [레이아웃 절대 고정] */
        #map-area { flex-shrink: 0; width: 100%; position: relative; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        
        /* 메인 대시보드 (오빠 스타일) */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; }
        .label { font-size: 10px; color: #888; font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 히스토리 상단 통계 박스 (복구 완료) */
        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 15px 15px 15px; flex-shrink: 0; }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .total-value { font-size: 17px; font-weight: 900; color: #fff; }

        /* [디자인 업데이트] 버튼 및 아이콘 */
        .btn-map-view { background: rgba(0, 255, 136, 0.1); color: var(--primary); border: 1px solid var(--primary); border-radius: 12px; font-size: 10px; font-weight: 900; padding: 6px 12px; }
        .h-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid #222; }
        .h-action-btns { display: flex; gap: 8px; }
        .btn-icon-action { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 6px 10px; font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .btn-icon-action.diag { color: var(--primary); border-color: var(--primary); }
        .btn-icon-action.help { color: var(--info); border-color: var(--info); }
        .h-delete { color: #444; font-size: 10px; text-decoration: underline; font-weight: 800; }

        /* 커스텀 모달 (하얀 박스 퇴치!) */
        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a1a; border: 1.5px solid var(--primary); border-radius: 25px; width: 100%; max-width: 300px; padding: 25px; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        .modal-text { color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 25px; line-height: 1.6; }
        .modal-btns { display: flex; gap: 10px; }
        .m-btn { flex: 1; height: 45px; border-radius: 20px; border: none; font-weight: 900; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; border-top: 1px solid #222; z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">LOCATING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:11px; color:var(--primary); margin-left:2px;">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">KCAL</div><div id="kcal" class="value">0</div></div>
        </div>
        <div style="height:100px; display:flex; align-items:center; justify-content:center; padding:0 20px; margin-top:auto; margin-bottom:80px;">
            <button id="btn-start" style="width:100%; height:55px; border-radius:30px; background:var(--primary); border:none; font-weight:900; font-size:18px;" onclick="onStart()">START RUNNING</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="padding: 20px 20px 10px 20px;"><span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span></div>
        <div class="total-dashboard">
            <div class="total-card"><span class="total-label">Total Dist</span><span id="total-dist-val" class="total-value">0.00 KM</span></div>
            <div class="total-card"><span class="total-label">Weekly Dist</span><span id="weekly-dist-val" class="total-value">0.00 KM</span></div>
            <div class="total-card"><span class="total-label">Total Runs</span><span id="total-runs-val" class="total-value">0</span></div>
            <div class="total-card"><span class="total-label">Total kcal</span><span id="total-kcal-val" class="total-value">0</span></div>
        </div>
        <div id="history-list" style="overflow-y:auto; padding:10px; padding-bottom:100px;"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div id="modal-msg" class="modal-text"></div>
            <div class="modal-btns">
                <button id="modal-cancel" class="m-btn" style="background:#333; color:#fff;">취소</button>
                <button id="modal-confirm" class="m-btn" style="background:var(--primary); color:#000;">확인</button>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, historyMap, historyLayer;

// [지도 로딩 보강]invalidateSize를 여러 번 호출해서 로딩 실패 방지
function initMap() {
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([37.5665, 126.9780], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    
    // 로딩 즉시 및 0.5초 뒤 강제 새로고침
    setTimeout(() => { if(map) map.invalidateSize(); }, 100);
    setTimeout(() => { if(map) map.invalidateSize(); }, 500);
    
    loadHistory();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    
    // 탭 이동 시 지도 새로고침
    if(tab === 'run' && map) setTimeout(() => { map.invalidateSize(); }, 100);
    if(tab === 'history') loadHistory();
}

function showModal(msg, isConfirm = false) {
    return new Promise((resolve) => {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal-cancel').style.display = isConfirm ? 'block' : 'none';
        modal.style.display = 'flex';
        document.getElementById('modal-confirm').onclick = () => { modal.style.display = 'none'; resolve(true); };
        document.getElementById('modal-cancel').onclick = () => { modal.style.display = 'none'; resolve(false); };
    });
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    
    // 통계 계산 로직 (v25.4 복구)
    let totalD = 0, totalK = 0;
    history.forEach(r => { totalD += parseFloat(r.dist); totalK += (Number(r.kcal) || 0); });
    document.getElementById('total-dist-val').textContent = totalD.toFixed(2) + " KM";
    document.getElementById('total-runs-val').textContent = history.length;
    document.getElementById('total-kcal-val').textContent = totalK;

    list.innerHTML = history.length ? "" : '<div style="color:#333; text-align:center; margin-top:50px; font-weight:900;">NO DATA</div>';
    
    history.forEach(r => {
        const item = document.createElement('div');
        item.style.cssText = "background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:15px; border:1px solid #1f1f1f;";
        item.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:12px; color:var(--primary); font-weight:900;">${r.date}</span>
                <button class="btn-map-view" onclick="showFullMap(${r.id})">📍 VIEW MAP</button>
            </div>
            <div style="font-size:32px; font-weight:900; margin-bottom:18px;">${r.dist} <small style="font-size:12px; color:var(--primary)">KM</small> <span style="font-size:18px; color:#fff; opacity:0.6; margin-left:10px;">${r.time}</span></div>
            <div class="h-footer">
                <div class="h-action-btns">
                    <button class="btn-icon-action diag" onclick="showModal('🧬 GCT 300ms 초과 시 주의하세요!')">🧬 DIAG</button>
                    <button class="btn-icon-action help" onclick="showModal('❓ 170-180 케이던스가 부상을 방지합니다.')">❓ HELP</button>
                </div>
                <span class="h-delete" onclick="deleteRecord(${r.id})">Delete</span>
            </div>
        `;
        list.appendChild(item);
    });
}

async function deleteRecord(id) {
    const ok = await showModal("이 기록을 삭제할까요? 🍒", true);
    if (ok) {
        let h = JSON.parse(localStorage.getItem('oppaRunHistory'));
        h = h.filter(x => Number(x.id) !== Number(id));
        localStorage.setItem('oppaRunHistory', JSON.stringify(h));
        loadHistory();
    }
}

window.onload = initMap;
</script>
</body>
</html>
