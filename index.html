<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.25</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text-dim: #555; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui; height: 100vh; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        /* Navigation (4 Tabs) */
        .history-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; background: #000; flex-shrink: 0; }
        .sub-btn { padding: 10px 0; border: none; background: #222; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; }

        /* Total Summary Bar (Hidden by default, shown in TOTAL tab) */
        .summary-bar { display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; padding: 10px 20px; background: #000; border-bottom: 1px solid #1a1a1a; font-weight: 900; flex-shrink: 0; }
        .s-item { display: flex; flex-direction: column; }
        .s-lbl { font-size: 8px; color: var(--text-dim); margin-bottom: 2px; }
        .s-val { font-size: 14px; color: var(--primary); }

        /* Content Areas */
        .main-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; }
        .value { font-size: 20px; font-weight: 900; }

        /* History Pages */
        .page-content { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .page-content.active { display: flex; }
        .history-item { background: #0f0f0f; border-radius: 12px; padding: 16px; margin: 8px 12px; border: 1px solid #1a1a1a; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 12px; }
        .h-dist-time { font-size: 21px; font-weight: 900; }
        .h-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; border-top: 1px solid #222; padding-top: 12px; gap: 4px; }
        .h-det-val { font-size: 12px; font-weight: 800; color: #ddd; }

        /* Bottom Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-view">
        <div class="dashboard">
            <div class="card card-main"><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div id="time" class="value">00:00</div></div>
            <div class="card"><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div style="padding: 20px;"><button id="btn-start" style="width:100%; height:60px; border-radius:30px; background:var(--primary); font-weight:900; font-size:20px;">START RUNNING</button></div>
    </div>

    <div id="history-view" class="main-view" style="display:none;">
        <div class="history-nav">
            <button id="btn-list" class="sub-btn active" onclick="changeSubPage('list')">LIST</button>
            <button id="btn-total" class="sub-btn" onclick="changeSubPage('total')">TOTAL</button>
            <button id="btn-info" class="sub-btn" onclick="changeSubPage('info')">INFO</button>
            <button id="btn-setting" class="sub-btn" onclick="changeSubPage('setting')">SETTING</button>
        </div>
        
        <div id="total-summary" class="summary-bar" style="display:none;">
            <div class="s-item"><span class="s-lbl">TOTAL KM</span><span id="sum-dist" class="s-val">0.00 KM</span></div>
            <div class="s-item"><span class="s-lbl">TOTAL TIME</span><span id="sum-time" class="s-val">00:00:00</span></div>
            <div class="s-item"><span class="s-lbl">COUNT</span><span id="sum-count" class="s-val">0</span></div>
        </div>

        <div id="page-list" class="page-content active"><div id="history-list"></div></div>
        <div id="page-total" class="page-content" style="padding:40px; text-align:center; color:#555;">STATISTICS COMING SOON</div>
        <div id="page-info" class="page-content" style="padding:40px; text-align:center; color:#555;">OppaRun Pro v28.25</div>
        <div id="page-setting" class="page-content" style="padding:40px; text-align:center; color:#555;">SETTINGS</div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showMainTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showMainTab('history')">HISTORY</button>
    </div> 

<script>
    // 메인 탭 전환 (RUN vs HISTORY)
    function showMainTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('tab-run').classList.toggle('active', tab === 'run');
        document.getElementById('tab-history').classList.toggle('active', tab === 'history');
        if (tab === 'history') loadHistory();
    }

    // 히스토리 내 서브 페이지 전환
    function changeSubPage(pageId) {
        const pages = ['list', 'total', 'info', 'setting'];
        pages.forEach(p => {
            document.getElementById('page-' + p).classList.toggle('active', p === pageId);
            document.getElementById('btn-' + p).classList.toggle('active', p === pageId);
        });
        // TOTAL 페이지일 때만 요약 바 표시
        document.getElementById('total-summary').style.display = (pageId === 'total' ? 'grid' : 'none');
    }

    function loadHistory() {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        let tKm = 0, tSec = 0;
        const html = h.map(r => {
            tKm += parseFloat(r.dist || 0);
            const pts = r.time.split(':');
            tSec += (parseInt(pts[0])*60) + parseInt(pts[1]);
            return `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-main"><span class="h-dist-time">${r.dist}KM ${r.time}</span><span style="color:var(--primary); font-size:11px; font-weight:800;">ROUTE</span></div>
                <div class="h-grid">
                    <div class="h-col"><div class="h-det-val">${r.pace}</div></div>
                    <div class="h-col"><div class="h-det-val">${r.cadence}</div></div>
                    <div class="h-col"><div class="h-det-val">${r.kcal}</div></div>
                    <div class="h-col"><div class="h-det-val">${r.gct} / ${r.flight}%</div></div>
                </div>
            </div>`;
        }).join('');
        
        document.getElementById('sum-dist').textContent = tKm.toFixed(2) + " KM";
        document.getElementById('sum-count').textContent = h.length;
        const hrs = Math.floor(tSec/3600); const mins = Math.floor((tSec%3600)/60); const secs = tSec%60;
        document.getElementById('sum-time').textContent = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        document.getElementById('history-list').innerHTML = html;
    }

    window.onload = () => {
        const map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9380], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    };
</script>
</body>
</html>
