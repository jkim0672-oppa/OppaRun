<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.3 (Dynamic Indicators)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Dynamic Indicator Classes */
        .val-good { color: var(--primary) !important; }
        .val-warn { color: var(--warning) !important; }
        .val-bad { color: var(--danger) !important; }

        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; transition: 0.2s; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 0.5px; opacity: 0.8; }
        .h-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        
        .h-main-stats { display: flex; align-items: baseline; gap: 15px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 12px; }
        .h-val-big { font-size: 22px; font-weight: 900; color: #fff; }
        .h-val-unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .h-details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; }
        .h-det-val { font-size: 13px; font-weight: 900; color: #eee; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .diag-header { padding: 50px 20px 15px; border-bottom: 1px solid #222; }
        .diag-card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin: 8px 15px; border: 1px solid #333; }
        .diag-label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; text-align: center;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div class="diag-header">
            <div id="metro-title" style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div>
            <div id="metro-desc" style="color:#666; font-size:11px; margin-top:3px;">Perfect your cadence.</div>
        </div>
        <div class="diag-card">
            <div class="diag-label">TEMPO (BPM)</div>
            <div id="metro-bpm-val" style="font-size:40px; font-weight:900; text-align:center; color:var(--primary);">175</div>
            <input type="range" id="metro-bpm" style="width:100%; accent-color:var(--primary);" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div style="padding: 0 15px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
                <button id="btn-dim" style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding:20px;">
                <button id="btn-clear-history" style="background:#2a2a2a; color:var(--danger); border:1.5px solid #444; padding:18px; border-radius:12px; width:100%; font-weight:900;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/**
 * [OppaRun Pro - v29.3 Dynamic Indicators]
 * 실시간 케이던스, 지면접촉, 체공시간 색상 피드백 추가
 */

const translations = {
    ko: { 
        pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", cal: "칼로리", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", settings: "설정", confirmClear: "정말로 모든 기록을 삭제할까요?", alertCleared: "기록이 삭제되었습니다.", clear: "전체 기록 삭제", autoPaused: "자동 일시정지", wake: "화면을 깨우려면 터치하세요"
    }
};

class RunningStorage {
    constructor() { this.HISTORY_KEY = 'oppaRunHistory'; }
    saveRecord(record) {
        const history = this.loadHistory();
        history.unshift(record);
        localStorage.setItem(this.HISTORY_KEY, JSON.stringify(history));
    }
    loadHistory() { return JSON.parse(localStorage.getItem(this.HISTORY_KEY) || "[]"); }
    clearHistory() {
        if (confirm(translations.ko.confirmClear)) {
            localStorage.removeItem(this.HISTORY_KEY);
            ui.updateHistoryList();
            alert(translations.ko.alertCleared);
        }
    }
}

class UIManager {
    constructor() {
        this.dom = {
            curPace: document.getElementById('curPace'),
            dist: document.getElementById('dist'),
            time: document.getElementById('time'),
            cadence: document.getElementById('cadence'),
            gct: document.getElementById('gct'),
            flight: document.getElementById('flight'),
            historyList: document.getElementById('history-list'),
            runView: document.getElementById('run-view'),
            historyView: document.getElementById('history-view')
        };
    }

    updateRunningDisplay(data) {
        if (data.dist !== undefined) this.dom.dist.textContent = data.dist;
        if (data.time !== undefined) this.dom.time.textContent = data.time;
        if (data.pace !== undefined) this.dom.curPace.textContent = data.pace;

        // Dynamic Color Logic
        if (data.cadence !== undefined) {
            this.dom.cadence.textContent = data.cadence;
            this.dom.cadence.className = 'value ' + (data.cadence >= 175 ? 'val-good' : (data.cadence >= 165 ? 'val-warn' : 'val-bad'));
        }
        if (data.gct !== undefined) {
            this.dom.gct.textContent = data.gct;
            this.dom.gct.className = 'value ' + (data.gct <= 210 ? 'val-good' : (data.gct <= 240 ? 'val-warn' : 'val-bad'));
        }
        if (data.flight !== undefined) {
            this.dom.flight.textContent = data.flight;
            this.dom.flight.className = 'value ' + (data.flight >= 35 ? 'val-good' : (data.flight >= 30 ? 'val-warn' : 'val-bad'));
        }
    }

    showTab(tab) {
        this.dom.runView.style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        this.dom.historyView.style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.id === 'tab-'+tab));
        if(tab === 'history') this.updateHistoryList();
    }

    showSubTab(sub) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.id === 'sub-tab-'+sub));
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = (p.id === 'sub-page-'+sub ? 'flex' : 'none'));
    }

    updateHistoryList() {
        const h = storage.loadHistory();
        this.dom.historyList.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-main-stats">
                    <div class="h-val-big">${r.dist}<span class="h-val-unit">KM</span></div>
                    <div class="h-val-big" style="color:var(--primary)">${r.time}</div>
                </div>
                <div class="h-details-grid">
                    <div class="h-det-box"><div class="h-det-label">CADENCE</div><div class="h-det-val">${r.cadence}</div></div>
                    <div class="h-det-box"><div class="h-det-label">GCT</div><div class="h-det-val">${r.gct}ms</div></div>
                    <div class="h-det-box"><div class="h-det-label">FLIGHT</div><div class="h-det-val">${r.flight}%</div></div>
                </div>
            </div>`).join('');
    }

    toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
    openMetronome() { document.getElementById('metronome-view').style.display = 'flex'; }
    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; }
}

class MetroEngine {
    constructor() { this.isPlaying = false; this.audioCtx = null; }
    toggle() {
        this.isPlaying = !this.isPlaying;
        document.getElementById('quick-metro').textContent = this.isPlaying ? "METRO ON" : "METRO OFF";
        document.getElementById('quick-metro').style.color = this.isPlaying ? "var(--primary)" : "#999";
    }
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
}

class MotionManager {
    constructor(callback) { this.onStep = callback; this.lastStepTime = 0; }
    handleMotion(e) {
        let acc = e.accelerationIncludingGravity;
        if (!acc || acc.z === null) return;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        let now = Date.now();
        if (force > 13.0 && (now - this.lastStepTime) > 250) {
            let cycle = now - this.lastStepTime;
            this.lastStepTime = now;
            let gct = Math.round(cycle * 0.32);
            let flight = Math.round(((cycle - gct) / cycle) * 100);
            this.onStep({ cycle, gct, flight });
        }
    }
}

class OppaRunApp {
    constructor() {
        this.state = { isRunning: false, seconds: 0, steps: 0, totalDist: 0, path: [] };
        this.motion = new MotionManager((d) => this.updateMetrics(d));
    }
    init() {
        window.addEventListener('devicemotion', (e) => { if(this.state.isRunning) this.motion.handleMotion(e); });
        this.initMap();
    }
    initMap() {
        this.map = L.map('map', {zoomControl:false}).setView([37.5665, 126.9780], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
    }
    updateMetrics(data) {
        this.state.steps++;
        let cad = Math.round((this.state.steps / (this.state.seconds || 1)) * 60);
        ui.updateRunningDisplay({ cadence: cad, gct: data.gct, flight: data.flight });
    }
    onStart() {
        this.state.isRunning = true;
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        this.timer = setInterval(() => {
            this.state.seconds++;
            let m = Math.floor(this.state.seconds / 60), s = this.state.seconds % 60;
            ui.updateRunningDisplay({ time: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` });
        }, 1000);
    }
    onStop() {
        this.state.isRunning = false; clearInterval(this.timer);
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
    }
    onResume() { this.state.isRunning = true; this.onStart(); }
    onFinish() {
        storage.saveRecord({
            date: new Date().toLocaleString(),
            dist: this.state.totalDist.toFixed(2),
            time: ui.dom.time.textContent,
            cadence: ui.dom.cadence.textContent,
            gct: ui.dom.gct.textContent,
            flight: ui.dom.flight.textContent
        });
        location.reload();
    }
}

const storage = new RunningStorage();
const ui = new UIManager();
const metro = new MetroEngine();
const app = new OppaRunApp();

window.onload = () => app.init();
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
