<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.3.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #1e1e1e; --text-main: #fff; --text-dim: #999; --danger: #ff4444; --warning: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; min-height: 75px; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 120px; position: relative; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 52px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 9px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.15); padding: 3px 7px; border-radius: 4px; display: none; border: 1px solid var(--danger); }
        .mini-btn { background:#333; border:1px solid #444; color:#999; font-size:9px; padding:6px 10px; border-radius:6px; font-weight:900; }
        .controls { padding: 20px; margin-top: auto; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }
        .history-item { background: var(--card-bg); margin: 8px; padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary); }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="dimmer-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:none; justify-content:center; align-items:center; color:#444; font-weight:900;" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div>
    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="mini-btn" id="btn-metro" style="position:absolute; top:10px; right:10px;" onclick="app.toggleMetro()">METRO OFF</button>
                <button class="mini-btn" style="position:absolute; bottom:10px; right:10px;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>
    <div id="history-view" class="main-content" style="display:none; overflow-y:auto;">
        <div id="history-list" style="padding-bottom:100px;"></div>
    </div>
    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div>
<script>
class RunningStorage {
    save(data) {
        let history = JSON.parse(localStorage.getItem('oppaRunHistory') || '[]');
        history.unshift({ ...data, id: Date.now(), date: new Date().toLocaleString() });
        localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    }
    getHistory() { return JSON.parse(localStorage.getItem('oppaRunHistory') || '[]'); }
}
const storage = new RunningStorage();
class UIManager {
    showTab(t) {
        document.getElementById('run-view').style.display = t==='run'?'flex':'none';
        document.getElementById('map-area').style.display = t==='run'?'block':'none';
        document.getElementById('history-view').style.display = t==='history'?'block':'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        if(t==='history') this.renderHistory();
    }
    renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = storage.getHistory().map(h => `
            <div class="history-item">
                <div style="font-size:12px; color:var(--primary); margin-bottom:8px;">${h.date}</div>
                <div style="display:flex; justify-content:space-between;">
                    <span style="font-size:20px; font-weight:900;">${h.dist} KM</span>
                    <span style="font-size:20px;">${h.time}</span>
                </div>
            </div>
        `).join('');
    }
    toggleDim(s) { document.getElementById('dimmer-overlay').style.display = s?'flex':'none'; }
}
const ui = new UIManager();
class OppaRunApp {
    constructor() { this.state = { running: false, sec: 0, dist: 0, autoPaused: false, lastPos: null, steps: 0, metro: false }; this.timer = null; }
    init() {
        this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7743, -117.9380], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude], speed = p.coords.speed;
            document.getElementById('status').textContent = `GPS ACTIVE | ALT: ${Math.round(p.coords.altitude||0)}m`;
            this.map.panTo(pos);
            if(this.state.running) this.updateLogic(pos, speed);
        }, null, {enableHighAccuracy:true});
        window.addEventListener('devicemotion', (e) => this.handleMotion(e));
    }
    updateLogic(pos, speed) {
        if (speed !== null && speed < 0.5) { document.getElementById('pause-status').style.display = 'block'; this.state.autoPaused = true; }
        else { document.getElementById('pause-status').style.display = 'none'; this.state.autoPaused = false; }
        if (!this.state.autoPaused && speed > 0.5) {
            const paceMin = 1 / (speed * 0.06);
            const m = Math.floor(paceMin), s = Math.floor((paceMin-m)*60);
            document.getElementById('curPace').textContent = `${m}'${String(s).padStart(2,'0')}"`;
        }
        if (!this.state.autoPaused && this.state.lastPos) {
            const d = this.map.distance(this.state.lastPos, pos) / 1000;
            if (d > 0.0015) { this.state.dist += d; document.getElementById('dist').textContent = this.state.dist.toFixed(2); }
        }
        this.state.lastPos = pos;
    }
    handleMotion(e) {
        if(!this.state.running || this.state.autoPaused) return;
        const acc = e.accelerationIncludingGravity;
        const force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        if(force > 13.5) { 
            this.state.steps++; 
            const cad = Math.min(220, Math.round((this.state.steps/(this.state.sec||1))*60));
            document.getElementById('cadence').textContent = cad;
            if(cad > 0) {
                const gct = Math.max(140, Math.round(400 - (cad * 1.1))); 
                document.getElementById('gct').textContent = gct;
                const f = Math.max(0, Math.round((1 - (gct/(60000/cad/2)))*100));
                document.getElementById('flight').textContent = f;
            }
        }
    }
    onStart() {
        this.state.running = true; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
        this.timer = setInterval(() => { if (!this.state.autoPaused) { this.state.sec++; const m = Math.floor(this.state.sec/60), s = this.state.sec%60; document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; } }, 1000);
    }
    onStop() { this.state.running = false; clearInterval(this.timer); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
    onResume() { this.state.running = true; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; this.timer = setInterval(() => { if (!this.state.autoPaused) { this.state.sec++; const m = Math.floor(this.state.sec/60), s = this.state.sec%60; document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; } }, 1000); }
    onFinish() {
        storage.save({ dist: this.state.dist.toFixed(2), time: document.getElementById('time').textContent });
        alert("Run Saved!"); location.reload();
    }
    toggleMetro() { this.state.metro = !this.state.metro; document.getElementById('btn-metro').textContent = this.state.metro ? "METRO ON" : "METRO OFF"; document.getElementById('btn-metro').style.color = this.state.metro ? "var(--primary)" : "#999"; }
}
const app = new OppaRunApp();
window.onload = () => app.init();
</script>
</body>
</html>
