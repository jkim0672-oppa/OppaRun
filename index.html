<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text-main: #fff; --text-dim: #999; --danger: #ff4444; --accent: #007bff; --metro-color: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .controls { padding: 20px 15px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; }
        .history-nav { display: flex; gap: 5px; padding: 10px; background: #000; overflow-x: auto; }
        .sub-btn { flex: 1; min-width: 80px; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #1f1f1f; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px 0; border-bottom: 1px solid #222; }
        input[type="range"] { width: 100%; accent-color: var(--primary); margin: 10px 0; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar" data-ko="GPS 수신 중..." data-en="GPS Initializing...">GPS 수신 중...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" data-ko="현재 페이스" data-en="CURRENT PACE" style="color:var(--primary)">현재 페이스</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label" data-ko="거리" data-en="DISTANCE">거리</div><div class="value"><span id="dist">0.00</span><small> KM</small></div></div>
            <div class="card"><div class="label" data-ko="시간" data-en="TIME">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-ko="평균 페이스" data-en="AVG PACE">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-ko="케이던스" data-en="CADENCE">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-ko="자동 멈춤" data-en="AUTO PAUSE">자동 멈춤</div><div id="auto-pause-status" class="value" style="color:var(--danger); font-size:14px;">OFF</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-ko="러닝 시작" data-en="START RUN">러닝 시작</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-ko="정지" data-en="STOP">정지</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-ko="기록 리스트" data-en="HISTORY">기록 리스트</button>
            <button id="sub-tab-set" class="sub-btn" onclick="showSubTab('set')" data-ko="⚙️ 설정" data-en="⚙️ SETTINGS">⚙️ 설정</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-set" class="sub-page">
            <div class="history-item">
                <div class="setting-row"><span data-ko="언어" data-en="Language">언어</span>
                    <select id="lang-select" onchange="changeLang(this.value)"><option value="ko">한국어</option><option value="en">English</option></select>
                </div>
                <div class="setting-row"><span data-ko="자동 멈춤 사용" data-en="Auto Pause">자동 멈춤 사용</span><input type="checkbox" id="auto-pause-toggle"></div>
                <div class="setting-row"><span data-ko="메트로놈" data-en="Metronome">메트로놈</span><input type="checkbox" id="metro-toggle" onchange="toggleMetronome()"></div>
                <div class="label" data-ko="비트 속도 (BPM)" data-en="Tempo (BPM)">비트 속도 (BPM): <span id="bpm-val">175</span></div>
                <input type="range" id="bpm-range" min="150" max="200" value="175" oninput="updateBPM(this.value)">
                <div class="label" data-ko="음량" data-en="Volume">음량: <span id="vol-val">80</span>%</div>
                <input type="range" id="vol-range" min="0" max="100" value="80" oninput="updateVol(this.value)">
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div>

<script>
let map, audioCtx, metroTimer, masterGain, curLang = 'ko';
let isRunning = false, isPaused = false, seconds = 0, bpm = 175, volume = 0.8;

function changeLang(l) {
    curLang = l;
    document.querySelectorAll('[data-ko]').forEach(el => { el.innerText = el.getAttribute('data-' + l); });
}

function updateVol(v) { volume = v / 100; document.getElementById('vol-val').innerText = v; if(masterGain) masterGain.gain.value = volume; }
function updateBPM(v) { bpm = v; document.getElementById('bpm-val').innerText = v; }

function toggleMetronome() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
    }
    masterGain.gain.value = document.getElementById('metro-toggle').checked ? volume : 0;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playMetro();
}

function playMetro() {
    if (!document.getElementById('metro-toggle').checked) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.value = 1000;
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    setTimeout(playMetro, (60 / bpm) * 1000);
}

// 자동 멈춤 로직 (속도 기반)
function checkAutoPause(speedKmh) {
    const useAuto = document.getElementById('auto-pause-toggle').checked;
    if (!useAuto || !isRunning) return;
    if (speedKmh < 1.5 && !isPaused) { 
        isPaused = true; 
        document.getElementById('auto-pause-status').innerText = "PAUSED";
    } else if (speedKmh >= 2.0 && isPaused) { 
        isPaused = false; 
        document.getElementById('auto-pause-status').innerText = "RUNNING";
    }
}

function showTab(t) {
    document.getElementById('run-view').style.display = (t==='run'?'flex':'none');
    document.getElementById('history-view').style.display = (t==='history'?'flex':'none');
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
}

function showSubTab(s) {
    document.getElementById('sub-page-list').style.display = (s==='list'?'flex':'none');
    document.getElementById('sub-page-set').style.display = (s==='set'?'flex':'none');
    document.getElementById('sub-tab-list').classList.toggle('active', s==='list');
    document.getElementById('sub-tab-set').classList.toggle('active', s==='set');
}

function onStart() { isRunning = true; document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='block'; setInterval(()=> { if(isRunning && !isPaused) seconds++; }, 1000); }
function onStop() { isRunning = false; location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl:false}).setView([37.56, 126.97], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    changeLang('ko');
};
</script>
</body>
</html>
