<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun Gold Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* 어제 잘 보였던 그 스타일 그대로! */
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* 지도를 화면의 절반으로 설정하여 안정감 확보 */
        #map { height: 45vh; width: 100%; border-bottom: 1px solid #333; }
        
        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; justify-content: space-between; background: #000; }
        
        /* 데이터 박스들을 더 촘촘하게 배치 */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 5px; }
        .box { background: #1a1a1a; padding: 10px; border-radius: 10px; text-align: center; }
        .box small { color: #888; font-size: 11px; display: block; margin-bottom: 2px; }
        .val { font-size: 20px; font-weight: bold; }
        
        /* 현재 페이스 박스 */
        .pace-main { border: 2px solid #00ff88; padding: 10px; border-radius: 15px; text-align: center; margin-bottom: 10px; }
        
        /* 버튼이 브라우저 바 위로 확실히 올라오도록 설정 */
        .btn-area { padding-bottom: 15px; }
        button { border: none; padding: 15px; border-radius: 30px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
        #startBtn { background: #ff4444; color: #fff; }
        
        .sub-btns { display: none; gap: 10px; }
        #resumeBtn { background: #00ff88; color: #000; flex: 1; }
        #finishBtn { background: #444; color: #fff; flex: 1; }
        
        /* 하단 탭 바 */
        .tab-bar { display: flex; border-top: 1px solid #333; background: #000; padding: 12px 0; }
        .tab-item { flex: 1; text-align: center; font-size: 12px; color: #555; }
        .tab-active { color: #00ff88; font-weight: bold; }

        .my-location { background: #007bff; border: 2px solid white; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div class="content">
            <div class="status-grid">
                <div class="box"><small>DISTANCE</small><div id="d" class="val" style="color:#00ff88;">0.00</div></div>
                <div class="box"><small>TIME</small><div id="t" class="val">00:00:00</div></div>
            </div>

            <div class="pace-main">
                <small style="color:#00ff88;">CURRENT PACE</small>
                <div id="p" style="font-size:32px; font-weight:bold;">--'--"</div>
            </div>

            <div class="btn-area">
                <button id="startBtn">START RUN</button>
                <div id="subBtns" class="sub-btns">
                    <button id="resumeBtn">RESUME</button>
                    <button id="finishBtn">STOP</button>
                </div>
            </div>
        </div>
        <div class="tab-bar">
            <div class="tab-item tab-active">🏃‍♂️ RUNNING</div>
            <div class="tab-item">📜 HISTORY</div>
        </div>
    </div>

    <script>
        // 어제 성공했던 지도 로직 그대로 적용
        let map = L.map('map', {zoomControl: false}).setView([37.44, 126.5], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let path = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
        let myMarker = L.marker([37.44, 126.5], {
            icon: L.divIcon({className: 'my-location', iconSize: [12, 12]})
        }).addTo(map);

        let isRunning = false, dist = 0, lastPos = null, sec = 0, timer;

        function update(pos) {
            const c = pos.coords;
            myMarker.setLatLng([c.latitude, c.longitude]);
            if (!lastPos) map.setView([c.latitude, c.longitude], 17);
            
            if (isRunning && lastPos) {
                let d = map.distance([lastPos.lat, lastPos.lng], [c.latitude, c.longitude]);
                if (c.accuracy < 25 && d > 2) {
                    dist += d;
                    document.getElementById('d').innerText = (dist/1000).toFixed(2);
                    path.addLatLng([c.latitude, c.longitude]);
                    map.panTo([c.latitude, c.longitude]);
                }
            }
            
            if (c.speed >= 0.5) {
                let p = 16.6667 / c.speed;
                let m = Math.floor(p), s = Math.round((p-m)*60);
                document.getElementById('p').innerText = `${m}'${s.toString().padStart(2,'0')}"`;
            } else {
                document.getElementById('p').innerText = `--'--"`;
            }
            lastPos = {lat: c.latitude, lng: c.longitude};
        }

        document.getElementById('startBtn').onclick = function() {
            isRunning = true;
            this.style.display = "none";
            document.getElementById('subBtns').style.display = "flex";
            timer = setInterval(() => {
                if (isRunning) {
                    sec++;
                    let h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
                    document.getElementById('t').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                }
            }, 1000);
        };

        document.getElementById('finishBtn').onclick = function() {
            if (this.innerText === "STOP") {
                isRunning = false;
                this.innerText = "FINISH";
                document.getElementById('resumeBtn').style.display = "block";
            } else {
                location.reload();
            }
        };

        document.getElementById('resumeBtn').onclick = function() {
            isRunning = true;
            this.style.display = "none";
            document.getElementById('finishBtn').innerText = "STOP";
        };

        navigator.geolocation.watchPosition(update, null, {enableHighAccuracy: true});
    </script>
</body>
</html>
