<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.95 (Final)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* Layout Structure */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard & Cards */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 100px; position: relative; margin-bottom: 4px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; } 
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Modal Views (Metronome, Detail, Diag) */
        #diag-view, #metronome-view, #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .diag-header { padding: 50px 20px 15px; border-bottom: 1px solid #222; }
        .diag-card { background: #1a1a1a; border-radius: 12px; padding: 15px; margin: 8px 15px; border: 1px solid #333; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }

        /* Controls & Navigation */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }
        
        /* History Submenu */
        .history-sub-menu { display: flex; background: #0a0a0a; border-bottom: 1px solid #222; padding: 5px; gap: 5px; }
        .sub-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #666; font-size: 11px; font-weight: 900; padding: 12px 0; border-radius: 8px; cursor: pointer; }
        .sub-btn.active { color: var(--primary); border-color: var(--primary); background: #002211; }

        /* Settings Style */
        .settings-container { padding: 20px; }
        .settings-group { margin-bottom: 25px; position: relative; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; }

        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div class="diag-header"><div style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div></div>
        <div class="diag-card">
            <div style="text-align:center; font-size:40px; font-weight:900; color:var(--primary);" id="metro-bpm-val">175</div>
            <input type="range" id="metro-bpm" style="width:100%; accent-color:var(--primary);" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div style="padding:0 15px;"><button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button></div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="ui.openMetronome()">METRO OFF</button>
                <button style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:12px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-sub-menu">
            <button class="sub-btn active" id="sbtn-list" onclick="ui.showSubTab('list')">리스트</button>
            <button class="sub-btn" id="sbtn-stats" onclick="ui.showSubTab('stats')">통계</button>
            <button class="sub-btn" id="sbtn-info" onclick="ui.showSubTab('info')">인포</button>
            <button class="sub-btn" id="sbtn-setting" onclick="ui.showSubTab('setting')">설정</button>
        </div>
        <div id="sub-list" style="flex:1; overflow-y: auto; padding-bottom: 90px;"><div id="history-list"></div></div>
        <div id="sub-setting" style="display:none; flex:1; overflow-y: auto; padding-bottom: 90px;" class="settings-container">
            <div class="settings-group">
                <div class="settings-label">LANGUAGE</div>
                <div class="dropdown-select"><span>English / 한국어</span><span>▼</span></div>
            </div>
            <div class="settings-group">
                <div class="settings-label">PROFILE</div>
                <div style="display:flex; gap:10px;">
                    <div class="dropdown-select" style="flex:1;"><span>175 cm</span></div>
                    <div class="dropdown-select" style="flex:1;"><span>70 kg</span></div>
                </div>
            </div>
            <button style="width:100%; padding:18px; border-radius:12px; background:#2a2a2a; color:var(--danger); border:1px solid #444; font-weight:900;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
        </div>
        <div id="sub-stats" style="display:none; padding:20px;">
            <div class="diag-card" style="text-align:center;">
                <div class="label">LIFETIME DISTANCE</div>
                <div class="value" id="total-dist-val" style="color:var(--primary)">0.0 KM</div>
            </div>
        </div>
        <div id="sub-info" style="display:none; padding:20px;">
            <div class="diag-card">
                <div style="color:var(--primary); font-weight:900;">CADENCE INFO</div>
                <div style="font-size:12px; margin-top:5px; color:#aaa;">권장: 170~185 BPM</div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
// State & Logic
const State = {
    isRunning: false, isPaused: false, isAutoPaused: false,
    seconds: 0, totalDist: 0, steps: 0,
    pathCoords: [], lastPos: null, lastStepTime: 0,
    gctAccumulator: 0, gctCount: 0,
    wakeLock: null, timer: null, lowSpeedStartTime: null, currentAlt: 0
};

const storage = {
    key: 'oppaRunHistory',
    saveRecord(r) { let h = this.loadHistory(); h.unshift(r); localStorage.setItem(this.key, JSON.stringify(h)); },
    loadHistory() { return JSON.parse(localStorage.getItem(this.key) || "[]"); },
    clearHistory() { if(confirm("Clear all history?")) { localStorage.removeItem(this.key); location.reload(); } }
};

const ui = {
    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'history') this.showSubTab('list');
        if (map) setTimeout(() => map.invalidateSize(), 100);
    },
    showSubTab(sub) {
        ['list', 'stats', 'info', 'setting'].forEach(s => {
            document.getElementById('sub-' + s).style.display = (s === sub ? 'block' : 'none');
            document.getElementById('sbtn-' + s).classList.remove('active');
        });
        document.getElementById('sbtn-' + sub).classList.add('active');
        if (sub === 'list') this.updateHistoryList();
        if (sub === 'stats') {
            let h = storage.loadHistory();
            let d = h.reduce((acc, r) => acc + parseFloat(r.dist), 0);
            document.getElementById('total-dist-val').textContent = d.toFixed(1) + " KM";
        }
    },
    updateHistoryList() {
        const h = storage.loadHistory();
        const listDiv = document.getElementById('history-list');
        if (h.length === 0) { listDiv.innerHTML = `<div style="text-align:center; padding:50px; color:#444; font-weight:900;">NO RECORDS</div>`; return; }
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div style="font-size:11px; color:var(--primary); font-weight:900; margin-bottom:5px;">${r.date}</div>
                <div style="display:flex; align-items:baseline; margin-bottom:10px;">
                    <span style="font-size:24px; font-weight:900; color:#fff;">${r.dist}KM</span>
                    <span style="font-size:18px; font-weight:900; color:var(--primary); margin-left:15px;">${r.time}</span>
                </div>
            </div>`).join('');
    },
    openMetronome() { document.getElementById('metronome-view').style.display = 'flex'; },
    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; },
    toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
};

// Metronome Engine (Simulated for this unified version)
const metro = {
    isPlaying: false,
    toggle() {
        this.isPlaying = !this.isPlaying;
        const btn = document.getElementById('btn-metro-toggle');
        const quick = document.getElementById('quick-metro');
        btn.textContent = this.isPlaying ? "STOP" : "START";
        btn.style.background = this.isPlaying ? "var(--danger)" : "var(--primary)";
        quick.textContent = this.isPlaying ? "METRO ON" : "METRO OFF";
        quick.style.color = this.isPlaying ? "var(--primary)" : "#999";
    },
    updateDisplay() {
        document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value;
    }
};

let map, marker, polyline;

function onStart() {
    State.isRunning = true; State.isPaused = false; State.totalDist = 0; State.seconds = 0;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    State.timer = setInterval(() => {
        if(!State.isPaused) {
            State.seconds++;
            let m = Math.floor(State.seconds/60), s = State.seconds%60;
            document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
    }, 1000);
}

function onStop() { State.isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { State.isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    storage.saveRecord({
        id: Date.now(), date: new Date().toLocaleString(),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('curPace').textContent
    });
    location.reload();
}

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((p) => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos); map.panTo(pos);
            document.getElementById('status').textContent = `GPS READY: ±${Math.round(p.coords.accuracy)}m | ALT: ${p.coords.altitude ? Math.round(p.coords.altitude) : '--'}m`;
        }, null, {enableHighAccuracy: true});
    }
};
</script>
</body>
</html>
