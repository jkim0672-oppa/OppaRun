<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00; --info: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* [레이아웃 고정] */
        #map-area { flex-shrink: 0; width: 100%; position: relative; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #111; } /* 배경색을 어둡게 해서 로딩 전에도 이질감 없게 */
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; }
        
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        .label { font-size: 10px; color: #888; font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; }

        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 15px 15px 15px; }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }

        /* [수정] VIEW MAP 버튼: 글로시 스타일 */
        .btn-map-view { 
            background: rgba(0, 255, 136, 0.1); color: var(--primary); 
            border: 1px solid var(--primary); border-radius: 10px; 
            font-size: 10px; font-weight: 900; padding: 6px 12px;
        }

        /* [수정] 히스토리 카드 하단 푸터 */
        .h-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid #222; }
        .h-action-btns { display: flex; gap: 8px; }
        .btn-icon-action { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 5px 8px; font-size: 10px; font-weight: 800; }
        .btn-icon-action.diag { color: var(--primary); border-color: var(--primary); }
        .btn-icon-action.help { color: var(--info); border-color: var(--info); }
        .h-delete { color: #444; font-size: 10px; text-decoration: underline; font-weight: 800; }

        /* 팝업 공통 */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 30000; background: rgba(0,0,0,0.9); flex-direction: column; padding: 20px; }
        .diag-box { background: #121212; border: 1.5px solid var(--primary); border-radius: 20px; padding: 25px; margin-top: 50px; }
        .close-bar { height: 70px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 900; margin-top: 20px; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; border-top: 1px solid #222; z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS READY</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            </div>
        <div style="height:100px; display:flex; align-items:center; justify-content:center; padding:20px;">
            <button id="btn-start" style="width:100%; height:55px; border-radius:30px; background:var(--primary); font-weight:900;" onclick="onStart()">START</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="padding:20px;"><span style="font-size:24px; font-weight:900; color:var(--primary);">HISTORY</span></div>
        <div id="history-list" class="history-list" style="overflow-y:auto; padding:10px;"></div>
    </div>

    <div id="diag-overlay" class="overlay">
        <div class="diag-box"><div class="diag-title" style="color:var(--primary); font-weight:900; margin-bottom:15px;">DIAGNOSIS</div><p style="font-size:12px; color:#aaa;">GCT 300ms 초과 시 족저근막 부하 급증 주의!</p></div>
        <div class="close-bar" onclick="closePop()">CLOSE</div>
    </div>
    <div id="help-overlay" class="overlay">
        <div class="diag-box"><div class="diag-title" style="color:var(--info); font-weight:900; margin-bottom:15px;">HELP</div><p style="font-size:12px; color:#aaa;">리드미컬한 러닝이 이명과 부상을 방지합니다.</p></div>
        <div class="close-bar" onclick="closePop()">CLOSE</div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, historyMap;

// [더블 체크] 지도 로딩 핵심 로직
function initMap() {
    // 1. 지도 인스턴스 생성
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 17);
    
    // 2. 타일 레이어 (https 강제 및 에러 핸들링)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 3. 렌더링 강제 업데이트 (로딩 직후 0.2초 뒤에 크기 재계산)
    setTimeout(() => {
        map.invalidateSize();
    }, 200);

    marker = L.marker([37.5665, 126.9780], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    loadHistory();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    
    // [더블 체크] 탭 전환 시 지도가 깨져있을 수 있으므로 다시 invalidateSize 호출
    if(tab === 'run' && map) {
        setTimeout(() => { map.invalidateSize(); }, 100);
    }
    if(tab === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    history.forEach(r => {
        const item = document.createElement('div');
        item.style.cssText = "background:#121212; border-radius:20px; padding:20px; margin-bottom:15px; border:1px solid #222;";
        item.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="font-size:12px; color:var(--primary); font-weight:900;">${r.date}</span>
                <button class="btn-map-view">📍 VIEW MAP</button>
            </div>
            <div style="font-size:32px; font-weight:900; margin-bottom:15px;">${r.dist} <small style="font-size:12px; color:var(--primary)">KM</small></div>
            <div class="h-footer">
                <div class="h-action-btns">
                    <button class="btn-icon-action diag" onclick="openDiag()">🧬 DIAG</button>
                    <button class="btn-icon-action help" onclick="openHelp()">❓ HELP</button>
                </div>
                <span class="h-delete">Delete</span>
            </div>
        `;
        list.appendChild(item);
    });
}

function openDiag() { document.getElementById('diag-overlay').style.display = 'flex'; }
function openHelp() { document.getElementById('help-overlay').style.display = 'flex'; }
function closePop() { document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none'); }

window.onload = initMap;
</script>
</body>
</html>
