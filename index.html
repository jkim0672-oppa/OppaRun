<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - Clean Start</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --danger: #ff4444; --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* [UI 구조] 상단 고정: 지도 영역 */
        #map-area { flex-shrink: 0; width: 100%; display: block; }
        #map-container { height: 20vh; min-height: 150px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 5px; background: #0a0a0a; font-weight: 800; }
        
        /* [UI 구조] 중앙 유동: 콘텐츠 영역 */
        .main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
        
        /* 대시보드 그리드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 100px; }
        
        .label { font-size: 10px; color: #888; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        /* 버튼 컨트롤 */
        .controls { padding: 20px 15px; margin-top: auto; padding-bottom: 100px; }
        .btn-capsule { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; }
        .btn-half { flex: 1; height: 60px; border-radius: 30px; border: none; font-weight: 900; }

        /* 히스토리 리스트 */
        .history-item { background: var(--card-bg); border-radius: 20px; padding: 20px; margin: 10px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .h-dist { font-size: 32px; font-weight: 900; }

        /* 하단 탭바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 15px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span></div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit" id="gct-unit">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit" id="flight-unit">%</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button class="btn-half" style="background:var(--primary);" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <h2 style="padding: 20px; color: var(--primary);">HISTORY</h2>
        <div id="history-list"></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, isRunning = false, isPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, pathCoords = [], steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    
    if (force > 13 && (now - lastStepTime) > 250) { 
        steps++; lastStepTime = now;
        let gct = Math.max(180, Math.floor(300 - (currentSpeedKmh * 5) + (Math.random() * 20)));
        let flt = Math.min(35, Math.floor(10 + (currentSpeedKmh * 1.5)));
        gctSum += gct; flightSum += flt; dataCount++;
        
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        updateDynamicValue('gct', gct, 260, 300, 'ms');
        updateDynamicValue('flight', flt, 12, 18, '%', true);
    }
}

function updateDynamicValue(id, val, warn, crit, unit, inverse = false) {
    const el = document.getElementById(id);
    const un = document.getElementById(id + '-unit');
    el.textContent = val;
    let color = 'var(--primary)';
    if (inverse) { // Flight: 높을수록 좋음
        if (val < warn) color = 'var(--danger)';
        else if (val < crit) color = 'var(--warning)';
    } else { // GCT: 낮을수록 좋음
        if (val > crit) color = 'var(--danger)';
        else if (val > warn) color = 'var(--warning)';
    }
    el.style.color = un.style.color = color;
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.003) { totalDist += d; lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('dist').textContent = totalDist.toFixed(2);
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
    }
    if (document.getElementById('status').textContent.includes("INIT")) document.getElementById('status').textContent = "GPS READY";
}

function formatPace(kmh) { if (kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); } // 간단한 초기화

function showTab(tab) {
    document.getElementById('run-view').style.display = tab === 'run' ? 'flex' : 'none';
    document.getElementById('history-view').style.display = tab === 'history' ? 'flex' : 'none';
    document.getElementById('tab-run').classList.toggle('active', tab === 'run');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
}

window.onload = initMap;
</script>
</body>
</html>
