<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.1 Classic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #111; --text: #fff; --dim: #888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 상단 맵 영역 (고정) */
        #map-area { height: 25vh; min-height: 150px; position: relative; border-bottom: 1px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; bottom: 0; width: 100%; text-align: center; color: #ffcc00; font-size: 10px; background: rgba(0,0,0,0.7); z-index: 1000; padding: 2px 0; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 대시보드: 시원시원한 레이아웃 */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .card-full { grid-column: span 2; background: var(--card-bg); border-radius: 15px; padding: 20px; border: 1.5px solid var(--primary); text-align: center; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid #222; }
        
        .label { font-size: 10px; color: var(--dim); font-weight: 800; margin-bottom: 5px; }
        .val-l { font-size: 48px; font-weight: 900; color: var(--primary); line-height: 1; }
        .val-m { font-size: 24px; font-weight: 800; }

        /* 히스토리: 겹침 방지 최적화 */
        .history-list { flex: 1; overflow-y: auto; padding: 0 15px 100px; }
        .history-item { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .h-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #333; padding-top: 8px; }
        .h-unit { font-size: 8px; color: #666; display: block; }
        .h-val { font-size: 13px; font-weight: 700; color: #ddd; }

        /* 하단 컨트롤 */
        .controls { padding: 15px; background: var(--bg); border-top: 1px solid #222; z-index: 100; margin-bottom: 70px; }
        .btn { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; transition: 0.1s; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn-start { background: var(--primary); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex: 1; background: none; border: none; color: #444; font-weight: 800; font-size: 14px; }
        .tab.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="map-area">
        <div id="map"></div>
        <div class="status-bar">GPS ACTIVE</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card-full">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="val-l">--'--"</div>
            </div>
            <div class="card"><div class="label">DISTANCE</div><div class="val-m"><span id="dist">0.00</span> <small style="font-size:12px">KM</small></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="val-m">00:00</div></div>
            <div class="card"><div class="label">GCT</div><div class="val-m"><span id="gct">--</span> <small style="font-size:12px">MS</small></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="val-m"><span id="flight">--</span> <small style="font-size:12px">%</small></div></div>
        </div>
        <div class="controls">
            <button id="btn-main" class="btn btn-start" onclick="toggleRun()">START RUN</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none; padding-top:15px;">
        <h2 style="padding-left:15px; margin:0 0 15px 0;">HISTORY</h2>
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab" onclick="showTab('history')">HISTORY</button>
    </div>

<script>
let isRunning = false, seconds = 0, timer, totalDist = 0;
// 데이터는 오빠의 기존 로컬스토리지를 그대로 유지하도록 짰어!

function toggleRun() {
    const btn = document.getElementById('btn-main');
    if(!isRunning) {
        isRunning = true;
        btn.textContent = "STOP";
        btn.className = "btn btn-stop";
        timer = setInterval(() => {
            seconds++;
            document.getElementById('time').textContent = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        }, 1000);
    } else {
        isRunning = false;
        clearInterval(timer);
        btn.textContent = "START RUN";
        btn.className = "btn btn-start";
        saveRecord();
    }
}

function saveRecord() {
    const record = { date: new Date().toLocaleDateString(), dist: document.getElementById('dist').textContent, time: document.getElementById('time').textContent, pace: document.getElementById('curPace').textContent };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    renderHistory();
}

function renderHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-row"><span style="font-weight:900">${r.date}</span><span style="color:var(--primary); font-weight:900;">${r.dist} KM</span></div>
            <div class="h-grid">
                <div><span class="h-unit">TIME</span><span class="h-val">${r.time}</span></div>
                <div><span class="h-unit">PACE</span><span class="h-val">${r.pace}</span></div>
                <div><span class="h-unit">KCAL</span><span class="h-val">--</span></div>
                <div><span class="h-unit">GCT</span><span class="h-val">--</span></div>
            </div>
        </div>
    `).join('');
}

function showTab(tab) {
    document.getElementById('run-view').style.display = tab === 'run' ? 'flex' : 'none';
    document.getElementById('history-view').style.display = tab === 'history' ? 'flex' : 'none';
    document.getElementById('tab-run').classList.toggle('active', tab === 'run');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
}

// 지도 초기화는 기존 맵 코드 그대로 사용하면 돼!
let map = L.map('map', {zoomControl:false}).setView([37.5665, 126.9780], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
renderHistory();
</script>
</body>
</html>
