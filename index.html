<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Run - Record</title>
    <style>
        /* 기본 배경 및 레이아웃 (기존 스타일 유지) */
        body {
            background-color: #1a1a1a;
            color: #d1d1d1;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .record-container {
            width: 100%;
            max-width: 400px;
            background: #252525;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
        }

        /* 일반적인 숫자 스타일 */
        .stat-value {
            font-size: 18px;
            font-weight: 500;
            color: #e0e0e0;
        }

        /* --- 오빠가 요청한 고도 숫자 강조 스타일 --- */
        .altitude-highlight {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff !important; /* 가장 밝은 흰색 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); /* 빛나는 효과 */
        }

        .unit {
            font-size: 12px;
            margin-left: 4px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="record-container">
    <h2 style="text-align: center; color: #fff;">러닝 기록</h2>
    
    <div class="stat-row">
        <span class="stat-label">거리</span>
        <span class="stat-value">10.01 <span class="unit">km</span></span>
    </div>

    <div class="stat-row">
        <span class="stat-label">페이스</span>
        <span class="stat-value">4:55 <span class="unit">/km</span></span>
    </div>

    <!-- 고도 부분만 클래스를 altitude-highlight로 적용 -->
    <div class="stat-row">
        <span class="stat-label">획득 고도</span>
        <span class="stat-value altitude-highlight">125 <span class="unit">m</span></span>
    </div>

    <div class="stat-row">
        <span class="stat-label">최고 고도</span>
        <span class="stat-value altitude-highlight">45 <span class="unit">m</span></span>
    </div>

    <div class="stat-row">
        <span class="stat-label">시간</span>
        <span class="stat-value">00:49:12</span>
    </div>
</div>

</body>
</html>
