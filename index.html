<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.7 (Object Oriented)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; --warning: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-container { height: 25vh; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; top: 0; width: 100%; z-index: 1000; text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: rgba(0,0,0,0.7); font-weight: 800; }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 12px; }
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 15px; border: 1px solid #1f1f1f; display: flex; flex-direction: column; align-items: center; }
        .card-full { grid-column: span 2; border: 1px solid var(--primary); }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .value { font-size: 28px; font-weight: 900; }
        .value-large { font-size: 56px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { margin-top: auto; padding-bottom: 20px; }
        .btn-act { width: 100%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; background: var(--primary); color: #000; transition: 0.2s; }
        .btn-act.stop { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <div id="map-container">
        <div class="status-bar" id="gps-status">GPS STANDBY</div>
        <div id="map"></div>
    </div>

    <div class="main-content">
        <div class="dashboard">
            <div class="card card-full">
                <span class="label">Total Distance (Miles)</span>
                <span class="value-large" id="display-dist">0.00</span>
            </div>
            <div class="card">
                <span class="label">Time</span>
                <span class="value" id="display-time">00:00</span>
            </div>
            <div class="card">
                <span class="label">Pace (/mi)</span>
                <span class="value" id="display-pace">0'00"</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-act" id="main-btn">START RUN</button>
        </div>
    </div>

    <script>
        const OppaRunApp = {
            // State
            isRunning: false,
            seconds: 0,
            totalDistance: 0, // unit: miles
            path: [],
            lastCoord: null,
            
            // Elements & Objects
            timerInterval: null,
            watchId: null,
            map: null,
            polyline: null,

            init() {
                this.initMap();
                this.bindEvents();
                console.log("OppaRun Pro v28.7 Active");
            },

            initMap() {
                // 초기 위치: 애너하임 인근
                this.map = L.map('map', { zoomControl: false, attributionControl: false }).setView([33.83, -117.91], 15);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(this.map);
                this.polyline = L.polyline([], { color: '#00ff88', weight: 5 }).addTo(this.map);
            },

            bindEvents() {
                const btn = document.getElementById('main-btn');
                btn.onclick = () => this.isRunning ? this.stop() : this.start();
            },

            start() {
                this.isRunning = true;
                this.resetData();
                this.toggleUI(true);

                // 1. 타이머 시작
                this.timerInterval = setInterval(() => {
                    this.seconds++;
                    this.updateDashboard();
                }, 1000);

                // 2. GPS 추적 시작
                if ("geolocation" in navigator) {
                    this.watchId = navigator.geolocation.watchPosition(
                        (pos) => this.handleLocationUpdate(pos),
                        (err) => console.error("GPS Error:", err),
                        { enableHighAccuracy: true, distanceFilter: 5 }
                    );
                }
            },

            stop() {
                this.isRunning = false;
                this.toggleUI(false);
                clearInterval(this.timerInterval);
                if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
            },

            resetData() {
                this.seconds = 0;
                this.totalDistance = 0;
                this.path = [];
                this.lastCoord = null;
                this.polyline.setLatLngs([]);
            },

            handleLocationUpdate(pos) {
                const { latitude, longitude } = pos.coords;
                const currentCoord = [latitude, longitude];

                if (this.lastCoord) {
                    const dist = this.calculateDistance(
                        this.lastCoord[0], this.lastCoord[1], 
                        latitude, longitude
                    );
                    this.totalDistance += dist;
                }

                this.lastCoord = currentCoord;
                this.path.push(currentCoord);
                this.polyline.setLatLngs(this.path);
                this.map.panTo(currentCoord);
                this.updateDashboard();
            },

            // 하버사인 공식 (Miles 단위)
            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 3958.8; // 지구 반지름 (miles)
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            },

            updateDashboard() {
                // 시간 포맷
                const mins = Math.floor(this.seconds / 60);
                const secs = this.seconds % 60;
                document.getElementById('display-time').textContent = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                // 거리 포맷
                document.getElementById('display-dist').textContent = this.totalDistance.toFixed(2);

                // 페이스 계산 (min/mile)
                if (this.totalDistance > 0) {
                    const paceMin = (this.seconds / 60) / this.totalDistance;
                    const pM = Math.floor(paceMin);
                    const pS = Math.round((paceMin - pM) * 60);
                    document.getElementById('display-pace').textContent = `${pM}'${pS.toString().padStart(2, '0')}"`;
                }
            },

            toggleUI(active) {
                const btn = document.getElementById('main-btn');
                const status = document.getElementById('gps-status');
                if (active) {
                    btn.textContent = "STOP";
                    btn.classList.add('stop');
                    status.textContent = "TRACKING ACTIVE";
                    status.style.color = "#00ff88";
                } else {
                    btn.textContent = "START RUN";
                    btn.classList.remove('stop');
                    status.textContent = "RUN FINISHED";
                    status.style.color = "#ff4444";
                }
            }
        };

        window.onload = () => OppaRunApp.init();
    </script>
</body>
</html>
