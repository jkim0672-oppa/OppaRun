<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.8 (Stable Final)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 뷰 전환을 위한 절대 위치 해제 및 안정화 */
        #run-view, #history-view { width: 100%; height: 100%; display: flex; flex-direction: column; }
        #history-view { background: #000; display: none; }
        
        .history-list { padding: 10px; overflow-y: auto !important; flex: 1; padding-bottom: 80px; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; }
        .label { font-size: 10px; font-weight: 900; margin-bottom: 4px; color: #aaa; }
        .value { font-size: 24px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .controls { padding: 20px 15px; margin-top: auto; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; border: none; } 

        .history-item { background: #111; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 15px; }
        .h-dist { font-size: 28px; font-weight: 900; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 1px solid #222; padding-top: 12px; }
        .h-info { display: flex; flex-direction: column; }
        .h-info .lab { font-size: 8px; color: #888; font-weight: 900; }
        .h-info .val { font-size: 12px; font-weight: 800; }
        
        .btn-map-view { background: #222; color: var(--primary); border: 1px solid var(--primary); border-radius: 15px; font-size: 9px; padding: 4px 8px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        #full-map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        #full-map { width: 100%; height: calc(100% - 80px); }
        .close-map-btn { height: 80px; background: #111; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 900; }
    </style>
</head>
<body> 

<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">LOCATING...</div>
</div> 

<div class="main-content">
    <div id="run-view">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view">
        <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span>
            <span id="total-summary" style="font-size: 11px; color: #666;">0 Runs</span>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<div id="full-map-overlay">
    <div id="full-map"></div>
    <div class="close-map-btn" onclick="closeFullMap()">BACK</div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div> 

<script>
let map, marker, polyline, historyMap, historyLayer, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0, currentAltitude = 0;

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); } 
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(p => {
        const pos = [p.coords.latitude, p.coords.longitude];
        currentSpeedKmh = (p.coords.speed || 0) * 3.6;
        currentAltitude = p.coords.altitude || 0;
        marker.setLatLng(pos);
        if (isRunning && !isPaused && !isAutoPaused) {
            if (lastPos) {
                let d = map.distance(lastPos, pos) / 1000;
                if (d > 0.005) { totalDist += d; lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else lastPos = pos;
            document.getElementById('dist').textContent = totalDist.toFixed(2);
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
        if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "READY"; }
    }, null, {enableHighAccuracy: true});
    
    window.addEventListener('devicemotion', (e) => {
        if (!isRunning || isPaused || isAutoPaused) return;
        let a = e.accelerationIncludingGravity;
        let f = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
        if (f > 13 && (Date.now() - lastStepTime) > 220) {
            steps++; lastStepTime = Date.now();
            let gct = currentSpeedKmh > 1 ? Math.floor(450 - currentSpeedKmh * 10) : 0;
            gctSum += gct; dataCount++;
            document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
            const gEl = document.getElementById('gct');
            gEl.textContent = gct || "--";
            gEl.style.color = gct >= 300 ? "var(--danger)" : "var(--text-main)";
        }
    });
    loadHistory();
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='flex';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
    requestWakeLock(); vibrate(100);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display='none'; document.getElementById('after-stop').style.display='flex'; }
function onFinish() {
    const rec = { id: Date.now(), date: new Date().toLocaleString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, avgPace: document.getElementById('avgPace').textContent, alt: Math.round(currentAltitude), gct: dataCount?Math.round(gctSum/dataCount):0, path: pathCoords };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory')||"[]"); h.unshift(rec); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    isRunning = false; clearInterval(timer); showTab('history');
}
function onResume() { isPaused = false; document.getElementById('after-stop').style.display='none'; document.getElementById('btn-stop').style.display='flex'; }

function showTab(t) {
    document.getElementById('run-view').style.display = t==='run'?'flex':'none';
    document.getElementById('history-view').style.display = t==='history'?'flex':'none';
    document.getElementById('tab-run').className = 'tab-btn'+(t==='run'?' active':'');
    document.getElementById('tab-history').className = 'tab-btn'+(t==='history'?' active':'');
    if(t==='history') loadHistory();
}

function loadHistory() {
    let h = JSON.parse(localStorage.getItem('oppaRunHistory')||"[]");
    const list = document.getElementById('history-list');
    document.getElementById('total-summary').textContent = h.length + " Runs";
    list.innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main-stats"><span class="h-dist">${r.dist}KM</span></div>
            <div class="h-grid">
                <div class="h-info"><span class="lab">PACE</span><span class="val">${r.avgPace}</span></div>
                <div class="h-info"><span class="lab">ALT</span><span class="val">${r.alt}m</span></div>
                <div class="h-info"><span class="lab">GCT</span><span class="val">${r.gct}ms</span></div>
                <div class="h-info"><span class="val" style="color:var(--danger)" onclick="deleteRec(${r.id})">DEL</span></div>
            </div>
        </div>`).join('');
}
function deleteRec(id) { if(confirm('삭제할까요?')) { let h=JSON.parse(localStorage.getItem('oppaRunHistory')); h=h.filter(x=>x.id!==id); localStorage.setItem('oppaRunHistory',JSON.stringify(h)); loadHistory(); } }
window.onload = initMap;
</script>
</body>
</html>
