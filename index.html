<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OppaRun - Running Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
            --primary-color: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Main Content Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Running Tab Styles */
        #map {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-value.primary { color: var(--primary-color); }
        .stat-value.orange { color: var(--accent-orange); }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-start { background-color: var(--primary-color); color: #000; }
        .btn-stop { background-color: var(--accent-red); color: #fff; }

        /* History Tab Styles */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 15px;
            position: relative;
            overflow: hidden;
            /* 스와이프 시 터치 동작이 브라우저 기본 스크롤과 엉키지 않도록 설정 */
            touch-action: pan-y; 
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-time {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .action-btn.diag { color: #22c55e; border-color: #22c55e; }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .card-distance {
            font-size: 32px;
            font-weight: 800;
        }
        .card-distance span { font-size: 14px; color: var(--text-dim); font-weight: normal; margin-left: 4px; }

        .card-duration {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .card-alt {
            position: absolute;
            right: 15px;
            top: 55px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            border-top: 1px solid #2a2a2a;
            padding-top: 12px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
        }

        .grid-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .grid-value {
            font-size: 14px;
            font-weight: bold;
        }
        .grid-value.orange { color: var(--accent-orange); }
        .grid-value.green { color: var(--primary-color); }

        /* Diagnosis Modal Styles */
        .diag-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
        }
        .diag-screen.active { display: flex; }

        .diag-header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .diag-title { font-size: 20px; font-weight: bold; color: var(--primary-color); }
        .diag-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        .btn-close { background: var(--primary-color); color: #000; padding: 6px 14px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 12px;}

        .diag-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 40px;}
        .diag-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; }
        .diag-section-title { font-size: 11px; color: var(--primary-color); font-weight: bold; margin-bottom: 8px; text-transform: uppercase;}
        .diag-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .diag-value-big { font-size: 24px; font-weight: 800; }
        .diag-ref { font-size: 11px; color: var(--accent-orange); font-weight: bold; }
        .diag-desc { font-size: 13px; color: #dddddd; line-height: 1.5; border-top: 1px solid #2a2a2a; padding-top: 10px; }
        .diag-omitted { color: var(--accent-red); font-size: 18px; font-weight: bold; text-align: center; padding: 10px 0; }

        /* Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background-color: rgba(34, 197, 94, 0.05);
        }

        /* ==========================================================================
           [새로 추가됨] 앱 감성 다크모드 커스텀 삭제 확인 모달 스타일
           ========================================================================== */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }

        .custom-modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .custom-modal-msg {
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .custom-modal-btns {
            display: flex;
            gap: 12px;
        }

        .custom-modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-btn-confirm {
            background: var(--primary-color);
            color: #000000;
        }

        .modal-btn-cancel {
            background: #2a2a2a;
            color: var(--text-dim);
            border: 1px solid var(--border-color) !important;
        }
    </style>
</head>
<body>

    <header>
        <span id="header-title">OppaRun</span>
    </header>

    <main>
        <div id="running-tab" class="tab-content active">
            <div id="map"></div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value primary"><span id="display-distance">0.00</span> KM</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Duration</div>
                    <div class="stat-value primary" id="display-duration">00:00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pace</div>
                    <div class="stat-value orange" id="display-pace">--'-- "</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cadence</div>
                    <div class="stat-value orange" id="display-cadence">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">GCT</div>
                    <div class="stat-value" id="display-gct">0 <span style="font-size:12px;color:var(--text-dim)">MS</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Flight Time</div>
                    <div class="stat-value" id="display-flight">0 <span style="font-size:12px;color:var(--text-dim)">%</span></div>
                </div>
            </div>
            <div class="controls">
                <button id="start-btn" class="btn btn-start">START</button>
                <button id="stop-btn" class="btn btn-stop" style="display: none;">STOP</button>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div class="history-list" id="history-list">
                </div>
        </div>
    </main>

    <div id="diagScreen" class="diag-screen">
        <div class="diag-header">
            <div>
                <div class="diag-title">러닝 정밀 진단</div>
                <div class="diag-date" id="diagDate">5/15/2026, 7:26:00 PM</div>
            </div>
            <button class="btn-close" onclick="closeDiag()">CLOSE</button>
        </div>
        <div class="diag-body" id="diagBody">
            </div>
    </div>

    <div id="deleteModal" class="custom-modal-overlay" style="display: none;">
        <div class="custom-modal-box">
            <p class="custom-modal-msg">이 러닝 기록을 삭제할까요?</p>
            <div class="custom-modal-btns">
                <button id="modalConfirmBtn" class="modal-btn-confirm">예</button>
                <button id="modalCancelBtn" class="modal-btn-cancel">아니오</button>
            </div>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchTab('running')">러닝</button>
        <button class="nav-item" onclick="switchTab('history')">기록</button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Global variables and state
        let map, routeLine;
        let isRunning = false;
        let startTime, timerInterval;
        let distance = 0.0;
        let positions = [];
        let records = JSON.parse(localStorage.getItem('runningRecords')) || [];

        // Simulated sensor variables for tracking realistic metrics change
        let cadenceInterval;
        let currentCadence = 0;
        let currentGct = 0;
        let currentFlight = 0;

        // Initialize App
        window.onload = function() {
            initMap();
            displayRecords();
        };

        function initMap() {
            // Default center at 0,0 initialized, updated when location fetched
            map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            routeLine = L.polyline([], {color: '#22c55e', weight: 5}).addTo(map);

            // Attempt to get initial current position to center map
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 16);
                }, () => {});
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'running') {
                document.querySelector('nav .nav-item:nth-child(1)').classList.add('active');
                document.getElementById('running-tab').classList.add('active');
                if (map) setTimeout(() => map.invalidateSize(), 200);
            } else {
                document.querySelector('nav .nav-item:nth-child(2)').classList.add('active');
                document.getElementById('history-tab').classList.add('active');
                displayRecords();
            }
        }

        // Running Simulation Logic
        document.getElementById('start-btn').addEventListener('click', startRunning);
        document.getElementById('stop-btn').addEventListener('click', stopRunning);

        function startRunning() {
            isRunning = true;
            startTime = new Date();
            distance = 0.0;
            positions = [];
            routeLine.setLatLngs([]);

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';

            // Reset dashboard layout UI metrics
            document.getElementById('display-distance').innerText = '0.00';
            document.getElementById('display-duration').innerText = '00:00';
            document.getElementById('display-pace').innerText = `--'-- "`;

            timerInterval = setInterval(updateTimer, 1000);
            startSensorSimulation();
            
            // Track location mock/real
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    positions.push([lat, lng]);
                    map.setView([lat, lng], 17);
                });
            }
        }

        function updateTimer() {
            const now = new Date();
            const diff = new Date(now - startTime);
            const mins = String(diff.getUTCMinutes()).padStart(2, '0');
            const secs = String(diff.getUTCSeconds()).padStart(2, '0');
            document.getElementById('display-duration').innerText = `${mins}:${secs}`;

            // Increment subtle distance mock for testing room metrics
            if (Math.random() > 0.4) {
                distance += 0.01;
                document.getElementById('display-distance').innerText = distance.toFixed(2);
                
                // Update map track line seamlessly if base point exists
                if (positions.length > 0) {
                    const lastPos = positions[positions.length - 1];
                    // simulate minute fractional deviation
                    const nextLat = lastPos[0] + (Math.random() - 0.5) * 0.0001;
                    const nextLng = lastPos[1] + (Math.random() - 0.5) * 0.0001;
                    positions.push([nextLat, nextLng]);
                    routeLine.setLatLngs(positions);
                    map.panTo([nextLat, nextLng]);
                }
            }

            // Calculate active rolling pace
            const totalSeconds = Math.floor((now - startTime) / 1000);
            if (distance > 0 && totalSeconds > 0) {
                const pacePerKm = totalSeconds / distance; // seconds per km
                const paceMins = Math.floor(pacePerKm / 60);
                const paceSecs = Math.floor(pacePerKm % 60);
                if (paceMins < 60) {
                    document.getElementById('display-pace').innerText = `${paceMins}'${String(paceSecs).padStart(2, '0')}"`;
                }
            }
        }

        function startSensorSimulation() {
            cadenceInterval = setInterval(() => {
                // Mimic active runner metrics or testing room bouncing values
                currentCadence = Math.floor(Math.random() * (185 - 165 + 1)) + 165; 
                currentGct = Math.floor(Math.random() * (220 - 105 + 1)) + 105;
                currentFlight = Math.floor(Math.random() * (62 - 45 + 1)) + 45;

                document.getElementById('display-cadence').innerText = currentCadence;
                document.getElementById('display-gct').innerHTML = `${currentGct} <span style="font-size:12px;color:var(--text-dim)">MS</span>`;
                document.getElementById('display-flight').innerHTML = `${currentFlight} <span style="font-size:12px;color:var(--text-dim)">%</span>`;
            }, 1000);
        }

        function stopRunning() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            clearInterval(cadenceInterval);

            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';

            const endTime = new Date();
            const totalTimeStr = document.getElementById('display-duration').innerText;
            const finalPaceStr = document.getElementById('display-pace').innerText;

            // Compute final snapshot metrics summary averages
            const newRecord = {
                timestamp: endTime.toLocaleString('en-US'),
                distance: distance.toFixed(2),
                duration: totalTimeStr,
                pace: finalPaceStr,
                cadence: currentCadence || 172,
                gct: currentGct || 135,
                flight: currentFlight || 55,
                alt: -17 // standard floor baseline
            };

            records.unshift(newRecord);
            localStorage.setItem('runningRecords', JSON.stringify(records));
            
            // Auto switch over onto history compilation list
            switchTab('history');
        }

        // ==========================================================================
        // [수정됨] 스와이프 이벤트를 적용하여 내장한 리스트 출력 함수
        // ==========================================================================
        function displayRecords() {
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '';

            if (records.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center;color:var(--text-dim);margin-top:40px;font-size:14px;">저장된 러닝 기록이 없습니다.</div>`;
                return;
            }

            records.forEach((rec, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // 터치 좌표 변수 할당 (각 카드 스코프 내에서 독립 관리)
                let touchStartX = 0;
                let touchEndX = 0;

                // 스와이프 터치 이벤트 리스너 심기
                card.addEventListener('touchstart', function(e) {
                    touchStartX = e.touches[0].clientX;
                }, { passive: true });

                card.addEventListener('touchmove', function(e) {
                    touchEndX = e.touches[0].clientX;
                }, { passive: true });

                card.addEventListener('touchend', function(e) {
                    // 오른쪽으로 80px 이상 밀었을 때 커스텀 모달 팝업 호출
                    if (touchEndX - touchStartX > 80) {
                        openDeleteModal(index);
                    }
                    // 좌표 리셋
                    touchStartX = 0;
                    touchEndX = 0;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-time">${rec.timestamp}</span>
                        <div class="card-actions">
                            <button class="action-btn">경로</button>
                            <button class="action-btn diag" onclick="event.stopPropagation(); openDiag(${index})">진단</button>
                        </div>
                    </div>
                    <div class="card-main">
                        <div class="card-distance">${rec.distance}<span>KM</span></div>
                        <div class="card-duration">${rec.duration}</div>
                    </div>
                    <div class="card-alt">ALT: ${rec.alt}m</div>
                    <div class="card-grid">
                        <div class="grid-item">
                            <span class="grid-label">페이스</span>
                            <span class="grid-value">${rec.pace}</span>
                        </div>
                        <div class="grid-item">
                            <span class="grid-label">케이던스</span>
                            <span class="grid-value orange">${rec.cadence}</span>
                        </div>
                        <div class="grid-item">
                            <span class="grid-label">칼로리</span>
                            <span class="grid-value">7</span>
                        </div>
                        <div class="grid-item">
                            <span class="grid-label">지면접촉</span>
                            <span class="grid-value green">${rec.gct} MS</span>
                        </div>
                        <div class="grid-item">
                            <span class="grid-label">체공시간</span>
                            <span class="grid-value green">${rec.flight} %</span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // ==========================================================================
        // [새로 추가됨] 삭제 처리용 변수 및 모달 핸들러 함수들
        // ==========================================================================
        let activeDeleteIndex = null;

        function openDeleteModal(index) {
            activeDeleteIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            activeDeleteIndex = null;
        }

        // 모달 '예' 버튼 클릭 리스너
        document.getElementById('modalConfirmBtn').addEventListener('click', function() {
            if (activeDeleteIndex !== null) {
                // 배열에서 해당 인덱스 원본 삭제
                records.splice(activeDeleteIndex, 1);
                // 로컬스토리지 동기화
                localStorage.setItem('runningRecords', JSON.stringify(records));
                // 리스트 재출력
                displayRecords();
                // 모달 닫기
                closeDeleteModal();
            }
        });

        // 모달 '아니오' 버튼 클릭 리스너
        document.getElementById('modalCancelBtn').addEventListener('click', closeDeleteModal);


        // Diagnostic Logic
        function openDiag(index) {
            const rec = records[index];
            document.getElementById('diagDate').innerText = rec.timestamp;
            
            const body = document.getElementById('diagBody');
            body.innerHTML = '';

            // [원본 사수] 100미터 이상 조건식 검증 로직 적용
            const distanceNum = parseFloat(rec.distance);
            if (distanceNum < 0.1) {
                // Metrics analysis sections built gracefully
                body.innerHTML = `
                    <div class="diag-card">
                        <div class="diag-section-title">러닝 다이내믹스 분석</div>
                        <div class="diag-row">
                            <span class="diag-value-big">GCT: ${rec.gct}ms</span>
                            <span class="diag-ref">Ref: &lt; 240ms</span>
                        </div>
                        <p class="diag-desc">매우 뛰어난 탄력성입니다. 골반 회전과 수평 가속이 유기적으로 이루어지고 있습니다.</p>
                    </div>
                    <div class="diag-card">
                        <div class="diag-section-title">페이스 & 케이던스 밸런스</div>
                        <div class="diag-row">
                            <span class="diag-value-big">${rec.cadence} SPM</span>
                            <span class="diag-ref">Ref: 175~185</span>
                        </div>
                        ${getCadenceDesc(rec.cadence)}
                    </div>
                    <div class="diag-card">
                        <div class="diag-section-title">부상 방지 및 리커버리</div>
                        <div class="diag-omitted">DIAGNOSIS OMITTED</div>
                    </div>
                `;
            } else {
                body.innerHTML = `
                    <div class="diag-card">
                        <div class="diag-section-title">러닝 다이내믹스 분석</div>
                        <div class="diag-row">
                            <span class="diag-value-big">GCT: ${rec.gct}ms</span>
                            <span class="diag-ref">Ref: &lt; 240ms</span>
                        </div>
                        <p class="diag-desc">매우 뛰어난 탄력성입니다. 골반 회전과 수평 가속이 유기적으로 이루어지고 있습니다.</p>
                    </div>
                    <div class="diag-card">
                        <div class="diag-section-title">페이스 & 케이던스 밸런스</div>
                        <div class="diag-row">
                            <span class="diag-value-big">${rec.cadence} SPM</span>
                            <span class="diag-ref">Ref: 175~185</span>
                        </div>
                        ${getCadenceDesc(rec.cadence)}
                    </div>
                    <div class="diag-card">
                        <div class="diag-section-title">부상 방지 및 리커버리</div>
                        <div class="diag-row">
                            <span class="diag-value-big" style="color:var(--primary-color)">12 Hours</span>
                        </div>
                        <p class="diag-desc">충분한 회복 속도입니다. 다음 세션 전 가벼운 스트레칭을 권장합니다.</p>
                    </div>
                `;
            }

            document.getElementById('diagScreen').classList.add('active');
        }

        function getCadenceDesc(cadence) {
            if (cadence >= 175 && cadence <= 185) {
                return `<p class="diag-desc">이상적인 보폭 빈도입니다. 관절 부하를 최소화하는 안정적인 리듬을 유지하고 있습니다.</p>`;
            } else {
                return `<p class="diag-desc">케이던스가 다소 낮아 충격량이 증가할 수 있습니다. 피치를 좁히고 메트로놈 리듬에 맞추어 보폭 효율을 높여 보세요.</p>`;
            }
        }

        function closeDiag() {
            document.getElementById('diagScreen').classList.remove('active');
        }
    </script>
</body>
</html>
