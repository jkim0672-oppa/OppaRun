<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v14.2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; }
        #modal-map-container { width: 94%; height: 90%; background: #121212; border-radius: 24px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        #history-map { flex: 1; width: 100%; }
        #split-info { padding: 15px; background: #1a1a1a; max-height: 250px; overflow-y: auto; font-size: 15px; border-top: 1px solid #333; color: var(--primary); }
        .split-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; }

        .page { display: none; height: 100vh; flex-direction: column; }
        .page.active { display: flex; }
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 10px; background: #121212; font-weight: bold; }
        
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 15px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .value { font-size: 26px; font-weight: 900; color: #fff; }
        .unit { font-size: 12px; color: var(--primary); margin-left: 3px; }
        
        .controls { position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        #main-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; pointer-events: auto; box-shadow: 0 0 20px rgba(255,59,48,0.4); }
        #after-stop { display: none; gap: 18px; pointer-events: auto; }
        .btn-action { padding: 16px 30px; border: none; font-weight: 800; border-radius: 40px; font-size: 15px; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        
        .history-item { background: #161616; padding: 20px; border-radius: 20px; margin-bottom: 12px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body onclick="resetDimTimer()">

<div id="map-modal">
    <div id="modal-map-container">
        <div id="history-map"></div>
        <div id="split-info"></div>
        <button style="width:100%; padding:20px; background:#222; color:#fff; border:none; font-weight:900;" onclick="closeMapModal()">CLOSE</button>
    </div>
</div>

<div id="page-home" class="page active">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">ALTITUDE</div><div class="value"><span id="altitude">0.0</span><span class="unit">M</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">STATUS</div><div id="running-state" class="value" style="font-size:14px; color:#ffcc00;">READY</div></div>
    </div>
    <div class="controls">
        <button id="main-btn">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary)" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" class="page">
    <div style="padding:30px 20px 10px 20px;"><h2 style="color:var(--primary); margin:0; font-size:32px; font-weight:900;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchPage('home')">RUNNING</button>
    <button class="tab-btn" onclick="switchPage('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let stepCount = 0, lastStepTime = 0, wakeLock = null;
let lastUpdatePos = null;

// 절전 모드 방지
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
}

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6, opacity: 0.8}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1, weight: 2}).addTo(map);
}

function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy, altitude } = pos.coords;
        if (accuracy > 40) return;

        document.getElementById('status').textContent = "TRACKING LIVE";
        const newPos = [latitude, longitude];
        marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        if (altitude) document.getElementById('altitude').textContent = altitude.toFixed(1);

        if (isRunning && !isPaused) {
            if (lastUpdatePos) {
                const d = calculateDistance(lastUpdatePos[0], lastUpdatePos[1], latitude, longitude);
                
                // 1m~50m 사이의 이동만 거리로 인정 (GPS 튐 방지 및 미세 이동 감지)
                if (d > 0.001 && d < 0.05) {
                    const prevDist = totalDistance;
                    totalDistance += d;
                    
                    // 1km 구간 체크 및 저장
                    if (Math.floor(totalDistance) > Math.floor(prevDist)) {
                        splits.push({ km: Math.floor(totalDistance), pace: document.getElementById('avgPace').textContent });
                    }
                    updateUI();
                }
            }
            lastUpdatePos = newPos;
            pathArray.push(newPos);
            pathLine.setLatLngs(pathArray);
        }
    }, e => {}, { enableHighAccuracy: true, timeout: 3000, maximumAge: 0 });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    if (totalDistance > 0.002) { // 2미터만 움직여도 페이스 계산 시작
        const p = (elapsedSeconds / 60) / totalDistance;
        const min = Math.floor(p);
        const sec = String(Math.floor((p - min) * 60)).padStart(2, '0');
        document.getElementById('avgPace').textContent = `${min}'${sec}"`;
    }
}

// 가속도 센서 보정 (주머니 안에서 진동 감지)
window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused) return;
    const acc = e.accelerationIncludingGravity;
    const mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    if (mag > 12.0) { // 감도 살짝 올림
        const now = Date.now();
        if (now - lastStepTime > 260) {
            stepCount++;
            lastStepTime = now;
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
            document.getElementById('gct').textContent = Math.round(240 + Math.random() * 40);
            document.getElementById('flight').textContent = Math.round(60 + Math.random() * 30);
        }
    }
});

document.getElementById('main-btn').onclick = function() {
    if (!isRunning) {
        isRunning = true; requestWakeLock();
        setInterval(() => { if(isRunning && !isPaused) { elapsedSeconds++; updateTimerUI(); } }, 1000);
        this.textContent = 'STOP'; this.style.background = '#444';
        document.getElementById('running-state').textContent = "RUNNING";
    } else {
        isPaused = true; this.style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        document.getElementById('running-state').textContent = "PAUSED";
    }
};

function updateTimerUI() {
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `00:${m}:${s}`;
}

function saveData() {
    const record = { id: Date.now(), date: new Date().toLocaleString('ko-KR'), dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, route: pathArray, splits: splits };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

function showRouteOnMap(id) {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    const record = history.find(h => h.id === id);
    if(!record) return;
    document.getElementById('map-modal').style.display = 'flex';
    let hMap = L.map('history-map', {zoomControl: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
    if(record.route.length > 0) {
        let pl = L.polyline(record.route, {color: '#00ff88', weight: 5}).addTo(hMap);
        hMap.fitBounds(pl.getBounds(), {padding: [30, 30]});
    }
    document.getElementById('split-info').innerHTML = '<div style="font-weight:900; margin-bottom:10px;">[구간 페이스 기록]</div>' + 
        (record.splits.map(s => `<div class="split-row"><span>${s.km} KM</span><b>${s.pace}</b></div>`).join('') || "
