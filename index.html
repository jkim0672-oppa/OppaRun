<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.60 (Expert Diagnosis)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* Layout */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 20vh; min-height: 150px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard Cards */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Controls */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* History & Tabs */
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 13px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
        .h-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; }

        /* Full Screen Views (Detail & Diagnosis) */
        #diag-view, #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .close-btn { position: sticky; top: 20px; left: 20px; z-index: 6000; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; margin-bottom: 20px; width: fit-content; }
        
        /* Diagnosis Card Style */
        .diag-header { padding: 40px 20px 10px; }
        .diag-card { background: #1a1a1a; border-radius: 15px; padding: 20px; margin: 10px 15px; border-left: 4px solid var(--primary); }
        .diag-label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .diag-val-group { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .diag-main-val { font-size: 22px; font-weight: 900; color: #fff; }
        .diag-ref { font-size: 11px; color: var(--primary); font-weight: 700; }
        .diag-tip { font-size: 12px; color: #aaa; line-height: 1.5; font-weight: 600; padding-top: 10px; border-top: 1px solid #333; word-break: keep-all; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <!-- Full Screen Diagnosis View -->
    <div id="diag-view">
        <div style="padding: 20px;"><button class="close-btn" onclick="ui.closeDiag()">CLOSE</button></div>
        <div id="diag-content-area"></div>
    </div>

    <!-- Full Screen Detail View -->
    <div id="detail-view">
        <div style="padding: 20px;"><button class="close-btn" onclick="ui.closeDetail()">CLOSE</button></div>
        <div id="detail-map" style="height: 300px; width: 100%; border-bottom: 1px solid #222;"></div>
        <div id="detail-data" style="padding: 20px;"></div>
    </div>

    <!-- RUN Tab Content -->
    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <!-- HISTORY Tab Content -->
    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container" style="padding:20px;"></div></div>
        <div id="sub-page-info" class="sub-page" style="padding:15px; gap:10px;">
            <div class="diag-card"><div class="diag-label">CADENCE</div><div class="diag-tip">Recommended 170~185 BPM. High cadence reduces knee impact.</div></div>
            <div class="diag-card"><div class="diag-label">GCT</div><div class="diag-tip">Short contact time (< 240ms) prevents plantar fasciitis.</div></div>
        </div>
    </div> 

    <!-- Tab Bar -->
    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, accCircle, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let detailMap = null;

const storage = {
    key: 'oppaRunHistory',
    saveRecord: (r) => { let h = storage.loadHistory(); h.unshift(r); localStorage.setItem(storage.key, JSON.stringify(h)); },
    loadHistory: () => JSON.parse(localStorage.getItem(storage.key) || "[]")
};

const control = {
    formatPace: (kmh) => { 
        if (!kmh || kmh < 0.5) return "--'--\""; 
        let s = 3600 / kmh; 
        return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; 
    },
    // 핵심 로직: 1-5번 진단 데이터 산출
    runExpertDiagnosis: (id) => {
        const h = storage.loadHistory();
        const r = h.find(item => item.id === id);
        if (!r) return null;

        // 1. 케이던스 분석
        const cad = parseInt(r.cadence) || 0;
        let cadTip = cad < 170 ? "보폭을 조금 줄이고 피치를 높여보세요. 케이던스가 높아지면 무릎 부하가 크게 감소합니다." : "훌륭한 리듬입니다! 부상 위험이 적고 효율적인 달리기를 하고 계시네요.";

        // 2. 지면 접촉 시간 (GCT) 분석
        const gct = parseInt(r.gct) || 0;
        let gctTip = gct > 240 ? "발이 지면에 머무는 시간이 깁니다. 지면을 밀어낼 때 조금 더 탄력을 활용하면 족저 부하를 줄일 수 있습니다." : "탄력이 매우 좋습니다! 발이 지면에 닿는 시간이 짧아 에너지 손실이 적습니다.";

        // 3. 체공 시간 (Flight Time) 분석
        const flt = parseInt(r.flight) || 0;
        let fltTip = flt < 30 ? "체공 시간을 조금 더 확보하면 탄력적인 롤링이 가능해집니다. 고관절을 더 활용해보세요." : "공중에 머무는 시간이 안정적입니다. 효율적인 스트라이드 롤링이 이루어지고 있습니다.";

        // 4. 훈련 부하량 (Training Load) - 페이스와 거리 기반
        const dist = parseFloat(r.dist) || 0;
        const paceVal = parseFloat(r.pace.split("'")[0]) + (parseFloat(r.pace.split("'")[1])/60);
        let loadScore = (dist * (12 / paceVal)).toFixed(1);
        let loadLevel = loadScore > 15 ? "높음 (Hard)" : (loadScore > 7 ? "보통 (Moderate)" : "낮음 (Low)");

        // 5. 권장 회복 시간
        let recTime = loadScore > 15 ? 48 : (loadScore > 7 ? 24 : 12);

        return { r, cad, cadTip, gct, gctTip, flt, fltTip, loadScore, loadLevel, recTime };
    }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
        if(sub === 'total') ui.updateTotalStats();
    },
    updateHistoryList: () => {
        const h = storage.loadHistory();
        const listDiv = document.getElementById('history-list');
        if (h.length === 0) { listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">NO RECORDS</div>'; return; }
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-actions">
                    <button class="btn-h-sub" onclick="ui.openDetail(${r.id})">ROUTE</button>
                    <button class="btn-h-sub" onclick="ui.openDiag(${r.id})">DIAG</button>
                </div>
                <div style="font-size:18px; font-weight:900;">${r.dist}KM <span style="color:var(--primary);">${r.time}</span></div>
                <div style="display:flex; gap:15px; margin-top:10px; font-size:11px; color:#aaa;">
                    <span>PACE: ${r.pace}</span> <span>CAD: ${r.cadence}</span>
                </div>
            </div>`).join('');
    },
    updateTotalStats: () => {
        const h = storage.loadHistory();
        let tDist = 0; h.forEach(r => tDist += parseFloat(r.dist));
        document.getElementById('total-stats-container').innerHTML = `<div class="card" style="width:100%;"><div class="label">TOTAL DISTANCE</div><div class="value">${tDist.toFixed(1)} KM</div></div>`;
    },
    openDiag: (id) => {
        const d = control.runExpertDiagnosis(id); if (!d) return;
        document.getElementById('diag-view').style.display = 'flex';
        document.getElementById('diag-content-area').innerHTML = `
            <div class="diag-header"><div style="font-size:24px; font-weight:900; color:var(--primary);">정밀 러닝 진단</div></div>
            <div class="diag-card"><div class="diag-label">1. 케이던스 (Cadence)</div><div class="diag-val-group"><span class="diag-main-val">${d.cad} BPM</span><span class="diag-ref">권장: 170~185</span></div><div class="diag-tip">${d.cadTip}</div></div>
            <div class="diag-card"><div class="diag-label">2. 지면 접촉 시간 (GCT)</div><div class="diag-val-group"><span class="diag-main-val">${d.gct} MS</span><span class="diag-ref">권장: < 240</span></div><div class="diag-tip">${d.gctTip}</div></div>
            <div class="diag-card"><div class="diag-label">3. 체공 시간 (Flight Ratio)</div><div class="diag-val-group"><span class="diag-main-val">${d.flt}%</span><span class="diag-ref">권장: > 30%</span></div><div class="diag-tip">${d.fltTip}</div></div>
            <div class="diag-card" style="border-left-color:var(--warning);"><div class="diag-label">4. 훈련 부하량 (Training Load)</div><div class="diag-val-group"><span class="diag-main-val">${d.loadScore} pts</span><span class="diag-ref">수준: ${d.loadLevel}</span></div><div class="diag-tip">이번 러닝이 심폐 기능과 근육에 가한 전반적인 스트레스 수치입니다.</div></div>
            <div class="diag-card" style="border-left-color:var(--danger);"><div class="diag-label">5. 권장 회복 시간</div><div class="diag-val-group"><span class="diag-main-val">${d.recTime} HOURS</span></div><div class="diag-tip">최적의 컨디션을 위해 다음 고강도 훈련까지 필요한 최소한의 휴식 권장 시간입니다.</div></div>
            <div style="height:100px;"></div>`;
    },
    closeDiag: () => document.getElementById('diag-view').style.display = 'none',
    openDetail: (id) => {
        const h = storage.loadHistory(); const r = h.find(i => i.id === id); if (!r) return;
        document.getElementById('detail-view').style.display = 'flex';
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (r.path && r.path.length > 0) {
            let poly = L.polyline(r.path, {color: '#00ff88', weight: 5}).addTo(detailMap);
            detailMap.fitBounds(poly.getBounds());
        }
        document.getElementById('detail-data').innerHTML = `<h3>${r.date}</h3><p>Distance: ${r.dist}KM</p><p>Pace: ${r.pace}</p>`;
    },
    closeDetail: () => document.getElementById('detail-view').style.display = 'none'
};

// --- GPS & Motion Logic ---
function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6; 
    marker.setLatLng(pos);
    if (isRunning && !isPaused && p.coords.accuracy < 50) {
        if (lastPos) {
            let d = map.distance(lastPos, pos) / 1000;
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else lastPos = pos;
        document.getElementById('curPace').textContent = control.formatPace(currentSpeedKmh);
        if (totalDist > 0 && seconds > 0) document.getElementById('avgPace').textContent = control.formatPace(totalDist / (seconds / 3600));
    }
    map.panTo(pos);
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        if(currentSpeedKmh > 2) {
            document.getElementById('gct').textContent = Math.floor(260 - (currentSpeedKmh * 5));
            document.getElementById('flight').textContent = Math.floor(15 + (currentSpeedKmh * 1.5));
        }
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: document.getElementById('dist').textContent, time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: document.getElementById('cadence').textContent, gct: document.getElementById('gct').textContent, flight: document.getElementById('flight').textContent, path: pathCoords };
    storage.saveRecord(record); location.reload();
}

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5, 127], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([37.5, 127]).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
};
</script>
</body>
</html>
