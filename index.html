<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.5 (Bug Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --good: #00ff88;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 그리드 최적화 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 5px; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 95px; position: relative; margin-bottom: 4px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-top: auto; margin-bottom: 90px; }
        .btn-act { width: 100%; height: 64px; border-radius: 32px; border: none; font-weight: 900; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,136,0.2); }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        /* Stats Styles */
        .stats-filter-nav { display: flex; justify-content: center; gap: 10px; padding: 15px 0; }
        .filter-chip { padding: 8px 18px; border-radius: 20px; background: #222; color: #777; font-size: 12px; font-weight: 900; border: 1px solid #333; }
        .filter-chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 8px 12px; border: 1px solid #333; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
        .h-stats { display: flex; gap: 20px; align-items: baseline; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }

        /* Settings Dropdown */
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px;"> KM</small></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        
        <div id="sub-page-total" class="sub-page">
            <div class="stats-filter-nav">
                <div id="filter-all" class="filter-chip active" onclick="ui.setStatsFilter('all')">ALL</div>
                <div id="filter-month" class="filter-chip" onclick="ui.setStatsFilter('month')">MONTH</div>
                <div id="filter-week" class="filter-chip" onclick="ui.setStatsFilter('week')">WEEK</div>
            </div>
            <div id="total-stats-container" style="padding: 0 12px;"></div>
        </div>

        <div id="sub-page-settings" class="sub-page" style="padding: 20px;">
            <div class="dropdown-select" onclick="storage.clearHistory()">
                <span style="color:var(--danger)">CLEAR ALL HISTORY</span>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
class RunningStorage {
    constructor() { this.KEY = 'oppaRunHistory'; }
    loadHistory() { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
    saveRecord(record) {
        const h = this.loadHistory();
        h.unshift(record);
        localStorage.setItem(this.KEY, JSON.stringify(h));
    }
    clearHistory() { if(confirm("Delete all?")) { localStorage.removeItem(this.KEY); location.reload(); } }
}

class UIManager {
    constructor() {
        this.statsFilter = 'all';
    }
    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') this.updateHistoryList();
    }
    showSubTab(sub) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
        if(sub === 'total') this.updateTotalStats();
    }
    setStatsFilter(f) {
        this.statsFilter = f;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        document.getElementById('filter-' + f).classList.add('active');
        this.updateTotalStats();
    }
    updateTotalStats() {
        const h = storage.loadHistory();
        const now = new Date();
        
        let filtered = h.filter(r => {
            const rDate = new Date(r.id);
            if (this.statsFilter === 'week') return (now - rDate) < 7 * 24 * 60 * 60 * 1000;
            if (this.statsFilter === 'month') return rDate.getMonth() === now.getMonth() && rDate.getFullYear() === now.getFullYear();
            return true;
        });

        // 버그 수정 포인트: Number()로 강제 형변환하여 문자열 나열 방지
        let totalDist = 0;
        filtered.forEach(r => { totalDist += Number(r.dist || 0); });

        document.getElementById('total-stats-container').innerHTML = `
            <div class="card card-main" style="height:auto; padding: 25px 0; margin-bottom: 12px;">
                <div class="label">${this.statsFilter.toUpperCase()} DIST</div>
                <div class="value-large">${totalDist.toFixed(2)} KM</div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="card"><div class="label">RUNS</div><div class="value">${filtered.length}</div></div>
                <div class="card"><div class="label">AVG KM</div><div class="value">${filtered.length ? (totalDist/filtered.length).toFixed(2) : '0.00'}</div></div>
            </div>
        `;
    }
    updateHistoryList() {
        const h = storage.loadHistory();
        document.getElementById('history-list').innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-stats">
                    <div class="value">${r.dist}<small style="font-size:10px; color:var(--primary)"> KM</small></div>
                    <div class="value" style="color:var(--primary)">${r.time}</div>
                </div>
            </div>`).join('');
    }
}

const storage = new RunningStorage();
const ui = new UIManager();
const app = {
    onStart() { alert("GPS Tracking Started (Demo)"); },
    init() {
        const map = L.map('map', {zoomControl: false}).setView([37.5, 127], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }
};

window.onload = () => { app.init(); };
</script>
</body>
</html>
