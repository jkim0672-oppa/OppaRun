<!DOCTYPE html>
<html>
<head>
    <title>OppaRun v13.6 - Stable Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; }
        #dim-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: none; pointer-events: auto; justify-content: center; align-items: center; }
        #dim-overlay.active { display: flex; }
        .page { display: none; height: 100vh; flex-direction: column; }
        .page.active { display: flex; }
        #map, #detail-map { height: 40vh; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #121212; font-weight: bold; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 800; margin-top: 4px; }
        .unit { font-size: 12px; color: var(--primary); }
        .controls { position: absolute; bottom: 95px; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        #main-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; pointer-events: auto; }
        #after-stop { display: none; gap: 20px; pointer-events: auto; }
        .btn-action { padding: 16px 30px; border: none; font-weight: 800; border-radius: 40px; font-size: 15px; }
        .btn-resume { background: var(--primary); color: #000; }
        .btn-finish { background: var(--danger); color: #fff; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: bold; }
        .tab-btn.active { color: var(--primary); }
        .history-card { background: var(--card-bg); padding: 18px; border-radius: 16px; margin-bottom: 12px; border-left: 5px solid var(--primary); }
        #detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; flex-direction: column; }
    </style>
</head>
<body onclick="resetDimTimer()">

<div id="dim-overlay" onclick="resetDimTimer()">
    <div style="text-align:center;">
        <div style="color:var(--primary); font-size:45px; font-weight:900;" id="dim-dist">0.00</div>
        <div id="dim-status" style="color:#ffcc00; font-size:16px; font-weight:bold; margin-top:5px;"></div>
        <div style="color:#888; font-size:14px; margin-top:10px;">TAP TO WAKE UP</div>
    </div>
</div>

<div id="detail-modal">
    <div id="detail-map"></div>
    <div style="padding:20px;">
        <h2 id="det-date" style="color:var(--primary); margin-bottom:10px;"></h2>
        <div id="det-info" style="color:#fff; font-size:18px; margin-bottom:20px;"></div>
        <button onclick="closeDetail()" style="width:100%; padding:15px; background:#222; color:#fff; border:none; border-radius:10px;">BACK</button>
    </div>
</div>

<div id="page-home" class="page active">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">0</span><span class="unit">MS</span></div></div>
    </div>
    <div class="controls">
        <button id="main-btn">START</button>
        <div id="after-stop">
            <button class="btn-action btn-resume" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action btn-finish" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" class="page">
    <div style="padding:20px; border-bottom:1px solid #222;"><h2 style="color:var(--primary); margin:0;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="switchPage('home')">RUNNING</button>
    <button class="tab-btn" onclick="switchPage('history')">HISTORY</button>
</div>

<script>
let map, detailMap, marker, pathLine, detailPathLine, pathArray = [];
let totalDistance = 0, isRunning = false, isPaused = false, isAutoPaused = false, elapsedSeconds = 0;
let watchId, timerInterval, wakeLock = null, dimTimer;

async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {}
}

function resetDimTimer() {
    document.getElementById('dim-overlay').classList.remove('active');
    clearTimeout(dimTimer);
    if (isRunning && !isPaused) {
        dimTimer = setTimeout(() => { document.getElementById('dim-overlay').classList.add('active'); }, 45000);
    }
}

function initMaps() {
    const tiles = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer(tiles).addTo(map);
    pathLine = L.polyline([], {color: '#00cc00', weight: 6, opacity: 0.9}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 7, color: '#000', fillColor: '#00ff88', fillOpacity: 1, weight: 3}).addTo(map);
    detailMap = L.map('detail-map', {zoomControl: false});
    L.tileLayer(tiles).addTo(detailMap);
    detailPathLine = L.polyline([], {color: '#00cc00', weight: 6}).addTo(detailMap);
}

function startTracking() {
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, speed, accuracy } = pos.coords;
        const newPos = [latitude, longitude];
        marker.setLatLng(newPos);
        if (!isPaused) map.panTo(newPos);

        if (!isRunning) {
            document.getElementById('status').textContent = `READY TO RUN (±${Math.round(accuracy)}m)`;
            document.getElementById('status').style.color = "#00ff88";
        }

        if (isRunning && !isPaused) {
            const currentSpeedKmh = (speed || 0) * 3.6;
            if (currentSpeedKmh < 1.0) {
                if (!isAutoPaused) {
                    isAutoPaused = true;
                    document.getElementById('status').textContent = "AUTO PAUSED";
                    document.getElementById('dim-status').textContent = "PAUSED";
                }
            } else {
                if (isAutoPaused) {
                    isAutoPaused = false;
                    document.getElementById('status').textContent = "TRACKING LIVE";
                    document.getElementById('dim-status').textContent = "";
                }
            }
            if (!isAutoPaused) {
                if (pathArray.length > 0) {
                    const last = pathArray[pathArray.length - 1];
                    const d = calculateDistance(last[0], last[1], latitude, longitude);
                    if (d > 0.002) { totalDistance += d; updateUI(); }
                }
                pathArray.push(newPos);
                pathLine.setLatLngs(pathArray);
            }
        }
    }, (err) => {
        document.getElementById('status').textContent = "GPS SEARCHING...";
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

document.getElementById('main-btn').onclick = function() {
    if (!isRunning) {
        isRunning = true; isPaused = false; isAutoPaused = false; totalDistance = 0; elapsedSeconds = 0; pathArray = [];
        pathLine.setLatLngs([]); requestWakeLock(); resetDimTimer();
        timerInterval = setInterval(() => { if(!isPaused && !isAutoPaused) { elapsedSeconds++; updateTimerUI(); updateStaticData(); } }, 1000);
        this.textContent = 'STOP'; this.style.background = '#444';
        document.getElementById('status').textContent = "TRACKING LIVE";
    } else {
        isPaused = true; this.style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        clearTimeout(dimTimer); if (wakeLock) wakeLock.release();
    }
};

function resumeTracking() { isPaused = false; isAutoPaused = false; requestWakeLock(); resetDimTimer(); document.getElementById('after-stop').style.display = 'none'; document.getElementById('main-btn').style.display = 'block'; }

function updateUI() {
    const dStr = totalDistance.toFixed(2);
    document.getElementById('dist').textContent = dStr;
    document.getElementById('dim-dist').textContent = dStr + " KM";
    if (totalDistance > 0.005) {
        const p = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = `${Math.floor(p)}'${String(Math.floor((p-Math.floor(p))*60)).padStart(2, '0')}"`;
    }
}

function updateStaticData() {
    document.getElementById('cadence').textContent = (isPaused || isAutoPaused) ? 0 : Math.floor(Math.random()*5+175);
    document.getElementById('gct').textContent = (isPaused || isAutoPaused) ? 0 : Math.floor(Math.random()*10+240);
    document.getElementById('flight').textContent = (isPaused || isAutoPaused) ? 0 : Math.floor(Math.random()*5+90);
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

function saveData() {
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, route: pathArray };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record); localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    alert("안전하게 저장 완료! ❤️"); location.reload();
}

function loadHistory() {
    const container = document.getElementById('history-container');
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    container.innerHTML = history.length === 0 ? '<div style="text-align:center; color:#444; margin-top:50px;">기록이 없어!</div>' : 
        history.map(h => `<div class="history-card" onclick="openDetail(${h.id})"><div style="font-size:12px; color:var(--primary);">${h.date}</div><div style="font-size:22px; font-weight:900;">${h.dist} KM</div><div style="color:#888;">${h.time} | ${h.pace}</div></div>`).join('');
}

function openDetail(id) {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    const h = history.find(item => item.id === id); if (!h) return;
    document.getElementById('det-date').innerText = h.date;
    document.getElementById('det-info').innerText = `${h.dist} KM / ${h.time} / ${h.pace}`;
    document.getElementById('detail-modal').style.display = 'flex';
    setTimeout(() => { detailMap.invalidateSize(); if(h.route && h.route.length > 0) { detailPathLine.setLatLngs(h.route); detailMap.fitBounds(detailPathLine.getBounds(), {padding:[20,20]}); } }, 200);
}

function closeDetail() { document.getElementById('detail-modal').style.display = 'none'; }

function switchPage(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    if(p === 'history') { document.querySelectorAll('.tab-btn')[1].classList.add('active'); loadHistory(); }
    else { document.querySelectorAll('.tab-btn')[0].classList.add('active'); setTimeout(() => map.invalidateSize(), 200); }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
window.onload = () => { initMaps(); startTracking(); };
</script>
</body>
</html>
