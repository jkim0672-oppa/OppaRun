<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            height: 100%;
        }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; margin-bottom: 2px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; opacity: 0.9; }
        .value { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .controls { 
            height: 90px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0 15px; 
            margin-top: auto; 
            flex-shrink: 0; 
            margin-bottom: 80px; 
        }

        /* 3번 피드백 효과: 안전한 방식 */
        .btn-capsule, .btn-half, .btn-map-view, .tab-btn {
            transition: transform 0.05s ease, filter 0.05s ease;
        }
        .btn-capsule:active, .btn-half:active, .btn-map-view:active {
            transform: scale(0.97); 
            filter: brightness(0.8); 
        }
        .tab-btn:active {
            transform: scale(0.9);
        }

        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; font-size: 16px; border: none; display: flex; align-items: center; justify-content: center; } 

        #history-view { 
            display: none; 
            flex: 1; 
            width: 100%; 
            flex-direction: column; 
            background: #000; 
            max-height: calc(100vh - 18vh - 65px - 30px); 
        }
        
        .history-list { 
            padding: 10px; 
            overflow-y: auto !important; 
            flex: 1; 
            display: block; 
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            padding-bottom: 100px;
        }
        
        /* [개선] 히스토리 아이템 디자인 가독성 강화 */
        .history-item { 
            background: var(--card-bg); /* RUN 탭과 동일한 배경색 사용 */
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid #1f1f1f; /* 테두리를 RUN 탭 카드처럼 은은하게 */
            position: relative; 
        }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 18px; }
        .h-dist { font-size: 32px; font-weight: 900; color: #fff; }
        .h-time { font-size: 18px; color: #fff; font-weight: 700; opacity: 0.9; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 1px solid #222; padding-top: 15px; }
        .h-info { display: flex; flex-direction: column; }

        /* [개선] 라벨(제목) 글자 가독성 강화 */
        .h-info .lab { 
            font-size: 9px; 
            color: #ffffff; /* 흰색으로 변경 */
            font-weight: 900; 
            margin-bottom: 5px; 
            letter-spacing: 0.5px; 
            opacity: 0.6; /* 살짝 투명하게 해서 데이터와 구분 */
        }
        /* [개선] 데이터 수치 가독성 강화 */
        .h-info .val { 
            font-size: 14px; 
            font-weight: 900; 
            color: var(--primary); /* 데이터 숫자에 포인트 컬러 적용 */
        }
        
        .btn-map-view { background: #222; color: var(--primary); border: 1.5px solid var(--primary); border-radius: 20px; font-size: 9px; font-weight: 900; padding: 4px 10px; }
        .splits-box { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #333; }
        .split-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #aaa; margin-bottom: 2px; }
        
        /* [개선] 삭제 버튼 가독성 강화 */
        .h-delete { 
            color: #555; 
            font-size: 11px; 
            text-decoration: underline; 
            padding: 8px 0 0 0; 
            font-weight: 800; 
            text-align: right; 
            display: block; 
            margin-top: 15px; 
            opacity: 0.8;
        }

        #full-map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; }
        #full-map { width: 100%; height: calc(100% - 80px); }
        .close-map-btn { height: 80px; background: #111; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
