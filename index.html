<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* MAP AREA */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 25vh; min-height: 180px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 10px; padding: 3px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 9px; color: var(--danger); font-weight: 900; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .label::after { content: " /"; color: var(--primary); margin-left: 2px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* HISTORY */
        .history-list { padding: 0 12px; overflow-y: auto; flex: 1; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .h-header { margin-bottom: 8px; display: flex; justify-content: space-between; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
        .h-dist { font-size: 24px; font-weight: 900; color: #fff; }
        .h-time { font-size: 16px; font-weight: 700; color: #888; }
        
        .mini-map-box { width: 100%; height: 130px; border-radius: 10px; margin-bottom: 12px; background: #222; overflow: hidden; border: 1px solid #333; position: relative; }
        .mini-map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: transparent; }

        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 10px; gap: 4px; }
        .h-det-label { font-size: 8px; color: #666; font-weight: 800; margin-bottom: 2px; }
        .h-det-label::after { content: " /"; color: var(--primary); }
        .h-det-val { font-size: 14px; font-weight: 700; color: #ddd; }

        /* MODAL (MAP EXPAND) */
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #expanded-map { flex: 1; width: 100%; }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .close-btn { background: var(--danger); color: #fff; border: none; padding: 8px 15px; border-radius: 20px; font-weight: 900; }
        .splits-area { height: 200px; background: #111; overflow-y: auto; padding: 15px; }
        .split-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .split-km { font-weight: 900; color: var(--primary); }

        /* TAB BAR */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        
        .controls { padding: 10px 15px 80px 15px; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body> 

    <div id="map-modal">
        <div class="modal-header">
            <div id="modal-date" style="font-weight:900; color:var(--primary)">RUN DETAIL</div>
            <button class="close-btn" onclick="closeModal()">CLOSE</button>
        </div>
        <div id="expanded-map"></div>
        <div class="splits-area" id="splits-list">
            </div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS READY</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px;">
                <button class="btn-half" style="flex:1; height:55px; border-radius:30px; background:var(--primary); font-weight:900; border:none;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="flex:1; height:55px; border-radius:30px; background:var(--danger); color:#fff; font-weight:900; border:none;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="padding: 15px 15px 5px 15px;"><span style="font-size: 20px; font-weight: 900; color: var(--primary);">HISTORY</span></div>
        <div id="history-list" class="history-list"></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, modalMap;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;
let splits = []; // Store 1km splits: {km: 1, time: "5:10", totalSec: 310}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: varColor('--primary'), weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    }
    updateHistoryStats();
    window.addEventListener('devicemotion', handleMotion);
} 

function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1.0 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 7.5 ? Math.floor(18 + (currentSpeedKmh * 1.2)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "--";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.5) {
            if (!isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; }
        } else {
            if (isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; }
        }
        if (!isAutoPaused && p.coords.accuracy < 40) {
            if (lastPos) {
                let d = calculateDistance(lastPos, pos);
                if (d > 0.002) { 
                    let prevKm = Math.floor(totalDist);
                    totalDist += d; 
                    let currKm = Math.floor(totalDist);
                    
                    // SPLIT CHECK (Every 1KM)
                    if (currKm > prevKm) {
                        let lastSplitSec = splits.length > 0 ? splits[splits.length-1].totalSec : 0;
                        splits.push({ km: currKm, time: formatTime(seconds - lastSplitSec), totalSec: seconds });
                    }

                    document.getElementById('dist').textContent = totalDist.toFixed(2); 
                    lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                }
            } else { lastPos = pos; pathCoords.push(pos); }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
} 

function calculateDistance(p1, p2) {
    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; splits = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = formatTime(seconds); } }, 1000);
} 

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 

function onFinish() {
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0;
    const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0;
    const now = new Date();
    const record = { 
        id: Date.now(), 
        date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleDateString('en-US', { weekday: 'short' }), 
        dist: totalDist.toFixed(2), time: formatTime(seconds), pace: document.getElementById('avgPace').textContent, 
        cadence: Math.round((steps/(seconds||1))*60), kcal: Math.round(totalDist * 65), gctflt: `${avgGct}/${avgFlt}%`,
        path: pathCoords, splits: splits
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    h.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main"><span class="h-dist">${r.dist} KM</span><span class="h-time">${r.time}</span></div>
            <div class="mini-map-box" onclick='openModal(${JSON.stringify(r)})'>
                <div id="mini-map-${r.id}" style="height:100%"></div>
                <div class="mini-map-overlay"></div>
            </div>
            <div class="h-details">
                <div class="h-det-box"><div class="h-det-label">PACE</div><div class="h-det-val">${r.pace}</div></div>
                <div class="h-det-box"><div class="h-det-label">CAD</div><div class="h-det-val">${r.cadence}</div></div>
                <div class="h-det-box"><div class="h-det-label">KCAL</div><div class="h-det-val">${r.kcal}</div></div>
                <div class="h-det-box"><div class="h-det-label">GCT/FLT</div><div class="h-det-val">${r.gctflt}</div></div>
            </div>`;
        list.appendChild(item);
        if(r.path && r.path.length > 0) {
            setTimeout(() => {
                let m = L.map(`mini-map-${r.id}`, {zoomControl:false, attributionControl:false, dragging:false, touchZoom:false}).setView(r.path[0], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
                let p = L.polyline(r.path, {color: '#00ff88', weight: 3}).addTo(m);
                m.fitBounds(p.getBounds(), {padding:[5,5]});
            }, 200);
        }
    });
} 

function openModal(record) {
    document.getElementById('map-modal').style.display = 'flex';
    document.getElementById('modal-date').textContent = record.date + " RUN";
    if (modalMap) modalMap.remove();
    modalMap = L.map('expanded-map', {zoomControl: false}).setView(record.path[0], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMap);
    let p = L.polyline(record.path, {color: '#00ff88', weight: 5}).addTo(modalMap);
    modalMap.fitBounds(p.getBounds(), {padding: [20, 20]});

    // Render Splits
    const sList = document.getElementById('splits-list');
    sList.innerHTML = "<div style='color:#666; font-size:12px; margin-bottom:10px; font-weight:800;'>SPLITS (PACE PER KM)</div>";
    if (record.splits && record.splits.length > 0) {
        record.splits.forEach(s => {
            sList.innerHTML += `<div class="split-row"><span class="split-km">${s.km} KM</span><span class="split-pace">${s.time}</span></div>`;
            L.marker(record.path[Math.floor(record.path.length * (s.km / record.dist))], {
                icon: L.divIcon({className: '', html: `<div style="background:var(--primary); color:#000; padding:2px 6px; border-radius:10px; font-size:10px; font-weight:900; border:1px solid #000;">${s.km}k</div>`})
            }).addTo(modalMap);
        });
    } else { sList.innerHTML += "<div style='color:#444'>No split data available.</div>"; }
}

function closeModal() { document.getElementById('map-modal').style.display = 'none'; }

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
