<div id="sub-page-settings" class="sub-page">
    <div class="placeholder-content">
        <!-- 언어 선택 박스 추가 -->
        <div style="margin-bottom: 30px; text-align: left; padding: 0 20px;">
            <div class="label" style="margin-bottom: 10px;">LANGUAGE</div>
            <select id="lang-select" onchange="changeLanguage(this.value)" style="width: 100%; background: #1a1a1a; color: var(--primary); border: 1px solid #333; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 14px; appearance: none;">
                <option value="en">English (US)</option>
                <option value="ko">한국어 (KR)</option>
                <option value="es">Español</option>
                <option value="jp">日本語</option>
            </select>
        </div>

        <button style="background:#222; color:var(--danger); border:1px solid #444; padding:15px; border-radius:10px; width:80%; font-weight:900;" onclick="clearHistory()">CLEAR ALL HISTORY</button>
    </div>
</div>
