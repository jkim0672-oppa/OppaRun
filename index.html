<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --tab-height: 60px; /* 하단 탭 높이 고정 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 전체 화면을 꽉 채우고 스크롤을 막음 (앱 느낌 구현) */
        html, body {
            height: 100dvh;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. 지도 영역: 남는 모든 공간 차지 */
        #map {
            flex: 1;
            width: 100%;
            background: #222;
        }

        /* 2. 대시보드 영역: 하단에 딱 붙음 */
        .dashboard {
            background: var(--dark-bg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        /* 페이스 카드: 고정 높이 대신 비율 사용 */
        .pace-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        #current-pace {
            font-size: clamp(2.5rem, 8vw, 3.5rem); /* 폰 크기에 따라 글자 크기 조절 */
            font-weight: bold;
            color: var(--neon-green);
        }

        /* 3열 그리드: 어떤 폰에서도 똑같이 3칸 유지 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 10px 4px;
            border-radius: 10px;
            text-align: center;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label { font-size: 0.65rem; color: #888; margin-bottom: 2px; }
        .stat-value { font-size: 1.1rem; font-weight: bold; }
        .stat-unit { font-size: 0.65rem; color: var(--neon-green); margin-left: 2px; }

        /* 시작 버튼: 꽉 차게 */
        .main-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
        }

        /* 3. 하단 탭 바: 정확히 하단에 고정 */
        .tab-bar {
            height: var(--tab-height);
            display: flex;
            background: #000;
            border-top: 1px solid #222;
            align-items: center;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            color: #555;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .tab-item.active { color: var(--neon-green); }

        /* 기록 화면: 전체를 덮도록 설정 */
        #history-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100dvh - var(--tab-height));
            background: var(--dark-bg);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="run-dashboard" class="dashboard">
        <div class="pace-card">
            <div style="color:var(--neon-green); font-size:0.75rem;">CURRENT PACE</div>
            <div id="current-pace">--'--"</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">DIST</div>
                <div class="stat-value"><span id="dist">0.00</span><span class="stat-unit">KM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TIME</div>
                <div id="time" class="stat-value">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">AVG PACE</div>
                <div id="avg-pace" class="stat-value">--'--"</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">CADENCE</div>
                <div class="stat-value"><span id="cadence">0</span><span class="stat-unit">SPM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">GCT</div>
                <div class="stat-value"><span id="gct">--</span><span class="stat-unit">MS</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">FLIGHT</div>
                <div class="stat-value"><span id="flight">--</span><span class="stat-unit">%</span></div>
            </div>
        </div>

        <button id="startBtn" class="main-btn" onclick="toggleRun()">START RUNNING</button>
    </div>

    <div id="history-screen">
        <h1 style="color:var(--neon-green); margin-bottom:20px; font-size: 2rem;">HISTORY</h1>
        <div id="history-list" style="color:#666; text-align:center;">
            NO DATA
        </div>
    </div>

    <nav class="tab-bar">
        <a href="javascript:void(0)" class="tab-item active" id="btn-run" onclick="showScreen('run')">RUN</a>
        <a href="javascript:void(0)" class="tab-item" id="btn-history" onclick="showScreen('history')">HISTORY</a>
    </nav>

    <script>
        // 기본 로직 보존
        let isRunning = false;

        window.onload = function() {
            loadHistory();
            // 오빠가 짠 지도 초기화 코드 등을 여기에 붙여넣으면 돼
        };

        function toggleRun() {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            btn.innerText = isRunning ? "STOP RUNNING" : "START RUNNING";
            btn.style.background = isRunning ? "#ff3333" : "#00ff66";
            if(!isRunning) saveRunData();
        }

        function showScreen(screen) {
            const hScreen = document.getElementById('history-screen');
            const rDash = document.getElementById('run-dashboard');
            const map = document.getElementById('map');
            const btnRun = document.getElementById('btn-run');
            const btnHistory = document.getElementById('btn-history');

            if(screen === 'history') {
                hScreen.style.display = 'block';
                rDash.style.display = 'none';
                map.style.display = 'none';
                btnRun.classList.remove('active');
                btnHistory.classList.add('active');
                loadHistory();
            } else {
                hScreen.style.display = 'none';
                rDash.style.display = 'flex';
                map.style.display = 'block';
                btnRun.classList.add('active');
                btnHistory.classList.remove('active');
            }
        }

        // 크롬 및 모바일 브라우저 공용 저장 로직
        function saveRunData() {
            const d = document.getElementById('dist').innerText;
            if(parseFloat(d) <= 0) return;
            const record = {
                date: new Date().toLocaleString('ko-KR'),
                dist: d,
                time: document.getElementById('time').innerText
            };
            let history = JSON.parse(localStorage.getItem('oppaRun_Data') || "[]");
            history.unshift(record);
            localStorage.setItem('oppaRun_Data', JSON.stringify(history));
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const data = localStorage.getItem('oppaRun_Data');
            if(!data || data === "[]") return;
            const history = JSON.parse(data);
            list.innerHTML = history.map(item => `
                <div style="background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:10px; text-align:left; border-left:4px solid var(--neon-green);">
                    <div style="font-size:0.75rem; color:#888;">${item.date}</div>
                    <div style="font-size:1.1rem; font-weight:bold; margin-top:4px;">${item.dist} KM / ${item.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
