<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Ultra - v30.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text: #fff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-container { height: 18vh; width: 100%; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 5px; background: #0a0a0a; font-weight: bold; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex: 1; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2px solid var(--primary); height: 100px; }
        .label { font-size: 10px; color: #888; font-weight: bold; margin-bottom: 4px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }
        
        .controls { padding: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 80px; }
        .btn { flex: 1; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 14px; font-weight: bold; }
        .tab-btn.active { color: var(--primary); }

        #history-view { display: none; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="map-container"><div id="map"></div></div>
<div id="status" class="status-bar">GPS INITIALIZING...</div>

<div id="run-view">
    <div class="dashboard">
        <div class="card card-main">
            <div class="label" style="color:var(--primary)">CURRENT PACE</div>
            <div id="curPace" class="value-large">--'--"</div>
        </div>
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><small style="font-size:12px;color:var(--primary)">KM</small></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn" style="background:var(--primary); color:#000;" onclick="startRun()">START</button>
        <button id="btn-stop" class="btn" style="background:#ff4444; color:#fff; display:none;" onclick="stopRun()">STOP</button>
        <div id="after-stop" style="display:none; width:100%; gap:10px;">
            <button class="btn" style="background:var(--primary); color:#000;" onclick="resumeRun()">RESUME</button>
            <button class="btn" style="background:#ff4444; color:#fff;" onclick="finishRun()">FINISH</button>
        </div>
    </div>
</div>

<div id="history-view">
    <div id="history-list"></div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="switchTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="switchTab('history')">HISTORY</button>
</div>

<script>
let map, marker, polyline, timer;
let isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];

function init() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([33.77, -117.91], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.circleMarker([33.77, -117.91], { radius: 8, color: '#fff', fillColor: '#007bff', fillOpacity: 1, weight: 2 }).addTo(map);
    polyline = L.polyline([], { color: '#007bff', weight: 6 }).addTo(map);

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const currentPos = [lat, lng];
            const accuracy = Math.round(pos.coords.accuracy);
            
            document.getElementById('status').textContent = `GPS ACTIVE (±${accuracy}m)`;
            marker.setLatLng(currentPos);
            
            if (isRunning && !isPaused) {
                if (lastPos) {
                    const d = getDistance(lastPos, currentPos);
                    // 오차 방지: 정확도가 낮으면 5m 이상, 높으면 2m 이상 이동 시만 기록
                    const threshold = accuracy > 20 ? 0.005 : 0.002;
                    
                    if (d > threshold) {
                        totalDist += d;
                        document.getElementById('dist').textContent = totalDist.toFixed(2);
                        pathCoords.push(currentPos);
                        polyline.setLatLngs(pathCoords);
                        lastPos = currentPos;
                        
                        // 페이스 계산
                        const speed = pos.coords.speed; // m/s
                        if (speed > 0.5) {
                            document.getElementById('curPace').textContent = formatPace(speed * 3.6);
                        }
                    }
                } else {
                    lastPos = currentPos;
                    pathCoords.push(currentPos);
                }
                map.panTo(currentPos);
            } else if (!isRunning) {
                map.panTo(currentPos);
            }
        }, err => {
            document.getElementById('status').textContent = "GPS ERROR: " + err.message;
        }, { enableHighAccuracy: true, maximumAge: 0 });
    }
}

function getDistance(p1, p2) {
    const R = 6371;
    const dLat = (p2[0]-p1[0])*Math.PI/180;
    const dLon = (p2[1]-p1[1])*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatPace(kmh) {
    if (kmh < 1) return "--'--\"";
    const totalSeconds = 3600 / kmh;
    const min = Math.floor(totalSeconds / 60);
    const sec = Math.floor(totalSeconds % 60);
    return `${min}'${String(sec).padStart(2, '0')}"`;
}

function startRun() {
    isRunning = true; isPaused = false; seconds = 0; totalDist = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    
    timer = setInterval(() => {
        if (!isPaused) {
            seconds++;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            document.getElementById('time').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            // 평균 페이스 업데이트
            if (totalDist > 0.01) {
                const avgKmh = (totalDist / (seconds / 3600));
                document.getElementById('avgPace').textContent = formatPace(avgKmh);
            }
        }
    }, 1000);
}

function stopRun() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function resumeRun() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }

function finishRun() {
    if (totalDist > 0.01) {
        const record = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            dist: totalDist.toFixed(2),
            time: document.getElementById('time').textContent,
            pace: document.getElementById('avgPace').textContent
        };
        let history = JSON.parse(localStorage.getItem('oppaRunData') || "[]");
        history.unshift(record);
        localStorage.setItem('oppaRunData', JSON.stringify(history));
    }
    location.reload();
}

function switchTab(t) {
    document.getElementById('run-view').style.display = t === 'run' ? 'block' : 'none';
    document.getElementById('history-view').style.display = t === 'history' ? 'block' : 'none';
    document.getElementById('map-container').style.display = t === 'run' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${t}`));
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunData') || "[]");
    document.getElementById('history-list').innerHTML = history.map(r => `
        <div class="history-item">
            <div style="color:var(--primary); font-size:12px; font-weight:bold;">${r.date}</div>
            <div style="font-size:24px; font-weight:900; margin:5px 0;">${r.dist} KM</div>
            <div style="color:#888; font-size:14px;">Time: ${r.time} | Pace: ${r.pace}</div>
        </div>
    `).join('');
}

window.onload = init;
</script>
</body>
</html>
