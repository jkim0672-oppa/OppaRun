<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.40</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100svh; overflow: hidden; }
        
        /* [원본 유지] 메인 레이아웃 */
        #map-area { height: 15vh; width: 100%; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .main-content { padding: 10px; display: flex; flex-direction: column; height: 75vh; }
        
        /* [원본 유지] 대시보드 및 카드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px 5px; text-align: center; border: 1px solid #222; }
        .card-main { grid-column: span 3; border: 2px solid var(--primary); padding: 20px 0; }
        .label { font-size: 10px; color: #888; font-weight: 800; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 46px; color: var(--primary); font-weight: 900; }
        
        .btn-start { width: 100%; height: 60px; background: var(--primary); color: #000; border-radius: 30px; border: none; font-size: 20px; font-weight: 900; }

        /* [추가] 경로지도 상세 팝업 - 원본을 덮어씌우는 독립 레이어 */
        #det-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: none; flex-direction: column; 
        }
        #det-map-box { height: 50%; width: 100%; border-bottom: 2.5px solid var(--primary); position: relative; }
        #det-map { height: 100%; width: 100%; background: #111; }
        .det-info { height: 50%; padding: 25px 20px; overflow-y: auto; }
        .det-dist { font-size: 58px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 20px; }
        .back-btn { 
            position: absolute; top: 20px; left: 20px; z-index: 10000; 
            background: rgba(0,0,0,0.8); color: #fff; border: 2px solid var(--primary); 
            padding: 10px 22px; border-radius: 25px; font-weight: 900; font-size: 14px;
        }

        /* 기록 리스트 */
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 1px solid #222; }
        .h-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .route-btn { background: #000; color: var(--primary); border: 1.5px solid var(--primary); padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; }

        /* 하단 탭 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #666; font-weight: 800; font-size: 15px; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="map-area"><div id="map"></div></div>

    <div id="run-page" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label">PACE</div>
                <div class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value">0.00 <span style="font-size:10px">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value">0</div></div>
        </div>
        <button class="btn-start">러닝 시작</button>
    </div>

    <div id="history-page" class="main-content" style="display:none; overflow-y: auto;">
        <div id="list-container">
            <div class="history-item">
                <div class="h-header">
                    <div>
                        <div style="color:var(--primary); font-size:12px; font-weight:700;">May 11, Mon</div>
                        <div style="font-size:26px; font-weight:900; margin-top:5px;">0.37 <span style="font-size:16px;">KM</span></div>
                    </div>
                    <button class="route-btn" onclick="openDetail(101)">경로지도</button>
                </div>
                <div style="display:flex; gap:15px; color:#888; font-size:12px; font-weight:700;">
                    <span>TIME 00:08</span> <span>PACE 21'35"</span>
                </div>
            </div>
        </div>
    </div>

    <div id="det-view">
        <button class="back-btn" onclick="closeDetail()">← BACK</button>
        <div id="det-map-box"><div id="det-map"></div></div>
        <div class="det-info">
            <div id="det-date" style="color:var(--primary); font-weight:800; font-size:14px; margin-bottom:8px;">DATE</div>
            <div class="det-dist"><span id="det-dist">0.00</span><span style="font-size:22px; margin-left:8px;">KM</span></div>
            <div class="dashboard" style="padding:0; margin-top:30px;">
                <div class="card"><div class="label">TIME</div><div id="det-time" class="value">00:00</div></div>
                <div class="card"><div class="label">AVG PACE</div><div id="det-pace" class="value">--'--"</div></div>
                <div class="card"><div class="label">GCT / FLIGHT</div><div id="det-gct" class="value" style="font-size:15px;">-- / --%</div></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="t-run" class="tab-btn active" onclick="tab('run')">러닝</button>
        <button id="t-hist" class="tab-btn" onclick="tab('history')">기록</button>
    </div>

<script>
    let mainMap, dMap, dPoly;

    // 지도 초기화
    mainMap = L.map('map', {zoomControl:false, attributionControl:false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mainMap);

    function tab(type) {
        document.getElementById('run-page').style.display = type === 'run' ? 'flex' : 'none';
        document.getElementById('history-page').style.display = type === 'history' ? 'block' : 'none';
        document.getElementById('t-run').classList.toggle('active', type === 'run');
        document.getElementById('t-hist').classList.toggle('active', type === 'history');
    }

    // [핵심] 상세 팝업 열기
    function openDetail(id) {
        // 실제 데이터 연결 (v28.12의 localStorage 로직 활용)
        const dummyPath = [[37.5665, 126.9780], [37.5675, 126.9795], [37.5685, 126.9770]];
        
        document.getElementById('det-view').style.display = 'flex';
        document.getElementById('det-date').innerText = "May 11, Mon";
        document.getElementById('det-dist').innerText = "0.37";
        document.getElementById('det-time').innerText = "00:08";
        document.getElementById('det-pace').innerText = "21'35\"";
        document.getElementById('det-gct').innerText = "280ms / 12%";

        // 지도 렌더링 지연 처리 (레이아웃 깨짐 방지)
        setTimeout(() => {
            if (!dMap) {
                dMap = L.map('det-map', {zoomControl:false, attributionControl:false});
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dMap);
                dPoly = L.polyline([], {color: '#00ff88', weight: 6}).addTo(dMap);
            }
            dPoly.setLatLngs(dummyPath);
            dMap.fitBounds(dPoly.getBounds(), {padding: [40, 40]});
            dMap.invalidateSize();
        }, 300);
    }

    function closeDetail() {
        document.getElementById('det-view').style.display = 'none';
    }
</script>
</body>
</html>
