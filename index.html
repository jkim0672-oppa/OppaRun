<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v19.4 Data Focus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff4444; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 1. 지도 영역 축소 (콤팩트 모드) */
        #map { height: 25vh; width: 100%; background: #222; border-bottom: 1px solid #333; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 5px; background: #0a0a0a; font-weight: bold; }
        
        /* 2. 데이터 영역 확장 */
        .dashboard { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; box-sizing: border-box; overflow-y: auto; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1a1a1a; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1px solid var(--primary); background: rgba(0,255,136,0.02); height: 90px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 800; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 20px; font-weight: 900; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 2px; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; }

        /* 3. 버튼 영역 정돈 */
        .controls { height: 100px; display: flex; justify-content: center; align-items: center; padding: 0 20px 20px 20px; }
        .btn-circle { width: 80px; height: 80px; border-radius: 50%; border: none; font-weight: 900; font-size: 16px; }
        #btn-start { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 15px; width: 100%; }
        .btn-action { flex: 1; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 16px; }

        .tab-bar { height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2.5px solid #fff; border-radius: 50%; width: 14px; height: 14px; }
    </style>
</head>
<body>

<div id="home-page" style="display: contents;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-circle" onclick="onStart()">START</button>
        <button id="btn-stop" class="btn-circle" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <button class="tab-btn active">RUN</button>
    <button class="tab-btn">HISTORY</button>
</div>

<script>
// v19.2의 모든 핵심 로직 유지 (경로 추적, 무음 저장, 지도 시점 유지)

</body>
</html>
