<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.62 (Compact Metronome)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 20vh; min-height: 150px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        #sub-page-info { padding: 10px 12px 120px 12px; gap: 10px; }
        .info-card { background: var(--card-bg); border: 1.5px solid #333; border-radius: 15px; padding: 20px; margin: 0; width: 100%; }
        .info-title { color: var(--primary); font-weight: 900; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .info-body { color: #ccc; font-size: 13px; line-height: 1.6; font-weight: 600; word-break: keep-all; }

        /* 진단 & 메트로놈 뷰 레이아웃 최적화 */
        #diag-view, #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .diag-header { padding: 50px 20px 15px; border-bottom: 1px solid #222; }
        
        /* 박스 사이즈 통일 및 축소 */
        .metro-card { 
            background: #1a1a1a; border-radius: 12px; padding: 12px 15px; 
            margin: 6px 15px; border: 1.5px solid #333; 
            display: flex; flex-direction: column; justify-content: center;
            min-height: 85px; 
        }
        .diag-label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        #metro-bpm-val { font-size: 32px; font-weight: 900; text-align: center; color: var(--primary); margin: 0; line-height: 1.2; }
        .metro-slider { width: 100%; accent-color: var(--primary); margin: 8px 0; height: 4px; cursor: pointer; }
        
        /* 소리 선택 드롭다운 스타일 */
        .sound-select {
            background: #2a2a2a; color: #fff; border: 1px solid #444;
            padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 800;
            width: 100%; outline: none; appearance: none; text-align: center;
        }

        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }

        .settings-container { padding: 20px; }
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div class="diag-header" style="padding-top: 45px;">
            <div style="font-size:20px; font-weight:900; color:var(--primary);">METRONOME</div>
            <div style="color:#666; font-size:10px;">Perfect your cadence.</div>
        </div>

        <div class="metro-card">
            <div class="diag-label">TEMPO (BPM)</div>
            <div id="metro-bpm-val">175</div>
            <input type="range" id="metro-bpm" class="metro-slider" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>

        <div class="metro-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div class="diag-label" style="margin:0;">SOUND</div>
                <select id="metro-sound-type" class="sound-select" style="width:60%;">
                    <option value="beep">ELECTRONIC BEEP</option>
                    <option value="wood">WOOD BLOCK</option>
                    <option value="click">SHARP CLICK</option>
                </select>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="diag-label" style="margin:0;">LEVEL</div>
                <input type="range" id="metro-vol" class="metro-slider" style="width:60%; margin:0;" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>

        <div class="metro-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; font-weight:800; color:#aaa;">ACCENT FIRST BEAT</span>
                <input type="checkbox" id="metro-accent" checked style="width:18px; height:18px; accent-color:var(--primary);">
            </div>
        </div>

        <div style="padding: 10px 15px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000; height:55px;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container">
                <div class="dropdown-select" onclick="ui.openMetronome()">
                    <span>Metronome</span><span id="menu-bpm-display" style="font-size:12px; color:var(--primary);">OFF</span>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, accCircle, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let wakeLock = null;

const metro = {
    audioCtx: null, nextTickTime: 0, timerID: null, isPlaying: false, currentBeat: 0,
    init() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
    playClick() {
        const type = document.getElementById('metro-sound-type').value;
        const isAccent = document.getElementById('metro-accent').checked && this.currentBeat === 0;
        const vol = document.getElementById('metro-vol').value;
        const osc = this.audioCtx.createOscillator();
        const envelope = this.audioCtx.createGain();
        
        if (type === 'beep') {
            osc.type = 'sine'; osc.frequency.value = isAccent ? 1200 : 800;
            envelope.gain.setValueAtTime(vol, this.audioCtx.currentTime);
            envelope.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        } else if (type === 'wood') {
            osc.type = 'triangle'; osc.frequency.value = isAccent ? 600 : 400;
            envelope.gain.setValueAtTime(vol, this.audioCtx.currentTime);
            envelope.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);
        } else {
            osc.type = 'square'; osc.frequency.value = isAccent ? 2500 : 1800;
            envelope.gain.setValueAtTime(vol, this.audioCtx.currentTime);
            envelope.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.02);
        }
        osc.connect(envelope); envelope.connect(this.audioCtx.destination);
        osc.start(this.audioCtx.currentTime); osc.stop(this.audioCtx.currentTime + 0.1);
        this.currentBeat = (this.currentBeat + 1) % 4;
    },
    scheduler() {
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playClick();
            this.nextTickTime += 60.0 / document.getElementById('metro-bpm').value;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    },
    toggle() {
        this.init();
        if (this.isPlaying) {
            clearTimeout(this.timerID); this.isPlaying = false;
            document.getElementById('btn-metro-toggle').textContent = "START";
            document.getElementById('btn-metro-toggle').style.background = "var(--primary)";
            document.getElementById('menu-bpm-display').textContent = "OFF";
        } else {
            this.currentBeat = 0; this.nextTickTime = this.audioCtx.currentTime;
            this.scheduler(); this.isPlaying = true;
            document.getElementById('btn-metro-toggle').textContent = "STOP";
            document.getElementById('btn-metro-toggle').style.background = "var(--danger)";
            document.getElementById('menu-bpm-display').textContent = document.getElementById('metro-bpm').value + " BPM";
        }
    },
    updateDisplay() {
        const val = document.getElementById('metro-bpm').value;
        document.getElementById('metro-bpm-val').textContent = val;
        if(this.isPlaying) document.getElementById('menu-bpm-display').textContent = val + " BPM";
    }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
    },
    openMetronome: () => document.getElementById('metronome-view').style.display = 'flex',
    closeMetronome: () => document.getElementById('metronome-view').style.display = 'none',
    toggleDim: (show) => document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'
};

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6; 
    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (lastPos) { totalDist += map.distance(lastPos, pos) / 1000; document.getElementById('dist').textContent = totalDist.toFixed(2); pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        lastPos = pos;
        document.getElementById('curPace').textContent = `${Math.floor(3600/currentSpeedKmh/60)}'${String(Math.floor(3600/currentSpeedKmh%60)).padStart(2,'0')}"`;
    }
    map.panTo(pos);
}

function onStart() { requestWakeLock(); isRunning = true; timer = setInterval(() => { if(!isPaused) seconds++; }, 1000); document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390]).addTo(map);
    polyline = L.polyline([], {color: '#00ff88'}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition);
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
