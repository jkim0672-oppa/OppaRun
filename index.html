<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.16</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard Grid - 원본 레이아웃 100% 유지 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Controls */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-top: 10px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* History List */
        .history-list { padding: 0 12px; overflow-y: auto; flex: 1; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        .h-main { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .text-route-link { color: var(--primary); font-size: 13px; font-weight: 900; cursor: pointer; background: rgba(0, 255, 136, 0.1); padding: 5px 12px; border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 6px; }

        /* Route Detail View (상세 페이지) */
        #record-detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        #detail-map-container { height: 50%; width: 100%; border-bottom: 2px solid var(--primary); position: relative; }
        #detail-map { height: 100%; width: 100%; }
        .detail-data-area { height: 50%; padding: 20px; overflow-y: auto; background: #000; }
        .detail-main-dist { font-size: 48px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .back-btn { position: absolute; top: 15px; left: 15px; z-index: 10000; background: rgba(0,0,0,0.7); color: #fff; border: 1.5px solid var(--primary); padding: 8px 16px; border-radius: 20px; font-weight: 900; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list" class="history-list"></div>
    </div> 

    <div id="record-detail-view">
        <button class="back-btn" onclick="closeDetail()">← BACK</button>
        <div id="detail-map-container"><div id="detail-map"></div></div>
        <div class="detail-data-area">
            <div id="det-date" class="h-date" style="font-size: 14px;">Date</div>
            <div class="detail-main-dist"><span id="det-dist">0.00</span> <span style="font-size: 20px;">KM</span></div>
            <div class="detail-grid">
                <div class="card"><div class="label">TIME</div><div id="det-time" class="value">00:00</div></div>
                <div class="card"><div class="label">AVG PACE</div><div id="det-pace" class="value">--'--"</div></div>
                <div class="card"><div class="label">GCT / FLIGHT</div><div id="det-gct" class="value" style="font-size:15px;">-- / --%</div></div>
                <div class="card"><div class="label">CALORIES</div><div id="det-kcal" class="value">0 KCAL</div></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-form" class="tab-btn" onclick="showTab('form')">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, seconds = 0, totalDist = 0, lastPos = null, pathCoords = [];
let detMap, detPolyline;

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (err) => {}, {enableHighAccuracy: true});
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    marker.setLatLng(pos);
    if (isRunning) {
        if (lastPos) {
            let d = getDistance(lastPos, pos);
            if (d > 0.002) {
                totalDist += d;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                pathCoords.push(pos);
                polyline.setLatLngs(pathCoords);
                lastPos = pos;
            }
        } else { lastPos = pos; }
    } else { map.panTo(pos); }
}

function getDistance(p1, p2) {
    const R = 6371;
    const dLat = (p2[0]-p1[0])*Math.PI/180;
    const dLon = (p2[1]-p1[1])*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => {
        seconds++;
        document.getElementById('time').textContent = formatTime(seconds);
    }, 1000);
}

function onStop() {
    isRunning = false; clearInterval(timer);
    saveRecord();
    location.reload();
}

function saveRecord() {
    const now = new Date();
    const record = {
        id: Date.now(),
        date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }),
        dist: totalDist.toFixed(2),
        time: formatTime(seconds),
        pace: formatPace(totalDist, seconds),
        kcal: Math.round(totalDist * 65),
        gctflt: "280/18%", // 예시 데이터
        path: pathCoords
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <span style="font-size:22px; font-weight:900;">${r.dist}KM</span>
                <span class="text-route-link" onclick="viewRecordMap(${r.id})">ROUTE</span>
            </div>
            <div style="display:flex; gap:15px; font-size:12px; color:#888;">
                <span>TIME: ${r.time}</span>
                <span>PACE: ${r.pace}</span>
            </div>
        </div>`).join('');
}

function viewRecordMap(id) {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = history.find(item => item.id === id);
    if (!r) return;

    document.getElementById('record-detail-view').style.display = 'flex';
    document.getElementById('det-date').textContent = r.date;
    document.getElementById('det-dist').textContent = r.dist;
    document.getElementById('det-time').textContent = r.time;
    document.getElementById('det-pace').textContent = r.pace;
    document.getElementById('det-gct').textContent = r.gctflt;
    document.getElementById('det-kcal').textContent = (r.kcal || 0) + " KCAL";

    setTimeout(() => {
        if (!detMap) {
            detMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detMap);
            detPolyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(detMap);
        }
        if (r.path && r.path.length > 0) {
            detPolyline.setLatLngs(r.path);
            detMap.fitBounds(detPolyline.getBounds(), {padding: [30, 30]});
        } else {
            detMap.setView([37.5665, 126.9780], 15);
        }
        detMap.invalidateSize();
    }, 100);
}

function closeDetail() { document.getElementById('record-detail-view').style.display = 'none'; }

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'history') updateHistoryStats();
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function formatPace(dist, sec) {
    if (dist < 0.01) return "--'--\"";
    let p = sec / dist;
    return `${Math.floor(p/60)}'${String(Math.floor(p%60)).padStart(2,'0')}"`;
}

window.onload = initMap;
</script>
</body>
</html>
