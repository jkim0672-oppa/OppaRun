<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v15.3.0 - Final Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
        
        /* 지도 섹션 */
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #121212; font-weight: bold; border-bottom: 1px solid #222; }

        /* 대시보드 그리드 */
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; padding-bottom: 110px; overflow-y: auto; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; min-height: 70px; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: 900; color: #fff; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        
        /* 강조 카드 (페이스) */
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.03); }
        .value-large { font-size: 42px; color: var(--primary); line-height: 1; font-weight: 900; }

        /* 하단 컨트롤 레이어 */
        .controls { position: fixed; bottom: 95px; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .controls button { pointer-events: auto; }
        
        #main-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 0 20px rgba(255,59,48,0.4); }
        #after-stop { display: none; gap: 15px; }
        .btn-action { width: 120px; height: 55px; border: none; font-weight: 800; border-radius: 30px; font-size: 16px; }

        /* 하단 탭 바 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); align-items: center; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; text-transform: uppercase; padding-bottom: 5px; }
        .tab-btn.active { color: var(--primary); }

        /* 히스토리 모달 (상세보기) */
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; }
        #split-info { height: 300px; background: #111; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        
        /* 히스토리 리스트 스타일 */
        .history-card { background:#161616; padding:18px; border-radius:20px; margin-bottom:12px; border: 1px solid #222; position: relative; }
        .delete-icon { position: absolute; top: 15px; right: 18px; color: #444; font-size: 18px; padding: 5px; z-index: 10; }
    </style>
</head>
<body>

<video id="no-sleep" loop playsinline muted style="display:none;"><source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAZptb292AAAAbG12aGQAAAAA3u99cN7vfXAABAAAAAQAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAABidHJhawAAAFx0a2hkAAAAAd7vfXDe731wAAAAAQAAAAEAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAABZW1kaWEAAAAgbWRoZAAAAADe731w3u99cAAABAAAAAQAVf7fAAAAACNoZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVxtaW5mAAAAFHZtbmQAAAAEAAAAAAhAdXJsIAAAAAEAAAFGc3RibAAAAGRzdHNkAAAAAAAAAAEAAABUbXA0dgAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAIAAgASAAAAEgAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABj//wAAACRhdmMxR0AIAAgAAABIAEgAAAAAAAAAAAAAAAAAABhAAr8AAAACHHBhc3AAAAABAAAAAQAAABhzdHRzAAAAAAAAAAEAAAABAAAEAAAAABxzdHRzAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzeAAAAAAAAAEAAAABAAAAFHN0c3oAAAAAAAAAAAAAAAEAAAAUc3RjbwAAAAAAAAABAAAALAAAAA=="></video>

<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:70px; background:var(--primary); border:none; font-weight:900; color:#000;" onclick="closeModal()">BACK TO LIST</button>
</div>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">WAITING FOR GPS...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card card-highlight">
            <div class="label" style="color:var(--primary)">CURRENT PACE</div>
            <div class="value-large" id="curPace">--'--"</div>
        </div>
        <div class="card"><div class="label">AVG PACE (TOTAL)</div><div class="value" id="avgPace">--'--"</div></div>
        <div class="card"><div class="label">CALORIES</div><div class="value"><span id="kcal">0</span><span class="unit">KCAL</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT (MS)</div><div class="value">240</div></div>
        <div class="card"><div class="label">FLIGHT (MS)</div><div class="value">95</div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="toggleStartStop()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveActivity()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; height:100vh; flex-direction:column; background: #000;">
    <div style="padding:50px 20px 10px;"><h2 style="color:var(--primary); margin:0; font-size:26px; font-weight:900;">ACTIVITY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">Running</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], hMap;
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, timerInterval, lastGpsTime = Date.now();
let pacePoints = [];

// [1] 지도 초기화
function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], { color: '#00ff88', weight: 6, opacity: 0.8 }).addTo(map);
    marker = L.circleMarker([0, 0], { radius: 7, color: '#fff', fillColor: '#00ff88', fillOpacity: 1, weight: 2 }).addTo(map);
}

// [2] 시작/정지 토글
function toggleStartStop() {
    if (!isRunning) {
        isRunning = true; isPaused = false;
        document.getElementById('no-sleep').play();
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#333';
        startTimer();
    } else {
        pauseTracking();
    }
}

function startTimer() {
    timerInterval = setInterval(() => {
        if (!isPaused) {
            // 자동 정지 로직: 6초간 움직임(GPS 업데이트)이 없으면 타이머 일시 중단
            if (Date.now() - lastGpsTime > 6000 && totalDistance > 0) {
                document.getElementById('status').textContent = "AUTO PAUSED";
                return; 
            }
            elapsedSeconds++;
            updateTimerDisplay();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const hrs = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const secs = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${hrs}:${mins}:${secs}`;
}

function pauseTracking() {
    isPaused = true;
    document.getElementById('main-btn').style.display = 'none';
    document.getElementById('after-stop').style.display = 'flex';
}

function resumeTracking() {
    isPaused = false;
    lastGpsTime = Date.now();
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
}

// [3] 데이터 저장 (FINISH 버튼)
function saveActivity() {
    if (totalDistance < 0.01 && !confirm("Too short. Save anyway?")) return;
    
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true }),
        dist: totalDistance.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        kcal: Math.floor(totalDistance * 65),
        route: pathArray
    };

    let history = JSON.parse(localStorage.getItem('OppaRun_v15') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_v15', JSON.stringify(history));
    
    alert("Record Saved!");
    location.reload(); // 초기화
}

// [4] GPS 추적
function startGps() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        document.getElementById('status').textContent = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
        
        if (accuracy > 30) return;
        
        const newPos = [latitude, longitude];
        marker.setLatLng(newPos);
        if (!isPaused) map.panTo(newPos);

        if (isRunning && !isPaused) {
            if (lastPos) {
                const d = calcDist(lastPos[0], lastPos[1], latitude, longitude);
                if (d > 0.002 && d < 0.05) { // 2m~50m 사이 이동만 인정
                    totalDistance += d;
                    lastGpsTime = Date.now();
                    pathArray.push(newPos);
                    pathLine.setLatLngs(pathArray);
                    updateStats();
                }
            }
            lastPos = newPos;
        }
    }, null, { enableHighAccuracy: true });
}

function updateStats() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    document.getElementById('kcal').textContent = Math.floor(totalDistance * 65);
    
    // 평균 페이스
    if (totalDistance > 0) {
        const avgPaceMin = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = formatPace(avgPaceMin);
    }
}

function formatPace(m) {
    if (!m || m === Infinity || m > 60) return "--'--\"";
    const min = Math.floor(m);
    const sec = Math.floor((m - min) * 60);
    return `${min}'${String(sec).padStart(2, '0')}"`;
}

function calcDist(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// [5] 탭 및 히스토리 리스트 관리
function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-home').classList.toggle('active', t === 'home');
    document.getElementById('tab-history').classList.toggle('active', t === 'history');
    if (t === 'history') renderHistory();
}

function renderHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_v15') || "[]");
    const container = document.getElementById('history-container');
    
    if (history.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#444; margin-top:50px;">NO ACTIVITIES YET</div>`;
        return;
    }

    container.innerHTML = history.map(h => `
        <div class="history-card" onclick="showDetail(${h.id})">
            <div class="delete-icon" onclick="event.stopPropagation(); deleteItem(${h.id})">✕</div>
            <div style="font-size:13px; color:var(--primary); font-weight:800; margin-bottom:10px;">${h.date}</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr;">
                <div><div class="label">DISTANCE</div><div style="font-size:24px; font-weight:900;">${h.dist} <span style="font-size:12px;">KM</span></div></div>
                <div><div class="label">AVG PACE</div><div style="font-size:24px; font-weight:900;">${h.pace}</div></div>
            </div>
        </div>
    `).join('');
}

function deleteItem(id) {
    if (confirm("Delete this record?")) {
        let history = JSON.parse(localStorage.getItem('OppaRun_v15') || "[]");
        localStorage.setItem('OppaRun_v15', JSON.stringify(history.filter(x => x.id !== id)));
        renderHistory();
    }
}

function showDetail(id) {
    const history = JSON.parse(localStorage.getItem('OppaRun_v15') || "[]");
    const h = history.find(x => x.id === id);
    if (!h) return;

    document.getElementById('map-modal').style.display = 'flex';
    
    setTimeout(() => {
        if (hMap) hMap.remove();
        hMap = L.map('history-map', { zoomControl: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        
        if (h.route && h.route.length > 0) {
            const pl = L.polyline(h.route, { color: '#00ff88', weight: 5 }).addTo(hMap);
            hMap.fitBounds(pl.getBounds(), { padding: [20, 20] });
        }
        
        document.getElementById('split-info').innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="card"><div class="label">DISTANCE</div><div class="value">${h.dist}km</div></div>
                <div class="card"><div class="label">PACE</div><div class="value">${h.pace}</div></div>
                <div class="card"><div class="label">TIME</div><div class="value">${h.time}</div></div>
                <div class="card"><div class="label">KCAL</div><div class="value">${h.kcal}</div></div>
            </div>`;
    }, 100);
}

function closeModal() {
    document.getElementById('map-modal').style.display = 'none';
}

window.onload = () => {
    initMap();
    startGps();
};
</script>
</body>
</html>
