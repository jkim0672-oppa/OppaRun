<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jenny Run Pro</title>
    <!-- Chart.js 및 Leaflet.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 구글 폰트 및 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-color: #007aff;
            --accent-neon: #00e5ff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0b0f19;
            --bg-card: #161f30;
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --accent-color: #38bdf8;
            --accent-neon: #34d399;
            --border-color: #2d3748;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 폰 해상도 자동 맞춤을 위한 전체 화면 고정 구조 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* 모바일 주소창 대응 */
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden; /* 전체 화면 스크롤 절대 방지 */
            transition: background-color 0.3s, color 0.3s;
        }

        /* 메인 모바일 컨테이너 구조 개선 */
        .container {
            width: 100%;
            height: 100%;
            max-width: 480px; /* 전형적인 모바일 앱 뷰포트 고정 */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            position: relative;
            box-shadow: var(--shadow-md);
        }

        /* 상단 네비게이션 헤더 고정 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            flex-shrink: 0;
        }

        header h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-color), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .theme-toggle, .status-indicator {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        /* 중앙 메인 콘텐츠 영역: 해상도에 따라 유연하게 늘어남 */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden; /* 내부 스크롤 제어를 위해 바깥은 숨김 */
        }

        /* 개별 탭 화면: 내부에서만 스크롤이 발생하도록 제한 */
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            padding: 16px;
            overflow-y: auto; /* 내용이 많으면 여기서만 스크롤 */
            -webkit-overflow-scrolling: touch; /* iOS 부드러운 스크롤 */
        }

        .tab-content.active {
            display: block;
        }

        /* 대시보드 스타일 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .data-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .data-card.full-width {
            grid-column: span 2;
        }

        .data-card .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
        }

        .data-card .unit {
            font-size: 14px;
            color: var(--text-muted);
            margin-left: 4px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 300;
        }

        /* 맵 및 그래프 컨테이너 고정 비율 확보 */
        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            z-index: 1;
        }

        /* 다크모드 맵 필터 */
        [data-theme="dark"] .map-container {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .chart-container {
            width: 100%;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        /* 제어 버튼 영역 */
        .controls-area {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .btn-start { background: #34c759; color: white; }
        .btn-pause { background: #ff9500; color: white; }
        .btn-stop { background: #ff3b30; color: white; }
        .btn:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        /* 하단 고정 탭 바 네비게이션 */
        nav.tab-bar {
            display: flex;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 8px 10px padding-bottom: calc(8px + env(safe-area-inset-bottom)); /* 아이폰 하단 홈바 대응 */
            z-index: 10;
            flex-shrink: 0;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 0;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--accent-color);
        }

        .tab-item i {
            font-size: 18px;
        }

        /* 폼 분석 전용 스타일 레이아웃 최적화 */
        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .analysis-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .analysis-section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-bar-container {
            width: 100%;
            height: 24px;
            background: var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            margin: 8px 0;
        }

        .balance-bar-center {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: var(--text-muted);
            z-index: 2;
            opacity: 0.5;
        }

        .balance-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 8px;
            margin-left: -4px;
            background: var(--accent-color);
            border-radius: 4px;
            transition: left 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
            z-index: 3;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }

        .balance-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            padding: 0 4px;
        }

        /* 해상도가 매우 작은 소형 폰을 위한 미세 조정 */
        @media (max-height: 650px) {
            .data-card { padding: 10px; }
            .data-card .value { font-size: 20px; }
            .map-container { height: 160px; }
            header { padding: 10px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 고정 상단 헤더 -->
    <header>
        <h1>JENNY RUN PRO</h1>
        <div class="header-controls">
            <div class="status-indicator" id="gpsStatus" title="GPS 상태">
                <i class="fas fa-location-arrow" style="color: var(--text-muted);"></i>
            </div>
            <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="테마 변경">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- 유연한 중앙 컨텐츠 스크롤 공간 -->
    <div class="main-content">
        
        <!-- TAB 1: 실시간 트랙 대시보드 -->
        <div id="tab-dash" class="tab-content active">
            <div class="map-container" id="map"></div>
            
            <div class="controls-area">
                <button class="btn btn-start" id="startBtn" onclick="startTracking()"><i class="fas fa-play"></i>시작</button>
                <button class="btn btn-pause" id="pauseBtn" onclick="pauseTracking()" disabled><i class="fas fa-pause"></i>정지</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopTracking()" disabled><i class="fas fa-stop"></i>종료</button>
            </div>

            <div class="dashboard-grid">
                <div class="data-card">
                    <div class="label"><i class="fas fa-stopwatch"></i>시간</div>
                    <div class="value" id="timeVal">00:00</div>
                </div>
                <div class="data-card">
                    <div class="label"><i class="fas fa-route"></i>거리</div>
                    <div class="value" id="distVal">0.00<span class="unit">km</span></div>
                </div>
                <div class="data-card">
                    <div class="label"><i class="fas fa-bolt"></i>현재 페이스</div>
                    <div class="value" id="paceVal">--:--</div>
                </div>
                <div class="data-card">
                    <div class="label"><i class="fas fa-heartbeat"></i>케이던스</div>
                    <div class="value" id="cadVal">0<span class="unit">spm</span></div>
                </div>
            </div>
        </div>

        <!-- TAB 2: 폼 정밀 분석실 -->
        <div id="tab-analysis" class="tab-content">
            <div class="analysis-header">
                <h2 style="margin:0; font-size:18px;">러닝 폼 진단 스코어</h2>
                <div style="font-family:'Orbitron'; font-weight:700; color:var(--accent-color); font-size:20px;" id="formScore">92점</div>
            </div>

            <!-- 지면접촉시간 및 체공시간 데이터 역산 섹션 -->
            <div class="analysis-section">
                <h3><i class="fas fa-shoe-prints"></i>지면 접촉 및 수직 다이내믹스</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;">
                    <div>
                        <span style="font-size:11px; color:var(--text-muted);">평균 지면접촉시간(GCT)</span>
                        <div style="font-family:'Orbitron'; font-size:18px; font-weight:700;" id="gctVal">220<span style="font-size:11px; font-weight:normal; margin-left:2px;">ms</span></div>
                    </div>
                    <div>
                        <span style="font-size:11px; color:var(--text-muted);">평균 체공시간(FT)</span>
                        <div style="font-family:'Orbitron'; font-size:18px; font-weight:700;" id="ftVal">115<span style="font-size:11px; font-weight:normal; margin-left:2px;">ms</span></div>
                    </div>
                </div>
                <div style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:8px;">
                    <span style="font-size:11px; color:var(--text-muted);">수직 진폭 (Vertical Oscillation)</span>
                    <div style="font-family:'Orbitron'; font-size:16px; font-weight:700; margin-top:2px;" id="voVal">8.4<span style="font-size:11px; font-weight:normal; margin-left:2px;">cm</span></div>
                </div>
            </div>

            <!-- 좌우 밸런스 역산 가시화 바 -->
            <div class="analysis-section">
                <h3><i class="fas fa-scale-balanced"></i>실시간 좌우 밸런스 분포 (역산)</h3>
                <div class="balance-bar-container">
                    <div class="balance-bar-center"></div>
                    <div class="balance-pointer" id="balancePointer"></div>
                </div>
                <div class="balance-labels">
                    <span id="leftBalance">L 50.0%</span>
                    <span>BALANCE</span>
                    <span id="rightBalance">R 50.0%</span>
                </div>
            </div>

            <!-- 분석 그래프 카드 -->
            <div class="chart-container">
                <canvas id="analysisChart" style="width:100%; height:160px;"></canvas>
            </div>
        </div>

        <!-- TAB 3: 트레이닝 히스토리 로그 -->
        <div id="tab-history" class="tab-content">
            <h2 style="margin:0 0 14px 0; font-size:18px;">러닝 기록 분석 로그</h2>
            <div id="historyLogArea" style="display:flex; flex-direction:column; gap:10px;">
                <!-- 동적 기록 카드 삽입 영역 -->
            </div>
        </div>

    </div>

    <!-- 고정 하단 탭 바 네비게이션 -->
    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchTab('tab-dash', this)">
            <i class="fas fa-gauge-high"></i>대시보드
        </button>
        <button class="tab-item" onclick="switchTab('tab-analysis', this)">
            <i class="fas fa-chart-line"></i>정밀 분석
        </button>
        <button class="tab-item" onclick="switchTab('tab-history', this)">
            <i class="fas fa-history"></i>기록 일지
        </button>
    </nav>
</div>

<script>
    // 상태 및 데이터 관리 전역 객체
    let isTracking = false;
    let isPaused = false;
    let timerInterval = null;
    let elapsedSeconds = 0;
    let totalDistance = 0.0;
    let lastCoord = null;
    let pathCoordinates = [];
    
    // 자동 일시정지(Auto-Pause) 임계 변수
    let consecutiveZeroSpeedCount = 0;
    const AUTO_PAUSE_THRESHOLD = 3; 

    // 지도 객체 초기화
    const map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let polyline = L.polyline([], { color: '#007aff', weight: 5, opacity: 0.85 }).addTo(map);

    // 차트 초기화 객체
    let analysisChart = null;

    function initChart() {
        const ctx = document.getElementById('analysisChart').getContext('2d');
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        
        analysisChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1k', '2k', '3k', '4k', '5k'],
                datasets: [{
                    label: '지면접촉시간 (ms)',
                    data: [225, 222, 218, 220, 215],
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    yAxisID: 'yGCT'
                }, {
                    label: '케이던스 (SPM)',
                    data: [176, 178, 181, 180, 182],
                    borderColor: '#34c759',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    yAxisID: 'yCad'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: isDark ? '#a0aec0' : '#718096' } },
                    yGCT: { type: 'linear', position: 'left', min: 180, max: 260, ticks: { color: '#007aff' } },
                    yCad: { type: 'linear', position: 'right', min: 150, max: 200, grid: { display: false }, ticks: { color: '#34c759' } }
                }
            }
        });
    }

    // 화면 탭 전환 처리 컨트롤러
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');

        if(tabId === 'tab-analysis') {
            if(!analysisChart) {
                initChart();
            } else {
                updateChartTheme();
            }
        }
        
        // 맵 프레임 버그 리프레시 방지용 보정 트릭
        if(tabId === 'tab-dash') {
            setTimeout(() => { map.invalidateSize(); }, 100);
        }
    }

    // 실시간 다이내믹스 지표 역산 알고리즘 모듈
    function calculateRunningDynamics(speedKmh) {
        if (speedKmh < 3) {
            return { gct: 0, ft: 0, cadence: 0, vo: 0, balanceL: 50.0, balanceR: 50.0 };
        }
        
        // 속도 기반 기본 타겟 케이던스 추출 (속도 증가시 피치 및 보폭 자동 보정 비례 법칙)
        let baseCadence = 160 + (speedKmh * 1.5) + (Math.random() * 4 - 2);
        if (baseCadence > 195) baseCadence = 195;

        // 지면접촉시간 역산 필터 (속도가 빠를수록 접촉 시간 단축 및 비례 수식)
        let gct = 280 - (speedKmh * 5.2) + (Math.random() * 6 - 3);
        
        // 체공시간 정밀 보정 연산 역산
        let stepDurationMs = (60 / baseCadence) * 1000;
        let ft = stepDurationMs - gct;
        if(ft < 0) ft = 40;

        // 수직 진폭 역산 설계
        let vo = 11.5 - (speedKmh * 0.25) + (Math.random() * 0.8 - 0.4);

        // 좌우 밸런스 동적 역산 요동성 난수 계산 (미세 불균형 구현)
        let balanceL = 50.0 + (Math.random() * 1.4 - 0.7);
        let balanceR = 100.0 - balanceL;

        return {
            gct: Math.round(gct),
            ft: Math.round(ft),
            cadence: Math.round(baseCadence),
            vo: vo.toFixed(1),
            balanceL: balanceL.toFixed(1),
            balanceR: balanceR.toFixed(1)
        };
    }

    // 실시간 트래킹 모듈 로직
    function startTracking() {
        if(isTracking && !isPaused) return;
        
        isTracking = true;
        isPaused = false;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('gpsStatus').querySelector('i').style.color = 'var(--accent-neon)';

        timerInterval = setInterval(() => {
            elapsedSeconds++;
            updateTimerDisplay();
            
            // 시뮬레이션 가상 주행 세션 구동 트릭
            simulateMovement();
        }, 1000);
    }

    function pauseTracking() {
        if(!isTracking || isPaused) return;
        isPaused = true;
        clearInterval(timerInterval);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('gpsStatus').querySelector('i').style.color = '#ff9500';
    }

    function stopTracking() {
        if(!isTracking) return;
        clearInterval(timerInterval);
        
        // 세션 데이터 보존 이력 보관소로 밀어넣기
        saveSessionToHistory();

        // 메인 데이터 상태 완전 초기화
        isTracking = false;
        isPaused = false;
        elapsedSeconds = 0;
        totalDistance = 0.0;
        lastCoord = null;
        pathCoordinates = [];
        consecutiveZeroSpeedCount = 0;

        updateTimerDisplay();
        document.getElementById('distVal').innerHTML = `0.00<span class="unit">km</span>`;
        document.getElementById('paceVal').innerText = `--:--`;
        document.getElementById('cadVal').innerHTML = `0<span class="unit">spm</span>`;
        
        polyline.setLatLngs([]);
        
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('gpsStatus').querySelector('i').style.color = 'var(--text-muted)';
    }

    function updateTimerDisplay() {
        const m = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
        const s = (elapsedSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timeVal').innerText = `${m}:${s}`;
    }

    // 가상 좌표 주행 시뮬레이터 및 자동 일시정지(Auto-Pause) 알고리즘 검증
    function simulateMovement() {
        if(!lastCoord) {
            lastCoord = [37.5665, 126.9780];
        }
        
        // 확률적 간이 난수 발생으로 신호 대기중 0 속도 상태 연출 패턴 구현
        let isStoppedPattern = Math.random() < 0.08; 
        let speedKmh = 0;
        let latDiff = 0;
        let lngDiff = 0;

        if (!isStoppedPattern) {
            speedKmh = 10.5 + (Math.random() * 3.0 - 1.5); 
            latDiff = 0.00003 + (Math.random() * 0.00001);
            lngDiff = 0.00003 + (Math.random() * 0.00001);
            consecutiveZeroSpeedCount = 0; // 초기화
        } else {
            speedKmh = 0;
            consecutiveZeroSpeedCount++;
            
            // 3초간 연속 정지 감지시 연동형 자동 정지 발동
            if (consecutiveZeroSpeedCount >= AUTO_PAUSE_THRESHOLD && !isPaused) {
                console.log("자동 정지 커맨드 트리거 작동 완료");
                pauseTracking();
                alert("이동이 멈춰 자동으로 측정을 일시정지합니다.");
                return;
            }
        }

        const nextLat = lastCoord[0] + latDiff;
        const nextLng = lastCoord[1] + lngDiff;
        const nextCoord = [nextLat, nextLng];

        if(speedKmh > 0) {
            totalDistance += 0.0035; 
            document.getElementById('distVal').innerHTML = `${totalDistance.toFixed(2)}<span class="unit">km</span>`;
            
            // 실시간 주행 페이스 역산 환산 
            const paceMin = Math.floor(60 / speedKmh);
            const paceSec = Math.round((60 / speedKmh - paceMin) * 60).toString().padStart(2, '0');
            document.getElementById('paceVal').innerText = `${paceMin}:${paceSec}`;
            
            // 역산 분석 파이프라인 연동
            const dynamics = calculateRunningDynamics(speedKmh);
            document.getElementById('cadVal').innerHTML = `${dynamics.cadence}<span class="unit">spm</span>`;
            
            // 정밀분석실 노출 DOM 업데이트
            document.getElementById('gctVal').innerHTML = `${dynamics.gct}<span style="font-size:11px; font-weight:normal; margin-left:2px;">ms</span>`;
            document.getElementById('ftVal').innerHTML = `${dynamics.ft}<span style="font-size:11px; font-weight:normal; margin-left:2px;">ms</span>`;
            document.getElementById('voVal').innerHTML = `${dynamics.vo}<span style="font-size:11px; font-weight:normal; margin-left:2px;">cm</span>`;
            
            // 포인터 바 역산 오프셋 이동 보정 제어
            const pointerPos = parseFloat(dynamics.balanceL);
            const offsetPercent = ((pointerPos - 45) / 10) * 100; 
            document.getElementById('balancePointer').style.left = `${Math.max(0, Math.min(100, offsetPercent))}%`;
            document.getElementById('leftBalance').innerText = `L ${dynamics.balanceL}%`;
            document.getElementById('rightBalance').innerText = `R ${dynamics.balanceR}%`;

            pathCoordinates.push(nextCoord);
            polyline.setLatLngs(pathCoordinates);
            map.panTo(nextCoord);
            lastCoord = nextCoord;
        }
    }

    // 세션 기록 일지 저장소 데이터베이스 영속화 추상화
    function saveSessionToHistory() {
        const historyArea = document.getElementById('historyLogArea');
        const now = new Date();
        const dateString = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        const logCard = document.createElement('div');
        logCard.className = 'data-card full-width';
        logCard.style.margin = '0';
        logCard.innerHTML = `
            <div class="label" style="justify-content:space-between;">
                <span><i class="fas fa-calendar-alt"></i> ${dateString} 주행 세션</span>
                <span style="color:var(--accent-color); font-weight:700;">완료</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                <span style="font-family:'Orbitron'; font-size:20px; font-weight:700;">${totalDistance.toFixed(2)} km</span>
                <span style="font-size:13px; color:var(--text-muted);">시간: ${document.getElementById('timeVal').innerText}</span>
            </div>
        `;
        historyArea.prepend(logCard);
    }

    // 테마 전환 및 차트 테마 동기화 엔진 리프레시 모듈
    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', nextTheme);
        
        const themeIcon = document.getElementById('themeBtn').querySelector('i');
        if(nextTheme === 'dark') {
            themeIcon.className = 'fas fa-sun';
        } else {
            themeIcon.className = 'fas fa-moon';
        }

        updateChartTheme();
    }

    function updateChartTheme() {
        if(!analysisChart) return;
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        
        analysisChart.options.scales.x.ticks.color = isDark ? '#a0aec0' : '#718096';
        analysisChart.update();
    }
</script>
