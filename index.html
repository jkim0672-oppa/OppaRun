<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.8 (Dimmer Final Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        
        /* Dimmer Trigger Area (PACE Card) */
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; cursor: pointer; }
        .dim-label { position: absolute; bottom: 5px; right: 10px; font-size: 8px; color: #444; font-weight: 900; }
        
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* Dimmer Overlay - 고정 및 클릭 보정 */
        #dimmer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.97); 
            z-index: 10000; display: none; cursor: pointer;
        }
        .dim-info {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; width: 100%;
        }
        .dim-text { color: #111; font-size: 10px; font-weight: 900; letter-spacing: 5px; margin-bottom: 10px; }
        .dim-hint { color: var(--primary); font-size: 14px; font-weight: 700; opacity: 0.15; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body onclick="handleGlobalClick()"> 
    <div id="dimmer" onclick="toggleDimmer(event)">
        <div class="dim-info">
            <div class="dim-text">DIM MODE ACTIVE</div>
            <div class="dim-hint">TAP ANYWHERE TO WAKE</div>
        </div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main" onclick="toggleDimmer(event)">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <div class="dim-label">DIM MODE 탭</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CAD</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div id="gct" class="value">--</div></div>
            <div class="card"><div class="label">FLT</div><div id="flight" class="value">--</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart(event)">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop(event)">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume(event)">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish(event)">FINISH</button>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, wakeLock = null;
let currentSpeedKmh = 0, pathCoords = [];

async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            if (wakeLock !== null) return;
            wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) { console.log('WL Fail'); }
    }
}

// 화면이 다시 보일 때(잠금해제 등) 웨이크락 재요청
document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isRunning && !isPaused) {
        wakeLock = null;
        await requestWakeLock();
    }
});

function handleGlobalClick() {
    if (isRunning && !isPaused) requestWakeLock();
}

// 수정된 디머 토글 함수
function toggleDimmer(e) {
    if (e) e.stopPropagation();
    const dimmer = document.getElementById('dimmer');
    // 현재 달리는 중일 때만 디머가 작동하도록 설정
    if (isRunning) {
        if (dimmer.style.display === 'none' || dimmer.style.display === '') {
            dimmer.style.display = 'block';
            requestWakeLock();
        } else {
            dimmer.style.display = 'none';
        }
    }
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (err) => { 
            document.getElementById('status').textContent = "GPS ERROR: " + err.message; 
        }, {enableHighAccuracy: true}); 
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { 
            isAutoPaused = true; 
            document.getElementById('pause-status').style.display = 'block';
        } else if (currentSpeedKmh >= 0.8 && isAutoPaused) { 
            isAutoPaused = false; 
            document.getElementById('pause-status').style.display = 'none';
        }
        
        if (!isAutoPaused && p.coords.accuracy < 50) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.001) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        }
    } else { map.panTo(pos); }
} 

function onStart(e) {
    if(e) e.stopPropagation();
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0;
    requestWakeLock();
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop(e) { if(e) e.stopPropagation(); isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume(e) { if(e) e.stopPropagation(); isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; requestWakeLock(); } 
function onFinish(e) { location.reload(); }

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
    else document.getElementById('dimmer').style.display = 'none';
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
