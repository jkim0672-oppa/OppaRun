<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #1a1a1a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* Layout */
        #map { height: 100vh; width: 100%; position: absolute; z-index: 1; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
        
        /* Top Navigation */
        .nav-tabs { pointer-events: auto; display: flex; background: rgba(0,0,0,0.8); padding: 10px; gap: 10px; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #222; color: #888; font-weight: 900; font-size: 12px; }
        .tab-btn.active { background: var(--primary); color: #000; }

        /* History List (984.jpg, 986.jpg 스타일) */
        #history-view { position: absolute; top: 60px; bottom: 60px; left: 0; right: 0; background: var(--bg); z-index: 20; display: none; overflow-y: auto; padding: 20px; pointer-events: auto; }
        .record-item { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222; }
        
        /* Detail/Diagnosis View (982.jpg 스타일 - 지도 제거 버전) */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: none; flex-direction: column; padding: 20px; }
        .card { background: #111; padding: 15px; border-radius: 12px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .label { color: #888; font-size: 10px; font-weight: 800; margin-bottom: 5px; }
        .value { color: #fff; font-size: 20px; font-weight: 900; }
        .close-btn { align-self: flex-end; background: var(--primary); color: #000; border: none; padding: 10px 25px; border-radius: 20px; font-weight: 900; margin-bottom: 20px; cursor: pointer; }

        /* Bottom Nav */
        .bottom-nav { pointer-events: auto; margin-top: auto; display: flex; background: #000; border-top: 1px solid #222; padding: 15px; }
        .nav-item { flex: 1; text-align: center; color: #444; font-weight: 900; font-size: 14px; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-overlay">
        <div class="nav-tabs" id="top-nav" style="display:none;">
            <button class="tab-btn active">LIST</button>
            <button class="tab-btn">TOTAL</button>
            <button class="tab-btn">INFO</button>
            <button class="tab-btn">SETTINGS</button>
        </div>
        
        <div class="bottom-nav">
            <div class="nav-item active" onclick="showTab('run')">RUN</div>
            <div class="nav-item" onclick="showTab('history')">HISTORY</div>
        </div>
    </div>

    <div id="history-view">
        <div id="history-list"></div>
    </div>

    <div id="detail-view">
        <button class="close-btn" onclick="closeDetail()">CLOSE</button>
        <div id="detail-content"></div>
    </div>

    <script>
        let map;
        const primaryColor = '#00ff88';

        // 1. 지도 초기화 (986.jpg 메인 로딩 복구)
        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([33.7701, -117.9143], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            setTimeout(() => map.invalidateSize(), 200);
        }

        // 2. 탭 전환 로직
        function showTab(tab) {
            const historyView = document.getElementById('history-view');
            const topNav = document.getElementById('top-nav');
            const navItems = document.querySelectorAll('.nav-item');

            if (tab === 'history') {
                historyView.style.display = 'block';
                topNav.style.display = 'flex';
                navItems[1].classList.add('active');
                navItems[0].classList.remove('active');
                updateHistory();
            } else {
                historyView.style.display = 'none';
                topNav.style.display = 'none';
                navItems[0].classList.add('active');
                navItems[1].classList.remove('active');
            }
        }

        // 3. 기록 업데이트 (984.jpg 리스트 스타일)
        function updateHistory() {
            const list = document.getElementById('history-list');
            const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            
            list.innerHTML = h.slice().reverse().map(r => `
                <div class="record-item">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="color:var(--primary); font-size:13px; font-weight:800;">${r.date}</span>
                        <button onclick="openDetail('${r.id}')" style="background:#222; color:var(--primary); border:1px solid #333; padding:6px 15px; border-radius:8px; font-weight:900; font-size:11px;">DIAG</button>
                    </div>
                    <div style="display:flex; align-items:baseline; gap:10px;">
                        <span style="color:#fff; font-size:26px; font-weight:900;">${r.dist}KM</span>
                        <span style="color:var(--primary); font-size:18px; font-weight:800;">${r.pace || '00\'00"'}</span>
                    </div>
                </div>
            `).join('');
        }

        // 4. 진단 생성 로직 (코칭 피드백)
        function generateDiagnosis(r) {
            let msg = "✅ 현재 페이스가 아주 안정적입니다. 롤링에 집중하세요.";
            if (parseInt(r.cadence) < 170) msg = "⚠️ 케이던스가 낮습니다. 짧고 빠른 발걸음으로 리듬을 높여보세요.";
            return msg;
        }

        // 5. 진단 페이지 열기 (지도 제거 버전)
        function openDetail(id) {
            const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            const r = h.find(item => item.id === id);
            if (!r) return;

            document.getElementById('detail-view').style.display = 'flex';
            document.getElementById('detail-content').innerHTML = `
                <div style="color:var(--primary); font-size:22px; font-weight:900; margin-bottom:25px; border-bottom:2px solid #222; padding-bottom:15px;">RUN DIAGNOSIS</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:25px;">
                    <div class="card"><div class="label">DIST</div><div class="value">${r.dist}KM</div></div>
                    <div class="card"><div class="label">PACE</div><div class="value">${r.pace}</div></div>
                    <div class="card"><div class="label">CAD</div><div class="value">${r.cadence || 0}</div></div>
                    <div class="card"><div class="label">GCT/FLT</div><div class="value">${r.gct || 0}/${r.flight || 0}%</div></div>
                </div>
                <div style="background:#111; padding:20px; border-radius:15px; border:1.5px solid var(--primary); line-height:1.7; font-size:15px;">
                    <div style="color:var(--primary); font-weight:900; margin-bottom:10px; font-size:12px;">COACHING FEEDBACK</div>
                    ${generateDiagnosis(r)}
                </div>
            `;
        }

        function closeDetail() {
            document.getElementById('detail-view').style.display = 'none';
        }

        window.onload = initMap;
    </script>
</body>
</html>
