<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.27</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        /* Main View */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* History Nav (4개 메뉴) */
        #history-header { display: none; flex-direction: column; background: #000; flex-shrink: 0; }
        .history-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; border-bottom: 1px solid #111; }
        .sub-btn { padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* Total Summary Bar (TOTAL 페이지에서만 노출) */
        .summary-bar { display: none; grid-template-columns: 1.2fr 1fr 0.8fr; padding: 12px 20px; background: #000; border-bottom: 1px solid #1a1a1a; font-weight: 900; }
        .s-item { display: flex; flex-direction: column; }
        .s-lbl { font-size: 8px; color: #555; margin-bottom: 2px; }
        .s-val { font-size: 14px; color: var(--primary); }

        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #1f1f1f; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-dist-time { font-size: 20px; font-weight: 900; color: #fff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 12px; gap: 4px; }
        .h-det-val { font-size: 12px; font-weight: 700; color: #ddd; }

        /* Tabs */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="history-header">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">INFO</button>
            <button id="sub-tab-setting" class="sub-btn" onclick="showSubTab('setting')">SETTING</button>
        </div>
        <div id="total-summary" class="summary-bar">
            <div class="s-item"><span class="s-lbl">TOTAL KM</span><span id="sum-dist" class="s-val">0.00 KM</span></div>
            <div class="s-item"><span class="s-lbl">TOTAL TIME</span><span id="sum-time" class="s-val">00:00:00</span></div>
            <div class="s-item"><span class="s-lbl">COUNT</span><span id="sum-count" class="s-val">0</span></div>
        </div>
    </div>

    <div class="main-content">
        <div id="run-view" style="display: flex; flex-direction: column;">
            <div class="dashboard">
                <div class="card card-main"><div class="label" style="color:var(--primary)">PACE</div><div id="curPace" class="value-large">--'--"</div></div>
                <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
                <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
                <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            </div>
            <div style="padding: 15px;"><button id="btn-start" style="width:100%; height:60px; border-radius:30px; border:none; background:var(--primary); font-weight:900; font-size:20px;">START RUNNING</button></div>
        </div>

        <div id="history-view" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
            <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
            <div id="sub-page-total" class="sub-page"><div style="padding:40px; text-align:center; color:#555; font-weight:900;">STATISTICS DETAILS COMING SOON</div></div>
            <div id="sub-page-info" class="sub-page"><div style="padding:40px; text-align:center; color:#555;">OppaRun Pro v28.27</div></div>
            <div id="sub-page-setting" class="sub-page"><div style="padding:40px; text-align:center; color:#555;">SETTINGS</div></div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map;
function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9380], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
}

function showTab(tab) {
    const isRun = (tab === 'run');
    document.getElementById('run-view').style.display = isRun ? 'flex' : 'none';
    document.getElementById('map-area').style.display = isRun ? 'block' : 'none';
    document.getElementById('history-header').style.display = isRun ? 'none' : 'flex';
    document.getElementById('history-view').style.display = isRun ? 'none' : 'flex';
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    
    if (!isRun) showSubTab('list');
}

function showSubTab(sub) {
    const pages = ['list', 'total', 'info', 'setting'];
    pages.forEach(p => {
        document.getElementById('sub-page-' + p).style.display = (p === sub ? 'flex' : 'none');
        document.getElementById('sub-tab-' + p).classList.toggle('active', p === sub);
    });
    
    // TOTAL 메뉴일 때만 상단 요약 바 노출
    document.getElementById('total-summary').style.display = (sub === 'total' ? 'grid' : 'none');
    if (sub === 'list' || sub === 'total') updateHistoryData();
}

function updateHistoryData() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tKm = 0, tSec = 0;
    const listHtml = h.map(r => {
        tKm += parseFloat(r.dist || 0);
        const pts = r.time.split(':');
        tSec += (parseInt(pts[0])*60) + parseInt(pts[1]);
        return `<div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main"><span class="h-dist-time">${r.dist}KM ${r.time}</span></div>
            <div class="h-details">
                <div class="h-det-box"><div class="h-det-val">${r.pace}</div></div>
                <div class="h-det-box"><div class="h-det-val">${r.cadence}</div></div>
                <div class="h-det-box"><div class="h-det-val">${r.kcal}</div></div>
                <div class="h-det-box"><div class="h-det-val">${r.gct || '--'} / ${r.flight || '--'}%</div></div>
            </div>
        </div>`;
    }).join('');
    
    document.getElementById('history-list').innerHTML = listHtml;
    document.getElementById('sum-dist').textContent = tKm.toFixed(2) + " KM";
    document.getElementById('sum-count').textContent = h.length;
    const hrs = Math.floor(tSec/3600); const mins = Math.floor((tSec%3600)/60); const secs = tSec%60;
    document.getElementById('sum-time').textContent = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

window.onload = initMap;
</script>
</body>
</html>
