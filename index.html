<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun Final</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --tab-height: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100dvh;
            background-color: var(--dark-bg);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [수정] 지도 높이를 적절하게 고정 (너무 크지 않게) */
        #map-container {
            height: 35vh; /* 화면의 35%만 차지하도록 설정 */
            width: 100%;
            position: relative;
            border-bottom: 1px solid #222;
        }
        #map { height: 100%; width: 100%; }

        .dashboard {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 요소들 간격 최적화 */
            background: var(--dark-bg);
        }

        .pace-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        #current-pace {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--neon-green);
            line-height: 1.1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 8px 4px;
            border-radius: 10px;
            text-align: center;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label { font-size: 0.65rem; color: #888; }
        .stat-value { font-size: 1.1rem; font-weight: bold; }
        .stat-unit { font-size: 0.65rem; color: var(--neon-green); margin-left: 2px; }

        .main-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 8px;
        }

        /* 히스토리 화면 */
        #history-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100dvh - var(--tab-height));
            background: var(--dark-bg);
            z-index: 100;
            padding: 15px;
            overflow-y: auto;
        }

        .history-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* 하단 탭 */
        .tab-bar {
            height: var(--tab-height);
            display: flex;
            background: #000;
            border-top: 1px solid #222;
        }

        .tab-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        .tab-item.active { color: var(--neon-green); }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div id="run-dashboard" class="dashboard">
        <div class="pace-card">
            <div style="color:var(--neon-green); font-size:0.75rem;">CURRENT PACE</div>
            <div id="current-pace">--'--"</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">DIST</div>
                <div class="stat-value"><span id="dist">0.00</span><span class="stat-unit">KM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TIME</div>
                <div id="time" class="stat-value">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">AVG PACE</div>
                <div id="avg-pace" class="stat-value">--'--"</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">CADENCE</div>
                <div class="stat-value"><span id="cadence">0</span><span class="stat-unit">SPM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">GCT</div>
                <div class="stat-value"><span id="gct">--</span><span class="stat-unit">MS</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">FLIGHT</div>
                <div class="stat-value"><span id="flight">--</span><span class="stat-unit">%</span></div>
            </div>
        </div>

        <button id="startBtn" class="main-btn" onclick="toggleRun()">START RUNNING</button>
    </div>

    <div id="history-screen">
        <h1 style="color:var(--neon-green); font-size:1.8rem; margin-bottom:15px;">HISTORY</h1>
        <div class="history-summary">
            <div class="stat-box"><div class="stat-label">TOTAL DIST</div><div class="stat-value">0.00 <span class="stat-unit">KM</span></div></div>
            <div class="stat-box"><div class="stat-label">WEEKLY DIST</div><div class="stat-value">0.00 <span class="stat-unit">KM</span></div></div>
            <div class="stat-box"><div class="stat-label">TOTAL RUNS</div><div class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">TOTAL KCAL</div><div class="stat-value">0</div></div>
        </div>
        <div id="history-list"><div style="color:#666; text-align:center;">NO DATA</div></div>
    </div>

    <nav class="tab-bar">
        <a href="javascript:void(0)" class="tab-item active" id="nav-run" onclick="showScreen('run')">RUN</a>
        <a href="javascript:void(0)" class="tab-item" id="nav-history" onclick="showScreen('history')">HISTORY</a>
    </nav>

    <script>
        let isRunning = false;
        let map;

        window.onload = function() {
            initMap();
            loadHistory();
        };

        function initMap() {
            // 지도 로딩 문제를 해결하기 위해 타일셋 주소를 명확히 함
            map = L.map('map').setView([37.5665, 126.9780], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            // 로딩 후 즉시 크기 재계산
            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function toggleRun() {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            btn.innerText = isRunning ? "STOP RUNNING" : "START RUNNING";
            btn.style.background = isRunning ? "#ff3333" : "#00ff66";
            if(!isRunning) saveRunData();
        }

        function showScreen(screen) {
            const hScreen = document.getElementById('history-screen');
            const rDash = document.getElementById('run-dashboard');
            const mCont = document.getElementById('map-container');
            const navRun = document.getElementById('nav-run');
            const navHistory = document.getElementById('nav-history');

            if(screen === 'history') {
                hScreen.style.display = 'block';
                rDash.style.display = 'none';
                mCont.style.display = 'none';
                navRun.classList.remove('active');
                navHistory.classList.add('active');
            } else {
                hScreen.style.display = 'none';
                rDash.style.display = 'flex';
                mCont.style.display = 'block';
                navRun.classList.add('active');
                navHistory.classList.remove('active');
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        }

        function saveRunData() {
            const d = document.getElementById('dist').innerText;
            if(parseFloat(d) <= 0) return;
            const record = { date: new Date().toLocaleString('ko-KR'), dist: d, time: document.getElementById('time').innerText };
            let history = JSON.parse(localStorage.getItem('OppaRun_Final_Data') || "[]");
            history.unshift(record);
            localStorage.setItem('OppaRun_Final_Data', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const data = localStorage.getItem('OppaRun_Final_Data');
            if(!data || data === "[]") return;
            const history = JSON.parse(data);
            list.innerHTML = history.map(item => `
                <div style="background:#1a1a1a; padding:12px; border-radius:10px; margin-bottom:8px; border-left:4px solid var(--neon-green);">
                    <div style="font-size:0.7rem; color:#888;">${item.date}</div>
                    <div style="font-size:1rem; font-weight:bold; margin-top:3px;">${item.dist} KM / ${item.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
