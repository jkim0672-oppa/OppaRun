<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; height: 100vh; background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; overflow: hidden; position: fixed; width: 100%; }
        
        /* 메인 레이아웃 3단 분리 */
        .header-section { height: 28%; width: 100%; position: relative; border-bottom: 1px solid #222; }
        .data-section { height: 50%; width: 100%; padding: 8px; display: flex; flex-direction: column; justify-content: center; }
        .control-section { height: 12%; width: 100%; padding: 0 15px; display: flex; align-items: center; }
        .tab-section { height: 10%; width: 100%; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }

        /* 지도 */
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; bottom: 0; width: 100%; text-align: center; color: #ffcc00; font-size: 10px; padding: 3px; background: rgba(0,0,0,0.6); z-index: 1000; font-weight: 800; }
        
        /* 데이터 그리드 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; height: 65px; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 90px; position: relative; cursor: pointer; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 46px; color: var(--primary); font-weight: 900; line-height: 1; }
        .dim-guide { position: absolute; bottom: 5px; right: 10px; font-size: 8px; color: #333; font-weight: 800; }

        /* 버튼 */
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* 디머 (독립 레이어) */
        #dimmer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 20000; display: none; cursor: pointer;
        }
        .dim-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        .dim-hint { color: var(--primary); font-size: 13px; font-weight: 700; opacity: 0.2; letter-spacing: 2px; }

        /* 탭 버튼 */
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body onclick="handleGlobalClick()">
    <div id="dimmer" onclick="toggleDimmer(event)">
        <div class="dim-info"><div class="dim-hint">GPS ACTIVE<br>TAP TO WAKE UP</div></div>
    </div>

    <div class="app-container">
        <div class="header-section">
            <div id="map"></div>
            <div id="status" class="status-bar">GPS INITIALIZING...</div>
        </div>

        <div id="run-view" class="data-section">
            <div class="dashboard-grid">
                <div class="card card-main" onclick="toggleDimmer(event)">
                    <div class="label" style="color:var(--primary)">PACE</div>
                    <div id="curPace" class="value-large">--'--"</div>
                    <div class="dim-guide">TAP TO DIM</div>
                </div>
                <div class="card"><div class="label">DIST</div><div id="dist" class="value">0.00</div></div>
                <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
                <div class="card"><div class="label">CAD</div><div id="cadence" class="value">0</div></div>
                <div class="card"><div class="label">GCT</div><div id="gct" class="value">--</div></div>
                <div class="card"><div class="label">FLIGHT</div><div id="flight" class="value">--</div></div>
                <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            </div>
        </div>

        <div class="control-section">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart(event)">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop(event)">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume(event)">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish(event)">FINISH</button>
            </div>
        </div>

        <div class="tab-section">
            <button id="tab-run" class="tab-btn active">RUN</button>
            <button id="tab-history" class="tab-btn" onclick="location.reload()">HISTORY</button>
        </div>
    </div>

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, wakeLock = null;
let pathCoords = [], currentSpeedKmh = 0;

async function requestWakeLock() {
    if ('wakeLock' in navigator && !wakeLock) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
}

function handleGlobalClick() { if (isRunning && !isPaused) requestWakeLock(); }

function toggleDimmer(e) {
    if (e) e.stopPropagation();
    const dimmer = document.getElementById('dimmer');
    if (isRunning) {
        dimmer.style.display = (dimmer.style.display === 'block') ? 'none' : 'block';
    }
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([33.7753, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (err) => { 
            document.getElementById('status').textContent = "GPS SEARCHING..."; 
        }, {enableHighAccuracy: true}); 
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 230) { 
        steps++; lastStepTime = now;
        let speed = currentSpeedKmh;
        document.getElementById('gct').textContent = speed > 0.5 ? Math.floor(450 - (speed * 10)) : "--";
        document.getElementById('flight').textContent = speed > 2.0 ? Math.floor(5 + (speed * 2.1)) + "%" : "--";
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused && p.coords.accuracy < 50) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        document.getElementById('status').textContent = `ACTIVE (±${p.coords.accuracy.toFixed(0)}m)`;
    } else { map.panTo(pos); document.getElementById('status').textContent = `READY (±${p.coords.accuracy.toFixed(0)}m)`; }
} 

function onStart(e) {
    if(e) e.stopPropagation();
    isRunning = true; totalDist = 0; seconds = 0; steps = 0;
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
    requestWakeLock();
} 

function onStop(e) { if(e) e.stopPropagation(); isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume(e) { if(e) e.stopPropagation(); isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 
function onFinish(e) { location.reload(); }

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
