<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.2 (Multi-Lang)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; height: 20vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-top: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 80px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 70px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        .history-nav { display: flex; gap: 8px; padding: 10px 15px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        
        /* 설정 박스 스타일 */
        .setting-box { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .metro-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        input[type=range] { flex: 1; accent-color: var(--metro-color); }

        /* 언어 선택 버튼 */
        .lang-btns { display: flex; gap: 10px; margin-top: 10px; }
        .lang-btn { flex: 1; height: 35px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 11px; font-weight: 800; }
        .lang-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0,255,136,0.1); }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map"><div id="map-inner" style="height:100%;"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label" data-lang="autoPause">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)" data-lang="curPace">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" data-lang="dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" data-lang="time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-lang="avgPace">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-lang="cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-lang="gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" data-lang="flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-lang="startBtn">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-lang="stopBtn">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()" data-lang="resumeBtn">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()" data-lang="finishBtn">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-lang="tabList">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')" data-lang="tabTotal">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')" data-lang="tabInfo">INFO</button>
        </div>

        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>

        <div id="sub-page-info" class="sub-page">
            <div class="history-list">
                <div class="setting-box" style="margin-top:15px;">
                    <h3 style="color:var(--primary); margin:0 0 10px 0; font-size:15px;" data-lang="langSet">LANGUAGE SETTING</h3>
                    <div class="lang-btns">
                        <button class="lang-btn active" id="lang-ko" onclick="setLang('ko')">한국어</button>
                        <button class="lang-btn" id="lang-en" onclick="setLang('en')">ENGLISH</button>
                    </div>
                </div>

                <div class="setting-box">
                    <h3 style="color:var(--metro-color); margin:0 0 15px 0; font-size:15px;" data-lang="metroTitle">RHYTHM ENGINE</h3>
                    <div class="metro-row">
                        <span style="font-size:12px; font-weight:800; width:40px;">BPM</span>
                        <input type="range" id="bpm-range" min="150" max="195" value="175" oninput="updateBPM(this.value)">
                        <span id="bpm-val" style="width:30px; text-align:right; font-weight:800;">175</span>
                    </div>
                    <button onclick="toggleMetronome()" id="btn-metro-main" style="width:100%; height:40px; border-radius:10px; border:none; background:var(--metro-color); color:#000; font-weight:900;" data-lang="metroBtn">START BEAT</button>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')" data-lang="navRun">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')" data-lang="navHistory">HISTORY</button>
    </div> 

<script>
// 언어 데이터
const langData = {
    ko: {
        curPace: "현재 페이스", dist: "거리", time: "시간", avgPace: "평균 페이스", cadence: "케이던스", gct: "지면 접지", flight: "공중 체공",
        startBtn: "러닝 시작", stopBtn: "일시 정지", resumeBtn: "재개", finishBtn: "종료", autoPause: "자동 일시정지",
        tabList: "기록", tabTotal: "통계", tabInfo: "설정", langSet: "언어 설정", metroTitle: "리듬 엔진 (메트로놈)", metroBtn: "박자 시작",
        navRun: "러닝", navHistory: "기록"
    },
    en: {
        curPace: "CURRENT PACE", dist: "DIST", time: "TIME", avgPace: "AVG PACE", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT",
        startBtn: "START RUNNING", stopBtn: "STOP", resumeBtn: "RESUME", finishBtn: "FINISH", autoPause: "AUTO PAUSED",
        tabList: "LIST", tabTotal: "TOTAL", tabInfo: "INFO", langSet: "LANGUAGE SETTING", metroTitle: "RHYTHM ENGINE", metroBtn: "START BEAT",
        navRun: "RUN", navHistory: "HISTORY"
    }
};

let currentLang = 'ko';
function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-lang]').forEach(el => {
        const key = el.getAttribute('data-lang');
        el.textContent = langData[lang][key];
    });
    document.getElementById('lang-ko').classList.toggle('active', lang === 'ko');
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    localStorage.setItem('oppaLang', lang);
}

// [기본 로직 - v27.1과 동일]
let map, marker, polyline, timer, audioCtx, metroTimer, metroGain;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, bpm = 175, isMetroOn = false, nextClickTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function initMap() {
    map = L.map('map-inner', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    
    // 저장된 언어 불러오기
    const savedLang = localStorage.getItem('oppaLang') || 'ko';
    setLang(savedLang);
    setTimeout(() => map.invalidateSize(), 500);
}

// ... (handleMotion, updatePosition, toggleMetronome 등 기존 함수들 유지) ...
function handleMotion(e) { if (!isRunning || isPaused || isAutoPaused) return; let acc = e.accelerationIncludingGravity; if (!acc || acc.x === null) return; let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now(); if (force > 12 && (now - lastStepTime) > 220) { steps++; lastStepTime = now; let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0; let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0; if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; } document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60); updateDynamicsColors(gct, flt); } }
function updateDynamicsColors(gct, flt) { const gDisplay = document.getElementById('gct'); const fDisplay = document.getElementById('flight'); gDisplay.textContent = gct || "--"; fDisplay.textContent = flt || "--"; let color = (currentSpeedKmh > 4.5) ? (gct >= 400 ? "#ff4444" : (gct >= 320 ? "#ffcc00" : "#00ff88")) : "#ffcc00"; gDisplay.style.color = color; fDisplay.style.color = (flt > 15) ? "#00ff88" : "#ffcc00"; }
function updatePosition(p) { const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6; marker.setLatLng(pos); if (isRunning && !isPaused) { if (currentSpeedKmh < 0.8 && !isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; } else if (currentSpeedKmh >= 0.8 && isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; } if (!isAutoPaused && p.coords.accuracy < 45) { if (lastPos) { let d = (function(p1,p2){ const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180; const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); })(lastPos, pos); if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); } } else { lastPos = pos; } document.getElementById('curPace').textContent = formatPace(currentSpeedKmh); if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600)); } } else { map.panTo(pos); } }
function toggleMetronome() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); metroGain = audioCtx.createGain(); metroGain.gain.value = 0.7; metroGain.connect(audioCtx.destination); } isMetroOn = !isMetroOn; const btn = document.getElementById('btn-metro-main'); if (isMetroOn) { btn.textContent = currentLang === 'ko' ? "박자 정지" : "STOP BEAT"; btn.style.background = "var(--danger)"; btn.style.color = "#fff"; nextClickTime = audioCtx.currentTime; scheduler(); } else { btn.textContent = currentLang === 'ko' ? "박자 시작" : "START BEAT"; btn.style.background = "var(--metro-color)"; btn.style.color = "#000"; clearTimeout(metroTimer); } }
function scheduler() { while (nextClickTime < audioCtx.currentTime + 0.1) { const osc = audioCtx.createOscillator(); const env = audioCtx.createGain(); osc.frequency.value = 1200; env.gain.setValueAtTime(0, nextClickTime); env.gain.linearRampToValueAtTime(1, nextClickTime + 0.005); env.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05); osc.connect(env); env.connect(metroGain); osc.start(nextClickTime); osc.stop(nextClickTime + 0.06); nextClickTime += 60.0 / bpm; } metroTimer = setTimeout(scheduler, 25); }
function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }
function onStart() { isRunning = true; isPaused = false; isAutoPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; gctSum = 0; flightSum = 0; dataCount = 0; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000); }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0; const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0; const avgCad = Math.round((steps/(seconds||1))*60); const now = new Date(); const record = { id: Date.now(), date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleDateString('en-US', { weekday: 'short' }), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: avgCad, kcal: Math.round(totalDist * 65), gctflt: `${avgGct}/${avgFlt}%` }; let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h)); location.reload(); }
function showTab(tab) { document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none'); document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none'); document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none'); document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : ''); document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : ''); if(tab === 'run') setTimeout(() => map.invalidateSize(), 200); }
function showSubTab(sub) { document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active')); document.getElementById('sub-tab-' + sub).classList.add('active'); document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById('sub-page-' + sub).style.display = 'flex'; if (sub === 'list') updateHistoryStats(); if (sub === 'total') updateTotalStats(); }
function updateHistoryStats() { const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); const list = document.getElementById('history-list'); list.innerHTML = h.map(r => `<div class="history-item"><div class="h-header"><span class="h-date">${r.date}</span></div><div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div><div class="h-details"><div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div><div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div><div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${r.kcal}</span></div><div class="h-det-box"><span class="h-det-label">GCT/FLT</span><span class="h-det-val" style="font-size:11px;">${r.gctflt}</span></div></div></div>`).join(''); }
function updateTotalStats() { const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); let tDist = 0, tKcal = 0; h.forEach(r => { tDist += parseFloat(r.dist); tKcal += parseInt(r.kcal); }); document.getElementById('total-stats').innerHTML = `<div class="history-item" style="border:2px solid var(--primary);"><div class="h-date">ALL-TIME STATISTICS</div><div class="h-main"><span class="h-dist" style="font-size:28px; color:var(--primary);">${tDist.toFixed(2)} KM</span></div><div class="h-details"><div class="h-det-box"><span class="h-det-label">TOTAL KCAL</span><span class="h-det-val">${tKcal}</span></div><div class="h-det-box"><span class="h-det-label">RUNS</span><span class="h-det-val">${h.length}</span></div></div></div>`; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
