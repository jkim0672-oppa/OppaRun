<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Final Perfection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* 화면 전체를 꽉 채우고 요소들이 밀리지 않게 설정 */
        .app-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* 1. 지도 영역 (비율 유지) */
        #map { flex: 1.5; border-bottom: 1px solid #333; }
        
        /* 2. GPS 바 */
        .gps-status { background: #000; color: #FFD700; text-align: center; padding: 6px; font-size: 0.75rem; font-weight: bold; border-bottom: 1px solid #222; text-transform: uppercase; }

        /* 3. 대시보드 (오빠 디자인 비율) */
        .dashboard { flex: 2.5; display: flex; flex-direction: column; padding: 10px 15px; gap: 8px; justify-content: space-around; }

        .row { display: flex; gap: 10px; }
        .box { background: #111; border-radius: 12px; flex: 1; padding: 12px 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 0.6rem; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 1.5rem; font-weight: bold; }
        .unit { font-size: 0.7rem; color: #00FF00; margin-left: 2px; }

        /* 중앙 페이스 박스 */
        .pace-box { 
            background: #000; border: 1.5px solid #00FF00; border-radius: 12px; 
            padding: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .pace-box .label { color: #00FF00; font-size: 0.65rem; }
        .pace-box .value { font-size: 2.4rem; color: #00FF00; line-height: 1; margin: 5px 0; }
        .kcal-text { font-size: 0.8rem; color: #666; }

        /* 버튼 영역 */
        .controls-row { display: flex; justify-content: space-around; align-items: center; padding: 5px 0; }
        .start-btn { 
            width: 80px; height: 80px; background: #FF453A; border-radius: 50%; 
            font-weight: bold; font-size: 1rem; color: #fff; border: none;
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.4);
        }

        /* 4. 하단 탭 메뉴 (여기가 포인트!) */
        .tab-menu { 
            display: flex; 
            border-top: 1px solid #222; 
            padding: 15px 0; 
            background: #000;
        }
        .tab-item { flex: 1; text-align: center; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
        .tab-item.active { color: #00FF00; }
        .tab-item.inactive { color: #444; }

        /* 히스토리창 */
        #historyOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="map"></div>
    
    <div class="gps-status" id="gpsStatus">GPS READY</div>

    <div class="dashboard">
        <div class="row">
            <div class="box">
                <div class="label">Distance</div>
                <div class="value" id="distDisplay">0.00<span class="unit">KM</span></div>
            </div>
            <div class="box">
                <div class="label">Time</div>
                <div class="value" id="timeDisplay">00:00:00</div>
            </div>
        </div>

        <div class="pace-box">
            <div class="label">CURRENT PACE</div>
            <div class="value" id="paceDisplay">--'--"</div>
            <div id="kcalDisplay" class="kcal-text">0 kcal</div>
        </div>

        <div class="controls-row">
            <div style="text-align: center;">
                <div class="label" style="font-size: 0.55rem;">AVG PACE (TOTAL)</div>
                <div id="avgPaceDisplay" class="value" style="font-size: 1.1rem;">--'--"</div>
            </div>

            <button class="start-btn" id="mainBtn" onclick="toggleRun()">START</button>

            <div style="text-align: center;">
                <div class="label">CADENCE</div>
                <div id="cadenceDisplay" class="value" style="font-size: 1.1rem;">0<span class="unit">SPM</span></div>
            </div>
        </div>
    </div>

    <div class="tab-menu">
        <div class="tab-item active">RUNNING</div>
        <div class="tab-item inactive" onclick="showHistory()">HISTORY</div>
    </div>
</div>

<div id="historyOverlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #222; padding-bottom:10px;">
        <h2 style="color:#00FF00; margin:0; font-size:1.2rem;">HISTORY</h2>
        <button onclick="closeHistory()" style="background:none; border:1px solid #444; color:#fff; padding:5px 12px; border-radius:8px; font-size:0.8rem;">CLOSE</button>
    </div>
    <div id="historyList"></div>
</div>

<script>
    let map, path, watchId, timerInterval, startTime;
    let running = false, distance = 0, lastPos = null;
    const weight = 75;

    // 지도 설정
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/16/{x}/{y}.png').addTo(map);
    path = L.polyline([], { color: '#00FF00', weight: 4 }).addTo(map);

    function toggleRun() {
        const btn = document.getElementById('mainBtn');
        if (!running) {
            running = true;
            btn.innerText = "STOP";
            btn.style.background = "#444";
            distance = 0; lastPos = null; path.setLatLngs([]);
            startTime = Date.now();
            timerInterval = setInterval(updateUI, 1000);
            startTracking();
        } else {
            if(confirm("Finish and save?")) stopRun();
        }
    }

    function startTracking() {
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            document.getElementById('gpsStatus').innerText = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
            const currentPos = [latitude, longitude];
            if (lastPos && map.distance(lastPos, currentPos) > 2) {
                distance += map.distance(lastPos, currentPos);
                path.addLatLng(currentPos);
                map.panTo(currentPos);
            }
            lastPos = currentPos;
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `00:${m}:${s}`;
        const distKm = (distance / 1000).toFixed(2);
        document.getElementById('distDisplay').innerHTML = `${distKm}<span class="unit">KM</span>`;
        document.getElementById('kcalDisplay').innerText = `${(weight * distKm).toFixed(1)} kcal`;
    }

    function stopRun() {
        running = false;
        clearInterval(timerInterval);
        navigator.geolocation.clearWatch(watchId);
        const record = { date: new Date().toLocaleString(), dist: (distance/1000).toFixed(2)+"KM", time: document.getElementById('timeDisplay').innerText };
        let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        history.unshift(record);
        localStorage.setItem('runHistory', JSON.stringify(history));
        location.reload(); 
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        document.getElementById('historyList').innerHTML = history.length ? history.map((item, i) => `
            <div style="background:#111; padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid #222; display:flex; justify-content:space-between; align-items:center;">
                <div><div style="font-size:0.65rem; color:#666;">${item.date}</div><div style="font-size:1rem; font-weight:bold;">${item.dist} / ${item.time}</div></div>
                <div onclick="deleteHistory(${i})" style="color:#FF453A; font-weight:bold; font-size:1.1rem; padding:10px;">✕</div>
            </div>`).join('') : '<div style="text-align:center; color:#444; margin-top:50px;">No records yet.</div>';
        document.getElementById('historyOverlay').style.display = 'block';
    }

    function deleteHistory(i) {
        if (confirm('Delete this record?')) {
            let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
            history.splice(i, 1);
            localStorage.setItem('runHistory', JSON.stringify(history));
            showHistory();
        }
    }
    function closeHistory() { document.getElementById('historyOverlay').style.display = 'none'; }
</script>
</body>
</html>
