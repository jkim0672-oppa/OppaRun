<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.24 (Original Reconstruction)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text: #fff; --danger: #ff4444; --warning: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; letter-spacing: -0.5px; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 상단 지도 & 상태바 */
        #map-container { height: 18vh; min-height: 120px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        /* 히스토리 서브 탭 (LIST, TOTAL, INFO, SETTINGS) */
        .sub-tabs { display: flex; gap: 5px; padding: 10px; background: #000; }
        .sub-tab-btn { flex: 1; padding: 12px 0; border-radius: 8px; border: none; background: #1a1a1a; color: #555; font-size: 10px; font-weight: 900; }
        .sub-tab-btn.active { background: var(--primary); color: #000; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 메인 대시보드 (v28.12 3열 그리드 완벽 복구) */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; position: relative; min-height: 70px; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 105px; }
        .dim-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 12px; background: #1a1a1a; border: 1px solid #333; color: #555; font-size: 11px; font-weight: 900; }
        
        .label { font-size: 10px; color: #666; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 54px; color: var(--primary); font-weight: 900; }
        .unit-small { font-size: 11px; color: var(--primary); margin-left: 2px; }

        /* 히스토리 리스트 (756.jpg 디테일 반영) */
        .history-list { padding: 0 10px; overflow-y: auto; flex: 1; padding-bottom: 90px; }
        .history-item { background: var(--card-bg); padding: 18px; border: 1px solid #1f1f1f; border-radius: 20px; margin-top: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 800; margin-bottom: 6px; }
        .h-main { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .h-dist-box { display: flex; align-items: baseline; gap: 5px; }
        .h-dist { font-size: 24px; font-weight: 900; }
        .h-time { font-size: 20px; font-weight: 700; color: #fff; }
        .h-btns { display: flex; gap: 8px; }
        .h-btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 900; border: none; }
        .btn-route { background: rgba(0,255,136,0.1); color: var(--primary); border: 1px solid var(--primary); }
        .btn-diag { background: #1a1a1a; color: #4477ff; border: 1px solid #2244aa; }

        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; padding-top: 12px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 9px; color: #444; font-weight: 900; margin-bottom: 2px; }
        .h-det-val { font-size: 13px; font-weight: 800; color: #ccc; }

        /* 하단 탭바 (RUN, FORM, HISTORY, SHARE) */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; border-top: 1px solid #222; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 14px; font-weight: 900; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); }

        /* 팝업 및 디머 */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; justify-content: center; align-items: center; }
        #modal-box { background: #000; border: 2.5px solid var(--primary); border-radius: 28px; width: 85%; max-width: 310px; padding: 35px; text-align: center; }
        #dimmer-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:black; opacity:0; pointer-events:none; z-index:9999; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="dimmer-screen"></div>
    <div id="modal-overlay">
        <div id="modal-box">
            <div style="color:var(--danger); font-size:20px; font-weight: 900; margin-bottom:12px;">DELETE</div>
            <div style="font-size:16px; color:#bbb; margin-bottom:30px; font-weight:600;">기록을 삭제할까요?</div>
            <div style="display:flex; gap:15px;">
                <button style="flex:1; padding:16px; border-radius:18px; border:none; background:#222; color:#fff; font-weight:900;" onclick="closeModal()">취소</button>
                <button id="confirm-del" style="flex:1; padding:16px; border-radius:18px; border:none; background:var(--danger); color:#fff; font-weight:900;">삭제</button>
            </div>
        </div>
    </div>

    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>

    <div id="run-view" class="main-content">
        <div id="auto-pause-banner" style="display:none; background:var(--danger); color:#fff; text-align:center; font-size:10px; font-weight:900; padding:3px;">AUTO PAUSED</div>
        <div class="dashboard">
            <div class="card card-main">
                <div id="pace-label" class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="dim-btn" onclick="toggleDim()">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span> <span class="unit-small">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div id="gct" class="value">-- <span style="font-size:9px">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div id="flight" class="value">-- <span style="font-size:9px">%</span></div></div>
        </div>
        <div style="padding: 20px; display: flex; justify-content: center; margin-top: auto; margin-bottom: 80px;">
            <button id="btn-start" style="width:100%; height:65px; border-radius:33px; border:none; background:var(--primary); color:#000; font-weight:900; font-size:24px;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" style="width:100%; height:65px; border-radius:33px; border:none; background:var(--danger); color:#fff; font-weight:900; font-size:24px; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="sub-tabs">
            <button class="sub-tab-btn active">LIST</button>
            <button class="sub-tab-btn">TOTAL</button>
            <button class="sub-tab-btn">INFO</button>
            <button class="sub-tab-btn">SETTINGS</button>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button class="tab-btn">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
        <button class="tab-btn">SHARE</button>
    </div>

<script>
let map, marker, polyline, isRunning=false, isAutoPaused=false, seconds=0, timer, totalDist=0, lastPos=null, pathCoords=[];
let touchStartX = 0, currentDelId = null, lastMoveTime = Date.now();

function initMap() {
    map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7, -117.9], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0]).addTo(map);
    polyline = L.polyline([], {color:'#00ff88', weight:6}).addTo(map);
    
    navigator.geolocation.watchPosition(p => {
        const pos = [p.coords.latitude, p.coords.longitude];
        const acc = Math.round(p.coords.accuracy);
        document.getElementById('status').textContent = `GPS ACTIVE (${acc}m)`;
        marker.setLatLng(pos);
        if(isRunning) {
            if(lastPos) {
                let d = map.distance(lastPos, pos)/1000;
                if(d > 0.001) {
                    if(isAutoPaused) resumeFromAutoPause();
                    totalDist+=d; document.getElementById('dist').textContent=totalDist.toFixed(2); 
                    lastPos=pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords);
                    lastMoveTime = Date.now();
                }
            } else lastPos = pos;
        } else map.panTo(pos);
    }, null, {enableHighAccuracy:true});
}

setInterval(() => {
    if(isRunning && !isAutoPaused && (Date.now() - lastMoveTime > 7000)) {
        isAutoPaused = true;
        document.getElementById('auto-pause-banner').style.display = 'block';
        document.getElementById('pace-label').textContent = 'AUTO PAUSED';
        document.getElementById('pace-label').style.color = 'var(--danger)';
    }
}, 1000);

function resumeFromAutoPause() {
    isAutoPaused = false;
    lastMoveTime = Date.now();
    document.getElementById('auto-pause-banner').style.display = 'none';
    document.getElementById('pace-label').textContent = 'PACE';
    document.getElementById('pace-label').style.color = 'var(--primary)';
}

function renderHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const container = document.getElementById('history-list');
    container.innerHTML = h.map(r => `
        <div class="history-item" id="item-${r.id}" ontouchstart="ts(event, ${r.id})" ontouchmove="tm(event, ${r.id})" ontouchend="te(event, ${r.id})">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <div class="h-dist-box"><span class="h-dist">${r.dist}</span><span class="unit-small">KM</span></div>
                <span class="h-time">${r.time}</span>
                <div class="h-btns"><button class="h-btn btn-route">ROUTE</button><button class="h-btn btn-diag">진단</button></div>
            </div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace || "--'--"}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cad || '0'}</span></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">--</span></div>
                <div class="h-det-box"><span class="h-det-label">GCT</span><span class="h-det-val">--</span></div>
            </div>
        </div>
    `).join('');
}

function ts(e, id) { touchStartX = e.touches[0].clientX; }
function tm(e, id) {
    let diff = touchStartX - e.touches[0].clientX;
    const el = document.getElementById(`item-${id}`);
    if(diff > 0) el.style.transform = `translateX(${-diff}px)`;
}
function te(e, id) {
    let diff = touchStartX - e.changedTouches[0].clientX;
    const el = document.getElementById(`item-${id}`);
    if(diff > 120) {
        currentDelId = id; document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('confirm-del').onclick = () => {
            let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            localStorage.setItem('oppaRunHistory', JSON.stringify(h.filter(x => x.id !== id)));
            closeModal(); renderHistory();
        };
    } else el.style.transform = 'translateX(0)';
}

function onStart() { isRunning=true; isAutoPaused=false; lastMoveTime=Date.now(); document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='block'; timer=setInterval(()=>{ if(!isAutoPaused) seconds++; document.getElementById('time').textContent=new Date(seconds*1000).toISOString().substr(14,5)},1000); }
function onStop() { isRunning=false; clearInterval(timer); const rec={id:Date.now(), date:new Date().toLocaleString('en-US',{month:'short',day:'numeric',weekday:'short'}), dist:totalDist.toFixed(2), time:document.getElementById('time').textContent, pace:document.getElementById('curPace').textContent, cad:document.getElementById('cadence').textContent}; let h=JSON.parse(localStorage.getItem('oppaRunHistory')||"[]"); h.unshift(rec); localStorage.setItem('oppaRunHistory',JSON.stringify(h)); location.reload(); }
function showTab(t) { document.getElementById('run-view').style.display=t==='run'?'flex':'none'; document.getElementById('history-view').style.display=t==='history'?'flex':'none'; document.getElementById('tab-run').classList.toggle('active',t==='run'); document.getElementById('tab-history').classList.toggle('active',t==='history'); if(t==='history')renderHistory(); }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; if(currentDelId) { const el = document.getElementById(`item-${currentDelId}`); if(el) el.style.transform = 'translateX(0)'; } }
function toggleDim() { let s = document.getElementById('dimmer-screen'); s.style.opacity = s.style.opacity === "0.7" ? "0" : "0.7"; }
window.onload = initMap;
</script>
</body>
</html>
