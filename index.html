<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v15.2.3 - High Sensitivity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        #map { height: 30vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #121212; font-weight: bold; border-bottom: 1px solid #222; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; padding-bottom: 130px; overflow-y: auto; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; padding: 12px 0; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 22px; font-weight: 900; color: #fff; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 2px; }
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.06); padding: 18px 0; }
        .value-large { font-size: 48px; color: var(--primary); line-height: 1; }
        .km-marker { background: var(--primary); color: #000; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 900; border: 1px solid #000; white-space: nowrap; text-align: center; }
        .controls { position: absolute; bottom: 90px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        #main-btn { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; }
        #after-stop { display: none; gap: 12px; }
        .btn-action { width: 110px; height: 48px; border: none; font-weight: 800; border-radius: 24px; font-size: 14px; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; min-height: 35vh; }
        #split-info { flex: 1.5; background: #000; overflow-y: auto; padding: 20px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<video id="no-sleep-video" loop playsinline muted style="display:none;"><source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAZptb292AAAAbG12aGQAAAAA3u99cN7vfXAABAAAAAQAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAABidHJhawAAAFx0a2hkAAAAAd7vfXDe731wAAAAAQAAAAEAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAABZW1kaWEAAAAgbWRoZAAAAADe731w3u99cAAABAAAAAQAVf7fAAAAACNoZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVxtaW5mAAAAFHZtbmQAAAAEAAAAAAhAdXJsIAAAAAEAAAFGc3RibAAAAGRzdHNkAAAAAAAAAAEAAABUbXA0dgAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAIAAgASAAAAEgAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABj//wAAACRhdmMxR0AIAAgAAABIAEgAAAAAAAAAAAAAAAAAABhAAr8AAAACHHBhc3AAAAABAAAAAQAAABhzdHRzAAAAAAAAAAEAAAABAAAEAAAAABxzdHRzAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzeAAAAAAAAAEAAAABAAAAFHN0c3oAAAAAAAAAAAAAAAEAAAAUc3RjbwAAAAAAAAABAAAALAAAAA=="></video>

<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:65px; background:var(--primary); border:none; font-weight:900; color:#000;" onclick="closeModal()">BACK TO LIST</button>
</div>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card card-highlight">
            <div class="label" style="color:var(--primary)">CURRENT PACE (REAL-TIME)</div>
            <div class="value-large" id="curPace">--'--"</div>
        </div>
        <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">CALORIES</div><div class="value"><span id="kcal">0</span><span class="unit">KCAL</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0</div></div>
        <div class="card"><div class="label">GCT/FLIGHT</div><div class="value" style="font-size:16px;"><span id="gct">240</span>/<span id="flight">100</span><span class="unit">MS</span></div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; height:100vh; flex-direction:column;">
    <div style="padding:40px 20px 10px;"><h2 style="color:var(--primary); margin:0; font-size:24px; font-weight:900;">ACTIVITY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:80px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">RUNNING</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, stepCount = 0, lastStepTime = 0, timerInterval, wakeLock = null;
let recentPoints = []; 

async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR'; window.speechSynthesis.speak(msg);
    }
}

function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy, speed } = pos.coords;
        if (accuracy > 25) return;
        
        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        document.getElementById('status').textContent = "GPS ACTIVE";

        if (isRunning) {
            const currentSpeedKmh = (speed || 0) * 3.6;
            
            // [감도 조정] 0.5km/h 이상이면 무조건 재시작 로직 작동
            if (currentSpeedKmh < 0.5 && !isPaused) {
                isPaused = true;
                speak("일시 정지");
            } 
            
            // 이중 체크: 속도가 낮아도 이전 위치에서 2m 이상 움직이면 재시작
            let moveDist = 0;
            if (lastPos) {
                moveDist = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
            }

            if ((currentSpeedKmh >= 0.5 || moveDist > 0.002) && isPaused) {
                isPaused = false;
                speak("러닝 재개");
            }

            if (!isPaused && lastPos) {
                const d = moveDist;
                if (d > 0.002 && d < 0.04) { 
                    const prevDist = totalDistance;
                    totalDistance += d;
                    if (Math.floor(totalDistance) > Math.floor(prevDist)) {
                        const curAvgP = document.getElementById('avgPace').textContent;
                        splits.push({ km: Math.floor(totalDistance), pace: curAvgP, latlng: [latitude, longitude] });
                        speak(`${Math.floor(totalDistance)} 킬로미터, 페이스 ${curAvgP.replace("'", "분 ")}`);
                    }
                    updateUI();
                }
            }
            if (!isPaused) {
                lastPos = newPos;
                pathArray.push(newPos);
                if (pathLine) pathLine.setLatLngs(pathArray);
            }
        }
    }, e => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    document.getElementById('kcal').textContent = Math.round(totalDistance * 70 * 1.05);
    
    if (totalDistance > 0.01) {
        const avgP = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = formatPace(avgP);
    }

    const now = Date.now();
    recentPoints.push({ time: now, dist: totalDistance });
    recentPoints = recentPoints.filter(p => now - p.time <= 10000);

    if (recentPoints.length > 2) {
        const earliest = recentPoints[0];
        const latest = recentPoints[recentPoints.length - 1];
        const distDiff = latest.dist - earliest.dist;
        const timeDiffMin = (latest.time - earliest.time) / 1000 / 60;
        if (distDiff > 0.005) { // 5m 이상 이동 시 계산
            const curP = timeDiffMin / distDiff;
            if (curP >= 2.0 && curP <= 20.0) document.getElementById('curPace').textContent = formatPace(curP);
        } else {
            document.getElementById('curPace').textContent = "--'--\"";
        }
    }
}

function formatPace(paceFloat) {
    if (!isFinite(paceFloat) || paceFloat <= 0) return "0'00\"";
    const min = Math.floor(paceFloat);
    const sec = String(Math.floor((paceFloat - min) * 60)).padStart(2, '0');
    return `${min}'${sec}"`;
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true; isPaused = false;
        requestWakeLock();
        document.getElementById('no-sleep-video').play().catch(()=>{});
        timerInterval = setInterval(() => { if(isRunning && !isPaused) { elapsedSeconds++; updateTimerUI(); } }, 1000);
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#444';
        speak("운동을 시작합니다.");
    } else {
        isPaused = true;
        document.getElementById('main-btn').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
    }
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

function resumeTracking() {
    isPaused = false; requestWakeLock();
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
    speak("운동을 다시 시작합니다.");
}

function saveData() {
    const record = {
        id: Date.now(), date: new Date().toLocaleString('ko-KR'),
        dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        kcal: document.getElementById('kcal').textContent,
        cadence: document.getElementById('cadence').textContent, 
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent, 
        route: pathArray, splits: splits
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-home').classList.toggle('active', t === 'home');
    document.getElementById('tab-history').classList.toggle('active', t === 'history');
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-container').innerHTML = history.length ? history.map(h => `
        <div class="history-card" onclick="showDetail(${h.id})">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="font-size:11px; color:var(--primary); font-weight:800;">${h.date}</span>
                <span style="color:var(--danger); font-size:12px;" onclick="event.stopPropagation(); deleteRecord(${h.id})">DELETE</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
                <div><div class="label">DIST</div><div style="font-size:18px; font-weight:900;">${h.dist}km</div></div>
                <div><div class="label">PACE</div><div style="font-size:18px; font-weight:900;">${h.pace}</div></div>
                <div><div class="label">KCAL</div><div style="font-size:18px; font-weight:900;">${h.kcal}</div></div>
            </div>
        </div>`).join('') : "<div style='text-align:center; color:#555; padding-top:50px;'>기록이 없습니다.</div>";
}

function deleteRecord(id) {
    if(confirm("기록을 삭제할까요?")) {
        let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
        localStorage.setItem('OppaRun_Data', JSON.stringify(history.filter(h => h.id !== id)));
        loadHistory();
    }
}

function showDetail(id) {
    const record = JSON.parse(localStorage.getItem('OppaRun_Data')).find(h => h.id === id);
    document.getElementById('map-modal').style.display = 'flex';
    setTimeout(() => {
        let hMap = L.map('history-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        if(record.route && record.route.length > 0) {
            let pl = L.polyline(record.route, {color: '#00ff88', weight: 5}).addTo(hMap);
            hMap.fitBounds(pl.getBounds(), {padding: [40, 40]});
            if(record.splits) {
                record.splits.forEach(s => {
                    if(s.latlng) {
                        const kmLabel = L.divIcon({
                            className: 'km-marker', html: `<div>${s.km}km<br>${s.pace}</div>`,
                            iconSize: [45, 25], iconAnchor: [22, 12]
                        });
                        L.marker(s.latlng, {icon: kmLabel}).addTo(hMap);
                    }
                });
            }
        }
        document.getElementById('split-info').innerHTML = `
            <h2 style="color:var(--primary); margin:0 0 15px 0;">SUMMARY</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
                <div class="card"><div class="label">DISTANCE</div><div class="value">${record.dist}km</div></div>
                <div class="card"><div class="label">TIME</div><div class="value">${record.time}</div></div>
                <div class="card"><div class="label">AVG PACE</div><div class="value">${record.pace}</div></div>
                <div class="card"><div class="label">CALORIES</div><div class="value">${record.kcal}</div></div>
            </div>
            <h3 style="color:#888; border-bottom:1px solid #222; padding-bottom:5px;">SPLITS (1KM)</h3>
            ` + (record.splits && record.splits.length > 0 ? record.splits.map(s => `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #111;"><span>${s.km}km</span><b style="color:var(--primary)">${s.pace}</b></div>`).join('') : "<div style='color:#444; padding:10px;'>기록 없음</div>");
    }, 200);
}

function closeModal() { document.getElementById('map-modal').style.display = 'none'; }
function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
}
window.onload = () => { initMaps(); startTracking(); };

window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused) return;
    const mag = Math.sqrt(e.accelerationIncludingGravity.x**2 + e.accelerationIncludingGravity.y**2 + e.accelerationIncludingGravity.z**2);
    if (mag > 12.0) { // 감도 살짝 상향
        const now = Date.now();
        if (now - lastStepTime > 230) {
            stepCount++; lastStepTime = now;
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
        }
    }
});
</script>
</body>
</html>
