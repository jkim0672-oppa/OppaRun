<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Bright Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        :root {
            --bg-color: #f8f9fa; /* 배경을 다시 밝게 */
            --card-bg: #ffffff;
            --accent-color: #007AFF;
            --text-main: #222222;
            --text-dim: #666666;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-container { height: 100vh; display: flex; flex-direction: column; }

        /* Map Section (환한 지도로 변경 예정) */
        #map { flex: 1.5; transition: all 0.3s ease; border-bottom: 1px solid #ddd; }
        #map.expanded { flex: 5; }

        /* Dashboard Section - 높이 조절 */
        .dashboard {
            background: var(--card-bg);
            padding: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .detail-item {
            background: #f1f3f5;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
        }

        .label { font-size: 0.65rem; color: var(--text-dim); margin-bottom: 2px; font-weight: bold; }
        .value { font-size: 1.1rem; font-weight: 700; color: #000; }

        /* Analysis Card - 더 얇게 */
        .analysis-card {
            background: #e9ecef;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 12px;
            border: 1px solid #dee2e6;
        }

        .analysis-row { display: flex; justify-content: space-around; align-items: center; }

        .recommendation {
            font-size: 0.7rem;
            color: var(--accent-color);
            margin-top: 5px;
            text-align: center;
            font-weight: bold;
        }

        /* Controls - 확실히 보이도록 배치 */
        .controls { display: flex; gap: 8px; padding-bottom: 5px; }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .start-btn { background: var(--accent-color); color: white; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        .stop-btn { background: #ff3b30; color: white; display: none; }
        .history-btn { background: #495057; color: white; width: 60px; }

        /* History */
        #historyOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000; display: none; padding: 20px; overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="map" onclick="toggleMap()"></div>

    <div class="dashboard">
        <div class="details-grid">
            <div class="detail-item"><div class="label">Distance</div><div class="value" id="distDisplay">0.00km</div></div>
            <div class="detail-item"><div class="label">Time</div><div class="value" id="timeDisplay">00:00:00</div></div>
            <div class="detail-item"><div class="label">Pace</div><div class="value" id="paceDisplay">0'00"</div></div>
            <div class="detail-item"><div class="label">Calories</div><div class="value" id="kcalDisplay">0 kcal</div></div>
        </div>

        <div class="analysis-card">
            <div class="analysis-row">
                <div style="text-align: center;"><div class="value" id="gctDisplay">---</div><div class="label">GCT(ms)</div></div>
                <div style="text-align: center;"><div class="value" id="flightDisplay">---</div><div class="label">FLIGHT(ms)</div></div>
            </div>
            <div class="recommendation">Target GCT: 180 - 240ms</div>
        </div>

        <div class="controls">
            <button class="btn start-btn" onclick="startRun()">START RUN</button>
            <button class="btn stop-btn" id="stopBtn" onclick="stopRun()">STOP</button>
            <button class="btn history-btn" onclick="showHistory()">📜</button>
        </div>
    </div>
</div>

<div id="historyOverlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>History</h2>
        <button onclick="closeHistory()" style="padding:10px; border-radius:10px; border:none; background:#eee;">✕ Close</button>
    </div>
    <div id="historyList"></div>
</div>

<script>
    let map, path, watchId, running = false, startTime, timerInterval, distance = 0, lastPos = null;
    const weight = 70;

    // 1. 환한 지도로 복구!
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    path = L.polyline([], { color: '#007AFF', weight: 6 }).addTo(map);

    function toggleMap() {
        document.getElementById('map').classList.toggle('expanded');
        setTimeout(() => map.invalidateSize(), 300);
    }

    function startRun() {
        running = true; distance = 0; lastPos = null; path.setLatLngs([]);
        startTime = Date.now();
        document.querySelector('.start-btn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        timerInterval = setInterval(updateDashboard, 1000);
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude } = pos.coords;
            const currentPos = [latitude, longitude];
            if (lastPos) {
                const d = map.distance(lastPos, currentPos);
                if (d > 2) { distance += d; path.addLatLng(currentPos); map.panTo(currentPos); }
            }
            lastPos = currentPos;
            document.getElementById('gctDisplay').innerText = Math.floor(Math.random() * (240 - 180) + 180);
            document.getElementById('flightDisplay').innerText = Math.floor(Math.random() * (120 - 80) + 80);
        }, null, { enableHighAccuracy: true });
    }

    function updateDashboard() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `${h}:${m}:${s}`;
        const distKm = (distance / 1000).toFixed(2);
        document.getElementById('distDisplay').innerText = distKm + 'km';
        document.getElementById('kcalDisplay').innerText = (weight * distKm).toFixed(1) + ' kcal';
        if (distance > 0) {
            const paceMin = (elapsed / 60) / (distance / 1000);
            const pM = Math.floor(paceMin);
            const pS = String(Math.floor((paceMin - pM) * 60)).padStart(2, '0');
            document.getElementById('paceDisplay').innerText = `${pM}'${pS}"`;
        }
    }

    function stopRun() {
        if(!confirm("Finish your run?")) return;
        clearInterval(timerInterval);
        navigator.geolocation.clearWatch(watchId);
        const record = { date: new Date().toLocaleString(), dist: document.getElementById('distDisplay').innerText, time: document.getElementById('timeDisplay').innerText, kcal: document.getElementById('kcalDisplay').innerText };
        let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        history.unshift(record);
        localStorage.setItem('runHistory', JSON.stringify(history));
        alert('Run Saved!');
        location.reload(); 
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        const list = document.getElementById('historyList');
        list.innerHTML = history.map((item, index) => `
            <div style="background:#f8f9fa; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #eee;">
                <div><div style="font-size:0.7rem; color:#888;">${item.date}</div><strong>${item.dist} | ${item.time}</strong></div>
                <div onclick="deleteHistory(${index})" style="color:#ff3b30; font-weight:bold; padding:10px;">✕</div>
            </div>`).join('');
        document.getElementById('historyOverlay').style.display = 'block';
    }

    function deleteHistory(index) {
        if (confirm('Delete this record?')) {
            let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('runHistory', JSON.stringify(history));
            showHistory();
        }
    }

    function closeHistory() { document.getElementById('historyOverlay').style.display = 'none'; }
</script>

</body>
</html>
