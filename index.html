<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 지도 및 상태바 영역 */
        #map-area { flex-shrink: 0; height: 20vh; min-height: 160px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 800; border-top: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 그리드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 90px; position: relative; margin-bottom: 2px; }
        .auto-pause-label { position: absolute; top: 8px; right: 12px; font-size: 10px; color: #fff; font-weight: 900; background: var(--danger); padding: 3px 8px; border-radius: 6px; display: none; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 44px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 하단 컨트롤 및 버튼 */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 85px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; transition: transform 0.1s; }
        .btn-act:active { transform: scale(0.96); }

        /* 기록 탭 서브 네비게이션 */
        .history-nav { display: flex; gap: 8px; padding: 12px 15px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 12px; font-size: 13px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #1f1f1f; }
        .h-main { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0; }
        .h-dist { font-size: 24px; font-weight: 900; color: #fff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; pt: 10px; }
        .h-det-label { font-size: 8px; color: var(--text-dim); display: block; }
        .h-det-val { font-size: 12px; font-weight: 800; color: #eee; }

        /* 설정 박스 */
        .setting-box { background: #1a1a1a; padding: 18px; border-radius: 15px; margin: 15px 12px; border: 1px solid #333; }
        .lang-btns { display: flex; gap: 10px; margin-top: 12px; }
        .lang-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-weight: 800; }
        .lang-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0,255,136,0.1); }

        /* 탭 바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.5); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map"><div id="map-inner" style="height:100%;"></div></div>
        <div id="status" class="status-bar">지도를 읽고 있습니다...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label" data-lang="autoPause">자동 일시정지</div>
                <div class="label" style="color:var(--primary)" data-lang="curPace">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" data-lang="dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" data-lang="time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-lang="avgPace">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-lang="cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-lang="gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" data-lang="flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-lang="startBtn">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-lang="stopBtn">일시 정지</button>
            <div id="after-stop" style="display:none; gap:12px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()" data-lang="resumeBtn">재개</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()" data-lang="finishBtn">종료</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-lang="tabList">기록</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')" data-lang="tabTotal">통계</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')" data-lang="tabInfo">설정</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="setting-box">
                <h3 style="color:var(--primary); margin:0 0 12px 0; font-size:16px;" data-lang="langSet">언어 설정</h3>
                <div class="lang-btns">
                    <button class="lang-btn active" id="lang-ko" onclick="setLang('ko')">한국어</button>
                    <button class="lang-btn" id="lang-en" onclick="setLang('en')">ENGLISH</button>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')" data-lang="navRun">러닝</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')" data-lang="navHistory">기록</button>
    </div> 

<script>
const langData = {
    ko: {
        curPace: "현재 페이스", dist: "거리", time: "시간", avgPace: "평균 페이스", cadence: "케이던스", gct: "지면 접지", flight: "공중 체공",
        startBtn: "러닝 시작", stopBtn: "일시 정지", resumeBtn: "재개", finishBtn: "종료", autoPause: "자동 일시정지",
        tabList: "기록", tabTotal: "통계", tabInfo: "설정", langSet: "언어 설정",
        navRun: "러닝", navHistory: "기록", loading: "지도를 읽고 있습니다...", ready: "러닝 준비 완료"
    },
    en: {
        curPace: "CURRENT PACE", dist: "DIST", time: "TIME", avgPace: "AVG PACE", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT",
        startBtn: "START RUNNING", stopBtn: "STOP", resumeBtn: "RESUME", finishBtn: "FINISH", autoPause: "AUTO PAUSED",
        tabList: "LIST", tabTotal: "TOTAL", tabInfo: "INFO", langSet: "LANGUAGE SETTING",
        navRun: "RUN", navHistory: "HISTORY", loading: "LOADING MAP...", ready: "READY TO RUN"
    }
};

let currentLang = 'ko';
let map, marker, polyline, timer;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-lang]').forEach(el => {
        const key = el.getAttribute('data-lang');
        if(langData[lang][key]) el.textContent = langData[lang][key];
    });
    document.getElementById('lang-ko').classList.toggle('active', lang === 'ko');
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    localStorage.setItem('oppaLang', lang);
}

function initMap() {
    map = L.map('map-inner', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 6, opacity: 0.8}).addTo(map);
    
    navigator.geolocation.watchPosition(updatePosition, (err) => {
        document.getElementById('status').textContent = "GPS ERROR: " + err.message;
    }, {enableHighAccuracy: true});
    
    window.addEventListener('devicemotion', handleMotion);
    const savedLang = localStorage.getItem('oppaLang') || 'ko';
    setLang(savedLang);
    setTimeout(() => map.invalidateSize(), 500);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    
    // [v27.3 핵심] GPS 상태바 업데이트
    const statusEl = document.getElementById('status');
    if (acc > 25) {
        statusEl.textContent = `${langData[currentLang].loading} (오차: ±${acc}m)`;
        statusEl.style.color = "var(--warning)";
    } else {
        statusEl.textContent = `${langData[currentLang].ready} (오차: ±${acc}m)`;
        statusEl.style.color = "var(--primary)";
    }

    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) {
            isAutoPaused = true;
            document.getElementById('pause-status').style.display = 'block';
        } else if (currentSpeedKmh >= 1.0 && isAutoPaused) {
            isAutoPaused = false;
            document.getElementById('pause-status').style.display = 'none';
        }

        if (!isAutoPaused && acc < 40) {
            if (lastPos) {
                let d = calculateDistance(lastPos, pos);
                if (d > 0.002) {
                    totalDist += d;
                    document.getElementById('dist').textContent = totalDist.toFixed(2);
                    lastPos = pos;
                    pathCoords.push(pos);
                    polyline.setLatLngs(pathCoords);
                }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12.5 && (now - lastStepTime) > 230) {
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1 ? Math.floor(400 - (currentSpeedKmh * 8)) : 0;
        let flt = currentSpeedKmh > 2 ? Math.floor(8 + (currentSpeedKmh * 1.8)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "--";
    }
}

function calculateDistance(p1, p2) {
    const R = 6371;
    const dLat = (p2[0]-p1[0])*Math.PI/180;
    const dLon = (p2[1]-p1[1])*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let s = 3600 / kmh;
    return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = { 
        date: new Date().toLocaleDateString('ko-KR', {month:'short', day:'numeric', weekday:'short'}), 
        dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, 
        pace: document.getElementById('avgPace').textContent, cad: document.getElementById('cadence').textContent 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 200);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'list') {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        document.getElementById('history-list').innerHTML = h.map(r => `
            <div class="history-item">
                <div style="font-size:12px; color:var(--primary); font-weight:800;">${r.date}</div>
                <div class="h-main"><span class="h-dist">${r.dist} KM</span><span class="h-time" style="font-weight:800;">${r.time}</span></div>
                <div class="h-details">
                    <div><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div>
                    <div><span class="h-det-label">CAD</span><span class="h-det-val">${r.cad}</span></div>
                </div>
            </div>`).join('');
    }
}

window.onload = initMap;
</script>
</body>
</html>
