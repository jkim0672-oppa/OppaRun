<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.00</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 맵 크기를 줄여서 버튼 공간 확보 */
        #map-container { height: 15vh; min-height: 120px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        
        /* [v28.80 복각] 도톰한 카드 스타일 */
        .dashboard { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; border: 1.5px solid #333; display: flex; flex-direction: column; padding: 15px 10px; position: relative; }
        
        .card-pace { grid-column: span 6; border: 3px solid var(--primary); min-height: 110px; align-items: center; justify-content: center; }
        .card-half { grid-column: span 3; min-height: 90px; }
        .card-third { grid-column: span 2; min-height: 80px; }

        .label { font-size: 11px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .value-hero { font-size: 55px; color: var(--primary); font-weight: 900; line-height: 1; }
        .value-std { font-size: 26px; font-weight: 900; }

        /* [v28.80 복각] 히스토리 카드 스타일 */
        .history-card { grid-column: span 3; min-height: 160px; border-color: #444; align-items: flex-start; padding: 15px; }
        .history-full { grid-column: span 6; border-color: var(--primary); }

        /* 버튼 레이아웃 수정 (밀림 방지) */
        .controls { position: fixed; bottom: 85px; left: 0; right: 0; padding: 0 20px; z-index: 100; }
        .btn-act { width: 100%; height: 70px; border-radius: 35px; border: none; font-weight: 900; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #000; display: flex; border-top: 1px solid #222; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 18px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 10px; }

        .btn-dim { position: absolute; top: 12px; right: 12px; background: #333; color: #999; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; }
    </style>
</head>
<body>
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-container"><div id="map"></div></div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-pace">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-hero">--'--"</div>
                <button class="btn-dim" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card card-half"><div class="label">DIST</div><div class="value-std"><span id="dist">0.00</span><span style="font-size:14px; color:var(--primary)"> KM</span></div></div>
            <div class="card card-half"><div class="label">TIME</div><div id="time" class="value-std">00:00</div></div>
            <div class="card card-third"><div class="label">AVG</div><div id="avgPace" class="value-std" style="font-size:20px;">--'--"</div></div>
            <div class="card card-third"><div class="label">CADENCE</div><div id="cadence" class="value-std" style="font-size:20px;">0</div></div>
            <div class="card card-third"><div class="label">GCT</div><div class="value-std" style="font-size:20px;"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="dashboard">
            <div class="card history-card history-full" style="border-color:var(--primary)">
                <div class="label" style="color:var(--primary)">LAST RUN</div>
                <div style="font-size:14px; line-height:1.6; font-weight:700;">
                    Date: 2/29/23<br>Time: 00:00 AM<br>Dist: 0.00 km<br>Pace: --'--"
                </div>
            </div>
            <div class="card history-card" style="grid-column: span 3;"><div class="label">STATS</div><div style="font-size:12px; color:#666;">Overview...</div></div>
            <div class="card history-card" style="grid-column: span 3;"><div class="label">SETTINGS</div><div style="font-size:12px; color:#666;">Quick Links...</div></div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div>

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];

const ui = {
    showTab: (t) => {
        document.getElementById('run-view').style.display = (t === 'run') ? 'flex' : 'none';
        document.getElementById('history-view').style.display = (t === 'history') ? 'flex' : 'none';
        document.getElementById('tab-run').classList.toggle('active', t === 'run');
        document.getElementById('tab-history').classList.toggle('active', t === 'history');
    },
    toggleDim: (s) => { document.getElementById('dimmer-overlay').style.display = s ? 'flex' : 'none'; }
};

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    if (marker) { marker.setLatLng(pos); map.panTo(pos); }
    if (isRunning && !isPaused && lastPos) {
        let d = map.distance(lastPos, pos) / 1000;
        if (d > 0.001 && d < 0.08) {
            totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2);
            lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords);
        }
    } else if (!lastPos) { lastPos = pos; }
}

function onStart() {
    isRunning = true; 
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    if (!timer) timer = setInterval(() => { seconds++; let m = Math.floor(seconds/60), s = seconds%60; document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }, 1000);
}

function onStop() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
};
</script>
</body>
</html>
