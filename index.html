<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.60 (Stable Reset)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* v28.11 CSS 100% 유지 + 추가 스타일링 */
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard & Cards (v28.11 원본 스타일) */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .value { font-size: 20px; font-weight: 900; }
        .auto-pause-label { position: absolute; top: 5px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; display: none; }

        /* Dimmer Button */
        .btn-dim { position: absolute; top: 12px; right: 12px; width: 52px; height: 52px; background: #1a1a1a; color: #777; border: 1.5px solid #333; border-radius: 12px; font-size: 10px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.93); z-index: 99999; display: none; justify-content: center; align-items: center; color: #333; font-weight: 900; }

        /* Controls (v28.11 원본 스타일) */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-top: auto; margin-bottom: 20px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        
        /* History & Route Detail (v29 요청 반영) */
        .history-list { padding: 0 12px; overflow-y: auto; flex: 1; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-main { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .btn-link-action { font-size: 12px; font-weight: 900; padding: 5px 12px; border-radius: 6px; text-transform: uppercase; cursor: pointer; margin-left: 5px; }
        .text-route-link { color: var(--primary); background: rgba(0, 255, 136, 0.15); }
        .text-diag-link { color: #00a2ff; background: rgba(0, 123, 255, 0.2); }

        #route-detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 5000; display: none; flex-direction: column; }
        #detail-map { height: 45vh; border-bottom: 2px solid #222; }
        .detail-info { flex: 1; padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .det-row { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .det-val { font-size: 38px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 전역 하단 탭 바 (v29 디자인 통합) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5001; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
        
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body>
    <div id="dimmer-overlay" onclick="toggleDim(false)">TAP TO WAKE SCREEN</div>

    <div id="route-detail-view">
        <div id="detail-map"></div>
        <div class="detail-info" id="detail-content"></div>
        <div class="tab-bar">
            <button class="tab-btn" onclick="closeRouteDetail('run')">RUN</button>
            <button class="tab-btn">FORM</button>
            <button class="tab-btn" onclick="closeRouteDetail('history')">HISTORY</button>
            <button class="tab-btn" style="color:#00a2ff;" onclick="alert('경로를 공유합니다!')">SHARE</button>
        </div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="btn-dim" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        </div>
        
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list" class="history-list"></div>
    </div> 

    <div class="tab-bar" id="main-tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-form" class="tab-btn">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
        <button id="tab-share" class="tab-btn">SHARE</button>
    </div> 

<script>
let map, detailMap, marker, accuracyCircle, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }

function initMap() {
    // v28.11 원본 Leaflet 설정 100% 복구
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location'})}).addTo(map);
    // 원본 스타일의 오차 범위 원 추가
    accuracyCircle = L.circle([0,0], {radius: 0, color: '#007bff', fillOpacity: 0.1, weight: 1}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            const speedKmh = (p.coords.speed || 0) * 3.6;
            const accuracy = p.coords.accuracy;

            marker.setLatLng(pos);
            accuracyCircle.setLatLng(pos).setRadius(accuracy); // 오차 표시 살림
            
            if (isRunning && !isPaused) {
                // v28.11 원본 자동 정지 로직 복구
                if (speedKmh < 0.8 && !isAutoPaused) {
                    isAutoPaused = true; 
                    document.getElementById('pause-status').style.display = 'block';
                    if (navigator.vibrate) navigator.vibrate(200); // 진동 1회
                } else if (speedKmh >= 0.8 && isAutoPaused) {
                    isAutoPaused = false; 
                    document.getElementById('pause-status').style.display = 'none';
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // 재개 진동
                }

                if (!isAutoPaused && lastPos) {
                    let d = L.latLng(lastPos).distanceTo(pos) / 1000;
                    if (d > 0.002) {
                        totalDist += d;
                        document.getElementById('dist').textContent = totalDist.toFixed(2);
                        pathCoords.push(pos);
                        polyline.setLatLngs(pathCoords);
                        lastPos = pos;
                    }
                } else if (!isAutoPaused) { lastPos = pos; pathCoords.push(pos); }
                document.getElementById('curPace').textContent = formatPace(speedKmh);
            } else if (!isRunning) { 
                map.panTo(pos); 
            }
            document.getElementById('status').textContent = isRunning ? (isPaused ? "PAUSED" : (isAutoPaused ? "AUTO PAUSED" : "ACTIVE")) : "GPS CONNECTED";
        }, null, {enableHighAccuracy: true});
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = []; lastPos = null;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = formatTime(seconds); } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }

function onFinish() {
    // 원본 데이터를 안전하게 저장하는 로직
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: calculatePace(totalDist, seconds),
        coords: pathCoords 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    
    isRunning = false; clearInterval(timer);
    showTab('history'); // 루트 대신 기록 목록으로 이동
    location.reload(); // 원본처럼 깔끔한 초기화를 위해 리로드
}

function viewRecordMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = h.find(item => item.id === id);
    if (!r) return;

    // 상세 경로 뷰 데이터 완벽 복구
    document.getElementById('route-detail-view').style.display = 'flex';
    document.getElementById('detail-content').innerHTML = `
        <div class="det-row"><span class="label">DISTANCE</span><span class="det-val">${r.dist}KM</span></div>
        <div class="det-row"><span class="label">TIME</span><span class="det-val">${r.time}</span></div>
        <div class="det-row"><span class="label">AVG PACE</span><span class="det-val">${r.pace}</span></div>
    `;

    setTimeout(() => {
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (r.coords && r.coords.length > 0) {
            const p = L.polyline(r.coords, {color: '#00ff88', weight: 6}).addTo(detailMap);
            detailMap.fitBounds(p.getBounds(), {padding: [30, 30]});
        }
    }, 200);
}

function closeRouteDetail(targetTab) { 
    document.getElementById('route-detail-view').style.display = 'none'; 
    if(targetTab) showTab(targetTab);
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    // 데이터 복구 및 디자인 통합
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="label" style="color:var(--primary); font-size:11px;">${r.date}</div>
            <div class="h-main">
                <span style="font-size:20px; font-weight:900;">${r.dist}KM</span>
                <span style="font-size:20px; font-weight:900; margin-left:10px;">${r.time}</span>
                <span class="btn-link-action text-route-link" style="margin-left:auto;" onclick="viewRecordMap(${r.id})">ROUTE</span>
                <span class="btn-link-action text-diag-link" onclick="alert('진단을 시작합니다!')">진단</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid #222; padding-top:8px; margin-top:5px;">
                <div><span class="label">PACE</span><br>${r.pace}</div>
                <div><span class="label">CAD</span><br>--</div>
                <div><span class="label">KCAL</span><br>--</div>
                <div><span class="label">GCT</span><br>--</div>
            </div>
        </div>`).join('');
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('#main-tab-bar .tab-btn').forEach(b => b.classList.remove('active'));
    if(tab === 'history') {
        updateHistoryStats();
        document.getElementById('tab-history').classList.add('active');
    } else {
        document.getElementById('tab-run').classList.add('active');
    }
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function formatPace(kmh) { if (kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function calculatePace(dist, sec) { if (dist <= 0) return "--'--\""; let p = sec / dist; return `${Math.floor(p/60)}'${String(Math.floor(p%60)).padStart(2,'0')}"`; }
window.onload = initMap;
</script>
</body>
</html>
