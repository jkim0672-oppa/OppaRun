<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.97 (Total Restoration)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #1a1a1a; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui; }
        body { margin: 0; background: var(--bg); color: var(--text-main); height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Layout Structure */
        #map-area { height: 18vh; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; }
        
        /* Dashboard - 28.80 Standard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2px solid var(--primary); height: 100px; position: relative; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }
        
        /* Controls */
        .controls { padding: 15px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; }

        /* History List - Photo 1308 Restore */
        .history-card { background: #111; border-radius: 15px; padding: 18px; margin: 10px; border: 1px solid #222; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 800; }
        .h-main { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
        .h-dist { font-size: 26px; font-weight: 900; }
        .h-time { font-size: 20px; font-weight: 900; color: var(--primary); }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 10px; }
        .g-item { text-align: center; }
        .g-label { font-size: 9px; color: #555; font-weight: 900; display: block; }
        .g-val { font-size: 13px; font-weight: 800; color: #ccc; }

        /* Navigation */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 80px; background: #000; display: flex; border-top: 1px solid #222; z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }
        
        .sub-menu { display: flex; background: #0a0a0a; border-bottom: 1px solid #222; padding: 5px; gap: 5px; }
        .sub-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #666; font-size: 11px; font-weight: 900; padding: 12px 0; border-radius: 8px; }
        .sub-btn.active { color: var(--primary); border-color: var(--primary); }

        .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding-bottom: 90px; }
        .view.active { display: flex; }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
</div>

<div id="view-run" class="view active">
    <div class="dashboard">
        <div class="card card-main">
            <div class="label">PACE</div>
            <div id="curPace" class="value-large">--'--"</div>
            <button id="metro-btn" style="position:absolute; bottom:10px; right:10px; background:#333; color:#999; border:none; padding:6px 10px; border-radius:6px; font-size:9px; font-weight:900;" onclick="toggleMetro()">METRO OFF</button>
        </div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:12px;"> %</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="runStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="runStop()">STOP</button>
    </div>
</div>

<div id="view-history" class="view">
    <div class="sub-menu">
        <button id="sb-list" class="sub-btn active" onclick="showSub('list')">리스트</button>
        <button id="sb-stats" class="sub-btn" onclick="showSub('stats')">통계</button>
        <button id="sb-info" class="sub-btn" onclick="showSub('info')">인포</button>
        <button id="sb-set" class="sub-btn" onclick="showSub('set')">설정</button>
    </div>
    <div id="cnt-list"></div>
    <div id="cnt-stats" style="display:none; padding:20px;">
        <div class="history-card" style="text-align:center;">
            <div class="label">LIFETIME DISTANCE</div>
            <div id="stat-total" style="font-size:32px; font-weight:900; color:var(--primary); margin-top:10px;">0.0 KM</div>
        </div>
    </div>
    <div id="cnt-info" style="display:none; padding:20px;">
        <div class="history-card">
            <div style="color:var(--primary); font-weight:900; margin-bottom:8px;">CADENCE INFO</div>
            <div style="font-size:13px; color:#aaa;">권장: 170~185 BPM. 이 범위를 유지하면 족저근막염과 가자미근 부상을 예방하는 데 도움이 됩니다.</div>
        </div>
    </div>
    <div id="cnt-set" style="display:none; padding:20px;">
        <div class="label" style="color:var(--primary); margin-bottom:10px;">LANGUAGE</div>
        <div class="history-card" style="margin:0 0 20px 0; display:flex; justify-content:space-between; padding:15px;"><span>English / 한국어</span><span>▼</span></div>
        <div class="label" style="color:var(--primary); margin-bottom:10px;">PROFILE</div>
        <div style="display:flex; gap:10px;">
            <div class="history-card" style="flex:1; margin:0; text-align:center;">175 cm</div>
            <div class="history-card" style="flex:1; margin:0; text-align:center;">70 kg</div>
        </div>
        <button onclick="clearHistory()" style="width:100%; background:none; border:1px solid #333; color:var(--danger); padding:15px; border-radius:12px; margin-top:30px; font-weight:900;">CLEAR ALL HISTORY</button>
    </div>
</div>

<div class="tab-bar">
    <button id="tb-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tb-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let state = { running: false, time: 0, timer: null, db: JSON.parse(localStorage.getItem('oppa_db') || '[]') };

function showTab(t) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+t).classList.add('active');
    document.getElementById('tb-'+t).classList.add('active');
    if(t === 'history') showSub('list');
}

function showSub(s) {
    ['list', 'stats', 'info', 'set'].forEach(k => {
        document.getElementById('cnt-'+k).style.display = (k === s ? 'block' : 'none');
        document.getElementById('sb-'+k).classList.toggle('active', k === s);
    });
    if(s === 'list') renderList();
    if(s === 'stats') {
        let total = state.db.reduce((a, c) => a + parseFloat(c.dist), 0);
        document.getElementById('stat-total').textContent = total.toFixed(1) + " KM";
    }
}

function runStart() {
    state.running = true;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    state.timer = setInterval(() => {
        state.time++;
        let m = Math.floor(state.time/60), s = state.time%60;
        document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 1000);
}

function runStop() {
    if(!confirm("FINISH RUN?")) return;
    clearInterval(state.timer);
    let rec = {
        date: new Date().toLocaleString(),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('curPace').textContent,
        cad: '178', gct: '245', flt: '32'
    };
    state.db.unshift(rec);
    localStorage.setItem('oppa_db', JSON.stringify(state.db));
    location.reload();
}

function renderList() {
    const list = document.getElementById('cnt-list');
    if(!state.db.length) { list.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">NO DATA</div>'; return; }
    list.innerHTML = state.db.map(r => `
        <div class="history-card">
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>
            <div class="h-grid">
                <div class="g-item"><span class="g-label">PACE</span><span class="g-val">${r.pace}</span></div>
                <div class="g-item"><span class="g-label">CAD</span><span class="g-val">${r.cad}</span></div>
                <div class="g-item"><span class="g-label">GCT</span><span class="g-val">${r.gct}</span></div>
                <div class="g-item"><span class="g-label">FLT</span><span class="g-val">${r.flt}%</span></div>
            </div>
        </div>`).join('');
}

function clearHistory() { if(confirm("DELETE ALL?")) { localStorage.removeItem('oppa_db'); location.reload(); } }

window.onload = () => {
    let map = L.map('map', {zoomControl: false}).setView([33.7743, -117.9390], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
};
</script>
</body>
</html>
