<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.24</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text-dim: #555; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 상단 4단 메뉴 */
        .history-nav { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 6px; padding: 12px; background: #000; flex-shrink: 0; 
        }
        .sub-btn { 
            padding: 10px 0; border: none; background: #222; 
            color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; 
            text-align: center;
        }
        .sub-btn.active { background: var(--primary); color: #000; }

        /* 요약 바 (이제 TOTAL 페이지 안으로 들어감) */
        .summary-bar { 
            display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; 
            padding: 15px 20px; background: #000; border-bottom: 1px solid #1a1a1a;
            font-weight: 900; margin-bottom: 10px;
        }
        .s-item { display: flex; flex-direction: column; }
        .s-lbl { font-size: 8px; color: var(--text-dim); margin-bottom: 2px; }
        .s-val { font-size: 14px; color: var(--primary); }

        /* 컨텐츠 영역 */
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 90px; }
        .page-content { display: none; flex-direction: column; }
        .page-content.active { display: flex; }

        /* 리스트 아이템 */
        .history-item { background: #0f0f0f; border-radius: 12px; padding: 16px; margin: 8px 12px; border: 1px solid #1a1a1a; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-dist-time { font-size: 21px; font-weight: 900; }
        .h-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; border-top: 1px solid #222; padding-top: 12px; gap: 4px; }
        .h-det-label { font-size: 8px; color: var(--text-dim); font-weight: 800; }
        .h-det-val { font-size: 12px; font-weight: 800; color: #ddd; }

        /* 하단 탭 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div class="history-nav">
        <button id="btn-list" class="sub-btn active" onclick="changeSubPage('list')">LIST</button>
        <button id="btn-total" class="sub-btn" onclick="changeSubPage('total')">TOTAL</button>
        <button id="btn-info" class="sub-btn" onclick="changeSubPage('info')">INFO</button>
        <button id="btn-setting" class="sub-btn" onclick="changeSubPage('setting')">SETTING</button>
    </div>

    <div class="main-content">
        <div id="page-list" class="page-content active">
            <div id="history-list"></div>
        </div>

        <div id="page-total" class="page-content">
            <div class="summary-bar">
                <div class="s-item"><span class="s-lbl">TOTAL KM</span><span id="sum-dist" class="s-val">0.00 KM</span></div>
                <div class="s-item"><span class="s-lbl">TOTAL TIME</span><span id="sum-time" class="s-val">00:00:00</span></div>
                <div class="s-item"><span class="s-lbl">COUNT</span><span id="sum-count" class="s-val">0</span></div>
            </div>
            <div style="padding:40px; text-align:center; color:#555; font-weight:900;">STATISTICS DETAILS COMING SOON</div>
        </div>

        <div id="page-info" class="page-content" style="padding:40px; text-align:center; color:#555;">OppaRun Pro v28.24</div>
        <div id="page-setting" class="page-content" style="padding:40px; text-align:center; color:#555;">SETTINGS</div>
    </div> 

    <div class="tab-bar">
        <button class="tab-btn">RUN</button>
        <button class="tab-btn active">HISTORY</button>
    </div> 

<script>
function changeSubPage(pageId) {
    document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + pageId).classList.add('active');
    
    document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tKm = 0, tSec = 0;
    
    const html = history.map(r => {
        tKm += parseFloat(r.dist || 0);
        const pts = r.time.split(':');
        tSec += (parseInt(pts[0])*60) + parseInt(pts[1]);
        return `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main"><span class="h-dist-time">${r.dist}KM ${r.time}</span><span style="color:var(--primary); font-size:11px; font-weight:800;">ROUTE</span></div>
            <div class="h-grid">
                <div class="h-col"><span class="h-det-label">PACE</span><div class="h-det-val">${r.pace}</div></div>
                <div class="h-col"><span class="h-det-label">CAD</span><div class="h-det-val">${r.cadence}</div></div>
                <div class="h-col"><span class="h-det-label">KCAL</span><div class="h-det-val">${r.kcal}</div></div>
                <div class="h-col"><span class="h-det-label">GCT/FLT</span><div class="h-det-val">${r.gct}ms / ${r.flight}%</div></div>
            </div>
        </div>`;
    }).join('');
    
    // 요약 데이터 업데이트 (TOTAL 페이지용)
    document.getElementById('sum-dist').textContent = tKm.toFixed(2) + " KM";
    document.getElementById('sum-count').textContent = history.length;
    const h = Math.floor(tSec/3600); const m = Math.floor((tSec%3600)/60); const s = tSec%60;
    document.getElementById('sum-time').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    
    document.getElementById('history-list').innerHTML = html;
}
window.onload = loadHistory;
</script>
</body>
</html>
