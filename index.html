<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.1 (Perfect Layout)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard for Run View */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* [History View 3-Step Layout] */
        .history-container { display: flex; flex-direction: column; height: 100%; padding-bottom: 75px; }
        
        /* 1. 상단 토탈 (칼로리 포함 4칸) */
        .history-total { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; flex-shrink: 0; }
        .total-box { background: #1a1a1a; padding: 8px 0; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        .total-label { font-size: 7px; color: var(--primary); font-weight: 900; margin-bottom: 2px; }
        .total-val { font-size: 14px; font-weight: 900; color: #fff; }

        /* 2. 중간 리스트 (높이 고정 및 스크롤) */
        .history-list { flex: 1; overflow-y: auto; padding: 0 10px; min-height: 200px; } /* 리스트 영역 고정 */
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #1f1f1f; }
        .h-header { margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
        .h-dist { font-size: 18px; font-weight: 900; }
        .h-time { font-size: 16px; font-weight: 700; color: #999; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 7px; color: #666; font-weight: 800; margin-bottom: 2px; }
        .h-det-val { font-size: 12px; font-weight: 600; color: #ddd; }

        /* 3. 하단 인포 영역 (카드 스타일) */
        .history-info-area { padding: 10px; flex-shrink: 0; border-top: 1px solid #222; background: #000; }
        .info-header { font-size: 12px; font-weight: 900; color: #555; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .info-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .info-card { background: var(--card-bg); border: 1px solid #222; border-radius: 12px; padding: 12px; }
        .info-card-title { font-size: 10px; color: var(--primary); font-weight: 900; margin-bottom: 4px; }
        .info-card-desc { font-size: 9px; color: #777; line-height: 1.3; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value" id="dist">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value" id="gct">--</div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value" id="flight">--</div></div>
        </div>
        <div class="controls" style="padding:20px; margin-bottom:80px;">
            <button id="btn-start" style="width:100%; height:55px; border-radius:30px; background:var(--primary); font-weight:900;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" style="width:100%; height:55px; border-radius:30px; background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px;">
                <button style="flex:1; height:55px; border-radius:30px; background:var(--primary);" onclick="onResume()">RESUME</button>
                <button style="flex:1; height:55px; border-radius:30px; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-container">
            <div class="history-total">
                <div class="total-box"><span class="total-label">TOTAL DIST</span><span id="all-dist" class="total-val">0.0</span></div>
                <div class="total-box"><span class="total-label">WEEKLY</span><span id="all-week" class="total-val">0.0</span></div>
                <div class="total-box"><span class="total-label">RUNS</span><span id="all-runs" class="total-val">0</span></div>
                <div class="total-box"><span class="total-label">KCAL</span><span id="all-kcal" class="total-val">0</span></div>
            </div>
            
            <div id="history-list" class="history-list"></div>
            
            <div class="history-info-area">
                <div class="info-header">Expert Knowledge</div>
                <div class="info-cards">
                    <div class="info-card">
                        <div class="info-card-title">CADENCE MASTER</div>
                        <div class="info-card-desc">Unlock the secret of 180 SPM for injury-free running.</div>
                    </div>
                    <div class="info-card">
                        <div class="info-card-title">DYNAMICS INFO</div>
                        <div class="info-card-desc">Optimize Ground Contact Time and Flight Ratio.</div>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) { 
        navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true}); 
    }
    updateHistoryStats();
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = p.coords.accuracy.toFixed(1);
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    document.getElementById('status').textContent = `READY (±${acc}m)`;
    if (isRunning && !isPaused && !isAutoPaused) {
        if (lastPos && p.coords.accuracy < 45) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
    }
} 

function onStart() {
    isRunning = true; seconds = 0; totalDist = 0; steps = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
} 

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 

function onFinish() {
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0;
    const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0;
    const kcal = Math.round(totalDist * 65);
    const record = { id: Date.now(), date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})+", "+new Date().toLocaleDateString('en-US',{weekday:'short'}), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: Math.round((steps/(seconds||1))*60), kcal: kcal, gctflt: `${avgGct}/${avgFlt}%` };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    let totalKm = 0, totalKcal = 0;
    h.forEach(r => {
        totalKm += parseFloat(r.dist);
        totalKcal += parseInt(r.kcal || 0);
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="h-header"><span class="h-date">${r.date}</span></div><div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div><div class="h-details"><div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div><div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div><div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${r.kcal}</span></div><div class="h-det-box"><span class="h-det-label">GCT/FLT</span><span class="h-det-val">${r.gctflt}</span></div></div>`;
        list.appendChild(item);
    });
    document.getElementById('all-dist').textContent = totalKm.toFixed(1);
    document.getElementById('all-week').textContent = totalKm.toFixed(1); // 단순화
    document.getElementById('all-runs').textContent = h.length;
    document.getElementById('all-kcal').textContent = totalKcal;
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
}
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
