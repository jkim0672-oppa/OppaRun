<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 2. 레이아웃 절대 보존을 위한 필수 스타일 보정 */
        :root {
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
        }

        * {
            box-sizing: border-box; /* 패딩으로 인한 화면 삐져나감 방지 */
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* S25 크롬 주소창 대응: dvh 단위를 사용하여 하단 잘림 해결 */
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 전체 화면 스크롤 방지 (레이아웃 고정) */
        }

        /* 오빠가 만든 레이아웃 구조 유지 */
        #map {
            flex: 1; /* 지도가 남은 공간을 차지하도록 */
            width: 100%;
            z-index: 1;
        }

        .dashboard {
            padding: 15px;
            display: grid;
            gap: 10px;
            background: var(--dark-bg);
            z-index: 10;
        }

        /* 이하 레이아웃 스타일은 기존 설정 그대로 유지 (색상 및 형태 보존) */
        .pace-card {
            grid-column: span 3;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 12px 5px;
            border-radius: 10px;
            text-align: center;
        }

        .main-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
            cursor: pointer;
        }

        /* 하단 탭 메뉴 고정 */
        .tab-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #000;
            border-top: 1px solid #333;
        }

        .tab-item {
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .tab-item.active {
            color: var(--neon-green);
        }

        /* 기록(History) 화면 레이어 */
        #history-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: var(--dark-bg);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="dashboard">
        <div class="pace-card">
            <div style="color:var(--neon-green); font-size:0.8rem; margin-bottom:5px;">CURRENT PACE</div>
            <div id="current-pace" style="font-size:3rem; font-weight:bold; color:var(--neon-green);">--'--"</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">DIST</div>
                <div><span id="dist" style="font-size:1.2rem; font-weight:bold;">0.00</span><span style="font-size:0.7rem;"> KM</span></div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">TIME</div>
                <div id="time" style="font-size:1.2rem; font-weight:bold;">00:00</div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">AVG PACE</div>
                <div id="avg-pace" style="font-size:1.2rem; font-weight:bold;">--'--"</div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">CADENCE</div>
                <div><span id="cadence" style="font-size:1.2rem; font-weight:bold;">0</span><span style="font-size:0.7rem; color:var(--neon-green);"> SPM</span></div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">GCT</div>
                <div><span id="gct" style="font-size:1.2rem; font-weight:bold;">--</span><span style="font-size:0.7rem; color:var(--neon-green);"> MS</span></div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.7rem; color:#888;">FLIGHT</div>
                <div><span id="flight" style="font-size:1.2rem; font-weight:bold;">--</span><span style="font-size:0.7rem; color:var(--neon-green);"> %</span></div>
            </div>
        </div>

        <button id="startBtn" class="main-btn" onclick="toggleRun()">START RUNNING</button>
    </div>

    <div id="history-screen">
        <h1 style="color:var(--neon-green); margin-bottom:20px;">HISTORY</h1>
        <div id="history-list" style="color:#ccc; text-align:center;">
            NO DATA
        </div>
    </div>

    <nav class="tab-bar">
        <a href="#" class="tab-item active" onclick="showScreen('run')">RUN</a>
        <a href="#" class="tab-item" onclick="showScreen('history')">HISTORY</a>
    </nav>

    <script>
        // 3. 기본 로직 (오빠가 짠 로직 그대로 유지하면서 초기화 부분 보강)
        let isRunning = false;
        
        // 크롬에서 기록이 안 나오는 현상 방지를 위해 페이지 로드 시 즉시 데이터 로드 시도
        window.onload = function() {
            console.log("App Ready - Loading Data...");
            loadHistory();
            // 지도 초기화 로직 등 기존 코드가 여기에 들어감
        };

        function toggleRun() {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            btn.innerText = isRunning ? "STOP RUNNING" : "START RUNNING";
            btn.style.background = isRunning ? "#ff3333" : "#00ff66";
            
            if(!isRunning) {
                saveRunData(); // 종료 시 데이터 저장 로직 실행
            }
        }

        function showScreen(screen) {
            const historyScreen = document.getElementById('history-screen');
            const runTabs = document.querySelectorAll('.tab-item');
            
            if(screen === 'history') {
                historyScreen.style.display = 'block';
                runTabs[0].classList.remove('active');
                runTabs[1].classList.add('active');
                loadHistory(); // 화면 전환 시 다시 불러오기
            } else {
                historyScreen.style.display = 'none';
                runTabs[1].classList.remove('active');
                runTabs[0].classList.add('active');
            }
        }

        // 4. 데이터 저장 및 불러오기 (크롬 안정성 강화)
        function saveRunData() {
            const currentDist = document.getElementById('dist').innerText;
            if(parseFloat(currentDist) <= 0) return; // 0km는 저장 안 함

            const newRecord = {
                date: new Date().toLocaleDateString(),
                dist: currentDist,
                time: document.getElementById('time').innerText
            };

            let history = JSON.parse(localStorage.getItem('oppa_run_history') || "[]");
            history.unshift(newRecord);
            localStorage.setItem('oppa_run_history', JSON.stringify(history));
            alert("기록이 성공적으로 저장되었습니다!");
        }

        function loadHistory() {
            const listContainer = document.getElementById('history-list');
            const data = localStorage.getItem('oppa_run_history');
            
            if(!data || data === "[]") {
                listContainer.innerHTML = "NO DATA";
                return;
            }

            const history = JSON.parse(data);
            listContainer.innerHTML = history.map(item => `
                <div style="background:#1a1a1a; padding:15px; border-radius:10px; margin-bottom:10px; text-align:left; border-left:4px solid var(--neon-green);">
                    <div style="font-size:0.8rem; color:#888;">${item.date}</div>
                    <div style="font-size:1.1rem; font-weight:bold; margin-top:5px;">${item.dist} KM / ${item.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
