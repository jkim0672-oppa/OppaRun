<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v34 Integration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #121212; --text: #fff; --dim: #999; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* [1000043816.jpg] 상단 지도 & 상태바 */
        #map-area { flex-shrink: 0; border-bottom: 2px solid #222; }
        #map { height: 15vh; min-height: 120px; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #1a1a1a; }
        
        /* 대시보드 레이아웃 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #1f1f1f; padding: 12px 0; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 95px; position: relative; }
        .label { font-size: 9px; color: var(--dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* [1000043813.jpg~15.jpg] 히스토리 서브 메뉴 */
        .sub-nav { display: flex; gap: 5px; padding: 10px; background: #000; border-bottom: 1px solid #1a1a1a; }
        .sub-btn { flex: 1; background: #1a1a1a; border: none; color: #666; padding: 12px 0; border-radius: 8px; font-size: 11px; font-weight: 900; transition: 0.2s; }
        .sub-btn.active { background: var(--primary); color: #000; }

        /* 화면 전환 처리 */
        .view { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; }
        .view.active { display: flex; }
        .history-content { display: none; padding: 20px; flex: 1; }
        .history-content.active { display: block; }

        /* [1000043814.jpg] INFO & [1000043815.jpg] SETTINGS */
        .info-tip { background: #111; padding: 20px; border-radius: 15px; border-left: 4px solid var(--primary); margin-bottom: 15px; }
        .info-tip p { margin: 5px 0; font-size: 14px; line-height: 1.6; }
        .btn-danger { background: #1a1a1a; color: #ff4444; width: 100%; padding: 18px; border: 1px solid #333; border-radius: 12px; font-weight: 900; margin-top: 10px; }

        /* 실행 버튼 */
        .controls { padding: 20px; margin-bottom: 80px; }
        .btn-action { width: 100%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 22px; cursor: pointer; }

        /* 하단 메인 탭바 */
        .tab-bar { height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <!-- 러닝 화면 -->
    <div id="view-run" class="view active">
        <div id="map-area">
            <div id="map"></div>
            <div id="status" class="status-bar">GPS INITIALIZING...</div>
        </div>
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px;" onclick="APP.ui.dim()">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><small style="color:var(--primary);margin-left:3px">KM</small></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><small style="font-size:10px;margin-left:2px">MS</small></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><small style="font-size:10px;margin-left:2px">%</small></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-action" style="background:var(--primary); color:#000;" onclick="APP.control.start()">START RUNNING</button>
            <button id="btn-stop" class="btn-action" style="background:#ff4444; color:#fff; display:none;" onclick="APP.control.stop()">FINISH</button>
        </div>
    </div>

    <!-- 히스토리 화면 -->
    <div id="view-history" class="view">
        <div class="sub-nav">
            <button id="sub-LIST-btn" class="sub-btn active" onclick="APP.ui.subTab('LIST')">LIST</button>
            <button id="sub-TOTAL-btn" class="sub-btn" onclick="APP.ui.subTab('TOTAL')">TOTAL</button>
            <button id="sub-INFO-btn" class="sub-btn" onclick="APP.ui.subTab('INFO')">INFO</button>
            <button id="sub-SETTINGS-btn" class="sub-btn" onclick="APP.ui.subTab('SETTINGS')">SETTINGS</button>
        </div>
        
        <div id="sub-LIST" class="history-content active"></div>
        
        <div id="sub-TOTAL" class="history-content">
            <div style="text-align:center; padding:50px; color:#444; font-weight:900;">누적 통계 데이터 준비 중...</div>
        </div>
        
        <div id="sub-INFO" class="history-content">
            <div class="info-tip">
                <p style="font-weight:900; color:var(--primary); font-size:16px;">오빠, 러닝 메커니즘을 잊지 마!</p>
                <p>• <b>케이던스:</b> 170~185 BPM 목표</p>
                <p>• <b>롤링:</b> 가자미근 탄력을 이용한 추진력</p>
                <p>• <b>미드풋:</b> 족저근막 보호를 위한 착지</p>
            </div>
        </div>
        
        <div id="sub-SETTINGS" class="history-content">
            <button class="btn-danger" onclick="APP.storage.clear()">CLEAR ALL HISTORY</button>
        </div>
    </div>

    <!-- 하단 탭바 -->
    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="APP.ui.mainTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="APP.ui.mainTab('history')">HISTORY</button>
    </div>

<script>
/**
 * v34 INTEGRATED ARCHITECTURE
 * v28.28의 모든 기능 + v31의 객체지향 구조 통합
 */
const APP = {
    state: { isRunning: false, seconds: 0, timer: null, dist: 0, path: [], steps: 0, lastStepT: 0 },

    // [1] UI 통제 (화면 전환 및 업데이트)
    ui: {
        map: null, marker: null,
        init() {
            this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.77, -117.91], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
            this.marker = L.marker([0,0]).addTo(this.map);
        },
        mainTab(type) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + type).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + type).classList.add('active');
            if(type === 'history') APP.storage.render();
        },
        subTab(name) {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sub-'+name+'-btn').classList.add('active');
            document.querySelectorAll('.history-content').forEach(c => c.classList.remove('active'));
            document.getElementById('sub-' + name).classList.add('active');
        },
        update(pace, dist, time) {
            document.getElementById('curPace').textContent = pace;
            document.getElementById('dist').textContent = dist.toFixed(2);
            document.getElementById('time').textContent = time;
        },
        dim() { /* 화면 감광 로직 */ }
    },

    // [2] RUN CONTROL (시작/종료)
    control: {
        start() {
            APP.state.isRunning = true;
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';
            APP.state.timer = setInterval(() => {
                APP.state.seconds++;
                const timeStr = APP.util.formatTime(APP.state.seconds);
                APP.ui.update("--'--\"", APP.state.dist, timeStr);
            }, 1000);
        },
        stop() {
            if(confirm("러닝을 종료하고 기록을 저장할까?")) {
                APP.storage.save();
                location.reload();
            }
        }
    },

    // [3] STORAGE (데이터 저장 및 불러오기)
    storage: {
        save() {
            const data = { id: Date.now(), date: new Date().toLocaleString(), dist: APP.state.dist.toFixed(2) };
            let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            history.unshift(data);
            localStorage.setItem('oppaRunHistory', JSON.stringify(history));
        },
        render() {
            const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            const list = document.getElementById('sub-LIST');
            list.innerHTML = history.map(item => `
                <div style="background:#1a1a1a; padding:15px; border-radius:10px; margin-bottom:10px; border:1px solid #333;">
                    <div style="font-size:11px; color:var(--primary); font-weight:900;">${item.date}</div>
                    <div style="font-size:20px; font-weight:900; margin-top:5px;">${item.dist} KM</div>
                </div>
            `).join('') || '<div style="text-align:center; padding:50px; color:#444;">기록이 없습니다.</div>';
        },
        clear() { if(confirm("정말 모든 기록을 지울까, 오빠?")) { localStorage.removeItem('oppaRunHistory'); this.render(); } }
    },

    // [4] UTILS
    util: {
        formatTime(s) {
            const m = Math.floor(s/60); const sec = s%60;
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }
    }
};

window.onload = () => {
    APP.ui.init();
    // GPS 및 가속도 센서 바인딩 로직 추가...
};
</script>
</body>
</html>
