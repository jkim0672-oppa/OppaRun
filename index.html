<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OppaRun Pro (Improved)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; background:#000; color:#fff; font-family:sans-serif; overflow:hidden; height:100vh;}
.container { display:flex; flex-direction:column; height:100vh;}
#map { height:35vh; width:100%; border-bottom:1px solid #333;}
.content { flex:1; display:flex; flex-direction:column; padding:10px; justify-content:space-between;}
.status-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.box { background:#151515; padding:8px; border-radius:10px; text-align:center; border:1px solid #222;}
.box small { color:#888; font-size:11px;}
.val { font-size:18px; font-weight:bold;}
.green-val { color:#00ff88;}
.pace-main { border:2px solid #00ff88; padding:10px; border-radius:15px; text-align:center;}
button { border:none; padding:12px; border-radius:30px; font-size:16px; font-weight:bold; width:100%;}
#startBtn { background:#ff4444; color:#fff;}
.sub-btns { display:none; gap:5px;}
#resumeBtn { background:#00ff88; color:#000; flex:1;}
#finishBtn { background:#444; color:#fff; flex:1;}
#lockBtn { background:#222; color:#00ff88;}
.my-location { background:#007bff; border:2px solid white; border-radius:50%; width:12px; height:12px;}
</style>
</head>

<body>
<div class="container">
<div id="map"></div>

<div class="content">
<div id="gps-stat" style="text-align:center; font-size:10px; color:#ffcc00;">GPS...</div>

<div class="status-grid">
<div class="box"><small>DISTANCE</small><div id="d" class="val green-val">0.00</div></div>
<div class="box"><small>TIME</small><div id="t" class="val">00:00:00</div></div>
<div class="box"><small>AVG PACE</small><div id="avgP" class="val">--'--"</div></div>
<div class="box"><small>CADENCE</small><div id="cad" class="val">0</div></div>
</div>

<div class="pace-main">
<small>CURRENT PACE</small>
<div id="p" style="font-size:32px;">--'--"</div>
</div>

<div>
<button id="startBtn">START</button>
<div id="subBtns" class="sub-btns">
<button id="resumeBtn">RESUME</button>
<button id="finishBtn">STOP</button>
</div>
<button id="lockBtn" style="display:none;">LOCK</button>
</div>
</div>
</div>

<script>
let map = L.map('map').setView([37.44,126.5],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let path = L.polyline([], {color:'#00ff88', weight:6}).addTo(map);
let myMarker = L.marker([37.44,126.5], {
    icon: L.divIcon({className:'my-location', iconSize:[12,12]})
}).addTo(map);

let isRunning=false, dist=0, lastPos=null, sec=0, timer;
let speedBuffer=[], lastMoveTime=0, lastKm=0;

function update(pos){
    const c = pos.coords;
    document.getElementById('gps-stat').innerText = `GPS ±${Math.round(c.accuracy)}m`;

    myMarker.setLatLng([c.latitude, c.longitude]);

    if (!lastPos){
        map.setView([c.latitude, c.longitude],17);
        lastPos = {lat:c.latitude, lng:c.longitude};
        return;
    }

    let d = map.distance([lastPos.lat,lastPos.lng],[c.latitude,c.longitude]);

    // GPS 필터
    if (c.accuracy < 20 && d > 2 && d < 15){
        if (isRunning){

            dist += d;
            document.getElementById('d').innerText = (dist/1000).toFixed(2);

            path.addLatLng([c.latitude,c.longitude]);

            // 부드러운 이동
            map.setView([c.latitude,c.longitude], map.getZoom(), {animate:false});

            // 평균 페이스
            let avg = (sec/60)/(dist/1000);
            if (dist > 0){
                let m=Math.floor(avg);
                let s=Math.round((avg-m)*60);
                document.getElementById('avgP').innerText = `${m}'${s.toString().padStart(2,'0')}"`;
            }

            // km 알림
            if (Math.floor(dist/1000) > lastKm){
                lastKm++;
                alert(`${lastKm}km 완료`);
            }
        }
        lastPos = {lat:c.latitude, lng:c.longitude};
    }

    // 속도 버퍼
    if (c.speed){
        speedBuffer.push(c.speed);
        if (speedBuffer.length > 5) speedBuffer.shift();
    }

    let avgSpeed = speedBuffer.length ? speedBuffer.reduce((a,b)=>a+b)/speedBuffer.length : 0;

    // 페이스
    if (avgSpeed > 0.5){
        let pace = 16.6667 / avgSpeed;
        let m=Math.floor(pace);
        let s=Math.round((pace-m)*60);
        document.getElementById('p').innerText = `${m}'${s.toString().padStart(2,'0')}"`;

        // cadence 추정
        let cadence = Math.round((avgSpeed * 60) / 1.2);
        document.getElementById('cad').innerText = cadence;

        lastMoveTime = Date.now();
    } else {
        document.getElementById('p').innerText = "--'--\"";
    }

    // 자동 일시정지
    if (Date.now() - lastMoveTime > 5000){
        isRunning = false;
    }
}

document.getElementById('startBtn').onclick = function(){
    isRunning=true;
    this.style.display="none";
    document.getElementById('subBtns').style.display="flex";
    document.getElementById('lockBtn').style.display="block";

    timer=setInterval(()=>{
        if (isRunning){
            sec++;
            let h=Math.floor(sec/3600);
            let m=Math.floor((sec%3600)/60);
            let s=sec%60;
            document.getElementById('t').innerText =
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
    },1000);
};

document.getElementById('finishBtn').onclick=function(){
    if (this.innerText==="STOP"){
        isRunning=false;
        this.innerText="FINISH";
        document.getElementById('resumeBtn').style.display="block";
    } else {
        alert("기록 저장!");
        location.reload();
    }
};

document.getElementById('resumeBtn').onclick=function(){
    isRunning=true;
    this.style.display="none";
    document.getElementById('finishBtn').innerText="STOP";
};

navigator.geolocation.watchPosition(update,null,{
    enableHighAccuracy:true,
    maximumAge:1000,
    timeout:5000
});
</script>
</body>
</html>
