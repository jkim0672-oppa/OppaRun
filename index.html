<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.7</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --danger: #ff4444; }
        * { box-sizing: border-box; }
        
        /* [중요] body 고정 높이 제거, 브라우저가 알아서 렌더링하게 수정 */
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; }
        
        /* 컨테이너 전체 높이를 화면에 맞춤 */
        #app-container { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #map-area { flex: 0 0 140px; } /* 지도는 딱 고정 높이로 */
        #map { height: 100%; width: 100%; background: #222; }
        
        /* 탭 바를 제외한 메인 영역 */
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        
        /* 대시보드 카드들 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 10px; text-align: center; border: 1px solid #1f1f1f; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); }
        .value-large { font-size: 32px; color: var(--primary); font-weight: 900; }
        .value { font-size: 18px; font-weight: 700; }
        .label { font-size: 9px; color: #888; margin-bottom: 5px; }

        /* 컨트롤 버튼 */
        .controls { padding: 10px; }
        .btn-capsule { width: 100%; height: 50px; border-radius: 25px; border: none; font-size: 18px; font-weight: 900; }
        #btn-start { background: var(--primary); }
        #btn-stop { background: var(--danger); color: #fff; display: none; }

        /* 하단 탭 바 */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; border-top: 1px solid #222; }
        .tab-btn { flex: 1; color: #fff; border: none; background: none; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 지도 -->
        <div id="map-area"><div id="map"></div></div>
        
        <!-- 메인 화면 -->
        <div id="run-view" class="main-content">
            <div class="dashboard">
                <div class="card card-main"><div class="label">PACE</div><div id="curPace" class="value-large">--'--"</div></div>
                <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span></div></div>
                <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
                <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span></div></div>
            </div>
            <div class="controls">
                <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
                <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            </div>
        </div>
        
        <!-- 히스토리 (초기 숨김) -->
        <div id="history-view" class="main-content" style="display:none;">
            <div style="padding: 20px;">HISTORY</div>
            <div id="history-list" style="padding: 10px;"></div>
        </div>

        <!-- 탭 바 -->
        <div class="tab-bar">
            <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
            <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
        </div>
    </div>

    <script>
        // 기존 JS 로직 유지 (initMap, onStart 등 위 코드에 맞게 연결)
        window.onload = () => { /* 기존 initMap 호출 */ };
        function showTab(tab) {
            document.getElementById('run-view').style.display = (tab === 'run' ? 'block' : 'none');
            document.getElementById('history-view').style.display = (tab === 'history' ? 'block' : 'none');
            document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
            document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
        }
        // ... 나머지 기능 동일 ...
    </script>
</body>
</html>
