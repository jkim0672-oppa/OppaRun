<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.18 (Original Stable + New Delete)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #121212; --text: #fff; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Layout - 2812 원본 유지 */
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .label { font-size: 9px; color: #999; font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; }
        
        .controls { padding: 20px; display: flex; justify-content: center; align-items: center; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; }
        
        /* History & Swipe - 원본 스타일 유지하며 로직만 추가 */
        .history-list { padding: 0 12px; overflow-y: auto; flex: 1; padding-bottom: 100px; }
        .h-item-container { position: relative; margin-top: 10px; overflow: hidden; border-radius: 12px; }
        .history-item { 
            background: var(--card-bg); padding: 15px; border: 1px solid #1f1f1f; border-radius: 12px;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out; touch-action: pan-y;
        }
        .history-item.swiping { opacity: 0.2; } /* 오빠가 말한 흐려지는 효과 */

        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-dist { font-size: 22px; font-weight: 800; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; padding-top: 8px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #666; font-weight: 800; }
        .h-det-val { font-size: 13px; font-weight: 700; }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; border-top: 1px solid #222; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 14px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        /* Custom Modal - 네온 스타일 */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; display: none;
            justify-content: center; align-items: center;
        }
        #modal-box {
            background: #000; border: 2px solid var(--primary); border-radius: 20px;
            width: 80%; max-width: 280px; padding: 25px; text-align: center;
            box-shadow: 0 0 15px rgba(0,255,136,0.3);
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 12px; border-radius: 20px; border: none; font-weight: 800; }
    </style>
</head>
<body>
    <div id="modal-overlay">
        <div id="modal-box">
            <div style="color:var(--danger); font-weight:900; margin-bottom:10px;">DELETE RECORD</div>
            <div style="font-size:14px;">정말 삭제할까요?</div>
            <div class="modal-btns">
                <button class="m-btn" style="background:#333; color:#fff;" onclick="closeModal()">취소</button>
                <button id="confirm-del" class="m-btn" style="background:var(--danger); color:#fff;">확인</button>
            </div>
        </div>
    </div>

    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div id="gct" class="value">--</div></div>
            <div class="card"><div class="label">FLIGHT</div><div id="flight" class="value">--</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary);" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div>

<script>
let map, marker, polyline, isRunning=false, seconds=0, timer, totalDist=0, lastPos=null, pathCoords=[];
let touchStartX = 0, currentDelId = null;

function initMap() {
    map = L.map('map', {zoomControl:false, attributionControl:false}).setView([37.5, 127], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0]).addTo(map);
    polyline = L.polyline([], {color:'#007bff', weight:5}).addTo(map);
    navigator.geolocation.watchPosition(p => {
        const pos = [p.coords.latitude, p.coords.longitude];
        marker.setLatLng(pos);
        if(isRunning) {
            if(lastPos) {
                let d = map.distance(lastPos, pos)/1000;
                if(d > 0.002) { totalDist+=d; document.getElementById('dist').textContent=totalDist.toFixed(2); lastPos=pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else lastPos = pos;
        } else map.panTo(pos);
    }, null, {enableHighAccuracy:true});
}

function onStart() {
    isRunning=true; seconds=0; totalDist=0; pathCoords=[];
    document.getElementById('btn-start').style.display='none';
    document.getElementById('btn-stop').style.display='block';
    timer = setInterval(() => {
        seconds++;
        document.getElementById('time').textContent = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
    }, 1000);
}

function onStop() {
    isRunning=false; clearInterval(timer);
    const rec = { id: Date.now(), date: new Date().toLocaleString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent };
    let h = JSON.parse(localStorage.getItem('oppaHistory') || "[]");
    h.unshift(rec);
    localStorage.setItem('oppaHistory', JSON.stringify(h));
    location.reload();
}

function showTab(t) {
    document.getElementById('run-view').style.display = t==='run'?'flex':'none';
    document.getElementById('history-view').style.display = t==='history'?'flex':'none';
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
    if(t==='history') renderHistory();
}

// --- 삭제 관련 로직 (오빠 요구사항 반영) ---
function renderHistory() {
    const h = JSON.parse(localStorage.getItem('oppaHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="h-item-container">
            <div class="history-item" id="item-${r.id}" 
                 ontouchstart="ts(event, ${r.id})" 
                 ontouchmove="tm(event, ${r.id})" 
                 ontouchend="te(event, ${r.id})">
                <div class="h-date">${r.date}</div>
                <div class="h-main"><span class="h-dist">${r.dist} KM</span><span>${r.time}</span></div>
                <div class="h-details">
                    <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">--'--"</span></div>
                    <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">0</span></div>
                    <div class="h-det-box"><span class="h-det-label">GCT</span><span class="h-det-val">--</span></div>
                    <div class="h-det-box"><span class="h-det-label">FLIGHT</span><span class="h-det-val">--</span></div>
                </div>
            </div>
        </div>
    `).join('');
}

function ts(e, id) { touchStartX = e.touches[0].clientX; document.getElementById(`item-${id}`).classList.add('swiping'); }
function tm(e, id) {
    let diff = touchStartX - e.touches[0].clientX;
    document.getElementById(`item-${id}`).style.transform = `translateX(${-diff}px)`;
}
function te(e, id) {
    let diff = touchStartX - e.changedTouches[0].clientX;
    let item = document.getElementById(`item-${id}`);
    if(Math.abs(diff) > 80) { // 양방향 80px 이상 밀면
        currentDelId = id;
        document.getElementById('modal-overlay').style.display='flex';
        document.getElementById('confirm-del').onclick = () => {
            let h = JSON.parse(localStorage.getItem('oppaHistory') || "[]");
            localStorage.setItem('oppaHistory', JSON.stringify(h.filter(x => x.id !== id)));
            closeModal(); renderHistory();
        };
    } else {
        item.classList.remove('swiping');
        item.style.transform = 'translateX(0)';
    }
}
function closeModal() {
    document.getElementById('modal-overlay').style.display='none';
    if(currentDelId) {
        let el = document.getElementById(`item-${currentDelId}`);
        if(el) { el.classList.remove('swiping'); el.style.transform = 'translateX(0)'; }
    }
}

window.onload = initMap;
</script>
</body>
</html>
