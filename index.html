<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.2 (Stable Layout)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-dim: #999999; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Map & Status */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* [History View - Structured 3 Sections] */
        .history-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; padding-bottom: 70px; }
        
        /* 1. Top: Total Stats */
        .history-total { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; flex-shrink: 0; }
        .total-box { background: #1a1a1a; padding: 10px 0; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        .total-label { font-size: 7px; color: var(--primary); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .total-val { font-size: 15px; font-weight: 900; }

        /* 2. Middle: Scrollable List */
        .history-list { flex: 1; overflow-y: auto; padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid #222; }
        .h-header { color: var(--primary); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
        .h-main { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
        .h-dist { font-size: 22px; font-weight: 900; }
        .h-time { font-size: 18px; font-weight: 700; color: var(--text-dim); }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 10px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #666; font-weight: 800; margin-bottom: 2px; }
        .h-det-val { font-size: 13px; font-weight: 600; }

        /* 3. Bottom: Expert Info (Fixed) */
        .history-info-fixed { padding: 15px; flex-shrink: 0; border-top: 1px solid #222; background: #000; }
        .info-header { font-size: 12px; font-weight: 900; color: #444; margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 12px; }
        .info-card-title { font-size: 10px; color: var(--primary); font-weight: 900; margin-bottom: 4px; }
        .info-card-desc { font-size: 9px; color: #777; line-height: 1.3; }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; z-index: 100; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS READY</div>
    </div>

    <div id="run-view" class="main-content">
        <div style="padding:20px; text-align:center; font-size:20px; font-weight:900; color:var(--primary);">RUNNING DASHBOARD</div>
        <button onclick="onFinish()" style="margin:20px; padding:15px; background:var(--danger); border:none; border-radius:30px; font-weight:900; color:#fff;">FINISH RUN</button>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-container">
            <div class="history-total">
                <div class="total-box"><span class="total-label">TOTAL DIST</span><span id="all-dist" class="total-val">0.0</span></div>
                <div class="total-box"><span class="total-label">WEEKLY</span><span id="all-week" class="total-val">0.0</span></div>
                <div class="total-box"><span class="total-label">RUNS</span><span id="all-runs" class="total-val">0</span></div>
                <div class="total-box"><span class="total-label">KCAL</span><span id="all-kcal" class="total-val">0</span></div>
            </div>

            <div id="history-list" class="history-list"></div>

            <div class="history-info-fixed">
                <div class="info-header">EXPERT KNOWLEDGE</div>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-card-title">CADENCE MASTER</div>
                        <div class="info-card-desc">Unlock the secret of 180 SPM for injury-free running.</div>
                    </div>
                    <div class="info-card">
                        <div class="info-card-title">DYNAMICS INFO</div>
                        <div class="info-card-desc">Optimize Ground Contact Time and Flight Ratio.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div>

<script>
let map;
function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.56, 126.97], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    updateHistoryStats();
}

function onFinish() {
    // 테스트용 데이터 생성
    const record = {
        date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ", " + new Date().toLocaleDateString('en-US', {weekday:'short'}),
        dist: "0.05", time: "00:34", pace: "10'37\"", cadence: 162, kcal: 3, gctflt: "407/0%"
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    updateHistoryStats();
    showTab('history');
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    let tDist = 0, tKcal = 0;

    h.forEach(r => {
        tDist += parseFloat(r.dist || 0);
        tKcal += parseInt(r.kcal || 0);
        const item = document.createElement('div');
        item.className = 'history-item';
        // 데이터가 없을 때 undefined 방지
        item.innerHTML = `
            <div class="h-header">${r.date || 'Unknown Date'}</div>
            <div class="h-main"><span class="h-dist">${r.dist || '0.00'}KM</span><span class="h-time">${r.time || '00:00'}</span></div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE /</span><span class="h-det-val">${r.pace || "--'--\""}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD /</span><span class="h-det-val">${r.cadence || 0}</span></div>
                <div class="h-det-box"><span class="h-det-label">KCAL /</span><span class="h-det-val">${r.kcal || 0}</span></div>
                <div class="h-det-box"><span class="h-det-label">GCT/FLT /</span><span class="h-det-val">${r.gctflt || "---/-%"}</span></div>
            </div>`;
        list.appendChild(item);
    });
    document.getElementById('all-dist').textContent = tDist.toFixed(1);
    document.getElementById('all-week').textContent = tDist.toFixed(1);
    document.getElementById('all-runs').textContent = h.length;
    document.getElementById('all-kcal').textContent = tKcal;
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').classList.toggle('active', tab === 'run');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
}
window.onload = initMap;
</script>
</body>
</html>
