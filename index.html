<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --tab-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100dvh;
            background-color: var(--dark-bg);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [수정] 지도 영역 - 절대 높이를 확보하여 안 나오는 문제 해결 */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 200px; /* 최소 높이 보장 */
        }
        #map {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: 1;
        }

        /* 대시보드 레이아웃 */
        .dashboard {
            background: var(--dark-bg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .pace-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        #current-pace {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--neon-green);
            line-height: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 10px 4px;
            border-radius: 10px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label { font-size: 0.65rem; color: #888; margin-bottom: 2px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; }
        .stat-unit { font-size: 0.7rem; color: var(--neon-green); margin-left: 2px; }

        .main-btn {
            background: var(--neon-green);
            color: black;
            border: none;
            border-radius: 15px;
            padding: 18px;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        /* 히스토리 화면 레이아웃 복구 */
        #history-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100dvh - var(--tab-height));
            background: var(--dark-bg);
            z-index: 100;
            padding: 15px;
            overflow-y: auto;
        }

        .history-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* 하단 탭 바 */
        .tab-bar {
            height: var(--tab-height);
            display: flex;
            background: #000;
            border-top: 1px solid #222;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #555;
            text-decoration: none;
            font-weight: bold;
        }

        .tab-item.active { color: var(--neon-green); }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <div style="position:absolute; top:10px; width:100%; text-align:center; z-index:1000; font-weight:bold; color:orange; font-size:0.8rem; text-shadow:1px 1px 2px #000;">GPS READY</div>
    </div>
    
    <div id="run-dashboard" class="dashboard">
        <div class="pace-card">
            <div style="color:var(--neon-green); font-size:0.8rem; margin-bottom:5px;">CURRENT PACE</div>
            <div id="current-pace">--'--"</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">DIST</div>
                <div class="stat-value"><span id="dist">0.00</span><span class="stat-unit">KM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TIME</div>
                <div id="time" class="stat-value">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">AVG PACE</div>
                <div id="avg-pace" class="stat-value">--'--"</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">CADENCE</div>
                <div class="stat-value"><span id="cadence">0</span><span class="stat-unit">SPM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">GCT</div>
                <div class="stat-value"><span id="gct">--</span><span class="stat-unit">MS</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">FLIGHT</div>
                <div class="stat-value"><span id="flight">--</span><span class="stat-unit">%</span></div>
            </div>
        </div>

        <button id="startBtn" class="main-btn" onclick="toggleRun()">START RUNNING</button>
    </div>

    <div id="history-screen">
        <h1 style="color:var(--neon-green); font-size:2rem; margin-bottom:20px;">HISTORY</h1>
        
        <div class="history-summary">
            <div class="stat-box">
                <div class="stat-label">TOTAL DIST</div>
                <div class="stat-value">0.00 <span class="stat-unit">KM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">WEEKLY DIST</div>
                <div class="stat-value">0.00 <span class="stat-unit">KM</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TOTAL RUNS</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TOTAL KCAL</div>
                <div class="stat-value">0</div>
            </div>
        </div>

        <div id="history-list">
            <div style="color:#666; text-align:center; margin-top:30px;">NO DATA</div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="javascript:void(0)" class="tab-item active" id="nav-run" onclick="showScreen('run')">RUN</a>
        <a href="javascript:void(0)" class="tab-item" id="nav-history" onclick="showScreen('history')">HISTORY</a>
    </nav>

    <script>
        // --- 기본 로직 및 지도 초기화 ---
        let isRunning = false;
        let map;

        window.onload = function() {
            initMap();
            loadHistory();
        };

        function initMap() {
            // 지도 초기 높이 문제를 해결하기 위한 리사이즈 처리
            map = L.map('map').setView([37.5665, 126.9780], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            setTimeout(() => { map.invalidateSize(); }, 500);
        }

        function toggleRun() {
            isRunning = !isRunning;
            const btn = document.getElementById('startBtn');
            btn.innerText = isRunning ? "STOP RUNNING" : "START RUNNING";
            btn.style.background = isRunning ? "#ff3333" : "#00ff66";
            if(!isRunning) saveRunData();
        }

        function showScreen(screen) {
            const hScreen = document.getElementById('history-screen');
            const rDash = document.getElementById('run-dashboard');
            const mCont = document.getElementById('map-container');
            const navRun = document.getElementById('nav-run');
            const navHistory = document.getElementById('nav-history');

            if(screen === 'history') {
                hScreen.style.display = 'block';
                rDash.style.display = 'none';
                mCont.style.display = 'none';
                navRun.classList.remove('active');
                navHistory.classList.add('active');
                loadHistory();
            } else {
                hScreen.style.display = 'none';
                rDash.style.display = 'flex';
                mCont.style.display = 'block';
                navRun.classList.add('active');
                navHistory.classList.remove('active');
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        }

        function saveRunData() {
            const d = document.getElementById('dist').innerText;
            if(parseFloat(d) <= 0) return;
            const record = {
                date: new Date().toLocaleString('ko-KR'),
                dist: d,
                time: document.getElementById('time').innerText
            };
            let history = JSON.parse(localStorage.getItem('OppaRun_v2_Data') || "[]");
            history.unshift(record);
            localStorage.setItem('OppaRun_v2_Data', JSON.stringify(history));
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const data = localStorage.getItem('OppaRun_v2_Data');
            if(!data || data === "[]") return;
            const history = JSON.parse(data);
            list.innerHTML = history.map(item => `
                <div style="background:#1a1a1a; padding:15px; border-radius:12px; margin-bottom:10px; border-left:4px solid var(--neon-green);">
                    <div style="font-size:0.75rem; color:#888;">${item.date}</div>
                    <div style="font-size:1.1rem; font-weight:bold; margin-top:4px;">${item.dist} KM / ${item.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
