<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* [수정] 100vh 대신 100dvh를 사용하여 주소창/내비바 대응 */
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, system-ui; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        /* [수정] 맵 높이를 고정 수치보다 유연하게 조정 */
        #map-container { height: 20dvh; min-height: 140px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        /* [수정] 메인 컨텐츠 영역이 탭 바에 눌리지 않게 하단 여백 확보 */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding-bottom: calc(65px + env(safe-area-inset-bottom)); 
        }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 90px; margin-bottom: 2px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; opacity: 0.9; }
        .value { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 44px; color: var(--primary); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        /* [수정] 히스토리 대시보드 사이즈 최적화 */
        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 0 10px 10px 10px; flex-shrink: 0; }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; margin-bottom: 3px; opacity: 0.8; text-transform: uppercase; }
        .total-value { font-size: 16px; font-weight: 900; color: #fff; }

        /* [수정] 컨트롤 버튼 영역 위치 조정 */
        .controls { 
            padding: 10px 15px; 
            margin-top: auto; 
            flex-shrink: 0;
        }

        .btn-capsule, .btn-half { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 50px; border-radius: 25px; font-weight: 900; font-size: 16px; } 

        /* [수정] 히스토리 리스트 영역 스크롤 최적화 */
        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; background: #000; overflow: hidden; }
        .history-list { padding: 10px; overflow-y: auto !important; flex: 1; -webkit-overflow-scrolling: touch; }
        
        .history-item { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 15px; }
        .h-dist { font-size: 30px; font-weight: 900; color: #fff; }
        .h-time { font-size: 18px; color: #fff; font-weight: 700; opacity: 0.9; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid #222; padding-top: 12px; }
        .h-info { display: flex; flex-direction: column; }
        .h-info .lab { font-size: 8px; color: #ffffff; font-weight: 900; margin-bottom: 3px; opacity: 0.6; }
        .h-info .val { font-size: 13px; font-weight: 900; color: var(--primary); }
        
        /* [수정] 하단 탭 바: S25 등의 물리 버튼/제스처 영역 보호 */
        .tab-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: calc(65px + env(safe-area-inset-bottom)); 
            background: #000; 
            display: flex; 
            border-top: 1px solid #222; 
            align-items: flex-start; /* 텍스트가 너무 아래로 치우치지 않게 */
            padding-top: 10px;
            padding-bottom: env(safe-area-inset-bottom); 
            z-index: 9999; 
        }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
