<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v19.2 Smooth Path</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff4444; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; }
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #0a0a0a; border-bottom: 1px solid #222; font-weight: bold; min-height: 14px; }
        .dashboard { height: 45vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 10px; box-sizing: border-box; }
        .card { background: var(--card-bg); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1a1a1a; padding: 8px 0; }
        .card-main { grid-column: span 3; border: 1px solid var(--primary); height: 80px; }
        .label { font-size: 8px; color: var(--text-dim); font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 18px; font-weight: 900; }
        .unit { font-size: 9px; color: var(--primary); margin-left: 2px; }
        .value-large { font-size: 36px; color: var(--primary); font-weight: 900; }
        .controls { position: fixed; bottom: 85px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .btn-circle { width: 75px; height: 75px; border-radius: 50%; border: none; font-weight: 900; font-size: 14px; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 80%; }
        .btn-action { flex: 1; height: 50px; border-radius: 25px; border: none; font-weight: 900; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        #history-page { display: none; padding: 20px; height: 90vh; overflow-y: auto; background: var(--bg); }
        .history-item { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

<div id="home-page">
    <div id="map"></div>
    <div id="status" class="status-bar">LOCATING...</div>
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-circle" onclick="onStart()">START</button>
        <button id="btn-stop" class="btn-circle" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div id="history-page">
    <h2 style="color:var(--primary); margin-top: 10px;">MY RECORDS</h2>
    <div id="history-list"></div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showPage('home')">RUN</button>
    <button id="tab-hist" class="tab-btn" onclick="showPage('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], isRunning = false, isPaused = false, seconds = 0;
let lastPos = null, timer, totalDist = 0, stopTimer = null, hasLocated = false;

function init() {
    map = L.map('map', {zoomControl: false}).setView([37.56, 126.97], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 8, opacity: 0.8}).addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);

    navigator.geolocation.watchPosition(p => {
        const {latitude, longitude, accuracy, speed} = p.coords;
        const pos = [latitude, longitude];
        marker.setLatLng(pos);

        if(!hasLocated) {
            map.flyTo(pos, 17, {animate: true, duration: 2});
            hasLocated = true;
            document.getElementById('status').textContent = "GPS READY";
        }

        if(isRunning && !isPaused) {
            document.getElementById('status').textContent = `RUNNING (±${Math.round(accuracy)}m)`;
            
            // 실시간 경로 추가
            pathArray.push(pos);
            pathLine.setLatLngs(pathArray);
            map.panTo(pos);

            if(lastPos) {
                const d = calcDist(lastPos[0], lastPos[1], latitude, longitude);
                if(d > 0.001) { // 1미터 이상 이동 시 거리 누적
                    totalDist += d;
                    document.getElementById('dist').textContent = totalDist.toFixed(2);
                }
            }
            lastPos = pos;
            if(speed > 0.4) document.getElementById('curPace').textContent = formatPace(16.6667/speed);
        }
        
        // 자동 멈춤 감지
        if(isRunning && speed !== null && speed < 0.2 && !isPaused && !stopTimer) {
            stopTimer = setTimeout(() => { onStop(); stopTimer = null; }, 5000);
        } else if(speed > 0.6 && stopTimer) {
            clearTimeout(stopTimer); stopTimer = null;
        }
    }, null, {enableHighAccuracy:true});
}

function onStart() {
    isRunning = true; isPaused = false;
    pathArray = []; // 경로 초기화
    pathLine.setLatLngs([]);
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'flex';
    timer = setInterval(() => { if(!isPaused) {
        seconds++;
        const h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60;
        document.getElementById('time').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if(totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace((seconds/60)/totalDist);
    }}, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; document.getElementById('status').textContent = "PAUSED"; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; }

function onFinish() {
    const record = {
        date: new Date().toLocaleString(),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    
    // 알림창 없이 조용히 종료 처리
    isRunning = false;
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('btn-start').style.display = 'flex';
    document.getElementById('status').textContent = "WORKOUT SAVED";
    
    // 데이터 초기화 (지도는 유지)
    seconds = 0; totalDist = 0; lastPos = null;
}

function showPage(p) {
    document.getElementById('home-page').style.display = (p === 'home' ? 'block' : 'none');
    document.getElementById('history-page').style.display = (p === 'history' ? 'block' : 'none');
    document.getElementById('tab-run').classList.toggle('active', p === 'home');
    document.getElementById('tab-hist').classList.toggle('active', p === 'history');
    if(p === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-list').innerHTML = history.map(h => `
        <div class="history-item">
            <div style="font-size:11px; color:#888;">${h.date}</div>
            <div style="font-size:20px; font-weight:900; margin:5px 0;">${h.dist} KM</div>
            <div style="font-size:14px; color:#ccc;">Time: ${h.time} | Pace: ${h.pace}</div>
        </div>
    `).join('') || '<div style="color:#444; text-align:center; margin-top:50px;">No records yet.</div>';
}

function formatPace(p) { if(!p || p === Infinity) return "--'--\""; const m = Math.floor(p), s = String(Math.floor((p-m)*60)).padStart(2,'0'); return `${m}'${s}"`; }
function calcDist(lat1, lon1, lat2, lon2) { const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180; const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }
window.onload = init;
</script>
</body>
</html>
