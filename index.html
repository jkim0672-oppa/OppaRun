<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.22</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #555555; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; height: 100svh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Top Map Area (Hidden in History) */
        #map-area { flex-shrink: 0; width: 100%; display: block; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #1a1a1a; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #111; }

        /* 🔥 상단 4단 내비게이션 (LIST, TOTAL, INFO, SETTING) */
        .history-nav { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 6px; padding: 12px 12px; background: #000; flex-shrink: 0; 
        }
        .sub-btn { 
            padding: 10px 0; border: none; background: #222; 
            color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; 
            text-align: center; text-transform: uppercase;
        }
        .sub-btn.active { background: var(--primary); color: #000; }

        /* 🔥 상단 요약 정보 바 (TOTAL KM, TIME, COUNT) */
        .summary-bar { 
            display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; 
            padding: 10px 20px; background: #000; border-bottom: 1px solid #1a1a1a;
            font-weight: 900; flex-shrink: 0;
        }
        .s-item { display: flex; flex-direction: column; }
        .s-lbl { font-size: 8px; color: var(--text-dim); margin-bottom: 2px; text-transform: uppercase; }
        .s-val { font-size: 14px; color: var(--primary); letter-spacing: -0.5px; }

        /* Main Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .content-page { display: none; height: 100%; overflow-y: auto; padding-bottom: 100px; }
        .content-page.active { display: block; }

        /* History Card Style */
        .history-item { background: #0f0f0f; border-radius: 12px; padding: 16px; margin: 8px 12px; border: 1px solid #1a1a1a; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .h-main-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-dist-time { font-size: 21px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
        .route-link { color: var(--primary); font-size: 11px; font-weight: 900; text-decoration: none; text-transform: uppercase; }
        
        .h-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; gap: 4px; border-top: 1px solid #222; padding-top: 12px; }
        .h-col { display: flex; flex-direction: column; }
        .h-lbl { font-size: 8px; color: var(--text-dim); font-weight: 800; margin-bottom: 3px; text-transform: uppercase; }
        .h-val { font-size: 12px; font-weight: 800; color: #ddd; }

        /* Bottom Tab Bar */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px; 
            background: #000; display: flex; border-top: 1px solid #1a1a1a; 
            align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; 
        }
        .tab-btn { 
            flex: 1; background: none; border: none; color: #444; 
            font-size: 13px; font-weight: 900; text-transform: uppercase; 
        }
        .tab-btn.active { color: var(--primary); }

        /* Run Dashboard Style */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; margin-bottom: 4px; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; }
        .value { font-size: 22px; font-weight: 900; color: #fff; }
    </style>
</head>
<body>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS READY</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div id="time" class="value">00:00</div></div>
            <div class="card"><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div style="padding:20px;"><button id="btn-start" style="width:100%; height:60px; border-radius:30px; background:var(--primary); font-weight:900; font-size:20px;">START</button></div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="btn-list" class="sub-btn active" onclick="changeSubPage('list')">LIST</button>
            <button id="btn-total" class="sub-btn" onclick="changeSubPage('total')">TOTAL</button>
            <button id="btn-info" class="sub-btn" onclick="changeSubPage('info')">INFO</button>
            <button id="btn-setting" class="sub-btn" onclick="changeSubPage('setting')">SETTING</button>
        </div>
        
        <div class="summary-bar">
            <div class="s-item"><span class="s-lbl">TOTAL KM</span><span id="sum-dist" class="s-val">0.00 KM</span></div>
            <div class="s-item"><span class="s-lbl">TOTAL TIME</span><span id="sum-time" class="s-val">00:00:00</span></div>
            <div class="s-item"><span class="s-lbl">COUNT</span><span id="sum-count" class="s-val">0</span></div>
        </div>

        <div id="page-list" class="content-page active">
            <div id="history-list"></div>
        </div>
        <div id="page-total" class="content-page" style="padding:40px; text-align:center; color:#555;">TOTAL STATS COMING SOON</div>
        <div id="page-info" class="content-page" style="padding:40px; text-align:center; color:#555;">OppaRun Pro v28.22</div>
        <div id="page-setting" class="content-page" style="padding:40px; text-align:center; color:#555;">SETTINGS</div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="switchMainTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="switchMainTab('history')">HISTORY</button>
    </div>

<script>
    // Tab Switching Logic
    function switchMainTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run') ? 'flex' : 'none';
        document.getElementById('history-view').style.display = (tab === 'history') ? 'flex' : 'none';
        document.getElementById('map-area').style.display = (tab === 'run') ? 'block' : 'none';
        
        document.getElementById('tab-run').classList.toggle('active', tab === 'run');
        document.getElementById('tab-history').classList.toggle('active', tab === 'history');
        
        if(tab === 'history') loadHistoryData();
    }

    function changeSubPage(page) {
        const pages = ['list', 'total', 'info', 'setting'];
        pages.forEach(p => {
            document.getElementById('page-' + p).classList.toggle('active', p === page);
            document.getElementById('btn-' + p).classList.toggle('active', p === page);
        });
    }

    function loadHistoryData() {
        const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        let totalKm = 0, totalSec = 0;

        const listHtml = history.map(record => {
            totalKm += parseFloat(record.dist || 0);
            const timeParts = record.time.split(':');
            totalSec += (parseInt(timeParts[0]) * 60) + parseInt(timeParts[1]);

            return `
            <div class="history-item">
                <div class="h-date">${record.date}</div>
                <div class="h-main-row">
                    <div class="h-dist-time">${record.dist}KM ${record.time}</div>
                    <div class="route-link">ROUTE</div>
                </div>
                <div class="h-grid">
                    <div class="h-col"><span class="h-lbl">PACE</span><span class="h-val">${record.pace || "--'--\""}</span></div>
                    <div class="h-col"><span class="h-lbl">CAD</span><span class="h-val">${record.cadence || "0"}</span></div>
                    <div class="h-col"><span class="h-lbl">KCAL</span><span class="h-val">${record.kcal || "0"}</span></div>
                    <div class="h-col"><span class="h-lbl">GCT/FLT</span><span class="h-val">${record.gct || "--"}ms / ${record.flt || "--"}%</span></div>
                </div>
            </div>`;
        }).reverse().join('');

        // Update Summary Bar
        document.getElementById('sum-dist').textContent = totalKm.toFixed(2) + " KM";
        document.getElementById('sum-count').textContent = history.length;
        
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        document.getElementById('sum-time').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        
        document.getElementById('history-list').innerHTML = listHtml;
    }

    window.onload = () => {
        // Initialize Map (Placeholder)
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([33.7743, -117.9380], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    };
</script>
</body>
</html>
