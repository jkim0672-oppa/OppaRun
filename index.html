<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.0 (Triple History)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Layout Structure */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard & Cards */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* History View 3-Parts */
        .history-container { display: flex; flex-direction: column; height: 100%; }
        
        /* 1. Total Stats Area */
        .history-total { padding: 15px; background: #0a0a0a; border-bottom: 1px solid #222; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .total-box { display: flex; flex-direction: column; align-items: center; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; margin-bottom: 2px; }
        .total-val { font-size: 16px; font-weight: 900; }

        /* 2. List Area */
        .history-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; border: 1px solid #1f1f1f; }
        .h-header { margin-bottom: 4px; display: flex; justify-content: space-between; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .h-dist { font-size: 18px; font-weight: 900; color: #fff; }
        .h-time { font-size: 16px; font-weight: 700; color: #999; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #666; font-weight: 800; }
        .h-det-val { font-size: 13px; font-weight: 600; color: #ddd; }

        /* 3. Info/Help Area */
        .history-info { padding: 12px; background: #0f0f0f; border-top: 1px solid #222; margin-bottom: 70px; }
        .info-title { font-size: 10px; color: var(--primary); font-weight: 900; margin-bottom: 5px; }
        .info-text { font-size: 9px; color: #888; line-height: 1.4; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls" style="height:80px; display:flex; justify-content:center; align-items:center; padding:0 15px; margin-bottom:80px;">
            <button id="btn-start" style="width:100%; height:55px; border-radius:30px; border:none; font-weight:900; font-size:18px; background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" style="width:100%; height:55px; border-radius:30px; border:none; font-weight:900; font-size:18px; background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button style="flex:1; height:55px; border-radius:30px; font-weight:900; border:none; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button style="flex:1; height:55px; border-radius:30px; font-weight:900; border:none; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-container">
            <div class="history-total">
                <div class="total-box"><span class="total-label">TOTAL KM</span><span id="total-dist-all" class="total-val">0.0</span></div>
                <div class="total-box"><span class="total-label">TOTAL TIME</span><span id="total-time-all" class="total-val">00:00</span></div>
                <div class="total-box"><span class="total-label">RUNS</span><span id="total-count-all" class="total-val">0</span></div>
            </div>
            
            <div id="history-list" class="history-list"></div>
            
            <div class="history-info">
                <div class="info-title">💡 RUNNING INFO & HELP</div>
                <div class="info-text">
                    • <b>GCT:</b> 지면 접촉 시간. 300ms 이하면 훌륭합니다.<br>
                    • <b>FLIGHT:</b> 체공 시간 비율. 높을수록 탄력적인 주법입니다.<br>
                    • <b>AUTO-PAUSE:</b> 멈추면 자동으로 기록이 일시 중지됩니다.
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) { 
        navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true}); 
    }
    updateHistoryStats();
    window.addEventListener('devicemotion', handleMotion);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        updateDynamicsColors(gct, flt);
    }
}

function updateDynamicsColors(gct, flt) {
    const gDisplay = document.getElementById('gct');
    const fDisplay = document.getElementById('flight');
    gDisplay.textContent = gct || "--";
    fDisplay.textContent = (flt > 0) ? flt : "--";
    let color;
    if (currentSpeedKmh > 9.5) color = (gct < 310) ? "#00ff88" : "#ffcc00";
    else if (currentSpeedKmh > 4.5) {
        if (gct >= 400) color = "#ff4444";
        else if (gct >= 320) color = "#ffcc00";
        else color = "#00ff88";
    } else color = (gct >= 420) ? "#ff4444" : "#ffcc00";
    gDisplay.style.color = color;
    fDisplay.style.color = (flt > 15) ? "#00ff88" : (flt > 5 ? "#ffcc00" : "#999999");
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = p.coords.accuracy.toFixed(1);
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    let stateText = isRunning ? (isPaused || isAutoPaused ? "PAUSED" : "ACTIVE") : "READY";
    document.getElementById('status').textContent = `${stateText} (±${acc}m)`;
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8) {
            if (!isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; }
        } else {
            if (isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; }
        }
        if (!isAutoPaused && p.coords.accuracy < 45) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
} 

function onStart() {
    isRunning = true; isPaused = false; isAutoPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; gctSum = 0; flightSum = 0; dataCount = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 

function onFinish() {
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0;
    const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0;
    const avgCad = Math.round((steps/(seconds||1))*60);
    const kcal = Math.round(totalDist * 65);
    const record = { id: Date.now(), date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})+", "+new Date().toLocaleDateString('en-US',{weekday:'short'}), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: avgCad, kcal: kcal, gctflt: `${avgGct}/${avgFlt}%` };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = "";
    
    let totalKm = 0, totalSec = 0;
    h.forEach(r => {
        totalKm += parseFloat(r.dist);
        let [m, s] = r.time.split(':'); totalSec += (parseInt(m)*60 + parseInt(s));
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="h-header"><span class="h-date">${r.date}</span></div><div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div><div class="h-details"><div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div><div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div><div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${r.kcal}</span></div><div class="h-det-box"><span class="h-det-label">GCT/FLT</span><span class="h-det-val">${r.gctflt}</span></div></div>`;
        list.appendChild(item);
    });

    document.getElementById('total-dist-all').textContent = totalKm.toFixed(1);
    document.getElementById('total-time-all').textContent = `${Math.floor(totalSec/60)}:${String(totalSec%60).padStart(2,'0')}`;
    document.getElementById('total-count-all').textContent = h.length;
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
