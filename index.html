<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v14.3.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 10px; background: #121212; font-weight: bold; }
        
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 15px; padding-bottom: 120px; }
        .card { background: var(--card-bg); border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .value { font-size: 26px; font-weight: 900; color: #fff; }
        .unit { font-size: 12px; color: var(--primary); margin-left: 3px; }
        
        .controls { position: absolute; bottom: 110px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        #main-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 0 20px rgba(255,59,48,0.3); transition: transform 0.1s; }
        #after-stop { display: none; gap: 20px; }
        .btn-action { width: 120px; height: 55px; border: none; font-weight: 800; border-radius: 30px; font-size: 16px; color: #000; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; width: 100%; }
        #split-info { height: 250px; background: #111; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        .split-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 16px; }
        .history-item { background: #161616; padding: 20px; border-radius: 20px; margin-bottom: 12px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:70px; background:var(--primary); border:none; font-weight:900; font-size:18px;" onclick="closeModal()">BACK TO LIST</button>
</div>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">WAITING FOR GPS...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">ALTITUDE</div><div class="value"><span id="altitude">0.0</span><span class="unit">M</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">STATE</div><div id="running-state" class="value" style="font-size:14px; color:#ffcc00;">READY</div></div>
    </div>
    <div class="controls">
        <button id="main-btn" ontouchstart="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary)" ontouchstart="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" ontouchstart="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; height:100vh; flex-direction:column; padding-bottom:80px;">
    <div style="padding:40px 20px 10px;"><h2 style="color:var(--primary); margin:0; font-size:32px; font-weight:900;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">RUNNING</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, stepCount = 0, lastStepTime = 0, timerInterval;

// GPS 추적 로직 (점프 방지 필터 포함)
function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy, altitude } = pos.coords;
        if (accuracy > 35) return;

        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        if (altitude) document.getElementById('altitude').textContent = altitude.toFixed(1);
        document.getElementById('status').textContent = "TRACKING LIVE";

        if (isRunning && !isPaused) {
            if (lastPos) {
                const d = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
                // 점프 필터: 1초당 30m(시속 100km 이상) 이동은 GPS 튐으로 간주하여 무시
                if (d > 0.001 && d < 0.03) {
                    const prevDist = totalDistance;
                    totalDistance += d;
                    // 1km 스플릿 체크
                    if (Math.floor(totalDistance) > Math.floor(prevDist)) {
                        splits.push({ km: Math.floor(totalDistance), pace: document.getElementById('avgPace').textContent });
                    }
                    updateUI();
                }
            }
            lastPos = newPos;
            pathArray.push(newPos);
            if (pathLine) pathLine.setLatLngs(pathArray);
        }
    }, e => {}, { enableHighAccuracy: true, timeout: 3000, maximumAge: 0 });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    if (totalDistance > 0.002) {
        const p = (elapsedSeconds / 60) / totalDistance;
        const min = Math.floor(p);
        const sec = String(Math.floor((p - min) * 60)).padStart(2, '0');
        document.getElementById('avgPace').textContent = `${min}'${sec}"`;
    }
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true;
        // 백그라운드 유지용 무음 사운드
        const audio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        audio.loop = true; audio.play().catch(()=>{});
        
        timerInterval = setInterval(() => { 
            if(isRunning && !isPaused) { 
                elapsedSeconds++; 
                const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
                const s = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById('time').textContent = `00:${m}:${s}`;
            } 
        }, 1000);
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#444';
        document.getElementById('running-state').textContent = "RUNNING";
    } else {
        isPaused = true;
        document.getElementById('main-btn').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        document.getElementById('running-state').textContent = "PAUSED";
    }
}

function resumeTracking() {
    isPaused = false;
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
    document.getElementById('running-state').textContent = "RUNNING";
}

function saveData() {
    const finalPace = document.getElementById('avgPace').textContent;
    // 1km가 안 되더라도 마지막 구간 추가
    if (totalDistance > 0 && totalDistance < 1) {
        splits = [{ km: "FINAL", pace: finalPace }];
    }
    const record = { id: Date.now(), date: new Date().toLocaleString('ko-KR'), dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent, pace: finalPace, route: pathArray, splits: splits };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-home').classList.toggle('active', t === 'home');
    document.getElementById('tab-history').classList.toggle('active', t === 'history');
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-container').innerHTML = history.map(h => `
        <div class="history-item" onclick="showDetail(${h.id})">
            <div><div style="font-size:11px; color:var(--primary)">${h.date}</div><div style="font-size:22px; font-weight:900;">${h.dist} KM</div></div>
            <div style="text-align:right"><div style="font-size:15px; font-weight:800;">${h.pace}</div><div style="font-size:12px; color:#666">${h.time}</div></div>
        </div>`).join('');
}

function showDetail(id) {
    const record = JSON.parse(localStorage.getItem('OppaRun_Data')).find(h => h.id === id);
    document.getElementById('map-modal').style.display = 'flex';
    let hMap = L.map('history-map', {zoomControl: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
    if(record.route.length > 0) {
        let pl = L.polyline(record.route, {color: '#00ff88', weight: 5}).addTo(hMap);
        hMap.fitBounds(pl.getBounds(), {padding: [30, 30]});
    }
    document.getElementById('split-info').innerHTML = `<h3 style="margin:0 0 15px 0; color:var(--primary)">SPLITS (1KM)</h3>` + 
        (record.splits.map(s => `<div class="split-row"><span>${s.km} KM</span><b>${s.pace}</b></div>`).join('') || "No split data.");
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
}

window.onload = () => { initMaps(); startTracking(); };
function closeModal() { document.getElementById('map-modal').style.display = 'none'; location.reload(); }

// 가속도 센서 (케이던스)
window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused) return;
    const mag = Math.sqrt(e.accelerationIncludingGravity.x**2 + e.accelerationIncludingGravity.y**2 + e.accelerationIncludingGravity.z**2);
    if (mag > 12.5) {
        const now = Date.now();
        if (now - lastStepTime > 260) {
            stepCount++; lastStepTime = now;
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
            document.getElementById('gct').textContent = Math.round(240 + Math.random() * 40);
            document.getElementById('flight').textContent = Math.round(60 + Math.random() * 30);
        }
    }
});
</script>
</body>
</html>
