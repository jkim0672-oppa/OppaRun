<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v33.0 (Responsive)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        /* 1. 기본 레이아웃 - 절대 잘리지 않는 구조 */
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui, sans-serif; 
            height: 100vh; height: -webkit-fill-available; /* 모바일 브라우저 높이 대응 */
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* 2. 지도 영역 (비중 조절) */
        #map-area { flex: 0 0 25%; position: relative; min-height: 140px; }
        #map { height: 100%; width: 100%; border-bottom: 1px solid #333; }
        
        .accuracy-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; z-index: 1000; border: 1px solid var(--primary); color: var(--primary); }
        #pause-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--danger); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 900; z-index: 5000; font-size: 18px; box-shadow: 0 0 30px rgba(255, 68, 68, 0.5); border: 2px solid #fff; }

        /* 3. 데이터 표시 영역 (자동 크기 조절) */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; align-content: center; }
        
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 8px 2px; }
        .card-main { grid-column: span 3; border: 2px solid var(--primary); background: rgba(0, 255, 136, 0.05); }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 800; margin-bottom: 2px; }
        .value { font-size: clamp(18px, 5vw, 24px); font-weight: 900; }
        .value-large { font-size: clamp(40px, 12vw, 56px); color: var(--primary); font-weight: 900; line-height: 1; }

        /* 4. 컨트롤 버튼 영역 */
        .controls { padding: 15px 0; margin-bottom: calc(75px + env(safe-area-inset-bottom)); }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; transition: 0.1s; }
        .btn-act:active { transform: scale(0.97); opacity: 0.9; }

        /* 5. 탭 바 (Safe Area 대응) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(70px + env(safe-area-inset-bottom)); background: #080808; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 4000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn i { font-size: 20px; margin-bottom: 4px; }

        /* 6. 서브 페이지 (히스토리/정보) */
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .setting-box { background: #111; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .metro-row { display: flex; align-items: center; gap: 15px; margin: 15px 0; }
        input[type=range] { flex: 1; accent-color: var(--metro-color); height: 8px; }
        
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 8px var(--accent); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="accuracy-box" class="accuracy-tag">GPS ±--m</div>
        <div id="pause-overlay">AUTO PAUSED</div>
        <div id="map"></div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST (KM)</div><div id="dist" class="value">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT (MS)</div><div id="gct" class="value">--</div></div>
            <div class="card"><div class="label">FLIGHT (%)</div><div id="flight" class="value">--</div></div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:12px;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="sub-tab-list" style="flex:1; height:45px; border-radius:12px; border:1px solid #333; background:#111; color:#fff; font-weight:800;" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-info" style="flex:1; height:45px; border-radius:12px; border:1px solid #333; background:#111; color:#fff; font-weight:800;" onclick="showSubTab('info')">INFO / METRO</button>
        </div>
        
        <div id="sub-page-list" class="sub-page"><div id="history-list"></div></div>
        
        <div id="sub-page-info" class="sub-page">
            <div class="setting-box">
                <h3 style="color:var(--metro-color); margin-top:0;">🎸 RHYTHM ENGINE</h3>
                <div class="metro-row">
                    <span style="font-weight:900; width:40px;">BPM</span>
                    <input type="range" id="bpm-range" min="150" max="195" value="175" oninput="updateBPM(this.value)">
                    <span id="bpm-val" style="font-weight:900; width:35px; text-align:right;">175</span>
                </div>
                <div class="metro-row">
                    <span style="font-weight:900; width:40px;">VOL</span>
                    <input type="range" id="vol-range" min="0" max="1" step="0.1" value="0.7" oninput="updateVol(this.value)">
                    <span id="vol-val" style="font-weight:900; width:35px; text-align:right;">70%</span>
                </div>
                <button onclick="toggleMetronome()" id="btn-metro-main" style="width:100%; height:50px; border-radius:12px; border:none; background:var(--metro-color); color:#000; font-weight:900; font-size:16px;">START BEAT</button>
            </div>
            
            <div class="setting-box">
                <h3 style="color:var(--primary); margin-top:0;">APP SETTINGS</h3>
                <button style="padding:10px 20px; border-radius:8px; border:none; background:#333; color:#fff; font-weight:800;" onclick="alert('Language toggled!')">KOREAN / ENGLISH</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
// [정밀 튜닝된 JS 로직]
let map, marker, polyline, timer, audioCtx, metroTimer, metroGain;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0, autoPauseCounter = 0;

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[14,14]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = p.coords.accuracy;
    const speedKmh = (p.coords.speed || 0) * 3.6;
    
    document.getElementById('accuracy-box').textContent = `GPS ±${Math.round(acc)}m`;
    
    // 자동 멈춤 피드백 (시각적 안내 추가)
    if (isRunning && !isPaused && speedKmh < 1.0) {
        autoPauseCounter++;
        if (autoPauseCounter > 4) {
            onStop();
            document.getElementById('pause-overlay').style.display = 'block';
        }
    } else if (isRunning && isPaused && speedKmh > 3.0) {
        onResume();
        document.getElementById('pause-overlay').style.display = 'none';
        autoPauseCounter = 0;
    }

    marker.setLatLng(pos);
    if (isRunning && !isPaused && acc < 40) {
        if (lastPos) {
            let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
            if (d > 0.002) { 
                totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2); 
                lastPos = pos; 
                pathCoords.push(pos); 
                polyline.setLatLngs(pathCoords); 
            }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(speedKmh);
    }
}

function toggleMetronome() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        metroGain = audioCtx.createGain();
        metroGain.gain.value = document.getElementById('vol-range').value;
        metroGain.connect(audioCtx.destination);
    }
    isMetroOn = !isMetroOn;
    const btn = document.getElementById('btn-metro-main');
    if (isMetroOn) {
        btn.textContent = "STOP BEAT"; btn.style.background = "var(--danger)"; btn.style.color = "#fff";
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        btn.textContent = "START BEAT"; btn.style.background = "var(--metro-color)"; btn.style.color = "#000";
        clearTimeout(metroTimer);
    }
}

function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.frequency.value = 1200; // 경쾌한 타격음 주파수
        env.gain.setValueAtTime(0, nextClickTime);
        env.gain.linearRampToValueAtTime(1, nextClickTime + 0.005);
        env.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05);
        osc.connect(env); env.connect(metroGain);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.06);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    document.getElementById('pause-overlay').style.display = 'none';
    timer = setInterval(() => { if(!isPaused) {
        seconds++;
        document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    }}, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; document.getElementById('pause-overlay').style.display = 'none'; }
function onFinish() { location.reload(); }
function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }
function updateVol(v) { if(metroGain) metroGain.gain.value = v; document.getElementById('vol-val').textContent = Math.round(v*100) + '%'; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }

function showTab(t) {
    document.getElementById('run-view').style.display = t==='run'?'flex':'none';
    document.getElementById('history-view').style.display = t==='history'?'flex':'none';
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
    if(t==='run') setTimeout(() => map.invalidateSize(), 200);
}
function showSubTab(s) {
    document.getElementById('sub-page-list').style.display = s==='list'?'flex':'none';
    document.getElementById('sub-page-info').style.display = s==='info'?'flex':'none';
}
window.onload = initMap;
</script>
</body>
</html>
