<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.18 (Clean Update)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* v28.12 원본 CSS 및 시그니처 컬러 유지 */
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* 상단 지도 영역 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 원본 대시보드 그리드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* 히스토리 스타일 */
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-main { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .text-route-link { color: var(--primary); font-size: 13px; font-weight: 900; cursor: pointer; background: rgba(0, 255, 136, 0.1); padding: 5px 8px; border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 6px; }

        /* ---------------------------------------------------- */
        /* [핵심 추가] Route 상세 보기 페이지 (5:5 분할) */
        /* ---------------------------------------------------- */
        #record-detail-view { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; display: none; flex-direction: column; 
        }
        #det-map-area { height: 50%; width: 100%; border-bottom: 2px solid var(--primary); position: relative; }
        #det-map { height: 100%; width: 100%; }
        .det-data-area { height: 50%; padding: 20px; overflow-y: auto; }
        .det-dist-focus { font-size: 48px; font-weight: 900; color: var(--primary); margin-bottom: 15px; }
        .det-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .back-btn { 
            position: absolute; top: 15px; left: 15px; z-index: 2001; 
            background: rgba(0,0,0,0.7); color: #fff; border: 1.5px solid var(--primary); 
            padding: 8px 16px; border-radius: 20px; font-weight: 900;
        }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div style="padding: 20px;"><button style="background:var(--primary); color:#000; width:100%; height:55px; border-radius:30px; border:none; font-weight:900; font-size:18px;" onclick="onStart()">START RUNNING</button></div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
    </div> 

    <div id="record-detail-view">
        <button class="back-btn" onclick="closeDetail()">← BACK</button>
        <div id="det-map-area"><div id="det-map"></div></div>
        <div class="det-data-area">
            <div id="det-date" style="font-size:12px; color:var(--primary); font-weight:700; margin-bottom:5px;">Date</div>
            <div class="det-dist-focus"><span id="det-dist">0.00</span> <span style="font-size:20px;">KM</span></div>
            <div class="det-grid">
                <div class="card"><div class="label">TIME</div><div id="det-time" class="value">00:00</div></div>
                <div class="card"><div class="label">AVG PACE</div><div id="det-pace" class="value">--'--"</div></div>
                <div class="card"><div class="label">GCT / FLIGHT</div><div id="det-gct" class="value" style="font-size:16px;">-- / --%</div></div>
                <div class="card"><div class="label">CALORIES</div><div id="det-kcal" class="value">0 KCAL</div></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, isRunning = false, pathCoords = [];
let detMap, detPolyline; // 상세 지도용 변수

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0]).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
}

// ROUTE 버튼 클릭 시 호출 (절반 지도 / 절반 데이터 상세 뷰)
function viewRecordMap(id) {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = history.find(item => item.id === id);
    if (!r) return;

    document.getElementById('record-detail-view').style.display = 'flex';
    document.getElementById('det-date').textContent = r.date;
    document.getElementById('det-dist').textContent = r.dist;
    document.getElementById('det-time').textContent = r.time;
    document.getElementById('det-pace').textContent = r.pace;
    document.getElementById('det-gct').textContent = r.gctflt;
    document.getElementById('det-kcal').textContent = (r.kcal || 0) + " KCAL";

    // 상세 지도 렌더링 (100ms 지연으로 DOM 안정화)
    setTimeout(() => {
        if (!detMap) {
            detMap = L.map('det-map', {zoomControl: false, attributionControl: false});
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detMap);
            detPolyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(detMap);
        }
        if (r.path && r.path.length > 0) {
            detPolyline.setLatLngs(r.path);
            detMap.fitBounds(detPolyline.getBounds(), {padding: [30, 30]});
        } else {
            detMap.setView([37.5665, 126.9780], 15);
        }
        detMap.invalidateSize();
    }, 100);
}

function closeDetail() { document.getElementById('record-detail-view').style.display = 'none'; }

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date" style="font-size:11px; color:var(--primary); font-weight:700;">${r.date}</div>
            <div class="h-main">
                <span style="font-size:22px; font-weight:900;">${r.dist}KM</span>
                <span style="font-size:18px; font-weight:700; color:#888; margin-left:10px;">${r.time}</span>
                <span class="text-route-link" style="margin-left:auto" onclick="viewRecordMap(${r.id})">ROUTE</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid #222; padding-top:8px; gap:4px;">
                <div class="h-det-box"><span class="label">PACE</span><span class="value" style="font-size:14px;">${r.pace}</span></div>
                <div class="h-det-box"><span class="label">KCAL</span><span class="value" style="font-size:14px;">${r.kcal}</span></div>
                <div class="h-det-box"><span class="label">GCT/FLT</span><span class="value" style="font-size:11px;">${r.gctflt}</span></div>
            </div>
        </div>`).join('');
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'history') updateHistoryStats();
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.getElementById('sub-page-list').style.display = (sub === 'list' ? 'flex' : 'none');
    document.getElementById('sub-page-total').style.display = (sub === 'total' ? 'flex' : 'none');
}

function onStart() { isRunning = true; alert("러닝을 시작합니다!"); } // 원본 로직 대체 가능 부분

window.onload = initMap;
</script>
</body>
</html>
