<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v14.1.5</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        
        #custom-alert, #confirm-alert, #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
        .alert-box { background: #1a1a1a; width: 260px; border-radius: 24px; padding: 25px; text-align: center; border: 1px solid #333; }
        .alert-btn { background: var(--primary); color: #000; border: none; width: 100%; padding: 12px; border-radius: 14px; font-weight: 800; margin-top: 15px; }

        /* 경로 상세 모달 */
        #modal-map-container { width: 92%; height: 85%; background: #121212; border-radius: 24px; overflow: hidden; border: 1px solid #333; position: relative; display: flex; flex-direction: column; }
        #history-map { flex: 1; width: 100%; }
        #split-info { padding: 15px; background: #1a1a1a; max-height: 150px; overflow-y: auto; font-size: 13px; border-top: 1px solid #333; }
        .split-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .modal-close-btn { width: 100%; padding: 15px; background: #222; color: #fff; font-weight: 900; border: none; }

        #dim-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.94); z-index: 9999; display: none; justify-content: center; align-items: center; }
        #dim-overlay.active { display: flex; }

        .page { display: none; height: 100vh; flex-direction: column; }
        .page.active { display: flex; }
        #map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 10px; background: #121212; font-weight: bold; }
        
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 15px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; color: #fff; }
        .unit { font-size: 12px; color: var(--primary); margin-left: 3px; }
        
        .controls { position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        #main-btn { width: 76px; height: 76px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; pointer-events: auto; }
        #after-stop { display: none; gap: 18px; pointer-events: auto; }
        .btn-action { padding: 16px 30px; border: none; font-weight: 800; border-radius: 40px; font-size: 15px; }
        .btn-resume { background: var(--primary); }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        
        .history-item { background: #161616; padding: 20px; border-radius: 20px; margin-bottom: 12px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body onclick="resetDimTimer()">

<div id="custom-alert"><div class="alert-box"><div class="alert-msg" style="color:var(--primary)">ACTIVITY SAVED</div><button class="alert-btn" onclick="location.reload()">OK</button></div></div>
<div id="confirm-alert"><div class="alert-box"><div class="alert-msg">DELETE RECORD?</div><button class="alert-btn" id="confirm-yes">DELETE</button><button class="alert-btn" style="background:#333; color:#fff" onclick="closeConfirm()">CANCEL</button></div></div>

<div id="map-modal">
    <div id="modal-map-container">
        <div id="history-map"></div>
        <div id="split-info"></div>
        <button class="modal-close-btn" onclick="closeMapModal()">CLOSE</button>
    </div>
</div>

<div id="dim-overlay" onclick="resetDimTimer()">
    <div style="text-align:center;">
        <div style="color:var(--primary); font-size:54px; font-weight:900;" id="dim-dist">0.00</div>
        <div style="color:#ffcc00; font-size:16px; margin-top:10px; font-weight:800;">TAP TO WAKE UP</div>
    </div>
</div>

<div id="page-home" class="page active">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">ALTITUDE</div><div class="value"><span id="altitude">0.0</span><span class="unit">M</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">STATUS</div><div id="running-state" class="value" style="font-size:14px; color:#ffcc00;">READY</div></div>
    </div>
    <div class="controls">
        <button id="main-btn">START</button>
        <div id="after-stop">
            <button class="btn-action btn-resume" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action btn-finish" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" class="page">
    <div style="padding:30px 20px 10px 20px;"><h2 style="color:var(--primary); margin:0; font-size:32px; font-weight:900;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-run" onclick="switchPage('home')">RUNNING</button>
    <button class="tab-btn" id="tab-his" onclick="switchPage('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [];
let hMap, hPathLine;
let totalDistance = 0, isRunning = false, isPaused = false, isAutoPaused = false, elapsedSeconds = 0;
let watchId, timerInterval, dimTimer, stopCounter = 0;
let splits = []; // 1km 단위 페이스 저장

// 센서 데이터 변수
let stepCount = 0, lastStepTime = 0, gctValue = 0, flightValue = 0;

function speak(text) {
    if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR'; msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
    }
}

function initMaps() {
    try {
        map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        pathLine = L.polyline([], {color: '#00ff88', weight: 6, opacity: 0.9}).addTo(map);
        marker = L.circleMarker([0, 0], {radius: 7, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
        setTimeout(() => map.invalidateSize(), 500);
    } catch (e) {}
}

// 센서 데이터를 이용한 정밀 분석 (가속도 센서 활용)
function initSensors() {
    if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', (event) => {
            if (!isRunning || isPaused || isAutoPaused) return;
            const acc = event.accelerationIncludingGravity;
            const mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
            
            // 단순 임계값 방식으로 발걸음 감지 (오빠의 러닝 패턴에 맞춰 조정 필요)
            if (mag > 13) { 
                const now = Date.now();
                if (now - lastStepTime > 250) { 
                    stepCount++;
                    const diff = now - lastStepTime;
                    // 지면 접촉 및 비행 시간 추정 (베타 모델)
                    gctValue = Math.round(diff * 0.4); 
                    flightValue = Math.round(diff * 0.2);
                    lastStepTime = now;
                    updateSensorUI();
                }
            }
        });
    }
}

function updateSensorUI() {
    const cadence = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
    document.getElementById('cadence').textContent = cadence;
    document.getElementById('gct').textContent = gctValue;
    document.getElementById('flight').textContent = flightValue;
}

function startTracking() {
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, speed, accuracy, altitude } = pos.coords;
        if (accuracy > 35) return;
        
        document.getElementById('status').textContent = "TRACKING LIVE";
        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        if (altitude !== null) document.getElementById('altitude').textContent = altitude.toFixed(1);

        if (isRunning && !isPaused) {
            const curSpeed = (speed || 0) * 3.6;
            if (curSpeed < 0.8) {
                stopCounter++;
                if (stopCounter > 4 && !isAutoPaused) {
                    isAutoPaused = true;
                    document.getElementById('running-state').textContent = "AUTO PAUSE";
                    speak("일시 정지.");
                }
            } else {
                stopCounter = 0;
                if (isAutoPaused) {
                    isAutoPaused = false;
                    document.getElementById('running-state').textContent = "RUNNING";
                    speak("시작.");
                }
            }

            if (!isAutoPaused) {
                if (pathArray.length > 0) {
                    const last = pathArray[pathArray.length - 1];
                    const d = calculateDistance(last[0], last[1], latitude, longitude);
                    if (d > 0.003 && d < 0.06) { 
                        const prevDist = totalDistance;
                        totalDistance += d; 
                        
                        // 1km 마다 페이스 기록 및 음성 안내
                        if (Math.floor(totalDistance) > Math.floor(prevDist)) {
                            const currentPace = document.getElementById('avgPace').textContent;
                            splits.push({ km: Math.floor(totalDistance), pace: currentPace });
                            speak(`${Math.floor(totalDistance)} 킬로미터 완료. 현재 페이스는 ${currentPace} 입니다.`);
                        }
                        updateUI(); 
                    }
                }
                pathArray.push(newPos);
                if (pathLine) pathLine.setLatLngs(pathArray);
            }
        }
    }, e => {}, { enableHighAccuracy: true });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    document.getElementById('dim-dist').textContent = totalDistance.toFixed(2);
    if (totalDistance > 0.02) { // 20m 이상 이동 시 페이스 계산 (정확도 향상)
        const p = (elapsedSeconds / 60) / totalDistance;
        const min = Math.floor(p);
        const sec = String(Math.floor((p - min) * 60)).padStart(2, '0');
        document.getElementById('avgPace').textContent = `${min}'${sec}"`;
    }
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

document.getElementById('main-btn').onclick = function() {
    if (!isRunning) {
        isRunning = true; isPaused = false; totalDistance = 0; elapsedSeconds = 0; pathArray = []; stepCount = 0; splits = [];
        timerInterval = setInterval(() => { if(!isPaused && !isAutoPaused) { elapsedSeconds++; updateTimerUI(); } }, 1000);
        this.textContent = 'STOP'; this.style.background = '#444';
        document.getElementById('running-state').textContent = "RUNNING";
        speak("러닝을 시작합니다.");
    } else {
        isPaused = true; this.style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        document.getElementById('running-state').textContent = "PAUSED";
    }
};

function resumeTracking() {
    isPaused = false; stopCounter = 0;
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
    document.getElementById('running-state').textContent = "RUNNING";
    speak("다시 시작합니다.");
}

function saveData() {
    const record = { 
        id: Date.now(), 
        date: new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}), 
        dist: totalDistance.toFixed(2), 
        time: document.getElementById('time').textContent, 
        pace: document.getElementById('avgPace').textContent,
        route: pathArray,
        splits: splits // 구간 페이스 저장
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record); 
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    document.getElementById('custom-alert').style.display = 'flex';
}

function showRouteOnMap(id) {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    const record = history.find(h => h.id === id);
    if (!record) return;

    document.getElementById('map-modal').style.display = 'flex';
    if (!hMap) {
        hMap = L.map('history-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        hPathLine = L.polyline([], {color: '#00ff88', weight: 5}).addTo(hMap);
    }
    
    // 경로 그리기
    if (record.route && record.route.length > 0) {
        hPathLine.setLatLngs(record.route);
        hMap.fitBounds(hPathLine.getBounds(), {padding: [30, 30]});
    }

    // 구간 페이스 표시
    const splitContainer = document.getElementById('split-info');
    if (record.splits && record.splits.length > 0) {
        splitContainer.innerHTML = '<div style="font-weight:900; color:var(--primary); margin-bottom:10px;">SPLITS (Per KM)</div>' + 
            record.splits.map(s => `<div class="split-row"><span>${s.km} KM</span><span style="font-weight:900;">${s.pace}</span></div>`).join('');
    } else {
        splitContainer.innerHTML = '<div style="color:#555; text-align:center;">No split data for short runs.</div>';
    }
    
    setTimeout(() => hMap.invalidateSize(), 300);
}

function closeMapModal() { document.getElementById('map-modal').style.display = 'none'; }

function loadHistory() {
    const container = document.getElementById('history-container');
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    if(history.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#555; margin-top:50px;">NO RECORDS</div>';
        return;
    }
    container.innerHTML = history.map(h => `
        <div class="history-item">
            <div style="flex:1" onclick="showRouteOnMap(${h.id})">
                <div style="font-size:11px; color:#00ff88; margin-bottom:6px; font-weight:800;">${h.date}</div>
                <div style="font-size:22px; font-weight:900;">${h.dist} <span style="font-size:12px; color:#666">KM</span></div>
                <div style="font-size:13px; color:#aaa; margin-top:4px;">${h.pace} | ${h.time}</div>
            </div>
            <button style="background:none; border:none; color:#ff3b30; font-size:24px;" onclick="openConfirm(${h.id})">×</button>
        </div>
    `).join('');
}

let deleteTargetId = null;
function openConfirm(id) { deleteTargetId = id; document.getElementById('confirm-alert').style.display = 'flex'; }
function closeConfirm() { document.getElementById('confirm-alert').style.display = 'none'; }
document.getElementById('confirm-yes').onclick = function() {
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history = history.filter(h => h.id !== deleteTargetId);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    closeConfirm(); loadHistory();
};

function switchPage(p) {
    document.getElementById('page-home').classList.toggle('active', p === 'home');
    document.getElementById('page-history').classList.toggle('active', p === 'history');
    document.getElementById('tab-run').classList.toggle('active', p === 'home');
    document.getElementById('tab-his').classList.toggle('active', p === 'history');
    if(p === 'history') loadHistory();
    else if(map) setTimeout(() => map.invalidateSize(), 200);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function resetDimTimer() {
    document.getElementById('dim-overlay').classList.remove('active');
    clearTimeout(dimTimer);
    if (isRunning && !isPaused) dimTimer = setTimeout(() => document.getElementById('dim-overlay').classList.add('active'), 45000);
}

window.onload = () => { initMaps(); startTracking(); initSensors(); };
</script>
</body>
</html>
