<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; margin-bottom: 2px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; opacity: 0.9; }
        .value { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }

        .controls { height: 90px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; flex-shrink: 0; margin-bottom: 80px; }

        /* [핵심] 버튼 피드백 효과 */
        .btn-capsule, .btn-half, .btn-map-view, .tab-btn { transition: transform 0.05s ease, filter 0.05s ease; }
        .btn-capsule:active, .btn-half:active, .btn-map-view:active { transform: scale(0.97); filter: brightness(0.8); }
        .tab-btn:active { transform: scale(0.9); }

        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; font-size: 16px; border: none; display: flex; align-items: center; justify-content: center; } 

        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; background: #000; max-height: calc(100vh - 18vh - 65px - 30px); }
        .history-list { padding: 10px; overflow-y: auto !important; flex: 1; display: block; -webkit-overflow-scrolling: touch; min-height: 0; padding-bottom: 100px; }
        
        /* [개선] 히스토리 아이템 가독성 강화 스타일 */
        .history-item { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #1f1f1f; position: relative; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 18px; }
        .h-dist { font-size: 32px; font-weight: 900; color: #fff; }
        .h-time { font-size: 18px; color: #fff; font-weight: 700; opacity: 0.9; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 1px solid #222; padding-top: 15px; }
        .h-info { display: flex; flex-direction: column; }
        /* 제목 글자 선명화 */
        .h-info .lab { font-size: 9px; color: #ffffff; font-weight: 900; margin-bottom: 5px; letter-spacing: 0.5px; opacity: 0.6; }
        /* 데이터 숫자 초록색으로 강조 */
        .h-info .val { font-size: 14px; font-weight: 900; color: var(--primary); }
        
        .btn-map-view { background: #222; color: var(--primary); border: 1.5px solid var(--primary); border-radius: 20px; font-size: 9px; font-weight: 900; padding: 4px 10px; }
        .splits-box { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #333; }
        .split-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #aaa; margin-bottom: 2px; }
        .h-delete { color: #555; font-size: 11px; text-decoration: underline; padding: 8px 0; font-weight: 800; text-align: right; display: block; margin-top: 15px; }

        #full-map-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; }
        #full-map { width: 100%; height: calc(100% - 80px); }
        .close-map-btn { height: 80px; background: #111; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">LOCATING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content">
        <div style="padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0;">
            <span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span>
            <span id="total-summary" style="font-size: 11px; color: #aaa;">0 Runs</span>
        </div>
        <div id="history-list" class="history-list"></div>
    </div> 

    <div id="full-map-overlay">
        <div id="full-map"></div>
        <div class="close-map-btn" onclick="closeFullMap()">BACK TO HISTORY</div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, historyMap, historyLayer, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0, splits = [], kmStartSeconds = 0;
const AUTO_PAUSE_THRESHOLD = 1.5;
let lowSpeedTicks = 0; 

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); } 
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 

function initMap() {
    try {
        map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
        polyline = L.polyline([], {color: '#007bff', weight: 5, opacity: 0.8}).addTo(map);
        if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
        loadHistory();
        window.addEventListener('devicemotion', handleMotion);
    } catch(e) { console.error("Init Error", e); }
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = 0, flt = 0;
        if (currentSpeedKmh > 7.5) { 
            gct = Math.max(180, Math.floor(240 - (currentSpeedKmh * 3) + (Math.random() * 20)));
            flt = Math.floor(18 + (currentSpeedKmh * 1.2) + (Math.random() * 5));
        } else if (currentSpeedKmh > 1.0) { 
            gct = Math.floor(450 - (currentSpeedKmh * 10) + (Math.random() * 50));
            flt = Math.max(0, Math.floor(currentSpeedKmh * 2));
        }
        gctSum += gct; flightSum += flt; dataCount++;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--"; 
        document.getElementById('flight').textContent = flt || "0";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "GPS READY"; }
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < AUTO_PAUSE_THRESHOLD) {
            lowSpeedTicks++;
            if (lowSpeedTicks >= 3 && !isAutoPaused) { isAutoPaused = true; vibrate([50, 50, 50]); document.getElementById('status').textContent = "AUTO PAUSED"; document.getElementById('status').style.color = "#ff4444"; }
        } else {
            lowSpeedTicks = 0;
            if (isAutoPaused) { isAutoPaused = false; vibrate(200); document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00"; }
        }
    }

    if (isRunning && !isPaused && !isAutoPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.005) { 
                let oldDist = totalDist; totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2); 
                lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
                if (Math.floor(totalDist) > Math.floor(oldDist)) {
                    let splitTime = seconds - kmStartSeconds;
                    splits.push(Math.floor(splitTime/60) + "'" + String(splitTime%60).padStart(2,'0') + "\"");
                    kmStartSeconds = seconds;
                }
            }
        } else { lastPos = pos; kmStartSeconds = seconds; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
} 

function onStart() {
    requestWakeLock(); vibrate(100);
    isRunning = true; isPaused = false; isAutoPaused = false; totalDist = 0; seconds = 0; steps = 0; lastPos = null; pathCoords = []; splits = [];
    gctSum = 0; flightSum = 0; dataCount = 0; lowSpeedTicks = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00";
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop() { isPaused = true; vibrate(50); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; document.getElementById('status').textContent = "PAUSED"; }
function onResume() { isPaused = false; isAutoPaused = false; lowSpeedTicks = 0; vibrate(100); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; document.getElementById('status').textContent = "RUNNING"; } 

function onFinish() {
    vibrate([100, 50, 100]); releaseWakeLock();
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'}),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        avgPace: document.getElementById('avgPace').textContent,
        cadence: Math.round((steps / (seconds || 1)) * 60),
        kcal: Math.round(totalDist * 70),
        gct: dataCount ? Math.round(gctSum / dataCount) : "--",
        flight: dataCount ? Math.round(flightSum / dataCount) : "--",
        path: pathCoords,
        splits: splits
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    showTab('history');
    isRunning = false; clearInterval(timer);
    document.getElementById('btn-start').style.display = 'flex'; document.getElementById('after-stop').style.display = 'none';
} 

function showFullMap(id) {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const item = history.find(r => r.id === id);
    if (!item || !item.path || !item.path.length) return alert("경로 데이터가 없습니다.");
    document.getElementById('full-map-overlay').style.display = 'block';
    if (!historyMap) { historyMap = L.map('full-map', {zoomControl: false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(historyMap); }
    if (historyLayer) historyMap.removeLayer(historyLayer);
    historyLayer = L.polyline(item.path, {color: '#00ff88', weight: 6}).addTo(historyMap);
    historyMap.fitBounds(historyLayer.getBounds(), {padding: [40, 40]});
}
function closeFullMap() { document.getElementById('full-map-overlay').style.display = 'none'; }

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    document.getElementById('total-summary').textContent = `${history.length} Runs`;
    list.innerHTML = history.length ? "" : '<div style="color:#333; text-align:center; margin-top:100px; font-weight:900;">NO DATA</div>';
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        let splitHtml = (r.splits || []).map((s, i) => `<div class="split-row"><span>${i+1}KM</span><span>${s}</span></div>`).join('');
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span><button class="btn-map-view" onclick="showFullMap(${r.id})">VIEW MAP</button></div>
            <div class="h-main-stats"><span class="h-dist">${r.dist}<small style="font-size:12px; margin-left:4px; color:var(--primary)">KM</small></span><span class="h-time">${r.time}</span></div>
            <div class="h-grid">
                <div class="h-info"><span class="lab">PACE</span><span class="val">${r.avgPace}</span></div>
                <div class="h-info"><span class="lab">CADENCE</span><span class="val">${r.cadence}</span></div>
                <div class="h-info"><span class="lab">KCAL</span><span class="val">${r.kcal}</span></div>
                <div class="h-info"><span class="lab">GCT/FLT</span><span class="val">${r.gct}ms/${r.flight}%</span></div>
            </div>
            ${splitHtml ? `<div class="splits-box">${splitHtml}</div>` : ''}
            <span class="h-delete" onclick="if(confirm('삭제할까요?')){let h=JSON.parse(localStorage.getItem('oppaRunHistory'));h=h.filter(x=>x.id!=${r.id});localStorage.setItem('oppaRunHistory',JSON.stringify(h));loadHistory();}">Delete Record</span>`;
        list.appendChild(item);
    });
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
    if(tab === 'history') loadHistory();
}
window.onload = initMap;
</script>
</body>
</html>
