<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.3.2 (Visual Stable)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* [오빠의 오리지널 디자인 변수 및 스타일 그대로 유지] */
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --good: #00ff88;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; transition: border-color 0.3s ease; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; transition: 0.2s; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; margin-bottom: 10px; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        /* [메트로놈 모달] */
        #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; }
        .close-detail { position: absolute; top: 20px; right: 20px; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; }
        .metro-slider { width: 100%; accent-color: var(--primary); margin: 10px 0; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div style="padding: 60px 20px 20px;">
            <div style="font-size:24px; font-weight:900; color:var(--primary);">METRONOME</div>
        </div>
        <div class="card" style="margin: 20px;">
            <div class="label">TEMPO (BPM)</div>
            <div id="metro-bpm-val" style="font-size: 50px; font-weight: 900; color: var(--primary);">175</div>
            <input type="range" id="metro-bpm" class="metro-slider" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div style="padding: 0 20px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            
            <div id="card-cadence" class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div id="card-gct" class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div id="card-flight" class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container">
                <button id="btn-clear-history" style="background:#2a2a2a; color:var(--danger); border:1.5px solid #444; padding:18px; border-radius:12px; width:100%; font-weight:900;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
// [로직 강화: 오리지널 로직 보존 + 충돌 해결]

class RunningStorage {
    constructor() { this.KEY = 'oppaRunHistory'; }
    saveRecord(r) { let h = this.loadHistory(); h.unshift(r); localStorage.setItem(this.KEY, JSON.stringify(h)); }
    loadHistory() { let d = localStorage.getItem(this.KEY); return d ? JSON.parse(d) : []; }
    clearHistory() { if(confirm("Clear?")) { localStorage.removeItem(this.KEY); location.reload(); } }
}

class UIManager {
    constructor() {
        this.dom = {
            curPace: document.getElementById('curPace'), dist: document.getElementById('dist'), time: document.getElementById('time'),
            avgPace: document.getElementById('avgPace'), cadence: document.getElementById('cadence'),
            gct: document.getElementById('gct'), flight: document.getElementById('flight'),
            btnStart: document.getElementById('btn-start'), afterStop: document.getElementById('after-stop')
        };
    }
    updateRunningDisplay(data) {
        if (data.pace) this.dom.curPace.textContent = data.pace;
        if (data.dist) this.dom.dist.textContent = data.dist;
        if (data.time) this.dom.time.textContent = data.time;
        if (data.avgPace) this.dom.avgPace.textContent = data.avgPace;
        if (data.cadence !== undefined) this.dom.cadence.textContent = data.cadence;
        if (data.gct) this.dom.gct.textContent = data.gct;
        if (data.flight) this.dom.flight.textContent = data.flight;
    }
    showTab(t) {
        document.getElementById('run-view').style.display = (t === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (t === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (t === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        if(t === 'history') this.renderHistory();
    }
    showSubTab(s) {
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + s).style.display = 'flex';
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + s).classList.add('active');
    }
    openMetronome() { document.getElementById('metronome-view').style.display = 'flex'; }
    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; }
    renderHistory() {
        let h = storage.loadHistory();
        document.getElementById('history-list').innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div style="font-size:18px; font-weight:900;">${r.dist} KM / ${r.time}</div>
                <div style="font-size:11px; color:#888;">PACE: ${r.avgPace} | CAD: ${r.cadence}</div>
            </div>`).join('');
    }
}

class MetroEngine {
    constructor() { this.audioCtx = null; this.timerID = null; this.isPlaying = false; this.nextTick = 0; }
    async init() {
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
    }
    playClick() {
        let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = 800;
        g.gain.value = 0.5; g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        osc.connect(g); g.connect(this.audioCtx.destination);
        osc.start(); osc.stop(this.audioCtx.currentTime + 0.1);
    }
    scheduler() {
        while (this.nextTick < this.audioCtx.currentTime + 0.1) {
            this.playClick(); this.nextTick += 60.0 / document.getElementById('metro-bpm').value;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    }
    async toggle() {
        await this.init();
        if (this.isPlaying) { clearTimeout(this.timerID); this.isPlaying = false; document.getElementById('quick-metro').textContent = "METRO OFF"; }
        else { this.nextTick = this.audioCtx.currentTime; this.scheduler(); this.isPlaying = true; document.getElementById('quick-metro').textContent = "METRO ON"; }
    }
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
}

class OppaRunApp {
    constructor() {
        this.state = { isRunning: false, isPaused: false, seconds: 0, steps: 0, totalDist: 0, path: [], wakeLock: null };
        this.timer = null; this.map = null; this.polyline = null;
    }
    init() {
        this.map = L.map('map', {zoomControl: false}).setView([33.7743, -117.9390], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
        this.polyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(this.map);
        navigator.geolocation.watchPosition(p => this.handlePos(p), null, {enableHighAccuracy: true});
        // 가속도계 센서 로직 (케이던스용)
        window.addEventListener('devicemotion', (e) => {
            if(this.state.isRunning && !this.state.isPaused) this.handleMotion(e);
        });
    }
    handleMotion(e) {
        let acc = e.accelerationIncludingGravity;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        if (force > 12.5) { // 단순 걸음 감지
            this.state.steps++;
            let cad = Math.round((this.state.steps / (this.state.seconds || 1)) * 60);
            ui.updateRunningDisplay({cadence: cad});
        }
    }
    async requestWakeLock() {
        if ('wakeLock' in navigator && !this.state.wakeLock) {
            try { this.state.wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
        }
    }
    handlePos(p) {
        if (!this.state.isRunning || this.state.isPaused) return;
        let pos = [p.coords.latitude, p.coords.longitude];
        this.state.path.push(pos); this.polyline.setLatLngs(this.state.path);
        if (this.state.path.length > 1) {
            let prev = this.state.path[this.state.path.length - 2];
            this.state.totalDist += this.map.distance(prev, pos) / 1000;
            ui.updateRunningDisplay({dist: this.state.totalDist.toFixed(2)});
            // 페이스 계산
            let speed = p.coords.speed * 3.6 || 0;
            ui.updateRunningDisplay({pace: this.formatPace(speed)});
        }
    }
    formatPace(kmh) {
        if (kmh < 0.5) return "--'--\"";
        let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
    }
    onStart() {
        if (this.timer) clearInterval(this.timer);
        this.state.isRunning = true; ui.dom.btnStart.style.display = 'none'; ui.dom.afterStop.style.display = 'flex';
        this.requestWakeLock();
        this.timer = setInterval(() => {
            if(!this.state.isPaused) {
                this.state.seconds++;
                let m = Math.floor(this.state.seconds / 60), s = this.state.seconds % 60;
                ui.updateRunningDisplay({time: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});
            }
        }, 1000);
    }
    onResume() { this.state.isPaused = false; }
    onFinish() {
        storage.saveRecord({ 
            date: new Date().toLocaleString(), 
            dist: this.state.totalDist.toFixed(2), 
            time: ui.dom.time.textContent,
            avgPace: ui.dom.avgPace.textContent,
            cadence: document.getElementById('cadence').textContent
        });
        location.reload();
    }
}

const storage = new RunningStorage();
const ui = new UIManager();
const metro = new MetroEngine();
const app = new OppaRunApp();

window.onload = () => { app.init(); };
</script>
</body>
</html>
