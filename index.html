<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.33 (High Contrast UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            /* 박스 배경을 더 밝게 수정 (#121212 -> #1e1e1e) */
            --card-bg: #1e1e1e; 
            --text-main: #ffffff; --text-dim: #bbbbbb; --danger: #ff4444; 
            --warning: #ffcc00;
            --border-color: #333333;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 카드 디자인 강화 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid var(--border-color); 
            padding: 12px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); /* 그림자 추가 */
        }
        .card-main { 
            grid-column: span 3; 
            border: 2px solid var(--primary); 
            background: #1a2a22; /* 페이스 강조 배경 */
            height: 90px; 
            position: relative; 
            margin-bottom: 4px; 
        }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 44px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }

        /* 히스토리 네비게이션 */
        .history-nav { display: flex; gap: 6px; padding: 12px 10px; background: #000; border-bottom: 1px solid #222; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #888; border-radius: 10px; font-size: 12px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* 히스토리 아이템 구분감 강화 */
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { 
            background: #252525; /* 아이템 배경을 더 밝게 */
            border-radius: 16px; 
            padding: 18px; 
            margin: 12px; 
            border: 1px solid #444; 
            position: relative; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .h-date { font-size: 14px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 0.5px; }
        .h-actions { position: absolute; top: 18px; right: 18px; display: flex; gap: 8px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 11px; padding: 7px 12px; border-radius: 8px; font-weight: 900; cursor: pointer; }

        /* 탭 바 고정 및 레이어 */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 75px; background: #0a0a0a; display: flex; 
            border-top: 1px solid #333; align-items: center; 
            padding-bottom: env(safe-area-inset-bottom); 
            z-index: 30000; 
        }
        .tab-btn { flex: 1; background: none; border: none; color: #666; font-size: 14px; font-weight: 900; text-transform: uppercase; }
        .tab-btn.active { color: var(--primary); }

        /* 오버레이 상세 뷰 */
        #detail-view, #diag-view { 
            position: fixed; top: 0; left: 0; width: 100%; 
            height: calc(100% - 75px); 
            background: var(--bg); z-index: 5000; 
            display: none; flex-direction: column; 
        }
        #detail-map { height: 50%; width: 100%; border-bottom: 1px solid #222; }
        #detail-data { height: 50%; width: 100%; padding: 20px; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map"></div>
        <div id="detail-data"></div>
    </div>

    <div id="diag-view">
        <button class="close-detail" onclick="ui.closeDiag()">CLOSE</button>
        <div id="diag-content-area"></div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label" style="display:none; position:absolute; top:10px; left:10px; background:rgba(255,0,0,0.2); color:red; padding:4px 8px; border-radius:5px; font-size:10px; font-weight:900; border:1px solid red;">PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #444; color:#777; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container" class="total-container"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="info-card" style="background:#222; margin:10px; padding:15px; border-radius:12px; border:1px solid #333;"><div style="color:var(--primary); font-weight:900;">⏱️ CADENCE</div><div style="font-size:13px; margin-top:5px; color:#ccc;">권장 170~185 BPM.</div></div>
            <div class="info-card" style="background:#222; margin:10px; padding:15px; border-radius:12px; border:1px solid #333;"><div style="color:var(--primary); font-weight:900;">🔄 ROLLING</div><div style="font-size:13px; margin-top:5px; color:#ccc;">부드러운 힘의 전환.</div></div>
        </div>
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container" style="padding:20px;">
                <button id="btn-clear-history" style="background:#222; color:var(--danger); border:1px solid var(--danger); padding:15px; border-radius:10px; width:100%; font-weight:900;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
// [기존 스크립트 로직 유지]
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let detailMap = null, detailPolyline = null, wakeLock = null, lowSpeedStartTime = null;

const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", info: "INFO", settings: "SETTINGS", clear: "CLEAR ALL HISTORY", confirmClear: "Are you sure?", route: "ROUTE", diag: "DIAG", close: "CLOSE" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", info: "정보", settings: "설정", clear: "전체 기록 삭제", confirmClear: "정말로 모든 기록을 삭제할까요?", route: "경로", diag: "진단", close: "닫기" }
};

const storage = {
    key: 'oppaRunHistory',
    saveRecord: (record) => {
        let h = storage.loadHistory();
        h.unshift(record);
        localStorage.setItem(storage.key, JSON.stringify(h));
    },
    loadHistory: () => JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"),
    clearHistory: () => {
        const lang = localStorage.getItem('oppaRunLang') || 'en';
        if(confirm(translations[lang].confirmClear)) {
            localStorage.removeItem(storage.key);
            ui.updateHistoryList();
            alert("Cleared");
        }
    }
};

const ui = {
    showTab: (tab) => {
        ui.closeDetail(); ui.closeDiag();
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
        if(sub === 'list') ui.updateHistoryList();
    },
    updateHistoryList: () => {
        const h = storage.loadHistory();
        const listDiv = document.getElementById('history-list');
        const lang = localStorage.getItem('oppaRunLang') || 'en';
        const t = translations[lang];
        if (h.length === 0) { listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">NO DATA</div>'; return; }
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-actions">
                    <button class="btn-h-sub" onclick="ui.openDetail(${r.id})">${t.route}</button>
                    <button class="btn-h-sub" onclick="ui.openDiag(${r.id})">${t.diag}</button>
                </div>
                <div style="font-size:20px; font-weight:900; color:#fff;">${r.dist}KM <span style="color:var(--primary); margin-left:10px;">${r.time}</span></div>
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:15px; border-top:1px solid #444; padding-top:12px;">
                    <div style="text-align:center;"><div style="font-size:10px; color:#aaa;">PACE</div><div style="font-weight:900;">${r.pace}</div></div>
                    <div style="text-align:center;"><div style="font-size:10px; color:#aaa;">CAD</div><div style="font-weight:900;">${r.cadence}</div></div>
                    <div style="text-align:center;"><div style="font-size:10px; color:#aaa;">KCAL</div><div style="font-weight:900;">${r.kcal}</div></div>
                    <div style="text-align:center;"><div style="font-size:10px; color:#aaa;">GCT</div><div style="font-weight:900;">${r.gct}</div></div>
                </div>
            </div>`).join('');
    },
    openDetail: (id) => {
        const h = storage.loadHistory(); const record = h.find(r => r.id === id); if (!record) return;
        document.getElementById('detail-view').style.display = 'flex';
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (record.path && record.path.length > 0) {
            detailPolyline = L.polyline(record.path, {color: '#00ff88', weight: 5}).addTo(detailMap);
            detailMap.fitBounds(detailPolyline.getBounds());
        }
        document.getElementById('detail-data').innerHTML = `<h2 style="color:var(--primary)">${record.dist} KM</h2><p>PACE: ${record.pace}</p><p>TIME: ${record.time}</p>`;
    },
    closeDetail: () => document.getElementById('detail-view').style.display = 'none',
    openDiag: (id) => { document.getElementById('diag-view').style.display = 'flex'; document.getElementById('diag-content-area').innerHTML = `<div style="padding:60px 20px; text-align:center;"><h2>DIAGNOSIS</h2><p>Coming Soon...</p></div>`; },
    closeDiag: () => document.getElementById('diag-view').style.display = 'none',
    toggleDim: (show) => { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
};

// [러닝 로직 부분은 이전 버전과 동일하게 작동하도록 구성됨]
function onStart() { 
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; 
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: document.getElementById('dist').textContent, time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: document.getElementById('cadence').textContent, kcal: Math.round(totalDist * 65), gct: document.getElementById('gct').textContent, path: pathCoords };
    storage.saveRecord(record); location.reload();
}

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0]).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(p => {
        const pos = [p.coords.latitude, p.coords.longitude];
        marker.setLatLng(pos);
        if (isRunning && !isPaused) {
            if (lastPos) {
                let d = 1.1; // 간단한 예시용 거리 계산
                totalDist += 0.01;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                pathCoords.push(pos); polyline.setLatLngs(pathCoords);
            }
            lastPos = pos;
        } else map.panTo(pos);
    }, null, {enableHighAccuracy: true});
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
