<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.4.1 (Pure Restore)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #1e1e1e; --text-main: #fff; --text-dim: #999; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
        
        #map-area { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .gps-status { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex: 1; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 130px; position: relative; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .value-large { font-size: 56px; color: var(--primary); font-weight: 900; }
        .value { font-size: 22px; font-weight: 900; }
        
        .mini-btn { background:#333; border:none; color:#888; font-size:10px; padding:6px 12px; border-radius:6px; font-weight:900; position: absolute; }

        .controls { padding: 20px; margin-bottom: 90px; }
        .btn-start { width: 100%; height: 75px; border-radius: 40px; border: none; font-weight: 900; font-size: 26px; background: #ff5555; color: #fff; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; display: flex; border-top: 1px solid #222; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 18px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map-area"><div id="map"></div></div>
    <div class="gps-status" id="gps-status">GPS INITIALIZING...</div>

    <div id="run-view" style="display: flex; flex-direction: column; flex: 1;">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="mini-btn" style="top:12px; right:12px;">METRO OFF</button>
                <button class="mini-btn" style="bottom:12px; right:12px;" onclick="location.reload()">RESET</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        </div>
        <div class="controls">
            <button id="btn-main" class="btn-start" onclick="app.toggle()">START</button>
        </div>
    </div>

    <div id="history-view" style="display:none; padding:20px; overflow-y:auto; flex:1;">
        <div id="history-list"></div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tab-run" onclick="ui.tab('run')">RUN</button>
        <button class="tab-btn" id="tab-history" onclick="ui.tab('history')">HISTORY</button>
    </div>

<script>
const ui = {
    tab(t) {
        document.getElementById('run-view').style.display = t==='run'?'flex':'none';
        document.getElementById('history-view').style.display = t==='history'?'block':'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        if(t==='history') this.render();
    },
    render() {
        const h = JSON.parse(localStorage.getItem('oppaHistory') || '[]');
        document.getElementById('history-list').innerHTML = h.map(i => `
            <div style="background:#1e1e1e; margin-bottom:10px; padding:15px; border-radius:12px; border-left:5px solid var(--primary);">
                <div style="font-size:10px; color:#999;">${i.date}</div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                    <b style="font-size:20px;">${i.dist} KM</b>
                    <b style="font-size:20px; color:var(--primary);">${i.time}</b>
                </div>
            </div>
        `).join('');
    }
};

class OppaRun {
    constructor() {
        this.active = false; this.sec = 0; this.dist = 0; this.lastPos = null;
        this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7, -117.9], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
    }
    init() {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            document.getElementById('gps-status').textContent = `GPS ACTIVE | ALT: ${Math.round(p.coords.altitude||0)}m`;
            this.map.panTo(pos);
            if(this.active && this.lastPos) {
                const d = this.map.distance(this.lastPos, pos)/1000;
                if(d > 0.002) { this.dist += d; document.getElementById('dist').textContent = this.dist.toFixed(2); }
            }
            this.lastPos = pos;
        }, null, {enableHighAccuracy:true});
    }
    toggle() {
        if(!this.active) {
            this.active = true;
            document.getElementById('btn-main').textContent = "STOP";
            document.getElementById('btn-main').style.background = "#333";
            this.timer = setInterval(() => {
                this.sec++;
                const m = Math.floor(this.sec/60), s = this.sec%60;
                document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        } else {
            this.active = false; clearInterval(this.timer);
            let h = JSON.parse(localStorage.getItem('oppaHistory') || '[]');
            h.unshift({ dist: this.dist.toFixed(2), time: document.getElementById('time').textContent, date: new Date().toLocaleString() });
            localStorage.setItem('oppaHistory', JSON.stringify(h));
            alert("저장 완료!"); location.reload();
        }
    }
}
const app = new OppaRun();
window.onload = () => app.init();
</script>
</body>
</html>
