<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.40 (Stable Reset)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 지도 영역: v28.11의 높이와 구조 복구 */
        #map-area { height: 15vh; min-height: 120px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; bottom: 0; width: 100%; text-align: center; color: #ffcc00; font-size: 11px; background: rgba(0,0,0,0.7); z-index: 1000; padding: 2px 0; font-weight: 800; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard & Controls */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 0; border: 1px solid #1f1f1f; }
        .card-main { grid-column: span 3; height: 100px; border: 1.5px solid var(--primary); position: relative; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 8px; left: 12px; font-size: 11px; color: var(--danger); font-weight: 900; display: none; }

        .controls { padding: 20px; display: flex; justify-content: center; margin-bottom: 60px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; }
        
        /* 하단 탭 바 (전역 공통) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }

        /* 경로 상세 뷰 */
        #route-detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; }
        #detail-map { height: 40vh; border-bottom: 1px solid #222; }
        .detail-info { flex: 1; padding: 20px; }

        /* Dimmer */
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; display: none; justify-content: center; align-items: center; color: #333; font-weight: 900; }
        .btn-dim { position: absolute; top: 12px; right: 12px; padding: 8px 12px; background: #222; border-radius: 8px; font-size: 10px; color: #777; border: 1px solid #333; z-index: 10; }
    </style>
</head>
<body>
    <div id="dimmer-overlay" onclick="toggleDim(false)">TAP TO WAKE</div>

    <div id="route-detail-view">
        <div id="detail-map"></div>
        <div class="detail-info" id="detail-content"></div>
        <div class="tab-bar">
            <button class="tab-btn" onclick="closeDetail('run')">RUN</button>
            <button class="tab-btn">FORM</button>
            <button class="tab-btn" onclick="closeDetail('history')">HISTORY</button>
            <button class="tab-btn" style="color:#007bff">SHARE</button>
        </div>
    </div>

    <div id="map-area">
        <div id="map"></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <span id="pause-status" class="auto-pause-label">PAUSED</span>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <div class="btn-dim" onclick="toggleDim(true)">DIM</div>
            </div>
            <div class="card"><div class="label">DIST</div><div id="dist" style="font-size:24px; font-weight:900;">0.00</div></div>
            <div class="card"><div class="label">TIME</div><div id="time" style="font-size:24px; font-weight:900;">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" style="font-size:24px; font-weight:900;">0</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none; padding:10px; overflow-y:auto;">
        <div id="history-list"></div>
    </div>

    <div class="tab-bar" id="main-tab">
        <button class="tab-btn active" onclick="showTab('run', this)">RUN</button>
        <button class="tab-btn">FORM</button>
        <button class="tab-btn" onclick="showTab('history', this)">HISTORY</button>
        <button class="tab-btn" style="color:#444">SHARE</button>
    </div>

<script>
let map, detailMap, marker, pathLine, isRunning = false, isAutoPaused = false, seconds = 0, timer;
let pathCoords = [], totalDist = 0, lastPos = null;

function toggleDim(s) { document.getElementById('dimmer-overlay').style.display = s ? 'flex' : 'none'; }

function initMap() {
    // 원본 Leaflet 설정 복구
    map = L.map('map', {zoomControl:false, attributionControl:false}).setView([37.5, 127.0], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-loc', html:'<div style="background:#007bff; width:12px; height:12px; border-radius:50%; border:2px solid white;"></div>'})}).addTo(map);
    pathLine = L.polyline([], {color:'#007bff', weight:5}).addTo(map);

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            const speedKmh = (p.coords.speed || 0) * 3.6;
            
            marker.setLatLng(pos);
            if (!isRunning) map.panTo(pos);
            document.getElementById('status').textContent = "GPS CONNECTED";

            if (isRunning && !isAutoPaused) {
                // 자동 정지 로직 보강
                if (speedKmh < 0.8) {
                    isAutoPaused = true;
                    document.getElementById('pause-status').style.display = 'block';
                } else {
                    if (lastPos) {
                        let d = L.latLng(lastPos).distanceTo(pos) / 1000;
                        if (d > 0.002) {
                            totalDist += d;
                            document.getElementById('dist').textContent = totalDist.toFixed(2);
                            pathCoords.push(pos);
                            pathLine.setLatLngs(pathCoords);
                        }
                    }
                    lastPos = pos;
                }
                document.getElementById('curPace').textContent = formatPace(speedKmh);
            } else if (isRunning && isAutoPaused && speedKmh >= 1.2) {
                isAutoPaused = false;
                document.getElementById('pause-status').style.display = 'none';
            }
        }, null, {enableHighAccuracy:true});
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(isRunning && !isAutoPaused) { seconds++; document.getElementById('time').textContent = formatTime(seconds); } }, 1000);
}

function showTab(t, btn) {
    document.getElementById('run-view').style.display = (t==='run'?'flex':'none');
    document.getElementById('map-area').style.display = (t==='run'?'block':'none');
    document.getElementById('history-view').style.display = (t==='history'?'block':'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    if(t==='history') renderHistory();
}

function renderHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div style="background:#121212; padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid #222;">
            <div style="font-size:12px; color:#00ff88; margin-bottom:5px;">${r.date}</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:22px; font-weight:900;">${r.dist}KM</span>
                <button onclick="viewRoute(${r.id})" style="background:#00ff88; border:none; padding:5px 12px; border-radius:6px; font-weight:900; font-size:11px;">ROUTE</button>
            </div>
        </div>
    `).join('');
}

function viewRoute(id) {
    const r = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]").find(x => x.id === id);
    if(!r) return;
    document.getElementById('route-detail-view').style.display = 'flex';
    document.getElementById('detail-content').innerHTML = `<h2 style="color:#00ff88">${r.dist} KM Run</h2><p>Time: ${r.time}</p>`;
    
    setTimeout(() => {
        if(detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl:false, attributionControl:false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if(r.coords && r.coords.length > 0) {
            const p = L.polyline(r.coords, {color:'#00ff88', weight:5}).addTo(detailMap);
            detailMap.fitBounds(p.getBounds(), {padding:[20,20]});
        }
    }, 200);
}

function closeDetail(tab) {
    document.getElementById('route-detail-view').style.display = 'none';
    if(tab) showTab(tab);
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function formatPace(kmh) { if(kmh<0.5) return "--'--\""; let s = 3600/kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }

window.onload = initMap;
</script>
</body>
</html>
