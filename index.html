<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team OppaRun</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 10px; background: #111; }
        .stat-box { background: #222; padding: 10px; text-align: center; border-radius: 8px; }
        .pace-box { margin: 5px 10px; padding: 15px; background: #111; border: 1px solid #00ff88; border-radius: 10px; text-align: center; }
        #startBtn { background: #ff4444; color: #fff; border: none; padding: 15px; border-radius: 50px; font-size: 20px; font-weight: bold; margin: 10px auto; width: 80%; display: block; }
        .nav { display: flex; justify-content: space-around; padding: 15px; background: #000; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div id="gps-info" style="text-align:center; font-size:12px; color:#ffcc00; padding:5px;">GPS 신호 대기 중...</div>
        
        <div class="stats">
            <div class="stat-box"><small>DISTANCE</small><div id="dist" style="font-size:20px; color:#00ff88; font-weight:bold;">0.00 KM</div></div>
            <div class="stat-box"><small>TIME</small><div id="time" style="font-size:20px; font-weight:bold;">00:00:00</div></div>
        </div>

        <div class="pace-box">
            <small style="color:#00ff88;">CURRENT PACE</small>
            <div id="pace" style="font-size:35px; font-weight:bold;">--'--"</div>
        </div>

        <button id="startBtn">START</button>

        <div class="nav">
            <span style="color:#00ff88;">RUNNING</span>
            <span style="color:#666;">HISTORY</span>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([37.5, 127], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let path = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);

        let isRunning = false;
        let startTime, timerInterval;
        let lastPos = null, totalDist = 0;
        let lastPaceTime = 0;

        function update(pos) {
            const coords = pos.coords;
            document.getElementById('gps-info').innerText = `GPS Accuracy: ±${Math.round(coords.accuracy)}m`;
            
            if (!isRunning) return;

            // 거리 계산
            if (lastPos) {
                let d = map.distance([lastPos.lat, lastPos.lng], [coords.latitude, coords.longitude]);
                if (coords.accuracy < 30 && d > 2) {
                    totalDist += d;
                    document.getElementById('dist').innerText = (totalDist / 1000).toFixed(2) + " KM";
                }
            }
            lastPos = {lat: coords.latitude, lng: coords.longitude};
            path.addLatLng([coords.latitude, coords.longitude]);
            map.panTo([coords.latitude, coords.longitude]);

            // 5초마다 페이스 업데이트
            let now = Date.now();
            if (now - lastPaceTime > 5000) {
                if (coords.speed > 0.5) {
                    let p = 16.6667 / coords.speed;
                    let m = Math.floor(p), s = Math.round((p-m)*60);
                    document.getElementById('pace').innerText = `${m}'${s.toString().padStart(2,'0')}"`;
                } else {
                    document.getElementById('pace').innerText = `--'--"`;
                }
                lastPaceTime = now;
            }
        }

        document.getElementById('startBtn').onclick = function() {
            isRunning = !isRunning;
            if (isRunning) {
                this.innerText = "STOP";
                this.style.background = "#444";
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    let s = Math.floor((Date.now() - startTime) / 1000);
                    let h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
                    document.getElementById('time').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                }, 1000);
            } else {
                location.reload(); // 일단 멈추면 새로고침으로 초기화 (가장 안전)
            }
        };

        navigator.geolocation.watchPosition(update, null, {enableHighAccuracy:true});
    </script>
</body>
</html>
