<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v30.0 (Map View Fixed)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 상단 지도 영역 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 및 카드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .value { font-size: 20px; font-weight: 900; }

        /* 조작 버튼 */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* 기록 리스트 (오빠가 보내준 디자인 적용) */
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .btn-map-view { background: var(--primary); border: none; color: #000; border-radius: 4px; font-size: 9px; font-weight: 900; padding: 3px 8px; cursor: pointer; }
        .h-main { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .h-dist, .h-time { font-size: 18px; font-weight: 700; color: #ffffff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-label { font-size: 8px; color: #888; font-weight: 800; }
        .h-det-val { font-size: 14px; font-weight: 600; color: #ddd; }

        /* 전체 화면 지도 오버레이 (작동의 핵심) */
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; }
        #detail-map { flex: 1; width: 100%; }
        .overlay-close { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: 900; z-index: 2100; }

        /* 하단 탭바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        .pace-marker { background: rgba(0,0,0,0.8); color: var(--primary); border: 1.5px solid var(--primary); border-radius: 6px; padding: 2px 5px; font-size: 10px; font-weight: 900; text-align: center; white-space: nowrap; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button class="sub-btn active">LIST</button>
            <button class="sub-btn">TOTAL</button>
            <button class="sub-btn">SETTINGS</button>
        </div>
        <div class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
    </div>

    <div id="map-overlay">
        <button class="overlay-close" onclick="closeDetailMap()">CLOSE</button>
        <div id="detail-map"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer;
let detailMap, detailPolyline, detailMarkers = [];
let isRunning = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [], kmMarkers = [], lastKm = 0;

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 6, opacity: 0.8}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    marker.setLatLng(pos);
    
    if (isRunning) {
        if (lastPos && p.coords.accuracy < 45) {
            let d = calculateDistance(lastPos, pos);
            if (d > 0.0015) { 
                totalDist += d; 
                pathCoords.push(pos); 
                polyline.setLatLngs(pathCoords);
                lastPos = pos;
                
                // 1km 마커 로직
                if (Math.floor(totalDist) > lastKm) {
                    lastKm = Math.floor(totalDist);
                    kmMarkers.push({ pos: pos, km: lastKm, pace: document.getElementById('avgPace').textContent });
                }
            }
        } else { lastPos = pos; }
        
        document.getElementById('dist').textContent = totalDist.toFixed(2);
        let speedKmh = (p.coords.speed || 0) * 3.6;
        document.getElementById('curPace').textContent = formatPace(speedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    } else { map.panTo(pos); }
}

function onStart() {
    isRunning = true;
    timer = setInterval(() => { seconds++; updateTimer(); }, 1000);
    document.getElementById('btn-start').style.display='none';
    document.getElementById('after-stop').style.display='flex';
}

function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ", " + new Date().toLocaleDateString('en-US', {weekday:'short'}),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        path: pathCoords, // 경로 저장
        laps: kmMarkers    // 페이스 마커 저장
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

// 상세 지도 보기 함수 (작동의 핵심!)
function showDetailMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const data = h.find(r => r.id == id);
    
    if (!data || !data.path || data.path.length === 0) return alert("저장된 경로 데이터가 없습니다.");

    document.getElementById('map-overlay').style.display = 'flex';
    
    if (!detailMap) {
        detailMap = L.map('detail-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        detailPolyline = L.polyline([], {color: '#00ff88', weight: 8}).addTo(detailMap);
    }
    
    detailMarkers.forEach(m => detailMap.removeLayer(m));
    detailMarkers = [];

    detailPolyline.setLatLngs(data.path);
    
    data.laps.forEach(lap => {
        let m = L.marker(lap.pos, {
            icon: L.divIcon({ className: 'pace-marker', html: `${lap.km}K<br>${lap.pace}` })
        }).addTo(detailMap);
        detailMarkers.push(m);
    });

    detailMap.fitBounds(detailPolyline.getBounds(), {padding: [30, 30]});
}

function closeDetailMap() { document.getElementById('map-overlay').style.display = 'none'; }

function updateTimer() {
    let m = Math.floor(seconds/60);
    let s = seconds%60;
    document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if (tab === 'history') updateHistoryStats();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-header"><span class="h-date">${r.date}</span><button class="btn-map-view" onclick="showDetailMap(${r.id})">MAP VIEW</button></div>
            <div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">--</span></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">--</span></div>
                <div class="h-det-box"><span class="h-det-label">AVG</span><span class="h-det-val">${r.pace}</span></div>
            </div>
        </div>`).join('');
}

function calculateDistance(p1, p2) {
    const R = 6371; const dLat = (p2[0]-p1[0]) * Math.PI/180; const dLon = (p2[1]-p1[1]) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }

window.onload = initMap;
</script>
</body>
</html>
