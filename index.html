<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OppaRun Pro v29.10</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #111111; --text-main: #ffffff; --text-dim: #888888; 
            --warning: #ffcc00; --danger: #ff4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 1. 상단 지도 영역 (원본 비율 복구) */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 160px; border-bottom: 1px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #000; }
        
        /* GPS 노란색 상태바 */
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 7px; background: #050505; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 1px; }

        /* 2. 대시보드 레이아웃 (원본 그대로) */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow: hidden; }
        .card { background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        
        /* 메인 페이스 카드 */
        .card-main { flex: 1.2; border: 2px solid #222; margin-top: 5px; }
        .label { font-size: 10px; color: var(--primary); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .value-large { font-size: 68px; color: var(--primary); font-weight: 900; font-variant-numeric: tabular-nums; }

        /* 하단 3단 데이터 박스 */
        .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 0.8; margin-bottom: 80px; }
        .value-mid { font-size: 24px; font-weight: 900; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 2px; }

        /* 3. 버튼 및 컨트롤 */
        .controls { position: absolute; bottom: 95px; left: 0; right: 0; padding: 0 20px; z-index: 100; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; transition: 0.1s; }
        .btn-act:active { transform: scale(0.95); }

        /* 4. 하단 탭바 (원본 블랙 스타일) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 10000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 15px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        .tab-btn.active { color: var(--primary); }
        .tab-indicator { width: 25px; height: 3px; background: var(--primary); border-radius: 2px; display: none; }
        .tab-btn.active .tab-indicator { display: block; }

        /* 5. 기록 뷰 (원본 복구) */
        #history-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 85px); background: #000; z-index: 5000; display: none; flex-direction: column; }
        .history-nav { display: flex; gap: 10px; padding: 15px; background: #000; }
        .sub-btn { flex: 1; padding: 14px; background: #1a1a1a; color: #888; border: none; border-radius: 25px; font-size: 13px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 10px; }
    </style>
</head>
<body>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="card card-main">
            <div class="label">CURRENT PACE</div>
            <div id="curPace" class="value-large">--'--"</div>
        </div>
        <div class="sub-grid">
            <div class="card"><div class="label">DISTANCE</div><div class="value-mid"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value-mid">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value-mid">--'--"</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <div id="after-stop" style="display:none; gap:10px;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">HISTORY</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding:20px;"><button class="sub-btn" style="background:#222; color:var(--danger); width:100%;" onclick="storage.clearHistory()">CLEAR ALL RECORDS</button></div>
        </div>
    </div>

    <nav class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN<div class="tab-indicator"></div></button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">RECORDS<div class="tab-indicator"></div></button>
    </nav>

<script>
let map, marker, polyline, timer = null, gpsWatcher = null;
let isRunning = false, isPaused = false, seconds = 0, totalDist = 0, pathCoords = [], lastPos = null;

const storage = {
    key: 'oppaRunHistory_v2',
    saveRecord: (r) => { let h = storage.loadHistory(); h.unshift(r); localStorage.setItem(storage.key, JSON.stringify(h)); },
    loadHistory: () => JSON.parse(localStorage.getItem(storage.key) || "[]"),
    clearHistory: () => { if(confirm("삭제할까 오빠?")) { localStorage.removeItem(storage.key); ui.updateHistoryList(); } }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
    },
    updateHistoryList: () => {
        const h = storage.loadHistory();
        document.getElementById('history-list').innerHTML = h.map(r => `
            <div style="background:#111; padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid #222;">
                <div style="color:var(--primary); font-size:11px; font-weight:900;">${r.date}</div>
                <div style="font-size:22px; font-weight:900; margin-top:5px;">${r.dist} KM / <span style="color:#666;">${r.time}</span></div>
            </div>`).join('');
    }
};

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    document.getElementById('status').textContent = `GPS READY (±${Math.round(p.coords.accuracy)}m)`;
    if (isRunning && !isPaused) {
        if (lastPos) {
            const d = map.distance(lastPos, pos) / 1000;
            if (d > 0.002 && d < 0.08) { // GPS 점프 필터
                totalDist += d;
                pathCoords.push(pos);
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                polyline.setLatLngs(pathCoords);
                lastPos = pos;
            }
        } else { lastPos = pos; }
        marker.setLatLng(pos); map.panTo(pos);
    }
}

function onStart() {
    isRunning = true; isPaused = false;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => {
        if(!isPaused) {
            seconds++;
            document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
        }
    }, 1000);
    gpsWatcher = navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    storage.saveRecord({id: Date.now(), date: new Date().toLocaleString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent});
    resetApp();
}

function resetApp() {
    isRunning = false; seconds = 0; totalDist = 0; pathCoords = []; lastPos = null;
    clearInterval(timer); navigator.geolocation.clearWatch(gpsWatcher);
    document.getElementById('dist').textContent = "0.00"; document.getElementById('time').textContent = "00:00";
    document.getElementById('btn-start').style.display = 'block'; document.getElementById('after-stop').style.display = 'none';
    polyline.setLatLngs([]); ui.showTab('history');
}

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([37.5665, 126.9780]).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    navigator.geolocation.getCurrentPosition(updatePosition);
};
</script>
</body>
</html>
