<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { --primary: #00ff88; --bg: #000; --card-bg: #1e1e1e; --text-main: #fff; --text-dim: #999; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #111; }
        .gps-status { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }

        /* Dashboard */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 130px; position: relative; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 56px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-tag { position: absolute; top: 12px; left: 12px; font-size: 9px; color: var(--danger); font-weight: 900; border: 1px solid var(--danger); padding: 2px 6px; border-radius: 4px; display: none; }
        .mini-btn { background:#333; border:none; color:#888; font-size:10px; padding:6px 12px; border-radius:6px; font-weight:900; position: absolute; }

        /* Controls */
        .controls { padding: 20px; margin-top: auto; margin-bottom: 90px; }
        .btn-act { width: 100%; height: 70px; border-radius: 35px; border: none; font-weight: 900; font-size: 24px; cursor: pointer; }

        /* Tabs */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 17px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* History */
        #history-view { padding: 10px; overflow-y: auto; }
        .history-item { background: var(--card-bg); margin-bottom: 10px; padding: 15px; border-radius: 12px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="dimmer" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999; display:none; justify-content:center; align-items:center; color:#333; font-weight:900;" onclick="ui.dim(false)">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="gps-status" class="gps-status">WAITING FOR GPS...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-tag" class="auto-pause-tag">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button class="mini-btn" style="top:12px; right:12px;" onclick="app.toggleMetro()">METRO OFF</button>
                <button class="mini-btn" style="bottom:12px; right:12px;" onclick="ui.dim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span> <small style="font-size:10px;color:var(--primary)">KM</small></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        </div>
        <div class="controls">
            <button id="btn-main" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.start()">START RUNNING</button>
            <div id="finish-area" style="display:none; gap:10px;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.resume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.finish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list"></div>
        <button style="width:100%; margin-top:20px; padding:15px; background:none; border:1px solid #333; color:var(--danger); font-weight:900; border-radius:10px;" onclick="storage.clear()">CLEAR ALL HISTORY</button>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.tab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.tab('history')">HISTORY</button>
    </div>

<script>
const storage = {
    save(record) {
        let h = JSON.parse(localStorage.getItem('oppaHistory') || '[]');
        h.unshift({ ...record, date: new Date().toLocaleString() });
        localStorage.setItem('oppaHistory', JSON.stringify(h));
    },
    get() { return JSON.parse(localStorage.getItem('oppaHistory') || '[]'); },
    clear() { if(confirm("모든 기록을 삭제할까요?")) { localStorage.removeItem('oppaHistory'); location.reload(); } }
};

const ui = {
    tab(t) {
        document.getElementById('run-view').style.display = t==='run'?'flex':'none';
        document.getElementById('map-area').style.display = t==='run'?'block':'none';
        document.getElementById('history-view').style.display = t==='history'?'block':'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        if(t==='history') this.renderHistory();
    },
    renderHistory() {
        document.getElementById('history-list').innerHTML = storage.get().map(i => `
            <div class="history-item">
                <div><div style="font-size:10px; color:var(--text-dim);">${i.date}</div><div style="font-size:20px; font-weight:900;">${i.dist} KM</div></div>
                <div style="font-size:18px; font-weight:900; color:var(--primary);">${i.time}</div>
            </div>
        `).join('');
    },
    dim(s) { document.getElementById('dimmer').style.display = s?'flex':'none'; }
};

class OppaRun {
    constructor() {
        this.state = { active: false, sec: 0, dist: 0, paused: false, lastPos: null };
        this.timer = null;
        this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7, -117.9], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
    }
    init() {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            const spd = p.coords.speed;
            document.getElementById('gps-status').textContent = `GPS ACTIVE | ALT: ${Math.round(p.coords.altitude||0)}m`;
            this.map.panTo(pos);
            if(this.state.active) this.logic(pos, spd);
        }, null, {enableHighAccuracy:true});
    }
    logic(pos, spd) {
        if(spd !== null && spd < 0.5) { 
            this.state.paused = true; document.getElementById('pause-tag').style.display='block'; 
        } else { 
            this.state.paused = false; document.getElementById('pause-tag').style.display='none';
            if(spd > 0.5) {
                const p = 1/(spd*0.06);
                document.getElementById('curPace').textContent = `${Math.floor(p)}'${String(Math.floor((p%1)*60)).padStart(2,'0')}"`;
            }
        }
        if(!this.state.paused && this.state.lastPos) {
            const d = this.map.distance(this.state.lastPos, pos)/1000;
            if(d > 0.001) { this.state.dist += d; document.getElementById('dist').textContent = this.state.dist.toFixed(2); }
        }
        this.state.lastPos = pos;
    }
    start() {
        this.state.active = true;
        document.getElementById('btn-main').textContent = "STOP";
        document.getElementById('btn-main').style.background = "var(--danger)";
        document.getElementById('btn-main').style.color = "#fff";
        document.getElementById('btn-main').onclick = () => this.stop();
        this.timer = setInterval(() => {
            if(!this.state.paused) {
                this.state.sec++;
                const m = Math.floor(this.state.sec/60), s = this.state.sec%60;
                document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
        }, 1000);
    }
    stop() {
        this.state.active = false; clearInterval(this.timer);
        document.getElementById('btn-main').style.display = "none";
        document.getElementById('finish-area').style.display = "flex";
    }
    resume() {
        document.getElementById('finish-area').style.display = "none";
        document.getElementById('btn-main').style.display = "block";
        this.start();
    }
    finish() {
        storage.save({ dist: this.state.dist.toFixed(2), time: document.getElementById('time').textContent });
        location.reload();
    }
    toggleMetro() { alert("Metronome setup needed"); }
}

const app = new OppaRun();
window.onload = () => app.init();
</script>
</body>
</html>
