<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v38.12 Final-Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #121212; --text: #fff; --dim: #999; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* [메인 레이아웃] v38.12 완벽 재현 */
        #map-area { height: 18vh; position: relative; border-bottom: 1px solid #222; background: #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { position: absolute; bottom: 0; width: 100%; z-index: 1000; background: rgba(0,0,0,0.8); color: #ffcc00; font-size: 11px; font-weight: 800; text-align: center; padding: 4px 0; border-top: 1px solid rgba(255,204,0,0.3); }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; padding-bottom: 90px; }
        .pace-card { background: var(--card); border: 1.5px solid var(--primary); border-radius: 15px; padding: 20px 0; text-align: center; margin-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .mini-card { background: var(--card); border-radius: 12px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; border: 1px solid #222; }
        
        .label { font-size: 10px; color: var(--dim); font-weight: 900; margin-bottom: 4px; }
        .val { font-size: 20px; font-weight: 900; }
        .val-pace { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }

        .btn-main { width: 100%; height: 60px; border-radius: 30px; border: none; font-size: 20px; font-weight: 900; cursor: pointer; margin-top: 15px; }
        .btn-start { background: var(--primary); color: #000; }
        .btn-stop { background: var(--red); color: #fff; }

        /* [상세/기록] 852/854 복구 */
        #detail-view { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        #det-map { height: 45%; border-bottom: 2px solid var(--primary); background: #222; }
        .det-summary { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-item { flex: 1; display: flex; align-items: center; justify-content: center; color: #555; font-weight: 900; font-size: 15px; }
        .tab-item.active { color: var(--primary); }
        
        .h-item { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div id="detail-view">
        <button style="position:fixed; top:20px; right:20px; z-index:10001; padding:10px 20px; border-radius:20px; background:var(--primary); font-weight:900;" onclick="closeDetail()">BACK</button>
        <div id="det-map"></div>
        <div id="det-info" class="det-summary"></div>
    </div>

    <div id="view-run" style="display: flex; flex-direction: column; height: 100%;">
        <div id="map-area"><div id="map"></div><div id="gps-status" class="status-bar">GPS INITIALIZING...</div></div>
        <div class="main-content">
            <div class="pace-card"><div class="label" style="color:var(--primary)">PACE</div><div id="curPace" class="val-pace">--'--"</div></div>
            <div class="grid-container">
                <div class="mini-card"><div class="label">DIST</div><div class="val"><span id="dist">0.00</span><small style="font-size:10px;color:var(--primary)"> KM</small></div></div>
                <div class="mini-card"><div class="label">TIME</div><div id="time" class="val">00:00</div></div>
                <div class="mini-card"><div class="label">AVG</div><div id="avgPace" class="val">--'--"</div></div>
                <div class="mini-card"><div class="label">CADENCE</div><div id="cadence" class="val">0</div></div>
                <div class="mini-card"><div class="label">KCAL</div><div id="kcal" class="val">0</div></div>
                <div class="mini-card"><div class="label">GCT/FLT</div><div id="gct-flt" class="val" style="font-size:14px;">--/--%</div></div>
            </div>
            <button id="btn-ctrl" class="btn-main btn-start" onclick="toggleRun()">START RUNNING</button>
            <div id="pause-group" style="display:none; gap:10px; margin-top:15px;">
                <button class="btn-main btn-start" style="margin-top:0; flex:1;" onclick="toggleRun()">RESUME</button>
                <button class="btn-main btn-stop" style="margin-top:0; flex:1;" onclick="finishRun()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="view-history" class="main-content" style="display:none;"><div id="h-list"></div></div>

    <div class="tab-bar">
        <div id="t-run" class="tab-item active" onclick="showTab('run')">RUN</div>
        <div id="t-history" class="tab-item" onclick="showTab('history')">HISTORY</div>
    </div>

<script>
let map, marker, poly, path=[], isRun=false, isPause=false, sec=0, timer, dist=0, lastPos=null;
let dMap, dPoly;

// [메인 맵 복구 로직] 858.jpg 검은 화면 방지
function initMap() {
    if (map) return; 
    try {
        map = L.map('map', {zoomControl:false, attributionControl:false}).setView([37.56, 126.97], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.circleMarker([0,0], {radius:6, color:'#fff', fillColor:'#007bff', fillOpacity:1, weight:2}).addTo(map);
        poly = L.polyline([], {color:'#007bff', weight:5}).addTo(map);
        
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                const pos = [p.coords.latitude, p.coords.longitude];
                marker.setLatLng(pos);
                document.getElementById('gps-status').textContent = isRun ? `RUNNING (±${p.coords.accuracy.toFixed(1)}m)` : `READY (±${p.coords.accuracy.toFixed(1)}m)`;
                if(isRun && !isPause) {
                    if(lastPos) {
                        let d = calcDist(lastPos, pos);
                        if(d > 0.002) { dist += d; path.push(pos); poly.setLatLngs(path); lastPos = pos; document.getElementById('dist').textContent = dist.toFixed(2); }
                    } else lastPos = pos;
                } else if(!isRun) map.panTo(pos);
            }, (e) => { document.getElementById('gps-status').textContent = "GPS ERROR: " + e.message; }, {enableHighAccuracy:true});
        }
    } catch (err) {
        console.error("Map Init Error:", err);
        setTimeout(initMap, 1000); // 실패 시 1초 후 재시도
    }
}

function calcDist(l1, l2) {
    const R = 6371;
    const dLat = (l2[0]-l1[0])*Math.PI/180, dLon = (l2[1]-l1[1])*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(l1[0]*Math.PI/180)*Math.cos(l2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function toggleRun() {
    if(!isRun) { 
        isRun = true; isPause = false; dist = 0; sec = 0; path = []; poly.setLatLngs([]);
        document.getElementById('btn-ctrl').style.display = 'none';
        document.getElementById('pause-group').style.display = 'flex';
        timer = setInterval(() => { if(!isPause) { sec++; document.getElementById('time').textContent = fTime(sec); } }, 1000);
    } else {
        isPause = !isPause;
        document.querySelector('#pause-group button').textContent = isPause ? "RESUME" : "PAUSE";
    }
}

function finishRun() {
    const rec = { 
        id: Date.now(), 
        date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', weekday:'short'}), 
        dist: dist.toFixed(2), time: fTime(sec), cad: "0", kcal: "0", gct: "--/--%", path: [...path] 
    };
    let h = JSON.parse(localStorage.getItem('oppaRun') || "[]");
    h.unshift(rec); localStorage.setItem('oppaRun', JSON.stringify(h));
    location.reload();
}

function showTab(t) {
    document.getElementById('view-run').style.display = t==='run'?'flex':'none';
    document.getElementById('view-history').style.display = t==='history'?'block':'none';
    document.getElementById('t-run').className = t==='run'?'tab-item active':'tab-item';
    document.getElementById('t-history').className = t==='history'?'tab-item active':'tab-item';
    if(t==='history') renderHistory();
    if(t==='run' && map) setTimeout(() => map.invalidateSize(), 100);
}

function renderHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRun') || "[]");
    document.getElementById('h-list').innerHTML = h.map(r => `
        <div class="h-item" onclick="openDetail(${r.id})">
            <div style="display:flex; justify-content:space-between;"><span style="color:var(--primary); font-weight:800;">${r.date}</span><span style="color:var(--primary); font-size:12px;">경로지도 ></span></div>
            <div style="font-size:24px; font-weight:900; margin:10px 0;">${r.dist}KM <small style="font-size:14px; color:var(--dim); font-weight:400;">${r.time}</small></div>
        </div>
    `).join('');
}

function openDetail(id) {
    const r = JSON.parse(localStorage.getItem('oppaRun')).find(x => x.id === id);
    document.getElementById('detail-view').style.display = 'flex';
    if(!dMap) { dMap = L.map('det-map', {zoomControl:false, attributionControl:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dMap); dPoly = L.polyline([], {color: '#00ff88', weight:6}).addTo(dMap); }
    
    document.getElementById('det-info').innerHTML = `<div><div class="label">DIST</div><div class="val">${r.dist}KM</div></div><div><div class="label">TIME</div><div class="val">${r.time}</div></div>`;

    if(r.path && r.path.length > 0) {
        dPoly.setLatLngs(r.path);
        setTimeout(() => { dMap.invalidateSize(); dMap.fitBounds(dPoly.getBounds(), {padding:[30,30]}); }, 300);
    }
}
function closeDetail() { document.getElementById('detail-view').style.display = 'none'; }
function fTime(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

window.onload = initMap;
</script>
</body>
</html>
