<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 10px; padding: 3px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; }

        /* HISTORY LIST */
        .total-dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; flex-shrink: 0; }
        .total-card { background: #1a1a1a; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; }
        .total-value { font-size: 14px; font-weight: 900; }

        .history-list { padding: 0 12px; overflow-y: auto; height: 235px; flex-shrink: 0; border-bottom: 1px solid #222; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #1f1f1f; }
        .h-header { margin-bottom: 5px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 800; }
        .h-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
        .h-dist { font-size: 20px; font-weight: 900; color: #fff; }
        .h-time { font-size: 14px; font-weight: 700; color: #888; }
        
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 2px; }
        .h-det-val { font-size: 12px; font-weight: 700; color: #ddd; }
        .h-det-label { font-size: 8px; color: #666; font-weight: 800; }

        /* INFO SECTION */
        .info-section { padding: 15px; background: #0a0a0a; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .info-box:active { transform: scale(0.92); border-color: var(--primary); }
        .info-box-title { color: var(--primary); font-size: 12px; font-weight: 900; display: block; }
        .info-box-desc { color: #666; font-size: 9px; font-weight: 600; }

        /* BUTTON ANIMATIONS FIXED */
        .controls { height: 80px; display: flex; padding: 0 15px; margin-bottom: 85px; flex-shrink: 0; }
        
        .btn-action { 
            border: none; font-weight: 900; width: 100%; height: 55px; border-radius: 30px; font-size: 18px;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:active { 
            transform: scale(0.92) !important; 
            filter: brightness(1.2); 
        }

        #btn-start { background: var(--primary); color: #000; }
        #btn-start:active { background: #ffffff !important; box-shadow: 0 0 25px var(--primary); }

        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #btn-stop:active { background: #ff0000 !important; box-shadow: 0 0 20px var(--danger); }

        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-size: 16px; border: none; font-weight: 900; transition: all 0.1s; }
        .btn-half:active { transform: scale(0.92) !important; filter: brightness(1.2); }

        /* TABS */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; transition: 0.15s; }
        .tab-btn:active { transform: scale(0.9); }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS READY</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-action">START RUNNING</button>
            <button id="btn-stop" class="btn-action">STOP</button>
            <div id="after-stop">
                <button id="btn-resume" class="btn-half" style="background:var(--primary)">RESUME</button>
                <button id="btn-finish" class="btn-half" style="background:var(--danger); color:#fff">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div style="padding: 15px 15px 0 15px;"><span style="font-size: 20px; font-weight: 900; color: var(--primary);">HISTORY</span></div>
        <div class="total-dashboard">
            <div class="total-card"><span class="total-label">TOTAL KM</span><span id="total-dist-val" class="total-value">0.0</span></div>
            <div class="total-card"><span class="total-label">WEEKLY</span><span id="weekly-dist-val" class="total-value">0.0</span></div>
            <div class="total-card"><span class="total-label">RUNS</span><span id="total-runs-val" class="total-value">0</span></div>
            <div class="total-card"><span class="total-label">KCAL</span><span id="total-kcal-val" class="total-value">0</span></div>
        </div>
        <div id="history-list" class="history-list"></div>
        <div class="info-section">
            <div class="info-grid">
                <div id="box-cadence" class="info-box"><span class="info-box-title">CADENCE MASTER</span><span class="info-box-desc">Secret of 180 SPM.</span></div>
                <div id="box-gct" class="info-box"><span class="info-box-title">DYNAMICS INFO</span><span class="info-box-desc">GCT & Flight Ratio.</span></div>
                <div id="box-injury" class="info-box"><span class="info-box-title">INJURY PREVENTION</span><span class="info-box-desc">Plantar Fasciitis.</span></div>
                <div id="box-pro" class="info-box"><span class="info-box-title">OPPARUN PRO</span><span class="info-box-desc">v27.0 Fixes.</span></div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active">RUN</button>
        <button id="tab-history" class="tab-btn">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

// Instant Feedback & Animation Trigger
function addInstantListener(id, callback) {
    const el = document.getElementById(id);
    if(!el) return;
    const execute = (e) => { 
        e.preventDefault(); 
        callback(); 
    };
    el.addEventListener('touchstart', execute, {passive: false});
    el.addEventListener('click', (e) => { if (e.detail !== 0) execute(e); });
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12], html:'<div style="background:#007bff; width:10px; height:10px; border-radius:50%; border:2px solid #fff;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    updateHistoryStats();
    window.addEventListener('devicemotion', handleMotion);

    addInstantListener('btn-start', onStart);
    addInstantListener('btn-stop', onStop);
    addInstantListener('btn-resume', onResume);
    addInstantListener('btn-finish', onFinish);
    addInstantListener('tab-run', () => showTab('run'));
    addInstantListener('tab-history', () => showTab('history'));
    addInstantListener('box-pro', () => alert('Animation Restored! Enjoy the feel, Oppa!'));
} 

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1.0 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 7.5 ? Math.floor(18 + (currentSpeedKmh * 1.2)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--"; document.getElementById('flight').textContent = flt || "--";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6; marker.setLatLng(pos);
    if (isRunning && !isPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
} 

function onStart() { isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000); } 
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 
function onFinish() {
    const record = { date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: Math.round((steps/(seconds||1))*60), kcal: Math.round(totalDist * 65), gctflt: `${Math.round(gctSum/dataCount || 0)}/${Math.round(flightSum/dataCount || 0)}%` };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h)); location.reload();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); const list = document.getElementById('history-list'); let tDist = 0, tKcal = 0; list.innerHTML = "";
    h.forEach(r => {
        tDist += parseFloat(r.dist); tKcal += parseInt(r.kcal || 0);
        const item = document.createElement('div'); item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><div class="h-det-val">${r.pace}</div></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><div class="h-det-val">${r.cadence}</div></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><div class="h-det-val">${r.kcal}</div></div>
                <div class="h-det-box"><span class="h-det-label">GCT/FLT</span><div class="h-det-val">${r.gctflt}</div></div>
            </div>`;
        list.appendChild(item);
    });
    document.getElementById('total-dist-val').textContent = tDist.toFixed(1);
    document.getElementById('total-runs-val').textContent = h.length;
    document.getElementById('total-kcal-val').textContent = tKcal;
    document.getElementById('weekly-dist-val').textContent = tDist.toFixed(1);
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
