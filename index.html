<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Run v31</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 기존 레이아웃 유지 - 절대 수정 금지 원칙 준수 */
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #map { height: 30vh; width: 100%; }
        .status-bar { background: #000; color: #ffcc00; text-align: center; padding: 5px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #333; }
        
        .main-display { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .pace-box { border: 2px solid #00ff88; border-radius: 15px; padding: 15px; text-align: center; position: relative; background: #111; }
        .pace-label { color: #00ff88; font-size: 12px; margin-bottom: 5px; }
        .pace-value { font-size: 48px; font-weight: bold; color: #00ff88; font-family: monospace; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .data-box { background: #1a1a1a; border-radius: 10px; padding: 10px; text-align: center; }
        .label { color: #888; font-size: 11px; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; }
        .unit { font-size: 10px; color: #00ff88; margin-left: 2px; }

        .btn-run { background: #00ff88; color: #000; border: none; border-radius: 40px; padding: 15px; font-size: 20px; font-weight: bold; width: 100%; margin-top: 10px; }
        
        /* 기록 페이지 스타일 */
        #history-page { display: none; padding: 15px; height: 70vh; overflow-y: auto; }
        .history-item { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .hist-left { display: flex; flex-direction: column; }
        .hist-date { font-size: 12px; color: #888; }
        .hist-stats { font-size: 14px; margin-top: 4px; }
        .hist-alt { color: #00ff88; font-size: 12px; }
        .hist-dist { font-size: 18px; font-weight: bold; color: #00ff88; }

        .nav-tabs { display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #333; }
        .nav-tab { color: #888; text-decoration: none; font-weight: bold; }
        .nav-tab.active { color: #00ff88; border-bottom: 2px solid #00ff88; }
    </style>
</head>
<body>

    <div id="map"></div>
    <!-- 고도 정보를 GPS 오차 옆으로 이동 -->
    <div class="status-bar" id="gps-status">GPS READY: ±0m | ALT: 0m</div>

    <div id="run-page" class="main-display">
        <div class="pace-box">
            <div class="pace-label">페이스</div>
            <div class="pace-value" id="current-pace">--'--"</div>
        </div>

        <div class="grid-container">
            <div class="data-box">
                <div class="label">거리</div>
                <div class="value" id="dist">0.00<span class="unit">KM</span></div>
            </div>
            <div class="data-box">
                <div class="label">시간</div>
                <div class="value" id="timer">00:00</div>
            </div>
            <div class="data-box">
                <div class="label">평균</div>
                <div class="value" id="avg-pace">--'--"</div>
            </div>
            <div class="data-box">
                <div class="label">케이던스</div>
                <div class="value" id="cadence">0</div>
            </div>
            <!-- 지면접촉시간 복구 -->
            <div class="data-box">
                <div class="label">지면접촉시간</div>
                <div class="value" id="gct">0<span class="unit">ms</span></div>
            </div>
            <div class="data-box">
                <div class="label">체공시간</div>
                <div class="value" id="flight-time">--<span class="unit">%</span></div>
            </div>
        </div>

        <button class="btn-run" id="start-btn">러닝 시작</button>
    </div>

    <div id="history-page">
        <!-- 기록 항목이 여기에 추가됨 -->
    </div>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="showPage('run')">러닝</div>
        <div class="nav-tab" onclick="showPage('history')">기록</div>
    </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let isRunning = false;
    let timerInterval;
    let seconds = 0;
    let elevationGain = 0; // 기록용 누적 고도 상승

    // 탭 전환 로직
    function showPage(page) {
        document.getElementById('run-page').style.display = page === 'run' ? 'flex' : 'none';
        document.getElementById('history-page').style.display = page === 'history' ? 'block' : 'none';
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        if(page === 'history') displayHistory();
    }

    // GPS 및 고도 업데이트 로직
    function updateLocation(position) {
        const acc = Math.round(position.coords.accuracy);
        const alt = position.coords.altitude ? Math.round(position.coords.altitude) : 0;
        
        // 상단 바 업데이트: 오차범위 옆에 고도 표시
        document.getElementById('gps-status').innerText = `GPS READY: ±${acc}m | ALT: ${alt}m`;
        
        // 러닝 중일 때 고도 데이터 처리 (간단한 누적 로직 예시)
        if(isRunning && alt > 0) {
            // 이전 고도와 비교하여 상승분 누적 가능
        }
    }

    // 기록 표시 로직 (시간 옆에 고도 추가)
    function displayHistory() {
        const historyContainer = document.getElementById('history-page');
        const records = JSON.parse(localStorage.getItem('run_records') || '[]');
        
        historyContainer.innerHTML = records.map(r => `
            <div class="history-item">
                <div class="hist-left">
                    <span class="hist-date">${r.date}</span>
                    <span class="hist-stats">${r.duration} | <span class="hist-alt">${r.elevation}m</span></span>
                </div>
                <div class="hist-dist">${r.distance} KM</div>
            </div>
        `).join('');
    }

    // 위치 추적 시작
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updateLocation, null, {
            enableHighAccuracy: true
        });
    }

    // 시작 버튼 이벤트
    document.getElementById('start-btn').addEventListener('click', function() {
        isRunning = !isRunning;
        this.innerText = isRunning ? "러닝 종료" : "러닝 시작";
        this.style.background = isRunning ? "#ff4444" : "#00ff88";
        
        if(isRunning) {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                let min = Math.floor(seconds / 60);
                let sec = seconds % 60;
                document.getElementById('timer').innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            }, 1000);
        } else {
            clearInterval(timerInterval);
            saveRecord();
        }
    });

    function saveRecord() {
        const records = JSON.parse(localStorage.getItem('run_records') || '[]');
        const newRecord = {
            date: new Date().toLocaleDateString(),
            duration: document.getElementById('timer').innerText,
            distance: document.getElementById('dist').innerText.replace('KM',''),
            elevation: elevationGain // 누적된 고도값 저장
        };
        records.unshift(newRecord);
        localStorage.setItem('run_records', JSON.stringify(records));
    }
</script>
</body>
</html>
