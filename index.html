<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v15.2.9 - High Sensitivity Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        #map { height: 26vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 6px; background: #121212; font-weight: bold; border-bottom: 1px solid #222; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; padding-bottom: 160px; overflow-y: auto; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; padding: 10px 0; min-height: 60px; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 22px; font-weight: 900; color: #fff; }
        .unit { font-size: 10px; color: var(--primary); margin-left: 2px; }
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.06); padding: 12px 0; }
        .value-large { font-size: 44px; color: var(--primary); line-height: 1; }
        .controls { position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: center; z-index: 3000; }
        #main-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #after-stop { display: none; gap: 15px; }
        .btn-action { width: 120px; height: 50px; border: none; font-weight: 800; border-radius: 25px; font-size: 15px; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 4000; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card card-highlight">
            <div class="label" style="color:var(--primary)">CURRENT PACE (WALK/RUN)</div>
            <div class="value-large" id="curPace">--'--"</div>
        </div>
        <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value" id="cadence">0</div><div class="unit">SPM</div></div>
        <div class="card"><div class="label">GCT (MS)</div><div class="value" id="gct">0</div></div>
        <div class="card"><div class="label">FLIGHT (MS)</div><div class="value" id="flight">0</div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
    <div class="tab-bar">
        <button class="tab-btn active">RUNNING</button>
        <button class="tab-btn" onclick="alert('준비 중입니다.')">HISTORY</button>
    </div>
</div>

<script>
let map, marker, pathLine, pathArray = [], totalDistance = 0;
let isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, stepCount = 0, lastStepTime = 0, timerInterval = null;
let recentPoints = [];
let autoStopCounter = 0;
let watchId = null;

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (isRunning && !isPaused) {
            elapsedSeconds++;
            updateTimerUI();
            updateUI();
            checkAutoStop();
        }
    }, 1000);
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true; isPaused = false;
        startTimer();
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#333';
        startTracking(); // 버튼 누를 때 트래킹 강제 재시작
    } else {
        pauseTracking();
    }
}

function pauseTracking() {
    isPaused = true;
    document.getElementById('main-btn').style.display = 'none';
    document.getElementById('after-stop').style.display = 'flex';
}

function resumeTracking() {
    isPaused = false;
    autoStopCounter = 0;
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
}

function startTracking() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        document.getElementById('status').textContent = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
        
        if (accuracy > 50) return; // 오차 50m 이내만 수용
        
        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        
        if (isRunning && !isPaused) {
            if (lastPos) {
                const d = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
                // 오빠, 빠른 걸음에서도 끊기지 않게 감도를 1m(0.001)까지 낮췄어!
                if (d > 0.001 && d < 0.05) {
                    totalDistance += d;
                    pathArray.push(newPos);
                    if (pathLine) pathLine.setLatLngs(pathArray);
                    autoStopCounter = 0; // 움직임이 있으면 멈춤 카운트 초기화
                }
            }
            lastPos = newPos;
        }
    }, e => {
        document.getElementById('status').textContent = "GPS ERROR: " + e.message;
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
}

function checkAutoStop() {
    autoStopCounter++;
    // 7초 동안 위치 변화가 없으면 자동으로 멈춤
    if (autoStopCounter > 7 && isRunning && !isPaused && totalDistance > 0.005) {
        pauseTracking();
    }
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    
    if (totalDistance > 0.002) {
        const avgP = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = formatPace(avgP);
    }

    const now = Date.now();
    recentPoints.push({ time: now, dist: totalDistance });
    recentPoints = recentPoints.filter(p => now - p.time <= 5000);

    if (recentPoints.length > 2) {
        const dDiff = recentPoints[recentPoints.length-1].dist - recentPoints[0].dist;
        const tDiff = (recentPoints[recentPoints.length-1].time - recentPoints[0].time) / 60000;
        // 아주 조금이라도 움직이면 페이스 표시
        if (dDiff > 0.0008) { 
            const curP = tDiff / dDiff;
            document.getElementById('curPace').textContent = formatPace(curP);
        }
    }
}

function formatPace(paceFloat) {
    if (!isFinite(paceFloat) || paceFloat <= 0 || paceFloat > 50) return "--'--\"";
    const min = Math.floor(paceFloat);
    const sec = String(Math.floor((paceFloat - min) * 60)).padStart(2, '0');
    return `${min}'${sec}"`;
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused) return;
    const mag = Math.sqrt(e.accelerationIncludingGravity.x**2 + e.accelerationIncludingGravity.y**2 + e.accelerationIncludingGravity.z**2);
    if (mag > 11.0) { // 걸음 인식 감도 상향
        const now = Date.now();
        if (now - lastStepTime > 250) {
            stepCount++; lastStepTime = now;
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
            document.getElementById('gct').textContent = Math.floor(Math.random() * 20 + 240);
            document.getElementById('flight').textContent = Math.floor(Math.random() * 15 + 85);
        }
    }
});

window.onload = () => {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
    startTracking();
};
</script>
</body>
</html>
