<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OppaRun Pro</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:sans-serif;
    overflow:hidden;
    height:100vh;
}

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

#map{
    height:35vh;
    width:100%;
    border-bottom:1px solid #333;
}

.content{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:10px;
}

.status-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.box{
    background:#151515;
    border:1px solid #222;
    border-radius:10px;
    padding:8px;
    text-align:center;
}

.box small{
    color:#888;
    font-size:11px;
    display:block;
    margin-bottom:2px;
}

.val{
    font-size:18px;
    font-weight:bold;
}

.green-val{
    color:#00ff88;
}

.pace-main{
    border:2px solid #00ff88;
    background:rgba(0,255,136,0.05);
    border-radius:15px;
    padding:10px;
    text-align:center;
    margin:5px 0;
}

.btn-area{
    display:flex;
    flex-direction:column;
    gap:5px;
}

button{
    border:none;
    padding:12px;
    border-radius:30px;
    font-size:16px;
    font-weight:bold;
    width:100%;
}

#startBtn{
    background:#ff4444;
    color:#fff;
}

.sub-btns{
    display:none;
    gap:5px;
}

#resumeBtn{
    background:#00ff88;
    color:#000;
    flex:1;
}

#finishBtn{
    background:#444;
    color:#fff;
    flex:1;
}

#lockBtn{
    background:#222;
    color:#00ff88;
    font-size:13px;
    margin-top:2px;
}

.tab-bar{
    display:flex;
    border-top:1px solid #333;
    background:#000;
    padding:10px 0;
}

.tab-item{
    flex:1;
    text-align:center;
    font-size:12px;
    color:#555;
}

.tab-active{
    color:#00ff88;
    font-weight:bold;
}

#lock-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:9999;
    text-align:center;
}

.my-location{
    background:#007bff;
    border:2px solid white;
    border-radius:50%;
    width:12px;
    height:12px;
    box-shadow:0 0 5px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<div class="container">

    <div id="map"></div>

    <div id="lock-overlay" onclick="unlockScreen()">
        <div style="margin-top:45vh;">
            <div style="font-size:40px;">🔒</div>
            <p>터치하여 잠금 해제</p>
        </div>
    </div>

    <div class="content">

        <div id="gps-stat"
             style="text-align:center;font-size:10px;color:#ffcc00;">
             GPS Accuracy: Wait...
        </div>

        <div class="status-grid">

            <div class="box">
                <small>DISTANCE</small>
                <div id="d" class="val green-val">0.00</div>
            </div>

            <div class="box">
                <small>TIME</small>
                <div id="t" class="val">00:00:00</div>
            </div>

            <div class="box">
                <small>AVG PACE</small>
                <div id="avgP" class="val">--'--"</div>
            </div>

            <div class="box">
                <small>CADENCE</small>
                <div id="cad" class="val">0</div>
            </div>

        </div>

        <div class="pace-main">
            <small style="color:#00ff88;font-size:11px;">
                CURRENT PACE
            </small>

            <div id="p"
                 style="font-size:32px;font-weight:bold;">
                 --'--"
            </div>
        </div>

        <div class="btn-area">

            <button id="startBtn">START RUN</button>

            <div id="subBtns" class="sub-btns">
                <button id="resumeBtn">RESUME</button>
                <button id="finishBtn">STOP</button>
            </div>

            <button id="lockBtn" style="display:none;">
                SCREEN LOCK
            </button>

        </div>

    </div>

    <div class="tab-bar">
        <div class="tab-item tab-active">🏃‍♂️ RUNNING</div>
        <div class="tab-item">📜 HISTORY</div>
    </div>

</div>

<script>

//////////////////////////////////////////////////////
// MAP
//////////////////////////////////////////////////////

let map = L.map('map').setView([37.44,126.5],17);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

let path = L.polyline([],{
    color:'#00ff88',
    weight:6
}).addTo(map);

let myMarker = L.marker([37.44,126.5],{
    icon:L.divIcon({
        className:'my-location',
        iconSize:[12,12]
    })
}).addTo(map);

//////////////////////////////////////////////////////
// VARIABLES
//////////////////////////////////////////////////////

let isRunning = false;

let dist = 0;

let lastPos = null;

let sec = 0;

let timer = null;

let lastPaceUpdate = 0;

let speedBuffer = [];

let lastKmAlert = 0;

let lastMoveTime = Date.now();

//////////////////////////////////////////////////////
// UPDATE GPS
//////////////////////////////////////////////////////

function update(pos){

    const c = pos.coords;

    //////////////////////////////////////////////////
    // GPS STATUS
    //////////////////////////////////////////////////

    document.getElementById('gps-stat').innerText =
        `GPS Accuracy: ±${Math.round(c.accuracy)}m`;

    //////////////////////////////////////////////////
    // MARKER MOVE
    //////////////////////////////////////////////////

    myMarker.setLatLng([c.latitude,c.longitude]);

    //////////////////////////////////////////////////
    // FIRST POSITION
    //////////////////////////////////////////////////

    if(!lastPos){

        map.setView([c.latitude,c.longitude],17);

        lastPos = {
            lat:c.latitude,
            lng:c.longitude
        };

        return;
    }

    //////////////////////////////////////////////////
    // DISTANCE
    //////////////////////////////////////////////////

    let d = map.distance(
        [lastPos.lat,lastPos.lng],
        [c.latitude,c.longitude]
    );

    //////////////////////////////////////////////////
    // GPS FILTER
    //////////////////////////////////////////////////

    const goodAccuracy = c.accuracy < 20;
    const goodDistance = d > 2 && d < 15;

    //////////////////////////////////////////////////
    // RUNNING
    //////////////////////////////////////////////////

    if(isRunning && goodAccuracy && goodDistance){

        //////////////////////////////////////////////////
        // DISTANCE ADD
        //////////////////////////////////////////////////

        dist += d;

        document.getElementById('d').innerText =
            (dist/1000).toFixed(2);

        //////////////////////////////////////////////////
        // DRAW PATH
        //////////////////////////////////////////////////

        path.addLatLng([c.latitude,c.longitude]);

        //////////////////////////////////////////////////
        // SMOOTH MAP MOVE
        //////////////////////////////////////////////////

        map.setView(
            [c.latitude,c.longitude],
            map.getZoom(),
            {animate:false}
        );

        //////////////////////////////////////////////////
        // AVG PACE
        //////////////////////////////////////////////////

        let avgPaceRaw =
            (sec/60)/(dist/1000);

        if(dist > 0){

            let am = Math.floor(avgPaceRaw);

            let as = Math.round(
                (avgPaceRaw-am)*60
            );

            document.getElementById('avgP').innerText =
                `${am}'${as.toString().padStart(2,'0')}"`;
        }

        //////////////////////////////////////////////////
        // KM ALERT
        //////////////////////////////////////////////////

        let currentKm = Math.floor(dist/1000);

        if(currentKm > lastKmAlert){

            lastKmAlert = currentKm;

            alert(`${currentKm}km 완료`);
        }
    }

    //////////////////////////////////////////////////
    // SAVE POSITION
    //////////////////////////////////////////////////

    if(goodAccuracy){

        lastPos = {
            lat:c.latitude,
            lng:c.longitude
        };
    }

    //////////////////////////////////////////////////
    // SPEED BUFFER
    //////////////////////////////////////////////////

    if(c.speed && c.speed > 0){

        speedBuffer.push(c.speed);

        if(speedBuffer.length > 5){
            speedBuffer.shift();
        }
    }

    //////////////////////////////////////////////////
    // AVG SPEED
    //////////////////////////////////////////////////

    let avgSpeed = 0;

    if(speedBuffer.length > 0){

        avgSpeed =
            speedBuffer.reduce((a,b)=>a+b,0)
            / speedBuffer.length;
    }

    //////////////////////////////////////////////////
    // CURRENT PACE
    //////////////////////////////////////////////////

    let now = Date.now();

    if(now - lastPaceUpdate > 3000){

        if(avgSpeed > 0.5){

            let pace = 16.6667 / avgSpeed;

            let m = Math.floor(pace);

            let s = Math.round((pace-m)*60);

            document.getElementById('p').innerText =
                `${m}'${s.toString().padStart(2,'0')}"`;

            //////////////////////////////////////////////////
            // CADENCE ESTIMATE
            //////////////////////////////////////////////////

            let cadence =
                Math.round((avgSpeed*60)/1.2);

            document.getElementById('cad').innerText =
                cadence;

            lastMoveTime = Date.now();

        }else{

            document.getElementById('p').innerText =
                `--'--"`;

            document.getElementById('cad').innerText =
                `0`;
        }

        lastPaceUpdate = now;
    }

    //////////////////////////////////////////////////
    // AUTO PAUSE
    //////////////////////////////////////////////////

    if(
        isRunning &&
        Date.now() - lastMoveTime > 5000
    ){
        isRunning = false;

        document.getElementById('resumeBtn').style.display =
            "block";

        document.getElementById('finishBtn').innerText =
            "STOP";
    }
}

//////////////////////////////////////////////////////
// START
//////////////////////////////////////////////////////

document.getElementById('startBtn').onclick = function(){

    isRunning = true;

    this.style.display = "none";

    document.getElementById('subBtns').style.display =
        "flex";

    document.getElementById('lockBtn').style.display =
        "block";

    timer = setInterval(()=>{

        if(isRunning){

            sec++;

            let h = Math.floor(sec/3600);

            let m = Math.floor((sec%3600)/60);

            let s = sec%60;

            document.getElementById('t').innerText =
                `${h.toString().padStart(2,'0')}:` +
                `${m.toString().padStart(2,'0')}:` +
                `${s.toString().padStart(2,'0')}`;
        }

    },1000);
};

//////////////////////////////////////////////////////
// STOP / FINISH
//////////////////////////////////////////////////////

document.getElementById('finishBtn').onclick = function(){

    if(this.innerText === "STOP"){

        isRunning = false;

        this.innerText = "FINISH";

        document.getElementById('resumeBtn').style.display =
            "block";

    }else{

        alert("기록을 저장하고 히스토리로 이동합니다!");

        location.reload();
    }
};

//////////////////////////////////////////////////////
// RESUME
//////////////////////////////////////////////////////

document.getElementById('resumeBtn').onclick = function(){

    isRunning = true;

    this.style.display = "none";

    document.getElementById('finishBtn').innerText =
        "STOP";

    lastMoveTime = Date.now();
};

//////////////////////////////////////////////////////
// SCREEN LOCK
//////////////////////////////////////////////////////

document.getElementById('lockBtn').onclick = ()=>{

    document.getElementById('lock-overlay').style.display =
        "block";
};

function unlockScreen(){

    document.getElementById('lock-overlay').style.display =
        "none";
}

//////////////////////////////////////////////////////
// GPS WATCH
//////////////////////////////////////////////////////

navigator.geolocation.watchPosition(

    update,

    null,

    {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:5000
    }
);

</script>

</body>
</html>
