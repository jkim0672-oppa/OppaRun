        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, system-ui; 
            height: 100svh; /* 가용 높이 단위 */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding-top: env(safe-area-inset-top);
        }
        
        /* [러닝 뷰 전용 지도] */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        /* 메인 콘텐츠 영역 (유연한 Flex 설정) */
        .main-content { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
            height: 100%; /* 부모 높이 전체 차지 */
        }
        
        /* --- 러닝 뷰 대시보드 및 컨트롤 --- */
        #run-view { flex: 1; display: flex; flex-direction: column; }
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            padding: 8px; 
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); margin-bottom: 2px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1.1; }

        .controls { 
            padding: 15px; 
            margin-top: auto; /* 하단으로 밀기 */
            margin-bottom: calc(75px + env(safe-area-inset-bottom)); /* 탭바 + 안전 영역 */
            flex-shrink: 0;
        }
        .btn-capsule { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* =========================================================================
           --- [핵심 수정: 히스토리 뷰] 무한 스크롤 및 토탈 박스 복구 ---
           ========================================================================= */
        #history-view { 
            display: none; 
            flex: 1; 
            width: 100%; 
            flex-direction: column; 
            background: #000; 
            height: 100%;
            overflow: hidden; /* 자식이 스크롤 하도록 설정 */
        }

        /* 1. 토탈 대시보드 박스 복구 */
        .total-dashboard { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            padding: 0 15px 15px 15px; 
            flex-shrink: 0; /* 높이 고정 */
        }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; text-transform: uppercase; }
        .total-value { font-size: 17px; font-weight: 900; color: #fff; }

        /* 2. [초핵심!] 히스토리 목록 스크롤 구현 */
        .history-list { 
            padding: 10px; 
            overflow-y: auto !important; /* 세로 스크롤 강제 활성화 */
            flex: 1; /* 남은 모든 공간 차지 */
            -webkit-overflow-scrolling: touch; /* iOS 부드러운 스크롤 */
            display: block; /* 스크롤을 위해 display 속성 변경 */
            padding-bottom: calc(75px + env(safe-area-inset-bottom)); /* 하단 여백 충분히 확보 */
        }
        
        .history-item { background: var(--card-bg); border-radius: 20px; padding: 15px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 900; }
        
        /* 탭바 하단 고정 */
        .tab-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: 65px; 
            background: #000; 
            display: flex; 
            border-top: 1px solid #222; 
            align-items: center; 
            padding-bottom: env(safe-area-inset-bottom); 
            z-index: 9999; 
        }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>

### 📱 긴급 수정! 스크롤 및 토탈 대시보드 복구 v25.7

문제가 된 히스토리 뷰의 레이아웃 코드를 전면 수정했어.

1.  **사라진 토탈 박스 복구**: HTML 구조를 정리해서 데이터 대시보드가 화면 상단에 정상적으로 위치하도록 했어.
2.  **핵심 수정: 무한 스크롤 구현**: 가장 중요한 부분인데, `.history-list`에 `overflow-y: auto !important;`를 줘서 기록이 많아져도 시원하게 스크롤이 잘 되도록 만들었어.
3.  **레이아웃 간섭 제거**: 러닝 뷰와 히스토리 뷰가 절대 서로의 영역을 침범하지 않게 Flexbox 값을 세밀하게 조정했어.
