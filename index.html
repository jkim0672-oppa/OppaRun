<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v22.5 Final (WakeLock)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 레이아웃 절대 고정 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding-bottom: 80px; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; margin-bottom: 2px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 800; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        .controls { height: 90px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; font-size: 16px; border: none; display: flex; align-items: center; justify-content: center; }
        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; }
        .history-list { padding: 10px; overflow-y: auto; flex: 1; }
        .history-item { background: #1a1a1a; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .history-date { font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
        .history-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .h-val { font-size: 14px; font-weight: 700; color: #fff; }
        .h-lab { font-size: 9px; color: var(--text-dim); }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">LOCATING...</div>
</div>

<div id="run-view" class="main-content">
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div id="history-view" class="main-content">
    <h3 style="color: var(--primary); text-align: center; margin: 15px 0;">RUNNING HISTORY</h3>
    <div id="history-list" class="history-list"></div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div>

<script>
let map, marker, polyline, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, timer;
let lastMoveTime = Date.now(), autoPaused = false;
let totalDist = 0, lastPos = null, steps = 0;

// 화면 꺼짐 방지
async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } 
    catch (err) { console.error(`${err.name}, ${err.message}`); }
}
function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release(); wakeLock = null; } }

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let totalSec = 3600 / kmh;
    return `${Math.floor(totalSec/60)}'${String(Math.floor(totalSec%60)).padStart(2,'0')}"`;
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5, opacity: 0.8}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    loadHistory();
    
    window.addEventListener('devicemotion', (e) => {
        if (!isRunning || isPaused) return;
        let acc = e.accelerationIncludingGravity;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        if (force > 13) { 
            steps++; document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
            document.getElementById('gct').textContent = Math.floor(Math.random() * (240 - 200) + 200); 
            document.getElementById('flight').textContent = Math.floor(Math.random() * (35 - 25) + 25);
        }
    });
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const speedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "GPS READY"; }
    if (isRunning) {
        if (speedKmh < 1) {
            if ((Date.now() - lastMoveTime)/1000 >= 5 && !isPaused) {
                isPaused = true; autoPaused = true;
                document.getElementById('status').textContent = "AUTO PAUSED";
                document.getElementById('status').style.color = "#ff4444";
            }
        } else {
            lastMoveTime = Date.now();
            if (autoPaused) { isPaused = false; autoPaused = false; document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00"; }
        }
        if (!isPaused) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); }
            }
            lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); map.panTo(pos);
            document.getElementById('curPace').textContent = formatPace(speedKmh);
            let avgKmh = seconds > 0 ? (totalDist / (seconds / 3600)) : 0;
            document.getElementById('avgPace').textContent = formatPace(avgKmh);
        }
    }
}

function onStart() {
    requestWakeLock();
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; lastPos = null; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00";
    if (timer) clearInterval(timer);
    timer = setInterval(() => { if(!isPaused) { 
        seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
    }}, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; document.getElementById('status').textContent = "PAUSED"; }
function onResume() { isPaused = false; autoPaused = false; lastMoveTime = Date.now(); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; document.getElementById('status').textContent = "RUNNING"; }

function onFinish() {
    releaseWakeLock();
    const record = {
        date: new Date().toLocaleString(),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        avgPace: document.getElementById('avgPace').textContent,
        path: pathCoords 
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    alert("운동 기록이 저장되었습니다!");
    location.reload();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = history.length ? "" : '<div style="color:#444; text-align:center; margin-top:50px;">No records yet.</div>';
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="history-date">${r.date}</div>
            <div class="history-grid">
                <div><div class="h-lab">DIST</div><div class="h-val">${r.dist}km</div></div>
                <div><div class="h-lab">TIME</div><div class="h-val">${r.time}</div></div>
                <div><div class="h-lab">PACE</div><div class="h-val">${r.avgPace}</div></div>
            </div>
        `;
        list.appendChild(item);
    });
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}
window.onload = initMap;
</script>
</body>
</html>
