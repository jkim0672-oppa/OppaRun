<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.3.3 (Full Features)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --good: #00ff88;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 8px 4px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 6px; font-size: 10px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 8px; }
        .h-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 9px; padding: 5px 8px; border-radius: 5px; font-weight: 900; }
        
        .h-main-stats { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .h-val-big { font-size: 20px; font-weight: 900; }

        .h-details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: var(--text-dim); font-weight: 900; }
        .h-det-val { font-size: 12px; font-weight: 900; color: #eee; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        .settings-container { padding: 15px; }
        .settings-group { margin-bottom: 20px; }
        .settings-label { font-size: 10px; color: var(--primary); font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
        .input-box { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 800; }
        
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="btn-dim" style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-profile" class="sub-btn" onclick="ui.showSubTab('profile')">PROFILE</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container"></div></div>
        
        <div id="sub-page-profile" class="sub-page">
            <div class="settings-container">
                <div class="settings-group">
                    <div class="settings-label">HEIGHT (cm)</div>
                    <input type="number" id="user-height" class="input-box" placeholder="175" onchange="storage.saveProfile()">
                </div>
                <div class="settings-group">
                    <div class="settings-label">WEIGHT (kg)</div>
                    <input type="number" id="user-weight" class="input-box" placeholder="70" onchange="storage.saveProfile()">
                </div>
            </div>
        </div>

        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container">
                <div class="settings-group">
                    <div class="settings-label">LANGUAGE</div>
                    <select id="lang-select" class="input-box" onchange="storage.setLang(this.value)">
                        <option value="en">English</option>
                        <option value="ko">한국어</option>
                    </select>
                </div>
                <div class="settings-group">
                    <div class="settings-label">METRONOME BPM</div>
                    <input type="range" id="metro-bpm" min="140" max="200" value="175" style="width:100%; accent-color:var(--primary);">
                    <div id="metro-val" style="text-align:center; font-weight:900; margin-top:5px;">175 BPM</div>
                </div>
                <button style="background:#2a2a2a; color:var(--danger); border:1px solid #444; padding:15px; border-radius:10px; width:100%; font-weight:900; margin-top:20px;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/** OppaRun Pro v29.3.3 */
const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", profile: "PROFILE", settings: "SETTINGS", clear: "CLEAR ALL HISTORY", confirmClear: "Are you sure?", route: "ROUTE", diag: "DIAG" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", profile: "프로필", settings: "설정", clear: "전체 기록 삭제", confirmClear: "정말로 삭제할까요?", route: "경로", diag: "진단" }
};

class RunningStorage {
    constructor() { this.H_KEY = 'oppaRunHistory'; this.P_KEY = 'oppaRunProfile'; this.L_KEY = 'oppaRunLang'; }
    saveRecord(r) { const h = this.loadHistory(); h.unshift(r); localStorage.setItem(this.H_KEY, JSON.stringify(h)); }
    loadHistory() { return JSON.parse(localStorage.getItem(this.H_KEY)) || []; }
    saveProfile() {
        const p = { height: document.getElementById('user-height').value, weight: document.getElementById('user-weight').value };
        localStorage.setItem(this.P_KEY, JSON.stringify(p));
    }
    loadProfile() {
        const p = JSON.parse(localStorage.getItem(this.P_KEY)) || { height: 175, weight: 70 };
        document.getElementById('user-height').value = p.height; document.getElementById('user-weight').value = p.weight;
    }
    setLang(l) { localStorage.setItem(this.L_KEY, l); location.reload(); }
    getLang() { return localStorage.getItem(this.L_KEY) || 'en'; }
    clearHistory() { if(confirm(translations[this.getLang()].confirmClear)) { localStorage.removeItem(this.H_KEY); location.reload(); } }
}

class UIManager {
    constructor() { this.dom = { pace: document.getElementById('curPace'), dist: document.getElementById('dist'), time: document.getElementById('time'), avg: document.getElementById('avgPace'), cad: document.getElementById('cadence'), hList: document.getElementById('history-list'), pause: document.getElementById('pause-status') }; }
    showTab(t) {
        document.getElementById('run-view').style.display = t==='run'?'flex':'none';
        document.getElementById('map-area').style.display = t==='run'?'block':'none';
        document.getElementById('history-view').style.display = t==='history'?'flex':'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-'+t).classList.add('active');
        if(t==='history') { this.updateHistoryList(); storage.loadProfile(); }
    }
    showSubTab(s) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-'+s).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-'+s).style.display = 'flex';
    }
    updateHistoryList() {
        const h = storage.loadHistory(); const t = translations[storage.getLang()];
        this.dom.hList.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-actions">
                    <button class="btn-h-sub">${t.route}</button>
                    <button class="btn-h-sub">${t.diag}</button>
                </div>
                <div class="h-main-stats">
                    <div class="h-val-big">${r.dist} <span style="font-size:10px; color:var(--primary)">KM</span></div>
                    <div class="h-val-big" style="color:var(--primary)">${r.time}</div>
                </div>
                <div class="h-details-grid">
                    <div class="h-det-box"><div class="h-det-label">${t.avg}</div><div class="h-det-val">${r.avgPace||"0'00\""}</div></div>
                    <div class="h-det-box"><div class="h-det-label">${t.cadence}</div><div class="h-det-val">${r.cadence||0}</div></div>
                    <div class="h-det-box"><div class="h-det-label">ALT</div><div class="h-det-val">${r.alt||0}m</div></div>
                </div>
            </div>`).join('');
    }
    toggleDim(s) { document.getElementById('dimmer-overlay').style.display = s?'flex':'none'; }
}

class OppaRunApp {
    constructor() { this.state = { running: false, sec: 0, dist: 0, steps: 0, alt: 0, lastPos: null, autoPaused: false }; this.map = null; this.timer = null; }
    async init() {
        this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.7743, -117.9380], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude]; this.state.alt = Math.round(p.coords.altitude||0);
            document.getElementById('status').textContent = `GPS ACTIVE | ALT: ${this.state.alt}m`;
            this.map.panTo(pos);
            if(this.state.running) this.updatePos(pos, p.coords.speed);
        }, null, {enableHighAccuracy:true});
        storage.loadProfile(); document.getElementById('lang-select').value = storage.getLang();
    }
    updatePos(pos, speed) {
        if(speed !== null && speed < 0.5) { this.state.autoPaused = true; document.getElementById('pause-status').style.display='block'; return; }
        this.state.autoPaused = false; document.getElementById('pause-status').style.display='none';
        if(this.state.lastPos) {
            const d = this.map.distance(this.state.lastPos, pos)/1000;
            if(d > 0.002) { this.state.dist += d; document.getElementById('dist').textContent = this.state.dist.toFixed(2); }
        }
        this.state.lastPos = pos;
    }
    async onStart() {
        if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
        window.addEventListener('devicemotion', (e) => this.handleMotion(e));
        this.state.running = true; document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='block';
        this.timer = setInterval(() => {
            if(this.state.autoPaused) return;
            this.state.sec++;
            const m = Math.floor(this.state.sec/60), s = this.state.sec%60;
            document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }
    handleMotion(e) {
        if(this.state.autoPaused) return;
        const a = e.accelerationIncludingGravity; const f = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
        if(f > 13) { this.state.steps++; document.getElementById('cadence').textContent = Math.round((this.state.steps/(this.state.sec||1))*60); }
    }
    onStop() { this.state.running = false; document.getElementById('btn-stop').style.display='none'; document.getElementById('after-stop').style.display='flex'; clearInterval(this.timer); }
    onResume() { this.state.running = true; document.getElementById('after-stop').style.display='none'; document.getElementById('btn-stop').style.display='block'; this.onStart(); }
    onFinish() {
        storage.saveRecord({
            date: new Date().toLocaleString(), dist: this.state.dist.toFixed(2), time: document.getElementById('time').textContent,
            cadence: document.getElementById('cadence').textContent, alt: this.state.alt
        });
        location.reload();
    }
}

const storage = new RunningStorage(), ui = new UIManager(), app = new OppaRunApp();
window.onload = () => app.init();
document.getElementById('metro-bpm').oninput = function() { document.getElementById('metro-val').textContent = this.value + " BPM"; };
</script>
</body>
</html>
