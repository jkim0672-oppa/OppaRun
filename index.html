<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.0 (Map & Lap Analysis)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* Controls */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* History */
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; position: relative; }
        .h-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .btn-map-view { background: var(--primary); border: none; color: #000; border-radius: 4px; font-size: 9px; font-weight: 900; padding: 3px 8px; }
        .h-main { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .h-dist, .h-time { font-size: 18px; font-weight: 700; color: #ffffff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #888; font-weight: 800; }
        .h-det-val { font-size: 14px; font-weight: 600; color: #ddd; }

        /* Custom Selector */
        .info-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin: 10px 12px; border: 1px solid #222; }
        .custom-select { position: relative; width: 100%; }
        .select-trigger { background: #1a1a1a; padding: 14px; border-radius: 10px; border: 1.5px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .select-options { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1.5px solid var(--primary); border-top: none; border-radius: 0 0 10px 10px; max-height: 0; overflow-y: auto; opacity: 0; transition: 0.3s; z-index: 100; }
        .select-options.show { max-height: 200px; opacity: 1; }
        .option-item { padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }

        /* Full Map Overlay */
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; }
        #detail-map { flex: 1; width: 100%; }
        .overlay-close { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: 900; z-index: 2100; }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        .pace-marker { background: rgba(0,0,0,0.8); color: var(--primary); border: 1.5px solid var(--primary); border-radius: 6px; padding: 2px 5px; font-size: 10px; font-weight: 900; text-align: center; white-space: nowrap; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div id="lbl-curPace" class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div id="lbl-dist" class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div id="lbl-time" class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div id="lbl-avgPace" class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div id="lbl-cadence" class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
        <div id="sub-page-settings" class="sub-page">
            <div class="info-card">
                <h3 id="lbl-lang-setting" style="color:var(--primary); margin:0 0 15px 0;">Language</h3>
                <div class="custom-select" onclick="toggleDropdown()">
                    <div class="select-trigger"><span id="current-lang-text">English</span><div style="border-top:6px solid #666;border-left:5px solid transparent;border-right:5px solid transparent;"></div></div>
                    <div id="select-options" class="select-options"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="map-overlay">
        <button class="overlay-close" onclick="closeDetailMap()">CLOSE</button>
        <div id="detail-map"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, detailMap, detailPolyline, detailMarkers = [];
let isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [], kmMarkers = [], lastKm = 0;
let steps = 0, lastStepTime = 0, gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

const i18n = {
    ko: { run: "러닝", history: "기록", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", curPace: "페이스", dist: "거리", time: "시간", avgPace: "평균", list: "내역", total: "통계", settings: "설정", autoPause: "자동 정지", mapBtn: "지도 보기" },
    en: { run: "RUN", history: "HISTORY", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", curPace: "PACE", dist: "DIST", time: "TIME", avgPace: "AVG", list: "LIST", total: "TOTAL", settings: "SETTINGS", autoPause: "AUTO PAUSED", mapBtn: "MAP VIEW" }
};

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 6, opacity: 0.8}).addTo(map);
    
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    setLanguage(localStorage.getItem('oppaRunLang') || 'en');
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; }
        else if (currentSpeedKmh >= 0.8 && isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; }
        
        if (!isAutoPaused && p.coords.accuracy < 45) {
            if (lastPos) {
                let d = calculateDistance(lastPos, pos);
                if (d > 0.0015) { 
                    totalDist += d; 
                    pathCoords.push(pos); 
                    polyline.setLatLngs(pathCoords);
                    lastPos = pos;
                    
                    // 1km 마다 데이터 저장
                    if (Math.floor(totalDist) > lastKm) {
                        lastKm = Math.floor(totalDist);
                        kmMarkers.push({ pos: pos, km: lastKm, pace: formatPace(totalDist / (seconds / 3600)) });
                    }
                }
            } else { lastPos = pos; }
            document.getElementById('dist').textContent = totalDist.toFixed(2);
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else if (!isRunning) { map.panTo(pos); }
}

function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        cadence: Math.round((steps/(seconds||1))*60),
        kcal: Math.round(totalDist * 65),
        path: pathCoords, // 전체 좌표 저장
        laps: kmMarkers    // 1km 페이스 저장
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showDetailMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const data = h.find(r => r.id == id);
    if (!data || !data.path.length) return alert("No GPS Data");

    document.getElementById('map-overlay').style.display = 'flex';
    if (!detailMap) {
        detailMap = L.map('detail-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        detailPolyline = L.polyline([], {color: '#00ff88', weight: 8}).addTo(detailMap);
    }
    
    // 이전 마커 제거
    detailMarkers.forEach(m => detailMap.removeLayer(m));
    detailMarkers = [];

    detailPolyline.setLatLngs(data.path);
    
    // 킬로미터 페이스 마커 추가
    data.laps.forEach(lap => {
        let m = L.marker(lap.pos, {
            icon: L.divIcon({ className: 'pace-marker', html: `${lap.km}K<br>${lap.pace}` })
        }).addTo(detailMap);
        detailMarkers.push(m);
    });

    detailMap.fitBounds(detailPolyline.getBounds(), {padding: [30, 30]});
}

function closeDetailMap() { document.getElementById('map-overlay').style.display = 'none'; }

// 보조 함수들
function calculateDistance(p1, p2) {
    const R = 6371; const dLat = (p2[0]-p1[0]) * Math.PI/180; const dLon = (p2[1]-p1[1]) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function handleMotion(e) { /* 기존 가속도계 로직 동일 */ }
function onStart() { isRunning = true; timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000); document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='block'; }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display='none'; document.getElementById('after-stop').style.display='flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display='none'; document.getElementById('btn-stop').style.display='block'; }
function showTab(tab) { document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none'); document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none'); document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none'); document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : ''); document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : ''); if(tab === 'run') setTimeout(() => map.invalidateSize(), 100); else showSubTab('list'); }
function showSubTab(sub) { document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active')); document.getElementById('sub-tab-' + sub).classList.add('active'); document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById('sub-page-' + sub).style.display = 'flex'; if (sub === 'list') updateHistoryStats(); }
function updateHistoryStats() { 
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); 
    const lang = localStorage.getItem('oppaRunLang') || 'en';
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-header"><span class="h-date">${r.date}</span><button class="btn-map-view" onclick="showDetailMap(${r.id})">${i18n[lang].mapBtn}</button></div>
            <div class="h-main"><span class="h-dist">${r.dist}KM</span><span class="h-time">${r.time}</span></div>
            <div class="h-details"><div class="h-det-box"><span>PACE</span><span class="h-det-val">${r.pace}</span></div><div class="h-det-box"><span>CAD</span><span class="h-det-val">${r.cadence}</span></div><div class="h-det-box"><span>KCAL</span><span class="h-det-val">${r.kcal}</span></div><div class="h-det-box"><span>AVG</span><span class="h-det-val">${r.pace}</span></div></div>
        </div>`).join(''); 
}
function setLanguage(l) { localStorage.setItem('oppaRunLang', l); document.getElementById('current-lang-text').innerText = (l==='ko'?'한국어':'English'); updateHistoryStats(); /* 버튼 텍스트 등 업데이트 로직 */ }
function toggleDropdown() { document.getElementById('select-options').classList.toggle('show'); document.getElementById('select-options').innerHTML = '<div class="option-item" onclick="setLanguage(\'ko\')">한국어</div><div class="option-item" onclick="setLanguage(\'en\')">English</div>'; }
window.onload = initMap;
</script>
</body>
</html>
