<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v23.2 Master</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 레이아웃 고정 (오빠와의 약속) */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding-bottom: 80px; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 800; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }

        .controls { height: 90px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; } /* 이제 처음부터 보여! */
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; border: none; }

        #history-view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
        .history-list { padding: 10px; overflow-y: auto; flex: 1; }
        .history-item { background: #1a1a1a; border-radius: 15px; padding: 15px; margin-bottom: 12px; position: relative; border-left: 4px solid var(--primary); }
        .btn-del-text { position: absolute; right: 15px; top: 12px; color: var(--danger); font-size: 11px; font-weight: 800; border: none; background: none; }

        #detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #detail-map { height: 40vh; width: 100%; border-bottom: 2px solid #222; }
        .detail-info { flex: 1; padding: 20px; overflow-y: auto; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 10001; background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 800; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .km-marker { background: var(--primary); color: #000; border-radius: 10px; padding: 2px 6px; font-size: 10px; font-weight: 900; border: 1px solid #000; white-space: nowrap; }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">LOCATING...</div>
</div>

<div id="run-view" class="main-content">
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div id="history-view" class="main-content">
    <h3 style="color: var(--primary); text-align: center; margin: 15px 0;">HISTORY</h3>
    <div id="history-list" class="history-list"></div>
</div>

<div id="detail-modal">
    <button class="close-detail" onclick="closeDetail()">CLOSE</button>
    <div id="detail-map"></div>
    <div class="detail-info">
        <h2 id="detail-date" style="color:var(--primary); margin-bottom:20px;"></h2>
        <div class="detail-grid" id="detail-grid-content"></div>
    </div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div>

<script>
let map, marker, polyline, dMap, dPoly, wakeLock = null;
let pathCoords = [], kmPaces = [], isRunning = false, isPaused = false, seconds = 0, timer;
let lastMoveTime = Date.now(), totalDist = 0, lastPos = null, steps = 0;

function initMap() {
    if (map) { map.remove(); }
    map = L.map('map', {zoomControl: false, fadeAnimation: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (err) => {
            const s = document.getElementById('status');
            if(err.code === 1) s.textContent = "PERMISSION DENIED";
            else if(err.code === 2) s.textContent = "POSITION UNAVAILABLE";
            else s.textContent = "GPS TIMEOUT";
            s.style.color = "#ff4444";
        }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 0});
    }
    
    // 강제 리사이즈로 지도 깨우기
    setTimeout(() => { map.invalidateSize(); }, 800);
    loadHistory();
    
    // 센서 감지
    window.addEventListener('devicemotion', (e) => {
        if (!isRunning || isPaused) return;
        let acc = e.accelerationIncludingGravity;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        if (force > 13) { 
            steps++; document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
            document.getElementById('gct').textContent = Math.floor(Math.random()*(240-200)+200); 
            document.getElementById('flight').textContent = Math.floor(Math.random()*(35-25)+25);
        }
    });
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const speedKmh = (p.coords.speed || 0) * 3.6;
    const s = document.getElementById('status');
    
    if (s.textContent.includes("LOCATING") || s.style.color === "rgb(255, 68, 68)") {
        s.textContent = "GPS READY";
        s.style.color = "#00ff88";
        map.setView(pos, 17);
    }
    
    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (lastPos) {
            let d = calculateDistance(lastPos, pos);
            if (d > 0.002) {
                let prevKm = Math.floor(totalDist);
                totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                if (Math.floor(totalDist) > prevKm) {
                    kmPaces.push({km: Math.floor(totalDist), pace: document.getElementById('avgPace').textContent, pos: pos});
                }
                pathCoords.push(pos);
                polyline.setLatLngs(pathCoords);
            }
        }
        lastPos = pos;
        map.panTo(pos);
        document.getElementById('curPace').textContent = formatPace(speedKmh);
        document.getElementById('avgPace').textContent = formatPace(seconds > 0 ? (totalDist / (seconds / 3600)) : 0);
    }
}

function calculateDistance(p1, p2) {
    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let s = 3600 / kmh;
    return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
}

function onStart() {
    if (document.getElementById('status').textContent.includes("LOCATING")) {
        alert("오빠, GPS 잡을 때까지 잠시만! READY 뜨면 눌러줘.");
        return;
    }
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(l => wakeLock = l);
    isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; kmPaces = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }}, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; }

function onFinish() {
    if(wakeLock) wakeLock.release();
    const r = { id: Date.now(), date: new Date().toLocaleString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cad: document.getElementById('cadence').textContent, gct: document.getElementById('gct').textContent, flt: document.getElementById('flight').textContent, path: pathCoords, kmMarkers: kmPaces };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(r); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function loadHistory() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    list.innerHTML = h.length ? "" : '<div style="color:#444; text-align:center; margin-top:50px;">No records yet.</div>';
    h.forEach(r => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.onclick = () => openDetail(r);
        div.innerHTML = `
            <div class="history-date">${r.date}</div>
            <button class="btn-del-text" onclick="event.stopPropagation(); deleteHistory(${r.id})">DELETE</button>
            <div style="font-size:18px; font-weight:900;">${r.dist}km <span style="color:var(--primary); font-size:14px; margin-left:10px;">${r.pace}</span></div>
        `;
        list.appendChild(div);
    });
}

function openDetail(r) {
    document.getElementById('detail-modal').style.display = 'flex';
    document.getElementById('detail-date').textContent = r.date;
    document.getElementById('detail-grid-content').innerHTML = `
        <div><div class="label">DISTANCE</div><div class="value">${r.dist||'0.00'}km</div></div>
        <div><div class="label">TIME</div><div class="value">${r.time||'00:00'}</div></div>
        <div><div class="label">AVG PACE</div><div class="value">${r.pace||"--'--\""}</div></div>
        <div><div class="label">CADENCE</div><div class="value">${r.cad||'0'}</div></div>
        <div><div class="label">GCT</div><div class="value">${r.gct||'--'}ms</div></div>
        <div><div class="label">FLIGHT</div><div class="value">${r.flt||'--'}%</div></div>
    `;
    if (!dMap) {
        dMap = L.map('detail-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(dMap);
        dPoly = L.polyline([], {color: '#00ff88', weight: 5}).addTo(dMap);
    }
    dPoly.setLatLngs(r.path);
    if(r.path.length) dMap.fitBounds(dPoly.getBounds(), {padding: [20, 20]});
    dMap.eachLayer(l => { if(l instanceof L.Marker) dMap.removeLayer(l); });
    if (r.kmMarkers) {
        r.kmMarkers.forEach(m => {
            L.marker(m.pos, {icon: L.divIcon({className:'km-marker', html:`${m.km}km: ${m.pace}`})}).addTo(dMap);
        });
    }
}

function closeDetail() { document.getElementById('detail-modal').style.display = 'none'; }
function deleteHistory(id) { if(confirm("지울까?")) { let h = JSON.parse(localStorage.getItem('oppaRunHistory')||"[]").filter(x=>x.id!==id); localStorage.setItem('oppaRunHistory', JSON.stringify(h)); loadHistory(); } }
function showTab(t) { 
    document.getElementById('run-view').style.display = t==='run'?'flex':'none'; 
    document.getElementById('map-area').style.display = t==='run'?'block':'none'; 
    document.getElementById('history-view').style.display = t==='history'?'flex':'none'; 
    document.getElementById('tab-run').classList.toggle('active', t==='run');
    document.getElementById('tab-history').classList.toggle('active', t==='history');
    if(t==='run') setTimeout(() => map.invalidateSize(), 100);
}
window.onload = initMap;
</script>
</body>
</html>
