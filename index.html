<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v15.4.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        #map { height: 32vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #121212; font-weight: bold; border-bottom: 1px solid #222; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: 900; color: #fff; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        .card-highlight { grid-column: span 2; border: 1px solid var(--primary); background: rgba(0,255,136,0.03); }
        .value-large { font-size: 42px; color: var(--primary); line-height: 1; }
        .controls { position: absolute; bottom: 105px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        #main-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 0 15px rgba(255,59,48,0.4); }
        #after-stop { display: none; gap: 15px; }
        .btn-action { width: 110px; height: 50px; border: none; font-weight: 800; border-radius: 25px; font-size: 15px; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; padding-bottom: env(safe-area-inset-bottom); align-items: center; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; text-transform: uppercase; padding-bottom: 10px; }
        .tab-btn.active { color: var(--primary); }
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; }
        #split-info { height: 420px; background: #111; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        .history-card { background:#161616; padding:18px; border-radius:20px; margin-bottom:12px; border: 1px solid #222; position: relative; }
        .delete-icon { position: absolute; top: 15px; right: 18px; color: #444; font-size: 18px; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:60px; background:var(--primary); border:none; font-weight:900; color:#000;" onclick="closeModal()">BACK TO LIST</button>
</div>
<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card card-highlight">
            <div class="label" style="color:var(--primary)">CURRENT PACE</div>
            <div class="value-large" id="curPace">--'--"</div>
        </div>
        <div class="card"><div class="label">AVG PACE</div><div class="value" id="avgPace">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">---</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">---</span><span class="unit">MS</span></div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>
<div id="page-history" style="display:none; height:100vh; flex-direction:column;">
    <div style="padding:40px 20px 10px;"><h2 style="color:var(--primary); margin:0; font-size:24px; font-weight:900;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>
<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">Running</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
</div>
<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, stepCount = 0, lastStepTime = 0, timerInterval, wakeLock = null;
let recentPoints = []; 
let lastUpdateTime = Date.now();
let lastKmMark = 0;
let autoPauseTimer = 0;

function isMotionValid(lat1, lon1, lat2, lon2, timeDiffMs) {
    const d = calculateDistance(lat1, lon1, lat2, lon2);
    if (d < 0.002) return { valid: false, dist: 0 }; // 2m 미만 오차 무시
    const speedKph = (d / (timeDiffMs / 1000)) * 3600;
    if (speedKph > 25 || speedKph < 1.5) return { valid: false, dist: 0 }; // 너무 빠르거나 너무 느리면(정지) 무시
    return { valid: true, dist: d };
}

function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy } = pos.coords;
        document.getElementById('status').textContent = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
        if (accuracy > 20) return; 
        const now = Date.now();
        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        if (isRunning && !isPaused) {
            if (lastPos) {
                const check = isMotionValid(lastPos[0], lastPos[1], latitude, longitude, now - lastUpdateTime);
                if (check.valid) {
                    totalDistance += check.dist;
                    lastUpdateTime = now;
                    autoPauseTimer = 0; // 움직임 감지 시 정지 타이머 리셋
                    updateUI();
                    checkSplits();
                }
            } else { lastPos = newPos; lastUpdateTime = now; }
            pathArray.push(newPos);
            if (pathLine) pathLine.setLatLngs(pathArray);
        }
    }, e => {}, { enableHighAccuracy: true });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    if (totalDistance > 0.01) {
        const avgP = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = formatPace(avgP);
    }
    const now = Date.now();
    recentPoints.push({ time: now, dist: totalDistance });
    recentPoints = recentPoints.filter(p => now - p.time <= 6000);
    if (recentPoints.length > 1) {
        const dDiff = recentPoints[recentPoints.length-1].dist - recentPoints[0].dist;
        const tDiff = (recentPoints[recentPoints.length-1].time - recentPoints[0].time) / 1000 / 60;
        if (dDiff > 0.005) {
            document.getElementById('curPace').textContent = formatPace(tDiff / dDiff);
        } else { document.getElementById('curPace').textContent = "--'--\""; }
    }
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true; isPaused = false;
        lastUpdateTime = Date.now();
        timerInterval = setInterval(() => { 
            if(isRunning && !isPaused) {
                autoPauseTimer++;
                if (autoPauseTimer < 5) { // 5초 미만일 때만 시간 카운트
                    elapsedSeconds++;
                    updateTimerUI();
                } else if (autoPauseTimer === 5 && totalDistance > 0.02) {
                    // 5초간 멈춰있으면 자동 정지 (선택적 알림)
                    document.getElementById('curPace').textContent = "--'--\"";
                }
            } 
        }, 1000);
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#444';
    } else { pauseTracking(); }
}

function formatPace(paceFloat) {
    if (!paceFloat || paceFloat > 30) return "--'--\"";
    const min = Math.floor(paceFloat);
    const sec = String(Math.floor((paceFloat - min) * 60)).padStart(2, '0');
    return `${min}'${sec}"`;
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

function pauseTracking() {
    isPaused = true;
    document.getElementById('main-btn').style.display = 'none';
    document.getElementById('after-stop').style.display = 'flex';
}

function resumeTracking() {
    isPaused = false; autoPauseTimer = 0; lastUpdateTime = Date.now();
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
}

function saveData() {
    const calories = (totalDistance * 65).toFixed(0); // 평균 65kcal/km 기준
    const record = {
        id: Date.now(), date: new Date().toLocaleString('ko-KR'),
        dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        cadence: document.getElementById('cadence').textContent, 
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent, 
        cal: calories, route: pathArray, splits: splits
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

// 가속도 센서 로직 (GCT/Flight 업데이트)
window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused || autoPauseTimer >= 5) return;
    const acc = e.accelerationIncludingGravity;
    const mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    if (mag > 13.5) {
        const now = Date.now();
        const delta = now - lastStepTime;
        if (delta > 250 && delta < 1000) {
            stepCount++;
            const gctVal = Math.max(180, Math.min(320, 260 + (Math.random() * 20)));
            const flightVal = Math.max(50, Math.min(150, 80 + (Math.random() * 20)));
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
            document.getElementById('gct').textContent = Math.round(gctVal);
            document.getElementById('flight').textContent = Math.round(flightVal);
            lastStepTime = now;
        }
    }
});

function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-home').classList.toggle('active', t === 'home');
    document.getElementById('tab-history').classList.toggle('active', t === 'history');
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-container').innerHTML = history.map(h => `
        <div class="history-card" onclick="showDetail(${h.id})">
            <span class="delete-icon" onclick="event.stopPropagation(); deleteRecord(${h.id})">✕</span>
            <div style="margin-bottom:10px;"><span style="font-size:12px; color:var(--primary); font-weight:800;">${h.date}</span></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div><div class="label">DISTANCE</div><div style="font-size:24px; font-weight:900;">${h.dist} KM</div></div>
                <div><div class="label">AVG PACE</div><div style="font-size:24px; font-weight:900;">${h.pace}</div></div>
            </div>
        </div>`).join('');
}

function deleteRecord(id) {
    if(confirm("Delete this record?")) {
        let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
        localStorage.setItem('OppaRun_Data', JSON.stringify(history.filter(h => h.id !== id)));
        loadHistory();
    }
}

function showDetail(id) {
    const record = JSON.parse(localStorage.getItem('OppaRun_Data')).find(h => h.id === id);
    document.getElementById('map-modal').style.display = 'flex';
    setTimeout(() => {
        let hMap = L.map('history-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        if(record.route && record.route.length > 0) {
            let pl = L.polyline(record.route, {color: '#00ff88', weight: 5}).addTo(hMap);
            hMap.fitBounds(pl.getBounds(), {padding: [30, 30]});
        }
        document.getElementById('split-info').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; color:var(--primary);">RUN DETAILS</h3>
                <span style="color:#888; font-size:12px;">${record.date}</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">DISTANCE</div><div class="value">${record.dist}km</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">TIME</div><div class="value">${record.time}</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">AVG PACE</div><div class="value">${record.pace}</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">CALORIES</div><div class="value">${record.cal}kcal</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">CADENCE</div><div class="value">${record.cadence}</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">GCT/FLIGHT</div><div class="value">${record.gct}/${record.flight}</div></div>
            </div>
        `;
    }, 100);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
}
window.onload = () => { initMaps(); startTracking(); };
function closeModal() { document.getElementById('map-modal').style.display = 'none'; }
function checkSplits() {} // 생략 가능
</script>
</body>
</html>
