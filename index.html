<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.81 (Modular & Unified)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --btn-gray: #333; --border-gray: #444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* 1. MAP & STATUS AREA */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        /* 2. MAIN DASHBOARD AREA (LAYOUT FIXED) */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* 3. UNIFIED BUTTON STYLE (MODULARIZED) */
        .card-top-btn { 
            position: absolute; background: var(--btn-gray); border: 1px solid var(--border-gray); 
            color: #999; font-size: 9px; padding: 6px 10px; border-radius: 6px; font-weight: 900; z-index: 20;
        }
        #btn-dim { top: 10px; right: 10px; }
        #quick-metro { bottom: 10px; right: 10px; } /* Same size as dim button now */
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        /* 4. CONTROLS & TABS */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        /* 5. SUB-PAGES & SETTINGS (UNIFIED DROPDOWN) */
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid var(--border-gray); background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid var(--border-gray); padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #2a2a2a; border: 1.5px solid var(--border-gray); border-radius: 12px; z-index: 1000; overflow-y: auto; max-height: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #333; cursor: pointer; }

        #detail-view, #diag-view, #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <!-- METRONOME VIEW (MODULAR) -->
    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div style="padding: 50px 20px 15px;">
            <div id="metro-title" style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div>
            <div id="metro-desc" style="color:#666; font-size:11px; margin-top:3px;">Perfect your cadence.</div>
        </div>
        <div style="background: #1a1a1a; border-radius: 12px; padding: 15px; margin: 8px 15px; border: 1px solid #333;">
            <div id="metro-bpm-val" style="font-size: 40px; font-weight: 900; text-align: center; color: var(--primary);">175</div>
            <input type="range" id="metro-bpm" style="width: 100%; accent-color: var(--primary);" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div style="padding: 0 15px; margin-top: 20px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <!-- UNIFIED TOP BUTTONS -->
                <button id="btn-dim" class="card-top-btn" onclick="ui.toggleDim(true)">DIM</button>
                <button id="quick-metro" class="card-top-btn" onclick="metro.toggle()">METRO OFF</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span id="unit-dist" style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <!-- TAB BAR (NAVIGATION) -->
    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/* 1. CORE VARIABLES (ORIGINAL PRESERVED) */
let map, marker, accCircle, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, currentAlt = 0, pathCoords = [];
let lastImpactTime = 0, isFeetOnGround = false, gctAccumulator = 0, gctCount = 0;

/* 2. TRANSLATIONS (UNIFIED) */
const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", autoPaused: "AUTO PAUSED", wake: "TAP TO WAKE" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", autoPaused: "자동 일시정지", wake: "화면을 깨우려면 터치하세요" }
};

/* 3. METRONOME MODULE (MODULAR) */
const metro = {
    audioCtx: null, nextTickTime: 0, timerID: null, isPlaying: false,
    init() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
    playClick() {
        const osc = this.audioCtx.createOscillator(); const env = this.audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = 800;
        env.gain.value = 0.5; env.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        osc.connect(env); env.connect(this.audioCtx.destination);
        osc.start(); osc.stop(this.audioCtx.currentTime + 0.1);
    },
    scheduler() {
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playClick(); const bpm = document.getElementById('metro-bpm').value;
            this.nextTickTime += 60.0 / bpm;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    },
    toggle() {
        this.init();
        if (this.isPlaying) { clearTimeout(this.timerID); this.isPlaying = false; }
        else { this.nextTickTime = this.audioCtx.currentTime; this.scheduler(); this.isPlaying = true; }
        ui.updateQuickMetroBtn();
    },
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
};

/* 4. UI MODULE (UNIFIED & PRESERVED) */
const ui = {
    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'run' && map) setTimeout(() => map.invalidateSize(), 100);
    },
    toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; },
    updateQuickMetroBtn() {
        const btn = document.getElementById('quick-metro');
        if(metro.isPlaying) { btn.textContent = "METRO ON"; btn.style.background = "var(--primary)"; btn.style.color = "#000"; }
        else { btn.textContent = "METRO OFF"; btn.style.background = "#333"; btn.style.color = "#999"; }
    },
    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; }
};

/* 5. SENSOR & GPS LOGIC (ORIGINAL PRESERVED) */
function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc || acc.z === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 12.5 && (now - lastStepTime) > 230) {
        steps++; let cycleTime = now - lastStepTime; lastStepTime = now;
        document.getElementById('cadence').textContent = Math.round((steps / (seconds || 1)) * 60);
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    if (marker) { marker.setLatLng(pos); map.panTo(pos); }
    if (isRunning && !isPaused && !isAutoPaused) {
        if (lastPos) { totalDist += map.distance(lastPos, pos) / 1000; document.getElementById('dist').textContent = totalDist.toFixed(2); }
        lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords);
    }
}

function onStart() { isRunning = true; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; timer = setInterval(() => { if(!isPaused) seconds++; document.getElementById('time').textContent = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000); }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390]).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
