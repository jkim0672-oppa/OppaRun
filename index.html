<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.12 (Full-Screen)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: -apple-system, system-ui; 
            height: 100vh; 
            height: 100svh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .auto-pause-label { 
            position: absolute; 
            top: 5px; 
            left: 10px; 
            font-size: 10px; 
            color: var(--danger); 
            font-weight: 900; 
            background: rgba(255,68,68,0.1); 
            padding: 2px 6px; 
            border-radius: 4px; 
            display: none; 
            z-index: 5;
        }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-header { margin-bottom: 4px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: nowrap; }
        .h-dist, .h-time { font-size: 18px; font-weight: 700; color: #ffffff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #888; font-weight: 800; text-transform: uppercase; }
        .h-det-val { font-size: 14px; font-weight: 600; color: #ddd; }
        
        .text-route-link {
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            vertical-align: middle;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0;
        }

        .info-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin: 10px 12px; border: 1px solid #222; }
        .custom-select { position: relative; width: 100%; user-select: none; }
        .select-trigger { background: #1a1a1a; padding: 14px 18px; border-radius: 10px; border: 1.5px solid #333; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .select-trigger.open { border-color: var(--primary); border-radius: 10px 10px 0 0; }
        .selected-text { font-size: 15px; font-weight: 700; color: var(--primary); }
        .arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #666; transition: 0.3s; }
        .select-trigger.open .arrow { transform: rotate(180deg); border-top-color: var(--primary); }
        .select-options { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1.5px solid var(--primary); border-top: none; border-radius: 0 0 10px 10px; max-height: 0; overflow-y: auto; opacity: 0; transition: all 0.3s ease-out; z-index: 100; }
        .select-options.show { max-height: 200px; opacity: 1; }
        .option-item { padding: 14px 18px; border-bottom: 1px solid #222; font-size: 14px; font-weight: 600; color: #ccc; transition: 0.2s; }
        .option-item:last-child { border-bottom: none; }
        .option-item:active { background: #222; color: var(--primary); }
        .option-item.active { color: var(--primary); background: rgba(0,255,136,0.05); }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
        
        .btn-dim { 
            position: absolute; top: 12px; right: 12px; width: 52px; height: 52px; 
            background: #1a1a1a; color: #777; border: 1.5px solid #333; border-radius: 12px; 
            font-size: 10px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .btn-dim::before { content: '●'; color: #444; font-size: 8px; margin-bottom: 2px; }
        
        #dimmer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.93); z-index: 99999; display: none;
            justify-content: center; align-items: center; color: #333; font-weight: 900; font-size: 14px;
        }
    </style>
</head>
<body> 
    <div id="dimmer-overlay">TAP TO WAKE SCREEN</div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div id="lbl-curPace" class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="btn-dim" class="btn-dim" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div id="lbl-dist" class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div id="lbl-time" class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div id="lbl-avgPace" class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div id="lbl-cadence" class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="info-card">
                <h2 style="color:var(--primary); margin:0 0 10px 0; font-size: 20px;">OppaRun Pro</h2>
                <p id="info-desc" style="font-size:13px; color:#aaa; margin: 0 0 15px 0;">Custom Running Dynamics for Oppa</p>
                <div style="background:#1a1a1a; padding:12px; border-radius:10px;">
                    <p id="info-tips-title" style="margin:0 0 8px 0; font-size:12px; font-weight:800; color:var(--warning);">Running Tips</p>
                    <small id="tip-gct" style="display:block; margin-bottom:5px; font-size:11px;">• <b>GCT:</b> Foot on ground</small>
                    <small id="tip-flight" style="display:block; margin-bottom:5px; font-size:11px;">• <b>Flight:</b> Ratio in air</small>
                    <small id="tip-cadence" style="display:block; font-size:11px;">• <b>Cadence:</b> 170-185 SPM</small>
                </div>
            </div>
        </div>
        <div id="sub-page-settings" class="sub-page">
            <div class="info-card">
                <h3 id="lbl-lang-setting" style="color:var(--primary); margin:0 0 15px 0; font-size: 16px;">Language Selection</h3>
                <div class="custom-select">
                    <div id="select-trigger" class="select-trigger" onclick="toggleDropdown()">
                        <span id="current-lang-text" class="selected-text">English</span>
                        <div class="arrow"></div>
                    </div>
                    <div id="select-options" class="select-options"></div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-form" class="tab-btn" onclick="showTab('form')">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;
let pathCoords = [];

const i18n = {
    ko: { name: "한국어 (Korean)", run: "러닝", form: "FORM", history: "기록", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", curPace: "페이스", dist: "거리", time: "시간", avgPace: "평균", cadence: "케이던스", list: "내역", total: "통계", info: "정보", settings: "설정", infoDesc: "오빠 전용 러닝 앱", tipsTitle: "러닝 팁", tipGct: "• <b>GCT:</b> 지면 접촉 시간", tipFlight: "• <b>Flight:</b> 공중 체류 비율", tipCadence: "• <b>Cadence:</b> 170-185 SPM", langLabel: "언어 설정", autoPause: "자동 정지", route: "경로지도", diag: "진단" },
    en: { name: "English", run: "RUN", form: "FORM", history: "HISTORY", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", curPace: "PACE", dist: "DIST", time: "TIME", avgPace: "AVG", cadence: "CADENCE", list: "LIST", total: "TOTAL", info: "INFO", settings: "SETTINGS", infoDesc: "Custom Dynamics for Oppa", tipsTitle: "Running Tips", tipGct: "• <b>GCT:</b> Foot on ground", tipFlight: "• <b>Flight:</b> Ratio in air", tipCadence: "• <b>Cadence:</b> 170-185 SPM", langLabel: "Language Selection", autoPause: "AUTO PAUSED", route: "ROUTE", diag: "DIAG" },
    jp: { name: "日本語 (Japanese)", run: "ラン", form: "FORM", history: "履歴", start: "開始", stop: "停止", resume: "재개", finish: "終了", curPace: "ペース", dist: "距離", time: "時間", avgPace: "平均", cadence: "ケイ데ンス", list: "リスト", total: "統計", info: "情報", settings: "設定", infoDesc: "ランニングアプリ", tipsTitle: "ヒント", tipGct: "• <b>GCT:</b> 接地時間", tipFlight: "• <b>Flight:</b> 空중滞在", tipCadence: "• <b>Cadence:</b> 170-185 SPM", langLabel: "言語選択", autoPause: "オートポーズ", route: "ルート", diag: "診断" }
};

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

function toggleDropdown() {
    const trigger = document.getElementById('select-trigger');
    const options = document.getElementById('select-options');
    trigger.classList.toggle('open');
    options.classList.toggle('show');
}

function renderLangOptions() {
    const container = document.getElementById('select-options');
    const currentLang = localStorage.getItem('oppaRunLang') || 'en';
    document.getElementById('current-lang-text').innerText = i18n[currentLang].name;
    container.innerHTML = Object.keys(i18n).map(key => `
        <div class="option-item ${key === currentLang ? 'active' : ''}" onclick="selectLanguage('${key}')">
            ${i18n[key].name}
        </div>
    `).join('');
}

function selectLanguage(lang) { setLanguage(lang); toggleDropdown(); }

function setLanguage(lang) {
    const t = i18n[lang] || i18n['en'];
    document.getElementById('tab-run').innerText = t.run;
    document.getElementById('tab-form').innerText = t.form;
    document.getElementById('tab-history').innerText = t.history;
    document.getElementById('sub-tab-list').innerText = t.list;
    document.getElementById('sub-tab-total').innerText = t.total;
    document.getElementById('sub-tab-info').innerText = t.info;
    document.getElementById('sub-tab-settings').innerText = t.settings;
    document.getElementById('lbl-curPace').innerText = t.curPace;
    document.getElementById('lbl-dist').innerText = t.dist;
    document.getElementById('lbl-time').innerText = t.time;
    document.getElementById('lbl-avgPace').innerText = t.avgPace;
    document.getElementById('lbl-cadence').innerText = t.cadence;
    document.getElementById('pause-status').innerText = t.autoPause;
    document.getElementById('btn-start').innerText = t.start;
    document.getElementById('btn-stop').innerText = t.stop;
    document.getElementById('btn-resume').innerText = t.resume;
    document.getElementById('btn-finish').innerText = t.finish;
    document.getElementById('info-desc').innerText = t.infoDesc;
    document.getElementById('info-tips-title').innerText = t.tipsTitle;
    document.getElementById('tip-gct').innerHTML = t.tipGct;
    document.getElementById('tip-flight').innerHTML = t.tipFlight;
    document.getElementById('tip-cadence').innerHTML = t.tipCadence;
    document.getElementById('lbl-lang-setting').innerText = t.langLabel;
    localStorage.setItem('oppaRunLang', lang);
    renderLangOptions();
}

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, 
        (err) => { document.getElementById('status').textContent = "GPS ERROR: " + err.message; }, 
        {enableHighAccuracy: true});
    }
    window.addEventListener('devicemotion', handleMotion);
    const savedLang = localStorage.getItem('oppaRunLang') || 'en';
    setLanguage(savedLang);
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        updateDynamicsColors(gct, flt);
    }
}

function updateDynamicsColors(gct, flt) {
    const gDisplay = document.getElementById('gct'), fDisplay = document.getElementById('flight');
    gDisplay.textContent = gct || "--"; fDisplay.textContent = flt || "--";
    let color = (currentSpeedKmh > 4.5) ? (gct >= 400 ? "#ff4444" : (gct >= 320 ? "#ffcc00" : "#00ff88")) : "#ffcc00";
    gDisplay.style.color = color; fDisplay.style.color = (flt > 15) ? "#00ff88" : "#ffcc00";
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    let stateText = isRunning ? (isPaused || isAutoPaused ? "PAUSED" : "ACTIVE") : "READY";
    document.getElementById('status').textContent = `${stateText} (±${p.coords.accuracy.toFixed(1)}m)`;
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { 
            isAutoPaused = true; 
            document.getElementById('pause-status').style.display = 'block';
            if ("vibrate" in navigator) navigator.vibrate(200);
        } else if (currentSpeedKmh >= 0.8 && isAutoPaused) { 
            isAutoPaused = false; 
            document.getElementById('pause-status').style.display = 'none';
            if ("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
        }
        if (!isAutoPaused && p.coords.accuracy < 45) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
} 

function onStart() {
    isRunning = true; isPaused = false; isAutoPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; gctSum = 0; flightSum = 0; dataCount = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 

// 수정한 onFinish: undefined 방지용 
function onFinish() {
    const curTime = document.getElementById('time').textContent;
    const curDist = document.getElementById('dist').textContent;
    const curAvgPace = document.getElementById('avgPace').textContent;
    const curCadence = document.getElementById('cadence').textContent;
    const curGct = document.getElementById('gct').textContent;
    const curFlight = document.getElementById('flight').textContent;

    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleDateString('en-US', { weekday: 'short' });

    const record = { 
        id: Date.now(), 
        date: dateStr, 
        dist: curDist, 
        time: curTime, 
        pace: (curAvgPace === "--'--\"" ? "0'00\"" : curAvgPace), 
        cadence: (curCadence || "0"), 
        kcal: Math.round(parseFloat(curDist) * 65) || 0, 
        gctflt: `${curGct || "--"}/${curFlight || "--"}%` 
    };

    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); 
    h.unshift(record); 
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    
    // 강제 새로고침으로 데이터 꼬임 방지
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if(document.getElementById('tab-' + tab)) document.getElementById('tab-' + tab).classList.add('active');
    
    if(tab === 'run') {
        setTimeout(() => map.invalidateSize(), 100);
    } else if(tab === 'history') {
        showSubTab('list'); // 히스토리 탭 진입 시 리스트 바로 갱신
    }
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if (sub === 'list') updateHistoryStats();
    if (sub === 'total') updateTotalStats();
}

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const lang = localStorage.getItem('oppaRunLang') || 'en';
    const routeLabel = i18n[lang].route || "ROUTE";
    const diagLabel = i18n[lang].diag || "DIAG";
    
    const listContainer = document.getElementById('history-list');
    if (h.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#555; font-weight:900;">NO DATA</div>`;
        return;
    }

    listContainer.innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <span class="h-dist">${r.dist}KM</span>
                <span class="h-time">${r.time}</span>
                <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
                    <span class="text-route-link" onclick="viewRecordMap(${r.id})">${routeLabel}</span>
                    <span style="color:#222; font-size:10px;">|</span>
                    <span class="text-route-link" onclick="viewDiag(${r.id})">${diagLabel}</span>
                </div>
            </div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${r.kcal}</span></div>
                <div class="h-det-box"><span class="h-det-label">GCT/FLT</span><span class="h-det-val" style="font-size:11px;">${r.gctflt}</span></div>
            </div>
        </div>`).join('');
}

function viewRecordMap(id) { alert("ROUTE ID: " + id + " - 경로 로딩 준비중!"); }
function viewDiag(id) { alert("DIAGNOSIS ID: " + id + " - 러닝 분석 준비중!"); }

function updateTotalStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tDist = 0, tKcal = 0, tSec = 0;
    h.forEach(r => { 
        tDist += parseFloat(r.dist || 0); 
        tKcal += parseInt(r.kcal || 0); 
        let p = (r.time || "0:0").split(':'); 
        tSec += parseInt(p[0])*60 + parseInt(p[1]); 
    });
    document.getElementById('total-stats').innerHTML = `<div class="history-item" style="border:2px solid var(--primary);"><div class="h-date">TOTAL STATISTICS</div><div class="h-main"><span class="h-dist" style="font-size:28px; color:var(--primary);">${tDist.toFixed(2)} KM</span></div><div class="h-details" style="grid-template-columns:repeat(3,1fr);"><div class="h-det-box"><span class="h-det-label">TIME</span><span class="h-det-val">${Math.floor(tSec/3600)}h ${Math.floor((tSec%3600)/60)}m</span></div><div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${tKcal}</span></div><div class="h-det-box"><span class="h-det-label">RUNS</span><span class="h-det-val">${h.length}</span></div></div></div>`;
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
