<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.10 (Restore & Split)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* 메인 상단 지도 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 러닝 화면 대시보드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* 버튼 영역 */
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        
        /* 기록 리스트 영역 */
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .h-dist { font-size: 18px; font-weight: 700; color: #ffffff; }
        .text-route-link { color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        /* 🔥 오빠가 요청한 반반 상세 보기 화면 🔥 */
        #record-detail-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none; flex-direction: column;
        }
        #detail-map-box { height: 50%; width: 100%; border-bottom: 2px solid var(--primary); }
        #detail-info-box { height: 50%; padding: 20px; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 10001; background: rgba(0,0,0,0.8); color: #fff; border: 1.5px solid var(--primary); padding: 8px 15px; border-radius: 20px; font-weight: 900; font-size: 12px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body>
    <div id="record-detail-view">
        <button class="close-detail" onclick="closeDetail()">BACK</button>
        <div id="detail-map-box"></div>
        <div id="detail-info-box"></div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];
let detailMap, detailPolyline;

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            const accuracy = p.coords.accuracy;
            document.getElementById('status').textContent = isRunning ? `RUNNING (±${accuracy.toFixed(1)}m)` : `READY (±${accuracy.toFixed(1)}m)`;
            marker.setLatLng(pos);
            if (isRunning && !isPaused && accuracy < 50) {
                if (lastPos) {
                    let d = (function(p1,p2){
                        const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                        const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                    })(lastPos, pos);
                    if (d > 0.002) { 
                        totalDist += d; 
                        document.getElementById('dist').textContent = totalDist.toFixed(2);
                        pathCoords.push(pos);
                        polyline.setLatLngs(pathCoords);
                        lastPos = pos;
                    }
                } else { lastPos = pos; }
            } else if (!isRunning) { map.panTo(pos); }
        }, err => { document.getElementById('status').textContent = "GPS ERROR: " + err.message; }, {enableHighAccuracy: true});
    }
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = formatTime(seconds); } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }

function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + new Date().toLocaleDateString('en-US', { weekday: 'short' }),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        cadence: document.getElementById('cadence').textContent,
        gctflt: document.getElementById('gct').textContent + "ms / " + document.getElementById('flight').textContent + "%",
        path: [...pathCoords] 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

// 🔥 반반 상세 보기 기능 로직
function viewRecordDetail(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = h.find(item => item.id === id);
    if(!r) return;

    document.getElementById('record-detail-view').style.display = 'flex';
    document.getElementById('detail-info-box').innerHTML = `
        <h2 style="color:var(--primary); margin:0 0 15px 0;">RUN SUMMARY</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div><div class="label">DISTANCE</div><div class="value">${r.dist} KM</div></div>
            <div><div class="label">TIME</div><div class="value">${r.time}</div></div>
            <div><div class="label">AVG PACE</div><div class="value">${r.pace}</div></div>
            <div><div class="label">CADENCE</div><div class="value">${r.cadence}</div></div>
            <div style="grid-column: span 2;"><div class="label">GCT / FLIGHT</div><div class="value" style="color:var(--primary)">${r.gctflt}</div></div>
        </div>
    `;

    if(!detailMap) {
        detailMap = L.map('detail-map-box', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        detailPolyline = L.polyline([], {color: '#00ff88', weight: 6}).addTo(detailMap);
    }
    
    if(r.path && r.path.length > 0) {
        detailPolyline.setLatLngs(r.path);
        detailMap.fitBounds(detailPolyline.getBounds(), {padding: [30, 30]});
    } else {
        detailMap.setView([37.5665, 126.9780], 15);
    }
    setTimeout(() => detailMap.invalidateSize(), 200);
}

function closeDetail() { document.getElementById('record-detail-view').style.display = 'none'; }

function showTab(t) {
    document.getElementById('run-view').style.display = (t==='run'?'flex':'none');
    document.getElementById('map-area').style.display = (t==='run'?'block':'none');
    document.getElementById('history-view').style.display = (t==='history'?'flex':'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-'+t));
    if(t==='history') updateHistoryList();
    if(t==='run') setTimeout(()=>map.invalidateSize(), 200);
}

function showSubTab(s) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.id === 'sub-tab-'+s));
    document.getElementById('sub-page-list').style.display = (s==='list'?'flex':'none');
    document.getElementById('sub-page-total').style.display = (s==='total'?'flex':'none');
}

function updateHistoryList() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <span class="h-dist">${r.dist}KM</span>
                <span style="font-size:14px; color:#666;">${r.time}</span>
                <span class="text-route-link" style="margin-left:auto;" onclick="viewRecordDetail(${r.id})">경로지도 ></span>
            </div>
        </div>`).join('');
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
window.onload = initMap;
</script>
</body>
</html>
