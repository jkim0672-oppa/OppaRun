<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OppaRun Pro v31 (Stable Architecture)</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
    --primary:#00ff88;
    --bg:#000;
    --card:#121212;
    --text:#fff;
    --dim:#888;
    --danger:#ff4444;
    --warning:#ffcc00;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,system-ui;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* MAP */
#map-area{flex-shrink:0;}
#map-container{height:15vh;min-height:110px;border-bottom:2px solid #222;}
#map{height:100%;}

/* STATUS */
.status-bar{
    text-align:center;
    font-size:11px;
    padding:8px;
    font-weight:900;
    color:var(--warning);
    background:#0a0a0a;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:8px;
}

.card{
    background:var(--card);
    border-radius:12px;
    border:1px solid #222;
    padding:10px;
    text-align:center;
}

.card-main{
    grid-column:span 3;
    height:85px;
    border:2px solid var(--primary);
    position:relative;
}

.value-large{
    font-size:40px;
    font-weight:900;
    color:var(--primary);
}

.label{font-size:10px;color:var(--dim);font-weight:900;}

/* CONTROLS */
.controls{
    padding:10px;
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    height:55px;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:900;
}

#start{background:var(--primary);}
#stop{background:var(--danger);display:none;}

/* TABS */
.tab-bar{
    position:fixed;
    bottom:0;
    width:100%;
    height:70px;
    display:flex;
    background:#000;
    border-top:1px solid #222;
}

.tab-btn{
    flex:1;
    background:none;
    border:none;
    color:#444;
    font-weight:900;
}

.tab-btn.active{color:var(--primary);}

/* SUB PAGES */
.main-content{flex:1;overflow:hidden;display:none;flex-direction:column;}
.main-content.active{display:flex;}

.sub-page{flex:1;overflow-y:auto;padding-bottom:90px;display:none;}
.sub-page.active{display:block;}

.history-item{
    margin:10px;
    padding:12px;
    background:#111;
    border-radius:12px;
    border:1px solid #333;
}

.h-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.small-btn{
    flex:1;
    font-size:10px;
    padding:6px;
    background:#1a1a1a;
    border:1px solid #333;
    color:var(--primary);
    font-weight:900;
}

/* OVERLAYS */
#detail-view,#diag-view{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:#000;
    display:none;
    flex-direction:column;
    z-index:9999;
}

.close{
    position:absolute;
    top:15px;
    right:15px;
    z-index:10000;
    background:var(--primary);
    border:none;
    padding:10px 15px;
    font-weight:900;
}
</style>
</head>

<body>

<!-- MAP -->
<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div class="status-bar" id="status">INIT</div>
</div>

<!-- DETAIL -->
<div id="detail-view">
    <button class="close" onclick="closeDetail()">CLOSE</button>
    <div id="detail-map" style="height:50%"></div>
    <div id="detail-data"></div>
</div>

<!-- DIAG -->
<div id="diag-view">
    <button class="close" onclick="closeDiag()">CLOSE</button>
    <div id="diag-content"></div>
</div>

<!-- RUN VIEW -->
<div id="run-view" class="main-content active">

    <div class="dashboard">

        <div class="card card-main">
            <div class="label">PACE</div>
            <div id="pace" class="value-large">--'--"</div>
        </div>

        <div class="card"><div class="label">DIST</div><div id="dist">0.00</div></div>
        <div class="card"><div class="label">TIME</div><div id="time">00:00</div></div>
        <div class="card"><div class="label">AVG</div><div id="avg">--</div></div>
        <div class="card"><div class="label">CAD</div><div id="cad">0</div></div>
        <div class="card"><div class="label">GCT</div><div id="gct">--</div></div>
        <div class="card"><div class="label">FLIGHT</div><div id="flt">--</div></div>

    </div>

    <div class="controls">
        <button id="start" class="btn" onclick="run.start()">START</button>
        <button id="stop" class="btn" onclick="run.stop()">STOP</button>
    </div>

</div>

<!-- HISTORY -->
<div id="history-view" class="main-content">

    <div id="history-list" class="sub-page active"></div>

</div>

<!-- TAB -->
<div class="tab-bar">
    <button class="tab-btn active" onclick="ui.tab('run')">RUN</button>
    <button class="tab-btn" onclick="ui.tab('history')">HISTORY</button>
</div>

<script>

/* ================= STATE ================= */

const state = {
    running:false,
    time:0,
    dist:0,
    speed:0,
    steps:0,
    stepT:[],
    lastPos:null,
    smoothLat:null,
    smoothLng:null,
    path:[],
    autoPause:false,
    lowSpeed:null
};

/* ================= GPS ================= */

const gps = {

    map:null,
    marker:null,
    line:null,

    init(){

        this.map = L.map('map',{zoomControl:false})
            .setView([33.77,-117.91],16);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ).addTo(this.map);

        this.marker = L.marker([0,0]).addTo(this.map);

        this.line = L.polyline([],{
            color:'#00ff88'
        }).addTo(this.map);

        navigator.geolocation.watchPosition(
            gps.update,
            e=>status('GPS ERROR'),
            {enableHighAccuracy:true}
        );
    },

    update(p){

        let lat = p.coords.latitude;
        let lng = p.coords.longitude;

        if(!state.smoothLat){
            state.smoothLat=lat;
            state.smoothLng=lng;
        }else{
            state.smoothLat=state.smoothLat*0.7+lat*0.3;
            state.smoothLng=state.smoothLng*0.7+lng*0.3;
        }

        let pos=[state.smoothLat,state.smoothLng];

        gps.marker.setLatLng(pos);

        state.speed=(p.coords.speed||0)*3.6;

        if(!state.running) return;

        if(p.coords.accuracy>20) return;

        if(state.lastPos){

            let d=util.dist(state.lastPos,pos);

            if(state.speed<2 && d<0.003){
                if(!state.lowSpeed) state.lowSpeed=Date.now();
                if(Date.now()-state.lowSpeed>1500)
                    state.autoPause=true;
            }else{
                state.lowSpeed=null;
                state.autoPause=false;
            }

            if(!state.autoPause && d>0.001 && d<0.05){

                state.dist+=d;
                state.path.push(pos);
                gps.line.setLatLngs(state.path);
            }
        }

        state.lastPos=pos;

        ui.render();
    }
};

/* ================= MOTION ================= */

window.addEventListener("devicemotion",e=>{

    if(!state.running||state.autoPause) return;

    let a=e.accelerationIncludingGravity;
    if(!a) return;

    let f=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);

    let now=Date.now();

    if(f>12){

        state.steps++;

        state.stepT.push(now);

        state.stepT=state.stepT.filter(t=>now-t<10000);
    }
});

/* ================= ANALYSIS ================= */

const analysis={

    cadence(){
        return Math.round(state.stepT.length*6);
    },

    gct(){
        let sp=state.speed;
        return sp>0?Math.floor(450-sp*10):0;
    },

    flight(){
        let sp=state.speed;
        return sp>2?Math.floor(5+sp*2):0;
    }
};

/* ================= UI ================= */

const ui={

    tab(t){

        document.querySelectorAll('.main-content')
            .forEach(v=>v.classList.remove('active'));

        document.getElementById(t+'-view')
            .classList.add('active');

        document.querySelectorAll('.tab-btn')
            .forEach(b=>b.classList.remove('active'));

        event.target.classList.add('active');

        if(t==='history') renderHistory();
    },

    render(){

        pace.textContent=util.pace(state.speed);
        dist.textContent=state.dist.toFixed(2);

        let c=analysis.cadence();

        cad.textContent=c;
        gct.textContent=analysis.gct();
        flt.textContent=analysis.flight();

        avg.textContent=util.pace(
            state.dist/(state.time/3600||1)
        );

        status(state.autoPause?"AUTO PAUSE":"RUN");
    }
};

/* ================= RUN ================= */

const run={

    timer:null,

    start(){

        state.running=true;

        state.time=0;
        state.dist=0;
        state.steps=0;
        state.stepT=[];
        state.path=[];

        start.style.display="none";
        stop.style.display="block";

        this.timer=setInterval(()=>{

            if(!state.autoPause){

                state.time++;

                let m=String(Math.floor(state.time/60)).padStart(2,'0');
                let s=String(state.time%60).padStart(2,'0');

                time.textContent=`${m}:${s}`;
            }

        },1000);
    },

    stop(){

        clearInterval(this.timer);

        state.running=false;

        save();

        start.style.display="block";
        stop.style.display="none";
    }
};

/* ================= STORAGE ================= */

function save(){

    let h=JSON.parse(localStorage.getItem("run")||"[]");

    h.unshift({
        id:Date.now(),
        dist:state.dist.toFixed(2),
        time:time.textContent,
        cad:analysis.cadence()
    });

    localStorage.setItem("run",JSON.stringify(h));

    renderHistory();
}

function renderHistory(){

    let h=JSON.parse(localStorage.getItem("run")||"[]");

    historyList.innerHTML=h.map(r=>`
        <div class="history-item">
            <b>${r.dist} KM</b> ${r.time}
            <div class="h-actions">
                <button class="small-btn" onclick="openDiag(${r.id})">DIAG</button>
                <button class="small-btn" onclick="openDetail(${r.id})">ROUTE</button>
            </div>
        </div>
    `).join("");
}

/* ================= DETAIL ================= */

function openDetail(id){
    detailView.style.display="flex";
}

function closeDetail(){
    detailView.style.display="none";
}

/* ================= DIAG ================= */

function openDiag(id){
    diagView.style.display="flex";

    diagContent.innerHTML=`
        <div style="padding:20px">
            <h2 style="color:#00ff88">RUN ANALYSIS</h2>
            <p>Cadence: ${analysis.cadence()}</p>
        </div>
    `;
}

function closeDiag(){
    diagView.style.display="none";
}

/* ================= UTIL ================= */

const util={

    dist(a,b){

        let R=6371;

        let dLat=(b[0]-a[0])*Math.PI/180;
        let dLon=(b[1]-a[1])*Math.PI/180;

        let x=Math.sin(dLat/2)**2+
        Math.cos(a[0]*Math.PI/180)*
        Math.cos(b[0]*Math.PI/180)*
        Math.sin(dLon/2)**2;

        return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    },

    pace(kmh){

        if(!kmh||kmh<0.5) return "--'--\"";

        let s=3600/kmh;

        return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
    }
};

/* ================= INIT ================= */

function status(t){
    document.getElementById("status").textContent=t;
}

gps.init();

</script>
</body>
</html>
