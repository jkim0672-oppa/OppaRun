<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Backup & Restore</title>
    <style>
        /* [기존 레이아웃 보존] 기존 앱의 스타일시트를 그대로 유지합니다 */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #007aff;
            --success-color: #34c759; /* 불러오기 버튼용 초록색 테마 추가 */
            --danger-color: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            padding: 20px;
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        /* 탭 서브 네비게이션 */
        .sub-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 10px;
        }
        .sub-nav-item {
            color: var(--text-sub);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .sub-nav-item.active {
            color: var(--accent-color);
            position: relative;
        }
        .sub-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--accent-color);
        }
        /* 설정 섹션 스타일 */
        .setting-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .setting-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            margin-bottom: 12px;
        }
        .btn-primary:active {
            background-color: #0062cc;
        }
        /* 새로 추가된 불러오기 버튼 스타일 (레이아웃 조화 고려) */
        .btn-success {
            background-color: transparent;
            color: var(--success-color);
            border: 1px solid var(--success-color);
            margin-bottom: 12px;
        }
        .btn-success:active {
            background-color: rgba(52, 199, 89, 0.1);
        }
        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .btn-danger:active {
            background-color: rgba(255, 59, 48, 0.1);
        }
        .info-text {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-top: 8px;
        }
        /* 하단 탭 바 기본 레이아웃 보존 */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            text-decoration: none;
        }
        .tab-item.active {
            color: var(--accent-color);
        }
        .tab-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>HISTORY</h1>
        </div>

        <div class="sub-nav">
            <span class="sub-nav-item" onclick="location.href='#list'">기록 목록</span>
            <span class="sub-nav-item" onclick="location.href='#stats'">통계</span>
            <span class="sub-nav-item active">SETTINGS</span>
        </div>

        <div class="setting-section">
            <div class="setting-title">데이터 백업 및 관리</div>
            
            <button class="btn btn-primary" onclick="downloadBackupData()">
                💾 BACKUP DATA DOWNLOAD
            </button>
            
            <button class="btn btn-success" onclick="triggerFileInput()">
                📂 BACKUP FILE IMPORT
            </button>
            <input type="file" id="backupFileInput" accept=".json" style="display: none;" onchange="importBackupData(event)">

            <p class="info-text">
                기기에 다운로드 받아둔 JSON 백업 파일을 선택하여 이전 러닝 기록들을 원본 그대로 복구합니다. 불러오기가 완료되면 앱이 새로고침됩니다.
            </p>
            
            <div style="margin-top: 24px; border-top: 1px solid #2c2c2e; padding-top: 20px;">
                <button class="btn btn-danger" onclick="clearAllData()">
                    ⚠️ 전체 기록 삭제
                </button>
                <p class="info-text" style="color: var(--danger-color);">
                    주의: 삭제된 데이터는 복구할 수 없으므로 반드시 미리 백업 파일을 다운로드해 두세요.
                </p>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <a href="#run" class="tab-item">
            <span class="tab-icon">🏃‍♂️</span>
            <span>RUN</span>
        </a>
        <a href="#history" class="tab-item active">
            <span class="tab-icon">📊</span>
            <span>HISTORY</span>
        </a>
    </div>

    <script>
        // ==========================================
        // [기존 로직 보존 및 정밀 고도화 스크립트]
        // ==========================================

        // 1. 데이터 백업 다운로드 기능
        function downloadBackupData() {
            const dataStr = localStorage.getItem('oppa_run_data') || '{}'; 
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;
            
            a.href = url;
            a.download = `oppa_run_backup_${dateStr}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setTimeout(() => {
                alert(
                    "💾 백업 파일 다운로드 완료!\n\n" +
                    "오빠, 백업 파일이 기기의 '다운로드(Download)' 폴더에 안전하게 저장됐어!\n\n" +
                    "💡 혹시 화면에 '연결 프로그램(Open with)' 창이 뜨더라도 당황하지 말고 그냥 창을 닫아줘. 그 다음 스마트폰의 [내 파일] 앱 ➔ [다운로드] 폴더로 들어가면 파일이 예쁘게 들어있을 거야!"
                );
            }, 500);
        }

        // 2. 백업 파일 선택창 트리거 (새로 추가된 로직)
        function triggerFileInput() {
            document.getElementById('backupFileInput').click();
        }

        // 3. 백업 파일 불러오기 실구동 로직 (새로 추가된 로직)
        function importBackupData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rawData = e.target.result;
                    
                    // 안전장치: 가져온 파일이 진짜 올바른 JSON 구조인지 검사
                    JSON.parse(rawData); 
                    
                    // 기존 데이터 유실을 막고 확실하게 교체하기 위해 컨펌 진행
                    if (confirm("오빠, 이 백업 파일로 기존 데이터를 복구할까? 기존에 폰에 남아있던 최신 기록이 있다면 백업 파일 내용으로 완전히 덮어씌워지게 돼!")) {
                        localStorage.setItem('oppa_run_data', rawData);
                        alert("🎉 데이터 복구가 성공적으로 완료되었어! 예전 기록들을 확인해 봐!");
                        location.reload(); // 복구된 데이터를 화면에 즉시 렌더링하기 위해 새로고침
                    }
                } catch (error) {
                    // JSON 파싱 실패 시 에러 예외 처리
                    alert("❌ 파일 복구 실패: 올바르지 않은 백업 파일 형식이거나 데이터가 손상되었습니다. 올바른 .json 파일을 선택해 주세요.");
                }
            };
            
            reader.readAsText(file);
            
            // 동일한 파일을 연속으로 선택해도 이벤트가 정상 작동하도록 인풋값 초기화
            event.target.value = ''; 
        }

        // 4. 전체 데이터 삭제 기능
        function clearAllData() {
            if (confirm("정말로 모든 러닝 기록을 삭제할까? 삭제하면 완전히 날아가니까 신중해야 해!")) {
                localStorage.removeItem('oppa_run_data');
                alert("모든 데이터가 초기화되었습니다.");
                location.reload();
            }
        }
    </script>
</body>
</html>
