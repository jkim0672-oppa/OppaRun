<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.29 (Metronome Added)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { 
            text-align: center; color: var(--warning); font-size: 11px; padding: 8px; 
            background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222;
            letter-spacing: 0.5px;
        }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }

        /* 메트로놈 스타일 (1031.jpg 참고) */
        .metro-container { padding: 10px 20px; margin-bottom: 10px; }
        .metro-box { background: #0f0f0f; border-radius: 20px; padding: 25px; border: 1px solid #222; text-align: center; }
        .bpm-num { font-size: 44px; font-weight: 900; color: var(--primary); }
        .slider { width: 100%; height: 6px; -webkit-appearance: none; background: #333; border-radius: 4px; margin: 20px 0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); border: 3px solid #000; cursor: pointer; }
        .sound-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .s-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: #666; font-size: 11px; font-weight: 900; transition: 0.2s; }
        .s-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 255, 136, 0.05); }
        .btn-m-start { width: 100%; height: 50px; border-radius: 12px; border: none; font-weight: 900; background: #1f1f1f; color: #fff; font-size: 16px; }
        .btn-m-start.active { background: var(--danger); color: #fff; }

        .settings-container { padding: 0 20px 20px; }
        .settings-group { margin-bottom: 20px; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        
        .dropdown-select { background: #1a1a1a; color: #fff; border: 1.5px solid #333; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #1a1a1a; border: 1.5px solid #333; border-radius: 12px; z-index: 1000; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #222; cursor: pointer; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body onclick="unlockAudio()"> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        
        <div id="sub-page-settings" class="sub-page">
            <!-- 메트로놈 섹션 (1031.jpg 디자인) -->
            <div class="metro-container">
                <div class="settings-label">METRONOME</div>
                <div class="metro-box">
                    <div id="bpm-val" class="bpm-num">170</div>
                    <div style="font-size:10px; color:#555; letter-spacing:2px; font-weight:900;">BPM</div>
                    <input type="range" class="slider" min="140" max="200" value="170" oninput="changeBPM(this.value)">
                    <div class="sound-row">
                        <button id="s-beep" class="s-btn active" onclick="setSound('beep')">BEEP</button>
                        <button id="s-wood" class="s-btn" onclick="setSound('wood')">WOOD</button>
                        <button id="s-clap" class="s-btn" onclick="setSound('clap')">CLAP</button>
                    </div>
                    <button id="btn-m-start" class="btn-m-start" onclick="toggleMetro()">START</button>
                </div>
            </div>

            <div class="settings-container">
                <div class="settings-group">
                    <div id="label-select-lang" class="settings-label">SELECT LANGUAGE</div>
                    <div class="dropdown-select" onclick="toggleDropdown()">
                        <span id="current-lang-text">English (US)</span>
                        <span style="font-size:10px; color:var(--primary);">▼</span>
                    </div>
                </div>
                <button id="btn-clear-history" style="background:#1a1a1a; color:var(--danger); border:1.5px solid #333; padding:18px; border-radius:12px; width:100%; font-weight:900; font-size:14px;" onclick="clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
/* [기존 러닝 로직 유지] */
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];

/* [메트로놈 로직 추가] */
let audioCtx, metroTimer, isMetroOn = false, bpm = 170, soundType = 'beep';

function unlockAudio() { 
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    if(audioCtx.state === 'suspended') audioCtx.resume(); 
}

function setSound(type) {
    soundType = type;
    document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('s-' + type).classList.add('active');
}

function playClick() {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    
    if(soundType === 'beep') { osc.frequency.setValueAtTime(1000, audioCtx.currentTime); g.gain.setValueAtTime(0.2, audioCtx.currentTime); }
    else if(soundType === 'wood') { osc.frequency.setValueAtTime(600, audioCtx.currentTime); g.gain.setValueAtTime(0.4, audioCtx.currentTime); }
    else { osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); g.gain.setValueAtTime(0.15, audioCtx.currentTime); }
    
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}

function changeBPM(v) { 
    bpm = v; 
    document.getElementById('bpm-val').textContent = v; 
    if(isMetroOn) { toggleMetro(); toggleMetro(); } 
}

function toggleMetro() {
    const btn = document.getElementById('btn-m-start');
    if(isMetroOn) { clearInterval(metroTimer); isMetroOn = false; btn.textContent = "START"; btn.classList.remove('active'); }
    else { unlockAudio(); metroTimer = setInterval(playClick, 60000/bpm); isMetroOn = true; btn.textContent = "STOP"; btn.classList.add('active'); }
}

/* [기타 UI 및 러닝 함수 - v28.28과 동일하게 유지] */
function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
}

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:12px; height:12px;"></div>', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos);
            if(!isRunning) map.panTo(pos);
        }, null, {enableHighAccuracy: true});
    }
}

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

window.onload = initMap;
</script>
</body>
</html>
