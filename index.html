<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OppaRun - Weekly Stats</title>
    <style>
        /* 기본 스타일 초기화 및 일관성 설정 */
        :root {
            --primary-color: #2563eb;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #888888;
            --accent-color: #ff6b6b;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* 통계 카드 컨테이너 */
        .stats-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        /* 헤더: 타이틀과 그래프 아이콘 */
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .stats-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .graph-btn {
            background: #f0f4ff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .graph-btn:active {
            transform: scale(0.9);
            background: #e0e7ff;
        }

        /* 메인 지표: 주간 총 거리 */
        .main-stat {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        .main-value {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
        }

        .main-value .unit {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 2px;
        }

        /* 세부 지표 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #fafafa;
            border-radius: 12px;
        }

        .stat-icon {
            font-size: 1.3rem;
            margin-right: 12px;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* 하단 업데이트 시간 표시 (선택사항) */
        .update-time {
            text-align: center;
            margin-top: 20px;
            font-size: 0.65rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="stats-card">
        <!-- 상단 헤더 -->
        <div class="stats-header">
            <span class="stats-title">Weekly Report</span>
            <button class="graph-btn" onclick="goToGraphPage()">📊</button>
        </div>

        <!-- 메인 거리 표시 -->
        <div class="main-stat">
            <span class="main-label">This Week's Distance</span>
            <div id="weekly-distance" class="main-value">0.0 <span class="unit">km</span></div>
        </div>

        <!-- 세부 데이터 그리드 -->
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <div class="stat-info">
                    <span class="stat-label">Total Time</span>
                    <span id="weekly-time" class="stat-value">00:00:00</span>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⚡</span>
                <div class="stat-info">
                    <span class="stat-label">Avg Pace</span>
                    <span id="weekly-pace" class="stat-value">0'00"</span>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🔥</span>
                <div class="stat-info">
                    <span class="stat-label">Calories</span>
                    <span id="weekly-calories" class="stat-value">0</span>
                </div>
            </div>
            <div class="stat-item">
                <span class="stat-icon">👟</span>
                <div class="stat-info">
                    <span class="stat-label">Avg Cadence</span>
                    <span id="weekly-cadence" class="stat-value">0</span>
                </div>
            </div>
        </div>

        <div class="update-time">Last updated: May 15, 2026</div>
    </div>

    <script>
        // 1. 그래프 페이지 이동 함수
        function goToGraphPage() {
            // 오빠가 만든 그래프 페이지 경로로 변경해줘
            alert("그래프 상세 페이지로 이동합니다.");
            // window.location.href = 'charts.html'; 
        }

        // 2. 데이터 업데이트 함수 (나중에 DB나 로컬스토리지에서 불러올 때 사용)
        function updateUI(stats) {
            document.getElementById('weekly-distance').innerHTML = `${stats.dist} <span class="unit">km</span>`;
            document.getElementById('weekly-time').innerText = stats.time;
            document.getElementById('weekly-pace').innerText = stats.pace;
            document.getElementById('weekly-calories').innerText = stats.cal;
            document.getElementById('weekly-cadence').innerText = stats.cad;
        }

        // 임시 데이터로 실행 확인
        const mockData = {
            dist: "42.5",
            time: "04:12:30",
            pace: "5'15\"",
            cal: "3,120",
            cad: "178"
        };

        // 초기 로딩 시 데이터 반영
        window.onload = () => {
            updateUI(mockData);
        };
    </script>
</body>
</html>
