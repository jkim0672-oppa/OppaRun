<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v31.0 (Professional Rhythm Engine)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 상단 지도 및 정확도 표시 */
        #map-area { flex-shrink: 0; width: 100%; position: relative; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .accuracy-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; z-index: 1000; border: 1.5px solid var(--primary); color: var(--primary); }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 메인 대시보드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; }

        /* 숨겨진 메트로놈 패널 */
        #metro-panel { background: #1a1a1a; padding: 25px; border-radius: 25px 25px 0 0; position: fixed; bottom: -400px; left: 0; right: 0; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; border-top: 3px solid var(--metro-color); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        #metro-panel.open { bottom: 75px; }
        .metro-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .metro-toggle-btn { position: fixed; bottom: 95px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: #1a1a1a; border: 2px solid var(--metro-color); color: var(--metro-color); font-size: 22px; z-index: 1500; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        
        input[type=range] { flex: 1; accent-color: var(--metro-color); margin: 0 15px; height: 6px; border-radius: 3px; }

        /* 하단 컨트롤 */
        .controls { padding: 10px 15px; margin-bottom: 90px; }
        .btn-act { width: 100%; height: 58px; border-radius: 29px; border: none; font-weight: 900; font-size: 18px; transition: transform 0.1s; }
        .btn-act:active { transform: scale(0.96); }

        /* 탭 바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 3000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 10px var(--accent); }

        /* History View */
        .history-nav { display: flex; gap: 8px; padding: 12px; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 12px; font-size: 12px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #1f1f1f; }
        .setting-box { margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .lang-btn { background: #333; border: none; color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: 800; }
        .lang-btn.active { background: var(--primary); color: #000; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="accuracy-box" class="accuracy-tag">GPS ±--m</div>
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar" data-i18n="ready">READY TO RUN</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)" data-i18n="curPace">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" data-i18n="dist">DIST</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px">KM</small></div></div>
            <div class="card"><div class="label" data-i18n="time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-i18n="avgPace">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-i18n="cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-i18n="gct">GCT</div><div class="value"><span id="gct">--</span><small style="font-size:10px">MS</small></div></div>
            <div class="card"><div class="label" data-i18n="flight">FLIGHT</div><div class="value"><span id="flight">--</span><small style="font-size:10px">%</small></div></div>
        </div>

        <div class="metro-toggle-btn" onclick="toggleMetroPanel()">🔔</div>

        <div id="metro-panel">
            <div class="metro-row">
                <span style="color:var(--metro-color); font-weight:900;">BPM</span>
                <input type="range" id="bpm-range" min="150" max="195" value="175" oninput="updateBPM(this.value)">
                <span id="bpm-val" style="color:var(--metro-color); font-weight:900; width:35px; text-align:right;">175</span>
            </div>
            <div class="metro-row">
                <span style="color:var(--text-dim); font-weight:900;">VOL</span>
                <input type="range" id="vol-range" min="0" max="1" step="0.1" value="0.7" oninput="updateVol(this.value)">
                <span id="vol-val" style="color:var(--text-dim); font-weight:900; width:35px; text-align:right;">70%</span>
            </div>
            <button onclick="toggleMetronome()" id="btn-metro-main" style="width:100%; height:50px; border-radius:15px; border:none; background:var(--metro-color); color:#000; font-weight:900; font-size:16px;">START BEAT</button>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-i18n="start">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-i18n="stop">STOP</button>
            <div id="after-stop" style="display:none; gap:12px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()" data-i18n="resume">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()" data-i18n="finish">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-i18n="tabList">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')" data-i18n="tabTotal">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')" data-i18n="tabInfo">INFO</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="history-item">
                <h3 style="color:var(--primary)">OppaRun Pro v31.0</h3>
                <p style="font-size:12px; color:#aaa;" data-i18n="appDesc">Musician & Runner's Custom Dynamics App</p>
                <div class="setting-box">
                    <div class="label" style="color:var(--primary); margin-bottom:12px;" data-i18n="langSetting">LANGUAGE SETTING</div>
                    <div style="display: flex; gap: 10px;">
                        <button id="lang-ko" class="lang-btn active" onclick="changeLang('ko')">한국어</button>
                        <button id="lang-en" class="lang-btn" onclick="changeLang('en')">English</button>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')" data-i18n="tabRun">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')" data-i18n="tabHistory">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx, metroTimer;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0, steps = 0, lastStepTime = 0;
let currentSpeedKmh = 0, metroGain = null;
let autoPauseCounter = 0;

const i18n = {
    ko: { ready: "달릴 준비 완료", curPace: "현재 페이스", dist: "거리", time: "시간", avgPace: "평균 페이스", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "일시 정지", resume: "다시 시작", finish: "종료 및 저장", tabRun: "러닝", tabHistory: "기록", tabList: "목록", tabTotal: "통계", tabInfo: "정보", langSetting: "언어 설정", appDesc: "뮤지션 오빠를 위한 커스텀 다이나믹스 앱" },
    en: { ready: "READY TO RUN", curPace: "CURRENT PACE", dist: "DIST", time: "TIME", avgPace: "AVG PACE", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", tabRun: "RUN", tabHistory: "HISTORY", tabList: "LIST", tabTotal: "TOTAL", tabInfo: "INFO", langSetting: "LANGUAGE", appDesc: "Musician & Runner's Dynamics App" }
};
let currentLang = 'ko';

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[14,14]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    const savedLang = localStorage.getItem('oppaRunLang') || 'ko';
    changeLang(savedLang);
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = p.coords.accuracy;
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    
    const accBox = document.getElementById('accuracy-box');
    accBox.textContent = `GPS ±${Math.round(acc)}m`;
    accBox.style.borderColor = acc > 25 ? 'var(--danger)' : 'var(--primary)';

    // 자동 멈춤 로직 (속도가 1.2km/h 미만으로 4초간 유지 시)
    if (isRunning && !isPaused && currentSpeedKmh < 1.2) {
        autoPauseCounter++;
        if (autoPauseCounter > 4) onStop();
    } else if (isRunning && isPaused && currentSpeedKmh > 3.5) {
        onResume();
        autoPauseCounter = 0;
    } else if (currentSpeedKmh >= 1.2) {
        autoPauseCounter = 0;
    }

    marker.setLatLng(pos);
    if (isRunning && !isPaused && acc < 40) {
        if (lastPos) {
            let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    } else if (!isRunning) { map.panTo(pos); }
}

function toggleMetroPanel() { document.getElementById('metro-panel').classList.toggle('open'); }
function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }
function updateVol(v) { if(metroGain) metroGain.gain.value = v; document.getElementById('vol-val').textContent = Math.round(v*100) + '%'; }

function toggleMetronome() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        metroGain = audioCtx.createGain();
        metroGain.gain.value = document.getElementById('vol-range').value;
        metroGain.connect(audioCtx.destination);
    }
    isMetroOn = !isMetroOn;
    const btn = document.getElementById('btn-metro-main');
    if (isMetroOn) {
        btn.textContent = "STOP BEAT"; btn.style.background = "var(--danger)"; btn.style.color = "#fff";
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        btn.textContent = "START BEAT"; btn.style.background = "var(--metro-color)"; btn.style.color = "#000";
        clearTimeout(metroTimer);
    }
}

function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.frequency.value = 1200; // 경쾌한 하이톤 틱 사운드
        env.gain.setValueAtTime(0, nextClickTime);
        env.gain.linearRampToValueAtTime(1, nextClickTime + 0.005); // 빠른 어택
        env.gain.exponentialRampToValueAtTime(0.001, nextClickTime + 0.05); // 짧고 깔끔한 감쇄
        osc.connect(env); env.connect(metroGain);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.06);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const now = new Date();
    const record = { date: now.toLocaleDateString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function changeLang(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = i18n[lang][el.getAttribute('data-i18n')]; });
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === 'lang-' + lang));
    localStorage.setItem('oppaRunLang', lang);
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.id === 'sub-tab-' + sub));
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'list') {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><b>${r.date}</b><br>${r.dist}KM | ${r.time} | ${r.pace}</div>`).join('');
    }
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function handleMotion(e) { if (!isRunning || isPaused) return; /* 케이던스 로직 유지 */ }

window.onload = initMap;
</script>
</body>
</html>
