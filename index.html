<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.95</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            height: 100svh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; padding-bottom: 90px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 100px; position: relative; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* Sub Menu */
        .history-sub-menu { display: flex; background: #0a0a0a; border-bottom: 1px solid #222; padding: 5px; gap: 5px; flex-shrink: 0; }
        .sub-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #666; font-size: 11px; font-weight: 900; padding: 12px 0; border-radius: 8px; }
        .sub-btn.active { color: var(--primary); border-color: var(--primary); background: #002211; }

        /* Settings View */
        .setting-box { background: var(--card-bg); margin: 8px 12px; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .setting-row:last-child { margin-bottom: 0; }
        select, input { background: #000; color: var(--primary); border: 1px solid #444; padding: 8px; border-radius: 6px; font-weight: 900; font-size: 13px; }

        .btn-quick-metro { position: absolute; bottom: 8px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; }
        
        /* Fixed Controls Layout */
        .controls { padding: 10px 15px; display: flex; justify-content: center; align-items: center; min-height: 80px; margin-top: auto; z-index: 10; }
        .btn-act { width: 100%; height: 62px; border-radius: 31px; border: none; font-weight: 900; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        .history-item { background: var(--card-bg); border-radius: 15px; padding: 18px; margin: 10px 12px; border: 1px solid #333; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" style="position:absolute; top:8px; left:10px; font-size:10px; color:var(--danger); font-weight:900; display:none;">PAUSED</div>
                <div class="label" data-i18n="pace">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
            </div>
            <div class="card"><div class="label" data-i18n="dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" data-i18n="time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-i18n="avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-i18n="cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-i18n="gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
            <div class="card"><div class="label" data-i18n="flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:12px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-i18n="start">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-i18n="stop">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()" data-i18n="resume">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()" data-i18n="finish">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-sub-menu">
            <button class="sub-btn active" id="sbtn-list" onclick="ui.showSubTab('list')" data-i18n="list">리스트</button>
            <button class="sub-btn" id="sbtn-stats" onclick="ui.showSubTab('stats')" data-i18n="stats">통계</button>
            <button class="sub-btn" id="sbtn-info" onclick="ui.showSubTab('info')" data-i18n="info">인포</button>
            <button class="sub-btn" id="sbtn-setting" onclick="ui.showSubTab('setting')" data-i18n="setting">설정</button>
        </div>

        <div id="sub-list" style="flex:1; overflow-y: auto;"><div id="history-list"></div></div>
        
        <div id="sub-setting" style="display:none; flex:1; overflow-y: auto;">
            <div class="setting-box">
                <div class="setting-row">
                    <span class="label" data-i18n="language">LANGUAGE</span>
                    <select id="set-lang" onchange="i18n.set(this.value)">
                        <option value="ko">KOREAN</option>
                        <option value="en">ENGLISH</option>
                        <option value="zh">CHINESE</option>
                        <option value="ja">JAPANESE</option>
                        <option value="vi">VIETNAMESE</option>
                        <option value="es">SPANISH</option>
                    </select>
                </div>
            </div>
            <div class="setting-box">
                <div class="setting-row">
                    <span class="label" data-i18n="height">HEIGHT</span>
                    <div style="display:flex; gap:5px;"><input type="number" value="172" style="width:70px;"><select><option>cm</option><option>inch</option></select></div>
                </div>
                <div class="setting-row">
                    <span class="label" data-i18n="weight">WEIGHT</span>
                    <div style="display:flex; gap:5px;"><input type="number" value="60" style="width:70px;"><select><option>kg</option><option>lb</option></select></div>
                </div>
            </div>
            <div class="setting-box">
                <div class="label" style="margin-bottom:15px; color:var(--primary);" data-i18n="metro_set">METRONOME</div>
                <div class="setting-row">
                    <span class="label">VOLUME</span>
                    <input type="range" id="metro-vol" min="0" max="1" step="0.1" value="0.5" onchange="metro.update()">
                </div>
                <div class="setting-row">
                    <span class="label">BPM</span>
                    <input type="number" id="metro-bpm" value="180" style="width:80px;" onchange="metro.update()">
                </div>
            </div>
        </div>
        <div id="sub-stats" style="display:none; padding:20px; text-align:center;">STATS COMING SOON</div>
        <div id="sub-info" style="display:none; padding:20px; text-align:center;">INFO COMING SOON</div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
// --- Multi-Language Logic ---
const i18n = {
    current: 'ko',
    dict: {
        ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "공중체공", start: "러닝 시작", stop: "일시정지", resume: "재개", finish: "종료", list: "리스트", stats: "통계", info: "인포", setting: "설정", language: "언어 설정", height: "키", weight: "몸무게", metro_set: "메트로놈 설정" },
        en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", list: "LIST", stats: "STATS", info: "INFO", setting: "SETTING", language: "LANGUAGE", height: "HEIGHT", weight: "WEIGHT", metro_set: "METRONOME" },
        zh: { pace: "配速", dist: "距离", time: "时间", avg: "平均", cadence: "步频", gct: "触地时间", flight: "腾空比", start: "开始跑步", stop: "暂停", resume: "继续", finish: "完成", list: "列表", stats: "统计", info: "信息", setting: "设置", language: "语言", height: "身高", weight: "体重", metro_set: "节拍器" },
        ja: { pace: "ペース", dist: "距離", time: "時間", avg: "平均", cadence: "ピッチ", gct: "接地時間", flight: "滞空時間", start: "ランニング開始", stop: "一時停止", resume: "再開", finish: "終了", list: "リスト", stats: "統計", info: "情報", setting: "設定", language: "言語", height: "身長", weight: "体重", metro_set: "メトロノーム" },
        vi: { pace: "NHỊP ĐỘ", dist: "KHOẢNG CÁCH", time: "THỜI GIAN", avg: "TRUNG BÌNH", cadence: "NHỊP CHÂN", gct: "TIẾP ĐẤT", flight: "BAY NGƯỜI", start: "BẮT ĐẦU", stop: "DỪNG", resume: "TIẾP TỤC", finish: "KẾT THÚC", list: "DANH SÁCH", stats: "THỐNG KÊ", info: "THÔNG TIN", setting: "CÀI ĐẶT", language: "NGÔN NGỮ", height: "CHIỀU CAO", weight: "CÂN NẶNG", metro_set: "NHỊP ĐIỆU" },
        es: { pace: "RITMO", dist: "DIST", time: "TIEMPO", avg: "PROM", cadence: "CADENCIA", gct: "GCT", flight: "VUELO", start: "EMPEZAR", stop: "PARAR", resume: "REANUDAR", finish: "TERMINAR", list: "LISTA", stats: "STATS", info: "INFO", setting: "AJUSTES", language: "IDIOMA", height: "ALTURA", weight: "PESO", metro_set: "METRÓNOMO" }
    },
    set(lang) {
        this.current = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (this.dict[lang][key]) el.textContent = this.dict[lang][key];
        });
    }
};

// --- Live Metronome Logic ---
const metro = {
    ctx: null, isPlaying: false, nextTick: 0, timer: null,
    toggle() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.isPlaying = !this.isPlaying;
        const btn = document.getElementById('quick-metro');
        if (this.isPlaying) {
            btn.textContent = "METRO ON"; btn.style.background = "var(--primary)"; btn.style.color = "#000";
            this.play();
        } else {
            btn.textContent = "METRO OFF"; btn.style.background = "#333"; btn.style.color = "#999";
            clearTimeout(this.timer);
        }
    },
    play() {
        const bpm = document.getElementById('metro-bpm').value || 180;
        const vol = document.getElementById('metro-vol').value || 0.5;
        const interval = 60 / bpm;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        gain.gain.value = vol; osc.frequency.value = 880;
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        this.timer = setTimeout(() => this.play(), interval * 1000);
    },
    update() { if (this.isPlaying) { clearTimeout(this.timer); this.play(); } }
};

// --- Standard UI & Engine ---
const State = { isRunning: false, isPaused: false, seconds: 0, totalDist: 0, steps: 0, pathCoords: [], lastPos: null };

const ui = {
    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'history') this.showSubTab('list');
        if (tab === 'run' && map) setTimeout(() => map.invalidateSize(), 100);
    },
    showSubTab(sub) {
        ['list', 'stats', 'info', 'setting'].forEach(s => document.getElementById('sub-' + s).style.display = (s === sub ? 'block' : 'none'));
        document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('sbtn-' + sub).classList.add('active');
    },
    updateRunStats(dist, speed) {
        document.getElementById('dist').textContent = dist.toFixed(2);
        let s = 3600 / (speed || 0.1);
        document.getElementById('curPace').textContent = speed > 0.5 ? `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"` : "--'--\"";
    }
};

let map, marker, polyline;
async function onStart() {
    State.isRunning = true; State.isPaused = false; State.totalDist = 0; State.seconds = 0;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    setInterval(() => { if(State.isRunning && !State.isPaused) {
        State.seconds++;
        let m = Math.floor(State.seconds / 60); let s = State.seconds % 60;
        document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }}, 1000);
}
function onStop() { State.isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { State.isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.78, -117.94], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.78, -117.94]).addTo(map);
    polyline = L.polyline([], {color: '#007bff'}).addTo(map);
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((p) => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos); map.panTo(pos);
            if (State.isRunning && !State.isPaused) {
                if (State.lastPos) {
                    let d = map.distance(State.lastPos, pos) / 1000;
                    if (d > 0.002) { State.totalDist += d; State.pathCoords.push(pos); polyline.setLatLngs(State.pathCoords); ui.updateRunStats(State.totalDist, p.coords.speed * 3.6); }
                }
                State.lastPos = pos;
            }
        }, null, {enableHighAccuracy: true});
    }
};
</script>
</body>
</html>
