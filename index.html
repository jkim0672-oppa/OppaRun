<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.0 (Final Custom)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 10px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        .history-nav { display: flex; gap: 6px; padding: 10px; background: #000; border-bottom: 1px solid #111; overflow-x: auto; }
        .sub-btn { flex: 1; min-width: 60px; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        
        /* Settings Styles */
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 14px; border-radius: 12px; margin: 0 12px 8px; border: 1px solid #222; }
        .opt-select { background: #000; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 8px; font-weight: 700; }
        .vol-slider { width: 100%; accent-color: var(--primary); height: 5px; margin-top: 10px; }
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 24px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div class="status-bar">
            <span id="status">GPS INITIALIZING...</span>
            <span id="gps-acc" style="color:var(--primary)">±0m</span>
        </div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="txt-cur-pace" style="color:var(--primary)">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" id="txt-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="txt-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="txt-avg-pace">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="txt-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="txt-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="txt-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">INFO</button>
            <button id="sub-tab-set" class="sub-btn" onclick="showSubTab('set')">⚙️</button>
        </div>

        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
        <div id="sub-page-info" class="sub-page"><div id="info-content" class="history-list"></div></div>
        
        <div id="sub-page-set" class="sub-page">
            <div style="padding-top:10px;">
                <div class="setting-row"><span id="txt-lang-lbl">Language</span>
                    <select id="lang-select" class="opt-select" onchange="changeLang(this.value)"><option value="ko">한국어</option><option value="en" selected>English</option></select>
                </div>
                <div class="setting-row"><span id="txt-metro-lbl">Metronome</span><label class="switch"><input type="checkbox" id="metro-switch" onchange="toggleMetro()"><span class="slider"></span></label></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px; margin:0 12px; border:1px solid #222;">
                    <div style="display:flex; justify-content:space-between;"><span id="txt-bpm-lbl">Tempo (BPM)</span><span id="bpm-val" style="color:var(--primary)">175</span></div>
                    <input type="range" id="metro-bpm" class="vol-slider" min="60" max="240" value="175" oninput="updateBPM(this.value)">
                    <div style="display:flex; justify-content:space-between; margin-top:15px;"><span id="txt-vol-lbl">Volume</span><span id="vol-val" style="color:var(--primary)">80%</span></div>
                    <input type="range" id="metro-vol" class="vol-slider" min="0" max="100" value="80" oninput="document.getElementById('vol-val').textContent=this.value+'%'">
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx = null, metroTimer = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

const langData = {
    ko: { run:"러닝", hist:"히스토리", start:"러닝 시작", stop:"정지", resume:"재개", finish:"종료", curPace:"현재 페이스", dist:"거리", time:"시간", avgPace:"평균 페이스", cadence:"케이던스", gct:"접지시간(GCT)", flight:"체공시간", list:"기록", total:"누적", info:"정보", lang:"언어", metro:"메트로놈 사용", bpm:"속도 (BPM)", vol:"볼륨", gps_ing:"GPS 연결 중...", tips:"뮤지션 오빠를 위한 커스텀 가이드" },
    en: { run:"RUN", hist:"HISTORY", start:"START RUNNING", stop:"STOP", resume:"RESUME", finish:"FINISH", curPace:"CURRENT PACE", dist:"DIST", time:"TIME", avgPace:"AVG PACE", cadence:"CADENCE", gct:"GCT", flight:"FLIGHT", list:"LIST", total:"TOTAL", info:"INFO", lang:"Language", metro:"Metronome", bpm:"Tempo (BPM)", vol:"Volume", gps_ing:"GPS INITIALIZING...", tips:"Custom guide for Musician Oppa" }
};
let currLang = 'en';

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, (e) => { document.getElementById('status').textContent = "GPS ERROR"; }, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    updateInfoPage();
} 

function changeLang(l) {
    currLang = l; const d = langData[l];
    document.getElementById('tab-run').innerText = d.run; document.getElementById('tab-history').innerText = d.hist;
    document.getElementById('btn-start').innerText = d.start; document.getElementById('btn-stop').innerText = d.stop;
    document.getElementById('btn-resume').innerText = d.resume; document.getElementById('btn-finish').innerText = d.finish;
    document.getElementById('txt-cur-pace').innerText = d.curPace; document.getElementById('txt-dist').innerText = d.dist;
    document.getElementById('txt-time').innerText = d.time; document.getElementById('txt-avg-pace').innerText = d.avgPace;
    document.getElementById('txt-cadence').innerText = d.cadence; document.getElementById('txt-gct').innerText = d.gct;
    document.getElementById('txt-flight').innerText = d.flight; document.getElementById('sub-tab-list').innerText = d.list;
    document.getElementById('sub-tab-total').innerText = d.total; document.getElementById('sub-tab-info').innerText = d.info;
    document.getElementById('txt-lang-lbl').innerText = d.lang; document.getElementById('txt-metro-lbl').innerText = d.metro;
    document.getElementById('txt-bpm-lbl').innerText = d.bpm; document.getElementById('txt-vol-lbl').innerText = d.vol;
    updateInfoPage();
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playTick() {
    initAudio(); const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    g.gain.setValueAtTime(document.getElementById('metro-vol').value/100, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
}
function toggleMetro() { initAudio(); clearInterval(metroTimer); if (document.getElementById('metro-switch').checked && isRunning && !isPaused) { metroTimer = setInterval(playTick, 60000/document.getElementById('metro-bpm').value); } }
function updateBPM(v) { document.getElementById('bpm-val').innerText = v; toggleMetro(); }

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    if (force > 12.5 && (Date.now() - lastStepTime) > 230) { 
        steps++; lastStepTime = Date.now();
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "--";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    document.getElementById('gps-acc').innerText = `±${Math.round(p.coords.accuracy)}m`;
    
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; }
        else if (currentSpeedKmh >= 0.8 && isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; }
        if (!isAutoPaused && p.coords.accuracy < 40) {
            if (lastPos) {
                let d = map.distance(lastPos, pos) / 1000;
                if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else lastPos = pos;
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else map.panTo(pos);
} 

function onStart() {
    initAudio(); isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; gctSum = 0; flightSum = 0; dataCount = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    toggleMetro();
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 

function onStop() { isPaused = true; clearInterval(metroTimer); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; toggleMetro(); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 
function onFinish() {
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0;
    const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0;
    const record = { dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, kcal: Math.round(totalDist * 65), gctflt: `${avgGct}/${avgFlt}%`, date: new Date().toLocaleDateString() };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(t) {
    document.getElementById('run-view').style.display = (t === 'run' ? 'flex' : 'none');
    document.getElementById('history-view').style.display = (t === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (t === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (t === 'history' ? ' active' : '');
    if(t === 'run') setTimeout(() => map.invalidateSize(), 200);
}

function showSubTab(s) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + s).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + s).style.display = 'flex';
    if (s === 'list') updateHistoryList();
    if (s === 'total') updateTotalStats();
}

function updateHistoryList() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><div style="color:var(--primary); font-size:11px; font-weight:700;">${r.date}</div><div style="font-size:20px; font-weight:900; margin:5px 0;">${r.dist}KM <span style="font-size:14px; color:#888;">${r.time}</span></div><div style="display:grid; grid-template-columns:repeat(3,1fr); font-size:12px; color:#aaa; border-top:1px solid #222; padding-top:8px;"><div>PACE: ${r.pace}</div><div>KCAL: ${r.kcal}</div><div>GCT/FLT: ${r.gctflt}</div></div></div>`).join('');
}

function updateTotalStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let d=0, k=0, s=0; h.forEach(r=>{ d+=parseFloat(r.dist)||0; k+=parseInt(r.kcal)||0; let p=r.time.split(':'); s+=(parseInt(p[0])||0)*60+(parseInt(p[1])||0); });
    document.getElementById('total-stats').innerHTML = `<div class="history-item" style="border:1px solid var(--primary);"><div style="color:var(--primary); font-weight:800; font-size:12px;">TOTAL STATS</div><div style="font-size:32px; font-weight:900; color:var(--primary);">${d.toFixed(2)} KM</div><div style="display:flex; justify-content:space-between; margin-top:10px; font-size:14px;"><span>TIME: ${Math.floor(s/60)}m</span><span>KCAL: ${k}</span><span>RUNS: ${h.length}</span></div></div>`;
}

function updateInfoPage() {
    document.getElementById('info-content').innerHTML = `<div class="history-item"><h2 style="color:var(--primary); margin:0;">OppaRun Pro</h2><p style="color:#888; font-size:13px;">${langData[currLang].tips}</p><hr style="border:0; border-top:1px solid #333;"><small>• GCT: Ground Contact Time<br>• Flight: Bounce Efficiency<br>• Cadence: Target 170-185 SPM</small></div>`;
}

function formatPace(k) { if (!k || k < 0.5) return "--'--\""; let s = 3600 / k; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
