<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run v15.4.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }
        .app-container { height: 100%; display: flex; flex-direction: column; }
        #map { flex: 1.5; border-bottom: 2px solid #222; }
        .gps-status { background: #000; color: #FFD700; text-align: center; padding: 5px; font-size: 0.8rem; font-weight: bold; }
        .dashboard { flex: 2.5; padding: 15px; display: flex; flex-direction: column; gap: 10px; justify-content: space-around; }
        .row { display: flex; gap: 10px; }
        .box { background: #111; border-radius: 15px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; height: 70px; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .value { font-size: 1.6rem; font-weight: bold; }
        .unit { font-size: 0.8rem; color: #00FF00; margin-left: 3px; }
        .pace-box { background: #000; border: 2px solid #00FF00; border-radius: 15px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pace-box .label { color: #00FF00; }
        .pace-box .value { font-size: 2.8rem; color: #00FF00; }
        .controls-row { display: flex; justify-content: space-around; align-items: center; flex: 1.2; }
        .start-btn { 
            width: 90px; height: 90px; background: #FF453A; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 1.1rem; color: #fff; border: none;
            box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
        }
        .tab-menu { display: flex; border-top: 1px solid #222; padding: 15px 0; background: #000; }
        .tab-item { flex: 1; text-align: center; color: #00FF00; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="map"></div>
    <div class="gps-status">GPS ACTIVE (±20m)</div>
    <div class="dashboard">
        <div class="row">
            <div class="box"><div class="label">Distance</div><div class="value">0.00<span class="unit">KM</span></div></div>
            <div class="box"><div class="label">Time</div><div class="value">00:00:00</div></div>
        </div>
        <div class="pace-box">
            <div class="label">CURRENT PACE</div>
            <div class="value">--'--"</div>
        </div>
        <div class="controls-row">
            <div style="text-align: center;"><div class="label">AVG PACE</div><div class="value" style="font-size: 1.2rem;">--'--"</div></div>
            <button class="start-btn">START</button>
            <div style="text-align: center;"><div class="label">CADENCE</div><div class="value" style="font-size: 1.2rem;">0<span class="unit">SPM</span></div></div>
        </div>
    </div>
    <div class="tab-menu">
        <div class="tab-item">RUNNING</div>
        <div class="tab-item" style="color:#888;">HISTORY</div>
    </div>
</div>
<script>
    var map = L.map('map', { zoomControl: false }).setView([37.5, 126.7], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    // 오빠, 이 밑으로는 GPS랑 자동정지 로직이 쭉 이어졌던 그 코드예요!
</script>
</body>
</html>
