<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.6 (GPS & Lang Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; --warning: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 120px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; display: flex; justify-content: center; gap: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 18px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; }
        .controls { padding: 15px; display: flex; height: 80px; align-items: center; margin-bottom: 75px; }
        .btn-act { width: 100%; height: 55px; border-radius: 28px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .history-nav { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 12px; border-radius: 10px; margin: 0 10px 8px; }
        .opt-select { background: #1a1a1a; color: white; border: 1px solid #333; padding: 5px; border-radius: 5px; }
        .vol-slider { width: 100%; accent-color: var(--primary); height: 4px; }
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 20px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 10px rgba(0,123,255,0.5); }
    </style>
</head>
<body>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div class="status-bar">
            <span id="status">GPS 연결 중...</span>
            <span id="gps-acc" style="color:var(--primary)">±0m</span>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" id="txt-cur-pace" style="color:var(--primary)">현재 페이스</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" id="txt-dist">거리</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="txt-time">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="txt-avg-pace">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="txt-cadence">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="txt-gct">접지시간(GCT)</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="txt-flight">체공시간</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">러닝 시작</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">정지</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">재개</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">종료</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">기록</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">누적</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">설정</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" style="padding:10px;"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" style="padding:10px;"></div></div>
        <div id="sub-page-info" class="sub-page"><div style="padding:20px; color:#aaa;" id="txt-app-info">오빠런 프로: 기타리스트를 위한 러닝 가이드</div></div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding:15px;">
                <div class="setting-row"><span id="txt-lang-label">언어</span>
                    <select id="lang-select" class="opt-select" onchange="changeLang(this.value)"><option value="ko">한국어</option><option value="en">English</option></select>
                </div>
                <div class="setting-row"><span id="txt-metro-label">메트로놈 사용</span><label class="switch"><input type="checkbox" id="metro-switch" onchange="toggleMetro()"><span class="slider"></span></label></div>
                <div style="background:#1a1a1a; padding:12px; border-radius:10px; margin:0 10px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span id="txt-bpm-label">속도 (BPM)</span><span id="bpm-val" style="color:var(--primary)">175</span></div>
                    <input type="range" id="metro-bpm" class="vol-slider" min="60" max="240" value="175" oninput="updateBPM(this.value)">
                    <div style="display:flex; justify-content:space-between; margin-top:15px; margin-bottom:5px;"><span id="txt-vol-label">볼륨</span><span id="vol-val" style="color:var(--primary)">80%</span></div>
                    <input type="range" id="metro-vol" class="vol-slider" min="0" max="100" value="80" oninput="document.getElementById('vol-val').textContent=this.value+'%'">
                </div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">러닝</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">히스토리</button>
    </div>

<script>
let map, marker, polyline, audioCtx = null, metroTimer = null;
let isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let pathCoords = [], steps = 0, lastStepTime = 0, currentSpeedKmh = 0;
const langData = {
    ko: { run:"러닝", hist:"히스토리", start:"러닝 시작", stop:"정지", resume:"재개", finish:"종료", curPace:"현재 페이스", dist:"거리", time:"시간", avgPace:"평균 페이스", cadence:"케이던스", gct:"접지시간(GCT)", flight:"체공시간", list:"기록", total:"누적", info:"정보", set:"설정", lang:"언어", metro:"메트로놈 사용", bpm:"속도 (BPM)", vol:"볼륨", gps_ing:"GPS 연결 중...", app_info:"오빠런 프로: 뮤지션 오빠를 위한 커스텀 가이드" },
    en: { run:"RUN", hist:"HISTORY", start:"START RUN", stop:"STOP", resume:"RESUME", finish:"FINISH", curPace:"CURRENT PACE", dist:"DISTANCE", time:"TIME", avgPace:"AVG PACE", cadence:"CADENCE", gct:"GCT", flight:"FLIGHT", list:"LIST", total:"TOTAL", info:"INFO", set:"SET", lang:"Language", metro:"Metronome", bpm:"Tempo (BPM)", vol:"Volume", gps_ing:"GPS Connecting...", app_info:"OppaRun Pro: Custom guide for Musician Oppa" }
};

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.56, 126.97], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePos, (e) => { document.getElementById('status').innerText = "GPS Error"; }, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
}

function updatePos(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    document.getElementById('gps-acc').innerText = `±${acc}m`;
    marker.setLatLng(pos);
    if (!isRunning) map.panTo(pos);
    if (isRunning && !isPaused && acc < 40) {
        if (lastPos) {
            let d = map.distance(lastPos, pos) / 1000;
            if (d > 0.002) { totalDist += d; pathCoords.push(pos); polyline.setLatLngs(pathCoords); lastPos = pos; }
        } else lastPos = pos;
        currentSpeedKmh = (p.coords.speed || 0) * 3.6;
        document.getElementById('dist').innerText = totalDist.toFixed(2);
        document.getElementById('curPace').innerText = formatPace(currentSpeedKmh);
    }
}

function changeLang(l) {
    const d = langData[l];
    document.getElementById('tab-run').innerText = d.run; document.getElementById('tab-history').innerText = d.hist;
    document.getElementById('btn-start').innerText = d.start; document.getElementById('btn-stop').innerText = d.stop;
    document.getElementById('btn-resume').innerText = d.resume; document.getElementById('btn-finish').innerText = d.finish;
    document.getElementById('txt-cur-pace').innerText = d.curPace; document.getElementById('txt-dist').innerText = d.dist;
    document.getElementById('txt-time').innerText = d.time; document.getElementById('txt-avg-pace').innerText = d.avgPace;
    document.getElementById('txt-cadence').innerText = d.cadence; document.getElementById('txt-gct').innerText = d.gct;
    document.getElementById('txt-flight').innerText = d.flight; document.getElementById('sub-tab-list').innerText = d.list;
    document.getElementById('sub-tab-total').innerText = d.total; document.getElementById('sub-tab-info').innerText = d.info;
    document.getElementById('sub-tab-settings').innerText = d.set; document.getElementById('txt-lang-label').innerText = d.lang;
    document.getElementById('txt-metro-label').innerText = d.metro; document.getElementById('txt-bpm-label').innerText = d.bpm;
    document.getElementById('txt-vol-label').innerText = d.vol; document.getElementById('status').innerText = d.gps_ing;
    document.getElementById('txt-app-info').innerText = d.app_info;
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playTick() {
    initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
    gain.gain.setValueAtTime(document.getElementById('metro-vol').value/100, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}
function toggleMetro() { initAudio(); if (document.getElementById('metro-switch').checked) { if(isRunning && !isPaused) { clearInterval(metroTimer); metroTimer = setInterval(playTick, 60000/document.getElementById('metro-bpm').value); } } else clearInterval(metroTimer); }
function updateBPM(v) { document.getElementById('bpm-val').innerText = v; if(document.getElementById('metro-switch').checked) toggleMetro(); }

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity; if(!acc) return;
    let f = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    if (f > 13 && (Date.now() - lastStepTime) > 250) { steps++; lastStepTime = Date.now(); document.getElementById('cadence').innerText = Math.round((steps/(seconds||1))*60); }
}
function onStart() { isRunning = true; seconds = 0; totalDist = 0; steps = 0; pathCoords = []; initAudio(); document.getElementById('btn-start').style.display='none'; document.getElementById('btn-stop').style.display='block'; toggleMetro(); setInterval(()=> { if(isRunning && !isPaused) seconds++; document.getElementById('time').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000); }
function onStop() { isPaused = true; clearInterval(metroTimer); document.getElementById('btn-stop').style.display='none'; document.getElementById('after-stop').style.display='flex'; }
function onResume() { isPaused = false; toggleMetro(); document.getElementById('after-stop').style.display='none'; document.getElementById('btn-stop').style.display='block'; }
function onFinish() { 
    let h = JSON.parse(localStorage.getItem('oppaRunHistory')||"[]");
    h.unshift({ dist: totalDist.toFixed(2), time: document.getElementById('time').innerText, pace: document.getElementById('avgPace').innerText, kcal: Math.round(totalDist*60) });
    localStorage.setItem('oppaRunHistory', JSON.stringify(h)); location.reload(); 
}
function showTab(t) { document.getElementById('run-view').style.display = t==='run'?'flex':'none'; document.getElementById('history-view').style.display = t==='history'?'flex':'none'; document.getElementById('tab-run').className = `tab-btn ${t==='run'?'active':''}`; document.getElementById('tab-history').className = `tab-btn ${t==='history'?'active':''}`; if(t==='run') setTimeout(()=>map.invalidateSize(), 200); }
function showSubTab(s) { document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active')); document.getElementById('sub-tab-'+s).classList.add('active'); document.querySelectorAll('.sub-page').forEach(p=>p.style.display='none'); document.getElementById('sub-page-'+s).style.display='flex'; if(s==='list') updateList(); }
function updateList() { let h = JSON.parse(localStorage.getItem('oppaRunHistory')||"[]"); document.getElementById('history-list').innerHTML = h.map(r=>`<div style="background:#1a1a1a; padding:10px; border-radius:10px; margin-bottom:5px;"><b>${r.dist}km</b> | ${r.time} | ${r.pace}</div>`).join(''); }
function formatPace(k) { if(!k || k<1) return "--'--\""; let s = 3600/k; return `${Math.floor(s/60)}'${Math.floor(s%60).toString().padStart(2,'0')}"`; }
window.onload = initMap;
</script>
</body>
</html>
