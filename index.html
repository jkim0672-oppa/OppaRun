<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v25.9</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #ffffff; --danger: #ff4444; 
            --warning: #ffcc00;
            --tab-height: 65px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; 
            height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; 
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* RUN 화면용 컨트롤 */
        .controls { margin-top: auto; padding: 20px 15px; margin-bottom: calc(var(--tab-height) + env(safe-area-inset-bottom)); display: flex; flex-shrink: 0; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; font-size: 16px; border: none; }

        /* ★ 히스토리 3단 분할 레이아웃 ★ */
        #history-view { 
            display: none; flex: 1; width: 100%; flex-direction: column; 
            height: calc(100vh - 18vh - var(--tab-height)); /* 전체 남은 높이 */
        }

        /* 1단: 통계 (높이 고정) */
        .history-top { flex-shrink: 0; padding: 15px 0 5px 0; }
        .total-dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 15px; }
        .total-card { background: #1a1a1a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-label { font-size: 8px; color: var(--primary); font-weight: 900; text-transform: uppercase; }
        .total-value { font-size: 16px; font-weight: 900; color: #fff; }

        /* 2단: 리스트 (중간 영역 차지, 스크롤) */
        .history-middle { 
            flex: 1; /* 남은 공간의 절반 정도를 차지하도록 유도 */
            display: flex; flex-direction: column; overflow: hidden;
            border-top: 1px solid #222; border-bottom: 1px solid #222;
            margin: 10px 0;
        }
        .history-list { 
            flex: 1; overflow-y: auto; padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* 3단: 분석/헬프 (하단 영역 고정) */
        .history-bottom { 
            flex-shrink: 0; height: 25vh; /* 화면의 약 1/4~1/3 차지 */
            background: #0a0a0a; padding: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: calc(var(--tab-height) + env(safe-area-inset-bottom));
        }
        .placeholder-box { 
            width: 100%; height: 100%; border: 1px dashed #444; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #666; font-weight: 800; font-size: 12px;
        }

        /* 기록 아이템 스타일 */
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #1f1f1f; }
        .h-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 800; }
        .h-main-stats { display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px; }
        .h-dist { font-size: 24px; font-weight: 900; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #222; padding-top: 10px; }
        .h-info .lab { font-size: 8px; opacity: 0.6; display: block; }
        .h-info .val { font-size: 12px; font-weight: 800; color: var(--primary); }

        /* 탭바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tab-height) + env(safe-area-inset-bottom)); background: #000; display: flex; border-top: 1px solid #222; z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }

        /* 공통 카드 및 대시보드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 90px; }
        .value-large { font-size: 44px; color: var(--primary); font-weight: 900; line-height: 1; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">LOCATING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main"><div class="label" style="color:var(--primary); font-size:10px; font-weight:900;">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">DIST</div><div class="value" style="font-size:22px; font-weight:900;"><span id="dist">0.00</span><small style="font-size:11px; color:var(--primary)">KM</small></div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">TIME</div><div id="time" style="font-size:22px; font-weight:900;">00:00</div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">AVG PACE</div><div id="avgPace" style="font-size:22px; font-weight:900;">--'--"</div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">CADENCE</div><div style="font-size:22px; font-weight:900;"><span id="cadence">0</span><small style="font-size:11px; color:var(--primary)">SPM</small></div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">GCT</div><div style="font-size:22px; font-weight:900;"><span id="gct">--</span><small style="font-size:9px; color:var(--primary)">ms</small></div></div>
            <div class="card"><div class="label" style="font-size:10px; font-weight:900;">FLIGHT</div><div style="font-size:22px; font-weight:900;"><span id="flight">--</span><small style="font-size:11px; color:var(--primary)">%</small></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
            <div id="after-stop">
                <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view">
        <div class="history-top">
            <div style="padding: 0 20px 10px 20px;"><span style="font-size: 20px; font-weight: 900; color: var(--primary);">STATISTICS</span></div>
            <div class="total-dashboard">
                <div class="total-card"><span class="total-label">Total Dist</span><span id="total-dist-val" class="total-value">0.00</span></div>
                <div class="total-card"><span class="total-label">Weekly Dist</span><span id="weekly-dist-val" class="total-value">0.00</span></div>
                <div class="total-card"><span class="total-label">Total Runs</span><span id="total-runs-val" class="total-value">0</span></div>
                <div class="total-card"><span class="total-label">Total kcal</span><span id="total-kcal-val" class="total-value">0</span></div>
            </div>
        </div>

        <div class="history-middle">
            <div style="padding: 10px 20px;"><span style="font-size: 14px; font-weight: 800; color: #666;">RECENT RUNS</span></div>
            <div id="history-list" class="history-list">
                </div>
        </div>

        <div class="history-bottom">
            <div class="placeholder-box">
                <span>📊 ANALYSIS & HELP MENU</span>
                <span style="font-size: 9px; margin-top:5px; opacity: 0.5;">COMING SOON IN NEXT UPDATE</span>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
/* 로직은 오빠의 원본 그대로 100% 보존 */
let map, marker, polyline, historyMap, historyLayer, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0, timer;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0, splits = [], kmStartSeconds = 0;
const AUTO_PAUSE_THRESHOLD = 1.5;
let lowSpeedTicks = 0; 

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); } 
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 

function initMap() {
    try {
        map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
        polyline = L.polyline([], {color: '#007bff', weight: 5, opacity: 0.8}).addTo(map);
        if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
        loadHistory();
        window.addEventListener('devicemotion', handleMotion);
    } catch(e) { console.error("Init Error", e); }
} 

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = 0, flt = 0;
        if (currentSpeedKmh > 7.5) { 
            gct = Math.max(180, Math.floor(240 - (currentSpeedKmh * 3) + (Math.random() * 20)));
            flt = Math.floor(18 + (currentSpeedKmh * 1.2) + (Math.random() * 5));
        } else if (currentSpeedKmh > 1.0) { 
            gct = Math.floor(450 - (currentSpeedKmh * 10) + (Math.random() * 50));
            flt = Math.max(0, Math.floor(currentSpeedKmh * 2));
        }
        gctSum += gct; flightSum += flt; dataCount++;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        const gctDisplay = document.getElementById('gct');
        gctDisplay.textContent = gct || "--";
        const fltDisplay = document.getElementById('flight');
        fltDisplay.textContent = flt || "0";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "GPS READY"; }
    if (isRunning && !isPaused && !isAutoPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = (function(p1,p2){
                const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
            })(lastPos, pos);
            if (d > 0.005) { 
                totalDist += d; 
                document.getElementById('dist').textContent = totalDist.toFixed(2); 
                lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); 
            }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    }
} 

function onStart() {
    requestWakeLock(); vibrate(100);
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; lastPos = null; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
} 
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; } 
function onFinish() {
    vibrate([100, 50, 100]); releaseWakeLock();
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'}),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        avgPace: document.getElementById('avgPace').textContent,
        cadence: Math.round((steps / (seconds || 1)) * 60),
        kcal: Math.round(totalDist * 70),
        gct: dataCount ? Math.round(gctSum / dataCount) : "--",
        flight: dataCount ? Math.round(flightSum / dataCount) : "--"
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    showTab('history');
    isRunning = false; clearInterval(timer);
    document.getElementById('btn-start').style.display = 'flex'; document.getElementById('after-stop').style.display = 'none';
} 

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    let totalD = 0;
    history.forEach(r => totalD += parseFloat(r.dist));
    document.getElementById('total-dist-val').textContent = totalD.toFixed(2);
    document.getElementById('total-runs-val').textContent = history.length;
    
    list.innerHTML = history.length ? "" : '<div style="color:#333; text-align:center; padding:50px;">NO DATA</div>';
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header"><span class="h-date">${r.date}</span></div>
            <div class="h-main-stats"><span class="h-dist">${r.dist}KM</span><span style="font-size:16px;">${r.time}</span></div>
            <div class="h-grid">
                <div class="h-info"><span class="lab">PACE</span><span class="val">${r.avgPace}</span></div>
                <div class="h-info"><span class="lab">CADENCE</span><span class="val">${r.cadence}</span></div>
                <div class="h-info"><span class="lab">GCT</span><span class="val">${r.gct}ms</span></div>
                <div class="h-info"><span class="lab">FLIGHT</span><span class="val">${r.flight}%</span></div>
            </div>`;
        list.appendChild(item);
    });
} 

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'history') loadHistory();
}
window.onload = initMap;
</script>
</body>
</html>
