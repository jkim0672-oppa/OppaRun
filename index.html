<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Run v28.75 (Color Feedback Edition)</title>
    <!-- 오빠의 원본 스타일 (절대 수정 금지) -->
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-blue: #007AFF;
            --accent-green: #4CD964;
            --accent-red: #FF3B30;
            --text-main: #ffffff;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        #display-container {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        /* 페이스 표시 부분 - 색상이 변할 타겟 */
        #pace-display {
            font-size: 5rem; font-weight: 800; margin: 10px 0;
            transition: color 0.3s ease; /* 부드러운 색상 변화 */
        }
        .label { font-size: 1.2rem; color: #888; text-transform: uppercase; }
        #controls { padding: 20px; display: flex; gap: 10px; }
        button {
            flex: 1; padding: 15px; border-radius: 12px; border: none;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .start-btn { background-color: var(--accent-green); color: white; }
        .stop-btn { background-color: var(--accent-red); color: white; }
    </style>
</head>
<body>

<div id="display-container">
    <div class="label">Current Pace</div>
    <!-- 이 숫자의 색깔이 페이스에 따라 변해! -->
    <div id="pace-display">00:00</div>
    <div id="distance-display" style="font-size: 2rem;">0.00 km</div>
</div>

<div id="controls">
    <button class="start-btn" onclick="startRun()">START</button>
    <button class="stop-btn" onclick="stopRun()">STOP</button>
</div>

<script>
    let timer = null;
    let seconds = 0;
    let distance = 0.0;
    let isRunning = false;

    // 메트로놈 설정 (오빠의 180 BPM & 이명 관리)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let metronomeInterval = null;

    function startRun() {
        if (isRunning) return;
        isRunning = true;
        // 진동 피드백 (v28.75 핵심 기능)
        if (navigator.vibrate) navigator.vibrate(100);
        
        timer = setInterval(updateRunData, 1000);
        startMetronome(180); 
    }

    function stopRun() {
        isRunning = false;
        clearInterval(timer);
        stopMetronome();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function updateRunData() {
        seconds++;
        // GPS 기반 거리 계산 로직 (시뮬레이션)
        distance += 0.003; 
        
        const currentPace = calculatePace(seconds, distance);
        updateDisplay(currentPace, distance);
    }

    function calculatePace(s, d) {
        if (d === 0) return "00:00";
        const totalMinutes = (s / 60) / d;
        const mins = Math.floor(totalMinutes);
        const secs = Math.round((totalMinutes - mins) * 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // --- 핵심: 색깔별 피드백 로직 ---
    function updateDisplay(pace, dist) {
        const paceDisplay = document.getElementById("pace-display");
        const distDisplay = document.getElementById("distance-display");
        
        paceDisplay.innerText = pace;
        distDisplay.innerText = dist.toFixed(2) + " km";

        // 페이스를 초 단위로 변환 (예: 05:00 -> 300초)
        const parts = pace.split(':');
        const paceSec = (parseInt(parts[0]) * 60) + parseInt(parts[1]);

        // 오빠의 타겟: 5:00/km (300초)
        if (paceSec < 295) { 
            // 4:55 미만: 너무 빠름 (파란구슬처럼 시원하게)
            paceDisplay.style.color = "#007AFF"; 
        } else if (paceSec <= 305) { 
            // 4:55 ~ 5:05: 딱 좋아! (편안하고 부드러움)
            paceDisplay.style.color = "#4CD964"; 
        } else if (paceSec <= 330) {
            // 5:05 ~ 5:30: 조금만 더 힘내! (노란색 주의)
            paceDisplay.style.color = "#FFCC00";
        } else {
            // 5:30 초과: 가자미근 무리 가니까 조절하자 (빨간색)
            paceDisplay.style.color = "#FF3B30";
        }
    }

    function startMetronome(bpm) {
        const interval = 60 / bpm;
        metronomeInterval = setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            // 이명 방지를 위해 sine 파형으로 부드럽게 설정
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }, interval * 1000);
    }

    function stopMetronome() {
        clearInterval(metronomeInterval);
    }
</script>
</body>
</html>
