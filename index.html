<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Professional Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-color: #007AFF;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-container { height: 100vh; display: flex; flex-direction: column; }

        /* Map Section (Expandable) */
        #map { flex: 1.2; transition: all 0.3s ease; border-bottom: 2px solid #333; }
        #map.expanded { flex: 4; }

        /* Dashboard Section */
        .dashboard {
            background: var(--card-bg);
            padding: 20px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 15px;
            text-align: center;
        }

        .label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        .value { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

        /* GCT & Flight Section (Advanced) */
        .analysis-card {
            background: linear-gradient(145deg, #222, #111);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(0,122,255,0.3);
        }

        .analysis-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .recommendation {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
            background: rgba(0,122,255,0.1);
            padding: 5px;
            border-radius: 8px;
        }

        /* Controls */
        .controls { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .start-btn { background: var(--accent-color); color: white; }
        .stop-btn { background: #ff3b30; color: white; display: none; }
        .history-btn { background: #333; color: white; width: 65px; font-size: 1.2rem; }

        /* History Overlay */
        #historyOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 2000; display: none;
            padding: 20px; overflow-y: auto;
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .history-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333;
        }
        .history-data { line-height: 1.4; }
        .delete-x { color: #ff3b30; font-size: 1.4rem; cursor: pointer; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="map" onclick="toggleMap()"></div>

    <div class="dashboard">
        <div class="details-grid">
            <div class="detail-item">
                <div class="label">Distance</div>
                <div class="value" id="distDisplay">0.00km</div>
            </div>
            <div class="detail-item">
                <div class="label">Time</div>
                <div class="value" id="timeDisplay">00:00:00</div>
            </div>
            <div class="detail-item">
                <div class="label">Pace</div>
                <div class="value" id="paceDisplay">0'00"</div>
            </div>
            <div class="detail-item">
                <div class="label">Calories</div>
                <div class="value" id="kcalDisplay">0 kcal</div>
            </div>
        </div>

        <div class="analysis-card">
            <div class="label" style="text-align: center; margin-bottom: 12px; color: var(--accent-color);">Running Dynamics</div>
            <div class="analysis-row">
                <div style="text-align: center;">
                    <div class="value" id="gctDisplay">---</div>
                    <div class="label">GCT (ms)</div>
                </div>
                <div style="color: #444; font-size: 1.5rem; font-weight: 100;">|</div>
                <div style="text-align: center;">
                    <div class="value" id="flightDisplay">---</div>
                    <div class="label">FLIGHT (ms)</div>
                </div>
            </div>
            <div class="recommendation">Target GCT: 180 - 240ms</div>
        </div>

        <div class="controls">
            <button class="btn start-btn" onclick="startRun()">START RUN</button>
            <button class="btn stop-btn" id="stopBtn" onclick="stopRun()">STOP</button>
            <button class="btn history-btn" onclick="showHistory()">📜</button>
        </div>
    </div>
</div>

<div id="historyOverlay">
    <div class="history-header">
        <h2 style="margin:0;">My History</h2>
        <button class="btn" style="width: 50px; background:#333; color:white;" onclick="closeHistory()">✕</button>
    </div>
    <div id="historyList"></div>
</div>

<script>
    let map, path, watchId;
    let running = false;
    let startTime, timerInterval;
    let distance = 0;
    let lastPos = null;
    const weight = 70; // 오빠의 체중 설정

    // 지도 초기화 (Dark Mode)
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    path = L.polyline([], { color: '#007AFF', weight: 6, opacity: 0.8 }).addTo(map);

    function toggleMap() {
        document.getElementById('map').classList.toggle('expanded');
        setTimeout(() => map.invalidateSize(), 300);
    }

    function startRun() {
        running = true;
        distance = 0;
        lastPos = null;
        path.setLatLngs([]);
        startTime = Date.now();
        document.querySelector('.start-btn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        
        timerInterval = setInterval(updateDashboard, 1000);
        
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude } = pos.coords;
            const currentPos = [latitude, longitude];
            
            if (lastPos) {
                const d = map.distance(lastPos, currentPos);
                if (d > 2) { 
                    distance += d;
                    path.addLatLng(currentPos);
                    map.panTo(currentPos);
                }
            }
            lastPos = currentPos;

            // 실시간 센서값이 없을 때의 더미 시뮬레이션
            document.getElementById('gctDisplay').innerText = Math.floor(Math.random() * (250 - 180) + 180);
            document.getElementById('flightDisplay').innerText = Math.floor(Math.random() * (130 - 70) + 70);
        }, null, { enableHighAccuracy: true });
    }

    function updateDashboard() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `${h}:${m}:${s}`;
        
        const distKm = (distance / 1000).toFixed(2);
        document.getElementById('distDisplay').innerText = distKm + 'km';
        
        // 칼로리 계산
        document.getElementById('kcalDisplay').innerText = (weight * distKm).toFixed(1) + ' kcal';

        // 페이스 계산
        if (distance > 0) {
            const paceMin = (elapsed / 60) / (distance / 1000);
            const pM = Math.floor(paceMin);
            const pS = String(Math.floor((paceMin - pM) * 60)).padStart(2, '0');
            document.getElementById('paceDisplay').innerText = `${pM}'${pS}"`;
        }
    }

    function stopRun() {
        if(!confirm("Finish your run?")) return;
        running = false;
        clearInterval(timerInterval);
        navigator.geolocation.clearWatch(watchId);
        
        const record = {
            date: new Date().toLocaleString(),
            dist: document.getElementById('distDisplay').innerText,
            time: document.getElementById('timeDisplay').innerText,
            kcal: document.getElementById('kcalDisplay').innerText
        };
        
        let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        history.unshift(record);
        localStorage.setItem('runHistory', JSON.stringify(history));
        
        alert('Run Saved!');
        location.reload(); 
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        const list = document.getElementById('historyList');
        list.innerHTML = history.map((item, index) => `
            <div class="history-item">
                <div class="history-data">
                    <div style="font-size: 0.75rem; color: #888;">${item.date}</div>
                    <div style="font-weight: bold; font-size: 1.1rem;">${item.dist} <span style="color:#444; font-weight:normal;">|</span> ${item.time}</div>
                    <div style="font-size: 0.85rem; color: var(--accent-color);">${item.kcal} burned</div>
                </div>
                <div class="delete-x" onclick="deleteHistory(${index})">✕</div>
            </div>
        `).join('');
        document.getElementById('historyOverlay').style.display = 'block';
    }

    function deleteHistory(index) {
        if (confirm('Are you sure you want to delete this record?')) {
            let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('runHistory', JSON.stringify(history));
            showHistory();
        }
    }

    function closeHistory() { document.getElementById('historyOverlay').style.display = 'none'; }
</script>

</body>
</html>
