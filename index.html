<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.81 (Large Dashboard)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 박스 크기 확대 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 12px 0; min-height: 70px; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 100px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 12px; left: 12px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 8px 12px; border-radius: 8px; font-weight: 900; transition: 0.2s; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* 기록 탭 레이아웃 */
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 13px; color: var(--primary); font-weight: 900; margin-bottom: 8px; letter-spacing: 0.5px; }
        .h-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; }
        .btn-h-sub { background: #333; border: 1px solid #555; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        /* 상세 페이지 레이아웃 보존 */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow: hidden; }
        .detail-card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 0 15px; }
        .detail-mini-card { background: var(--card-bg); border-radius: 8px; padding: 8px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        
        #diag-view, #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        
        .dropdown-select { background: #2a2a2a; color: #fff; border: 1.5px solid #444; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #2a2a2a; border: 1.5px solid #444; border-radius: 12px; z-index: 1000; overflow-y: auto; max-height: 250px; }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #333; cursor: pointer; color: #fff; }
        
        #metro-bpm-val { font-size: 40px; font-weight: 900; text-align: center; color: var(--primary); margin: 5px 0; }
        .metro-slider { width: 100%; accent-color: var(--primary); margin: 10px 0; height: 4px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map" style="height: 45%; border-bottom: 1px solid #222;"></div>
        <div id="detail-data" style="padding: 10px 0; overflow-y: auto; flex: 1;"></div>
    </div>

    <div id="diag-view">
        <button class="close-detail" onclick="ui.closeDiag()">CLOSE</button>
        <div id="diag-content-area"></div>
    </div>

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div style="padding: 50px 20px 15px;">
            <div style="font-size:22px; font-weight:900; color:var(--primary);">METRONOME</div>
        </div>
        <div style="background:#1a1a1a; border-radius:12px; padding:15px; margin:8px 15px; border:1px solid #333;">
            <div id="metro-bpm-val">175</div>
            <input type="range" id="metro-bpm" class="metro-slider" min="140" max="200" value="175" oninput="metro.updateDisplay()">
        </div>
        <div style="padding: 0 15px;">
            <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000;" onclick="metro.toggle()">START</button>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
                <button id="btn-dim" style="position:absolute; top:12px; right:12px; background:#333; border:1px solid #444; color:#999; font-size:10px; padding:6px 10px; border-radius:6px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span id="unit-dist" style="font-size:11px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:11px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:11px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container"></div></div>
        <div id="sub-page-info" class="sub-page" style="padding: 10px 12px 120px 12px; gap: 10px;">
            <div style="background:#1a1a1a; border-radius:12px; padding:15px; border:1px solid #333;"><div id="info-cadence-title" style="color:var(--primary); font-weight:900; margin-bottom:5px;">CADENCE</div><div style="font-size:12px; color:#ccc;">170~185 BPM recommended.</div></div>
        </div>
        <div id="sub-page-settings" class="sub-page">
            <div style="padding: 20px;">
                <div class="dropdown-select" onclick="ui.toggleDropdown()"><span id="current-lang-text">English (US)</span><span style="font-size:10px; color:var(--primary);">▼</span></div>
                <div id="dropdown-options" class="dropdown-options">
                    <div class="dropdown-option" onclick="ui.selectLang('en')">English (US)</div>
                    <div class="dropdown-option" onclick="ui.selectLang('ko')">한국어 (KR)</div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/* [Logic - No Touch] */
let map, marker, accCircle, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, currentAlt = 0, pathCoords = [];
let detailMap = null, lastImpactTime = 0, isFeetOnGround = false;

const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", info: "INFO", settings: "SETTINGS", route: "ROUTE", diag: "DIAG" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", info: "정보", settings: "설정", route: "경로", diag: "진단" }
};

const storage = {
    key: 'oppaRunHistory',
    saveRecord: (record) => { let h = storage.loadHistory(); h.unshift(record); localStorage.setItem(storage.key, JSON.stringify(h)); },
    loadHistory: () => JSON.parse(localStorage.getItem('oppaRunHistory') || "[]")
};

const metro = {
    audioCtx: null, nextTickTime: 0, timerID: null, isPlaying: false, currentBeat: 0,
    init() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
    playClick() {
        const osc = this.audioCtx.createOscillator();
        const envelope = this.audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = (this.currentBeat === 0) ? 1200 : 800;
        envelope.gain.value = 0.5;
        envelope.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.1);
        osc.connect(envelope); envelope.connect(this.audioCtx.destination);
        osc.start(this.audioCtx.currentTime); osc.stop(this.audioCtx.currentTime + 0.1);
        this.currentBeat = (this.currentBeat + 1) % 4;
    },
    scheduler() {
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playClick();
            this.nextTickTime += 60.0 / document.getElementById('metro-bpm').value;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    },
    toggle() {
        this.init();
        if (this.isPlaying) { clearTimeout(this.timerID); this.isPlaying = false; }
        else { this.currentBeat = 0; this.nextTickTime = this.audioCtx.currentTime; this.scheduler(); this.isPlaying = true; }
        ui.updateQuickMetroBtn();
    },
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
        if(tab === 'run' && map) setTimeout(() => map.invalidateSize(), 100);
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
    },
    changeLanguage: (lang) => {
        const t = translations[lang];
        ['pace','dist','time','avg','cadence','gct','flight'].forEach(id => { const el = document.getElementById('label-'+id); if(el) el.textContent = t[id]; });
        document.getElementById('btn-start').textContent = t.start; document.getElementById('btn-stop').textContent = t.stop;
        document.getElementById('tab-run').textContent = t.run; document.getElementById('tab-history').textContent = t.history;
        localStorage.setItem('oppaRunLang', lang); ui.updateHistoryList();
    },
    toggleDim: (show) => { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; },
    toggleDropdown: () => { const opt = document.getElementById('dropdown-options'); opt.style.display = (opt.style.display==='block'?'none':'block'); },
    selectLang: (lang) => { ui.changeLanguage(lang); ui.toggleDropdown(); },
    openMetronome: () => document.getElementById('metronome-view').style.display = 'flex',
    closeMetronome: () => document.getElementById('metronome-view').style.display = 'none',
    updateQuickMetroBtn: () => {
        const btn = document.getElementById('quick-metro');
        btn.textContent = metro.isPlaying ? "METRO ON" : "METRO OFF";
        btn.style.background = metro.isPlaying ? "var(--primary)" : "#333";
        btn.style.color = metro.isPlaying ? "#000" : "#999";
    },
    updateHistoryList: () => {
        const h = storage.loadHistory(); const lang = localStorage.getItem('oppaRunLang') || 'en'; const t = translations[lang];
        document.getElementById('history-list').innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-actions"><button class="btn-h-sub" onclick="ui.openDetail(${r.id})">${t.route}</button></div>
                <div style="font-size:18px; font-weight:900; color:#fff;">${r.dist}KM <span style="color:var(--primary);">${r.time}</span></div>
            </div>`).join('');
    },
    openDetail: (id) => {
        const h = storage.loadHistory(); const record = h.find(r => r.id === id); if (!record) return;
        document.getElementById('detail-view').style.display = 'flex';
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (record.path && record.path.length > 0) { let poly = L.polyline(record.path, {color: 'var(--primary)', weight: 5}).addTo(detailMap); detailMap.fitBounds(poly.getBounds()); }
        const lang = localStorage.getItem('oppaRunLang') || 'en'; const t = translations[lang];
        document.getElementById('detail-data').innerHTML = `
            <div class="detail-card-grid">
                <div class="detail-mini-card"><div class="label">${t.time}</div><div class="value">${record.time}</div></div>
                <div class="detail-mini-card"><div class="label">${t.pace}</div><div class="value">${record.pace}</div></div>
            </div>`;
    },
    closeDetail: () => document.getElementById('detail-view').style.display = 'none'
};

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6; currentAlt = p.coords.altitude ? Math.round(p.coords.altitude) : 0;
    document.getElementById('status').textContent = `GPS READY: ±${Math.round(p.coords.accuracy)}m | ALT: ${currentAlt}m`;
    if (marker) { marker.setLatLng(pos); map.panTo(pos); }
    if (isRunning && !isPaused && !isAutoPaused) {
        if (lastPos) { let d = map.distance(lastPos, pos) / 1000; if (d > 0.001) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); } } else lastPos = pos;
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
    }
}
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 12.5 && (now - lastImpactTime) > 230) {
        steps++; document.getElementById('cadence').textContent = Math.round((steps / (seconds || 1)) * 60);
        lastImpactTime = now;
    }
}
function onStart() { isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; timer = setInterval(() => { if(!isPaused) { seconds++; let m = Math.floor(seconds / 60); let s = seconds % 60; document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; } }, 1000); }
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() { storage.saveRecord({ id: Date.now(), date: new Date().toLocaleString(), dist: document.getElementById('dist').textContent, time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: document.getElementById('cadence').textContent, gct: document.getElementById('gct').textContent, flight: document.getElementById('flight').textContent, path: pathCoords }); location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    ui.changeLanguage(localStorage.getItem('oppaRunLang') || 'en');
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
</body>
</html>
