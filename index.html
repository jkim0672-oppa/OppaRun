<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v30.01</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #map-container { height: 18vh; position: relative; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .gps-status { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: var(--primary); font-size: 10px; text-align: center; padding: 4px; z-index: 1000; font-weight: 900; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 160px; }
        .dashboard { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; border: 1.5px solid #333; display: flex; flex-direction: column; padding: 12px; position: relative; justify-content: center; }
        
        /* [핵심 수정] PACE 박스를 '반반' 구조로 복각 */
        .card-pace-split { grid-column: span 6; border: 2.5px solid var(--primary); height: 110px; display: flex; flex-direction: row; padding: 0; }
        .pace-left { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; border-right: 1.5px solid #333; }
        .pace-right { flex: 1; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; padding: 12px; }

        .auto-pause-label { font-size: 11px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 5px 10px; border-radius: 6px; display: none; }
        .pill-switch { width: 90px; height: 35px; border-radius: 17.5px; background: #333; border: none; color: #888; font-weight: 900; font-size: 11px; cursor: pointer; }
        .pill-switch.active { color: var(--primary); background: #2a2a2a; border: 1.5px solid var(--primary); }

        .card-mid { grid-column: span 3; height: 90px; }
        .card-small { grid-column: span 2; height: 80px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .value-hero { font-size: 52px; color: var(--primary); font-weight: 900; line-height: 1; letter-spacing: -1px; }
        .value-std { font-size: 26px; font-weight: 900; }

        .history-nav { display: flex; justify-content: space-between; padding: 12px 8px; gap: 5px; }
        .nav-pill { flex: 1; height: 38px; border-radius: 19px; background: #2a2a2a; border: none; color: #888; font-weight: 900; font-size: 13px; cursor: pointer; }
        .nav-pill.active { background: var(--primary); color: #000; }

        .list-container { padding: 0 10px; display: flex; flex-direction: column; gap: 8px; }
        .list-card { background: var(--card-bg); border-radius: 12px; border: 1.5px solid #333; padding: 15px; }
        .list-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .list-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; }

        .action-area { position: fixed; bottom: 85px; left: 0; right: 0; padding: 0 20px; z-index: 2000; }
        .btn-main { width: 100%; height: 68px; border-radius: 34px; border: none; font-weight: 900; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #000; display: flex; border-top: 1px solid #222; z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 18px; font-weight: 900; position: relative; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: var(--primary); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-container">
        <div id="map"></div>
        <div id="status" class="gps-status">GPS INITIALIZING...</div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-pace-split">
                <div class="pace-left">
                    <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                    <div id="curPace" class="value-hero">--'--"</div>
                </div>
                <div class="pace-right">
                    <button id="dim-btn" class="pill-switch" onclick="ui.toggleDim(true)">DIM</button>
                    <button id="metro-btn" class="pill-switch" onclick="metro.toggle()">METRO OFF</button>
                </div>
            </div>
            <div class="card card-mid"><div class="label">DIST</div><div class="value-std"><span id="dist">0.00</span><span style="font-size:14px; color:var(--primary)"> KM</span></div></div>
            <div class="card card-mid"><div class="label">TIME</div><div id="time" class="value-std">00:00</div></div>
            <div class="card card-small"><div class="label">AVG</div><div id="avgPace" class="value-std" style="font-size:18px;">--'--"</div></div>
            <div class="card card-small"><div class="label">CADENCE</div><div id="cadence" class="value-std" style="font-size:18px;">0</div></div>
            <div class="card card-small"><div class="label">GCT</div><div class="value-std" style="font-size:18px;"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="pill-목록" class="nav-pill active" onclick="ui.showHistorySub('목록')">목록</button>
            <button id="pill-통계" class="nav-pill" onclick="ui.showHistorySub('통계')">통계</button>
            <button id="pill-정보" class="nav-pill" onclick="ui.showHistorySub('정보')">정보</button>
            <button id="pill-설정" class="nav-pill" onclick="ui.showHistorySub('설정')">설정</button>
        </div>
        <div class="list-container" id="record-list">
            <div class="list-card">
                <div class="list-header">
                    <span style="color:var(--primary); font-weight:900; font-size:13px;">2026/05/14, 7:24 PM</span>
                    <span style="color:var(--text-dim); font-size:11px;">ALT: -11m</span>
                </div>
                <div class="list-grid">
                    <div><div class="label">거리</div><div style="font-size:14px; font-weight:900;">5.21KM</div></div>
                    <div><div class="label">시간</div><div style="font-size:14px; font-weight:900;">25:30</div></div>
                    <div><div class="label">페이스</div><div style="font-size:14px; font-weight:900;">4'53"</div></div>
                    <div><div class="label">케이던스</div><div style="font-size:14px; font-weight:900;">182</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-area">
        <button id="btn-start" class="btn-main" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-main" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">러닝</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">기록</button>
    </div>

<script>
let map, marker, polyline, timer, isRunning = false, seconds = 0, totalDist = 0, lastPos = null, pathCoords = [];

const ui = {
    showTab: (t) => {
        document.getElementById('run-view').style.display = (t === 'run') ? 'flex' : 'none';
        document.getElementById('history-view').style.display = (t === 'history') ? 'flex' : 'none';
        document.getElementById('tab-run').classList.toggle('active', t === 'run');
        document.getElementById('tab-history').classList.toggle('active', t === 'history');
        document.querySelector('.action-area').style.display = (t === 'run') ? 'block' : 'none';
    },
    showHistorySub: (sub) => {
        // [수정] 알약 버튼 작동 로직
        const pills = ['목록', '통계', '정보', '설정'];
        pills.forEach(p => {
            const pillBtn = document.getElementById(`pill-${p}`);
            if (p === sub) {
                pillBtn.classList.add('active');
                // 나중에 여기에 각 서브 화면 전환 로직 추가
            } else {
                pillBtn.classList.remove('active');
            }
        });
        document.getElementById('record-list').style.display = (sub === '목록') ? 'flex' : 'none';
    },
    toggleDim: (s) => { 
        document.getElementById('dimmer-overlay').style.display = s ? 'flex' : 'none';
        document.getElementById('dim-btn').classList.toggle('active', s);
    }
};

const metro = {
    isOn: false, bpm: 180, audioCtx: null, nextTickTime: 0, timerId: null,
    init() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTick(time) {
        const osc = this.audioCtx.createOscillator();
        const env = this.audioCtx.createGain();
        osc.frequency.value = 1000;
        env.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        osc.connect(env); env.connect(this.audioCtx.destination);
        osc.start(time); osc.stop(time + 0.1);
    },
    scheduler() {
        while (this.nextTickTime < this.audioCtx.currentTime + 0.1) {
            this.playTick(this.nextTickTime);
            this.nextTickTime += 60.0 / this.bpm;
        }
        this.timerId = setTimeout(() => this.scheduler(), 25);
    },
    toggle() {
        this.init(); this.isOn = !this.isOn;
        const btn = document.getElementById('metro-btn');
        if (this.isOn) {
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            this.nextTickTime = this.audioCtx.currentTime; this.scheduler();
            btn.textContent = "METRO ON"; btn.classList.add('active');
        } else {
            clearTimeout(this.timerId); btn.textContent = "METRO OFF"; btn.classList.remove('active');
        }
    }
};

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    document.getElementById('status').textContent = `GPS READY: ±${acc}m | ALT: ${Math.round(p.coords.altitude || 0)}m`;
    
    if (marker) marker.setLatLng(pos);
    if (isRunning) {
        if (lastPos && acc < 50) {
            let d = map.distance(lastPos, pos) / 1000;
            if (d > 0.002 && d < 0.05) { // 엔진: GPS 필터 가드레일
                totalDist += d;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                pathCoords.push(pos); polyline.setLatLngs(pathCoords);
                lastPos = pos;
            }
        } else if (!lastPos && acc < 50) { lastPos = pos; }
    }
}

function onStart() {
    isRunning = true;
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    if (!timer) timer = setInterval(() => { seconds++; let m=Math.floor(seconds/60), s=seconds%60; document.getElementById('time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }, 1000);
}

function onStop() { location.reload(); }

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#00ff88', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
};
</script>
</body>
</html>
