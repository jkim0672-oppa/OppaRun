<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.79 (GPS Fixed)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }

        /* Sub-pages */
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING... | ALT: --m</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container"></div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, path, points = [];
let isRunning = false, watchId = null;

// Initialize Map
function initMap() {
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    path = L.polyline([], { color: '#00ff88', weight: 5 }).addTo(map);
    
    // GPS 시작
    if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, altitude } = pos.coords;
            document.getElementById('status').innerText = `GPS ACTIVE | ALT: ${altitude ? Math.round(altitude) : 0}m`;
            const latlng = [latitude, longitude];
            map.setView(latlng);
            if (isRunning) {
                points.push(latlng);
                path.setLatLngs(points);
            }
        }, err => {
            document.getElementById('status').innerText = "GPS ERROR: " + err.message;
        }, { enableHighAccuracy: true, maximumAge: 0 });
    }
}

function onStart() {
    isRunning = true;
    points = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
}

function onStop() {
    isRunning = false;
    document.getElementById('btn-start').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    // 여기에 데이터 저장 로직 추가
}

function showTab(tab) {
    document.querySelectorAll('.main-content').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tab + '-view').style.display = 'flex';
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'history') updateTotalStats();
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    document.getElementById('sub-tab-' + sub).classList.add('active');
}

function updateTotalStats() {
    const container = document.getElementById('total-stats-container');
    // 1172.jpg에서 논의했던 통계 로직 유지
    container.innerHTML = `<div style="padding:20px; text-align:center; color:#999;">통계 데이터 계산 중...</div>`;
}

window.onload = initMap;
</script>
</body>
</html>
