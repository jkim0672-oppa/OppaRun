<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.96 (Legacy Restored)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; 
            --danger: #ff4444; --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Map & Status */
        #map-area { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }

        /* Dashboard Restored from 28.80 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 15px 5px; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 110px; position: relative; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .value { font-size: 26px; font-weight: 900; }
        .value-large { font-size: 52px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        /* History List - 28.80 Layout */
        .history-card { background: #1a1a1a; border-radius: 20px; padding: 20px; margin: 12px; border: 1px solid #333; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-date { font-size: 12px; color: var(--text-dim); font-weight: 800; }
        .history-main { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
        .history-dist { font-size: 28px; font-weight: 900; }
        .history-time { font-size: 22px; font-weight: 900; color: var(--primary); }
        .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #333; padding-top: 10px; gap: 5px; }
        .grid-item { text-align: center; }
        .grid-label { font-size: 9px; color: #666; font-weight: 900; display: block; }
        .grid-val { font-size: 13px; font-weight: 900; color: #ccc; }

        /* Tabs & Controls */
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 17px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }
        
        .sub-menu { display: flex; background: #0a0a0a; border-bottom: 1px solid #222; padding: 8px; gap: 8px; }
        .sub-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #666; font-size: 12px; font-weight: 900; padding: 14px 0; border-radius: 10px; }
        .sub-btn.active { color: var(--primary); border-color: var(--primary); background: #002211; }

        .btn-act { width: 90%; height: 65px; border-radius: 35px; border: none; font-weight: 900; font-size: 22px; margin: 20px auto; display: block; }
        
        /* Views */
        .view-content { flex: 1; overflow-y: auto; display: none; padding-bottom: 100px; }
        .active-view { display: flex; flex-direction: column; }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
</div>

<div id="view-run" class="view-content active-view">
    <div class="dashboard">
        <div class="card card-main">
            <div class="label">PACE</div>
            <div id="curPace" class="value-large">--'--"</div>
            <button style="position:absolute; bottom:10px; right:10px; background:#333; color:#999; border:none; padding:6px 12px; border-radius:8px; font-size:10px; font-weight:900;">METRO OFF</button>
        </div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:12px; color:var(--primary)"> KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:12px;"> MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:12px;"> %</span></div></div>
    </div>
    <button id="btn-main" class="btn-act" style="background:var(--primary); color:#000;" onclick="handleMainBtn()">START RUNNING</button>
</div>

<div id="view-history" class="view-content">
    <div class="sub-menu">
        <button class="sub-btn active" onclick="showSub('list', this)">리스트</button>
        <button class="sub-btn" onclick="showSub('stats', this)">통계</button>
        <button class="sub-btn" onclick="showSub('info', this)">인포</button>
        <button class="sub-btn" onclick="showSub('set', this)">설정</button>
    </div>
    
    <div id="sub-list"></div>
    
    <div id="sub-stats" style="display:none; padding:20px;">
        <div class="history-card" style="text-align:center;">
            <div class="label">LIFETIME DISTANCE</div>
            <div style="font-size:40px; font-weight:900; color:var(--primary);" id="total-dist">0.0 KM</div>
        </div>
    </div>

    <div id="sub-info" style="display:none; padding:20px;">
        <div class="history-card">
            <div style="color:var(--primary); font-weight:900; font-size:18px; margin-bottom:10px;">CADENCE INFO</div>
            <div style="color:#aaa; font-size:14px; line-height:1.6;">권장 페이스: 170~185 BPM<br>이 범위 내에서 달릴 때 부상 위험이 가장 낮습니다.</div>
        </div>
    </div>

    <div id="sub-set" style="display:none; padding:20px;">
        <div class="label" style="color:var(--primary); margin-left:10px;">LANGUAGE</div>
        <div class="history-card" style="margin:5px 0 20px; padding:15px; display:flex; justify-content:space-between;">
            <span style="font-weight:800;">English / 한국어</span><span>▼</span>
        </div>
        <div class="label" style="color:var(--primary); margin-left:10px;">PROFILE</div>
        <div style="display:flex; gap:10px;">
            <div class="history-card" style="flex:1; margin:5px 0; text-align:center; font-weight:800;">175 cm</div>
            <div class="history-card" style="flex:1; margin:5px 0; text-align:center; font-weight:800;">70 kg</div>
        </div>
        <button onclick="clearAll()" style="width:100%; background:none; border:1px solid #333; color:var(--danger); padding:15px; border-radius:15px; margin-top:30px; font-weight:900;">CLEAR ALL HISTORY</button>
    </div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="switchTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="switchTab('history')">HISTORY</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>
let state = { running: false, seconds: 0, dist: 0, history: JSON.parse(localStorage.getItem('run_db') || '[]') };
let timer;

function switchTab(t) {
    document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active-view'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + t).classList.add('active-view');
    document.getElementById('tab-' + t).classList.add('active');
    if(t === 'history') updateList();
}

function showSub(s, btn) {
    ['list', 'stats', 'info', 'set'].forEach(id => document.getElementById('sub-'+id).style.display = (id === s ? 'block' : 'none'));
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(s === 'stats') {
        let total = state.history.reduce((acc, r) => acc + parseFloat(r.dist), 0);
        document.getElementById('total-dist').textContent = total.toFixed(1) + " KM";
    }
}

function handleMainBtn() {
    const btn = document.getElementById('btn-main');
    if(!state.running) {
        state.running = true;
        btn.textContent = "STOP";
        btn.style.background = "var(--danger)";
        btn.style.color = "#fff";
        timer = setInterval(() => {
            state.seconds++;
            let m = Math.floor(state.seconds/60), s = state.seconds%60;
            document.getElementById('time').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    } else {
        if(confirm("달리기를 종료하시겠습니까?")) finishRun();
    }
}

function finishRun() {
    clearInterval(timer);
    let record = {
        date: new Date().toLocaleString(),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('curPace').textContent,
        cad: '175', gct: '240', flt: '35'
    };
    state.history.unshift(record);
    localStorage.setItem('run_db', JSON.stringify(state.history));
    location.reload();
}

function updateList() {
    const cont = document.getElementById('sub-list');
    if(state.history.length === 0) {
        cont.innerHTML = '<div style="text-align:center; padding:50px; color:#444; font-weight:900;">기록이 없습니다</div>';
        return;
    }
    cont.innerHTML = state.history.map(r => `
        <div class="history-card">
            <div class="history-header"><span class="history-date">${r.date}</span></div>
            <div class="history-main">
                <span class="history-dist">${r.dist}KM</span>
                <span class="history-time">${r.time}</span>
            </div>
            <div class="history-grid">
                <div class="grid-item"><span class="grid-label">PACE</span><span class="grid-val">${r.pace}</span></div>
                <div class="grid-item"><span class="grid-label">CAD</span><span class="grid-val">${r.cad}</span></div>
                <div class="grid-item"><span class="grid-label">GCT</span><span class="grid-val">${r.gct}</span></div>
                <div class="grid-item"><span class="grid-label">FLT</span><span class="grid-val">${r.flt}%</span></div>
            </div>
        </div>
    `).join('');
}

function clearAll() { if(confirm("모든 기록을 삭제할까요?")) { localStorage.removeItem('run_db'); location.reload(); } }

window.onload = () => {
    let map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
};
</script>
</body>
</html>
