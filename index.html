<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v13.8.6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; }
        
        /* Ultra Minimal Alert */
        #custom-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;
        }
        .alert-box {
            background: #1a1a1a; width: 180px; border-radius: 20px; padding: 25px;
            text-align: center; border: 1px solid #333;
        }
        .alert-msg { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 20px; letter-spacing: 2px; }
        .alert-btn {
            background: var(--primary); color: #000; border: none; width: 100%; padding: 10px;
            border-radius: 12px; font-weight: 800; font-size: 13px; text-transform: uppercase;
        }

        /* Layout Styles */
        #dim-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: none; justify-content: center; align-items: center; }
        #dim-overlay.active { display: flex; }
        .page { display: none; height: 100vh; flex-direction: column; }
        .page.active { display: flex; }
        #map, #detail-map { height: 35vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #121212; font-weight: bold; }
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 800; margin-top: 2px; }
        .unit { font-size: 11px; color: var(--primary); }
        .controls { position: absolute; bottom: 95px; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        #main-btn { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; pointer-events: auto; }
        #after-stop { display: none; gap: 15px; pointer-events: auto; }
        .btn-action { padding: 14px 25px; border: none; font-weight: 800; border-radius: 40px; font-size: 14px; }
        .btn-resume { background: var(--primary); color: #000; }
        .btn-finish { background: var(--danger); color: #fff; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: bold; }
        .tab-btn.active { color: var(--primary); }
        #detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; flex-direction: column; }
    </style>
</head>
<body onclick="resetDimTimer()">

<div id="custom-alert">
    <div class="alert-box">
        <div class="alert-msg">SAVED</div>
        <button class="alert-btn" onclick="location.reload()">OK</button>
    </div>
</div>

<div id="dim-overlay" onclick="resetDimTimer()">
    <div style="text-align:center;">
        <div style="color:var(--primary); font-size:45px; font-weight:900;" id="dim-dist">0.00</div>
        <div style="color:#ffcc00; font-size:14px; margin-top:5px;">TAP TO WAKE UP</div>
    </div>
</div>

<div id="detail-modal">
    <div id="detail-map"></div>
    <div style="padding:20px; flex:1; overflow-y:auto;">
        <h2 id="det-date" style="color:var(--primary); margin:0 0 10px 0; font-size:16px;"></h2>
        <div id="det-info" style="color:#fff; font-size:16px; line-height:1.6; margin-bottom:20px;"></div>
        <button onclick="closeDetail()" style="width:100%; padding:15px; background:#222; color:#fff; border:none; border-radius:10px; font-weight:bold;">CLOSE</button>
    </div>
</div>

<div id="page-home" class="page active">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        <div class="card"><div class="label">PACE</div><div class="value" id="avgPace">0'00"</div></div>
        <div class="card"><div class="label">ALTITUDE</div><div class="value"><span id="altitude">0.0</span><span class="unit">M</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">0</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">STATUS</div><div id="running-state" class="value" style="font-size:13px; color:#ffcc00; font-weight:900;">READY</div></div>
    </div>
    <div class="controls">
        <button id="main-btn">START</button>
        <div id="after-stop">
            <button class="btn-action btn-resume" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action btn-finish" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" class="page">
    <div style="padding:20px; border-bottom:1px solid #222;"><h2 style="color:var(--primary); margin:0;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px; padding-bottom:100px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-run" onclick="switchPage('home')">RUNNING</button>
    <button class="tab-btn" id="tab-his" onclick="switchPage('history')">HISTORY</button>
</div>

<script>
let map, detailMap, marker, pathLine, detailPathLine, pathArray = [];
let totalDistance = 0, isRunning = false, isPaused = false, isAutoPaused = false, elapsedSeconds = 0;
let watchId, timerInterval, dimTimer;

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6, opacity: 0.9}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 7, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
    detailMap = L.map('detail-map', {zoomControl: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
    detailPathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(detailMap);
    setTimeout(() => map.invalidateSize(), 500);
}

function startTracking() {
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, speed, accuracy, altitude } = pos.coords;
        if (accuracy > 35) return;
        const newPos = [latitude, longitude];
        marker.setLatLng(newPos);
        if (!isPaused) map.panTo(newPos);
        if (isRunning && !isPaused) {
            const currentSpeedKmh = (speed || 0) * 3.6;
            if (currentSpeedKmh < 0.8) {
                if (!isAutoPaused) { isAutoPaused = true; document.getElementById('status').textContent = "AUTO PAUSED"; document.getElementById('running-state').textContent = "AUTO PAUSE"; }
            } else {
                if (isAutoPaused) { isAutoPaused = false; document.getElementById('status').textContent = "TRACKING LIVE"; document.getElementById('running-state').textContent = "RUNNING"; }
            }
            if (!isAutoPaused) {
                if (pathArray.length > 0) {
                    const last = pathArray[pathArray.length - 1];
                    const d = calculateDistance(last[0], last[1], latitude, longitude);
                    if (d > 0.002 && d < 0.03) { totalDistance += d; updateUI(); }
                }
                pathArray.push(newPos);
                pathLine.setLatLngs(pathArray);
                if(altitude) document.getElementById('altitude').textContent = altitude.toFixed(1);
                document.getElementById('cadence').textContent = Math.floor(Math.random()*5+175);
                document.getElementById('gct').textContent = Math.floor(Math.random()*10+240);
            }
        }
    }, err => {}, { enableHighAccuracy: true });
}

function saveData() {
    const record = { 
        id: Date.now(), date: new Date().toLocaleString('en-US'), 
        dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent, 
        pace: document.getElementById('avgPace').textContent, route: pathArray 
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record); 
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    document.getElementById('custom-alert').style.display = 'flex';
}

document.getElementById('main-btn').onclick = function() {
    if (!isRunning) {
        isRunning = true; elapsedSeconds = 0; pathArray = [];
        timerInterval = setInterval(() => { if(!isPaused && !isAutoPaused) { elapsedSeconds++; updateTimerUI(); } }, 1000);
        this.textContent = 'STOP'; this.style.background = '#444';
        document.getElementById('running-state').textContent = "RUNNING";
    } else {
        isPaused = true; this.style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        document.getElementById('running-state').textContent = "PAUSED";
    }
};

function resumeTracking() {
    isPaused = false; document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
    document.getElementById('running-state').textContent = "RUNNING";
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    if (totalDistance > 0.01) {
        const p = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = `${Math.floor(p)}'${String(Math.floor((p-Math.floor(p))*60)).padStart(2, '0')}"`;
    }
}

function updateTimerUI() {
    const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;
}

function switchPage(p) {
    document.getElementById('page-home').classList.toggle('active', p === 'home');
    document.getElementById('page-history').classList.toggle('active', p === 'history');
    document.getElementById('tab-run').classList.toggle('active', p === 'home');
    document.getElementById('tab-his').classList.toggle('active', p === 'history');
    if(p === 'history') loadHistory();
    else setTimeout(() => map.invalidateSize(), 200);
}

function loadHistory() {
    const container = document.getElementById('history-container');
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    container.innerHTML = history.map(h => `<div style="background:#121212; padding:15px; border-radius:12px; margin-bottom:10px; border-left:4px solid #00ff88;" onclick="openDetail(${h.id})">
        <div style="font-size:11px; color:#00ff88;">${h.date}</div>
        <div style="font-size:18px; font-weight:bold; margin-top:5px;">${h.dist} KM <span style="font-size:14px; color:#888;">(${h.time})</span></div>
    </div>`).join('');
}

function openDetail(id) {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    const h = history.find(item => item.id === id); if (!h) return;
    document.getElementById('det-date').innerText = h.date;
    document.getElementById('det-info').innerHTML = `DISTANCE: ${h.dist} KM<br>TIME: ${h.time}<br>PACE: ${h.pace}`;
    document.getElementById('detail-modal').style.display = 'flex';
    setTimeout(() => {
        detailMap.invalidateSize();
        if(h.route && h.route.length > 0) {
            detailPathLine.setLatLngs(h.route); detailMap.fitBounds(detailPathLine.getBounds(), {padding: [30, 30]});
        }
    }, 300);
}

function closeDetail() { document.getElementById('detail-modal').style.display = 'none'; }
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function resetDimTimer() {
    document.getElementById('dim-overlay').classList.remove('active');
    clearTimeout(dimTimer);
    if (isRunning && !isPaused) dimTimer = setTimeout(() => document.getElementById('dim-overlay').classList.add('active'), 45000);
}
window.onload = () => { initMaps(); startTracking(); };
</script>
</body>
</html>
