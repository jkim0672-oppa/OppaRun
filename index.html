<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.2</title>
    <style>
        /* 지도가 사라질 때 화면을 꽉 채우도록 수정 */
        #history-view { height: calc(100vh - 75px); } 
        .status-ready { color: #00ff88 !important; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS 연결 중...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">러닝 시작</button>
            </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">기록</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">누적</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
        </div>
        </div>

<script>
// [핵심] GPS 업데이트 시 상태바 연동
function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    const acc = Math.round(p.coords.accuracy);
    const statusEl = document.getElementById('status');
    
    // GPS 상태 텍스트 실시간 변경
    if (acc <= 10) {
        statusEl.innerText = `준비 완료 (±${acc}m)`;
        statusEl.className = "status-bar status-ready";
    } else {
        statusEl.innerText = `GPS 수신 중... (±${acc}m)`;
        statusEl.className = "status-bar";
    }
    // ... 나머지 지도 업데이트 로직 ...
}

// [핵심] 탭 전환 시 지도 영역 완전 제거
function showTab(tab) {
    const isRun = (tab === 'run');
    document.getElementById('run-view').style.display = isRun ? 'flex' : 'none';
    document.getElementById('map-area').style.display = isRun ? 'block' : 'none'; // 기록 페이지에선 지도 숨김
    document.getElementById('history-view').style.display = isRun ? 'none' : 'flex';
    
    document.getElementById('tab-run').className = 'tab-btn' + (isRun ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (isRun ? '' : ' active');
    
    if(isRun) setTimeout(() => map.invalidateSize(), 200);
}

// (원본의 소리 나는 오디오 엔진 로직 그대로 유지)
</script>
</body>
</html>
