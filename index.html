<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppa Run - Final Custom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        #map { flex: 1.5; border-bottom: 2px solid #222; }
        .gps-status { background: #000; color: #FFD700; text-align: center; padding: 5px; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #222; }
        .dashboard { flex: 2; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; flex: 1; }
        .box { background: #111; border-radius: 15px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 1.5rem; font-weight: bold; }
        .unit { font-size: 0.8rem; color: #00FF00; margin-left: 3px; }
        .pace-box { background: #000; border: 2px solid #00FF00; border-radius: 15px; flex: 0.8; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .pace-box .label { color: #00FF00; }
        .pace-box .value { font-size: 2.5rem; color: #00FF00; }
        .controls-row { display: flex; justify-content: space-around; align-items: center; flex: 1.2; position: relative; }
        .start-btn { 
            width: 90px; height: 90px; background: #FF453A; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; font-size: 1.1rem; color: #fff; border: none;
            box-shadow: 0 0 20px rgba(255, 69, 58, 0.4); z-index: 10;
        }
        .dynamics-info { font-size: 0.7rem; color: #007AFF; margin-top: 5px; font-weight: bold; }
        .tab-menu { display: flex; border-top: 1px solid #222; padding: 10px 0; }
        .tab-item { flex: 1; text-align: center; color: #00FF00; font-size: 0.9rem; font-weight: bold; }
        .tab-item.history { color: #888; }
        
        /* 히스토리 오버레이 (디자인 유지용) */
        #historyOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; padding: 20px; overflow-y: auto; }
        .history-item { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #222; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="map"></div>
    <div class="gps-status" id="gpsStatus">GPS READY</div>

    <div class="dashboard">
        <div class="row">
            <div class="box">
                <div class="label">Distance</div>
                <div class="value" id="distDisplay">0.00<span class="unit">KM</span></div>
            </div>
            <div class="box">
                <div class="label">Time</div>
                <div class="value" id="timeDisplay">00:00:00</div>
            </div>
        </div>

        <div class="pace-box">
            <div class="label">CURRENT PACE</div>
            <div class="value" id="paceDisplay">--'--"</div>
            <div id="kcalDisplay" style="font-size: 0.9rem; color: #888;">0 kcal</div>
        </div>

        <div class="controls-row">
            <div style="text-align: center;">
                <div class="label">AVG PACE</div>
                <div class="value" id="avgPaceDisplay" style="font-size: 1rem;">--'--"</div>
            </div>

            <button class="start-btn" id="mainBtn" onclick="toggleRun()">START</button>

            <div style="text-align: center;">
                <div class="label">CADENCE</div>
                <div class="value" id="cadenceDisplay" style="font-size: 1.2rem;">0<span class="unit">SPM</span></div>
            </div>
        </div>
        
        <div style="text-align: center; padding-bottom: 5px;">
            <div class="dynamics-info">Target GCT: 180 - 240ms</div>
            <div id="gctLive" style="font-size: 0.6rem; color: #555;">Live GCT: -- ms</div>
        </div>
    </div>

    <div class="tab-menu">
        <div class="tab-item">RUNNING</div>
        <div class="tab-item history" onclick="showHistory()">HISTORY</div>
    </div>
</div>

<div id="historyOverlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color:#00FF00;">HISTORY</h2>
        <button onclick="closeHistory()" style="background:none; border:1px solid #555; color:#fff; padding:5px 15px; border-radius:10px;">CLOSE</button>
    </div>
    <div id="historyList"></div>
</div>

<script>
    let map, path, watchId, timerInterval, startTime;
    let running = false;
    let distance = 0, lastPos = null;
    const weight = 75; // 오빠의 체중 기준

    // 지도 설정
    map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    path = L.polyline([], { color: '#00FF00', weight: 5 }).addTo(map);

    function toggleRun() {
        const btn = document.getElementById('mainBtn');
        if (!running) {
            // START 시작
            running = true;
            btn.innerText = "STOP";
            btn.style.background = "#555"; // 멈춤 느낌
            distance = 0; lastPos = null; path.setLatLngs([]);
            startTime = Date.now();
            timerInterval = setInterval(updateUI, 1000);
            startTracking();
        } else {
            // STOP 클릭
            if(confirm("기록을 저장하고 종료할까요?")) {
                stopRun();
            }
        }
    }

    function startTracking() {
        watchId = navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            document.getElementById('gpsStatus').innerText = `GPS ACTIVE (±${Math.round(accuracy)}m)`;
            const currentPos = [latitude, longitude];
            if (lastPos) {
                const d = map.distance(lastPos, currentPos);
                if (d > 2) { 
                    distance += d; 
                    path.addLatLng(currentPos); 
                    map.panTo(currentPos); 
                }
            }
            lastPos = currentPos;
            // 시뮬레이션용 GCT 데이터
            document.getElementById('gctLive').innerText = `Live GCT: ${Math.floor(Math.random() * (250 - 180) + 180)} ms`;
        }, null, { enableHighAccuracy: true });
    }

    function updateUI() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
        const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `${h}:${m}:${s}`;

        const distKm = (distance / 1000).toFixed(2);
        document.getElementById('distDisplay').innerHTML = `${distKm}<span class="unit">KM</span>`;
        document.getElementById('kcalDisplay').innerText = `${(weight * distKm).toFixed(1)} kcal`;

        if (distance > 5) {
            const paceMin = (elapsed / 60) / (distance / 1000);
            const pM = Math.floor(paceMin);
            const pS = String(Math.floor((paceMin - pM) * 60)).padStart(2, '0');
            document.getElementById('paceDisplay').innerText = `${pM}'${pS}"`;
            document.getElementById('avgPaceDisplay').innerText = `${pM}'${pS}"`;
        }
    }

    function stopRun() {
        running = false;
        clearInterval(timerInterval);
        navigator.geolocation.clearWatch(watchId);
        
        const record = {
            date: new Date().toLocaleString(),
            dist: (distance / 1000).toFixed(2) + "KM",
            time: document.getElementById('timeDisplay').innerText,
            kcal: document.getElementById('kcalDisplay').innerText
        };
        let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        history.unshift(record);
        localStorage.setItem('runHistory', JSON.stringify(history));
        
        location.reload(); 
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem('runHistory') || '[]');
        const list = document.getElementById('historyList');
        list.innerHTML = history.map((item, index) => `
            <div class="history-item">
                <div><div style="font-size:0.7rem; color:#888;">${item.date}</div><strong>${item.dist} / ${item.time}</strong></div>
                <div onclick="deleteHistory(${index})" style="color:#FF453A; font-weight:bold; padding:10px;">X</div>
            </div>`).join('');
        document.getElementById('historyOverlay').style.display = 'block';
    }

    function deleteHistory(index) {
        if (confirm('이 기록을 삭제할까요?')) {
            let history = JSON.parse(localStorage.getItem('runHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('runHistory', JSON.stringify(history));
            showHistory();
        }
    }
    function closeHistory() { document.getElementById('historyOverlay').style.display = 'none'; }
</script>

</body>
</html>
