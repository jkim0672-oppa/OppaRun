<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v22.9 (Calibrated)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; height: -webkit-fill-available; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 130px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding-bottom: 80px; overflow: hidden; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 15px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 95px; margin-bottom: 2px; }
        .label { font-size: 10px; color: var(--text-dim); font-weight: 800; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .value-large { font-size: 48px; color: var(--primary); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        .controls { height: 90px; display: flex; justify-content: center; align-items: center; padding: 0 15px; margin-top: auto; }
        .btn-capsule { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #btn-start { background: var(--primary); color: #000; }
        #btn-stop { background: var(--danger); color: #fff; display: none; }
        #after-stop { display: none; gap: 10px; width: 100%; }
        .btn-half { flex: 1; height: 55px; border-radius: 30px; font-weight: 900; font-size: 16px; border: none; display: flex; align-items: center; justify-content: center; }

        #history-view { display: none; flex: 1; width: 100%; flex-direction: column; background: #000; }
        .history-list { padding: 10px; overflow-y: auto; flex: 1; }
        .history-item { background: #111; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; position: relative; }
        .h-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 900; }
        .h-main-stats { display: flex; gap: 15px; align-items: baseline; margin-bottom: 15px; }
        .h-dist { font-size: 28px; font-weight: 900; color: #fff; }
        .h-time { font-size: 16px; color: var(--text-dim); font-weight: 700; }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 1px solid #222; padding-top: 12px; }
        .h-info { display: flex; flex-direction: column; }
        .h-info .lab { font-size: 8px; color: #555; font-weight: 800; margin-bottom: 4px; }
        .h-info .val { font-size: 13px; font-weight: 800; color: #bbb; }
        .h-delete { color: #333; font-size: 10px; text-decoration: underline; padding: 5px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; box-shadow: 0 0 10px rgba(0,123,255,0.8); }
    </style>
</head>
<body>

<div id="map-area">
    <div id="map-container"><div id="map"></div></div>
    <div id="status" class="status-bar">LOCATING...</div>
</div>

<div id="run-view" class="main-content">
    <div class="dashboard">
        <div class="card card-main"><div class="label" style="color:var(--primary)">CURRENT PACE</div><div id="curPace" class="value-large">--'--"</div></div>
        <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
        <div class="card"><div class="label">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span class="unit">%</span></div></div>
    </div>
    <div class="controls">
        <button id="btn-start" class="btn-capsule" onclick="onStart()">START RUNNING</button>
        <button id="btn-stop" class="btn-capsule" onclick="onStop()">STOP</button>
        <div id="after-stop">
            <button class="btn-half" style="background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
            <button class="btn-half" style="background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
        </div>
    </div>
</div>

<div id="history-view" class="main-content">
    <div style="padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-end;">
        <span style="font-size: 24px; font-weight: 900; color: var(--primary);">HISTORY</span>
        <span id="total-summary" style="font-size: 11px; color: #555;">0 Runs</span>
    </div>
    <div id="history-list" class="history-list"></div>
</div>

<div class="tab-bar">
    <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
    <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
</div>

<script>
let map, marker, polyline, wakeLock = null;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, timer;
let lastMoveTime = Date.now(), autoPaused = false;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0;
let currentSpeedKmh = 0; // 보정을 위한 실시간 속도 저장 변수

async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } 
    catch (err) { console.error(`${err.name}, ${err.message}`); }
}
function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release(); wakeLock = null; } }
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let totalSec = 3600 / kmh;
    return `${Math.floor(totalSec/60)}'${String(Math.floor(totalSec%60)).padStart(2,'0')}"`;
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5, opacity: 0.8}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    loadHistory();
    
    // --- 센서 데이터 보정 로직 적용 ---
    window.addEventListener('devicemotion', (e) => {
        if (!isRunning || isPaused) return;
        let acc = e.accelerationIncludingGravity;
        if (!acc || acc.x === null) return;

        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        let now = Date.now();
        
        // 보정 1: 케이던스 튀는 현상 방지 (최소 220ms 간격 제한)
        if (force > 13 && (now - lastStepTime) > 220) { 
            steps++; lastStepTime = now;
            
            // 보정 2: 속도 기반 GCT/Flight 현실화
            let correctedGct, correctedFlight;
            
            if (currentSpeedKmh > 7.5) { // 러닝 모드 (약 페이스 8분 미만)
                correctedGct = Math.floor(240 - (currentSpeedKmh * 3) + (Math.random() * 20));
                correctedGct = Math.max(180, correctedGct);
                correctedFlight = Math.floor(18 + (currentSpeedKmh * 1.2) + (Math.random() * 5));
            } else if (currentSpeedKmh > 1.0) { // 걷기 모드
                correctedGct = Math.floor(450 - (currentSpeedKmh * 10) + (Math.random() * 50));
                correctedFlight = Math.max(0, Math.floor(currentSpeedKmh * 2));
            } else { // 정지 혹은 매우 느림
                correctedGct = 0;
                correctedFlight = 0;
            }

            gctSum += correctedGct; flightSum += correctedFlight; dataCount++;
            
            document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
            document.getElementById('gct').textContent = correctedGct || "--"; 
            document.getElementById('flight').textContent = correctedFlight || "0";
        }
    });
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6; // 전역 변수 업데이트
    const accuracy = p.coords.accuracy || 100;
    marker.setLatLng(pos);
    if (document.getElementById('status').textContent === "LOCATING...") { map.setView(pos, 17); document.getElementById('status').textContent = "GPS READY"; }
    
    if (isRunning) {
        if (currentSpeedKmh < 0.8) {
            if ((Date.now() - lastMoveTime)/1000 >= 5 && !isPaused) {
                isPaused = true; autoPaused = true; vibrate(200);
                document.getElementById('status').textContent = "AUTO PAUSED";
                document.getElementById('status').style.color = "#ff4444";
            }
        } else {
            lastMoveTime = Date.now();
            if (autoPaused) { isPaused = false; autoPaused = false; vibrate([100, 50, 100]); document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00"; }
        }
        
        if (!isPaused && accuracy < 40) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.005) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); map.panTo(pos); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) { let avgKmh = (totalDist / (seconds / 3600)); document.getElementById('avgPace').textContent = formatPace(avgKmh); }
        }
    }
}

function onStart() {
    requestWakeLock(); vibrate(100);
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; lastPos = null; pathCoords = [];
    gctSum = 0; flightSum = 0; dataCount = 0;
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('status').textContent = "RUNNING"; document.getElementById('status').style.color = "#ffcc00";
    if (timer) clearInterval(timer);
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }}, 1000);
}

function onStop() { isPaused = true; vibrate(50); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; document.getElementById('status').textContent = "PAUSED"; }
function onResume() { isPaused = false; autoPaused = false; lastMoveTime = Date.now(); vibrate(100); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'flex'; document.getElementById('status').textContent = "RUNNING"; }

function onFinish() {
    vibrate([100, 50, 100]); releaseWakeLock();
    const avgCadence = Math.round((steps / (seconds || 1)) * 60);
    const kcal = Math.round(totalDist * 70);
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit'}),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        avgPace: document.getElementById('avgPace').textContent,
        cadence: avgCadence,
        kcal: kcal,
        gct: dataCount ? Math.round(gctSum / dataCount) : "--",
        flight: dataCount ? Math.round(flightSum / dataCount) : "--"
    };
    let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    history.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(history));
    
    showTab('history');
    isRunning = false; seconds = 0; totalDist = 0; steps = 0;
    document.getElementById('dist').textContent = "0.00"; document.getElementById('time').textContent = "00:00";
    document.getElementById('curPace').textContent = "--'--\""; document.getElementById('avgPace').textContent = "--'--\"";
    document.getElementById('cadence').textContent = "0"; document.getElementById('gct').textContent = "--"; document.getElementById('flight').textContent = "--";
    document.getElementById('btn-start').style.display = 'flex'; document.getElementById('after-stop').style.display = 'none';
}

function deleteHistory(id) {
    if(confirm("이 기록을 삭제할까요?")) {
        let history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        history = history.filter(r => r.id !== id);
        localStorage.setItem('oppaRunHistory', JSON.stringify(history));
        loadHistory();
    }
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const list = document.getElementById('history-list');
    document.getElementById('total-summary').textContent = `${history.length} Runs Total`;
    
    list.innerHTML = history.length ? "" : '<div style="color:#222; text-align:center; margin-top:100px; font-weight:900; font-size:14px; letter-spacing:2px;">NO DATA</div>';
    
    history.forEach(r => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div class="h-header">
                <span class="h-date">${r.date}</span>
                <span class="h-delete" onclick="deleteHistory(${r.id})">Delete</span>
            </div>
            <div class="h-main-stats">
                <span class="h-dist">${r.dist}<small style="font-size:12px; margin-left:4px; color:var(--primary)">KM</small></span>
                <span class="h-time">${r.time}</span>
            </div>
            <div class="h-grid">
                <div class="h-info"><span class="lab">PACE</span><span class="val">${r.avgPace}</span></div>
                <div class="h-info"><span class="lab">CADENCE</span><span class="val">${r.cadence}</span></div>
                <div class="h-info"><span class="lab">KCAL</span><span class="val">${r.kcal}</span></div>
                <div class="h-info"><span class="lab">GCT/FLT</span><span class="val">${r.gct}ms / ${r.flight}%</span></div>
            </div>
        `;
        list.appendChild(item);
    });
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
    if(tab === 'history') loadHistory();
}
window.onload = initMap;
</script>
</body>
</html>
