<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.30 (Real-time Color Feedback)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 8px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #333; position: relative; }
        .h-date { font-size: 13px; color: var(--primary); font-weight: 900; margin-bottom: 8px; letter-spacing: 0.5px; }
        .h-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; }
        .btn-h-sub { background: #1a1a1a; border: 1px solid #444; color: var(--primary); font-size: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 900; cursor: pointer; }
        .info-card { background: #111; border: 1.5px solid #222; border-radius: 15px; padding: 20px; margin: 10px 15px; }
        .info-title { color: var(--primary); font-weight: 900; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .info-body { color: #ccc; font-size: 13px; line-height: 1.6; font-weight: 600; }
        .info-highlight { color: #fff; font-weight: 800; border-bottom: 1px solid var(--primary); }
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; }
        #diag-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 20000; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 40px; }
        #detail-map { height: 50%; width: 100%; border-bottom: 1px solid #222; }
        #detail-data { height: 50%; width: 100%; padding: 20px; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; }
        .diag-header { padding: 60px 20px 20px; border-bottom: 1px solid #222; }
        .diag-card { background: #111; margin: 10px 15px; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .diag-score-label { font-size: 10px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .diag-status { font-weight: 900; font-size: 14px; margin-bottom: 10px; }
        .diag-advice { font-size: 13px; color: #ccc; line-height: 1.5; border-left: 3px solid var(--primary); padding-left: 10px; }
        .settings-container { padding: 20px; }
        .settings-group { margin-bottom: 25px; }
        .settings-label { font-size: 11px; color: var(--primary); font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        .dropdown { position: relative; width: 100%; }
        .dropdown-select { background: #1a1a1a; color: #fff; border: 1.5px solid #333; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .dropdown-options { display: none; position: absolute; top: 105%; left: 0; width: 100%; background: #1a1a1a; border: 1.5px solid #333; border-radius: 12px; z-index: 1000; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .dropdown-option { padding: 18px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #222; cursor: pointer; }
        .dropdown-option:last-child { border-bottom: none; }
        .dropdown-option:active { background: #333; color: var(--primary); }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        .total-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map"></div>
        <div id="detail-data"></div>
    </div>

    <div id="diag-view">
        <button class="close-detail" onclick="ui.closeDiag()">CLOSE</button>
        <div id="diag-content-area"></div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="ui.showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-container" class="total-container"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="info-card"><div class="info-title"><span>⏱️</span> CADENCE</div><div class="info-body">권장 170~185 BPM.</div></div>
            <div class="info-card"><div class="info-title"><span>🍑</span> POWER</div><div class="info-body">고관절과 둔근 활용.</div></div>
            <div class="info-card"><div class="info-title"><span>👟</span> STRIKE</div><div class="info-body">미드풋과 무게중심.</div></div>
            <div class="info-card"><div class="info-title"><span>🔄</span> ROLLING</div><div class="info-body">부드러운 힘의 전환.</div></div>
        </div>
        <div id="sub-page-settings" class="sub-page">
            <div class="settings-container">
                <div class="settings-group">
                    <div id="label-select-lang" class="settings-label">SELECT LANGUAGE</div>
                    <div class="dropdown">
                        <div class="dropdown-select" onclick="ui.toggleDropdown()">
                            <span id="current-lang-text">English (US)</span><span style="font-size:10px; color:var(--primary);">▼</span>
                        </div>
                        <div id="dropdown-options" class="dropdown-options">
                            <div class="dropdown-option" onclick="ui.selectLang('en')">English (US)</div>
                            <div class="dropdown-option" onclick="ui.selectLang('ko')">한국어 (KR)</div>
                        </div>
                    </div>
                </div>
                <button id="btn-clear-history" style="background:#1a1a1a; color:var(--danger); border:1.5px solid #333; padding:18px; border-radius:12px; width:100%; font-weight:900; font-size:14px; margin-top:20px;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let detailMap = null, detailPolyline = null, wakeLock = null, lowSpeedStartTime = null;

const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", info: "INFO", settings: "SETTINGS", selLang: "SELECT LANGUAGE", clear: "CLEAR ALL HISTORY", confirmClear: "Are you sure?", alertCleared: "History cleared.", route: "ROUTE", diag: "DIAG", close: "CLOSE" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", info: "정보", settings: "설정", selLang: "언어 설정", clear: "전체 기록 삭제", confirmClear: "정말로 모든 기록을 삭제할까요?", alertCleared: "기록이 삭제되었습니다.", route: "경로", diag: "진단", close: "닫기" }
};

const storage = {
    key: 'oppaRunHistory',
    saveRecord: (record) => {
        let h = storage.loadHistory();
        h.unshift(record);
        localStorage.setItem(storage.key, JSON.stringify(h));
    },
    loadHistory: () => JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"),
    clearHistory: () => {
        const lang = localStorage.getItem('oppaRunLang') || 'en';
        if(confirm(translations[lang].confirmClear)) {
            localStorage.removeItem(storage.key);
            ui.updateHistoryList();
            ui.updateTotalStats();
            alert(translations[lang].alertCleared);
        }
    }
};

const control = {
    formatPace: (kmh) => { 
        if (!kmh || kmh < 0.5) return "--'--\""; 
        let s = 3600 / kmh; 
        return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; 
    },
    runDiagnosis: (id) => {
        const h = storage.loadHistory();
        const r = h.find(item => item.id === id);
        if (!r) return;
        const lang = localStorage.getItem('oppaRunLang') || 'en';
        const isKo = lang === 'ko';
        const cad = parseInt(r.cadence) || 0;
        const gct = parseInt(r.gct) || 0;
        const flt = parseInt(r.flight) || 0;
        let cadStat = cad >= 170 ? (isKo ? "최상" : "EXCELLENT") : (cad >= 160 ? (isKo ? "보통" : "GOOD") : (isKo ? "주의" : "LOW"));
        let cadColor = cad >= 170 ? "var(--primary)" : (cad >= 160 ? "var(--warning)" : "var(--danger)");
        let gctStat = gct <= 240 && gct > 0 ? (isKo ? "우수" : "ELITE") : (gct <= 280 ? (isKo ? "보통" : "GOOD") : (isKo ? "느림" : "HEAVY"));
        let gctColor = gct <= 240 ? "var(--primary)" : (gct <= 280 ? "var(--warning)" : "var(--danger)");
        let fltStat = flt >= 15 ? (isKo ? "높음" : "HIGH") : (flt >= 8 ? (isKo ? "보통" : "MID") : (isKo ? "낮음" : "LOW"));
        return { r, cad, cadStat, cadColor, gct, gctStat, gctColor, flt, fltStat, isKo };
    }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sub-tab-' + sub).classList.add('active');
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
        if(sub === 'list') ui.updateHistoryList();
        if(sub === 'total') ui.updateTotalStats();
    },
    changeLanguage: (lang) => {
        const t = translations[lang];
        ['pace','dist','time','avg','cadence','gct','flight'].forEach(id => {
            const el = document.getElementById('label-'+id);
            if(el) el.textContent = t[id];
        });
        document.getElementById('btn-start').textContent = t.start;
        document.getElementById('btn-stop').textContent = t.stop;
        document.getElementById('btn-resume').textContent = t.resume;
        document.getElementById('btn-finish').textContent = t.finish;
        document.getElementById('tab-run').textContent = t.run;
        document.getElementById('tab-history').textContent = t.history;
        document.getElementById('sub-tab-list').textContent = t.list;
        document.getElementById('sub-tab-total').textContent = t.total;
        document.getElementById('sub-tab-info').textContent = t.info;
        document.getElementById('sub-tab-settings').textContent = t.settings;
        document.getElementById('label-select-lang').textContent = t.selLang;
        document.getElementById('btn-clear-history').textContent = t.clear;
        document.getElementById('current-lang-text').textContent = (lang === 'ko' ? "한국어 (KR)" : "English (US)");
        localStorage.setItem('oppaRunLang', lang);
    },
    toggleDim: (show) => { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; },
    toggleDropdown: () => { const opt = document.getElementById('dropdown-options'); opt.style.display = (opt.style.display==='block'?'none':'block'); },
    selectLang: (lang) => { ui.changeLanguage(lang); ui.toggleDropdown(); },
    updateHistoryList: () => {
        const h = storage.loadHistory();
        const lang = localStorage.getItem('oppaRunLang') || 'en';
        const t = translations[lang];
        const listDiv = document.getElementById('history-list');
        if (h.length === 0) { listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#444; font-weight:900;">NO RECORDS</div>'; return; }
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-actions">
                    <button class="btn-h-sub" onclick="ui.openDetail(${r.id})">${t.route}</button>
                    <button class="btn-h-sub" onclick="ui.openDiag(${r.id})">${t.diag}</button>
                </div>
                <div style="font-size:24px; font-weight:900; margin-bottom:12px;">${r.dist}KM <span style="color:var(--primary); font-size:18px; margin-left:12px;">${r.time}</span></div>
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:10px; border-top:1.5px solid #444; padding-top:12px;">
                    <div style="text-align:center;"><div style="font-size:9px; color:#aaa;">PACE</div><div style="color:#fff; font-size:14px; font-weight:900;">${r.pace}</div></div>
                    <div style="text-align:center;"><div style="font-size:9px; color:#aaa;">CAD</div><div style="color:#fff; font-size:14px; font-weight:900;">${r.cadence}</div></div>
                    <div style="text-align:center;"><div style="font-size:9px; color:#aaa;">KCAL</div><div style="color:#fff; font-size:14px; font-weight:900;">${r.kcal}</div></div>
                    <div style="text-align:center;"><div style="font-size:9px; color:#aaa;">GCT/FLT</div><div style="color:#fff; font-size:11px; font-weight:900;">${r.gct}/${r.flight}%</div></div>
                </div>
            </div>`).join('');
    },
    updateTotalStats: () => {
        const h = storage.loadHistory();
        let tDist = 0;
        h.forEach(r => { tDist += parseFloat(r.dist)||0; });
        document.getElementById('total-stats-container').innerHTML = `<div style="font-size:20px; font-weight:900; color:var(--primary); margin-bottom:20px; text-align:center;">TOTAL STATS</div><div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><div class="card"><div class="label">DISTANCE</div><div class="value">${tDist.toFixed(2)} KM</div></div><div class="card"><div class="label">RUNS</div><div class="value">${h.length}</div></div></div>`;
    },
    openDetail: (id) => {
        const h = storage.loadHistory(); const record = h.find(r => r.id === id); if (!record) return;
        document.getElementById('detail-view').style.display = 'flex';
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (record.path && record.path.length > 0) {
            detailPolyline = L.polyline(record.path, {color: '#007bff', weight: 5}).addTo(detailMap);
            detailMap.fitBounds(detailPolyline.getBounds());
        }
        document.getElementById('detail-data').innerHTML = `<div style="color:var(--primary); font-size:18px; font-weight:900; margin-bottom:20px;">ROUTE</div><div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;"><div class="card"><div class="label">DIST</div><div class="value">${record.dist} KM</div></div><div class="card"><div class="label">PACE</div><div class="value">${record.pace}</div></div></div>`;
    },
    closeDetail: () => document.getElementById('detail-view').style.display = 'none',
    openDiag: (id) => {
        const d = control.runDiagnosis(id); if (!d) return;
        document.getElementById('diag-view').style.display = 'flex';
        document.getElementById('diag-content-area').innerHTML = `
            <div class="diag-header"><div style="font-size:22px; font-weight:900; color:var(--primary);">${d.isKo?"정밀 진단":"DIAGNOSIS"}</div></div>
            <div class="diag-card"><div class="diag-score-label">CADENCE</div><div class="diag-status" style="color:${d.cadColor}">${d.cad} BPM - ${d.cadStat}</div></div>
            <div class="diag-card"><div class="diag-score-label">GCT</div><div class="diag-status" style="color:${d.gctColor}">${d.gct} MS - ${d.gctStat}</div></div>
            <div class="diag-card" style="border:1px solid var(--primary);"><div class="diag-score-label" style="color:var(--primary)">PRESCRIPTION</div><div style="font-size:13px; font-weight:700;">${d.isKo?"가자미근의 탄력을 활용하세요.":"Use soleus elasticity."}</div></div>`;
    },
    closeDiag: () => document.getElementById('diag-view').style.display = 'none'
};

async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    currentSpeedKmh = (p.coords.speed || 0) * 3.6; 
    const accuracy = Math.round(p.coords.accuracy);
    const statusEl = document.getElementById('status');
    if (accuracy > 30) {
        statusEl.style.color = "var(--danger)";
        statusEl.textContent = `LOW ACCURACY: ±${accuracy}m (WAITING...)`;
    } else {
        statusEl.style.color = "var(--warning)";
        statusEl.textContent = `GPS READY: ±${accuracy}m`;
    }
    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 2.0) { 
            if (!lowSpeedStartTime) lowSpeedStartTime = Date.now(); 
            if ((Date.now() - lowSpeedStartTime) > 1000 && !isAutoPaused) { 
                isAutoPaused = true; 
                document.getElementById('pause-status').style.display = 'block'; 
            } 
        } else { 
            lowSpeedStartTime = null; 
            if (isAutoPaused) { 
                isAutoPaused = false; 
                document.getElementById('pause-status').style.display = 'none'; 
            } 
        }
        if (!isAutoPaused && p.coords.accuracy < 50) {
            if (lastPos) {
                let d = (function(p1,p2){ const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180; const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); })(lastPos, pos);
                if (d > 0.001) { 
                    totalDist += d; 
                    document.getElementById('dist').textContent = totalDist.toFixed(2); 
                    lastPos = pos; 
                    pathCoords.push(pos); 
                    polyline.setLatLngs(pathCoords); 
                }
            } else lastPos = pos;
            document.getElementById('curPace').textContent = control.formatPace(currentSpeedKmh);
            if (totalDist > 0 && seconds > 0) document.getElementById('avgPace').textContent = control.formatPace(totalDist / (seconds / 3600));
        }
    } else {
        map.panTo(pos);
    }
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        let currentCadence = Math.round((steps/(seconds||1))*60);
        let speed = currentSpeedKmh;
        let currentGCT = speed > 0.5 ? Math.floor(450 - (speed * 10)) : 0;
        let currentFlight = speed > 2.0 ? Math.floor(5 + (speed * 2.1)) : 0;
        
        // [실시간 색상 업데이트 로직 추가]
        const cadEl = document.getElementById('cadence');
        const gctEl = document.getElementById('gct');
        const fltEl = document.getElementById('flight');

        cadEl.textContent = currentCadence;
        cadEl.parentElement.style.color = currentCadence >= 170 ? "var(--primary)" : (currentCadence >= 160 ? "var(--warning)" : "var(--danger)");

        if (currentGCT > 0) {
            gctEl.textContent = currentGCT;
            gctEl.parentElement.style.color = currentGCT <= 240 ? "var(--primary)" : (currentGCT <= 280 ? "var(--warning)" : "var(--danger)");
        } else { gctEl.textContent = "--"; gctEl.parentElement.style.color = "var(--text-main)"; }

        if (currentFlight > 0) {
            fltEl.textContent = currentFlight;
            fltEl.parentElement.style.color = currentFlight >= 15 ? "var(--primary)" : (currentFlight >= 8 ? "var(--warning)" : "var(--danger)");
        } else { fltEl.textContent = "--"; fltEl.parentElement.style.color = "var(--text-main)"; }
    }
}

function onStart() {
    requestWakeLock(); isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    if (wakeLock) wakeLock.release();
    const record = { id: Date.now(), date: new Date().toLocaleString(), dist: document.getElementById('dist').textContent, time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: document.getElementById('cadence').textContent, kcal: Math.round(totalDist * 65), gct: document.getElementById('gct').textContent, flight: document.getElementById('flight').textContent, path: pathCoords };
    storage.saveRecord(record); location.reload();
}

window.onload = () => {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([33.7701, -117.9143], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:12px; height:12px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    ui.changeLanguage(localStorage.getItem('oppaRunLang') || 'en');
};
document.getElementById('dimmer-overlay').onclick = () => ui.toggleDim(false);
</script>
