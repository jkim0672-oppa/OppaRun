<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.4.0 (Advanced Stats)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --good: #00ff88;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; letter-spacing: 0.5px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; transition: border-color 0.3s ease; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        /* TOTAL PAGE STYLES - Updated to Match Image */
        .total-container { padding: 10px 15px; }
        .filter-row { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .filter-btn { padding: 8px 20px; border-radius: 20px; background: #2a2a2a; color: #666; font-size: 11px; font-weight: 900; border: none; }
        .filter-btn.active { background: var(--primary); color: #000; }
        
        .total-main-card { border: 2px solid var(--primary); border-radius: 15px; padding: 25px; text-align: center; margin-bottom: 15px; }
        .total-main-label { font-size: 10px; color: var(--text-dim); font-weight: 900; letter-spacing: 1px; margin-bottom: 10px; }
        .total-main-val { font-size: 42px; color: var(--primary); font-weight: 900; }
        .total-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .total-sub-card { background: #1a1a1a; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        .total-sub-label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 5px; }
        .total-sub-val { font-size: 18px; font-weight: 900; color: #fff; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        /* Existing utility styles */
        #detail-view, #diag-view, #metronome-view { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 75px); background: var(--bg); z-index: 5000; display: none; flex-direction: column; overflow-y: auto; }
        .close-detail { position: absolute; top: 20px; right: 20px; z-index: 20001; background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 12px; }
        .btn-quick-metro { position: absolute; bottom: 10px; right: 10px; background: #333; border: 1px solid #444; color: #999; font-size: 10px; padding: 7px 11px; border-radius: 8px; font-weight: 900; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        .metro-slider { width: 100%; accent-color: var(--primary); margin: 10px 0; height: 4px; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; text-align: center;">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="detail-view">
        <button class="close-detail" onclick="ui.closeDetail()">CLOSE</button>
        <div id="detail-map" style="height: 40%;"></div>
        <div id="detail-data"></div>
    </div>

    <div id="metronome-view">
        <button class="close-detail" onclick="ui.closeMetronome()">CLOSE</button>
        <div style="padding: 60px 20px 20px;">
            <h2 id="metro-title" style="color:var(--primary)">METRONOME</h2>
            <div class="card" style="padding: 20px;">
                <div id="metro-bpm-val" style="font-size:40px; color:var(--primary); font-weight:900;">175</div>
                <input type="range" id="metro-bpm" class="metro-slider" min="140" max="200" value="175" oninput="metro.updateDisplay()">
                <button id="btn-metro-toggle" class="btn-act" style="background:var(--primary); color:#000; margin-top:20px;" onclick="metro.toggle()">START</button>
            </div>
        </div>
    </div>

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" id="label-pace" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button id="quick-metro" class="btn-quick-metro" onclick="metro.toggle()">METRO OFF</button>
            </div>
            <div class="card"><div class="label" id="label-dist">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label" id="label-time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" id="label-avg">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div id="card-cadence" class="card"><div class="label" id="label-cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div id="card-gct" class="card"><div class="label" id="label-gct">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div id="card-flight" class="card"><div class="label" id="label-flight">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="app.onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="app.onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="app.onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="app.onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="ui.showSubTab('settings')">SETTINGS</button>
        </div>
        
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        
        <div id="sub-page-total" class="sub-page">
            <div class="total-container">
                <div class="filter-row">
                    <button class="filter-btn active">ALL</button>
                    <button class="filter-btn">MONTH</button>
                    <button class="filter-btn">WEEK</button>
                </div>
                <div class="total-main-card">
                    <div class="total-main-label">ALL DISTANCE</div>
                    <div id="stat-total-dist" class="total-main-val">0.00 KM</div>
                </div>
                <div class="total-grid" id="total-stats-grid">
                    </div>
            </div>
        </div>

        <div id="sub-page-settings" class="sub-page">
            <div style="padding: 20px;">
                <button id="btn-clear-history" style="background:#2a2a2a; color:var(--danger); border:1px solid #444; padding:15px; border-radius:12px; width:100%; font-weight:900;" onclick="storage.clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
/**
 * [OppaRun Pro - v29.4.0 Original Logic & Layout Preservation]
 */

const translations = {
    en: { pace: "PACE", dist: "DIST", time: "TIME", avg: "AVG", cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", cal: "KCAL", start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH", run: "RUN", history: "HISTORY", list: "LIST", total: "TOTAL", settings: "SETTINGS", confirmClear: "Clear all records?", allDist: "ALL DISTANCE", runs: "RUNS", avgKm: "AVG KM", avgPace: "AVG PACE", avgCad: "AVG CADENCE", totTime: "TOTAL TIME", totKcal: "TOTAL KCAL", avgGct: "AVG GCT", avgFlt: "AVG FLIGHT" },
    ko: { pace: "페이스", dist: "거리", time: "시간", avg: "평균", cadence: "케이던스", gct: "지면접촉", flight: "체공시간", cal: "칼로리", start: "러닝 시작", stop: "정지", resume: "재개", finish: "종료", run: "러닝", history: "기록", list: "목록", total: "통계", settings: "설정", confirmClear: "모든 기록을 삭제할까요?", allDist: "전체 거리", runs: "러닝 횟수", avgKm: "평균 거리", avgPace: "평균 페이스", avgCad: "평균 케이던스", totTime: "총 시간", totKcal: "총 칼로리", avgGct: "평균 GCT", avgFlt: "평균 체공" }
};

class RunningStorage {
    constructor() { this.HISTORY_KEY = 'oppaRunHistory'; this.LANG_KEY = 'oppaRunLang'; }
    saveRecord(record) {
        const history = this.loadHistory();
        history.unshift(record);
        localStorage.setItem(this.HISTORY_KEY, JSON.stringify(history));
    }
    loadHistory() { return JSON.parse(localStorage.getItem(this.HISTORY_KEY) || '[]'); }
    clearHistory() { if (confirm(translations[this.getLang()].confirmClear)) { localStorage.removeItem(this.HISTORY_KEY); location.reload(); } }
    getLang() { return localStorage.getItem(this.LANG_KEY) || 'en'; }
    setLang(lang) { localStorage.setItem(this.LANG_KEY, lang); }
}

class UIManager {
    constructor() {
        this.dom = {
            curPace: document.getElementById('curPace'), dist: document.getElementById('dist'), time: document.getElementById('time'), 
            avgPace: document.getElementById('avgPace'), cadence: document.getElementById('cadence'), gct: document.getElementById('gct'), 
            flight: document.getElementById('flight'), historyList: document.getElementById('history-list'), 
            totalDist: document.getElementById('stat-total-dist'), statsGrid: document.getElementById('total-stats-grid')
        };
    }

    updateRunningDisplay(data) {
        if (data.pace) this.dom.curPace.textContent = data.pace;
        if (data.dist) this.dom.dist.textContent = data.dist;
        if (data.time) this.dom.time.textContent = data.time;
        if (data.avgPace) this.dom.avgPace.textContent = data.avgPace;
        if (data.cadence) this.dom.cadence.textContent = data.cadence;
        if (data.gct) this.dom.gct.textContent = data.gct;
        if (data.flight) this.dom.flight.textContent = data.flight;
    }

    showTab(tab) {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-' + tab));
        if(tab === 'history') this.updateHistoryList();
    }

    showSubTab(sub) {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.id === 'sub-tab-' + sub));
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
        if(sub === 'total') this.updateTotalStats();
    }

    updateHistoryList() {
        const h = storage.loadHistory();
        this.dom.historyList.innerHTML = h.map(r => `
            <div class="card" style="margin: 10px; padding: 15px; align-items: flex-start; width: calc(100% - 20px);">
                <div style="color:var(--primary); font-size:12px; font-weight:900; margin-bottom:5px;">${r.date}</div>
                <div style="display:flex; justify-content:space-between; width:100%; align-items:baseline;">
                    <div style="font-size:24px; font-weight:900;">${r.dist} <span style="font-size:12px; color:var(--primary)">KM</span></div>
                    <div style="font-size:18px; font-weight:800; color:#fff;">${r.time}</div>
                </div>
            </div>
        `).join('');
    }

    updateTotalStats() {
        const h = storage.loadHistory().filter(r => parseFloat(r.dist) > 0.05); // Filter out short test runs
        const lang = storage.getLang();
        const t = translations[lang];
        
        let totalDist = 0, totalSeconds = 0, totalSteps = 0, totalKcal = 0, totalGct = 0, totalFlight = 0;
        h.forEach(r => {
            totalDist += parseFloat(r.dist);
            totalKcal += parseInt(r.kcal || 0);
            totalSteps += (parseInt(r.cadence || 0) * (this.timeToSeconds(r.time) / 60));
            totalSeconds += this.timeToSeconds(r.time);
            totalGct += parseInt(r.gct || 0);
            totalFlight += parseInt(r.flight || 0);
        });

        const avgDist = h.length ? (totalDist / h.length).toFixed(2) : "0.00";
        const avgCadence = totalSeconds ? Math.round((totalSteps / (totalSeconds / 60))) : 0;
        const avgPaceKmh = totalSeconds ? (totalDist / (totalSeconds / 3600)) : 0;
        const avgGctVal = h.length ? Math.round(totalGct / h.length) : 0;
        const avgFlightVal = h.length ? Math.round(totalFlight / h.length) : 0;

        this.dom.totalDist.textContent = `${totalDist.toFixed(2)} KM`;
        
        const stats = [
            { label: t.runs, val: h.length },
            { label: t.avgKm, val: avgDist },
            { label: t.avgPace, val: this.formatPace(avgPaceKmh) },
            { label: t.avgCad, val: avgCadence },
            { label: t.totTime, val: this.formatTotalTime(totalSeconds) },
            { label: t.totKcal, val: totalKcal },
            { label: t.avgGct, val: `${avgGctVal}ms` },
            { label: t.avgFlt, val: `${avgFlightVal}%` }
        ];

        this.dom.statsGrid.innerHTML = stats.map(s => `
            <div class="total-sub-card">
                <div class="total-sub-label">${s.label}</div>
                <div class="total-sub-val">${s.val}</div>
            </div>
        `).join('');
    }

    timeToSeconds(timeStr) {
        const p = timeStr.split(':');
        return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    formatTotalTime(totalSeconds) {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    formatPace(kmh) {
        if (!kmh || kmh < 0.5) return "--'--\"";
        let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
    }

    closeMetronome() { document.getElementById('metronome-view').style.display = 'none'; }
}

class MetroEngine {
    constructor() { this.isPlaying = false; }
    toggle() { 
        this.isPlaying = !this.isPlaying; 
        document.getElementById('quick-metro').textContent = this.isPlaying ? "METRO ON" : "METRO OFF";
        document.getElementById('quick-metro').style.background = this.isPlaying ? "var(--primary)" : "#333";
        document.getElementById('quick-metro').style.color = this.isPlaying ? "#000" : "#999";
    }
    updateDisplay() { document.getElementById('metro-bpm-val').textContent = document.getElementById('metro-bpm').value; }
}

class OppaRunApp {
    constructor() {
        this.state = { isRunning: false, seconds: 0, totalDist: 0, steps: 0, lastPos: null, path: [] };
        this.timer = null;
    }

    onStart() {
        this.state.isRunning = true;
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        this.timer = setInterval(() => {
            this.state.seconds++;
            const m = Math.floor(this.state.seconds/60), s = this.state.seconds%60;
            ui.updateRunningDisplay({time: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});
        }, 1000);
    }

    onStop() {
        this.state.isRunning = false;
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
    }

    onFinish() {
        const avgCad = Math.round((this.state.steps / (this.state.seconds || 1)) * 60);
        storage.saveRecord({
            id: Date.now(),
            date: new Date().toLocaleString(),
            dist: this.state.totalDist.toFixed(2),
            time: document.getElementById('time').textContent,
            cadence: avgCad || 175, // Sample
            kcal: Math.round(this.state.totalDist * 65), // Sample
            gct: 240, flight: 28 // Sample
        });
        location.reload();
    }
}

const storage = new RunningStorage();
const ui = new UIManager();
const metro = new MetroEngine();
const app = new OppaRunApp();

window.onload = () => {
    // Initial UI state
    ui.showTab('run');
};
</script>
</body>
</html>
