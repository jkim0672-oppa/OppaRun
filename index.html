<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Running v12.8 - Professional Edition</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --primary-neon: #ccff00; /* 가민 느낌의 네온 그린 */
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent-blue: #007aff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 헤더 섹션 */
        .header {
            padding: 20px;
            background: linear-gradient(180deg, #111 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background: rgba(204, 255, 0, 0.1);
            color: var(--primary-neon);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--primary-neon);
        }

        /* 메인 대시보드 */
        .dashboard {
            padding: 0 20px;
        }

        .main-stats {
            text-align: center;
            padding: 40px 0;
        }

        .main-stats .value {
            font-size: 80px;
            font-weight: 800;
            color: var(--primary-neon);
            line-height: 1;
        }

        .main-stats .label {
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* 분석 카드 */
        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #333;
        }

        .card .title {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .data {
            font-size: 24px;
            font-weight: bold;
        }

        /* 가자미근 케어 알림 (오빠의 핵심 아이디어) */
        .warning-section {
            background: rgba(255, 69, 0, 0.1);
            border: 1px dashed #ff4500;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 컨트롤 버튼 */
        .btn-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            padding: 0 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.95); }

        .btn-start { background: var(--primary-neon); color: black; }
        .btn-stop { background: #333; color: white; }

    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; font-size: 18px;">JENNY RUN v12.8</h2>
            <span style="font-size: 12px; color: var(--text-dim);">Ready to USA Expedition</span>
        </div>
        <div class="status-badge">CONNECTED</div>
    </div>

    <div class="dashboard">
        <div class="main-stats">
            <div class="value" id="timer">00:00</div>
            <div class="label">RUNNING TIME</div>
        </div>

        <div class="warning-section">
            <span style="font-size: 20px;">⚠️</span>
            <div style="font-size: 13px; color: #ff4500;">
                <b>가자미근 보호 모드:</b> 현재 케이던스가 높습니다. 보폭을 조금만 줄여볼까요?
            </div>
        </div>

        <div class="analysis-grid">
            <div class="card">
                <div class="title">DISTANCE</div>
                <div class="data">0.00 <span style="font-size: 14px;">km</span></div>
            </div>
            <div class="card">
                <div class="title">PACE</div>
                <div class="data">0'00" <span style="font-size: 14px;">/km</span></div>
            </div>
            <div class="card">
                <div class="title">HEART RATE</div>
                <div class="data">-- <span style="font-size: 14px;">bpm</span></div>
            </div>
            <div class="card">
                <div class="title">CALORIES</div>
                <div class="data">0 <span style="font-size: 14px;">kcal</span></div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn btn-stop">PAUSE</button>
        <button class="btn btn-start" onclick="startRun()">START RUN</button>
    </div>

    <script>
        function startRun() {
            alert("미국 진출 전, 마지막 테스트를 시작합니다! 오빠 화이팅!");
            // 나중에 여기에 가민 연동 및 센서 데이터 로직이 들어갈 거야!
        }
    </script>
</body>
</html>
