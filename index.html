<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OppaRun - Jenny</title>
    <!-- Leaflet CSS (지도를 위해 필수) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #00FF7F; /* 몽글몽글한 그린 */
            --bg-dark: #000000;
            --card-bg: #1a1a1a;
            --text-gray: #888;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* 페이지 레이아웃 */
        .page {
            display: none;
            padding: 20px;
            padding-bottom: 100px; /* 하단바 공간 */
            min-height: 100vh;
            box-sizing: border-box;
        }

        .active { display: block; }

        /* 카드 스타일 */
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 폰트 강조 */
        .label { color: var(--text-gray); font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 24px; font-weight: bold; }
        .unit { font-size: 14px; color: var(--primary-color); margin-left: 4px; }

        /* 버튼 */
        .btn-main {
            background: var(--primary-color);
            color: black;
            border: none;
            border-radius: 50px;
            padding: 20px;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-close {
            background: var(--primary-color);
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            float: right;
        }

        /* 지도 컨테이너 */
        #map {
            width: 100%;
            height: 300px;
            background: #333;
            border-radius: 0 0 15px 15px;
        }

        /* 하단 내비게이션 바 (고정) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 15px 0;
            border-top: 1px solid #222;
            z-index: 9999;
        }

        .nav-item {
            color: var(--text-gray);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        h2 { color: var(--primary-color); margin-bottom: 25px; }
    </style>
</head>
<body>

    <!-- 1. 메인 러닝 페이지 (1000043829.jpg) -->
    <div id="main-page" class="page active">
        <div id="main-map-area" style="height: 150px; margin: -20px -20px 20px -20px; background: #222;">
            <!-- 상단 미니 지도 영역 -->
        </div>
        <div style="text-align: center; color: #FFD700; font-size: 12px; margin-bottom: 10px;">GPS INITIALIZING...</div>
        
        <div class="card" style="border: 2px solid var(--primary-color);">
            <div class="label">페이스</div>
            <div class="value" style="font-size: 40px; color: var(--primary-color);">--' --"</div>
        </div>

        <div class="grid-container">
            <div class="card"><div class="label">거리</div><div class="value">0.00<span class="unit">KM</span></div></div>
            <div class="card"><div class="label">시간</div><div class="value">00:00</div></div>
            <div class="card"><div class="label">평균</div><div class="value">--' --"</div></div>
            <div class="card"><div class="label">케이던스</div><div class="value">0</div></div>
            <div class="card"><div class="label">지면접촉</div><div class="value">--<span class="unit">MS</span></div></div>
            <div class="card"><div class="label">체공시간</div><div class="value">--<span class="unit">%</span></div></div>
        </div>

        <button class="btn-main" onclick="showPage('route-page')">러닝 시작</button>
    </div>

    <!-- 2. 정밀 진단 페이지 (1000043828.jpg) -->
    <div id="diag-page" class="page">
        <button class="btn-close" onclick="showPage('main-page')">CLOSE</button>
        <h2>정밀 진단</h2>
        
        <div class="card" style="text-align: left;">
            <div class="label">CADENCE</div>
            <div class="value" style="color: #ff4444; font-size: 18px;">0 BPM - 주의</div>
        </div>

        <div class="card" style="text-align: left;">
            <div class="label">GCT</div>
            <div class="value" style="color: var(--primary-color); font-size: 18px;">0 MS - 보통</div>
        </div>

        <div class="card" style="text-align: left; border: 1px solid var(--primary-color);">
            <div class="label" style="color: var(--primary-color);">PRESCRIPTION</div>
            <div style="font-size: 16px;">가자미근의 탄력을 활용하세요.</div>
        </div>
    </div>

    <!-- 3. 루트/지도 페이지 (1000043827.jpg) -->
    <div id="route-page" class="page" style="padding: 0;">
        <div style="padding: 20px;">
            <button class="btn-close" onclick="showPage('main-page')">CLOSE</button>
        </div>
        <div id="map"></div>
        <div style="padding: 20px;">
            <h2 style="font-style: italic;">ROUTE</h2>
            <div class="grid-container">
                <div class="card"><div class="label">DIST</div><div class="value">0.00 KM</div></div>
                <div class="card"><div class="label">PACE</div><div class="value" id="pace-val">0'00"</div></div>
            </div>
        </div>
    </div>

    <!-- 하단 공통 내비게이션 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('main-page')">러닝</div>
        <div class="nav-item" onclick="showPage('diag-page')">기록</div>
    </div>

    <!-- Leaflet JS & Logic -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;

        function showPage(pageId) {
            // 모든 페이지 숨기기
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // 모든 탭 비활성화
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // 선택 페이지 보이기
            const target = document.getElementById(pageId);
            target.classList.add('active');

            // 탭 상태 업데이트
            if(pageId === 'main-page') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if(pageId === 'diag-page') document.querySelectorAll('.nav-item')[1].classList.add('active');

            // 지도 로딩 처리 (1000043827.jpg 회색화면 방지)
            if (pageId === 'route-page') {
                setTimeout(() => {
                    if (!map) {
                        // 초기 위치 (오렌지 카운티 근처 설정 가능)
                        map = L.map('map').setView([33.7743, -117.9490], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap'
                        }).addTo(map);
                    }
                    map.invalidateSize(); // 지도 크기 재계산 (매우 중요!)
                }, 100);
            }
        }

        // 초기화
        window.onload = () => {
            console.log("Jenny 시스템 로드 완료, 오빠!");
        };
    </script>
</body>
</html>
