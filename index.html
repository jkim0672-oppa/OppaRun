<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OppaRun - Settings</title>
    <style>
        /* 936.jpg UI 스타일 반영 */
        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 상단 탭 바 */
        .top-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background-color: #000;
        }

        .nav-btn {
            background-color: #222;
            color: #888;
            border: none;
            padding: 12px 0;
            flex: 1;
            margin: 0 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-btn.active {
            background-color: #39FF14; /* 네온 그린 */
            color: black;
        }

        /* 메인 콘텐츠 영역 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        /* 설정 아이템 그룹 */
        .setting-group {
            width: 85%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* CLEAR ALL HISTORY 버튼 스타일 */
        .clear-btn {
            background-color: #222;
            color: #ff4d4d; /* 강조된 빨간색 */
            border: 1px solid #333;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* 언어 설정 구역 */
        .language-section {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .language-label {
            color: #39FF14;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        /* 드롭다운 스타일 (936.jpg 느낌) */
        .language-select {
            background-color: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            text-align: center;
            cursor: pointer;
            /* 기본 화살표 스타일링 */
            appearance: none;
            -webkit-appearance: none;
        }

        .language-select:focus {
            border-color: #39FF14;
        }

        /* 하단 네비게이션 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-top: 1px solid #222;
        }

        .bottom-item {
            color: #444;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
        }

        .bottom-item.active {
            color: #39FF14;
        }
    </style>
</head>
<body>

    <!-- 상단 탭 -->
    <div class="top-nav">
        <button class="nav-btn">LIST</button>
        <button class="nav-btn">TOTAL</button>
        <button class="nav-btn">INFO</button>
        <button class="nav-btn active">SETTINGS</button>
    </div>

    <!-- 메인 설정 페이지 -->
    <div class="content">
        <div class="setting-group">
            
            <!-- 기록 삭제 버튼 -->
            <button class="clear-btn" id="btn-clear">CLEAR ALL HISTORY</button>

            <!-- 언어 선택 (새로 추가됨) -->
            <div class="language-section">
                <label class="language-label" id="label-lang">LANGUAGE</label>
                <select class="language-select" id="lang-select">
                    <option value="en">English</option>
                    <option value="ko">한국어 (Korean)</option>
                    <option value="jp">日本語 (Japanese)</option>
                    <option value="es">Español (Spanish)</option>
                    <option value="zh">中文 (Chinese)</option>
                </select>
            </div>

        </div>
    </div>

    <!-- 하단 메뉴 -->
    <div class="bottom-nav">
        <div class="bottom-item">RUN</div>
        <div class="bottom-item active">HISTORY</div>
    </div>

    <script>
        const langSelect = document.getElementById('lang-select');
        const btnClear = document.getElementById('btn-clear');
        const labelLang = document.getElementById('label-lang');

        // 언어별 텍스트 데이터
        const translations = {
            en: {
                clear: "CLEAR ALL HISTORY",
                language: "LANGUAGE"
            },
            ko: {
                clear: "모든 기록 삭제",
                language: "언어 설정"
            },
            jp: {
                clear: "すべての履歴を削除",
                language: "言語設定"
            },
            es: {
                clear: "BORRAR TODO EL HISTORIAL",
                language: "IDIOMA"
            },
            zh: {
                clear: "清除所有历史记录",
                language: "语言设置"
            }
        };

        // 언어 적용 함수
        function updateLanguage(lang) {
            const t = translations[lang] || translations.en;
            btnClear.innerText = t.clear;
            labelLang.innerText = t.language;
            
            // 여기에 다른 UI 요소(LIST, TOTAL 등)의 번역도 추가 가능합니다.
        }

        // 선택 변경 이벤트
        langSelect.addEventListener('change', (e) => {
            const selected = e.target.value;
            updateLanguage(selected);
            localStorage.setItem('oppaRunLang', selected); // 설정 저장
        });

        // 초기 로드 시 저장된 언어 불러오기
        window.onload = () => {
            const savedLang = localStorage.getItem('oppaRunLang') || 'en';
            langSelect.value = savedLang;
            updateLanguage(savedLang);
        };
    </script>
</body>
</html>
