<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러닝 기록 목록</title>
    <style>
        /* 기본 테마 설정 */
        :root {
            --primary: #00ff88;      /* 형광 초록 강조색 */
            --bg-black: #000000;    /* 전체 배경 */
            --card-bg: #1c1c1e;     /* 리스트 아이템 배경 (검정보다 약간 밝음) */
            --border-color: #3a3a3c; /* 테두리 색상 */
            --text-main: #ffffff;   /* 기본 텍스트 */
            --text-dim: #888888;    /* 흐린 텍스트 */
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 상단 네비게이션 */
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-around;
            background: #121212;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-item {
            padding: 8px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dim);
        }

        .nav-item.active {
            background-color: var(--primary);
            color: #000;
        }

        /* 리스트 컨테이너 */
        #history-list {
            padding: 10px 0 100px 0; /* 하단 네비게이션 공간 확보 */
        }

        /* 리스트 아이템 카드 (구분감을 위해 수정된 핵심 부분) */
        .history-item { 
            background: var(--card-bg);   
            border-radius: 20px;         
            padding: 20px;               
            margin: 25px 15px;           /* 아이템 간 상하 간격을 25px로 넓혀 확실히 분리 */
            border: 1px solid var(--border-color); /* 테두리를 주어 경계 명확화 */
            position: relative;
            /* 입체감을 주어 바닥과 분리된 느낌 부여 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); 
        }

        /* 아이템 상단 (날짜 및 버튼) */
        .h-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .h-date { 
            font-size: 14px; 
            color: var(--primary); 
            font-weight: 800; 
        }

        .h-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 메인 기록 데이터 */
        .h-main-stats {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            align-items: baseline;
        }

        .h-dist {
            font-size: 34px;
            font-weight: 900;
        }

        .h-time {
            font-size: 34px;
            font-weight: 900;
            color: var(--primary);
        }

        /* 하단 세부 지표 구분선 */
        .h-divider {
            border-top: 1px solid #333;
            margin: 15px 0;
        }

        /* 세부 지표 그리드 레이아웃 */
        .h-sub-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
        }

        /* 하단 탭 메뉴 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px 0;
            border-top: 1px solid #222;
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            color: var(--text-dim);
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-tab.active {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="nav-item active">목록</div>
        <div class="nav-item">통계</div>
        <div class="nav-item">정보</div>
        <div class="nav-item">설정</div>
    </div>

    <div id="history-list">
        
        <div class="history-item">
            <div class="h-header">
                <div class="h-date">5/13/2026, 3:07:42 PM</div>
                <div class="h-buttons">
                    <button class="btn-small">경로</button>
                    <button class="btn-small">진단</button>
                </div>
            </div>
            <div class="h-main-stats">
                <span class="h-dist">0.00KM</span>
                <span class="h-time">00:01</span>
            </div>
            <div class="h-divider"></div>
            <div class="h-sub-stats">
                <div><span class="stat-label">PACE</span><span class="stat-value">--'--"</span></div>
                <div><span class="stat-label">CAD</span><span class="stat-value">0</span></div>
                <div><span class="stat-label">KCAL</span><span class="stat-value">0</span></div>
                <div><span class="stat-label">GCT/FLT</span><span class="stat-value">--/--%</span></div>
            </div>
        </div>

        <div class="history-item">
            <div class="h-header">
                <div class="h-date">5/13/2026, 1:42:29 PM</div>
                <div class="h-buttons">
                    <button class="btn-small">경로</button>
                    <button class="btn-small">진단</button>
                </div>
            </div>
            <div class="h-main-stats">
                <span class="h-dist">0.06KM</span>
                <span class="h-time">01:02</span>
            </div>
            <div class="h-divider"></div>
            <div class="h-sub-stats">
                <div><span class="stat-label">PACE</span><span class="stat-value">17'26"</span></div>
                <div><span class="stat-label">CAD</span><span class="stat-value">137</span></div>
                <div><span class="stat-label">KCAL</span><span class="stat-value">4</span></div>
                <div><span class="stat-label">GCT/FLT</span><span class="stat-value">410/13%</span></div>
            </div>
        </div>

        <div class="history-item">
            <div class="h-header">
                <div class="h-date">5/13/2026, 1:03:10 PM</div>
                <div class="h-buttons">
                    <button class="btn-small">경로</button>
                    <button class="btn-small">진단</button>
                </div>
            </div>
            <div class="h-main-stats">
                <span class="h-dist">0.08KM</span>
                <span class="h-time">00:49</span>
            </div>
            <div class="h-divider"></div>
            <div class="h-sub-stats">
                <div><span class="stat-label">PACE</span><span class="stat-value">10'34"</span></div>
                <div><span class="stat-label">CAD</span><span class="stat-value">71</span></div>
                <div><span class="stat-label">KCAL</span><span class="stat-value">5</span></div>
                <div><span class="stat-label">GCT/FLT</span><span class="stat-value">--/--%</span></div>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-tab">러닝</a>
        <a href="#" class="nav-tab active">기록</a>
    </div>

</body>
</html>
