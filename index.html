<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Running v12.8 - Professional Edition</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --primary-neon: #ccff00;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent-blue: #007aff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            user-select: none;
        }

        .header {
            padding: 20px;
            background: linear-gradient(180deg, #111 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background: rgba(204, 255, 0, 0.1);
            color: var(--primary-neon);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--primary-neon);
        }

        .dashboard { padding: 0 20px; }

        .main-stats { text-align: center; padding: 40px 0; }
        .main-stats .value {
            font-size: 80px;
            font-weight: 800;
            color: var(--primary-neon);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .main-stats .label { color: var(--text-dim); letter-spacing: 2px; margin-top: 10px; }

        .warning-section {
            background: rgba(255, 69, 0, 0.1);
            border: 1px dashed #ff4500;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 120px; /* 버튼 공간 확보 */
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #333;
        }

        .card .title { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }
        .card .data { font-size: 24px; font-weight: bold; }

        .btn-container {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            background: linear-gradient(0deg, var(--bg-color) 80%, transparent);
            padding-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 18px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--primary-neon); color: black; }
        .btn-stop { background: #333; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; font-size: 18px;">JENNY RUN v12.8</h2>
            <span style="font-size: 12px; color: var(--text-dim);">Ready to USA Expedition</span>
        </div>
        <div class="status-badge" id="status">READY</div>
    </div>

    <div class="dashboard">
        <div class="main-stats">
            <div class="value" id="timer">00:00</div>
            <div class="label">RUNNING TIME</div>
        </div>

        <div class="warning-section">
            <span style="font-size: 20px;">⚠️</span>
            <div style="font-size: 13px; color: #ff4500;">
                <b>가자미근 보호 모드:</b> <span id="care-msg">준비되었습니다.</span>
            </div>
        </div>

        <div class="analysis-grid">
            <div class="card">
                <div class="title">DISTANCE</div>
                <div class="data"><span id="dist">0.00</span> <span style="font-size: 14px;">km</span></div>
            </div>
            <div class="card">
                <div class="title">PACE</div>
                <div class="data"><span id="pace">0'00"</span> <span style="font-size: 14px;">/km</span></div>
            </div>
            <div class="card">
                <div class="title">HEART RATE</div>
                <div class="data"><span id="heart">--</span> <span style="font-size: 14px;">bpm</span></div>
            </div>
            <div class="card">
                <div class="title">CALORIES</div>
                <div class="data"><span id="kcal">0</span> <span style="font-size: 14px;">kcal</span></div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn btn-stop" onclick="stopRun()">PAUSE</button>
        <button class="btn btn-start" id="startBtn" onclick="toggleRun()">START RUN</button>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let isRunning = false;

        function toggleRun() {
            if (!isRunning) {
                startRun();
            } else {
                stopRun();
            }
        }

        function startRun() {
            isRunning = true;
            document.getElementById('startBtn').innerText = "STOP";
            document.getElementById('status').innerText = "RUNNING";
            document.getElementById('status').style.color = "#ccff00";
            document.getElementById('care-msg').innerText = "보폭을 유지하며 천천히 달리세요.";
            
            timerInterval = setInterval(() => {
                seconds++;
                updateDisplay();
            }, 1000);
        }

        function stopRun() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').innerText = "START RUN";
            document.getElementById('status').innerText = "PAUSED";
            document.getElementById('status').style.color = "#ff4500";
        }

        function updateDisplay() {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            document.getElementById('timer').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // 시뮬레이션 데이터 (미국 가서 가민 연결하면 실제 데이터로 바뀔 곳!)
            let mockDist = (seconds * 0.0028).toFixed(2);
            document.getElementById('dist').innerText = mockDist;
            document.getElementById('kcal').innerText = Math.floor(seconds * 0.15);
            document.getElementById('pace').innerText = "5'40\"";
            document.getElementById('heart').innerText = Math.floor(Math.random() * (150 - 140) + 140);
        }
    </script>
</body>
</html>
