<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v32 (Modular Edition)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        /* Layout Components */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { 
            text-align: center; color: var(--warning); font-size: 11px; padding: 8px; 
            background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222;
        }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* Tab & History Styles */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #333; position: relative; }
        
        /* Overlays */
        #detail-view, #diag-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10000; display: none; flex-direction: column; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 20px; z-index: 10001; background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 900; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
        
        /* Diagnosis Styles */
        .diag-card { background: #111; margin: 10px 15px; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .diag-advice { font-size: 13px; color: #ccc; line-height: 1.5; border-left: 3px solid var(--primary); padding-left: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="dimmer-overlay">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">INITIALIZING SYSTEM...</div>
    </div> 

    <!-- Main Views -->
    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" style="position:absolute; top:10px; left:10px; font-size:10px; color:var(--danger); font-weight:900; display:none;">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px;" onclick="APP.ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="APP.control.start()">START RUNNING</button>
            <div id="active-controls" style="display:none; width:100%; gap:10px;">
                <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff;" onclick="APP.control.stop()">STOP</button>
            </div>
            <div id="finish-controls" style="display:none; width:100%; gap:10px;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="APP.control.resume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="APP.control.finish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div id="history-list" class="sub-page" style="display:flex;"></div>
    </div>

    <!-- Overlays -->
    <div id="detail-view">
        <button class="close-btn" onclick="APP.ui.closeOverlay('detail-view')">CLOSE</button>
        <div id="detail-map" style="height:50%"></div>
        <div id="detail-data" style="padding:20px"></div>
    </div>
    <div id="diag-view">
        <button class="close-btn" onclick="APP.ui.closeOverlay('diag-view')">CLOSE</button>
        <div id="diag-content" style="padding:60px 20px 20px;"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="APP.ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="APP.ui.showTab('history')">HISTORY</button>
    </div>

<script>
/**
 * OPPARUN PRO v32 - MODULAR ARCHITECTURE
 */
const APP = {
    // 1. STATE: 실시간 데이터와 앱 상태
    state: {
        isRunning: false,
        isPaused: false,
        isAutoPaused: false,
        seconds: 0,
        timer: null,
        wakeLock: null,
        lang: localStorage.getItem('oppaRunLang') || 'ko'
    },

    // 2. TRACKER: 센서 데이터 수집 및 계산
    tracker: {
        dist: 0,
        steps: 0,
        lastStepT: 0,
        path: [],
        lastPos: null,
        lowSpeedT: null,

        updateGPS(p) {
            const pos = [p.coords.latitude, p.coords.longitude];
            const speedKmh = (p.coords.speed || 0) * 3.6;
            
            APP.ui.updateMarker(pos);

            if (!APP.state.isRunning || APP.state.isPaused) return;

            // 자동 일시정지 로직
            if (speedKmh < 2.0) {
                if (!this.lowSpeedT) this.lowSpeedT = Date.now();
                if (Date.now() - this.lowSpeedT > 1000 && !APP.state.isAutoPaused) {
                    APP.state.isAutoPaused = true;
                    APP.ui.toggleAutoPause(true);
                }
            } else {
                this.lowSpeedT = null;
                if (APP.state.isAutoPaused) {
                    APP.state.isAutoPaused = false;
                    APP.ui.toggleAutoPause(false);
                }
            }

            // 거리 및 경로 계산
            if (!APP.state.isAutoPaused && p.coords.accuracy < 50) {
                if (this.lastPos) {
                    const d = APP.util.getDist(this.lastPos, pos);
                    if (d > 0.001) {
                        this.dist += d;
                        this.path.push(pos);
                        this.lastPos = pos;
                        APP.ui.updatePath(this.path);
                    }
                } else { this.lastPos = pos; }
                
                APP.ui.renderStats(speedKmh, this.dist);
            }
        },

        updateMotion(e) {
            if (!APP.state.isRunning || APP.state.isPaused || APP.state.isAutoPaused) return;
            const acc = e.accelerationIncludingGravity;
            if (!acc || acc.x === null) return;
            
            const force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
            const now = Date.now();

            if (force > 12 && (now - this.lastStepT) > 220) {
                this.steps++;
                this.lastStepT = now;
                APP.ui.renderMotionStats(this.steps);
            }
        },

        reset() {
            this.dist = 0; this.steps = 0; this.path = []; this.lastPos = null; this.lowSpeedT = null;
        }
    },

    // 3. UI: 화면 렌더링 및 인터랙션
    ui: {
        map: null, marker: null, polyline: null,
        
        initMap() {
            this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.77, -117.91], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
            this.marker = L.marker([0,0], {icon: L.divIcon({className:'my-loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:12px; height:12px;"></div>'})}).addTo(this.map);
            this.polyline = L.polyline([], {color:'#007bff', weight:5}).addTo(this.map);
        },

        renderStats(speed, dist) {
            document.getElementById('curPace').textContent = APP.util.formatPace(speed);
            document.getElementById('dist').textContent = dist.toFixed(2);
            if (dist > 0 && APP.state.seconds > 0) {
                const avgKmh = dist / (APP.state.seconds / 3600);
                document.getElementById('avgPace').textContent = APP.util.formatPace(avgKmh);
            }
        },

        renderMotionStats(steps) {
            const cad = Math.round((steps / (APP.state.seconds || 1)) * 60);
            const gct = Math.floor(450 - ((APP.tracker.dist / (APP.state.seconds/3600)) * 10)) || 0;
            document.getElementById('cadence').textContent = cad;
            document.getElementById('gct').textContent = gct > 0 ? gct : "--";
            document.getElementById('flight').textContent = cad > 160 ? Math.floor(cad/10) : "--"; // 가상 로직
        },

        showTab(tab) {
            document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
            document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
            document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'history') APP.storage.renderList();
        },

        updateMarker(pos) { this.marker.setLatLng(pos); if(!APP.state.isRunning) this.map.panTo(pos); },
        updatePath(path) { this.polyline.setLatLngs(path); },
        toggleAutoPause(show) { document.getElementById('pause-status').style.display = show ? 'block' : 'none'; },
        toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; },
        status(msg) { document.getElementById('status').textContent = msg; },
        closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
    },

    // 4. CONTROL: 시작, 정지, 종료 로직
    control: {
        start() {
            APP.state.isRunning = true; APP.tracker.reset(); APP.state.seconds = 0;
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('active-controls').style.display = 'flex';
            APP.state.timer = setInterval(() => {
                if (!APP.state.isPaused && !APP.state.isAutoPaused) {
                    APP.state.seconds++;
                    document.getElementById('time').textContent = APP.util.formatTime(APP.state.seconds);
                }
            }, 1000);
            APP.util.requestWakeLock();
        },
        stop() {
            APP.state.isPaused = true;
            document.getElementById('active-controls').style.display = 'none';
            document.getElementById('finish-controls').style.display = 'flex';
        },
        resume() {
            APP.state.isPaused = false;
            document.getElementById('active-controls').style.display = 'flex';
            document.getElementById('finish-controls').style.display = 'none';
        },
        finish() {
            const record = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                dist: document.getElementById('dist').textContent,
                time: document.getElementById('time').textContent,
                pace: document.getElementById('avgPace').textContent,
                cadence: document.getElementById('cadence').textContent,
                gct: document.getElementById('gct').textContent,
                flight: document.getElementById('flight').textContent,
                path: APP.tracker.path
            };
            APP.storage.save(record);
            location.reload();
        }
    },

    // 5. ANALYZER: 진단 처방전 (v28.28 핵심 로직)
    analyzer: {
        open(id) {
            const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            const r = h.find(item => item.id === id);
            if (!r) return;

            const cad = parseInt(r.cadence);
            const isKo = APP.state.lang === 'ko';
            
            let advice = cad < 170 
                ? (isKo ? "보폭을 줄이고 발을 빨리 구르세요. 족저근막 보호에 유리합니다." : "Shorten stride, increase cadence to protect fascia.")
                : (isKo ? "훌륭한 리듬입니다! 가자미근의 탄력을 잘 활용하고 계시네요." : "Great rhythm! Using soleus elasticity well.");

            document.getElementById('diag-view').style.display = 'flex';
            document.getElementById('diag-content').innerHTML = `
                <div style="font-size:22px; font-weight:900; color:var(--primary);">RUN DIAGNOSIS</div>
                <div class="diag-card">
                    <div style="font-size:11px; color:var(--text-dim);">CADENCE ANALYSIS</div>
                    <div style="font-size:18px; font-weight:900; margin:5px 0;">${cad} BPM</div>
                    <div class="diag-advice">${advice}</div>
                </div>
                <div class="diag-card" style="border:1px solid var(--primary); background:rgba(0,255,136,0.05);">
                    <div style="font-weight:800;">TOTAL PRESCRIPTION</div>
                    <div style="font-size:13px; margin-top:5px;">오빠, 오늘 러닝은 전체적으로 안정적이었어. 발목 힘을 빼고 롤링에만 집중해봐!</div>
                </div>
            `;
        }
    },

    // 6. STORAGE: 데이터 저장소
    storage: {
        save(r) {
            let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            h.unshift(r); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
        },
        renderList() {
            const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
            const listDiv = document.getElementById('history-list');
            if (h.length === 0) { listDiv.innerHTML = '<div style="padding:50px; text-align:center; color:#444;">NO RECORDS</div>'; return; }
            
            listDiv.innerHTML = h.map(r => `
                <div class="history-item">
                    <div style="color:var(--primary); font-size:12px; font-weight:900;">${r.date}</div>
                    <div style="font-size:22px; font-weight:900; margin:10px 0;">${r.dist}KM <span style="font-size:16px; color:#666;">${r.time}</span></div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-act" style="height:35px; font-size:11px;" onclick="APP.analyzer.open(${r.id})">DIAGNOSIS</button>
                    </div>
                </div>
            `).join('');
        }
    },

    // 7. UTIL: 계산 및 변환 도구
    util: {
        getDist(p1, p2) {
            const R = 6371;
            const dLat = (p2[0]-p1[0])*Math.PI/180;
            const dLon = (p2[1]-p1[1])*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        },
        formatPace(kmh) {
            if (!kmh || kmh < 0.5) return "--'--\"";
            const s = 3600 / kmh;
            return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
        },
        formatTime(sec) {
            return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        },
        async requestWakeLock() {
            try { if ('wakeLock' in navigator) APP.state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
    }
};

// INITIALIZE
window.onload = () => {
    APP.ui.initMap();
    navigator.geolocation.watchPosition(p => APP.tracker.updateGPS(p), null, {enableHighAccuracy:true});
    window.addEventListener('devicemotion', e => APP.tracker.updateMotion(e));
    document.getElementById('dimmer-overlay').onclick = () => APP.ui.toggleDim(false);
};
</script>
</body>
</html>
