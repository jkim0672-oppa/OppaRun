<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.20 (Custom Update)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100svh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        
        /* 메인 레이아웃 */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 대시보드 카드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 55px; border-radius: 30px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }
        
        /* 히스토리 리스트 */
        .history-nav { display: flex; gap: 4px; padding: 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 10px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-date { font-size: 11px; color: var(--primary); font-weight: 700; }
        .h-main { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .h-dist, .h-time { font-size: 18px; font-weight: 700; color: #ffffff; }
        
        /* 버튼 크기 키움 (루트, 진단) */
        .text-route-link { color: var(--primary); font-size: 11px; font-weight: 900; margin-left: 8px; cursor: pointer; background: rgba(0, 255, 136, 0.1); padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .text-diag-link { color: #00a2ff; font-size: 11px; font-weight: 900; margin-left: 5px; cursor: pointer; background: rgba(0, 123, 255, 0.15); padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #888; font-weight: 800; }
        .h-det-val { font-size: 14px; font-weight: 600; color: #ddd; }

        /* [경로 상세 보기 레이어] */
        #route-detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 5000; display: none; flex-direction: column; }
        #detail-map-container { height: 45vh; border-bottom: 2px solid #222; position: relative; }
        #detail-map { height: 100%; width: 100%; }
        
        /* 상세화면 버튼들 */
        .detail-ctrl-btns { position: absolute; top: 20px; right: 20px; z-index: 5001; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .btn-round { background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 20px; font-weight: 900; font-size: 12px; cursor: pointer; }
        #btn-close-detail { color: var(--primary); border: 1.5px solid var(--primary); }
        #btn-share-detail { color: #00a2ff; border: 1.5px solid #00a2ff; }

        .detail-info { flex: 1; padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; }
        .detail-row { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #1f1f1f; padding-bottom: 8px; }
        .detail-label { font-size: 11px; color: var(--text-dim); font-weight: 900; }
        .detail-value { font-size: 38px; color: var(--primary); font-weight: 900; line-height: 1; }
        .detail-unit { font-size: 14px; color: var(--text-dim); margin-left: 4px; }

        /* 하단 탭 바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="route-detail-view">
        <div class="detail-ctrl-btns">
            <div id="btn-close-detail" class="btn-round" onclick="closeRouteDetail()">BACK</div>
            <div id="btn-share-detail" class="btn-round" onclick="alert('경로를 공유합니다!')">SHARE</div>
        </div>
        <div id="detail-map-container"><div id="detail-map"></div></div>
        <div class="detail-info" id="detail-content"></div>
    </div>

    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="lbl-curPace" class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button id="btn-resume" class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button id="btn-finish" class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button class="sub-btn">INFO</button>
            <button class="sub-btn">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button class="tab-btn">FORM</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, detailMap, marker, polyline, timer, isRunning = false, isPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, pathCoords = [];

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(p => {
            const pos = [p.coords.latitude, p.coords.longitude];
            marker.setLatLng(pos);
            if (isRunning && !isPaused) {
                if (lastPos) {
                    let d = L.latLng(lastPos).distanceTo(pos) / 1000;
                    if (d > 0.002) {
                        totalDist += d;
                        document.getElementById('dist').textContent = totalDist.toFixed(2);
                        pathCoords.push(pos);
                        polyline.setLatLngs(pathCoords);
                        lastPos = pos;
                    }
                } else { lastPos = pos; pathCoords.push(pos); }
            } else if (!isRunning) { map.panTo(pos); }
        }, null, {enableHighAccuracy: true});
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = formatTime(seconds); } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }

function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' }),
        dist: totalDist.toFixed(2),
        time: document.getElementById('time').textContent,
        pace: calculatePace(totalDist, seconds),
        cadence: 0, kcal: Math.round(totalDist * 65), gctflt: "0/0%",
        coords: pathCoords 
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function viewRecordMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const r = h.find(item => item.id === id);
    if (!r) return;

    document.getElementById('route-detail-view').style.display = 'flex';
    document.getElementById('detail-content').innerHTML = `
        <div class="detail-row"><span class="detail-label">DISTANCE</span><div><span class="detail-value">${r.dist}</span><span class="detail-unit">KM</span></div></div>
        <div class="detail-row"><span class="detail-label">TIME</span><div><span class="detail-value">${r.time}</span></div></div>
        <div class="detail-row"><span class="detail-label">AVG PACE</span><div><span class="detail-value">${r.pace}</span><span class="detail-unit">/KM</span></div></div>
    `;

    setTimeout(() => {
        if (detailMap) detailMap.remove();
        detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
        if (r.coords && r.coords.length > 0) {
            const p = L.polyline(r.coords, {color: '#00ff88', weight: 6}).addTo(detailMap);
            detailMap.fitBounds(p.getBounds(), {padding: [30, 30]});
        }
    }, 100);
}

function closeRouteDetail() { document.getElementById('route-detail-view').style.display = 'none'; }

function updateHistoryStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main">
                <span class="h-dist">${r.dist}KM</span>
                <span class="h-time">${r.time}</span>
                <span class="text-route-link" onclick="viewRecordMap(${r.id})">ROUTE</span>
                <span class="text-diag-link" onclick="alert('러닝 진단을 시작합니다!')">진단</span>
            </div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><span class="h-det-val">${r.pace}</span></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><span class="h-det-val">${r.cadence}</span></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><span class="h-det-val">${r.kcal}</span></div>
                <div class="h-det-box"><span class="h-det-label">GCT/FLT</span><span class="h-det-val">${r.gctflt}</span></div>
            </div>
        </div>`).join('');
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    if(tab === 'history') updateHistoryStats();
}

function showSubTab(sub) {
    document.getElementById('sub-page-list').style.display = (sub === 'list' ? 'flex' : 'none');
}

function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function calculatePace(dist, sec) { if (dist <= 0) return "--'--\""; let p = sec / dist; return `${Math.floor(p/60)}'${String(Math.floor(p%60)).padStart(2,'0')}"`; }
window.onload = initMap;
</script>
</body>
</html>
