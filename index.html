<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        /* 지도가 숨겨졌을 때 리스트가 화면을 가득 채우도록 설정 */
        #map { transition: height 0.3s ease; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <script>
        // [핵심 수정 1] 탭 전환 시 지도 숨기기/보여주기
        function showTab(tabName) {
            const mapElement = document.getElementById('map');
            if (tabName === 'run') {
                mapElement.classList.remove('hidden');
                // 지도가 다시 나타날 때 위치를 재계산해주는 센스!
                setTimeout(() => map.invalidateSize(), 200);
            } else {
                mapElement.classList.add('hidden');
            }
            // 나머지 탭 전환 로직...
        }

        // [핵심 수정 2] GPS 상태 텍스트 실시간 연동
        function updateGpsStatus(accuracy) {
            const statusText = document.getElementById('gps-status');
            const accuracyDisplay = `±${Math.round(accuracy)}m`;
            
            if (accuracy <= 10) {
                statusText.innerText = currentLang === 'ko' ? `준비 완료 ${accuracyDisplay}` : `GPS Ready ${accuracyDisplay}`;
                statusText.style.color = "#00ff00"; // 초록색
            } else {
                statusText.innerText = currentLang === 'ko' ? `GPS 연결 중... ${accuracyDisplay}` : `GPS Connecting... ${accuracyDisplay}`;
                statusText.style.color = "#ffcc00"; // 노란색
            }
        }
    </script>
</body>
</html>
