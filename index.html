<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun v15.1.5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000000; --card-bg: #121212; --text-main: #ffffff; --text-dim: #888888; --danger: #ff3b30; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; overflow: hidden; height: 100vh; padding-top: env(safe-area-inset-top); }
        #map { height: 32vh; width: 100%; background: #222; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 8px; background: #121212; font-weight: bold; border-bottom: 1px solid #222; }
        
        /* 듀얼 페이스를 위한 대시보드 레이아웃 최적화 */
        .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; padding-bottom: 110px; }
        .card { background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #222; }
        .label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: 900; color: #fff; }
        .unit { font-size: 11px; color: var(--primary); margin-left: 2px; }
        
        .controls { position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        #main-btn { width: 75px; height: 75px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 0 15px rgba(255,59,48,0.4); }
        #after-stop { display: none; gap: 15px; }
        .btn-action { width: 110px; height: 50px; border: none; font-weight: 800; border-radius: 25px; font-size: 15px; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #0a0a0a; display: flex; border-top: 1px solid #222; z-index: 2000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 11px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        #map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; }
        #history-map { flex: 1; }
        #split-info { height: 380px; background: #111; overflow-y: auto; padding: 20px; border-top: 1px solid #333; }
        .history-card { background:#161616; padding:18px; border-radius:20px; margin-bottom:12px; border: 1px solid #222; }
    </style>
</head>
<body>

<video id="no-sleep-video" loop playsinline muted style="display:none;"><source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAZptb292AAAAbG12aGQAAAAA3u99cN7vfXAABAAAAAQAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAABidHJhawAAAFx0a2hkAAAAAd7vfXDe731wAAAAAQAAAAEAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAABZW1kaWEAAAAgbWRoZAAAAADe731w3u99cAAABAAAAAQAVf7fAAAAACNoZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVxtaW5mAAAAFHZtbmQAAAAEAAAAAAhAdXJsIAAAAAEAAAFGc3RibAAAAGRzdHNkAAAAAAAAAAEAAABUbXA0dgAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAIAAgASAAAAEgAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABj//wAAACRhdmMxR0AIAAgAAABIAEgAAAAAAAAAAAAAAAAAABhAAr8AAAACHHBhc3AAAAABAAAAAQAAABhzdHRzAAAAAAAAAAEAAAABAAAEAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzeAAAAAAAAAEAAAABAAAAFHN0c3oAAAAAAAAAAAAAAAEAAAAUc3RjbwAAAAAAAAABAAAALAAAAA=="></video>

<div id="map-modal">
    <div id="history-map"></div>
    <div id="split-info"></div>
    <button style="height:65px; background:var(--primary); border:none; font-weight:900; color:#000;" onclick="closeModal()">BACK TO LIST</button>
</div>

<div id="page-home" style="display:flex; flex-direction:column; height:100vh;">
    <div id="map"></div>
    <div id="status" class="status-bar">GPS INITIALIZING...</div>
    <div class="dashboard">
        <div class="card"><div class="label">DISTANCE</div><div class="value"><span id="dist">0.00</span><span class="unit">KM</span></div></div>
        <div class="card"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
        
        <div class="card" style="border: 1px solid var(--primary);"><div class="label" style="color:var(--primary)">CURRENT PACE (10M)</div><div class="value" id="curPace" style="color:var(--primary)">0'00"</div></div>
        <div class="card"><div class="label">AVG PACE (TOTAL)</div><div class="value" id="avgPace">0'00"</div></div>
        
        <div class="card"><div class="label">KCAL</div><div class="value"><span id="kcal">0</span><span class="unit">KCAL</span></div></div>
        <div class="card"><div class="label">CADENCE</div><div class="value"><span id="cadence">0</span><span class="unit">SPM</span></div></div>
        
        <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">240</span><span class="unit">MS</span></div></div>
        <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">100</span><span class="unit">MS</span></div></div>
    </div>
    <div class="controls">
        <button id="main-btn" onclick="handleMainBtn()">START</button>
        <div id="after-stop">
            <button class="btn-action" style="background:var(--primary); color:#000;" onclick="resumeTracking()">RESUME</button>
            <button class="btn-action" style="background:var(--danger); color:#fff" onclick="saveData()">FINISH</button>
        </div>
    </div>
</div>

<div id="page-history" style="display:none; height:100vh; flex-direction:column; padding-bottom:80px;">
    <div style="padding:40px 20px 10px;"><h2 style="color:var(--primary); margin:0; font-size:28px; font-weight:900;">HISTORY</h2></div>
    <div id="history-container" style="flex:1; overflow-y:auto; padding:15px;"></div>
</div>

<div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">RUNNING</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">HISTORY</button>
</div>

<script>
let map, marker, pathLine, pathArray = [], splits = [];
let totalDistance = 0, isRunning = false, isPaused = false, elapsedSeconds = 0;
let lastPos = null, stepCount = 0, lastStepTime = 0, timerInterval, wakeLock = null;

// 10m 페이스 추적용 변수
let lastTenMeterDist = 0;
let lastTenMeterTime = Date.now();

async function requestWakeLock() {
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
}

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR'; window.speechSynthesis.speak(msg);
    }
}

function startTracking() {
    navigator.geolocation.watchPosition(pos => {
        const { latitude, longitude, accuracy, speed } = pos.coords;
        if (accuracy > 35) return;
        const newPos = [latitude, longitude];
        if (marker) marker.setLatLng(newPos);
        if (map && !isPaused) map.panTo(newPos);
        document.getElementById('status').textContent = "GPS CONNECTED";

        if (isRunning) {
            const currentKmh = (speed || 0) * 3.6;
            if (currentKmh < 1.0 && !isPaused) {
                isPaused = true;
                speak("일시 정지");
            } else if (currentKmh >= 1.5 && isPaused) {
                isPaused = false;
                speak("재개");
            }

            if (!isPaused && lastPos) {
                const d = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
                // 필터: 1.5m ~ 40m 사이의 확실한 이동만 인정
                if (d > 0.0015 && d < 0.04) { 
                    const prevDist = totalDistance;
                    totalDistance += d;
                    
                    // 1km 마다 구간 기록
                    if (Math.floor(totalDistance) > Math.floor(prevDist)) {
                        const curPaceStr = document.getElementById('avgPace').textContent;
                        splits.push({ km: Math.floor(totalDistance), pace: curPaceStr });
                        speak(`${Math.floor(totalDistance)} 킬로미터, 페이스 ${curPaceStr.replace("'", "분 ").replace('"', "초")}`);
                    }
                    updateUI();
                }
            }
            if (!isPaused) {
                lastPos = newPos;
                pathArray.push(newPos);
                if (pathLine) pathLine.setLatLngs(pathArray);
            }
        }
    }, e => {}, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
}

function updateUI() {
    document.getElementById('dist').textContent = totalDistance.toFixed(2);
    
    // 1. 평균 페이스 업데이트
    if (totalDistance > 0.002) {
        const avgP = (elapsedSeconds / 60) / totalDistance;
        document.getElementById('avgPace').textContent = formatPace(avgP);
    }

    // 2. 현재 페이스 업데이트 (10m 마다 계산)
    const distDiff = totalDistance - lastTenMeterDist;
    if (distDiff >= 0.01) { // 10미터 이동 시
        const now = Date.now();
        const timeDiffMin = (now - lastTenMeterTime) / 1000 / 60;
        const currentPaceRaw = timeDiffMin / distDiff;
        
        // 현실적인 페이스(3~15분) 범위 안에서만 업데이트 (노이즈 방지)
        if (currentPaceRaw > 2.5 && currentPaceRaw < 18) {
            document.getElementById('curPace').textContent = formatPace(currentPaceRaw);
        }
        
        lastTenMeterDist = totalDistance;
        lastTenMeterTime = now;
    }

    // 3. 칼로리 (70kg 기준 METs 9.8)
    const kcal = (9.8 * 3.5 * 70 / 200) * (elapsedSeconds / 60);
    document.getElementById('kcal').textContent = Math.round(kcal);
}

function formatPace(paceFloat) {
    const min = Math.floor(paceFloat);
    const sec = String(Math.floor((paceFloat - min) * 60)).padStart(2, '0');
    return `${min}'${sec}"`;
}

function handleMainBtn() {
    if (!isRunning) {
        isRunning = true; isPaused = false;
        requestWakeLock();
        document.getElementById('no-sleep-video').play().catch(()=>{});
        timerInterval = setInterval(() => { if(isRunning && !isPaused) { elapsedSeconds++; updateTimerUI(); } }, 1000);
        document.getElementById('main-btn').textContent = 'STOP';
        document.getElementById('main-btn').style.background = '#444';
        speak("런닝 시작");
    } else {
        isPaused = true;
        document.getElementById('main-btn').style.display = 'none';
        document.getElementById('after-stop').style.display = 'flex';
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }
}

function updateTimerUI() {
    const m = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(elapsedSeconds % 60).padStart(2, '0');
    document.getElementById('time').textContent = `00:${m}:${s}`;
}

function resumeTracking() {
    isPaused = false; requestWakeLock();
    document.getElementById('after-stop').style.display = 'none';
    document.getElementById('main-btn').style.display = 'block';
    speak("운동 재개");
}

function saveData() {
    const record = {
        id: Date.now(), date: new Date().toLocaleString('ko-KR'),
        dist: totalDistance.toFixed(2), time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent, kcal: document.getElementById('kcal').textContent,
        cadence: document.getElementById('cadence').textContent, gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent, route: pathArray, splits: splits
    };
    let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    history.unshift(record);
    localStorage.setItem('OppaRun_Data', JSON.stringify(history));
    location.reload();
}

function switchTab(t) {
    document.getElementById('page-home').style.display = t === 'home' ? 'flex' : 'none';
    document.getElementById('page-history').style.display = t === 'history' ? 'flex' : 'none';
    document.getElementById('tab-home').classList.toggle('active', t === 'home');
    document.getElementById('tab-history').classList.toggle('active', t === 'history');
    if (t === 'history') loadHistory();
}

function loadHistory() {
    const history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
    document.getElementById('history-container').innerHTML = history.map(h => `
        <div class="history-card" onclick="showDetail(${h.id})">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span style="font-size:12px; color:var(--primary); font-weight:800;">${h.date}</span>
                <span style="color:var(--danger); font-size:16px;" onclick="event.stopPropagation(); deleteRecord(${h.id})">✕</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div><div class="label">DISTANCE</div><div style="font-size:24px; font-weight:900;">${h.dist} KM</div></div>
                <div><div class="label">AVG PACE</div><div style="font-size:24px; font-weight:900;">${h.pace}</div></div>
            </div>
        </div>`).join('');
}

function deleteRecord(id) {
    if(confirm("기록을 삭제할까요?")) {
        let history = JSON.parse(localStorage.getItem('OppaRun_Data') || "[]");
        localStorage.setItem('OppaRun_Data', JSON.stringify(history.filter(h => h.id !== id)));
        loadHistory();
    }
}

function showDetail(id) {
    const record = JSON.parse(localStorage.getItem('OppaRun_Data')).find(h => h.id === id);
    document.getElementById('map-modal').style.display = 'flex';
    setTimeout(() => {
        let hMap = L.map('history-map', {zoomControl: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(hMap);
        if(record.route && record.route.length > 0) {
            let pl = L.polyline(record.route, {color: '#00ff88', weight: 5}).addTo(hMap);
            hMap.fitBounds(pl.getBounds(), {padding: [30, 30]});
        }
        document.getElementById('split-info').innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0; color:var(--primary);">RUN DETAILS</h3>
                <span style="color:#888; font-size:12px;">${record.time}</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">DISTANCE</div><div class="value">${record.dist}km</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">PACE</div><div class="value">${record.pace}</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">CALORIES</div><div class="value">${record.kcal}kcal</div></div>
                <div style="background:#1a1a1a; padding:15px; border-radius:12px;"><div class="label">CADENCE</div><div class="value">${record.cadence}</div></div>
            </div>
            <h3 style="margin:25px 0 10px 0; font-size:14px; color:#888; border-bottom:1px solid #333; padding-bottom:5px;">SPLITS (1KM)</h3>
            ` + (record.splits && record.splits.length > 0 ? record.splits.map(s => `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #222;"><span>${s.km} KM</span><b style="color:var(--primary)">${s.pace}</b></div>`).join('') : "1km 미만 주행");
    }, 100);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initMaps() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    pathLine = L.polyline([], {color: '#00ff88', weight: 6}).addTo(map);
    marker = L.circleMarker([0, 0], {radius: 8, color: '#000', fillColor: '#00ff88', fillOpacity: 1}).addTo(map);
}

window.onload = () => { initMaps(); startTracking(); };
function closeModal() { document.getElementById('map-modal').style.display = 'none'; }

window.addEventListener('devicemotion', (e) => {
    if (!isRunning || isPaused) return;
    const mag = Math.sqrt(e.accelerationIncludingGravity.x**2 + e.accelerationIncludingGravity.y**2 + e.accelerationIncludingGravity.z**2);
    if (mag > 12.0) {
        const now = Date.now();
        if (now - lastStepTime > 250) {
            stepCount++; lastStepTime = now;
            document.getElementById('cadence').textContent = Math.round((stepCount / (elapsedSeconds || 1)) * 60);
        }
    }
});
</script>
</body>
</html>
