<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.85 (Color Feedback & History Restore)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; 
            --card-bg: #1e1e1e; --text-main: #ffffff; --text-dim: #999999; 
            --danger: #ff4444; --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 18vh; min-height: 140px; border-bottom: 2px solid #222; position: relative; }
        #map { height: 100%; width: 100%; background: #111; }
        
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 6px; background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 6px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; padding: 10px 0; transition: color 0.3s; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 88px; position: relative; margin-bottom: 2px; }
        
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 19px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }
        
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.2); padding: 4px 8px; border-radius: 6px; display: none; z-index: 10; border: 1px solid var(--danger); }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 75px; margin-bottom: 85px; margin-top: auto; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        /* History Styles from 1130.jpg */
        .history-nav { display: flex; gap: 6px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #444; background: #2a2a2a; color: #aaa; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #444; position: relative; }
        .h-date { font-size: 12px; color: var(--text-dim); font-weight: 900; margin-bottom: 8px; }
        .h-main-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
        .h-dist { font-size: 24px; font-weight: 900; color: #fff; }
        .h-time { font-size: 24px; font-weight: 900; color: var(--primary); }
        .h-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; border-top: 1px solid #333; padding-top: 12px; }
        .h-grid-item { display: flex; flex-direction: column; align-items: center; }
        .h-grid-label { font-size: 8px; color: var(--text-dim); font-weight: 900; margin-bottom: 4px; }
        .h-grid-val { font-size: 13px; font-weight: 900; color: #eee; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #000; display: flex; border-top: 1px solid #222; align-items: stretch; padding-bottom: env(safe-area-inset-bottom); z-index: 30000; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 16px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); text-decoration: underline; text-underline-offset: 8px; }

        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay" onclick="ui.toggleDim(false)">TAP TO WAKE</div>
    
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:10px; right:10px; background:#333; border:1px solid #444; color:#999; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="ui.toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <!-- 실시간 색상 변화 적용 구간 -->
            <div id="card-cadence" class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div id="card-gct" class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div id="card-flight" class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button class="sub-btn active" onclick="ui.showSubTab('list')">LIST</button>
            <button class="sub-btn" onclick="ui.showSubTab('total')">TOTAL</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div style="padding:20px; color:var(--text-dim);">준비 중...</div></div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="ui.showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="ui.showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, pathCoords = [];

// [색상 로직 정의] 오빠, 여기서 기준 수치 조정 가능해!
const colorLogic = {
    update: () => {
        const cad = parseInt(document.getElementById('cadence').textContent) || 0;
        const gct = parseInt(document.getElementById('gct').textContent) || 0;
        const flt = parseInt(document.getElementById('flight').textContent) || 0;

        // Cadence: 180+ (녹), 170+ (황), 그외 (적)
        const cadCard = document.getElementById('card-cadence');
        cadCard.style.color = cad >= 180 ? 'var(--primary)' : (cad >= 170 ? 'var(--warning)' : 'var(--danger)');

        // GCT: 200- (녹), 240- (황), 그외 (적)
        const gctCard = document.getElementById('card-gct');
        if(gct > 0) gctCard.style.color = gct <= 200 ? 'var(--primary)' : (gct <= 240 ? 'var(--warning)' : 'var(--danger)');

        // Flight: 35+ (녹), 30+ (황), 그외 (적)
        const fltCard = document.getElementById('card-flight');
        if(flt > 0) fltCard.style.color = flt >= 35 ? 'var(--primary)' : (flt >= 30 ? 'var(--warning)' : 'var(--danger)');
    }
};

const ui = {
    showTab: (tab) => {
        document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
        document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
        document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        if(tab === 'history') ui.updateHistoryList();
        if(tab === 'run' && map) setTimeout(() => map.invalidateSize(), 100);
    },
    showSubTab: (sub) => {
        document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
        document.getElementById('sub-page-' + sub).style.display = 'flex';
    },
    updateHistoryList: () => {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        const listDiv = document.getElementById('history-list');
        if (h.length === 0) { listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">NO RECORDS</div>'; return; }
        
        listDiv.innerHTML = h.map(r => `
            <div class="history-item">
                <div class="h-date">${r.date}</div>
                <div class="h-main-row">
                    <div class="h-dist">${r.dist}KM</div>
                    <div class="h-time">${r.time}</div>
                </div>
                <div class="h-grid">
                    <div class="h-grid-item"><div class="h-grid-label">PACE</div><div class="h-grid-val">${r.pace}</div></div>
                    <div class="h-grid-item"><div class="h-grid-label">CADENCE</div><div class="h-grid-val">${r.cadence}</div></div>
                    <div class="h-grid-item"><div class="h-grid-label">GCT</div><div class="h-grid-val">${r.gct}ms</div></div>
                    <div class="h-grid-item"><div class="h-grid-label">FLIGHT</div><div class="h-grid-val">${r.flight}%</div></div>
                </div>
            </div>`).join('');
    },
    toggleDim: (show) => document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'
};

function formatPace(kmh) {
    if (!kmh || kmh < 0.5) return "--'--\"";
    let s = 3600 / kmh;
    return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`;
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; 
    const speed = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    
    if (isRunning && !isPaused) {
        if (lastPos) {
            let d = map.distance(lastPos, pos) / 1000;
            if (d > 0.002) {
                totalDist += d;
                document.getElementById('dist').textContent = totalDist.toFixed(2);
                lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords);
                document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
            }
        } else lastPos = pos;
        document.getElementById('curPace').textContent = formatPace(speed);
        
        // 정지 시 자동 일시정지 (3초 미만 이동 시)
        if (speed < 1.0 && !isAutoPaused) {
            isAutoPaused = true; document.getElementById('pause-status').style.display = 'block';
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else if (speed >= 1.0 && isAutoPaused) {
            isAutoPaused = false; document.getElementById('pause-status').style.display = 'none';
        }
    }
    map.panTo(pos);
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 13 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        const cad = Math.round((steps/(seconds||1))*60);
        document.getElementById('cadence').textContent = cad;
        // 시뮬레이션용 GCT/Flight (실제 장비 없을 시 가상 수치 산출)
        document.getElementById('gct').textContent = Math.max(180, 260 - (cad/2)).toFixed(0);
        document.getElementById('flight').textContent = Math.min(45, (cad/5)).toFixed(0);
        colorLogic.update(); // 색상 실시간 업데이트 호출
    }
}

function onStart() {
    isRunning = true; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        dist: document.getElementById('dist').textContent,
        time: document.getElementById('time').textContent,
        pace: document.getElementById('avgPace').textContent,
        cadence: document.getElementById('cadence').textContent,
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record);
    localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

window.onload = () => {
    map = L.map('map', {zoomControl: false}).setView([33.7743, -117.9390], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([33.7743, -117.9390], {icon: L.divIcon({className:'loc', html:'<div style="background:#007bff; border:2px solid #fff; border-radius:50%; width:14px; height:14px;"></div>'})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if (navigator.geolocation) navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
};
</script>
</body>
</html>
