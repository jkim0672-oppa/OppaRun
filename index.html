<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jenny Run</title>
    <!-- Kakao Map API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_MAP_API_KEY"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --primary-green: #2ecc71;
            --accent-red: #ff4757;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Layout Structure */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Map Section */
        #map-container {
            flex: 0 0 35%;
            width: 100%;
            position: relative;
            background: #222;
        }

        #map { width: 100%; height: 100%; }

        #gps-status {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            background: rgba(0,0,0,0.6);
            color: #f1c40f;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 0;
            z-index: 10;
        }

        /* Dashboard Section */
        #dashboard {
            flex: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            overflow-y: auto;
        }

        .main-card {
            grid-column: span 3;
            background: var(--card-bg);
            border: 2px solid var(--primary-green);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .sub-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label { color: var(--text-dim); font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        .value { font-size: 20px; font-weight: bold; }
        .unit { font-size: 10px; margin-left: 2px; }

        .pace-value { font-size: 48px; color: var(--primary-green); }

        /* Control Buttons */
        #controls {
            padding: 15px;
            background: var(--bg-color);
        }

        .btn-main {
            width: 100%;
            padding: 20px;
            border-radius: 40px;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-start { background-color: var(--primary-green); }
        .btn-stop { background-color: var(--accent-red); }

        /* Navigation */
        nav {
            display: flex;
            background: #111;
            padding: 15px 0;
            border-top: 1px solid #333;
        }

        nav div {
            flex: 1;
            text-align: center;
            font-weight: bold;
            color: var(--text-dim);
        }

        nav div.active { color: var(--primary-green); }

        /* Settings/History Views - Simplified for Core functionality */
        .view { display: none; height: 100%; padding: 20px; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div id="app">
    <div id="map-container">
        <div id="map"></div>
        <div id="gps-status">GPS INITIALIZING...</div>
    </div>

    <div id="dashboard" class="view active">
        <div class="main-card">
            <div class="label">PACE</div>
            <div class="pace-value" id="cur-pace">--'--"</div>
            <div style="position: absolute; top: 10px; right: 15px; font-size: 10px; color: #444; border: 1px solid #444; padding: 2px 5px; border-radius: 4px;">DIM</div>
        </div>

        <div class="sub-card">
            <div class="label">DIST</div>
            <div class="value"><span id="cur-dist">0.00</span><span class="unit">KM</span></div>
        </div>
        <div class="sub-card">
            <div class="label">TIME</div>
            <div class="value" id="cur-time">00:00</div>
        </div>
        <div class="sub-card">
            <div class="label">AVG</div>
            <div class="value" id="avg-pace">--'--"</div>
        </div>

        <div class="sub-card">
            <div class="label">CADENCE</div>
            <div class="value" id="cur-cad">0</div>
        </div>
        <div class="sub-card">
            <div class="label">GCT</div>
            <div class="value"><span id="cur-gct">--</span><span class="unit">MS</span></div>
        </div>
        <div class="sub-card">
            <div class="label">FLIGHT</div>
            <div class="value"><span id="cur-flight">--</span><span class="unit">%</span></div>
        </div>
    </div>

    <div id="controls">
        <button id="main-btn" class="btn-main btn-start">START</button>
    </div>

    <nav>
        <div class="active">RUN</div>
        <div>HISTORY</div>
    </nav>
</div>

<script>
    // --- Core Logic & Original Settings ---
    let isRunning = false;
    let timer = null;
    let seconds = 0;
    let distance = 0;
    let watchId = null;
    let lastPosition = null;

    // Map Initialization
    const mapContainer = document.getElementById('map');
    const mapOptions = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 3 };
    const map = new kakao.maps.Map(mapContainer, mapOptions);
    let marker = new kakao.maps.Marker({ position: map.getCenter() });
    marker.setMap(map);

    const mainBtn = document.getElementById('main-btn');
    const gpsStatus = document.getElementById('gps-status');

    // Auto-Stop Settings
    const AUTO_STOP_SPEED_THRESHOLD = 0.5; // 0.5 m/s 이하일 때 정지

    function updateDisplay() {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('cur-time').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('cur-dist').innerText = distance.toFixed(2);
    }

    function startRun() {
        isRunning = true;
        mainBtn.innerText = 'STOP';
        mainBtn.className = 'btn-main btn-stop';
        gpsStatus.innerText = 'GPS TRACKING ACTIVE';
        
        timer = setInterval(() => {
            seconds++;
            updateDisplay();
        }, 1000);

        if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speed = position.coords.speed || 0; // m/s
                const newPos = new kakao.maps.LatLng(lat, lon);

                // 지도 업데이트
                map.setCenter(newPos);
                marker.setPosition(newPos);

                // 자동 멈춤 로직 (Original Setting 복구)
                if (speed < AUTO_STOP_SPEED_THRESHOLD && isRunning) {
                    console.log("Auto-pause triggered");
                    // 실제 상용 앱에서는 여기서 일시정지 로직 처리
                }

                if (lastPosition) {
                    // 거리 계산 logic (단순화)
                    distance += 0.001; 
                }
                lastPosition = newPos;
            }, err => console.error(err), { enableHighAccuracy: true });
        }
    }

    function stopRun() {
        isRunning = false;
        clearInterval(timer);
        navigator.geolocation.clearWatch(watchId);
        mainBtn.innerText = 'START';
        mainBtn.className = 'btn-main btn-start';
        gpsStatus.innerText = 'RUN FINISHED';
    }

    mainBtn.addEventListener('click', () => {
        if (!isRunning) startRun();
        else stopRun();
    });

</script>
</body>
</html>
