<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v35 Integration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --card: #121212; --text: #fff; --dim: #999; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* [1000043817.jpg] 상단 레이아웃 반영 */
        #map-area { flex-shrink: 0; border-bottom: 2px solid #222; }
        #map { height: 15vh; min-height: 120px; width: 100%; }
        .status-bar { text-align: center; color: #ffcc00; font-size: 11px; padding: 10px; background: #0a0a0a; font-weight: 900; }
        
        /* 대시보드 그리드 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #1f1f1f; padding: 15px 0; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 100px; position: relative; margin-bottom: 5px; }
        .label { font-size: 10px; color: var(--dim); font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 900; }
        .value-large { font-size: 52px; color: var(--primary); font-weight: 900; line-height: 1; }

        /* 하단 메인 탭바 (이게 살아있어야 해!) */
        .tab-bar { height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: var(--primary); }

        /* 화면 영역 */
        .view { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; }
        .view.active { display: flex; }

        /* [1000043813~15.jpg] 히스토리 서브 메뉴 */
        .sub-nav { display: flex; gap: 6px; padding: 12px; background: #000; position: sticky; top: 0; z-index: 10; }
        .sub-btn { flex: 1; background: #1a1a1a; border: none; color: #777; padding: 12px 0; border-radius: 8px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; }
        .history-content { display: none; padding: 20px; }
        .history-content.active { display: block; }

        /* 실행 버튼 */
        .controls { padding: 0 20px; margin-bottom: 20px; }
        .btn-action { width: 100%; height: 70px; border-radius: 35px; border: none; font-weight: 900; font-size: 24px; cursor: pointer; background: var(--primary); color: #000; }

        /* INFO 스타일 */
        .info-card { background: #111; padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>
    <!-- [1] RUN VIEW -->
    <div id="view-run" class="view active">
        <div id="map-area">
            <div id="map"></div>
            <div id="status" class="status-bar">GPS INITIALIZING...</div>
        </div>
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px;" onclick="APP.ui.dim()">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><small style="color:var(--primary);margin-left:3px">KM</small></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><small style="font-size:10px;margin-left:2px">MS</small></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><small style="font-size:10px;margin-left:2px">%</small></div></div>
        </div>
        <div class="controls">
            <button id="btn-main" class="btn-action" onclick="APP.control.toggle()">START RUNNING</button>
        </div>
    </div>

    <!-- [2] HISTORY VIEW -->
    <div id="view-history" class="view">
        <div class="sub-nav">
            <button id="s-LIST" class="sub-btn active" onclick="APP.ui.subTab('LIST')">LIST</button>
            <button id="s-TOTAL" class="sub-btn" onclick="APP.ui.subTab('TOTAL')">TOTAL</button>
            <button id="s-INFO" class="sub-btn" onclick="APP.ui.subTab('INFO')">INFO</button>
            <button id="s-SETTINGS" class="sub-btn" onclick="APP.ui.subTab('SETTINGS')">SETTINGS</button>
        </div>
        <div id="c-LIST" class="history-content active"></div>
        <div id="c-TOTAL" class="history-content" style="text-align:center; padding-top:100px; color:#444;">TOTAL DATA READY</div>
        <div id="c-INFO" class="history-content">
            <div class="info-card">
                <p style="font-weight:900; color:var(--primary); font-size:17px; margin-top:0;">오빠, 러닝 메커니즘을 잊지 마!</p>
                <p style="margin:10px 0; color:#ccc; line-height:1.8;">• 케이던스 170-185 목표<br>• 가자미근 탄력을 이용한 롤링<br>• 족저근막 보호를 위한 미드풋 스트라이크</p>
            </div>
        </div>
        <div id="c-SETTINGS" class="history-content">
            <button style="background:#111; color:#ff4444; width:100%; padding:20px; border:1px solid #333; border-radius:12px; font-weight:900;" onclick="APP.storage.clear()">CLEAR ALL HISTORY</button>
        </div>
    </div>

    <!-- [3] MAIN TAB BAR -->
    <div class="tab-bar">
        <button id="t-run" class="tab-btn active" onclick="APP.ui.mainTab('run')">RUN</button>
        <button id="t-history" class="tab-btn" onclick="APP.ui.mainTab('history')">HISTORY</button>
    </div>

<script>
const APP = {
    state: { isRunning: false, seconds: 0, timer: null, dist: 0 },
    
    ui: {
        map: null, marker: null,
        init() {
            this.map = L.map('map', {zoomControl:false, attributionControl:false}).setView([33.77, -117.91], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.map);
            this.marker = L.marker([0,0]).addTo(this.map);
        },
        mainTab(type) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + type).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('t-' + type).classList.add('active');
            if(type === 'history') APP.storage.render();
        },
        subTab(name) {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('s-' + name).classList.add('active');
            document.querySelectorAll('.history-content').forEach(c => c.classList.remove('active'));
            document.getElementById('c-' + name).classList.add('active');
        },
        dim() { alert("DIM MODE ON"); }
    },

    control: {
        toggle() {
            const btn = document.getElementById('btn-main');
            if(!APP.state.isRunning) {
                APP.state.isRunning = true;
                btn.textContent = "FINISH"; btn.style.background = "#ff4444"; btn.style.color = "#fff";
                APP.state.timer = setInterval(() => {
                    APP.state.seconds++;
                    document.getElementById('time').textContent = APP.util.formatTime(APP.state.seconds);
                }, 1000);
            } else {
                if(confirm("기록을 저장할까?")) { APP.storage.save(); location.reload(); }
            }
        }
    },

    storage: {
        save() {
            let h = JSON.parse(localStorage.getItem('oppaRunH') || "[]");
            h.unshift({ id: Date.now(), date: new Date().toLocaleString(), dist: APP.state.dist });
            localStorage.setItem('oppaRunH', JSON.stringify(h));
        },
        render() {
            const h = JSON.parse(localStorage.getItem('oppaRunH') || "[]");
            document.getElementById('c-LIST').innerHTML = h.map(i => `
                <div style="background:#1a1a1a; padding:15px; border-radius:10px; margin-bottom:10px; border:1px solid #222;">
                    <div style="font-size:11px; color:var(--primary); font-weight:900;">${i.date}</div>
                    <div style="font-size:22px; font-weight:900; margin-top:5px;">${i.dist.toFixed(2)} KM</div>
                </div>
            `).join('') || '<div style="text-align:center; padding:50px; color:#444;">NO RECORDS</div>';
        },
        clear() { if(confirm("다 지울까?")) { localStorage.removeItem('oppaRunH'); this.render(); } }
    },

    util: {
        formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
    }
};

window.onload = () => { APP.ui.init(); };
</script>
</body>
</html>
