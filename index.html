<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v27.5 (Text UI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00; --accent: #007bff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui, "Malgun Gothic", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { text-align: center; color: var(--warning); font-size: 11px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 85px; position: relative; }
        .auto-pause-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 2px 6px; border-radius: 4px; display: none; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; }
        .value { font-size: 18px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; line-height: 1; }

        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 70px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        /* History Nav - 아이콘 대신 '설정' 글자로 변경 */
        .history-nav { display: flex; gap: 6px; padding: 10px 12px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 12px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        
        .history-list { padding: 0 12px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid #1f1f1f; margin-top: 10px; }
        .h-main { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .h-dist { font-size: 18px; font-weight: 700; color: #ffffff; }
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #222; padding-top: 8px; gap: 4px; }
        .h-det-val { font-size: 12px; font-weight: 600; color: #ddd; }

        .info-card { background: var(--card-bg); padding: 15px; border-radius: 15px; margin: 10px; border: 1px solid #222; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 9999; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }

        /* Settings UI */
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; }
        .setting-label { font-size: 13px; font-weight: 700; color: #eee; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
        .vol-slider { width: 100%; accent-color: var(--primary); height: 4px; margin-top: 5px; cursor: pointer; }
        .opt-select { background: #1a1a1a; color: white; border: 1px solid #333; padding: 5px 10px; border-radius: 5px; font-size: 12px; outline: none; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS 연결 중...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">일시 정지됨</div>
                <div class="label" style="color:var(--primary)">현재 페이스</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label">거리</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">시간</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">평균 페이스</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">케이던스</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">접지시간(GCT)</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">체공시간</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">러닝 시작</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">정지</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">재개</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">종료</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">기록</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">누적</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">정보</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">설정</button>
        </div>

        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list" class="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats" class="history-list"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="info-card">
                <h2 style="color:var(--primary); margin:0 0 10px 0;">오빠런 프로</h2>
                <p style="font-size:14px; color:#aaa;">뮤지션 기타리스트 오빠를 위한<br>맞춤형 러닝 가이드</p>
            </div>
        </div>

        <div id="sub-page-settings" class="sub-page">
            <div class="info-card" style="padding:15px;">
                <h3 style="color:var(--primary); margin:0 0 15px 0; font-size:18px;">앱 설정</h3>
                <div class="setting-row"><span class="setting-label">언어</span><select class="opt-select"><option selected>한국어</option><option>English</option></select></div>
                <div class="setting-row">
                    <span class="setting-label">메트로놈 사용</span>
                    <label class="switch"><input type="checkbox" id="metro-switch" onchange="toggleMetroUI()"><span class="slider"></span></label>
                </div>
                <div style="background:#1a1a1a; padding:12px; border-radius:10px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                        <span class="setting-label">비트 속도 (BPM)</span>
                        <span id="bpm-val" style="color:var(--primary); font-weight:bold; font-size:14px;">175</span>
                    </div>
                    <input type="range" id="metro-bpm" class="vol-slider" min="60" max="240" value="175" oninput="updateBPM(this.value)">
                    <div style="display:flex; justify-content:space-between; margin-top:12px; margin-bottom:2px;">
                        <span class="setting-label">알림 볼륨</span>
                        <span id="vol-val" style="color:var(--primary); font-size:12px;">80%</span>
                    </div>
                    <input type="range" id="metro-vol" class="vol-slider" min="0" max="100" value="80" oninput="document.getElementById('vol-val').textContent=this.value+'%'">
                </div>
                <p style="font-size:10px; color:#444; text-align:center; margin-top:10px;">버전 27.5 (Text UI 기반)</p>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">러닝</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">히스토리</button>
    </div> 

<script>
let map, marker, polyline, timer;
let pathCoords = [], isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

// --- Metronome Engine ---
let audioCtx = null, metroTimer = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playTick() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const vol = document.getElementById('metro-vol').value / 100;
    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}
function startMetronome() { stopMetronome(); if (!document.getElementById('metro-switch').checked) return; initAudio(); const bpm = document.getElementById('metro-bpm').value; metroTimer = setInterval(playTick, 60000 / bpm); }
function stopMetronome() { if (metroTimer) clearInterval(metroTimer); }
function toggleMetroUI() { initAudio(); if (document.getElementById('metro-switch').checked) { if(isRunning && !isPaused && !isAutoPaused) startMetronome(); } else { stopMetronome(); } }
function updateBPM(v) { document.getElementById('bpm-val').textContent = v; if(isRunning && !isPaused && !isAutoPaused) startMetronome(); }

// --- Map & Logic ---
function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) { navigator.geolocation.watchPosition(updatePosition, (err) => { document.getElementById('status').textContent = "GPS 오류: " + err.message; }, {enableHighAccuracy: true}); }
    window.addEventListener('devicemotion', handleMotion);
} 
function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity; if (!acc || acc.x === null) return; 
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2); let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) { 
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 0.5 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2.0 ? Math.floor(5 + (currentSpeedKmh * 2.1)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        updateDynamicsColors(gct, flt);
    }
}
function updateDynamicsColors(gct, flt) {
    const gDisplay = document.getElementById('gct'), fDisplay = document.getElementById('flight');
    gDisplay.textContent = gct || "--"; fDisplay.textContent = flt || "--";
    let color = (currentSpeedKmh > 4.5) ? (gct >= 400 ? "#ff4444" : (gct >= 320 ? "#ffcc00" : "#00ff88")) : "#ffcc00";
    gDisplay.style.color = color; fDisplay.style.color = (flt > 15) ? "#00ff88" : "#ffcc00";
}
function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude]; currentSpeedKmh = (p.coords.speed || 0) * 3.6; marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { isAutoPaused = true; stopMetronome(); document.getElementById('pause-status').style.display = 'block'; } 
        else if (currentSpeedKmh >= 0.8 && isAutoPaused) { isAutoPaused = false; startMetronome(); document.getElementById('pause-status').style.display = 'none'; }
        if (!isAutoPaused && p.coords.accuracy < 45) {
            if (lastPos) {
                let d = (function(p1,p2){ const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180; const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); })(lastPos, pos);
                if (d > 0.0015) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
} 
function onStart() { initAudio(); isRunning = true; isPaused = false; isAutoPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = []; gctSum = 0; flightSum = 0; dataCount = 0; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; startMetronome(); timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000); } 
function onStop() { isPaused = true; stopMetronome(); document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; startMetronome(); document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; } 
function onFinish() {
    const avgGct = dataCount > 0 ? Math.round(gctSum / dataCount) : 0; const avgFlt = dataCount > 0 ? Math.round(flightSum / dataCount) : 0; const avgCad = Math.round((steps/(seconds||1))*60); const now = new Date();
    const record = { id: Date.now(), date: now.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, cadence: avgCad, kcal: Math.round(totalDist * 65), gctflt: `${avgGct}/${avgFlt}%` };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h)); stopMetronome(); location.reload();
}
function showTab(tab) { document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none'); document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none'); document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none'); document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : ''); document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : ''); if(tab === 'run') setTimeout(() => map.invalidateSize(), 100); else showSubTab('list'); }
function showSubTab(sub) { document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active')); document.getElementById('sub-tab-' + sub).classList.add('active'); document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); document.getElementById('sub-page-' + sub).style.display = 'flex'; if (sub === 'list') updateHistoryStats(); if (sub === 'total') updateTotalStats(); }
function updateHistoryStats() { const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><div class="h-main"><span class="h-dist">${r.dist}KM</span></div><div class="h-details"><div class="h-det-val">${r.pace}</div><div class="h-det-val">CAD:${r.cadence}</div><div class="h-det-val">${r.kcal}kcal</div><div class="h-det-val">GCT:${r.gctflt}</div></div></div>`).join(''); }
function updateTotalStats() { const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]"); let tDist = 0, tSec = 0, tKcal = 0; h.forEach(r => { tDist += parseFloat(r.dist || 0); let k = parseInt(r.kcal); tKcal += isNaN(k) ? 0 : k; let p = r.time.split(':'); tSec += (parseInt(p[0])||0)*60 + (parseInt(p[1])||0); }); document.getElementById('total-stats').innerHTML = `<div class="info-card" style="border:2px solid var(--primary);"><div class="label">전체 누적 기록</div><div style="font-size:32px; font-weight:900; color:var(--primary);">${tDist.toFixed(2)} KM</div><div class="h-details"><div class="h-det-val">${Math.floor(tSec/60)}분</div><div class="h-det-val">${tKcal} kcal</div><div class="h-det-val">${h.length}회 러닝</div></div></div>`; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
