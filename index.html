<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team OppaRun</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* 화면 잘림 방지 및 모바일 최적화 스타일 */
        :root { --vh: 1% ; }
        body, html { 
            margin: 0; padding: 0; 
            height: 100vh; height: calc(var(--vh, 1vh) * 100);
            background: #000; color: #fff; font-family: sans-serif;
            overflow: hidden;
        }
        .container { display: flex; flex-direction: column; height: 100%; }
        #map { flex: 1; width: 100%; background: #222; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .stat-box { background: #111; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; }
        .pace-main { border: 2px solid #00ff88; margin: 0 15px; padding: 20px; border-radius: 15px; text-align: center; }
        .btn-start { background: #ff4444; color: white; border: none; padding: 20px; border-radius: 50%; width: 80px; height: 80px; font-weight: bold; cursor: pointer; }
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; background: #000; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div id="gps-status" style="background:rgba(0,0,0,0.8); color:#ffcc00; text-align:center; font-size:12px; padding:3px;">GPS 연결 중...</div>
        
        <div class="stats-grid">
            <div class="stat-box"><div>DISTANCE</div><div id="distance" style="font-size:24px; font-weight:bold; color:#00ff88;">0.00</div><div style="font-size:12px;">KM</div></div>
            <div class="stat-box"><div>TIME</div><div id="duration" style="font-size:24px; font-weight:bold;">00:00:00</div></div>
        </div>

        <div class="pace-main">
            <div style="font-size:12px; color:#00ff88; margin-bottom:5px;">CURRENT PACE (5s Avg)</div>
            <div id="currentPace" style="font-size:40px; font-weight:bold; letter-spacing:2px;">--'--"</div>
        </div>

        <div style="text-align:center; padding:20px;">
            <button id="startBtn" class="btn-start">START</button>
        </div>

        <div class="nav-bar">
            <span style="color:#00ff88; font-weight:bold;">RUNNING</span>
            <span style="color:#666;">HISTORY</span>
        </div>
    </div>

    <script>
        // 1. 모바일 높이 브라우저 최적화
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);

        let lastPaceUpdateTime = 0;
        const PACE_INTERVAL = 5000; // 5초 주기
        let isRunning = false;

        function updatePace(speed) {
            const now = Date.now();
            // 5초마다 한 번씩만 화면 업데이트
            if (now - lastPaceUpdateTime >= PACE_INTERVAL) {
                if (speed > 0.5) { // 시속 1.8km 이상일 때만 계산
                    const paceMinPerKm = 16.6667 / speed;
                    const mins = Math.floor(paceMinPerKm);
                    const secs = Math.round((paceMinPerKm - mins) * 60);
                    document.getElementById('currentPace').innerText = 
                        `${mins.toString().padStart(2,'0')}'${secs.toString().padStart(2,'0')}"`;
                } else {
                    document.getElementById('currentPace').innerText = `--'--"`;
                }
                lastPaceUpdateTime = now;
            }
        }

        // GPS 위치 획득 시 실행되는 함수
        function onLocationFound(position) {
            const acc = Math.round(position.coords.accuracy);
            document.getElementById('gps-status').innerText = `GPS Receiving (Acc: ±${acc}m)`;
            
            if (isRunning) {
                updatePace(position.coords.speed || 0);
                // 여기에 거리 계산 및 지도 경로 그리기 로직 포함 예정
            }
        }

        document.getElementById('startBtn').onclick = function() {
            isRunning = !isRunning;
            this.innerText = isRunning ? "STOP" : "START";
            this.style.background = isRunning ? "#444" : "#ff4444";
        };

        navigator.geolocation.watchPosition(onLocationFound, null, {
            enableHighAccuracy: true,
            maximumAge: 0
        });
    </script>
</body>
</html>
