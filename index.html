<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v29.0 (Multilingual Edition)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000; --card-bg: #121212; 
            --text-main: #fff; --text-dim: #999; --danger: #ff4444; 
            --accent: #007bff; --metro-color: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Map Area */
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 100px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; }
        .status-bar { text-align: center; color: var(--metro-color); font-size: 10px; padding: 4px; background: #0a0a0a; font-weight: 800; border-bottom: 1px solid #222; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 10px 0; }
        .card-main { grid-column: span 3; border: 1.5px solid var(--primary); height: 80px; position: relative; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 40px; color: var(--primary); font-weight: 900; }

        /* Metronome Floating Bar */
        .metro-bar { background: #1a1a1a; margin: 0 10px 10px; padding: 10px 15px; border-radius: 15px; border: 1px solid var(--metro-color); display: flex; align-items: center; justify-content: space-between; }
        .metro-controls { display: flex; align-items: center; gap: 10px; flex: 1; margin-left: 15px; }
        input[type=range] { flex: 1; accent-color: var(--metro-color); }

        /* Controls */
        .controls { padding: 0 15px; margin-bottom: 85px; }
        .btn-act { width: 100%; height: 50px; border-radius: 25px; border: none; font-weight: 900; font-size: 16px; }

        /* History Views */
        .history-nav { display: flex; gap: 8px; padding: 10px; background: #000; }
        .sub-btn { flex: 1; padding: 10px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 10px; font-size: 11px; font-weight: 900; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #1f1f1f; }

        /* Settings Style */
        .setting-box { margin-top: 15px; background: #1a1a1a; padding: 12px; border-radius: 10px; border: 1px solid #333; }
        .lang-btn { background: #333; border: none; color: #fff; padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .lang-btn.active { background: var(--primary); color: #000; }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 12px; font-weight: 800; }
        .tab-btn.active { color: var(--primary); }
        .my-location { background: var(--accent); border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
    </style>
</head>
<body> 
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar" data-i18n="ready">READY TO RUN</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div class="label" style="color:var(--primary)" data-i18n="curPace">CURRENT PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
            </div>
            <div class="card"><div class="label" data-i18n="dist">DIST</div><div class="value"><span id="dist">0.00</span><small style="font-size:10px">KM</small></div></div>
            <div class="card"><div class="label" data-i18n="time">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label" data-i18n="avgPace">AVG PACE</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label" data-i18n="cadence">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label" data-i18n="gct">GCT</div><div class="value"><span id="gct">--</span><small style="font-size:10px">MS</small></div></div>
            <div class="card"><div class="label" data-i18n="flight">FLIGHT</div><div class="value"><span id="flight">--</span><small style="font-size:10px">%</small></div></div>
        </div>

        <div class="metro-bar">
            <div style="text-align:center;" onclick="toggleMetronome()">
                <div id="metro-icon" style="font-size:20px; color:var(--metro-color)">🔔</div>
                <div id="btn-metro-text" style="font-size:9px; font-weight:900; color:var(--metro-color)" data-i18n="metroOff">METRO OFF</div>
            </div>
            <div class="metro-controls">
                <input type="range" id="bpm-range" min="150" max="190" value="175" oninput="updateBPM(this.value)">
                <span id="bpm-val" style="font-size:18px; font-weight:900; color:var(--metro-color); width:40px; text-align:right;">175</span>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()" data-i18n="start">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()" data-i18n="stop">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()" data-i18n="resume">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()" data-i18n="finish">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')" data-i18n="tabList">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')" data-i18n="tabTotal">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')" data-i18n="tabInfo">INFO</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="history-item">
                <h3 style="color:var(--primary)">OppaRun Pro v29.0</h3>
                <p style="font-size:12px; color:#aaa;" data-i18n="appDesc">Musician & Runner's Custom Dynamics App</p>
                
                <div class="setting-box">
                    <div class="label" style="color:var(--primary); margin-bottom:10px;" data-i18n="langSetting">LANGUAGE SETTING</div>
                    <div style="display: flex; gap: 10px;">
                        <button id="lang-ko" class="lang-btn active" onclick="changeLang('ko')">한국어</button>
                        <button id="lang-en" class="lang-btn" onclick="changeLang('en')">English</button>
                    </div>
                </div>
            </div>
        </div>
    </div> 

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')" data-i18n="tabRun">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')" data-i18n="tabHistory">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, audioCtx, metroTimer;
let pathCoords = [], isRunning = false, isPaused = false, seconds = 0, totalDist = 0, lastPos = null;
let bpm = 175, isMetroOn = false, nextClickTime = 0, steps = 0, lastStepTime = 0;
let gctSum = 0, flightSum = 0, dataCount = 0, currentSpeedKmh = 0;

// Language Data
const i18n = {
    ko: {
        ready: "달릴 준비 완료", curPace: "현재 페이스", dist: "거리", time: "시간", avgPace: "평균 페이스",
        cadence: "케이던스", gct: "지면접촉", flight: "체공시간", metroOff: "메트로놈 OFF", metroOn: "메트로놈 ON",
        start: "러닝 시작", stop: "일시 정지", resume: "다시 시작", finish: "종료 및 저장",
        tabList: "리스트", tabTotal: "통계", tabInfo: "정보", appDesc: "뮤지션 오빠를 위한 커스텀 다이나믹스 앱",
        langSetting: "언어 설정", tabRun: "러닝", tabHistory: "기록"
    },
    en: {
        ready: "READY TO RUN", curPace: "CURRENT PACE", dist: "DIST", time: "TIME", avgPace: "AVG PACE",
        cadence: "CADENCE", gct: "GCT", flight: "FLIGHT", metroOff: "METRO OFF", metroOn: "METRO ON",
        start: "START RUNNING", stop: "STOP", resume: "RESUME", finish: "FINISH",
        tabList: "LIST", tabTotal: "TOTAL", tabInfo: "INFO", appDesc: "Musician & Runner's Custom Dynamics App",
        langSetting: "LANGUAGE SETTING", tabRun: "RUN", tabHistory: "HISTORY"
    }
};
let currentLang = 'ko';

function changeLang(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[lang][key];
    });
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('lang-' + lang).classList.add('active');
    localStorage.setItem('oppaRunLang', lang);
}

function initMap() {
    map = L.map('map', {zoomControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    navigator.geolocation.watchPosition(updatePosition, null, {enableHighAccuracy: true});
    window.addEventListener('devicemotion', handleMotion);
    
    // 로컬 스토리지에서 언어 불러오기
    const savedLang = localStorage.getItem('oppaRunLang') || 'ko';
    changeLang(savedLang);
}

function updateBPM(v) { bpm = v; document.getElementById('bpm-val').textContent = v; }

function toggleMetronome() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isMetroOn = !isMetroOn;
    const btnText = document.getElementById('btn-metro-text');
    const icon = document.getElementById('metro-icon');
    if (isMetroOn) {
        btnText.textContent = i18n[currentLang].metroOn; icon.textContent = "🔊";
        nextClickTime = audioCtx.currentTime; scheduler();
    } else {
        btnText.textContent = i18n[currentLang].metroOff; icon.textContent = "🔔";
        clearTimeout(metroTimer);
    }
}

function scheduler() {
    while (nextClickTime < audioCtx.currentTime + 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(nextClickTime); osc.stop(nextClickTime + 0.1);
        nextClickTime += 60.0 / bpm;
    }
    metroTimer = setTimeout(scheduler, 25);
}

function handleMotion(e) {
    if (!isRunning || isPaused) return;
    let acc = e.accelerationIncludingGravity;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        let gct = currentSpeedKmh > 1 ? Math.floor(450 - (currentSpeedKmh * 10)) : 0;
        let flt = currentSpeedKmh > 2 ? Math.floor(5 + (currentSpeedKmh * 2)) : 0;
        if(gct > 0) { gctSum += gct; flightSum += flt; dataCount++; }
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = gct || "--";
        document.getElementById('flight').textContent = flt || "--";
    }
}

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused && p.coords.accuracy < 40) {
        if (lastPos) {
            let d = L.latLng(lastPos).distanceTo(L.latLng(pos)) / 1000;
            if (d > 0.002) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
        } else { lastPos = pos; }
        document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
        if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
    } else { map.panTo(pos); }
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}

function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }
function onFinish() {
    const now = new Date();
    const record = { date: now.toLocaleDateString(), dist: totalDist.toFixed(2), time: document.getElementById('time').textContent, pace: document.getElementById('avgPace').textContent, kcal: Math.round(totalDist*65) };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.getElementById('tab-run').className = 'tab-btn' + (tab === 'run' ? ' active' : '');
    document.getElementById('tab-history').className = 'tab-btn' + (tab === 'history' ? ' active' : '');
    if(tab === 'run') setTimeout(() => map.invalidateSize(), 100);
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'total') {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        let d = 0; h.forEach(r => d += parseFloat(r.dist));
        document.getElementById('total-stats').innerHTML = `<div class="history-item"><h3 data-i18n="tabTotal">${i18n[currentLang].tabTotal}</h3><h1 style="color:var(--primary)">${d.toFixed(2)} KM</h1><p>RUNS: ${h.length}</p></div>`;
    } else if(sub === 'list') {
        const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
        document.getElementById('history-list').innerHTML = h.map(r => `<div class="history-item"><b>${r.date}</b><br>${r.dist}KM | ${r.time} | ${r.pace}</div>`).join('');
    }
}

function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; }
window.onload = initMap;
</script>
</body>
</html>
