<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OppaRun Pro - v28.25</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --primary: #00ff88; --bg: #000000; --card-bg: #121212; 
            --text-main: #ffffff; --text-dim: #999999; --danger: #ff4444; 
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text-main); 
            font-family: -apple-system, system-ui; height: 100vh; height: 100svh; 
            display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
        }
        
        #map-area { flex-shrink: 0; width: 100%; }
        #map-container { height: 15vh; min-height: 110px; border-bottom: 2px solid #222; }
        #map { height: 100%; width: 100%; background: #222; }
        .status-bar { 
            text-align: center; color: var(--warning); font-size: 11px; padding: 8px; 
            background: #0a0a0a; font-weight: 900; border-bottom: 1px solid #222;
            letter-spacing: 0.5px;
        }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #1f1f1f; padding: 12px 0; }
        .card-main { grid-column: span 3; border: 2.5px solid var(--primary); height: 85px; position: relative; margin-bottom: 2px; }
        .label { font-size: 9px; color: var(--text-dim); font-weight: 900; margin-bottom: 3px; text-transform: uppercase; }
        .value { font-size: 20px; font-weight: 900; }
        .value-large { font-size: 42px; color: var(--primary); font-weight: 900; line-height: 1; }
        .auto-pause-label { position: absolute; top: 10px; left: 10px; font-size: 10px; color: var(--danger); font-weight: 900; background: rgba(255,68,68,0.1); padding: 4px 8px; border-radius: 6px; display: none; }
        
        .controls { padding: 0 15px; display: flex; justify-content: center; align-items: center; height: 80px; margin-bottom: 80px; }
        .btn-act { width: 100%; height: 60px; border-radius: 30px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; }
        
        .history-nav { display: flex; gap: 4px; padding: 10px 8px; background: #000; border-bottom: 1px solid #111; }
        .sub-btn { flex: 1; padding: 12px 0; border: 1px solid #333; background: #1a1a1a; color: #777; border-radius: 8px; font-size: 11px; font-weight: 900; text-align: center; }
        .sub-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .sub-page { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .history-item { background: var(--card-bg); border-radius: 15px; padding: 15px; margin: 10px 12px; border: 1px solid #1f1f1f; }
        .h-date { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
        .h-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .h-dist-time { font-size: 19px; font-weight: 900; color: #fff; }
        .text-route-link { color: var(--primary); font-size: 11px; font-weight: 800; cursor: pointer; }
        
        .h-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px; }
        .h-det-box { display: flex; flex-direction: column; }
        .h-det-label { font-size: 8px; color: #555; font-weight: 900; }
        .h-det-val { font-size: 12px; font-weight: 900; color: #ccc; }

        .total-summary { padding: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .total-card { background: var(--card-bg); border: 1px solid #1f1f1f; border-radius: 15px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .total-val { font-size: 20px; font-weight: 900; color: var(--primary); margin-top: 6px; white-space: nowrap; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: #000; display: flex; border-top: 1px solid #222; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 999; }
        .tab-btn { flex: 1; background: none; border: none; color: #444; font-size: 13px; font-weight: 900; }
        .tab-btn.active { color: var(--primary); }
        
        .my-location { background: #007bff; border: 2px solid #fff; border-radius: 50%; width: 12px; height: 12px; }
        #dimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; display: none; justify-content: center; align-items: center; color: #444; font-weight: 900; }
        
        .placeholder-content { padding: 40px 20px; text-align: center; color: #555; font-size: 14px; font-weight: 800; }
    </style>
</head>
<body> 
    <div id="dimmer-overlay">TAP TO WAKE</div>
    <div id="map-area">
        <div id="map-container"><div id="map"></div></div>
        <div id="status" class="status-bar">GPS INITIALIZING...</div>
    </div> 

    <div id="run-view" class="main-content">
        <div class="dashboard">
            <div class="card card-main">
                <div id="pause-status" class="auto-pause-label">AUTO PAUSED</div>
                <div class="label" style="color:var(--primary)">PACE</div>
                <div id="curPace" class="value-large">--'--"</div>
                <button style="position:absolute; top:12px; right:12px; background:#111; border:1px solid #333; color:#555; font-size:9px; padding:5px 8px; border-radius:5px; font-weight:900;" onclick="toggleDim(true)">DIM</button>
            </div>
            <div class="card"><div class="label">DIST</div><div class="value"><span id="dist">0.00</span><span style="font-size:10px; color:var(--primary)"> KM</span></div></div>
            <div class="card"><div class="label">TIME</div><div id="time" class="value">00:00</div></div>
            <div class="card"><div class="label">AVG</div><div id="avgPace" class="value">--'--"</div></div>
            <div class="card"><div class="label">CADENCE</div><div id="cadence" class="value">0</div></div>
            <div class="card"><div class="label">GCT</div><div class="value"><span id="gct">--</span><span style="font-size:10px;"> MS</span></div></div>
            <div class="card"><div class="label">FLIGHT</div><div class="value"><span id="flight">--</span><span style="font-size:10px;"> %</span></div></div>
        </div>
        <div class="controls">
            <button id="btn-start" class="btn-act" style="background:var(--primary); color:#000;" onclick="onStart()">START RUNNING</button>
            <button id="btn-stop" class="btn-act" style="background:var(--danger); color:#fff; display:none;" onclick="onStop()">STOP</button>
            <div id="after-stop" style="display:none; gap:10px; width:100%;">
                <button class="btn-act" style="flex:1; background:var(--primary); color:#000;" onclick="onResume()">RESUME</button>
                <button class="btn-act" style="flex:1; background:var(--danger); color:#fff;" onclick="onFinish()">FINISH</button>
            </div>
        </div>
    </div>

    <div id="history-view" class="main-content" style="display:none;">
        <div class="history-nav">
            <button id="sub-tab-list" class="sub-btn active" onclick="showSubTab('list')">LIST</button>
            <button id="sub-tab-total" class="sub-btn" onclick="showSubTab('total')">TOTAL</button>
            <button id="sub-tab-info" class="sub-btn" onclick="showSubTab('info')">INFO</button>
            <button id="sub-tab-settings" class="sub-btn" onclick="showSubTab('settings')">SETTINGS</button>
        </div>
        <div id="sub-page-list" class="sub-page" style="display: flex;"><div id="history-list"></div></div>
        <div id="sub-page-total" class="sub-page"><div id="total-stats-area"></div></div>
        <div id="sub-page-info" class="sub-page">
            <div class="placeholder-content">
                <div style="color:var(--primary); margin-bottom:10px;">OppaRun Pro v28.25</div>
                <div style="font-size:12px; color:#888; line-height:1.6;">Developed for Musicians & Runners.</div>
            </div>
        </div>
        <div id="sub-page-settings" class="sub-page">
            <div class="placeholder-content">
                <button style="background:#222; color:var(--danger); border:1px solid #444; padding:15px; border-radius:10px; width:80%; font-weight:900;" onclick="clearHistory()">CLEAR ALL HISTORY</button>
            </div>
        </div>
    </div> 

    <div id="route-detail-view" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column;">
        <button class="btn-back-circle" style="position: absolute; top: 20px; left: 20px; z-index: 10001; background: rgba(0,0,0,0.6); border: 1.5px solid var(--primary); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;" onclick="closeRouteDetail()">〈</button>
        <div id="detail-map" style="height: 40vh; width: 100%; border-bottom: 2px solid var(--primary);"></div>
        <div id="detail-data-area"></div>
    </div>

    <div class="tab-bar">
        <button id="tab-run" class="tab-btn active" onclick="showTab('run')">RUN</button>
        <button id="tab-history" class="tab-btn" onclick="showTab('history')">HISTORY</button>
    </div> 

<script>
let map, marker, polyline, timer, isRunning = false, isPaused = false, isAutoPaused = false, seconds = 0;
let totalDist = 0, lastPos = null, steps = 0, lastStepTime = 0, currentSpeedKmh = 0, pathCoords = [];
let detailMap = null;

function toggleDim(show) { document.getElementById('dimmer-overlay').style.display = show ? 'flex' : 'none'; }
document.getElementById('dimmer-overlay').onclick = () => toggleDim(false);

function initMap() {
    map = L.map('map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([0,0], {icon: L.divIcon({className:'my-location', iconSize:[12,12]})}).addTo(map);
    polyline = L.polyline([], {color: '#007bff', weight: 5}).addTo(map);
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(updatePosition, (e) => { document.getElementById('status').textContent = "GPS ERROR: " + e.message; }, {enableHighAccuracy: true, maximumAge: 0, timeout: 5000});
    }
    window.addEventListener('devicemotion', handleMotion);
} 

function updatePosition(p) {
    const pos = [p.coords.latitude, p.coords.longitude];
    currentSpeedKmh = (p.coords.speed || 0) * 3.6;
    marker.setLatLng(pos);
    if (isRunning && !isPaused) {
        if (currentSpeedKmh < 0.8 && !isAutoPaused) { isAutoPaused = true; document.getElementById('pause-status').style.display = 'block'; }
        else if (currentSpeedKmh >= 0.8 && isAutoPaused) { isAutoPaused = false; document.getElementById('pause-status').style.display = 'none'; }
        if (!isAutoPaused && p.coords.accuracy < 50) {
            if (lastPos) {
                let d = (function(p1,p2){
                    const R=6371; const dLat=(p2[0]-p1[0])*Math.PI/180; const dLon=(p2[1]-p1[1])*Math.PI/180;
                    const a=Math.sin(dLat/2)**2 + Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
                    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
                })(lastPos, pos);
                if (d > 0.001) { totalDist += d; document.getElementById('dist').textContent = totalDist.toFixed(2); lastPos = pos; pathCoords.push(pos); polyline.setLatLngs(pathCoords); }
            } else { lastPos = pos; }
            document.getElementById('curPace').textContent = formatPace(currentSpeedKmh);
            if (totalDist > 0.01) document.getElementById('avgPace').textContent = formatPace(totalDist / (seconds / 3600));
        }
    } else { map.panTo(pos); }
}

function handleMotion(e) {
    if (!isRunning || isPaused || isAutoPaused) return;
    let acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;
    let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
    let now = Date.now();
    if (force > 12 && (now - lastStepTime) > 220) {
        steps++; lastStepTime = now;
        let speed = currentSpeedKmh;
        document.getElementById('cadence').textContent = Math.round((steps/(seconds||1))*60);
        document.getElementById('gct').textContent = speed > 0.5 ? Math.floor(450 - (speed * 10)) : "--";
        document.getElementById('flight').textContent = speed > 2.0 ? Math.floor(5 + (speed * 2.1)) : "--";
    }
}

function onStart() {
    isRunning = true; isPaused = false; totalDist = 0; seconds = 0; steps = 0; pathCoords = [];
    document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block';
    timer = setInterval(() => { if(!isPaused && !isAutoPaused) { seconds++; document.getElementById('time').textContent = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`; } }, 1000);
}
function onStop() { isPaused = true; document.getElementById('btn-stop').style.display = 'none'; document.getElementById('after-stop').style.display = 'flex'; }
function onResume() { isPaused = false; document.getElementById('after-stop').style.display = 'none'; document.getElementById('btn-stop').style.display = 'block'; }

function onFinish() {
    const record = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        dist: parseFloat(document.getElementById('dist').textContent) || 0,
        time: document.getElementById('time').textContent,
        rawSeconds: parseInt(seconds) || 0,
        pace: document.getElementById('avgPace').textContent,
        cadence: parseInt(document.getElementById('cadence').textContent) || 0,
        kcal: Math.round(totalDist * 65) || 0,
        gct: document.getElementById('gct').textContent,
        flight: document.getElementById('flight').textContent
    };
    let h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    h.unshift(record); localStorage.setItem('oppaRunHistory', JSON.stringify(h));
    location.reload();
}

function showTab(tab) {
    document.getElementById('run-view').style.display = (tab === 'run' ? 'flex' : 'none');
    document.getElementById('map-area').style.display = (tab === 'run' ? 'block' : 'none');
    document.getElementById('history-view').style.display = (tab === 'history' ? 'flex' : 'none');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if(tab === 'history') updateHistoryList();
}

function showSubTab(sub) {
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sub-tab-' + sub).classList.add('active');
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    document.getElementById('sub-page-' + sub).style.display = 'flex';
    if(sub === 'total') updateTotalStats();
}

function updateHistoryList() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    document.getElementById('history-list').innerHTML = h.map(r => `
        <div class="history-item">
            <div class="h-date">${r.date}</div>
            <div class="h-main"><span class="h-dist-time">${r.dist}KM ${r.time}</span><span class="text-route-link" onclick="viewRecordMap(${r.id})">ROUTE</span></div>
            <div class="h-details">
                <div class="h-det-box"><span class="h-det-label">PACE</span><div class="h-det-val">${r.pace}</div></div>
                <div class="h-det-box"><span class="h-det-label">CAD</span><div class="h-det-val">${r.cadence}</div></div>
                <div class="h-det-box"><span class="h-det-label">KCAL</span><div class="h-det-val">${r.kcal}</div></div>
                <div class="h-det-box"><span class="h-det-label">GCT/FLT</span><div class="h-det-val" style="font-size:9px">${r.gct}/${r.flight}%</div></div>
            </div>
        </div>`).join('');
}

function updateTotalStats() {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    let tDist = 0, tSec = 0, tKcal = 0, tCad = 0;
    h.forEach(r => {
        tDist += Number(r.dist) || 0;
        tSec += Number(r.rawSeconds) || 0;
        tKcal += Number(r.kcal) || 0;
        tCad += Number(r.cadence) || 0;
    });
    const avgCad = h.length > 0 ? Math.round(tCad / h.length) : 0;
    const hrs = Math.floor(tSec / 3600);
    const mins = Math.floor((tSec % 3600) / 60);
    document.getElementById('total-stats-area').innerHTML = `
        <div class="total-summary">
            <div class="total-card"><div class="label">TOTAL DIST</div><div class="total-val">${tDist.toFixed(2)} KM</div></div>
            <div class="total-card"><div class="label">TOTAL TIME</div><div class="total-val">${hrs}h ${mins}m</div></div>
            <div class="total-card"><div class="label">TOTAL KCAL</div><div class="total-val">${tKcal}</div></div>
            <div class="total-card"><div class="label">AVG CADENCE</div><div class="total-val">${avgCad}</div></div>
            <div class="total-card" style="grid-column: span 2;"><div class="label">TOTAL RUNS</div><div class="total-val">${h.length} TIMES</div></div>
        </div>
        <div style="padding: 20px; text-align: center; color: #444; font-size: 11px; font-weight: 900; letter-spacing:1px;">KEEP RUNNING, OPPA!</div>`;
}

function clearHistory() { if(confirm("모든 기록을 삭제할까요?")) { localStorage.removeItem('oppaRunHistory'); updateHistoryList(); updateTotalStats(); } }
function viewRecordMap(id) {
    const h = JSON.parse(localStorage.getItem('oppaRunHistory') || "[]");
    const d = h.find(r => r.id === id);
    if (!d) return;
    document.getElementById('detail-data-area').innerHTML = `
        <div style="padding:25px 20px 0;"><div class="h-date" style="font-size:15px">${d.date}</div><div style="font-size:32px; font-weight:900;">${d.dist} KM / ${d.time}</div></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px;">
            <div class="card"><div class="label">AVG PACE</div><div class="value" style="color:var(--primary)">${d.pace}</div></div>
            <div class="card"><div class="label">AVG CADENCE</div><div class="value" style="color:var(--primary)">${d.cadence}</div></div>
            <div class="card"><div class="label">TOTAL ENERGY</div><div class="value" style="color:var(--primary)">${d.kcal} kcal</div></div>
            <div class="card"><div class="label">GCT / FLIGHT</div><div class="value" style="color:var(--primary); font-size:16px;">${d.gct}ms / ${d.flight}%</div></div>
        </div>`;
    document.getElementById('route-detail-view').style.display = 'flex';
    if (detailMap) detailMap.remove();
    detailMap = L.map('detail-map', {zoomControl: false, attributionControl: false}).setView([37.5665, 126.9780], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(detailMap);
    setTimeout(() => detailMap.invalidateSize(), 300);
}
function closeRouteDetail() { document.getElementById('route-detail-view').style.display = 'none'; }
function formatPace(kmh) { if (!kmh || kmh < 0.5) return "--'--\""; let s = 3600 / kmh; return `${Math.floor(s/60)}'${String(Math.floor(s%60)).padStart(2,'0')}"`; } 
window.onload = initMap;
</script>
</body>
</html>
